# TF2/MannCo Promotional Hat Messages

s.tf2_start = Une Petite T\u00e2che
m.tf2_start = Salut, client fid\u00e8le!\n\
  \n\
  Tu es peut-\u00eatre au courant du fait que je suis maintenant le quatri\u00e8me homme le \
  plus riche dans l'Am\u00e9rique, ayant d\u00e9pass\u00e9 le cinqui\u00e8me en richesse, et \
  ayant assassin\u00e9 le quatri\u00e8me pr\u00e9c\u00e9dant dans un duel d'harpon. Cela est, \
  bien s\u00fbr, la v\u00e9rit\u00e9 absolue (en particulier l'histoire du duel avec les \
  harpons, ce qui \u00e9tait long et sanglant), mais il ne suffise absolument pas. Quatri\u00e8me suffira peut-\u00ea\
  tre pour des HIPPIES que ne reconna\u00eetront pas la victoire si elle appara\u00eetrait et \
  offrirait de tresser leurs queues de cheval, mais ce n'est que le d\u00e9but pour Saxton Hale!\n\
  \n\
  M. Reddy, mon comptable, m'a expliqu\u00e9 que la meilleure fa\u00e7on de faire exploser les \
  revenues de Mann Cie. sera de \u00abd\u00e9velopper des nouveaux march\u00e9s\u00bb. Je te \
  dirais exactement comment cela te concerne, mais pendant qu'il parlait j'ai commenc\u00e9 imm\u00e9diatement \u00e0 faire des pompes pour \u00e9\
  viter de mourir de l'ennui, et j'ai manqu\u00e9 tous les petits d\u00e9tails.\n\
  \n\
  Tout ce que tu as besoin de savoir, cher client, c'est que j'ai besoin d'un homme comp\u00e9tente pour se rendre \u00e0 une ville nomm\u00e9e \u00abHaven\u00bb\
  , bravement rentrer dans un des portes qui s'y trouvent, et ensuite trancher jusqu'au premier \u00abTunnel des Rouages\u00bb\
  . Nous n'avions pas pu en trouver un, donc tu va devoir le faire toi-m\u00eame. Tu seras amplement r\u00e9compens\u00e9, bien s\u00fb\
  r: il n'y a RIEN que je ne ferais pas pour un employ\u00e9 qui risque sa vie et sa sant\u00e9 pendant une t\u00e2che banale n\u00e9c\u00e9ssit\u00e9e par mes caprices \u00e9go\u00efstes.\n\
  \n\
  Il n'est pas urgent de me contacter directement un fois fini, car je serais trop occup\u00e9 \
  en savatant des giraffes pour m'en soucier. Un de mes autres employ\u00e9s en prendra soin. \
  Je te souhaite bonne chance: vous en aurez besoin!\n\
  \n\
  Cordialement,\n\
  \n\
  SAXTON HALE\n\
  Australien\n\
  PDG, Mann Cie.


s.tf2_end = Confirmation de la T\u00e2che
m.tf2_end = Madame,\n\
  Monsieur:\n\
  \n\
  J'ai confirm\u00e9 votre arriv\u00e9e au terminal des Rouages et j'ai obtenu les donn\u00e9es \
  pertinantes concernant le catalogue de notre concurrent. Mann Cie. appr\u00e9cie votre coop\u00e9ration en cette t\u00e2che.\n\
  \n\
  En contrepartie de votre aide, nous vous avons remis un (1) chapellerie replique \u00abSpiral Sallet\u00bb \
  du marque Mann Cie. Aucun remboursement ou \u00e9change n'est offert pour cette r\u00e9\
  compense, et Mann Cie. n'est pas responsable pour les blessures subis en essayant d'utiliser \
  cette r\u00e9compense.\n\
  \n\
  Je vous prie d'agr\u00e9er, Madame ou Monsieur, mes sinceres salutations,\n\
  \n\
  M. Reddy\n\
  Mann Cie.\n\
  \u00abNous vendons des produits et entrons en luttes.\u00bb\n\
  \n\
  L'information contenue dans ce courriel est confidentiel et address\u00e9e seulement au \
  destinataire. L'acc\u00e8s \u00e0 ce courriel par toute autre personne est non autoris\u00e9. Si vous n'\u00ea\
  tes pas un destinataire pr\u00e9vu, vous ne devez lire, utiliser, consid\u00e9rer, manger ni s\u00e9\
  duire l'information contenue dans ce courier. Si le receveur ne conforme pas \u00e0 cette \
  demande, il sera mutil\u00e9 par les ours dans les limites stipul\u00e9es par la loi.


# Sonic CD Promo

s.metal_sonic = Livraison de Metal Sonic Suit
m.metal_sonic = Merci d'avoir achet\u00e9 Sonic CD sur Steam! Nous avons attach\u00e9 votre \
  Metal Sonic Suit et Mask. Ces items sont des costumes que vous pouvez \u00e9quiper sur votre \
  armure et vous permettent de ressembler \u00e0 Metal Sonic quand vous le d\u00e9siriez!\n\
  \n\
  Veuillez r\u00e9marquer que vous pouvez changer votre \u00e9quipement seulement dans les \
  villes ou postes d'arsenal. Si vous \u00eates une nouvelle recrue et vous \u00eates sorti de \
  votre nacelle, voyagez jusqu'au Camp de refuge. L\u00e0, vous pouvez \u00e9quiper votre Metal \
  Sonic Suit et Mask.


# Gloaming Wildwoods

s.wildwoods_start = Mission: For\u00eats farouches
m.wildwoods_start = Ici Agent de Reconnaissance Kora, nous avons d\u00e9tect\u00e9 un module de \
  reconnaissance laiss\u00e9 par Alpha Squad dans quelque part de cette for\u00eat. Votre \
  mission, c'est de le retrouver et de le rapporter. \n\
  \n\
  Cette for\u00eat est le domicile des meutes de b\u00eates sauvages qui ont d\u00e9j\u00e0 tu\u00e9\
  s des escadrons de chevaliers. En raison de cela, les Tech Knights ont plac\u00e9s des Beast \
  Bells parmi les arbres. Frappant ces cloches devrait \u00e9tourdir les b\u00eates qui sont \
  assez proches. \n\
  \n\
  Soyez avertis que les chevaliers de reconnaissance ont rapport\u00e9 la pr\u00e9sence d'une b\u00eate \u00e9pouvantable ressemblant \u00e0 rien que nous avons d\u00e9j\u00e0 vu dans cette for\u00eat. Connu comme le \u00abSnarbolax\u00bb, il ressemble \u00e0 \
  une masse ombreuse de griffes et de crocs et semble \u00eatre absolument immunis\u00e9 contre \
  nos armes. Si vous le voyez, essayez de trouver un moyen de vous \u00e9chapper aussi vite que \
  possible. \n\
  \n\
  Bonne chance!


# Royal Jelly Palace

s.royal_start = Mission: Palais des Gel\u00e9es royaux
m.royal_start = Ici Agent de Reconnaissance Kora, nous avons d\u00e9t\u00e9ct\u00e9 un autre \
  module de reconnaissance d'Alpha Squad dans ce palais. Votre mission, c'est de le retrouver \
  et de le rapporter.\n\
  \n\
  Le Palais des Gel\u00e9es royaux est un endroit assez bizarre. Il a l'air d'\u00eatre un genre de ch\u00e2\
  teau que les slimes ont converti en r\u00e9sidence pour les membres de leur noblesse. Surnomm\u00e9s les \u00abRoyal Jelly\u00bb\
  , ces slimes nobles sont dits de r\u00e9gner sur leur sujets loyaux avec un appendice en \
  forme de poing de fer.\n\
  \n\
  Nos renseignements sugg\u00e8rent que le module se trouvent proche d'une concentration \u00e9\
  norme de slimes, donc c'est raisonnable de penser qu'il s'agit peut-\u00eatre d'une salle de tr\u00f4\
  ne d'un Royal Jelly. Si oui, soyez pr\u00eat pour une bataille violente - les Royal Jellies \
  sont vites f\u00e2ch\u00e9s et aiment envahir leurs ennemis. Votre meilleure chance est de \
  trouver un moyen de supprimer leur capacit\u00e9 de r\u00e9g\u00e9n\u00e9ration.  \n\
  \n\
  Bonne chance!


# Ironclaw Munitions Factory

s.ironclaw_start = Mission: Usine des munitons Ironclaw
m.ironclaw_start = Ici Agent de Reconnaissance Kora, nous avons intercept\u00e9 des \
  transmissions provenant de cette installation indiquant qu'ils construisent un esp\u00e8ce d'arme pour d\u00e9\
  truire Haven! Votre mission est d'infiltrer l'installation, de d\u00e9truire cette arme, et \
  de sauvegarder Haven de la destruction! \n\
  \n\
  Connu seulement comme \u00abProjet Roarmulus\u00bb, il est dit d'\u00eatre imp\u00e9n\u00e9\
  trable aux attaques standards. Vous devrez trouver un moyen de rompre son armure, car nos \
  renseignements sugg\u00e8rent que l'arme se trouve au centre de l'installation. \n\
  \n\
  Un fois l'armure d\u00e9pass\u00e9e, il y a encore des dangers. Vous d\u00e9couvrez pourquoi \
  les gremlins ne sont pas reconnus pour leurs environnements de travail s\u00e9curitaires: des \
  roquettes volent partout! Or, vous devrez \u00eatre capables d'utiliser les \u00abmurs de polarit\u00e9\u00bb \
  que vous trouverez dans les chambres d'essai pour les bloquer. Cherchez un interrupteur or et \
  violet pour les d\u00e9clencher. \n\
  \n\
  Nous avons aussi d\u00e9tect\u00e9 un autre module d'Alpha Squad perdu quelque part dans \
  l'usine. R\u00e9cup\u00e9rez-le si possible!\n\
  \n\
  Bonne chance!


# Firestorm Citadel

s.firestorm_start = Mission: Citadelle Feurieuse
m.firestorm_start = Ici Agent de Reconnaissance Kora. \u00c0 votre profondeur, c'est difficile \
  d'\u00e9tablir les communications. J'esp\u00e8re que ce message vous atteindra. Vous vous \
  trouvez actuellement dans la Citadelle Feurieuse, une ancienne forteresse du type que cettre \
  plan\u00e8te aime collecter. C'est une r\u00e9gion extr\u00eamement hostile des Rouages - \
  vous ne survivrez pas longtemps sans les bons \u00e9quipements et un escadron dou\u00e9. \n\
  \n\
  Nous avons d\u00e9tect\u00e9 un faible signal indiquant qu'un artefact de l'exp\u00e9dition \
  d'Alpha Squad se trouve dans la salle de tr\u00f4ne de cette citadelle. Nous devons r\u00e9cup\u00e9\
  rer cet artefact - il pourrait s'agir d'un indice indispensable pour d\u00e9couvrir leur \
  emplacement actuel. \n\
  \n\
  Je ne vous mentirai pas. Aucun escadron qui a accept\u00e9 cette mission a r\u00e9ussi \u00e0 \
  revenir de la citadelle. Vous vous avez sans doute rendu compte que l'endroit br\u00fble avec \
  des flammes surnaturelles, et une l\u00e9gion d'horreurs parcourt les couloirs. Il sera peut-\u00ea\
  tre le bon moment de revenir et de fabriquer de l'\u00e9quipement r\u00e9sistant aux flammes. L'\u00e9preuve du feu vous br\u00fblera.  \n\
  \n\
  Bonne chance!
