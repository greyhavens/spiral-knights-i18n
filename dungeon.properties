#
# Custom level descriptions
#..................................................................................................

m.battle_arena_desc = Said to be watched by countless drifting souls for entertainment, Battle \
Arenas offer escalating challenges for the brave warriors who wish to claim the treasure \
of the Arena King.

m.scarlet_fortress_desc = Named for its vibrant tapestries, the Scarlet Fortress is a deconstructed \
mass of a forgotten castle, drifting endlessly in the void of the Clockworks. Strange \
bestial ghosts haunt its long corridors, tirelessly pursuing those that enter their domain.

m.aurora_isles_desc = From atop mysterious floating islands, sun bleached ruins crumble under a \
false sky. Though the green grass and cool air feels real enough, the ever present grinding \
of the machine just below the surface is a constant reminder of this world's mechanical \
skeleton.

m.dark_city_desc = This once bustling city from an advanced world is now home to innumerable fiends \
from the Underworld. Under the light of the moon they burn their dark sigils into the \
ground, summoning more of their cohorts for reasons yet unknown.

m.concrete_jungle_desc = This long forgotten city was reclaimed by nature and then by the legions \
of the undead. Now it is a vile nest of malady, home to all manners of toxic monsters, living \
and otherwise.

m.treasure_vault_desc = Treasure Troves contain vast quantities of treasure blocks, yours for the \
taking should you have the proper means to get past the numerous locked doors. Some of them \
are heavily guarded, so always be on the look out for hidden traps and monsters.

m.graveyard_desc = A graveyard is a terrible place that simultaneously exists in the world of the \
living and the dead. Though they contain secret treasures in their dark corners, they are \
home to ancient horrors that wish to consume all who enter. Once inside, finding an exit as \
fast as possible is advised.

m.jigsaw_valley_desc = Appearing to be sky islands ripped apart and put back together again as \
if it were a puzzle this world can sometimes be confusing to navigate. Unfortunately it \
seems to also be home to a host of mindless slimes and constructs who do not seem to mind \
its erratic layout.

m.starlight_cradle_desc = Beneath a moonlit sky azure islands drift in a sea of stars. These \
islands are home to creatures that are more than happy to creep upon those that succumb \
to this world's endless lullaby.

m.firestorm_citadel_desc = All that remains of the once great kingdom of Almire, the Firestorm \
Citadel houses the legions of lost souls burning in the flames of a forgotten war, \
endlessly rekindled by the twisted spirit of their former lord.

m.vanaduke_desc = Within the throne room of the citadel Lord Vanaduke stands waiting to mount \
a final defense against any who manage to breach his citadel's defenses.

m.training_grounds_desc = This derelict portion of the Clockworks has been modified to train \
new recruits in the fine art of not dying when they have the rest of the world to \
explore.

m.rc_bomb_training_desc = Just beyond the perimeter of the Rescue Camp is a field of ruined \
equipment and overrun defenses.  The surviving knights abandoned this area after a series \
of deadly attacks during the night.

m.ancient_generator_desc = Beneath the Rescue Camp is a massive energy source, capable \
of powering the elevator to Haven if only it could be harnessed.

m.final_test_2_desc = The route to Haven is suspended high above a perilous clockwork chasm. \
Prepare yourself, danger is sure to lurk around every corner!

m.lobby_desc = A lobby before entering a gate where knights can strategize and gear up for the \
adventure to come.

m.terminal_desc = A level where travelers can safely return to town, or journey further into the \
depths of the Clockworks.

m.terminal_core_desc = A small terminal in the darkest depths of the Clockworks that looks out \
on to the colossal, ever-beating heart of the world.

m.terminal_return_desc = A level where travelers can safely return to the town above.

m.moorcroft_desc = A mysterious old manor home to a number of restless spirits. Moorcroft \
Manor appears to act as a station stop for spirits in their travels, however none of them \
appear to actually be going anywhere in particular.

m.emberlight_desc = A village of outcasts, Emberlight serves as a refuge for gremlins who were \
banished from the Great Colony. Now they live humble lives, selling wares and repairs to \
passing travelers, always fearful that one day the gremlin king Tinkinzar would see fit \
to wipe them out entirely.

m.royal_jelly_desc = The Royal Jelly Palace is an ancient castle overtaken by a legion of \
slime monsters. It is unclear what purpose the castle serves, though it is rumored to house \
a Royal Jelly, said to be nobility within the slime kingdoms. If true then the purpose \
of the castle is likely to serve the Royal Jelly, and nothing more.

m.gloaming_wildwoods_desc = Spiral Knight recruits are advised to avoid this dark and misty \
forest until they are experienced with the dangers of the Clockworks. The Gloaming \
Wildwoods is home to packs of vicious beasts, the worst of all being the mythical Snarbolax. \
Said to be 'a living shadow,' the Snarbolax prefers the taste of prey that had been a state \
of terror before death and will often mercilessly harass its victims before delivering \
the final blow.

m.ironclaw_munitions_factory_desc = The Ironclaw Munitions Factory is a gremlin-operated \
weapons factory that specializes in the production of high-calibur explosives.  Intel \
has revealed that it is developing a secret weapon known as 'Project Roarmulus' designed \
with the sole purpose of destroying Haven!

m.candlestick_keep.desc = All that remains of the Owlite Academy, the Candlestick \
Keep is now a grim shadow of the once great school of magical arts.  Knights who \
have made it out of this cursed keep have only this advice to offer- 'stay in the light.'

m.cogmaster_castle_desc = Calling all knights!  Spiral HQ has launched a full-scale assault \
on the heavily fortified castle of Warmaster Seerus, a devious gremlin of the Crimson Order. \
All attacks against the sturdy walls and destructive artillery have failed \
- Spiral HQ needs YOU to turn the tide of the battle and take the fight to the Warmaster himself!

m.super_brawl_desc = A Super Brawl arena.

