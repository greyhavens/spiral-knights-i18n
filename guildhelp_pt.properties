#
# Mensagens de tradu\u00e7\u00e3o

t.guild_help = AJUDA DA GUILDA

m.intro = Os Sal\u00f5es da Guilda s\u00e3o espa\u00e7os compartilhados que permitem aos membros da guilda se reunir,   conversar, decorar, armazenar itens e acessar diversos recursos da guilda.

m.what_is_guild_hall = O que \u00e9 um Sal\u00e3o da Guilda?
m.what_is_guild_hall_desc = Um Sal\u00e3o da Guilda \u00e9 um espa\u00e7o particular da sua guilda. Ele pode ser   expandido, decorado e personalizado com salas, portas, temas, ambientes e mob\u00edlia.

m.how_to_access = Como acessar o Sal\u00e3o da Guilda
m.how_to_access_desc = Voc\u00ea pode entrar no Sal\u00e3o da Guilda pela interface da guilda ou por entradas   espec\u00edficas em Haven, quando dispon\u00edveis.

m.design_mode = Modo de Design
m.design_mode_desc = O Modo de Design permite que membros autorizados modifiquem o layout do sal\u00e3o,   instalem salas e portas, posicionem mob\u00edlia e publiquem altera\u00e7\u00f5es para todos os membros.

m.publish_changes = Publicar altera\u00e7\u00f5es
m.publish_changes_desc = Altera\u00e7\u00f5es feitas no Modo de Design n\u00e3o ficam vis\u00edveis para todos   imediatamente. \u00c9 preciso public\u00e1-las para atualizar o Sal\u00e3o da Guilda ativo.

m.storage = Armazenamento
m.storage_desc = Guildas podem ter \u00e1reas de armazenamento compartilhado para membros, veteranos e   oficiais. Itens deixados nesses espa\u00e7os podem ser retirados por qualquer membro com a patente   apropriada.

m.treasury = Tesouro
m.treasury_desc = O Tesouro da Guilda armazena coroas usadas para manuten\u00e7\u00e3o, expans\u00f5es, temas,   ambientes, salas, portas e outras compras relacionadas \u00e0 guilda.

m.energy_well = Po\u00e7o de Energia
m.energy_well_desc = O Po\u00e7o de Energia permite depositar e retirar energia para uso coletivo da guilda,   sujeito \u00e0s regras e restri\u00e7\u00f5es do sistema.

m.upkeep = Manuten\u00e7\u00e3o
m.upkeep_desc = Sal\u00f5es da Guilda exigem manuten\u00e7\u00e3o em coroas. Se a manuten\u00e7\u00e3o n\u00e3o for paga, a guilda   entra em inadimpl\u00eancia e alguns recursos podem ficar indispon\u00edveis at\u00e9 a situa\u00e7\u00e3o ser regularizada.

m.expansions = Expans\u00f5es
m.expansions_desc = Expans\u00f5es aumentam o tamanho do Sal\u00e3o da Guilda e desbloqueiam espa\u00e7o para novas   salas, portas e recursos.

m.themes = Temas
m.themes_desc = Temas alteram o conjunto de pe\u00e7as visuais, a ilumina\u00e7\u00e3o e o c\u00e9u do Sal\u00e3o da Guilda.

m.environments = Ambientes
m.environments_desc = Ambientes modificam os efeitos ambientais do Sal\u00e3o da Guilda.

m.furnishings = Mob\u00edlia
m.furnishings_desc = A mob\u00edlia permite decorar o sal\u00e3o e dar personalidade ao espa\u00e7o da guilda.

m.permissions = Permiss\u00f5es
m.permissions_desc = Nem todos os membros da guilda podem usar todos os recursos. Acesso ao Modo de   Design, armazenamento e outras fun\u00e7\u00f5es depende da patente e das permiss\u00f5es concedidas.

m.public_halls = Sal\u00f5es abertos ao p\u00fablico
m.public_halls_desc = Uma guilda pode abrir seu sal\u00e3o ao p\u00fablico para que outros jogadores o visitem.

m.log = Registro da Guilda
m.log_desc = O Registro da Guilda acompanha eventos importantes, como entrada e sa\u00edda de membros,   dep\u00f3sitos, retiradas, compras, altera\u00e7\u00f5es de patente e mudan\u00e7as no sal\u00e3o.

m.tips = Dicas
m.tips_desc = Publique altera\u00e7\u00f5es com frequ\u00eancia, organize o armazenamento com cuidado e acompanhe a   manuten\u00e7\u00e3o para evitar inadimpl\u00eancia.

b.close = Fechar
