  serait une grande surprise pour le roi quand ses d\u00e9gustateurs et d\u00e9gustatrices sont \
  absents.
# IMAGE: codex_royal_jelly.png

n.monster_codex_roarmulus_twins = Volume monstrueux:
m.monster_codex_roarmulus_twins = Roarmulus Twins\n\
