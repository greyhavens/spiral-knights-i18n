m.mission_collectorknight_c = Cette place me donne des frissons.
m.mission_collectorknight_d = R\u00e9cup\u00e9rez les sprites de bataille, s'il vous plait!

m.mission_survivorknight_a = P-prenez garde... il nous traquent... il surveille nos moindres \
  gestes!
m.mission_survivorknight_b = Il nous a chass\u00e9... il a pris mes co\u00e9quipiers...
m.mission_survivorknight_c = Le surveilleur des For\u00eats farouches... l'horrible Snarbolax!

m.mission_researcher_a = Nous \u00e9tudions cette m\u00e9t\u00e9orite quand ces lichens \
