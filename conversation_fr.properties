## HAVEN LABORATORY
#...................................................................................................

n.geoknight = Chevalier Geo

m.lab_knight1_1a = Nous avons r\u00e9cup\u00e9r\u00e9 du Skylark tous ce que nous puissions \
  sauver et bricol\u00e9 la reste avec l'aide des \u00c9trangers.
r.lab_knight1_1a = Terminer la conversation.

m.lab_knight2_1a = Les \u00e9minations du Core dans ce monde ont eu des effets bizarres sur nos \
  sprites de bataille.

m.lab_knight3_1a = Nous avons sauv\u00e9 le deuxi\u00e8me g\u00e9n\u00e9rateur du Skylark avec \
  peu de dommage. Malheureusement, le g\u00e9n\u00e9rateur n'a pas beaucoup d'\u00e9nergie \u00e0 \
  faire marcher le lab, encore moins de mobiliser la navire. Il n\u00e9cessite de chercher une \
  autre source d'\u00e9nergie si nous voudrons retourner chez soi.

m.lab_knight4_1a = Les \u00e9quipes de reconnaissance ont r\u00e9cup\u00e9r\u00e9 des choses \
  bizarres et remarquables dans les Rouages.

m.lab_knight5_1a = {0}, as-tu d\u00e9j\u00e0 vu ces min\u00e9raux pendant tes voyages? Ils sont \
  fascinants! Vous devez demander \u00e0 Chief Geo Knight Wegner sur ceux-ci. J'ai entendu dire \
  que c'est lui l'expert sur les min\u00e9raux!

m.lab_knight6_1a = Nous ne prenons aucune chance avec l'artifice que tu as trouv\u00e9, {0}. Un \
  jour, les gremlins seraient de retour. Fais attention!

m.lab_knight7_1a = H\u00e9 {0}, ces donn\u00e9es initiales, c'est un nouveau record! Nous \
  n'avons jamais vu les indications comme celles-ci au pass\u00e9. Il peut prendre du temps \
  avant que nous puissions savoir \u00e0 quoi l'objet sert.

m.lab_hahn_1a = (Il para\u00eet que Hahn s'est occup\u00e9 et ne fait aucune attention \u00e0 vous)

