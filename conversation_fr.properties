m.dark_harvest_exp = Bienvenue au Festival de la R\u00e9colte Obscure! Cette c\u00e9l\u00e9\
  bration rend hommage aux morts-vivants avec des masques de f\u00eate, des g\u00e2teries d\u00e9\
  licieux et des ruses dangereuses!\n\
  \n\
  Pour participer, parcourez les Rouages pour retrouver le roi l\u00e9gendaire: le Punkin King. \
  Cette gourde de goule donne des bonbons \u00e0 ses visiteurs. Une fois que vous avez des \
  bonbons, filez-vous aux marchands en Haven pour les \u00e9changer contre des masques \
  monstrueux! \n\
  \n\
  Si vous pr\u00e9f\u00e9rez une m\u00e9thode plus rapide ou s'il vous manque un couple de \
  caramels, notre vendeur offre aussi des bonbons \u00e0 acheter.

r.dark_harvest_exp = \u00c9patant! Je cours trouver le Punkin King!


# Winterfest
#...................................................................................................


m.impostoclaus = Glorp, glorp, glorp! Joyeux Festiver!\n\
  \n\
  Ressentez l'esprit des f\u00eates avec des batailles de neige dans des niveaux hivernaux de \
  Lockdown et \u00e9changez vos Krogmo Coins contre des Santy Hats splendides!

r.impostoclaus = Je crois en toi, Impostoclaus!

m.impostoclaus_1a = Glorp! Glorp! Glorp! Joyeux Festiver!\n\
  \n\
  C'est le temps magnifique, quand une couverture de neige blanche couvre Haven et chaque \u00c9tranger, chaque b\u00e9\
  cassine, et chaque chevalier se sent content avec la joie des f\u00eates.\n\
  \n\
  Mais je dois vous dire quelque chose: tout n'ira pas bien. Malgr\u00e9 d'un motif ou raison, \
  un bande de grinchlins sans c\u0153ur menace cette saison de Festiver!
r.impostoclaus_1a = Pas sous mon surveillance. Je sauverai Festiver! Comment puis-je aider?

m.impostoclaus_2a = Quel courage, quelle bravoure! Oui, avec un peu de chance, vous r\u00e9futeriez les b\u00ea\
  tes terribles qui veulent \u00e9craser les r\u00eaves du Festiver.\n\
  \n\
  Alors, notez l'addition de la mission Festiver, prenez votre \u00e9p\u00e9e, et je vous \
  donnerai des r\u00e9compenses!
r.impostoclaus_2a = Accomplir la mission \u00abSauver Festiver!\u00bb et recevoir les r\u00e9compenses sp\u00e9\
  ciales du Festiver? Je serai l\u00e0!

r.impostoclaus_3a = Voir le magasin de r\u00e9compenses Festiver
r.impostoclaus_3b = Terminer la conversation.

m.impostoclaus_win = Glorp! Glorp! Festiver est sauv\u00e9 et quelque chose est claire: que les \
  c\u0153urs chantent la joie et non du peur!
m.impostoclaus_fail = Notre mission pour sauver Festiver termine en d\u00e9faite! Les \
  grinchlins ont gagn\u00e9, nous devons battre en retraite!

