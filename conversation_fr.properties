m.hav_snipes_1a = Faites attention de ne pas marcher sur les b\u00e9cassines, d'accord?

r.hav_snipes_1a = Les b\u00e9cassines?

m.hav_snipes_2a = Les b\u00e9cassines sont ces oiseaux graciles et charmants que l'on voit \
  sillonner le ciel de Haven. Certains estiment que ce sont les plus belles cr\u00e9atures de \
  la galaxie, mais les b\u00e9cassines ne sont pas de cet avis car leur modestie n'a pas de \
  limite.

