# Tylen Bazaar Tour
#...................................................................................................
m.bazaar_tour_1a = Bienvenue au Bazar, {0}! Aimeriez-vous une visite des boutiques ou des \
  services?

r.bazaar_tour_1a = BIen s\u00fbr, montrez-moi les boutiques. (Suivre Tylen)
r.bazaar_tour_1b = Quels services pourrais-je trouver ici? (Suivre Tylen)
r.bazaar_tour_1c = Non merci, j'explorerai tout seul.

m.bazaar_tour_2a = Des \u00c9trangers comme Quillion vous vendent des armes et des armures. \
  Chacun de ces \u00c9trangers vend des items particuli\u00e8res, alors parlez avec lui et d\u00e9\
  couvrez ce qu'ils marchandent. Ils ne parlent pas trop, mais ils ont des nouveaux items en \
  stock tous les jours!\n\
  \n\
  Assurez-vous que vous atteignez le rang appropri\u00e9 afin d'\u00e9quiper l'item!

r.bazaar_tour_2a = Les \u00c9trangers vendent-ils des choses autrement que les armes et \u00e9quipements?

m.bazaar_tour_3a = Je suis ravi que vous le demande, ouais! Allons-y, nous visiterons Vatel.

r.bazaar_tour_3a = (Suivre Tylen)
#(move to Vatel)

m.bazaar_tour_4a = Ici, Vatel vous vend un assortiment de recettes ainsi que les modifications \
  de couleur personnelle et des autres items.

r.bazaar_tour_4a = Des recettes? Pour des armes et \u00e9quipements?

m.bazaar_tour_5a = C'est \u00e7a, on peut acqu\u00e9rir des recettes et mat\u00e9riaux afin \
  d'alchimiser des armes et \u00e9quipements aux stations d'alchimie. Venez avec moi, je vous \
  en montrerai.

r.bazaar_tour_5a = Affirmatif.
#(move to alchemy station)

m.bazaar_tour_6a = Ici, nous avons une station d'alchimie de laquelle vous serez bien \
  familiaris\u00e9 en am\u00e9liorant votre arsenal.\n\
  \n\
  Et voil\u00e0, c'est tout pour les boutiques. Aimeriez-vous une autre visite?

r.bazaar_tour_6a = J'aimerais voir les boutiques encore. (Suivre Tylen)
r.bazaar_tour_6b = J'aimerais voir les services. (Suivre Tylen)
r.bazaar_tour_6c = Non merci, j'explorerai tout seul.

m.bazaar_tour_7a = Punch et Vise sont les forgerons gremlins qui peuvent changer les attributs \
  de vos armes et \u00e9quipements.

r.bazaar_tour_7a = Des Gremlins?!

m.bazaar_tour_8a = Restez assur\u00e9, {0}, pas tous les gremlins sont comme les autres. \
  Quelques-uns ne sont pas d'accord avec les mani\u00e8res de King Tinkinzar et l'Ordre \
  Incarnat. En fait, dans quelque part des Rouages, on me dit qu'il y a une ville plein de \
  gremlins qui sont partis de la Grande Colonie.

r.bazaar_tour_8a = Eh bien, si vous le dites...

m.bazaar_tour_9a = Alors, passons aux choses s\u00e9rieuses.\n\
  \n\
  Punch peut ajouter des Variantes Uniques, un sort de bonus pour vos armes et \u00e9quipements \
  en y mettant un prix. Mais ses m\u00e9thodes sont, euh... chaotiques. On ne sait pas ce qu'on \
  va recevoir.\n\
  \n\
  Vise est un petit peu plus pr\u00e9cis. Il peut d\u00e9lier vos armes et \u00e9quipments pour un co\u00fb\
  t, et cela vous permet de vendre ou donner l'item!

r.bazaar_tour_9a = \u00c7a serait utile, je ne l'oublierais pas. Vous avez des autres choses?

m.bazaar_tour_10a = Visitons Brinks.

r.bazaar_tour_10a = (Suivre Tylen)
#(move to Brinks)

m.bazaar_tour_11a = Brinks est l'\u00c9changeur de jetons, en fournissant certains items aux \
  chevaliers contre des jetons qu'on peut rassembler dans les Rouages. Des jetons peuvent \u00eatre trouv\u00e9s dans les blocs de tr\u00e9sor, fournis comme des r\u00e9\
  compenses de mission, ou trouv\u00e9s en vainquant des sp\u00e9ciaux monstres de boss.

r.bazaar_tour_11a = Je comprends. Des autres choses?

m.bazaar_tour_12a = Il y a une boutique de plus \u00e0 voir avant la fin de la visite. J'ai \
  gard\u00e9 la meilleure chose pour la fin.

r.bazaar_tour_12a = (Suivre Tylen)
#(move to Bechamel)

m.bazaar_tour_13a = Voici Bechamel l'Accessorizor, le personne qui peut ajouter des accessoires \u00e0 vos \u00e9quipements \u00e9tant donn\u00e9 \
  que vous avez un billet. Avec des accessoires, on peut ressortir nos \u00e9quipements dans la \
  foule de gens. Je vous conseille de l'essayer. Vous tenez comme \u00e0 la prunelle des yeux!

r.bazaar_tour_13a = O\u00f9 puis-je trouver des billets d'accessoire?

m.bazaar_tour_14a = On peut trouver les billets d'accessoire dans les lockbox ou dans la Maison \
  d'ench\u00e8res si un autre chevalier les vend.

r.bazaar_tour_14a = Affirmatif.

m.bazaar_tour_15a = Alors, c'est tout sur les essentiels du Bazar. C'est une place tellement \
  fantastique pour trouver n'importe quoi.\n\
  \n\
  Aimeriez-vous que je recommence la visite ou pensez-vous que vous comprenez le tout?

r.bazaar_tour_15a = J'aimerais voir les boutiques. (Suivre Tylen)
r.bazaar_tour_15b = J'aimerais voir les services encore. (Suivre Tylen)
r.bazaar_tour_15c = Non merci, j'explorerai tout seul.

m.bazaar_tour_16a = Une autre visite? Pas de probl\u00e8me, suivez-moi!
r.bazaar_tour_16a = (Suivre Tylen)

m.bazaar_tour_16b = Excellent! Je suis content que je puisse vous aider. Bonne chance \u00e0 vous, {0}!

r.bazaar_tour_16b = Merci Tylen, on se reverra!



