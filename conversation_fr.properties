#
# Translation messages

msgbundle_class = com.threerings.projectx.client.ControlAwareMessageBundle

## GENERAL

m.please_wait = Veuillez patienter

# Energy Info
#...................................................................................................

n.energy_info = Chevalier \u00e9nergique

m.energy_info_1a = Savez-vous ce la ressource la plus importante sur Cradle? L'\u00c9NERGIE! Eh \
  oui, c'est si important qu'il y a de quoi hurler! Vous voulez en savoir plus \u00e0 propos de cet \u00e9l\u00e9\
  ment essentiel? Il se trouve que je m'y connais!

r.energy_info_1a = J'aimerais en savoir plus, dites-moi tout!

r.energy_info_1b = Non merci, je pr\u00e9f\u00e8re rester dans l'ignorance.

m.energy_info_2a = Merveilleux! Je vais vous la faire en trois cours tr\u00e8s simples: ce que \
  c'est, comment on l'utilise et comment on s'en procure.

r.energy_info_2a = Qu'est-ce que l'\u00e9nergie?

r.energy_info_2b = Comment utilise-t-on l'\u00e9nergie?

r.energy_info_2c = Comment faire pour s'obtenir de l'\u00e9nergie?

r.energy_info_2d = Vos cours me remplissent d'\u00e9nergie! Je pars \u00e0 l'aventure!

m.energy_info_3a = L'\u00e9nergie est une force tr\u00e8s sp\u00e9ciale qui \u00e9mane en \
  permanence du noyau de ce monde. Elle est compl\u00e8tement stable: impossible de la perdre, \u00e0 moins de l'\u00e9\
  changer ou de l'utiliser (la jauge d'\u00e9nergie Crystal est situ\u00e9e dans le module d'\u00e9nergie, trouv\u00e9e dans votre arsenal).

m.energy_info_3b = L'\u00e9nergie a d'innombrables applications! Elle est la monnaie principale \
  pour faire des achats dans le D\u00e9p\u00f4t des provisions, et elle permet d'acheter des am\u00e9\
  liorations ou pour se ranimer dans les Rouages quand on n'a plus des Sparks of Life. Vous en \
  aurez \u00e9galement besoin pour former une guilde. \n\
  \n\
  Au cours de vos aventures, vous trouverez toutes sortes d'appareils fonctionnant \u00e0 l'\u00e9\
  nergie, ce qu'indique un symbole bleu.

m.energy_info_3c = Vous pouvez acheter de l'\u00e9nergie Crystal ou en obtenir par \u00e9change, gr\u00e2ce \u00e0 l'option \u00c9\
  change. Pour en acheter, lancez le D\u00e9p\u00f4t des provisions puis cliquez sur le bouton \u00abObtenir l'\u00c9nergie\u00bb.

r.energy_info_3a = J'ai une autre question \u00e0 vous poser.

r.energy_info_3b = Vos cours me remplissent d'\u00e9nergie! Je pars \u00e0 l'aventure!



## TUTORIAL

# Rescue Agent
#...................................................................................................

n.tut_intro = Agent de sauvetage

m.tut_intro_1a = Bienvenue sur Cradle, recrue! J'appr\u00e9cie toujours quand les chevaliers \
  atterrissent en un seul morceau! Nous avons mont\u00e9 un Camp de refuge \u00e0 deux pas. Je \
  vous guiderai - mais tirez votre \u00e9p\u00e9e, il y a des ennemis sur la route!
r.tut_intro_1a = Compris, je me mets en route!


m.tut_intro2_1a = ...j'appelle, {0}, \u00eates-vous l\u00e0?  Ici chevalier de reconnaissance \
  Rhendon!

r.tut_intro2_1a = Je suis ici, qu'est-ce qu'il passe?

m.tut_intro2_2a = Vous avez percut\u00e9 la surface de Cradle. Ma nacelle a heurt\u00e9 au nord \
  de votre position. Nous nous devons rencontrer et trouver le rassemblement plus proche. \n\
  \n\
  Soyez prudent et pr\u00e9parez-vous, il y a des cr\u00e9atures hostiles partout!

r.tut_intro2_2a = Affirmatif, Rhendon. J'y arriverai.


m.tut_intro3_1a = Ravi de vous rencontrer, {0}! Cette place est tr\u00e8s extraterrestre, je \
  suis heureux de voir une visage famili\u00e8re et non une autre cr\u00e9ature hostile.

r.tut_intro3_1a = Je suis content de vous voir sain et sauf aussi, Rhendon. O\u00f9 sont les \
  autres survivants?

m.tut_intro3_2a = Avec mon comlink, j'ai contact\u00e9 les chevaliers qui ont \u00e9tabli un \
  Camp de refuge. Si vous allez vers le nord, vous arriverez au Camp.\n\
  \n\
  Je vais rester ici pour le moment et trouver des autres chevaliers qui ont heurt\u00e9 dans cette r\u00e9\
  gion. Je vous rencontrai au Camp de refuge avant le coucher du soleil.\n\
  \n\
  Et si vous rencontrez quelque chose de dangereuse, appuyez sur le [[?DEFEND]] pour utiliser \
  votre bouclier!

r.tut_intro3_2a = Je partirai en reconnaissance! Soyez prudent, Rhendon.

m.tut_intro4_1a = Je vais rester ici pour le moment et trouver les autres chevaliers qui ont \
  heurt\u00e9 dans la r\u00e9gion. Je vous rencontrai au Camp de refuge au nord.\n\
  \n\
  Et si vous rencontriez une cr\u00e9ature dangereuse, pesez sur le [[?DEFEND]] pour utiliser \
  votre bouclier!

r.tut_intro4_1a = J'explorerez en avant! Soyez prudent, Rhendon.

m.tut_intro3_3a = Bonne chance!
m.tut_intro3_3b = Soyez prudent!
m.tut_intro3_3c = N'oubliez pas d'appuyer sur le [[?DEFEND]] pour utiliser votre bouclier!

# Warden Companion
#.................................................................................................
m.tut_warden_1a = Bienvenue, chevalier. Tu es {0}, non? Rhendon nous a appel\u00e9 et il a dit que tu \u00e9\
  tais en route du camp. Viens avec nous, le Camp de refuge est juste devant nous.

r.tut_warden_1a = Excellent. J'attends avec impatience pour un repas r\u00e9chauffant.

m.tut_warden_2a = Toi et moi-m\u00eame. Alors, on y va-\n\
  \n\
  Attend, quelque chose cloche. Pr\u00e9pare-toi, je pense que nous ayons des visiteurs!

r.tut_warden_2a = Terminer la conversation.

m.tut_warden_3a = Bien jou\u00e9, {0}! Il para\u00eet que tu sais les essentiels dans le champ \
  de bataille.\n\
  \n\
  Allons-y, nous allons au camp. Peut-\u00eatre tu pourrais nous aider \u00e0 comprendre ce qui \
  se passe ici.

r.tut_warden_3a = Terminer la conversation.

# Final Test Knight
#...................................................................................................


m.final_test_knight_1a = Incroyable! Je ne pensais jamais qu'un nouveau recrue s'echappe ce d\u00e9bris ardent! Vous n'\u00ea\
  tes pas comme les autres...\n\
  \n\
  Le nom est Feron, Lieutenant d'Ordre Spiral. Nous avons pens\u00e9 que cette r\u00e9gion \u00e9tait abandonn\u00e9\
  e et en ruines, mais tout d'un coup, l\u2019\u00e9lectricit\u00e9 \u00e9tait r\u00e9tablie. Lorsqu'on lan\u00e7ait une enqu\u00ea\
  te, il y a une incendie dans la place!\n\
  \n\
  Comment avez-vous vous retrouv\u00e9 \u00e0 cet endroit?

r.final_test_knight_1a = (Informer Feron \u00e0 propos du Camp de refuge, Razwog, et \
  l'artifice)

m.final_test_knight_2a = Je comprends. Ce sont des informations utiles pour Spiral HQ. Notre \
  camp de base au Haven est juste en avant. Montez sur l'ascenseur et rencontrez les autres \
  chevaliers qui survivaient l'\u00e9crasement comme vous-m\u00eame. Les techs dans le Lab \
  auront h\u00e2te d'examiner cet artifice. Ils le voient lorsque vous arriverez au Haven.\n\
  \n\
  Ne vous inqui\u00e9tez pas sur les autres dans le Camp de refuge. Gr\u00e2ce \u00e0 vous, \
  nous pouvons les rejoindre avec un syst\u00e8me d'ascenseur fonctionnant. Vous avez sauv\u00e9 tout le monde!

r.final_test_knight_2a = Merci, Lieutenant. Je partirai pour Haven.

# Rescued Stranger
#...................................................................................................

m.rescued_stranger_1a = Bonjour, mon petit. Vous trouverez qu'il y a beaucoup des dangers dans \
  ce nouveau monde. Mais il y a aussi des opportunit\u00e9s pour les chevaliers aventureux et \
  courageux! L'un de vos camarades vous attends au nord du chemin. Nous nous rencontrons \
  encore, sans doute. Au revoir pour le moment!
r.rescued_stranger_1a = Terminer la conversation.


## RESCUE CAMP KNIGHTS

# Greta B
#...................................................................................................

m.rc_greet2_1a = Bonjour, je suis la chef d'escadron Greta. Vous \u00eates {0}, oui? Rhendon \
  nous a dit de vous attendre, et ce n'est pas trop t\u00f4t. La situation est \u00e0 un point \
  critique dans ce Camp de refuge.

r.rc_greet2_1a = C'est quoi le probl\u00e8me, Greta?

m.rc_greet2_2a = Bref, ce camp-ci n'a aucune d'\u00e9nergie et le soleil se couchera bient\u00f4\
  t. Hier soir, les monstres de toutes sortes nous chassaient dans l'obscurit\u00e9. Nous ne \
  pourrions rien voir et nous n'avons aucune d'\u00e9nergie pour nos tourelles d\u00e9fensives.\n\
  \n\
  ... nous avons perdu beaucoup de recrues.\n\
  \n\
  Nous avons besoin de canaliser l'\u00e9nergie au Camp de refuge afin d'installer un p\u00e9rim\u00e8tre d\u00e9\
  fensif avant que la nuit tombera!

r.rc_greet2_2a = Comment puis-je aider \u00e0 canaliser l'\u00e9nergie au camp?

m.rc_greet2_3a = Nos balayages nous indiquent qu'il y a un g\u00e9n\u00e9rateur ancien \
  au-dessous du camp. Le g\u00e9n\u00e9rateur doit nous fournir l'\u00e9nergie, mais il para\u00ee\
  t que quelque chose d'autre canalise l'\u00e9lectricit\u00e9 ailleurs.\n\
  \n\
  Vous devez faire une enqu\u00eate sur le g\u00e9n\u00e9rateur ancien et r\u00e9-diriger l'\u00e9\
  nergie chez nous encore. Mais il faut que vous soyez pr\u00eat- c'est un domaine inexplor\u00e9\
  , grouillant avec des monstres.\n\
  \n\
  Rhendon disait qu'il voudrait vous rencontrer avant que vous preniez cette mission. Pourquoi \
  ne pas parler \u00e0 Rhendon?

r.rc_greet2_3a = Je rencontrai Rhendon avant que je fasse une enqu\u00eate sur le g\u00e9n\u00e9rateur.

m.rc_greet2_4a = Je vous en prie, {0}, aidez-nous \u00e0 r\u00e9tablir l'\u00e9nergie au Camp \
  de refuge afin d'installer un p\u00e9rim\u00e8tre d\u00e9fensif. Nous ne pouvons pas perdre \
  plus des recrues \u00e0 cause de cr\u00e9atures de la nuit!

r.rc_greet2_4a = Je ferai mon mieux!

m.rc_greet3_1a = Vous avez r\u00e9tabli l'\u00e9nergie et vous nous avez sauv\u00e9, {0}! Je ne \
  peux pas vous remercie suffisamment, tous ces recrues sont reconnaissants \u00e0 vous.\n\
  \n\
  Vous devez essayer de contacter Spiral HQ via votre comlink maintenant.

r.rc_greet3_1a = Terminer la conversation.

# Rescue Camp Recruit Knights
#...................................................................................................
n.rc_recruit = Recrue
m.rc_recruit_a = Il se peut que nous n'ayons pas d'\u00e9nergie, mais je peux faire du feu pour \
  fournir un peu de lumi\u00e8re. C'est la moindre des choses que je puisse faire.

m.rc_recruit_b = Il n'y a pas beaucoup d'\u00e9quipement qui \u00e9taient r\u00e9cup\u00e9r\u00e9\
  s des nacelles. Pas assez des \u00e9quipements pour tous les chevaliers en bonne sant\u00e9.

m.rc_recruit_c = D\u00e9trompez-vous! Ce gouffre entier est rempli avec une grande m\u00e9\
  canique de quelque sorte. Le gouffre a l'air d'\u00eatre vraiment profond... \n\
  \n\
  Je me demande si le monde entier est comme \u00e7a?

m.rc_recruit_d = Entre la chaleur du feu et la s\u00e9curit\u00e9 des tourelles d\u00e9\
  fensives, je pense que je m'endormirai bien ce soir.

m.rc_recruit_e = Je peux sentir l'\u00e9lectricit\u00e9 dans l'air! Il semble que ce ne soit \
  pas n\u00e9cessaire de r\u00e9sister ce soir, apr\u00e8s tout!

m.rc_recruit_f = Ils disent que vous allez descendre cet ascenseur et dans le gouffre en \
  dessous. Vous \u00eates vachement plus courageux que moi...

r.rc_recruit = Terminer la conversation.

# Technician Knight
#...................................................................................................
n.rc_technician = Technicien
m.rc_technician_a = Selon ces balayages, il y a une source d'\u00e9nergie dans les profondeurs \
  au-dessous du camp, mais l'\u00e9nergie n'arrive pas ici...

m.rc_technician_b = Ce machin est inutile sans l'\u00e9nergie. Comment devons-nous prot\u00e9\
  ger les chevaliers et nous-m\u00eames contre ces monstres?!

m.rc_technician_c = L'\u00e9lectricit\u00e9 \u00e9tait r\u00e9tabli au camp! Bon travail, {0}!

r.rc_technician = Terminer la conversation.

# Injured Knight
#...................................................................................................
n.rc_injured = Chevalier bless\u00e9
m.rc_injured_a = Hier soir, les monstres terribles nous attaquaient dans l'obscurit\u00e9. C'\u00e9\
  tait du chaos total. Sans l'\u00e9nergie pour les tourelles, nous ne pouvions pas nous d\u00e9fendre.\n\
  \n\
  Beaucoup des chevaliers ont p\u00e9ri...

m.rc_injured_b = L'un des monstres m\u00e9caniques m'ont bless\u00e9. Les griffes du monstre \
  ont d\u00e9chir\u00e9 mon armure!

m.rc_injured_c = Gr\u00e2ce \u00e0 vous, nous n'aurons pas besoin d'avoir une autre soir\u00e9e comme la derni\u00e8re...

m.rc_injured_d = Avec l'\u00e9nergie r\u00e9tabli, je pourrais r\u00e9parer mon armure. Esp\u00e9\
  rons que je ne me heurte jamais aux monstres rouill\u00e9s!

r.rc_injured = Terminer la conversation.


# Nervous Knight
#...................................................................................................

n.rc_nervous = Chevalier appr\u00e9hensif

m.rc_nervous_1a = J'aimerais acheter quelque chose avec les Crowns que j'ai remport\u00e9es dans la zone d'entra\u00ee\
  nement, mais ce marchand me donne la chair de poule! Qu'est-ce qu'il peut bien dissimuler \
  sous sa robe, \u00e0 votre avis?

r.rc_nervous_1a = Terminer la conversation

# Forge Knight
#...................................................................................................
n.rc_forge = Chevalier de forge
m.forge_knight_1a = Cradle est un monde dangereux et c'est important de s'assurer qu'on a les \
  plus forts \u00e9quipements dans l'arsenal afin de survive. Pour faire \u00e7a, on doit \
  utiliser la Forge.

r.forge_knight_1a = Qu'est-ce qu'une Forge?

m.forge_knight_2a = La Forge utilise la chaleur accumul\u00e9e dans votre \u00e9quipement, puis \
  elle combine l'\u00e9quipement avec la force des Fire Crystals pour d\u00e9cha\u00eener sa nouvelle pouvoir.

r.forge_knight_2a = Continuez

m.forge_knight_3a = En ville, vous pouvez acc\u00e9der la Forge \u00e0 n'importe quel temps. \
  Dans les Rouages, vous pouvez l'acc\u00e9der en utilisant dans une Poste d'arsenal.

r.forge_knight_3a = Continuez

m.forge_knight_4a = En utilisant la Forge, vous verrez une liste d'items pr\u00eats \u00e0 \
  passer au prochain niveau. Sel\u00e9ctionner un item vous montrera comment am\u00e9liorer l'\u00e9quipement.

r.forge_knight_4a = Continuez

m.forge_knight_5a = Chaque item n\u00e9cessite une type de Fire Crystal sp\u00e9cifique. Les \
  Fire Crystals sont disponibles au D\u00e9p\u00f4t des provisions, gagn\u00e9s comme r\u00e9\
  compenses de certaines missions et trouv\u00e9s dans les bo\u00eetes de tr\u00e9sor dans les Rouages!

r.forge_knight_5a = Comment les Fire Crystals marchent-ils?

m.forge_knight_6a = Fire Crystals sont quelque peu instables ; la quantit\u00e9 \
  n\u00e9cessaire pour une forge r\u00e9ussie varie. \n\
  De plus, nous avons d\u00e9couvert qu\u2019ajouter davantage de Fire Crystals \
  offre des chances d\u2019obtenir des bonus sp\u00e9ciaux qui seront appliqu\u00e9s \
  \u00e0 l\u2019objet ! \n\

r.forge_knight_6a = \u00c7a a l'air bon!

m.forge_knight_7a = Maintenant que vous savez la Forge, voudriez-vous la voir?

r.forge_knight_7a = Bien s\u00fbr! (Ouvrir la Forge)
r.forge_knight_7b = Je la regarderai plus tard. (Terminer la conversation)

# Geo Knight
#...................................................................................................

n.rc_soil = Chevalier Geo

m.rc_soil_1a = Je prends des \u00e9chantillons de roche pour leSpiral HQ. Mes analyses m'ont \
  permis d'identifier des centaines de terres uniques dans chaque centimetre carr\u00e9e de terrain. Mais \u00e7a ne peut pas \u00eatre possible, j'ai d\u00fb \
  faire une erreur quelque part...

r.rc_soil_1a = Terminer la conversation

# Veteran Knights
#...................................................................................................
n.rc_vet_1 = Gardien Spiral
n.rc_vet_2 = Chevalier v\u00e9t\u00e9ran

m.rc_vet_1a = Merci de votre aide. Soyez prudent!
m.rc_vet_2a = Soyez toujours en garde. Qui sait les dangers qui nous attendent dans ce monde?
m.rc_vet_3a = Je ne me calmerai pas jusqu'\u00e0 ce que nous nous rejoignions Spiral HQ.

r.rc_vet_1a = Terminer la conversation.

# Rhendon
#...................................................................................................

m.rc_rhendon_1a = Savez-vous qu'est-ce que c'est, {0}? Il doit \u00eatre important si ce mec \
  Razwog \u00e9tait si agit\u00e9 d\u00e8s que vous l'avez saisi.\n\
  \n\
  H\u00e9, c'est \u00e7a qu'il m\u00e9rite, car il a essay\u00e9 de vous tuer et tout!

r.rc_rhendon_1a = Terminer la conversation.

# Kinter
#...................................................................................................


m.rc_instruct_1a = Bienvenue, la recrue. Toujours heureux de voir un autre chevalier qui est \
  arriv\u00e9 au Camp de refuge. J'imagine que vous cherchez comment vous pr\u00e9parer pour \
  votre voyage au Haven. Je vous conseille de commencer avec cette porte aux Rouages. \
  Approchez-vous du panneau de contr\u00f4le situ\u00e9 au nord de l'ascenseur et appuyez sur \
  la commande d'action ([[?ACTION]]).\n\
  \n\
  Des questions?

r.rc_instruct_1a = Oui, des tas!

r.rc_instruct_1b = Non, je pr\u00e9f\u00e8re passer \u00e0 l'action tout de suite.

m.rc_instruct_2a = Que voulez-vous savoir?

r.rc_instruct_2a = Les \u00abRouages\u00bb?

r.rc_instruct_2b = Vous avez parl\u00e9 de \u00abportes\u00bb...

r.rc_instruct_2c = Maintenant que j'y pense, je vais commencer.


m.rc_instruct_3a = Les Rouages sont une machine aussi gigantesque que complexe, faite \
  d'engrenages et de m\u00e9canismes et enterr\u00e9e juste sous la surface de ce monde. Elle \
  est \u00e0 couper le souffle! Ce monde est fort \u00e9trange et regorge de p\u00e9rils, vous \
  savez. Faites attention \u00e0 vous.

m.rc_instruct_3b = Les portes sont des points d'acc\u00e8s aux Rouages. Elles se pr\u00e9\
  sentent sous forme d'ascenseurs, comme ceux que vous avez sous les yeux. Chaque porte est \u00e9quip\u00e9e d'un \u00e9cran affichant son ic\u00f4\
  ne unique et d'un panneau de contr\u00f4le permettant de l'activer. Ces portes vous m\u00e8neront \u00e0 un endroit pr\u00e9\
  cis, mais il en existe d'autres qui conduisent \u00e0 des \u00e9tages en perp\u00e9tuel \
  changement. Vous n'aurez aucun moyen de savoir o\u00f9 vous atterrirez!


r.rc_instruct_3a = J'ai une autre question.

r.rc_instruct_3b = Merci pour ces informations. Je vais m'entra\u00eener!


# Boomer
#...................................................................................................


m.rc_bomb_1a = Avez-vous d\u00e9j\u00e0 pos\u00e9 une bombe? Contrairement aux autres armes, il \
  faut syst\u00e9matiquement les charger. Sinon, elles n'explosent pas. Chargez-les et... BOUM! \
  Elles sont capables de faire des ravages sur des groupes de monstres entiers!

r.rc_bomb_1a = Magnifique! J'en ach\u00e8terai peut-\u00eatre au marchand ambulant.


# Cautious Knight
#...................................................................................................

n.rc_warning = Chevalier prudent

m.rc_warning_1a = En haut de ces marches se trouve Haven. Assurez-vous de parler \u00e0 Virgil \
  avant d'entrer pour savoir quoi attendre.

r.rc_warning_1a = Bien s\u00fbr, je ne manquerai pas d'aller voir Virgil.


# Sleepy Knight
#...................................................................................................

n.rc_sleepy = Chevalier fatigu\u00e9

m.rc_sleepy_1a = Entra\u00eenement... \u00e9reintant... Paupi\u00e8res... lourdes...

r.rc_sleepy_1a = Terminer la conversation


# Virgil
#...................................................................................................


m.rc_virgil_1a = Soyez prudent l\u00e0-bas.

r.rc_virgil_1a = Pourquoi?

m.rc_virgil_2a = Ce passage vous m\u00e8ne \u00e0 travers d'un gouffre massif. Je ne veux pas \
  que vous vous envolez dans l'oubli au-dessous.

r.rc_virgil_2a = Alors, pourquoi le passage est-il ici?

m.rc_virgil_3a = Il semble que le passage vous m\u00e8ne au ascenseur de quelque sort, mais \
  sans l'\u00e9lectricit\u00e9, l'ascenseur ne marche pas.

r.rc_virgil_3a = Je serai prudent.

m.rc_virgil_4a = Bonjour, {0}. Lorsque vous aviez r\u00e9tabli l'\u00e9nergie au camp, cet \
  ascenseur \u00e9tait mis en marche aussi. J'imagine qu'il vous transportera loin dans le \
  gouffre et on ne sait pas ce que vous trouverez l\u00e0-bas.\n\
  \n\
  Si votre but est de descendre aux profondeurs, assurez-vous que vous \u00eates pr\u00eat \u00e0 \
  confronter tous ceux qui vous atteignent.

r.rc_virgil_4a = Terminer la conversation.

m.rc_end_1a = Vous y \u00eates, la recrue. C'est la derni\u00e8re porte, celle qui permet de \
  sortir du Camp de refuge, de franchir le gouffre et de rejoindre Haven. N'oubliez rien, car \
  lorsque vous l'aurez franchie, vous ne pourrez plus revenir dans ce camp. Vous pouvez acheter \
  tous des choses trouv\u00e9es dans le Camp de refuge et beaucoup plus au Haven.\n\
  \n\
  Des questions?

r.rc_end_1a = Oui, j'aimerais vous poser quelques questions.

r.rc_end_1b = J'ai tout compris, merci.

m.rc_end_2a = Que puis-je faire pour vous?

r.rc_end_2a = Une fois au Haven, on ne peut vraiment plus revenir ici?

r.rc_end_2b = Quels d\u00e9fis devrai-je relever derri\u00e8re la derni\u00e8re porte?

r.rc_end_2c = Que devrai-je faire une fois au Haven?

r.rc_end_2d = Je n'ai plus de questions. Au revoir!

m.rc_end_3a = Non, c'est impossible. Une fois au Haven, vous aurez termin\u00e9 l'entra\u00ee\
  nement et votre nouvel objectif sera de pr\u00eater assistance aux Spiral Knights \
  actuellement bas\u00e9s dans la ville.

m.rc_end_3b = La route sera dangereuse, mais vous ne vous enfoncerez pas tr\u00e8s loin. Les \
  monstres que vous rencontrerez ne devraient pas vous poser de probl\u00e8mes. Cela dit, \
  plusieurs \u00e9claireurs nous ont signal\u00e9 un regain d'activit\u00e9 chez les Gremlins \
  du secteur depuis que nous nous y sommes install\u00e9s, alors restez sur vos gardes.

m.rc_end_3c = Lorsque vous serez au Haven, je vous conseille d'explorer la ville et de vous \
  familiariser avec ses monuments et ses lieux. Vous y trouverez de l'\u00e9quipement plus \
  puissant que ce qu'on vend ici et vous y rencontrerez des chevaliers plus exp\u00e9riment\u00e9s. N'h\u00e9sitez pas \u00e0 \
  leur demander de l'aide si vous perdez votre chemin.

r.rc_end_3a = J'ai une autre question.

r.rc_end_3b = Merci. J'irai \u00e0 la porte une fois mes pr\u00e9paratifs termin\u00e9s.

