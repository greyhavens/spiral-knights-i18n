m.mission_researcher_b = Nous sommes isol\u00e9s! Je vous en prie, aidez-nous \u00e0 vaincre ces lichens!
m.mission_researcher_c = Je ne sais pas combien de temps il nous reste avant que notre champ de \
  force tombe...

m.mission_lockedoutknight_a = Merci de votre aide!
m.mission_lockedoutknight_b = Nous \u00e9tions en train de s\u00e9curiser l'ascenseur quand la \
  porte se ferma derri\u00e8re nous.
m.mission_lockedoutknight_c = Merci d'avoir sauv\u00e9 notre \u00e9quipe!

m.mission_lab_bystander_a = Ils sont apparus comme par enchantement...
m.mission_lab_bystander_b = Nos gardes \u00e9taient boulevers\u00e9s. Nous n'avions pas la \
  moindre chance.
m.mission_lab_bystander_c = Nous avons form\u00e9 une barricade autour l'Artifice mais il \u00e9tait envahi. D\u00e9sol\u00e9...

m.seerus_1 = Vous cherchez le pouvoir? La fureur d'une \u00e9toile tenu par l'acier? Je vous \
  montrerai les deux!
m.seerus_defeated = Je pr\u00e9f\u00e8re voir l'Arsenal bruler que le c\u00e9der \u00e0 un autre!

m.mission_cogmaster_1 = Deux canons ont arr\u00eat\u00e9 de tirer! Rapportez, les b\u00e2tards!
m.mission_cogmaster_2 = Plus des intrus dans mon arsenal, hein? Je sais comment traiter des \
  intrus...
m.mission_cogmaster_3 = Vous pensez que vous n'avez qu'ouvrir les portes et entrer? Vous allez \
  souffrir...
m.mission_cogmaster_4 = Qui vous a envoy\u00e9, des assassins de fer? Herex? Je m'en fou! J'ai \
  des moyens de le d\u00e9couvrir...
m.mission_crimson_propaganda_1 = Le Neuf voit le tout, entend le tout.
m.mission_crimson_propaganda_2 = Seulement le Roi Tinkinzar d\u00e9clare la Loi de Fer!
m.mission_explosion_warning = Attention! Explosions d\u00e9tect\u00e9es! \u00c9vacuez imm\u00e9diatement!
m.mission_gatelock_disengage_1 = Verrou de porte 1 d\u00e9clench\u00e9.
m.mission_gatelock_disengage_2 = Verrou de porte 2 d\u00e9clench\u00e9.
m.mission_cogknight_camp_a = Enfin, les renforts de Spiral HQ!
m.mission_cogknight_camp_b = L'un de nos pelotons est arriv\u00e9 \u00e0 l'int\u00e9rieur mais il a \u00e9t\u00e9 isol\u00e9\
  , sauvez-le si vous pouvez!
m.mission_cogknight_camp_c = Il faut qu'on aille en int\u00e9rieur et d\u00e9truise ces cannons!
m.mission_cogknight_camp_d = Soyez prudents, les Gremlins ont bord\u00e9 la place avec le fil \
  de fer barbel\u00e9.
m.mission_cogknight_camp_e = Les Gremlins cachent les explosifs dans ces coffres, je suis \
  certain que lancer quelque chose dans les coffres d\u00e9clencheront ces explosifs!
m.mission_cogknight_camp_f = Soyez prudents l\u00e0-bas!
m.mission_cogknight_battle_a = ... peux pas... continuer...
m.mission_cogknight_battle_b = Nous ne pourrons plus avancer avant que vous d\u00e9truisiez ces pi\u00e8ces d'artillerie!
m.mission_cogknight_battle_c = Rentrez \u00e0 l\u2019int\u00e9rieur, utilisez l'ascenseur... \
  faites sauter ceux qui contr\u00f4lent ces fusils!
m.mission_cogknight_battle_d = Vous l'avez fait! Cette explosion a d\u00e9moli les fusils!
m.mission_cogknight_prisoner_a = Le Warmaster Seerus est fou! Je devrait fuire \u00e0 Emberlight.
m.mission_cogknight_prisoner_b = Je vais \u00e9chapper lorsqu'il est hors de danger. Merci de \
  me sauver!
m.mission_cogknight_ambushed = A-attention... ils... ils sont partout... dans les ombres...!
m.mission_cogknight_camp2_a = Nous avons vu les explosions tout le trajet de camp! \u00c7a c'est \u00e9tonnant!
m.mission_cogknight_camp2_b = Nous ne pourrions pas faire passer cette artillerie sans votre \
  aide!
m.mission_cogknight_camp2_c = Accrochez-vous!
m.mission_cogknight_camp2_d = Nous avons vu que des Gremlins cachent des mines ici, attention \u00e0 la marche!
m.mission_cogknight_camp2_e = Nous allons tenir la ligne!
m.mission_cogknight_camp2_f = Glissez-vous et allez \u00e0 l'int\u00e9rieur de cette loge du \
  gardien!
m.mission_cogknight_camp2_g = J'esp\u00e8re qu'il y ait une fa\u00e7on d'ouvrir ces portes!
m.mission_cogknight_camp3_a = Nous sommes ici! \u00c7a y est!
m.mission_cogknight_camp3_b = Soyez prudents en affrontant le Warmaster!
m.mission_cogknight_camp3_c = Nous avons pen\u00e9tr\u00e9 ses d\u00e9fenses. Ils sont accul\u00e9s!
m.mission_cogknight_camp3_d = Bonne chance! Nous sommes s\u00fbrs que vous r\u00e9ussirez!
m.mission_cogknight_epilogue_a = Ne vous inqui\u00e8tez pas, Feron sera gu\u00e9ri bient\u00f4t.
m.mission_cogknight_epilogue_b = Imaginez ce qui peut arriver si celui-ci ait \u00e9t\u00e9 d\u00e9cha\u00een\u00e9 sur Haven...
m.mission_cogknight_epilogue_c = Nous sommes victorieux!
m.mission_cogknight_epilogue_d = Nous n'avons pas retrouv\u00e9 le corps de Seerus, mais \
  personne ne pourrait \u00e9chapper cette explosion...
m.mission_cogknight_epilogue_e = Il prendra tous le temps dans le monde pour d\u00e9chiffrer \
  cette cryptographie gremlin...

m.mission_apocrea_warden = Si vous continuez, prenez garde. Je crois qu'il y a une pi\u00e8ge.

m.och_leader_1_1a = Bienvenue, {0}! Je suis heureux que Spiral HQ a envoy\u00e9 plus des \
  renforts, et de bonne heure! Nous sommes coinc\u00e9s et nous avons besoin votre aide!
r.och_leader_1_1a = Comment puis-je aider, Lieutenant?
m.och_leader_1_2a = Notre progr\u00e8s a \u00e9t\u00e9 arr\u00eat\u00e9 \u00e0 cause de \
  l'artillerie sur les murs de laquelle nous pr\u00e9vient d'avancer. Plus t\u00f4t, nous avons organis\u00e9 \
  une diversion pour permettre un escadron d'avancer et faire taire cette artillerie... mais il \
  para\u00eet qu'ils ont \u00e9chou\u00e9. Maintenant, ils sont coinc\u00e9s l\u00e0 et nous sommes coinc\u00e9s ici!\n\
  \n\
  Vous devez d\u00e9gager un chemin \u00e0 travers les lignes de front, allez \u00e0 l'int\u00e9rieur du centre de contr\u00f4\
  le d'artillerie et trouvez un chemin de d\u00e9truire ces canons pour de bon! Pendant ce \
  temps, je r\u00e9organiserai les troupes pour que nous vous suivions votre assaut. Bonne \
  chance, soldat!
r.och_leader_1_2a = Je ne vous d\u00e9cevrai, Lieutenant.

m.och_leader_2_1a = Bravo {0}! C'est comme une bonne spectacle des feux d'artifices! Gr\u00e2ce \u00e0 \
  vous, nous avons ouvert une passage \u00e0 la zone d\u2019atterrissage et d\u00e9m\u00e9nag\u00e9 notre base d'op\u00e9ration jusqu'aux barri\u00e8res d'int\u00e9rieur!
r.och_leader_2_1a = Et maintenant, Lieutenant?
m.och_leader_2_2a = Ces roues dent\u00e9es nous bloquent. Selon les rapports, la seule fa\u00e7on de d\u00e9\
  bloquer le chemin est en s'infiltrant les deux loges du gardien avant d'ouvrir les portes. Je \
  ne perdrai plus des vies en abattant le front de la loge du gardien. Vous devez retrouver un \
  chemin autour la loge. Prot\u00e9gez-vous, entrez la loge et ouvrez les portes!
r.och_leader_2_2a = Les portes sont ouvertes, Lieutenant!

m.och_leader_3_1a = (Il semble que Lieutenant Feron soit bless\u00e9)\n\
  \n\
  Vous voil\u00e0, {0}, vous \u00eates ici pour le grand finale, hein?

r.och_leader_3_1a = \u00c7a va, Lieutenant?

m.och_leader_3_2a = C'est la faute des monstres invisibles! Ils ont apparu du noirceur et ont \
  organis\u00e9 une embuscade. Quand je mets la main sur Seerus je... argh!\n\
  \n\
  (Feron s'effondre. C'est clair qu'il est plus bless\u00e9 qu'on croit.)\n\
  \n\
  Fut... je ne peux plus tenir mon \u00e9p\u00e9e...

r.och_leader_3_2a = Lieutenant, je crois que vous-

m.och_leader_3_3a = Oui, il semble que je ne puisse plus livrer une bataille. C'est \u00e0 \
  vous, {0}. C'est vous qui poss\u00e8de la force \u00e0 confronter Seerus et de l'amener \u00e0 \
  la justice. Trop de chevaliers ont trouv\u00e9 ses morts aujourd'hui. Honorez ses esprits en \
  finissant ce travail!

r.och_leader_3_3a = Affirmatif, Lieutenant. Le Warmaster payera.

m.och_leader_4_1a = {0}! Je peux \u00e0 peine croire que vous avez confront\u00e9 le Warmaster lui-m\u00eame et \u00e9chapp\u00e9 \
  ce brasier en vie! Vous avez l'\u00e9toffe d'un vrai h\u00e9ros!

r.och_leader_4_1a = Vous avez l'air d'\u00eatre gu\u00e9ri, Lieutenant.

m.och_leader_4_2a = Avec l'aide des Biotechs, je dois \u00eatre gu\u00e9ri et pr\u00eat pour \
  mon devoir. {0}. Je ne peux pas insister sur l'importance de cette victoire pour tous les \
  Spiral Knights. Vous nous avez aid\u00e9 \u00e0 donner un grand coup au Crimson Order en d\u00e9\
  truisant leur Grand Arsenal.\n\
  \n\
  Gr\u00e2ce \u00e0 vous, les gremlins n'auront plus ces machines de guerre pour quelques \
  temps. Et avec nos Techniciens qui \u00e9tudient ceux qui sont disponibles dans les quartiers \
  personnels de Seerus, nous pouvons obtenir des aper\u00e7us pr\u00e9cieux sur les \
  technologies de gremlin... peut-\u00eatre aussi les locations d'autres membres du Crimson \
  Order!

r.och_leader_4_2a = C'\u00e9tait un honneur de vous aider.

m.och_leader_4_3a = Prenez le temps pour rester et jouissez de la victoire. Sans doute, Spiral \
  HQ vous appelera encore!

r.och_leader_4_3a = \u00c0 la prochaine, Lieutenant.

