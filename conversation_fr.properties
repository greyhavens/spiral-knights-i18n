  missiles fraternels.
# IMAGE: codex_roarmulus_twins.png

n.monster_codex_vanaduke = Volume monstrueux:
m.monster_codex_vanaduke = Lord Vanaduke\n\
  On connait peu sur le Duc \u00e9ternel d'Empire Almirien. Nos d\u00e9tecteurs nous montrent \
  que la masque est une source de puissance ainsi qu'une possible faiblesse.
# IMAGE: codex_vanaduke.png

n.monster_codex_battlepod = Volume monstrueux:
m.monster_codex_battlepod = Battlepod\n\
  Ces automates immobiles cachent un petit arsenal sous leur armure blind\u00e9. Vous vous grattez la t\u00ea\
  te car chaque Battlepod a un unique combinaison d'attaques et d\u00e9fenses.
# IMAGE: codex_battlepod.png

