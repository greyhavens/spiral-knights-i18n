# Lab, Post-Attack
m.lab_progress_3 = Heureusement, le labo n'est pas consid\u00e9rablement endommag\u00e9. Au moins, l'\u00e9\
  quipement pour maintenir nos sprites de bataille est encore intact.

m.lab_progress_4 = Nous avons doubl\u00e9 le nombre de patrouilles au Haven en cas d'une autre \
  attaque, mais j'ai le mauvais pressentiment que ces gremlins ont d\u00e9j\u00e0 ce qu'il voulaient...

m.lab_progress_5 = \u00c7a peut prendre de temps pour faire marcher tous nos \u00e9quipments.

# Royal Jelly
m.lab_progress_6 = Ce palais blobeux... quelle place bizarre. Alors, je me demande quel \u00e9\
  tait l'appareil vous avez trouv\u00e9 dans le palais? \u00c7a n'a pas l'air d'\u00eatre cr\u00e9\u00e9 par les \u00eatres comme les blobeux.

m.lab_progress_7 = De temps \u00e0 l'autre, j'ai rarement retrouv\u00e9 des blobeux qui ne nous \
  attaquaient pas \u00e0 vue. J'enl\u00e8ve les piques de ceci maintenant. Ils sont un petit \
  peu mignons quand ils n'essayent pas de vous empaler!

# Roarmulus
m.lab_progress_8 = Ce gremlin est de la colonie d'Emberlight, dans les profondeurs des Rouages. \
  Ils sont un groupe de parias qui d\u00e9fiaient le Roi Tinkinzar et l'Ordre Incarnat. Nous \
  esp\u00e8rons que nous pouvons signer un trait\u00e9 avec eux pour que nous utilisions leur \
  colonie comme une base d'op\u00e9rations pour nos missions dans le souterrain.

m.emberlight_visitor_1a = Gremlins d'Emberlight te remercier pour avoir arr\u00eater cette menace.

r.emberlight_visitor_1a = Continuer

m.emberlight_visitor_2a = Mais je t'avertir! L'Ordre Incarnat pas arr\u00eater avec Projet \
  Roarmulus. L'Ordre Incarnat souhaiter d\u00e9truire tous ennemis. Grands, petits, et parias. \
  Tous ennemis d'Ordre Incarnat!

r.emberlight_visitor_2a = Merci pour l'avertissement, Pakrat.

m.emberlight_visitor_3a = T'aider \u00e0 quelque chose?
r.emberlight_visitor_3a = Dites-moi \u00e0 propos d'Emberlight.
r.emberlight_visitor_3b = Pourquoi le roi Tinkinzar essaie de d\u00e9truire Haven?
r.emberlight_visitor_3c = J'ai assez d'info, merci. (Terminer la conversation)

m.emberlight_visitor_4a = Emberlight fonder par parias gremlins du Grande Colonie. Gremlins \
  d'Emberlight n'ob\u00e9ir pas Loi de Fer, donc fuir ou mourir. Nous recommencer dans \
  Emberlight. Nouvelle colonie est maison pour nous: plupart d'ex-intriguants, quelques \
  marchands, quelques guerriers, tous tra\u00eetres dans les yeux de gremlins de Grande \
  Colonie.

r.emberlight_visitor_4a = Une question de plus, Pakrat.

m.emberlight_visitor_4b = Personne ne sait vraiment. Tinkinzar pas vu pour beaucoup beaucoup \
  d'ann\u00e9es. L'Ordre Incarnat ex\u00e9cuter plans de Tinkinzar pour Cradle. Emberlight est \
  malheur de plan original parce que c'est fond\u00e9 par parias. Haven peut-\u00eatre m\u00eame chose, fond\u00e9 \
  pas par Gremlins. Pas part de plan!

# Vanaduke
m.lab_progress_9 = Un autre bizarre appareil! Ceci n'\u00e9tait pas fabriqu\u00e9 par les \
  Almirians, comme le dernier truc n'\u00e9tait pas cr\u00e9\u00e9 par les blobeux. Cependant, \
  nous avons remarqu\u00e9 une chose: cet appareil est encore en marche. De plus, l'indication \
  d'\u00e9nergie ressemble les indications que nous avons recherch\u00e9es sur l'Artifice avant \
  le vol. Je crois que \u00e7a vaut plus de recherche.

m.almire_historian_1a = Nous avons recouvr\u00e9 ceux qui restaient dans Ch\u00e2teau Owlite \
  concernant le Royaume d'Almire. Unis avec les petits bouts que nous avions re\u00e7us de \
  sprites de nature dans la Citadelle Feurieuse, nous comprenons mieux sur l'histoire d'Almire.

r.almire_historian_1a = Qu'est-ce que vous avez appris \u00e0 propos d'Almire?

m.almire_historian_2a = Gr\u00e2ce aux tomes que nous avons r\u00e9cup\u00e9r\u00e9es, nous \
  avons appris que la Citadelle Feurieuse a une fois fait partie d'un plus grand royaume nomm\u00e9 \
  Almire il y a mille ans. Bien qu'il f\u00fbt entour\u00e9 d'autres nations agressives, Almire \u00e9tait renomm\u00e9 pour leur habilet\u00e9 \
  excellente de ses nombreux l\u00e9gions. Ces l\u00e9gions ont bien gard\u00e9 le royaume pour \
  un grand nombre d'ann\u00e9es. H\u00e9las, \u00e7a ne suffisait pas.

r.almire_historian_2a = Qu'est-ce qui passait avec le reste du royaume?

m.almire_historian_3a = Alors, nous connaissons maintenant qu'il y avait des citadelles \
  massives logeant les forces arm\u00e9es et les grandes propri\u00e9t\u00e9s pour ces chambres \
  nobles. Il devait \u00eatre spectaculaire \u00e0 voir. On pr\u00e9sume que ailleurs, le reste \
  du royaume est encore une ruine fumante. C'est possible que quelque parts ont surv\u00e9cus... mais \u00e9tant donn\u00e9 \
  les preuves anecdotiques, nous croyons que l'id\u00e9e est, au mieux, improbable.

# Biscotti, Lab Pre-Selection
#...................................................................................................

m.lab_biscotti_1a = Salut toi! Je m'appelle Biscotti, Chef de cuisine du Skylark! J'\u00e9\
  talonne encore la machine d'alchimie pour nourrir les sprites de bataille, alors viens me \
  revoir plus tard.

r.lab_biscotti_1a = Les sprites de bataille mangent de la nourriture?

m.lab_biscotti_2a = C'est \u00e7a! Un sprite de bataille synth\u00e9sise des mati\u00e8res en \u00e9nergie. Cette machine-l\u00e0 prend des mat\u00e9riaux sp\u00e9\
  cifiques, puis les transforme en nourriture extra sp\u00e9ciale pour les sprites... lorsque \
  la machine est calibr\u00e9e, enfin.

r.lab_biscotti_2a = Je reviens plus tard. \u00c0 plus.

# Biscotti, Lab Post-Selection
#...................................................................................................
m.lab_biscotti_3a = Salut, {0}! Comme la Chef de cuisine du Skylark, je suis aussi la \
  surveillante du d\u00e9veloppement de nutrition pour nos nouveaux compagnons sprites. Il \
  semble qu'ils vraiment se diversifiaient dans les Rouages. Leur d\u00e9veloppement sera \
  tellement int\u00e9ressant \u00e0 voir.\n\
  \n\
  As-tu des questions sur la nourriture et comment prendre soin de votre sprite?

m.lab_biscotti_3aa = As-tu des questions sur la nourriture et comment prendre soin de votre \
  sprite de bataille?

r.lab_biscotti_3a = Comment puis-je nourrir mon sprite de bataille?
r.lab_biscotti_3b = Dites-moi \u00e0 propos d'appetits.
r.lab_biscotti_3c = Dites-moi \u00e0 propos des items pr\u00e9f\u00e9r\u00e9s.
r.lab_biscotti_3d = Dites-moi \u00e0 propos des items n\u00e9cessaires.
r.lab_biscotti_3e = Je n'ai rien \u00e0 poser pour l'instant, merci.

m.lab_biscotti_4a = Nourrir ton sprite de bataille, c'est facile! Ouvre ton interface de sprite \
  de bataille et sel\u00e9ctionne ton ic\u00f4ne de sprite. L\u00e0, tu peux choisir un mat\u00e9\
  riau pour le mettre sur le plateau de nourriture.\n\
  \n\
  Lorsque le mat\u00e9riau est pr\u00e9par\u00e9 pour le sprite \u00e0 synth\u00e9siser, clique sur \u00abNourrir le sprite\u00bb, et bon appetit!

r.lab_biscotti_4a = J'ai des autres questions.
r.lab_biscotti_4aa = C'est tout pour l'instant, merci!

m.lab_biscotti_4b = Pour une dur\u00e9e sp\u00e9cifi\u00e9e, les sprites ont peu d'app\u00e9tit \
  lequel limite la quantit\u00e9 de mat\u00e9riaux qu'ils peuvent manger. Quand vous nourrissez \
  votre sprite avec un mat\u00e9riau, son appetit diminuera. Une fois diminu\u00e9, vous ne \
  pouvez pas le nourrir.

r.lab_biscotti_4b = Pour mon sprite, comment le mettre en app\u00e9tit?

m.lab_biscotti_5b = Le sprite s'ouvrira l'app\u00e9tit apr\u00e8s quelques temps s'est pass\u00e9\
  , mais c'est lent. Pour le mettre en app\u00e9tit plus rapidement, emm\u00e8ne-le aux \
  Rouages. Absorber la chaleur en tuant des monstres, c'est comment on d\u00e9pense des calories!

m.lab_biscotti_4c = \u00c0 n'importe quel temps, un sprite a un \u00abitem pr\u00e9f\u00e9r\u00e9\u00bb, un sp\u00e9cial mat\u00e9\
  riau qu'il toujours adore manger. C'est une g\u00e2terie pour le sprite et \u00e7a lui donne \
  beaucoup de chaleur.

r.lab_biscotti_4c = D'o\u00f9 est-ce qu'on acquiert ces items?

m.lab_biscotti_5c = Les items pr\u00e9f\u00e9r\u00e9s sont fabriqu\u00e9s en utilisant la \
  machine d'alchimie que tu vois ici. Elle prend deux d'un mat\u00e9riau et quelques min\u00e9\
  raux venant des Rouages. C'est facile!

m.lab_biscotti_4d = Les items n\u00e9cessaires s'apparaitront lorsque votre sprite est pr\u00eat \u00e0 \
  passer au prochain niveaux. Apr\u00e8s avoir consomm\u00e9 assez de chaleur, une notification \u00abmat\u00e9riau n\u00e9cessaire\u00bb \
  s'apparaitra au-dessous le plateau. Le sprite DOIT manger ce mat\u00e9riau afin d'avancer.

r.lab_biscotti_4d = Continuez

m.lab_biscotti_5d = La plupart de temps, c'est seulement un item pr\u00e9f\u00e9r\u00e9, mais \
  lorsque ton sprite est pr\u00eat \u00e0 \u00e9voluer, il n\u00e9cessite un Evo Catalyst.

# Riley, Harness Merchant
#...................................................................................................
m.lab_harness_1a = Je m'appelle Riley, l'assistant de Morlin. Je suis en train d'inventer une m\u00e9\
  thode de rendre les sprites plus forts. Venez me revoir lorsque vous avez un sprite unis en \
  permane avec vous-m\u00eame.

r.lab_harness_1a = Je reviens plus tard, merci.

# Morlin, Sprite Tutorial
#...................................................................................................
m.sprite_tut_1a = Bonjour, {0}. J'imagine que vous avez des questions sur les sprites de \
  bataille. Comment puis-je vous aider?
m.sprite_tut_1aa = Plus des questions sur les sprites de bataille? Comment puis-je vous aider?

r.sprite_tut_1a = Comment les sprites \u00e9voluent-ils et augmente son niveau?
r.sprite_tut_1b = Dites-moi \u00e0 propos des comp\u00e9tences de sprite.
r.sprite_tut_1c = Qu'est-ce que les harnais sprite?
r.sprite_tut_1d = Qu'est-ce que les b\u00e9n\u00e9fices?
r.sprite_tut_1e = Je n'ai rien \u00e0 poser pour l'instant, merci.

m.sprite_tut_2a = Les sprites de bataille passent \u00e0 nouveau niveau en acqu\u00e9rant de la \
  chaleur, comme les armes et \u00e9quipements. Il y a deux fa\u00e7ons pour les sprites d'acqu\u00e9\
  rir la chaleur: en l'absorbant quand vous vous battez dans les Rouages, et en consommant des \
  mat\u00e9riaux, puis les synth\u00e9siser en chaleur.

r.sprite_tut_2a = Continuez

m.sprite_tut_3a = Pour le faire passer au prochain niveaux plus rapidement, nourrissez votre \
  sprite avec des mat\u00e9riaux. Parlez \u00e0 Biscotti dans le lab pour en savoir plus.

r.sprite_tut_3a = Et comment mon sprite \u00e9volue-t-il?

m.sprite_tut_4a = Votre sprite \u00e9voluera en le passant au prochain niveau. Aux certains \
  niveaux, votre sprite aura besoin d'un Evo Catalyst \u00e0 manger afin de passer au prochain \
  niveau. Lorsqu'il est nourri, votre sprite changera sa forme!\n\
  \n\
  Il sera int\u00e9ressant \u00e0 voir comment ces nouveaux \u00e9tranges sprites de bataille \u00e9volueront.

r.sprite_tut_4a = J'ai des autres questions.
r.sprite_tut_4aa = C'est tout pour l'instant, merci!

m.sprite_tut_2b = En tant que les sprites augmente son niveau, ils apprennent des nouvelles \
  comp\u00e9tences de combat ainsi que les points de comp\u00e9tences.

r.sprite_tut_2b = Continuez

m.sprite_tut_3b = Chaque sprite de bataille apprendra trois comp\u00e9tences qu'on peut \
  utiliser en combat. Les comp\u00e9tences sont appris automatiquement aux certains niveaux \
  pendant que le sprite devient plus fort.\n\
  \n\
  Les comp\u00e9tences de combat deviendra plus puissantes avec des points de comp\u00e9tence.

r.sprite_tut_3b = Continuez

m.sprite_tut_4b = Les points de comp\u00e9tences sont gagn\u00e9s r\u00e9guli\u00e8rement \
  pendant que le sprite s'atteint le prochain niveau. On peut distribuer les points aux comp\u00e9\
  tences dans l'interface sprite.\n\
  \n\
  Quand on d\u00e9pense un point de comp\u00e9tence, on doit choisir un aptitude \u00e0 augmenter, comme la r\u00e9\
  duction de temps d'attente ou augmenter les d\u00e9g\u00e2ts.

r.sprite_tut_4b = Continuez

m.sprite_tut_5b = Et ne vous inqui\u00e9tez pas, il n'y a aucune m\u00e9thode \u00abincorrecte\u00bb \
  pour distribuer les points de comp\u00e9tence, parce que vous gagnerez assez de points pour \
  maximiser tous les comp\u00e9tences!

r.sprite_tut_5b = Continuez

m.sprite_tut_6b = Lorsque vous avez d\u00e9pens\u00e9 tous vos points de comp\u00e9tences, vous \
  commencerez \u00e0 sel\u00e9ctionner les \u00abcomp\u00e9tences ultimes\u00bb. Pour chaque comp\u00e9\
  tence de sprite, il y a deux options pour une comp\u00e9tence ultime.

r.sprite_tut_6b = Continuez

m.sprite_tut_7b = Vous pouvez choisir une comp\u00e9tence ultime pour chaque comp\u00e9tence de \
  sprite, alors choisissez bien! Veuillez remarquer que en sel\u00e9ctionnant des certaines \
  comp\u00e9tences ultimes, la forme de votre sprite sera chang\u00e9e aussi.\n\
  \n\
  Avec tous ces options, votre sprite aura un look diff\u00e9rent et se comportera uniquement \
  lorsqu'il atteint le niveau maximum!

r.sprite_tut_7b = J'ai des autres questions.
r.sprite_tut_7bb = C'est tout pour l'instant, merci!

m.sprite_tut_2c = Tous les sprites de bataille portent un harnais m\u00e9canique qui aligne un \
  type de dommage \u00e0 leur comp\u00e9tences. Cependant, les harnais ne sont pas une taille \
  unique. Par exemple, un drakon ne peut pas faire des d\u00e9g\u00e2ts per\u00e7ants.\n\
  \n\
  Par d\u00e9faut, vous avez un Iron Harnais que tous les sprites peuvent porter. Si vous \
  aimeriez varier le type de dommage comme lesquelles vous faites avec vos armes, vous devez \
  acheter des nouveaux harnais.

r.sprite_tut_2c = O\u00f9 puis-je acheter plus des harnais?

m.sprite_tut_3c = Pour acheter des nouveaux harnais, allez parler \u00e0 Riley dans le Lab. \
  Lorsque l'harnais est achet\u00e9, l'harnais est ajout\u00e9 automatiquement \u00e0 votre \
  liste d'harnais dans l'interface sprite de bataille.\n\
  \n\
  De plus, quand vous achetez une am\u00e9lioration d'un harnais, elle remplacera l'harnais inf\u00e9rieur.

r.sprite_tut_3c = Continuez

m.sprite_tut_4c = Les am\u00e9liorations d'harnais valent les crowns, bien s\u00fbr. Les \
  versions d'harnais sup\u00e9rieures r\u00e9duisent le temps d'attente pour les comp\u00e9tences!

r.sprite_tut_4c = J'ai des autres questions.
r.sprite_tut_4cc = C'est tout pour l'instant, merci!

m.sprite_tut_2d = Aux certains niveaux, les sprites de bataille gagneront des b\u00e9n\u00e9fices, lesquels on peut \u00e9\
  quipper dans l'interface sprite. Les b\u00e9n\u00e9fices fournissent des bonus \u00e0 vos stats.

r.sprite_tut_2d = Continuez

m.sprite_tut_3d = Les b\u00e9n\u00e9fices sont d\u00e9bloqu\u00e9s au hasard. Certains de b\u00e9n\u00e9\
  fices sont plus rares que les autres et le sprite doit avoir un haut niveau afin de d\u00e9bloquer le tout.\n\
  \n\
  Vous pouvez gagner des b\u00e9n\u00e9fices m\u00eame apr\u00e8s avoir atteint le niveau 100!

r.sprite_tut_3d = J'ai des autres questions.
r.sprite_tut_3dd = C'est tout pour l'instant, merci!

