## FIRESTORM CITADEL

# Lost Soul 1: Greeter
#...................................................................................................

n.fc_greeter = \u00c2me perdue

m.fc_greeter_1 = Prenez garde, ce pays maudit regorge de p\u00e9rils. Vous avez devant vous les \
  portes de Citadelle Feurieuse, qui \u00e9tait autrefois le c\u0153ur du grand royaume \
  d'Almire. Depuis, ces terres ont \u00e9t\u00e9 d\u00e9vast\u00e9es par le feu et le mal. \n\
  \n\
  Fuyez si vous tenez \u00e0 la vie.

r.fc_greeter_1 = Je n'ai pas fait tout ce chemin pour tourner les talons ici.

m.fc_greeter_2 = Je vous souhaite une mort rapide.

r.fc_greeter_2 = Terminer la conversation


# Lost Soul 2: Bridge End
#...................................................................................................

n.fc_bridge = \u00c2me perdue

m.fc_bridge_1 = Rares sont ceux qui parviennent \u00e0 franchir ce pont. Vous avez une petite \
  chance de survivre, ou peut-\u00eatre pas... Non, m\u00eame les Sprites des royaumes inf\u00e9\
  rieurs finiront engloutis dans les flammes de Vanaduke. C'est sans espoir.


r.fc_bridge_1b = Je dois poursuivre ma route.

m.fc_bridge_2 = Le seigneur Vanaduke r\u00e8gne sur ces terres d\u00e9vast\u00e9es. Autrefois \
  roi d'Almire, Vanaduke est aujourd'hui \u00e0 la t\u00eate d'une terrifiante l\u00e9gion dans \
  les cendres de son empire d\u00e9chu. Un conseil, fuyez-le comme la peste.

r.fc_bridge_2 = Je ne suis pas ici pour provoquer ce Vanaduke.

m.fc_bridge_3 = Ce n'est pas \u00e0 vous d'en d\u00e9cider.

r.fc_bridge_3 = Terminer la conversation


# Court Sprite 1
#...................................................................................................


m.fc_court_1 = Vous... vous n'\u00eates pas une \u00e2me perdue. Vous devez avoir beaucoup de \
  ressources pour avoir r\u00e9ussi \u00e0 arriver ici. Aidez-moi, je vous en supplie!

r.fc_court_1 = Mais qui \u00eates-vous?

m.fc_court_2 = Je suis un Sprite, un \u00eatre envoy\u00e9 ici pour \u00e9teindre les flammes d\u00e9\
  moniaques qui consument ce pays. Mais Vanaduke nous a d\u00e9couverts, moi et mes fr\u00e8res, et nous a emprisonn\u00e9s. J'ai r\u00e9ussi \u00e0 m'\u00e9\
  chapper, mais pas les autres. \n\
  \n\
  Cette cour est devenue une v\u00e9ritable prison, des rideaux de flammes noires en bloquent \
  toutes les issues. Seule l'eau tir\u00e9e des puits spirituels est capable d'\u00e9teindre \
  ces flammes: c'est la plus pure des sources, car elle coule directement du domaine de la M\u00e8re Spirituelle.

r.fc_court_2 = Mais ces puits sont \u00e0 sec...

m.fc_court_3 = Sans les Sprites et leurs pouvoirs, l'eau ne coulera plus jamais dans ce royaume \
  tortur\u00e9. La moindre goutte n\u00e9cessite l'ouverture d'un canal t\u00e9l\u00e9pathique avec la M\u00e8re Spirituelle. Le ma\u00ee\
  tre des lieux s'est entour\u00e9 de flammes inextinguibles.

r.fc_court_3 = Je lib\u00e9rerai les Sprites!

m.fc_court_4 = J'admire votre courage. Vous trouverez mes fr\u00e8res un peu partout dans cette \
  cour. Mais faites attention: ils sont gard\u00e9s par les redoutables sbires de Vanaduke, \
  dont certains patrouillent l'all\u00e9e principale. \n\
  \n\
  Apr\u00e8s avoir trouv\u00e9 un Sprite, ramenez-le ici, dans le cercle sacr\u00e9. Il sera s\u00fbrement tr\u00e8s affaibli par la mal\u00e9\
  diction de Vanaduke et aura besoin d'\u00eatre revigor\u00e9. Nous \u00e9tablirons un canal t\u00e9l\u00e9pathique avec la M\u00e8re Spirituelle d\u00e8s que nous serons tous r\u00e9\
  unis pour que l'eau remplisse \u00e0 nouveau les puits.

r.fc_court_4_accept = Lib\u00e9rer 6 Lost Sprites? Je peux faire \u00e7a!
r.fc_court_4 = Ce ne sera pas long.

m.fc_court_5 = Que la M\u00e8re Spirituelle vous prot\u00e8ge.

r.fc_court_5 = Terminer la conversation


# Court Sprite 2
#...................................................................................................

m.fc_court_reminder_1 = Apr\u00e8s avoir trouv\u00e9 un Sprite, ramenez-le ici, dans le cercle \
  sacr\u00e9. Il sera s\u00fbrement tr\u00e8s affaibli par la mal\u00e9diction de Vanaduke et \
  aura besoin d'\u00eatre revigor\u00e9. Nous \u00e9tablirons un canal t\u00e9l\u00e9pathique avec la M\u00e8re Spirituelle d\u00e8s que nous serons tous r\u00e9\
  unis pour que l'eau remplisse \u00e0 nouveau les puits. \n\
  \n\
  Je vous en prie, faite vite!

r.fc_reminder_1 = Terminer la conversation


# Court Sprite 3
#...................................................................................................

m.fc_court_complete_1 = Merci! Gr\u00e2ce \u00e0 vous, le canal que nous avons ouvert avec la M\u00e8\
  re Spirituelle tient bon. \u00c9teignez les flammes noires avec l'eau qui alimente les puits. \
  Vous devrez affronter des flammes et des sbires de Vanaduke \u00e0 profusion pour progresser. \
  Nous ne sommes pas des guerriers, mais nous conjurerons des puits dans certaines zones pour \
  vous aider.

r.fc_court_complete_1 = Votre aide me sera pr\u00e9cieuse. Merci.



## CORE RESEARCH

# Vaelyn
#...................................................................................................

n.parmas_scout = \u00c9claireur de Parma

m.core_lead_1 = Bonjour. Je suis lieutenant Vaelyn, officier en commande des recherches \
  Rouages. Vous \u00eates \u00e9videmment parmi les plus puissants des Spiral Knights pour \
  atteindre ces profondeurs infernaux, mais la puissance seul ne vous suffira plus.

r.core_lead_1 = Quelle est la situation, Lieutenant?

m.core_lead_2 = Nous essayons de trouver un moyen d'activer le Core avec le pouvoir des min\u00e9raux retrouv\u00e9\
  s dans les Rouages. Ces min\u00e9raux sont capables de transformer les Rouages - il ne faut \
  que regarder l'Arcade en Haven! Nous croyons que ce pouvoir pourrait activer le Core et... \
  l'ouvrir.

r.core_lead_2 = Vous voulez l'ouvrir?

m.core_lead_3 = Oui. Le Capitaine Ozlo lui-m\u00eame nous a ordonn\u00e9 de tenir notre \
  position aussi longtemps que possible et d'apprendre ce qu'on peut. Si jamais nous nous \u00e9chapperons de cet plan\u00e8te, \u00e7a sera gr\u00e2ce au Core.  \n\
  \n\
  Je suis convaincue qu'\u00e0 part d'etre une source d'\u00e9nergie, le Core est un genre de \
  centre nerveux pour tout ce qui se trouve dans les Rouages. C'est dans l'air qu'on respire: \
  un sinistre pr\u00e9sage qu'il ne s'agit pas simplement d'un machine.

r.core_lead_3 = Vous disez qu'il est... vivant?

m.core_lead_4 = Je dis qu'on sait tr\u00e8s bien que cet monde n'est pas naturel, et moi? Moi, \
  je ne crois pas que ces hordes de gremlins mis\u00e9rables, peu importe comment ils \
  travaillent forts, auront pu construire un monde entier. Ils ont d\u00fb avoir de l'aide \
  parvenant de quelque chose beaucoup plus puissant qu'eux, et qui demeure peut-\u00eatre en dedans du Core. \n\
  \n\
  L'escadrille Alpha, c'est la m\u00eame chose! Ils ne seraient pas simplement disparus, m\u00ea\
  me aux profondeurs des Rouages! Ils \u00e9taient nos meilleurs chevaliers. C'est ce Core qui \
  les a engloutis.

r.core_lead_4 = Mais je pensais qu'il n'y avait aucun moyen de le franchir?

m.core_lead_5 = Je ne sais pas, mais ils ont d\u00fb en trouver un. Ils ont d\u00fb... et \
  maintentant ils ont disparus.

r.core_lead_5 = Terminer le conversation


# Technician
#...................................................................................................

n.core_tech = Technicien

m.core_tech_1 = Bienvenue du camp de recherches Core sur place! Apportez-vous des nouvelles de \
  la surface?

r.core_tech_1 = Comment puis-j'aider?

m.core_tech_2 = C'est facile, \u00e7a. Continuez \u00e0 r\u00e9colter les min\u00e9raux dans \
  les Rouages et fournissez l'\u00e9nergie aux portes dans l'Arcade. Il faut que nous examinons \
  comment l'\u00e9nergie min\u00e9rale affecte le Core. Le probl\u00e8me, c'est que si peu d'\u00e9nergie p\u00e9n\u00e8\
  tre jusqu'ici. Nous pouvons seulement recueillir quelques donn\u00e9es chaque fois qu'une \
  porte se lance.

r.core_tech_2 = Autre chose?

m.core_tech_3 = De l'air frais? De la chaleur? On ne peut plus se tenir dans l'environnement \u00e0 \
  ces profondeurs, mais le lieutenant insiste qu'on doit continuer, que peut-\u00eatre les prochaines donn\u00e9\
  es seront celles qui nous fournissent avec la r\u00e9ponse dont on en a besoin. \n\
  \n\
  Impossible de dire que le lieutenant n'est pas d\u00e9vou\u00e9. Je ne pense pas l'avoir vu \
  dormir le long de notre s\u00e9jour.

r.core_tech_3 = Je continuerai d'explorer les Rouages et de r\u00e9colter les min\u00e9raux que n\u00e9cessite vos recherches.

# Rank 10+
#...................................................................................................
m.mission_crimson_chaos_recon_1 = Salutations! Quand j'ai entendu qu'ils vous appelaient, {0}, \
  je n'arrivais pas \u00e0 y croire. LE vainqueur de Vanaduke! C'est un honneur de rapporter \u00e0 vous.
r.mission_crimson_chaos_recon_1 = Qu'est-ce que vous avez trouv\u00e9?
m.mission_crimson_chaos_recon_2 = Mais c'est \u00e7a, {0}, rien. Nous avons surveill\u00e9 la \
  base pendant des semaines avant qu'elle s'est tu. Soudainement, en fait. Nous ne savons pas \
  ce que vous allez trouver l\u00e0-bas. Nos d\u00e9tecteurs n'indiquent aucune forme de vie.
r.mission_crimson_chaos_recon_2 = Merci pour les renseignements. Je vais l'examiner.

m.mission_camefrombelow = Personne n'est plus ici. Il... il venait de sous-sol.

# Unnamed NPCs
#...................................................................................................

m.core_resting_1 = Ne t'inqui\u00e8te pas. Il va s'en sortir.

m.core_resting_2 = J'attends avec impatience pour retourner \u00e0 Haven...

m.core_resting_3 = J'ai h\u00e2te \u00e0 ce que les provisions arrivent.

m.core_guard_1 = Vous devriez parler avec Vaelyn.

m.core_guard_2 = Avez-vous apport\u00e9 des provisions?

m.core_busy_1 = D\u00e9sol\u00e9, pas de temps de bavarder.


m.barracks_booster_1 = Vous voulez gagner encore plus de Krogmo Coins par partie?

m.barracks_booster_2 = Achetez un Krogmo Coin Booster chez le marchand d'am\u00e9liorations!

## RETURN TO FIRESTORM CITADEL


m.rfc_court_1a = Content de vous revoir, chevalier \u00e9toil\u00e9.
r.rfc_court_1a = \u00c9toil\u00e9?
m.rfc_court_2a = Oui. Nous, les sprites de la nature, sommes la pluie, la racine et la terre. \
  Mais vous n'\u00eates pas comme nous. Vous \u00eates comme les autres au-dessous.
r.rfc_court_2a = Justement, comment puis-j'y arriver? Cette place s'\u00e9coule!
m.rfc_court_3a = Malheureusement, m\u00eame si notre lien avec la M\u00e8re d'Esprit est r\u00e9\
  tabli, il y a une limite \u00e0 ce que nous pouvons sauver. N\u00e9anmoins, si la porte d'un \
  chemin se ferme, une autre peut s'ouvrir. C'est la nature de ce monde mouvant. Courage, \
  chevalier \u00e9toil\u00e9.
r.rfc_court_3a = (Terminer la conversation.)

m.rfc_court_4a = M\u00eame si vous aviez vaincu Vanaduke, il semble que le maudit qu'il a attir\u00e9 au royaume persiste. \u00c7\
  a prend tout de notre pouvoir pour ma\u00eetriser les feux ombreux ravageants.

m.rfc_court_5a = Nous avons tous senti le moment o\u00f9 vous aviez vaincu Vanaduke. L'enti\u00e8\
  re de la citadelle tremblait quand il est tomb\u00e9 et pour un moment, nous avons cru que ce \
  royaume serait d\u00e9truit avec son roi. Marchez avec prudence dans ces corridors, particuli\u00e8rement si ce b\u00e2timent tombe en ruines!

m.rfc_court_6a = Tenez-vous, chevalier. Vous \u00eates dans la cour du Royaume d'Almire. Vous \
  n'entendez pas les trompettes sonnant le retour de nos l\u00e9gions puissantes? Vous n'\u00eates pas impressonn\u00e9 \
  par les blasons prestigieux de nos maisons grandes et hommes d'\u00c9tats?

r.rfc_court_6a = Oui, je les regarde avec admiration.
r.rfc_court_6b = Je ne vois ni entends rien de ces choses-l\u00e0.

m.rfc_court_7a = (Vous sentez une grande fiert\u00e9 venant de ce chevalier tomb\u00e9, mais il \
  ne dit plus et fixe son regard \u00e0 la vie laquelle il voit tout seul.)
m.rfc_court_7b = (Il a l'air que vos mots ne d\u00e9rangent pas le chevalier tomb\u00e9, dont ses pens\u00e9\
  es sont perdues dans quelque part de ces gloires dans sa vie ant\u00e9rieure.)

r.rfc_court_8a = (Terminer la conversation.)

n.rfc_noble_1 = Courtisan perdu
n.rfc_dungeon_1a = Je m'\u00e9ternise dans ces corridors m\u00eame apr\u00e8s des centaines d'ann\u00e9es, priv\u00e9 \
  de ma paix par mon seigneur maudit. Je sens son esprit agrippant encore ce royaume saccag\u00e9\
  . Il ne veut pas partir, donc il nous tous condamne.

n.rfc_noble_2 = Noble emprisonn\u00e9
n.rfc_dungeon_2a = Il y avait mille ans depuis j'ai \u00e9t\u00e9 emprisonn\u00e9 pour s'\u00e9\
  lever contre mon seigneur, condamn\u00e9 de demeurer ici pour vie comme peine. Quand les feux \
  ont pris la citadelle m\u00eame apr\u00e8s ma mort, je n'ai jamais trouv\u00e9 la libert\u00e9. Mon \u00e2me est li\u00e9e \u00e0 ces moellons maudits.

# Scenario NPCs
#...................................................................................................
t.npc_campguard = Gardien du camp
m.npc_campguard_a = Soyez prudent, chevalier.
m.npc_campguard_b = Bienvenue au camp! Asseyez-vous devant le feu de camp si vous voulez un \
  repos.
m.npc_campguard_c = Nous restons ici pour un peu de temps avant de voyager plus profond\u00e9ment dans les Rouages.
m.npc_campguard_d = Je suis en garde. On ne sait jamais quand les monstres nous attaqueront.
m.npc_campguard_e = Bienvenue!

t.npc_veteran = Chevalier v\u00e9t\u00e9ran
m.npc_veteran_a = J'apporte toujours un assortiment d'\u00e9quipement... \u00e0 tous hasard.
m.npc_veteran_b = N'oubliez pas votre bouclier, \u00e7a peut sauver votre vie!
m.npc_veteran_c = Je porte toujours un blaster, on ne sait jamais quand il serait utile.
m.npc_veteran_d = Je dois garder ces nouvelles recrues hors de danger.
m.npc_veteran_e = Une bombe est excellente pour porter un coup contre une foule des monstres.
m.npc_veteran_f = J'apporte une \u00e9p\u00e9e pour des rencontres proches.
m.npc_veteran_g = La pr\u00e9paration est le meilleur outil pour survivre dans les Rouages.
m.npc_veteran_h = Restez ensemble - n'oubliez pas que c'est dangereux d'y aller tout seul!

t.npc_captainknight = Chevalier capitaine
m.npc_captainknight_a = Chevaliers, n'oubliez pas votre entrainement!
m.npc_captainknight_b = Levez votre bouclier pour bloquer des attaques!
m.npc_captainknight_c = N'oubliez pas d'appr\u00eater votre bombe!
m.npc_captainknight_d = Coordonnez vos attaques!
m.npc_captainknight_e = Utilisez l'environnment \u00e0 l'avantage!
m.npc_captainknight_f = Mettez-vous \u00e0 l'abri si on vous envahisse!
m.npc_captainknight_g = N'oubliez pas d'aider votre membres d'escadron!

t.npc_recruit = Recrue
m.npc_recruit_a = J'ai besoin d'un repos avant de continuer.
m.npc_recruit_b = Ai-je oubli\u00e9 mon Calibur \u00e0 la Poste d'arsenal...?
m.npc_recruit_c = Je crois que je dois fabriquer un bouclier am\u00e9lior\u00e9 lorsque je \
  retourne au Haven.
m.npc_recruit_d = C'est ma premi\u00e8re exp\u00e9dition dans les Rouages!
m.npc_recruit_e = As-tu des conseils pour moi?
m.npc_recruit_f = C'est o\u00f9 la s\u00e9curit\u00e9 sur ce truc?
m.npc_recruit_g = T'as vu une salle dangereuse? J'ai entendu qu'elles sont difficiles.

m.npc_survivorknight_a = Ils... ils ont eu tout le monde, mais pas moi. Je me suis cach\u00e9 dans le coin.
m.npc_survivorknight_b = Ils ont jailli du noirceur. On n'avait aucun chance de r\u00e9agir.
m.npc_survivorknight_c = J'n'ai jamais demand\u00e9 \u00e7a.

m.npc_mineraltech_a = Je suis un chercheur de terrain pour Chef Geo Knight Wegner.
m.npc_mineraltech_b = Hum, certains combinaisons semblent attirer certains types de monstres.
m.npc_mineraltech_c = Ne faites aucune attention \u00e0 Hubert, il a \u00e9t\u00e9 d\u00e9-piqu\u00e9.

m.npc_minerknight_a = Vous ne pouvez porter qu'un min\u00e9ral \u00e0 la fois, alors prenez le \
  plus grand min\u00e9ral.
m.npc_minerknight_b = Spiral HQ nous demande de tirer ces min\u00e9rales au Haven.
m.npc_minerknight_c = On dit que ces min\u00e9raux font marcher chaque porte dans l'Arcade.

m.npc_techknight_a = Je collecte des samples de ce stratum.
m.npc_techknight_b = Vous ne pouvez pas avoir trop d'info, comme vous ne pouvez pas avoir trop \
  de dessert.
m.npc_techknight_c = Plus des tests...

m.npc_campknight_a = Asseyez-vous et restez pour un peu.
m.npc_campknight_b = R\u00e9chauffez-vous devant le camp de feu.
m.npc_campknight_c = Je sens que le gel a d\u00e9j\u00e0 diminu\u00e9 de mes mains.

m.npc_graveknight_a = Non, il y en trop... je ne peux pas les battre. Il ne reste que la lumi\u00e8re de bougies. Sans...

m.npc_rummageknight_a = Je sais qu'il \u00e9tait ici...
m.npc_rummageknight_b = Je ne peux pas parler ce moment.

m.npc_supplies_a = Ces provisions sont arriv\u00e9es de bonne heure.
m.npc_supplies_b = Il y a quelques jours que nous avons des provisions frais.
m.npc_supplies_c = Merci de r\u00e9-provisionner notre camp.

m.npc_onwatch_a = Je ne peux pas parler maintenant. Je suis en garde.
m.npc_onwatch_b = Je sais qu'ils retourneront.
m.npc_onwatch_c = Avez-vous vu quelque chose l\u00e0-bas?

m.npc_lostknight_a = Merci de me \u00absauver\u00bb, mais je me sens bien.
m.npc_lostknight_b = C'est bon de savoir que Spiral HQ ne m'a pas oubli.
m.npc_lostknight_c = Je peux partir, mais pensez de tout ce que je pourrais apprendre si je \
  reste ici!

m.npc_teaser_knight = Cette derni\u00e8re mission \u00e9tait une mission bizarre. Nous \u00e9tions en train de d\u00e9\
  gager le chemin vers l'ascenseur quand nous avions vu quelques structures au loin. Nous \
  n'avons pas pu voir comment y aller. Je pense qu'on doit juste de les retrouver au futur. Les \
  Rouages changent toujours, vous savez.
r.npc_teaser_knight = Terminer la conversation.

m.npc_supply_teaser_knight = D\u00e9sol\u00e9, je n'ai pas le temps pour parler. Je dois livrer \
  tous ces provisions au-dessous, jusqu'aux avant-postes. Des gens oublient que notre habilet\u00e9 \
  d'aller loin seront plus limit\u00e9es sans les chevaliers apportant les approvisions dans \
  les Rouages. Quelle ingratitude, hein?

