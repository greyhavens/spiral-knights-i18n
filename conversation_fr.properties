# Snarbolax
m.lab_progress_1 = {0}, je ne doute pas que ces Cloches de b\u00eate \u00e9taient utiles, hein?
r.lab_progress_cont = Continuer
r.lab_progress_end = Terminer la conversation

m.lab_progress_2 = Merci d'avoir vaincu le Snarbolax. Trop de nos \u00e9cuyers ont p\u00e9ri \u00e0 cause de cette b\u00ea\
  te. Je peux rester tranquille maintenant qu'on peut oublier cette menace.\n\
