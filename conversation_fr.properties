m.casino_jelly_a = Glorp! Aval\u00e9 un Crown. Miam.
m.casino_jelly_b = Je reviens du coiffeur, vous l'avez vu?
m.casino_jelly_c = Un jour, je gagnerai assez de fonds pour construire mon propre palais! Glorp \
