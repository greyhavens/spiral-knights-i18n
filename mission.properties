m.welcome_to_haven_b_3a = Great, thanks for being a good ambassador! \n\
	\n\
	I'll contact you again soon, good luck {0}!

r.welcome_to_haven_b_3a = End conversation

m.reporting_duty = Reporting for Duty
o.reporting_duty = Report to Lieutenant Feron in the Haven Arcade
b.reporting_duty = Lieutenant Feron is responsible for overseeing the Clockworks mining operation \
	in the Haven Arcade.  Report to him and learn about the situation in Haven and Spiral HQ's \
	mission to reach the Core of Cradle.

n.reporting_duty = Feron

m.reporting_duty_1a = Well met soldier, and good work on reaching our base camp here in Haven. \
	I'm Lieutenant Feron. I have been assigned by Captain Ozlo to oversee our Clockworks mining \
	operation. \n\
	\n\
	Before you lies "the Arcade," a fascinating complex that serves as our link into the heart \
	of the Clockworks. Since you're new here, I'll give you a quick run-down of what Spiral \
	HQ has us doing here.

r.reporting_duty_1a = Sure sounds important, tell me how it all works.

m.reporting_duty_2a = After the Skylark crashed, its primary tearium core exploded, destroying a \
	portion of the ship and leaving it without a main power source. Since so far we haven't \
	found several hundred tons of tearium just lying around, the bird has effectively \
	lost its wings. \n\
	\n\
	With the help of the Strangers, we were able to set up a small base of operations here in \
	Haven. Once we got our systems online, we discovered that within the heart of this rock \
	resonates a power signature of unprecedented magnitude.

r.reporting_duty_2a = If we could somehow harness that power...

m.reporting_duty_3a = That's exactly right! The Core of the Clockworks could very well contain \
	the energy source we need to create a new power source for the Skylark and restore it to \
	operational condition. There's only one problem- the Clockworks themselves seem to be \
	built like some kind of crazy death trap. \n\
	\n\
	Reaching the Core is not going to be easy...

r.reporting_duty_3a = I'm up to the task!

m.reporting_duty_4a = That's the kind of spirit I like to see. Continue to complete missions for \
	Spiral HQ as they are assigned to you. With your help we stand a chance at reaching the Core \
	and saving Isora.

r.reporting_duty_4a = Roger that, Lieutenant.

m.reporting_duty_5a = Then I now authorize you to take on Arcade Missions.  You can access the \
	Arcade via your Mission interface or approach the gates directly here in the Arcade itself. \
	There is a massive world beneath your feet waiting to be explored.\n\
	\n\
	Good luck to you!

r.reporting_duty_5a = End Conversation

m.go_shopping = Let's Go Shopping!
o.go_shopping = Visit the Haven Bazaar and discover what it has to offer
b.go_shopping = The Haven Bazaar is a place where all manners of item-related goods and services \
	can be found.  Whether you're in the market for a more powerful sword or just want to make \
	your armor stand out in a crowd, it's got what you need!

n.go_shopping = Bechamel
m.go_shopping_1a = Welcome to the Haven Bazaar!  It's a pleasure to meet you {0}, my name is \
	Bechamel. Since I work here in the Bazaar, Spiral HQ has asked me to show new arrivals \
	around this fabulous epicenter of commerce and let them know everything it has to offer. \n\
	\n\
	So let's go on a quick tour shall we?  Try and keep up, I walk fast.

r.go_shopping_1a = Lead the way, Bechamel.
#(move to Quillion)

m.go_shopping_2a = Strangers like Quillion here sell you weapons and armor.  Each one \
	specializes in a particular kind of item, so talk to them and find out what they carry. \
	They're not very chatty, but they always have a fresh stock of items every day! \n\
	\n\
	Just be sure that you've reached the appropriate rank to equip an item!

r.go_shopping_2a = Do Strangers sell anything else besides weapons and gear?

m.go_shopping_3a = I'm glad you asked, they certainly do!  Let's head over to Vatel.

r.go_shopping_3a = (Follow Bechamel)
#(move to Vatel)

m.go_shopping_4a = Vatel here will sell you a selection of recipes as well as personal color \
	changers and other items.

r.go_shopping_4a = Recipes?  For weapons and gear?

m.go_shopping_5a = That's right, you can acquire recipes and materials in order to alchemize \
	weapons and gear at alchemy stations.  Come on, I'll show you one.

r.go_shopping_5a = Roger.
#(move to alchemy station)

m.go_shopping_6a = Here we have an alchemy station that you'll no doubt become very familiar \
	with as you upgrade your arsenal.  But no need to worry about that too much as Spiral HQ is \
	likely to give you a mission later on that explains everything. \n\
	\n\
	Well, that about does it for your first tour.  Do you want me to go over it all again \
	or do you think you've got it?

r.go_shopping_6a = I'd like you to give me the tour once more.
r.go_shopping_6b = I think I've got it Bechamel, thanks!

m.go_shopping_7a = No problem, I've got the time.  Let's start from the top.

r.go_shopping_7a = (Follow Bechamel)
#(starts at Quillion)
m.go_shopping_7b = Wonderful!  I'm glad I could help you get your bearings. \
	Good luck to you, {0}!

r.go_shopping_7b = Thanks Bechamel, I'll be seeing you!

# ----- GO SHOPPING B-TEST -----------------------------------------
m.go_shopping_b = Bazaar Troubles
o.go_shopping_b = Help out a knight in trouble
b.go_shopping_b = The Haven Bazaar is a place where all manners of item-related goods and services \
	can be found. However, there seems to be some kind of commotion just outside the normally \
	bustling marketplace. It looks like there is no time to waste; there is trouble brewing!

n.go_shopping_b = Tylen
m.go_shopping_b_1a = Whew, I'm glad you came along when you did. Those pesky gremlins were \
	going to wreck everything! The bazaar would have been ruined!\n\
	\n\
	Oh right, where are my manners? My name is Tylen, it's a pleasure to meet you, {0}.

r.go_shopping_b_1a = Is everything okay, Tylen?

m.go_shopping_b_2a = It is now. I was just on my way to the bazaar to drop off some supplies \
	when I was ambushed by these gremlins. I thought they were from Emberlight, a colony of \
	gremlin outcasts, but it looks like I was mistaken. \n\
	\n\
	Just to be safe, would you mind helping me get these items to the bazaar?

r.go_shopping_b_2a = Sure, let's head to the bazaar.

m.go_shopping_b_3a = Whew, well that was much faster with you lending a hand, {0}. Listen, if \
	you ever need a guided tour around the bazaar, just come talk to me. I can tell you \
	anything you need to know about the shops and services here. \n\
	\n\
	Have a look around! I'm sure you'll find plenty of interesting items. Thanks again!

r.go_shopping_b_3a = End conversation

m.pumping_up = Pumping Up
o.pumping_up = Visit the Advanced Training Hall and learn some helpful new techniques
b.pumping_up = You are free to use the Advanced Training Hall whenever you like in order to \
	practice with new weapons or learn about other unique features of the Clockworks.  Check \
	it out and see what it has to offer!

n.pumping_up = Konway
# Show image of training hall entrance
m.pumping_up_1a = Hello there, {0}.  The name's Konway.  Spiral HQ says you're in need of some \
	additional pointers to help you out on your upcoming missions.  Care to meet me in the \
	Advanced Training Hall for the rundown?

r.pumping_up_1a = Sure Konway, I'll head right over.

m.pumping_up_2a = Welcome to the Advanced Training Hall, {0}.  Here you will find useful \
	survival tips to help you on your journey through the Clockworks. \n\
	\n\
	Would you like a tour of the facilities?

r.pumping_up_2a = Okay. [Follow Konway]
r.pumping_up_2b = No thanks, I'll wander around on my own.

m.pumping_up_3a = Over here we have a collection of valuable items and objects you will likely \
	find in the Clockworks.

r.pumping_up_3a = Continue

m.pumping_up_4a = Some items can be used to attack monsters, like these vials.  You can practice \
	picking them up and throwing them in this target range here.

r.pumping_up_4a = Continue

m.pumping_up_5a = Along the north wall here we have all sorts of blocks, switches, doors, and \
	buttons from the Clockworks. If you want to overcome the devious and deadly mechanisms \
	down there I suggest you become familiar with how these work!

r.pumping_up_5a = Continue

m.pumping_up_6a = On the east side we have a couple of combat practice rooms. These Training Cubes \
	are mostly harmless and are perfect for experimenting with your weapons and shield techniques!

r.pumping_up_6a = Continue

m.pumping_up_7a = Lastly, we have the trap and hazard rooms. You can come here to see how \
	you can sometimes affect traps and also learn about traps that deal different kinds of damage.

r.pumping_up_7a = Continue

m.pumping_up_8a = Well, that's the end of the tour, {0}. Would you like me to go over that again \
	or are you ready to try everything out for yourself?

r.pumping_up_8a = Let's go over that again. [Restart tour]
r.pumping_up_8b = Nope, I'm ready to go.

m.pumping_up_9a = Okay then, let's start from the top.

# Show image of training hall entrance
m.pumping_up_9b = Great, then I will go ahead and give you credit for this mission. \n\
	\n\
	Remember, if you would like to come back for more training, The Advanced Training Hall is \
	located in Haven Town Square.  Take care out there, {0}.

r.pumping_up_9a = Continue
r.pumping_up_9b = Thanks! I'm off to train. [Complete mission]

m.lab_0 = Laboratory
m.lab_1 = Laboratory
