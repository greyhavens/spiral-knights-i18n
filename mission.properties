# RANK 4-2
m.new_threat = A New Threat
o.new_threat = Confront a dangerous new threat to Haven
b.new_threat = Deadly forces are conspiring against Haven.  Contact Intel Agent Kora and learn \
	about how you can help.

n.new_threat_1 = Kora
m.new_threat_1a = Greetings, {0}!  We have two missions of vital importance.  First, we've \
	located an energy signature similar to the one emanating from that Artifact you found in the \
	Clockworks.  We're homing in on that energy signature now.  Finding the source might help us \
	understand what that gremlin schemer Razwog planned on doing with the Artifact or what the \
	device is actually capable of.

r.new_threat_1a = Continue

m.new_threat_2a = And speaking of gremlins, we're starting to get an alarming number of reports \
	of gremlins mobilizing in the Clockworks below Haven.  We don't have too many details yet, \
	but given the relations we've had with them so far, our guess is they're preparing for \
	an attack.

r.new_threat_2a = Continue

m.new_threat_3a = Spiral HQ believes you are our best choice to help track down the energy \
	signature, since you were the one to bring us the Artifact in the first place.  Rhendon will \
	be dispatched to get on the trail of the gremlins below.

r.new_threat_3a = Continue

m.new_threat_4a = (Kora pauses) \n\
	\n\
	Speak of the devil, Rhendon is calling now; says it's urgent. Patching him through...

r.new_threat_4a = Continue

n.new_threat_2 = Rhendon
m.new_threat_5a = {0}, something big is going down at the Lab.  You need to get here immediately!

r.new_threat_5a = Roger that, I'm on my way!
