n.ranger_leader = Desna

m.p_legion_almire_r4 = Legion of Almire
o.p_legion_almire_r4 = Recover an ancient Almirian codex
b.p_legion_almire_r4 = Warning: This is a Dangerous Mission! \n\
	\n\
	Desna and her Recon Rangers are an elite team tasked with recovering intel from some of the \
	most dangerous levels of the Clockworks.  Joining them could lead to great rewards, but it is \
	guaranteed to be a perilous journey! \n\
	\n\
	Spiral HQ believes that an ancient codex originating from the cursed kingdom of Almire is \
	located somewhere in a dark and terrifying necropolis.  This necropolis is believed to be \
	teeming with all manners of undead monstrosities and only the Recon Rangers have what it \
	takes to get in, acquire the intel and get out alive!

