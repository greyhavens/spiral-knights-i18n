b.p_anniversary_shock_r3 = We've been receiving reports that Groat, a local Emberlight chef \
	has been acting... strange. It seems that Biscotti commissioned him to do some baking \
	on her behalf but the responsibility may have gone to his head.  He disappeared into \
	the Clockworks soon after Biscotti delivered the last crate of batter. With the \
