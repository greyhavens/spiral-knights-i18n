m.p_r4_min = Geological Survey
o.p_r4_min = Gather minerals for Chief Geo Knight Wegner's research.
b.p_r4_min = Chief Geo Knight Wegner is always seeking to further his research on the mysterious \
	minerals that are found in the Clockworks.  The experiments he conducts on his available \
	samples tend to result in their disintegration.  Because of this he's always in need of brave \
	knights to delve into the Clockworks to procure more for samples for him.

m.p_r4_weap_1 = Arms Appropriation
o.p_r4_weap_1 = Deliver the requested item to squad in need.
b.p_r4_weap_1 = Knights that are rescued from gremlin captivity are often left with nothing to \
	show for it other than bad memories of being locked up in a cage and abused by their snarling \
	captors.  Their weapons are always stolen and their gear often damaged by gremlin engineers \
	to prevent any notion of surviving an escape attempt. \n\
	\n\
	In order to get these knights back into their squad ready for battle, Spiral HQ needs other \
	knights with access to ample resources to pitch in and provide them with the necessary \
	weapons and gear.

m.p_r4_weap_2 = Arms Appropriation
o.p_r4_weap_2 = Deliver the requested item to squad in need.
b.p_r4_weap_2 = Knights that are rescued from gremlin captivity are often left with nothing to \
	show for it other than bad memories of being locked up in a cage and abused by their snarling \
	captors.  Their weapons are always stolen and their gear often damaged by gremlin engineers \
	to prevent any notion of surviving an escape attempt. \n\
	\n\
	In order to get these knights back into their squad ready for battle, Spiral HQ needs other \
	knights with access to ample resources to pitch in and provide them with the necessary \
	weapons and gear.

m.p_r4_gate_beast = Nature of the Beast
o.p_r4_gate_beast = Rescue the Geo Knights from the clutches of wild beasts!
b.p_r4_gate_beast = Our Geo Knights risk their lives working in the wilds of the Clockworks.  \
	While their findings are invaluable, they are often stationed in the very heart of wolver \
	territory.  These wild beasts relentlessly stalk our Geo Knights, snatching them in the night \
	when unguarded.  Sometimes, wolvers will form a pack and assault an entire research team.  It \
	is during these times that a talented squad must be called in to save them.

m.p_r4_gate_slime = A Pinch of Salt
o.p_r4_gate_slime = Deliver a shipment of rock salt to the research team stationed in the \
	lichenous lair!
b.p_r4_gate_slime = The best way to keep slimes at bay is with copious amounts of rock salt. \
	Slimes just hate the stuff as touching it makes them dissolve.  It's not pretty. \n\
	\n\
	Research teams stationed in lichenous lairs will often surround their entire camp with rock \
	salt so that they don't end up some slime's dinner.  As you can imagine, they go through the \
	stuff fast.  When they run low, a squad is called in to battle their way to the camp and \
	deliver the life saving seasoning.

m.p_r4_gate_construct = Assault on Machine Shop 13
o.p_r4_gate_construct = Destroy the operational war machines within the ruined factory!
b.p_r4_gate_construct = Gremlins are not very good about cleaning up their messes.  Our Recon \
	Knights will often stumble across what they believe to be decommissioned gremlin weapons \
	factories that are still actively bustling with hostile constructs, and in some cases are \
	even stocked with operational, active war machines! \n\
	\n\
	Spiral HQ has ordered that whenever possible, these factories and their war machines are to \
	be shut down for good to avoid any future casualties.

m.p_r4_gate_gremlin = Hazardous Heist
o.p_r4_gate_gremlin = Steal the gremlin schematics from the gremlin construction site!
b.p_r4_gate_gremlin = Gremlin construction sites often contain valuable schematics of gremlin \
	structures and even weaponry.  Once obtained by Spiral HQ, they provide rare insights into \
	gremlin engineering. \n\
	\n\
	Gremlin schematics are typically stored in terminals somewhere on site.  These terminals are \
	locked down and heavily guarded.  Once you draw the attention of one gremlin, expect the \
	entire crew to come after you!

m.p_r4_gate_fiend = White Collar Captives
o.p_r4_gate_fiend = Free the captured Knights from a fiendish corporate prison!
b.p_r4_gate_fiend = A fiendish city is a strange place that Spiral HQ still does not fully \
	understand.  Devilites are everywhere, and if they see one of their Pit Bosses nearby, they \
	will do anything to look like they're being productive.  Unfortunately, productivity is often \
	defined by attacking or imprisoning intruders, like a squad of knights passing through. \n\
	\n\
	It is unclear what purpose imprisoned knights would ultimately serve in a devilite agenda. \
	Those that have survived captivity have reported that conditions were poor, but the worst of it \
	was the copious amounts of paperwork they had to fill out daily.  This is a fate no knight \
	deserves!

m.p_r4_gate_undead = Scared to Death
o.p_r4_gate_undead = Save the lost Knight from joining the ranks of the dead in the haunted manor!
b.p_r4_gate_undead = The ruins of Owlite castles are dark and cursed places that are swarming \
	with legions of undead spookats.  The worst of these, the seemingly invincible grimalkins, \
	constantly lurk in the shadows, awaiting the moment your life-saving light is finally snuffed \
	out. \n\
	\n\
	Some knights succumb to the darkness and become paralyzed with fear in these shadowy realms. \
	The only thing that can save them are brave knights who have long lost their childhood fears \
	of the dark and all the terrible creatures that lurk within.

