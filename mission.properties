m.ghost_machine_1a = Listen up, Rangers! Spiral HQ has received a very cryptic distress signal from \
	some completely unknown facility deep within the Clockworks. \n\
	\n\
	The way I figure, we're about to dive head first into either a perilous rescue mission or a death trap. \
	Either way, your means of resolving the situation resides in your arsenal right now. So get geared up, \
	and get ready for combat. \n\
	\n\
	Let's ride, Rangers!

