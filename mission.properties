# Winterfest Danger Mission Event 7,9
#..................................................................................................
m.p_winterfest_danger_r7 = Grinchlin Assault!
o.p_winterfest_danger_r7 = The Grinchlins have sabotaged Winterfest for the last \
	time. Take the fight to them!
b.p_winterfest_danger_r7 = Warning: This is a Dangerous Mission! \n\
	\n\
	On behalf of Impostoclaus, Spiral HQ has located the base of operations of the nefarious \
	Grinchlins. It's time to take the fight to them and end their Winterfest terrorism once and \
	for all. But it won't be an easy task. \n\
	\n\
	Those who accept this mission must climb Mount Krampus, a perilous trek filled with \
	Grinchlin ambushes and icy deathtraps. Along the way you will find shelters that allow you \
	to collect Grinchlin treasures and escape the mountain, or press on toward the summit for \
	even greater rewards! Just be warned: Grinchlins and their allies are a stingy lot and will \
	not drop ANY loot. All the treasures to be found on Mount Krampus are at the shelters. And \
	should you pass on them for greater rewards ahead, you risk losing everything if you fail! \n\
	\n\
	Some say that on the very summit of Mount Krampus lies a stash of Grinchlin loot that may \
	contain treasures none have ever seen before...

m.p_winterfest_danger_r9 = Grinchlin Assault!
o.p_winterfest_danger_r9 = The Grinchlins have sabotaged Winterfest for the last \
	time. Take the fight to them!
b.p_winterfest_danger_r9 = Warning: This is a Dangerous Mission! \n\
