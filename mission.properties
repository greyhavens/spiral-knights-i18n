# RANK 1-1
m.first_contact = First Contact
o.first_contact = Contact Intel Agent Kora via Comlink
b.first_contact = You have escaped your crash pod and reached a Rescue Camp just as the sun \
	set across the alien landscape.  Using your comlink, it is now time to establish \
	contact with Spiral HQ.

n.first_contact = Kora
m.first_contact_1a = Greetings {0}, this is Intel Agent Kora confirming your contact with \
	Spiral HQ. I will serve as your main connection to Spiral HQ during your time here on Cradle \
	and provide you with intel for the many dangerous missions you have ahead of you. \n\
	\n\
	My data briefing on your training performances in the Skylark suggests that you \
	will be well-suited for what's to come.  I look forward to our working together.

r.first_contact_1a = Sounds good Kora, what's next?

m.first_contact_2a = You're eager, that's good.  Your current mission is to reach the \
	town of Haven where Spiral HQ has set up base.  Spend the time you need within the \
	Rescue Camp to prepare yourself for your journey to come. \n\
	\n\
	Make use of any traveling merchants as well as the knowledge of other knights in the camp \
	to learn how to survive in this new world.  I will contact you again once you reach Haven. \n\
	\n\
	Good luck to you.

r.first_contact_2a = I'm on my way.

m.abandoned_depot = The Abandoned Depot
o.abandoned_depot = Learn the basics of survival in the Abandoned Depot
b.abandoned_depot = The Knights stationed in the Rescue Camp have converted a derelict \
	facility below the surface of Cradle into a training facility to help teach new recruits \
	the basics of survival within the Clockworks.  Beware! As part of the Clockworks it is \
	likely to be inhabited by all manners of monsters.  Stay alert!

# Rhendon RC
#...................................................................................................

n.rc_buddyknight = Rhendon
m.securing_camp = Should You Choose to Accept
b.securing_camp = Before you attempt to investigate the monster-infested depths below the \
	Rescue Camp, Rhendon would like to get you up to speed about taking on missions for Spiral HQ.
o.securing_camp = Find and talk to Rhendon to gain access to missions.

m.securing_camp_1a = Well, looks like we're in quite a bind here, {0}. There's plenty of work \
	to be done to get this camp up and running, so you've now been authorized to receive missions! \
	You can find any available missions in the Activities bar.

r.securing_camp_1a = Missions?

m.securing_camp_2a = Missions range from dangerous combat engagements to talking to certain \
	people, such as myself.  By completing missions, you'll earn progress towards new ranks, \
	which will in turn give you access to increasingly powerful gear.  Greta informed me that \
	you'll be tackling our power supply problem in the Ancient Generator?

r.securing_camp_2a = Yes, that's right.

m.securing_camp_3a = Well, keep your wits about you. If the surface of this world is crawling with \
	monsters, who knows what you'll find down there in the dark!

r.securing_camp_3a = Thanks, Rhendon.  I'll be careful.

m.securing_camp_4a = Remember to accept that mission and be careful down there!

r.securing_camp_4a = End conversation

#Old securing camp dialog
m.rc_buddyknight_1a = {0}! I hear they've selected you to save the day, eh?  Well, before you get \
	all 'hero' on me and go marching off into the darkness below why don't you and I go head on \
	over to the other side of the camp and teach a few of the monsters that tore up this camp \
	last night a lesson?

r.rc_buddyknight_1a = Sure, I'm game.

# [proto bomb image]
m.rc_buddyknight_2a = Well then you'll need one of these!  It's a Proto Bomb and it's good for \
	making things go boom! \n\
	\n\
	I had an extra one in my pod so consider it an advance reward for saving all our hides here.

# (Rhendon gives you a Proto Bomb)

r.rc_buddyknight_2a = Thanks Rhendon, this will come in handy!

m.rc_buddyknight_3a = Let's put it to good use right away. \n\
	\n\
	You can accept Missions by clicking the 'Mission' button at the top of the screen and accept \
	the mission I've given you.

r.rc_buddyknight_3a = End conversation

m.rc_buddyknight_4a = Accept my mission and let's get to work blowing some stuff up!

r.rc_buddyknight_4a = End conversation

# After you complete the mission
m.rc_buddyknight_5a = It seemed like the world itself tried to trap you back there, what a \
	close call! \n\
	\n\
	Keep your wits about you when you go off exploring the Ancient Generator below.  If the \
	surface of this world is crawling with monsters and rigged with traps, who knows what you'll \
	find down there in the dark!

r.rc_buddyknight_5a = Thanks Rhendon, I'll be careful.

m.securing_camp_b = Securing the Camp
o.securing_camp_b = Help Rhendon destroy the monsters that invaded the Rescue Camp!
b.securing_camp_b = Before you attempt to investigate the monster-infested depths below the Rescue \
	Camp, Rhendon would like you to help him eliminate some of the monsters that attacked the \
	Rescue Camp last night.

n.securing_camp_b = Rhendon
m.securing_camp_b_1a = There you are, {0}!  I was beginning to think you wouldn't show up! \n\
	\n\
	Ok, let's get to work securing this place.  But first, you'll need to equip that \
	Proto Bomb I gave you.  Head over to the Arsenal Station behind me and equip it.

r.securing_camp_b_1a = I'll head over to the Arsenal Station and equip my Proto Bomb!

#[arsenal station highlights]

#[bomb category highlights]

#[proto bomb highlights]

#[image of uncharged to charged states]
m.securing_camp_b_2a = Great!  Now a quick lesson on charge attacks. \n\
	\n\
	Charge attacks can be performed with any weapon by holding down the ATTACK button and waiting \
	for the charge aura to reach maximum charge.  You can still move around while charging!

r.securing_camp_b_2a = Ok, then what?

#[image of gun and sword charge attacks]
m.securing_camp_b_3a = Once the charge aura has reached maximum charge, release the ATTACK button \
	and unleash a devastating charge attack!

r.securing_camp_b_3a = Easy enough, what else?

#[image of bomb charging and explosion]
m.securing_camp_b_4a = Bombs are special in that they have no standard attack.  A bomb can ONLY be \
	used as a charge attack, so make sure to outmaneuver monsters while charging!

r.securing_camp_b_4a = Roger that, Rhendon.

m.securing_camp_b_5a = Ok, practice a few bomb attacks and then head in there and destroy those \
	monsters!

r.securing_camp_b_5a = Sounds like a blast!

#As the player enters the room, a monster door appears behind them.  Focus on Rehndon at the door:
m.securing_camp_b_6a = Something has happened!  That door just popped up behind you like a trap! \n\
	\n\
	Defend yourself, {0}!

#The player destroys all the monsters.
m.securing_camp_b_7a = What the heck was that?  Where did that door come from? \n\
	\n\
	It would seem that this mechanical world beneath our feet has it in for us, {0}. \
	Better watch yourself! \n\
	\n\
	Anyway, I think this area is secure, at least until night fall.  Let's head back to camp.

r.securing_camp_b_7a = End conversation

# RANK 1-2

m.crossing_chasm = Crossing the Chasm
o.crossing_chasm = Cross the perilous chasm and connect with Spiral HQ in Haven
b.crossing_chasm = In order to reach Spiral HQ's base of operations in Haven you will need to \
	descend into the Clockworks and cross a massive chasm.  The journey will be a dangerous one \
	and it is recommended that you have everything you need before departing. \n\
	\n\
	Completing this mission will leave the Rescue Camp behind you.

m.first_contact_b = First Contact
o.first_contact_b = Contact Spiral HQ via comlink
b.first_contact_b = With the power restored to the Rescue Camp, you can now use your comlink to \
	contact Spiral HQ and find out where they have located after the crash of the Skylark.  Once \
	you have made contact with Spiral HQ you will hopefully find out what caused the crash and \
	the nature of this alien world you now inhabit.

n.first_contact_b = Kora
m.first_contact_b_1a = This is Intel Agent Kora of Spiral HQ! We have received a distress signal \
	from your coordinates, do you read me?

r.first_contact_b_1a = This is {0} of the Skylark.  I read you loud and clear Kora.

m.first_contact_b_2a = Nice to meet you, {0}.  What's your situation?

r.first_contact_b_2a = (Tell Kora about the Ancient Generator, Razwog and the mysterious Artifact.)

m.first_contact_b_3a = Wow, it sounds like you've already had quite the adventure, {0}!  Spiral \
	HQ will most certainly be interested in that artifact you recovered.  It's remarkable that \
	you were able to face off against a gremlin in the Clockworks and survive.

r.first_contact_b_3a = Gremlin? Clockworks?

#[image of gremlins in the Clockworks]
m.first_contact_b_4a = Looks like I need to get you up to speed.  We've crashed on a planet known \
	as 'Cradle.'  Cradle is a fascinating world in that the entire interior of the planet below \
	its surface is an ever-changing mechanical complex known as the 'Clockworks.' \n\
	\n\
	The Clockworks seems to have been built by 'gremlins,' a furry race of malevolent monsters \
	that have not taken kindly to our presence.

r.first_contact_b_4a = I'd like to help however I can.  Where is Spiral HQ now located?

#[image of RC map leading to Haven]
m.first_contact_b_5a = We discovered a town known as 'Haven' and have set up a base of operations \
	there. The locals have provided us with food, shelter and power.  It's not Isora, but it's \
	home for now. \n\
	\n\
	I've pinpointed your location.  Unfortunately you'll need to cross a massive chasm in order \
	to reach Haven.  Perhaps now that your camp has power there is an elevator somewhere leading \
	into the Clockworks.  You may just be able to reach us that way.

r.first_contact_b_5a = Thank you Kora, I'll try to find a way across the chasm to Haven.

m.first_contact_b_6a = From what I've heard, if anyone can do it, it's you, {0}!  Good luck!

r.first_contact_b_6a = End conversation

# RANK 1-3
m.ancient_generator = The Ancient Generator
o.ancient_generator = Explore the Ancient Generator and restore power to the Rescue Camp \
	before night falls!
b.ancient_generator = The Rescue Camp has no power and with it, no means of defending itself from \
	the onslaught of monsters that attack it in the night.  With the sun setting fast, it's up to \
	you to enter the dark depths below the camp and locate an Ancient Generator. \n\
	\n\
	If you can restore power to the camp, the Spiral Knights can power their turrets and create \
	a defensive perimeter. Once secure, it may be possible to reconnect with Spiral HQ.

n.ancient_generator = Razwog
m.ancient_generator_1a = What do we have here, more little creatures that came from the sky?  \
	Here to take my power and disturb my research? \n\
	\n\
	No one disrupts the work of the great Schemer Razwog!  I'll see to it you never leave this \
	room alive!

m.ancient_generator_2a = You nasty, little things! Don't you dare touch the artifact! \n\
	\n\
	Argh! I'll be back for you!

# RANK 1-4
m.crossing_chasm_b = Crossing the Chasm
o.crossing_chasm_b = Cross the chasm with Rhendon and reach Haven
b.crossing_chasm_b = Having restored power to the Rescue Camp and established contact with Spiral \
	HQ, it's time you attempted to cross the chasm north of the Rescue Camp and reach Haven where \
	the rest of the Spiral Knights have taken refuge. \n\
	\n\
	In order to cross the chasm you will need to take an elevator down into the Clockworks and \
	find another to bring you up on the other side.  There's no telling what dangers lurk in the \
	dark depths below so Rhendon will be accompanying you on your journey.

n.arsenal_knight = Technician
m.arsenal_knight_1a = You can use the Arsenal Station behind me to change your gear. Once you \
	head down into the Clockworks you will only be able to swap out your equipped gear at \
	an Arsenal Station like this one, so it's best to be prepared!

r.arsenal_knight_1a = End conversation

n.crossing_chasm_b = Razwog
m.crossing_chasm_b_1a = Thought you could just walk away with the artifact did you?  Hand it over \
	now or I'll light this fuse and turn you into a million, tiny, smoldering bits!

n.chasm_b_rhendon = Rhendon
m.chasm_b_rhendon_1a = Looks like we've got no choice, {0}.  This gizmo isn't worth dying over.

m.crossing_chasm_b_2a = Perfect!  I'll keep the artifact and burn you to the ground all the same! \n\
	\n\
	Hahaha!

m.chasm_b_rhendon_2a = That devil! \n\
	\n\
	The whole place is coming down! We need to find a way to put this fire out now!

m.crossing_chasm_b_3a = What?! You're still here?! \n\
	\n\
	This artifact is mine!  You miserable knights will never have its power! \n\
	\n\
	I'll just have to destroy you myself!

m.razwog_defeated = There is a strange crimson symbol on Razwog's clothing.

n.cryptic_coder = Cryptic Coder
m.cryptic_coder = Schemer Razwog: \
	Work away from the others. \
	The Order must never know we have the artifact. \
	Find a way to power it. \
	Bring it to me. \
	Do not betray me.  I will know. \n\
	\n\
	-H
r.end_coder = Close message

m.crossing_chasm_b_4a = Thanks, {0}.  I thought we were done for back there. \n\
	\n\
	Let's get the artifact back to Spiral HQ before someone else tries to nab it.

m.crossing_chasm_b_5a = Hey, {0}! I see you've acquired a Proto Bomb! They're very useful for \
	when you need to deal with groups of enemies.

r.crossing_chasm_b_5a = How do I use it?

m.crossing_chasm_b_6a = Bombs are special in that they have no standard attack.  A bomb can ONLY \
	be used as a CHARGE ATTACK, so make sure to evade monsters while charging! \n\
	\n\
	Feel free to give it a try.  Just remember to equip it at that arsenal station up ahead.

r.crossing_chasm_b_6a = Continue

m.crossing_chasm_b_7a = I'll take the artifact to the Lab.  When you're ready you should head \
	into Haven and meet up with the rest of the crew.  I have a feeling we might be stuck on \
	this planet for quite some time, so we might as well see what we can do to help.

r.crossing_chasm_b_7a = End conversation

# RANK 2-1
#RENAMED FROM get_energrized
m.welcome_to_haven = Welcome to Haven!
o.welcome_to_haven = Contact Intel Agent Kora via Comlink
b.welcome_to_haven = Having survived the journey to Haven you must contact Intel Agent Kora \
	via comlink and give her your report.  She has information as to what to do next as well as \
	special instructions on the use of energy.

n.welcome_to_haven = Kora
m.welcome_to_haven_1a = You made it, {0}!  I'm happy to see you arrive here in Haven \
	safe and sound.  I'll confirm with Spiral HQ that you will now be undertaking missions in \
	Haven.  To start, I've issued you a few missions that will help get you acclimated with all \
	that Haven has to offer.  Be sure to say hello to the Strangers \
	as you begin exploring.

r.welcome_to_haven_1a = Strangers?

m.welcome_to_haven_2a = The inhabitants native of Haven are called 'Strangers.' You can't miss \
	them- they're the towering, cloaked figures with masks. Despite their intimidating \
	appearance, they have been extremely helpful to us and mostly keep to themselves. The odd, \
	little birds in town certainly seem to like them anyway!

r.welcome_to_haven_2a = I'll be sure to say hello when I see a Stranger.

m.welcome_to_haven_3a = Great, thanks for being a good ambassador! \n\
	\n\
	Lastly I need to get you up to speed on something called 'energy.'  It's very important to \
	your mission here on Cradle.

r.welcome_to_haven_3a = I'm all ears Kora, tell me about energy!

#(image)
m.welcome_to_haven_4a = Energy is essential in order to acquire powerful gear and items from the \
	Supply Depot. \n\
	\n\
	You will find all sorts of uses for it in your travels, just look for the energy symbol!

r.welcome_to_haven_4a = Continue

m.welcome_to_haven_5a = Energy can only be obtained by purchase with a real money transaction or \
	for trade via the Exchange. To purchase or trade for energy, simply open the Supply Depot and \
	click the 'Get Energy' button.

r.welcome_to_haven_5a = I'd like to go over your energy tutorial one more time.
#6a -> Repeat tutorial
r.welcome_to_haven_5b = Get energy and do amazing things- got it!

m.welcome_to_haven_6a = I'll contact you again soon, good luck {0}!

r.welcome_to_haven_6a = End conversation

