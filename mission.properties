m.heart_of_ice_1a = Listen up, Rangers!  Grab your scarves and sharpened swords because where \
	we're going isn't going to include a warm welcome!  Our scouts report that Amu-Sol is a \
	frozen wasteland filled with fiends and hungry beasts.  This fiendish city seems to be \
	spreading its icy chill throughout the Clockworks and if we don't get in there and figure out \
	why, it's going to be a long winter here on Cradle. \n\
	\n\
	Let's ride, Rangers!

r.heart_of_ice_1a = (End conversation)

n.heart_of_ice_2a = 'Fiendish Memo'
m.heart_of_ice_2a = Re: Resource allocation request, Amu-Sol \n\
	\n\
	You are receiving this mail as a result of an incorrect/cryptic entry in your recent \
	resource allocation request.  Please provide a detailed summary of your projected use of the \
	following requested resources: \n\
	- 999 'Open minded' devilites \n\
	- 50 barrels of 'whatever frostifurs eat' \n\
	- A 'towering pillar' of everfrost and 'all the frozen souls it brings forth' \n\

r.heart_of_ice_2a = (Continue reading)

m.heart_of_ice_2b = Additionally, HR has requested an updated org chart as soon as possible. \
	It is our understanding that all Pit Boss duties, administrative and otherwise, have been \
	turned over to a 'Maulos of the Eternal Frost,' is that correct? \n\
	\n\
	Cheers, \n\
	Morgral'm \n\
	Assistant Supervisor of Resource Allocations, Undercorp

r.heart_of_ice_2b = (End reading)

m.heart_of_ice_3a = Re: Re: Resource allocation request, Amu-Sol \n\
	\n\
	Thank you for your prompt response.  Unfortunately your resource allocation has been denied. \n\
	\n\
	Reason: \n\
	Provided summary of need for requested resources: 'All hail the great and terrifying Maulos, \
	true lord of the Blinding Abyss.' \n\

m.heart_of_ice_3b = Additionally, HR is still waiting on the requested updated org chart. \
	Please note that 'All fall under the freezing corruption of the great Maulos' is not an \
	acceptable description of current executive hierarchy. \n\
	\n\
	Cheers, \n\
	Morgral'm \n\
	Assistant Supervisor of Resource Allocations, Undercorp

r.heart_of_ice_3a = (End reading)

m.heart_of_ice_4a = Re: Re: Re: Resource allocation request, Amu-Sol \n\
	\n\
	I've contacted Internal Affairs regarding the recent theft of an everfrost pillar and the \
	'disappearance' of nearly 1,000 devilite data entry associates, as I believe it to be \
	directly related to your recently denied resource allocation request. \n\
	\n\
	Disciplinary action will be required.  Additionally, please fill out the attached Personal \
	Improvement Plan and return it as soon as possible. \n\

m.heart_of_ice_4b = Lastly please instruct your division to cease using our mail system to \
	inform other Undercorp divisions that 'The freezing corruption of lord Maulos is \
	inescapable.'  Improper use of the mail system hurts productivity. \n\
	\n\
	As your division's disciplinary action will undoubtedly result in relocation to the Eternal \
	Torment Division, this will likely be our final correspondence.  I wish you luck in your \
	continued career here at Undercorp. \n\
	\n\
	Cheers, \n\
	Morgral'm \n\
	Assistant Supervisor of Resource Allocations, Undercorp \n\
	\n\
	Attached: Amu-Sol.pip

r.heart_of_ice_4a = Open attachment?
r.heart_of_ice_4b = (End reading)

m.heart_of_ice_5a = The attachment is corrupted and cannot be opened.

n.heart_of_ice_6a = Recon Ranger
m.heart_of_ice_6a = Wow, this thing is a massive tower of everfrost.  I've only ever seen little \
	handfuls of the stuff, nothing close to what we're seeing here. \n\
	\n\
	The intel we've collected so far suggests that fiends utilize large deposits of the stuff \
	to trap the souls of the lost within it, like some kind of icy prison. \n\
	\n\
	It would seem that Maulos, that horrible arch-fiend you just took down, had a different use \
	in mind and was actually destroying this everfrost to unleash swarms of angry, frozen souls \
	into the Clockworks.  Had he finished the job, well, I don't even want to think about how \
	many sweaters we would all be needing right now...

r.heart_of_ice_6a = (End conversation)

m.p_ghost_machine_r4 = Ghosts in the Machine
o.p_ghost_machine_r4 = Join Desna's Recon Rangers in discovering the source of the distress call within the derelict facility.
b.p_ghost_machine_r4 = Warning: This is a Dangerous Mission! \n\
	\n\
	\n\
	Desna and her Recon Rangers are an elite team tasked with recovering intel from some of the \
	most dangerous levels of the Clockworks.  Joining them could lead to great rewards, but it is \
	guaranteed to be a perilous journey! \n\
	\n\
	Spiral HQ has received a distress call from a derelict facility deep within the Clockworks. \
	The distress call came in the form of a digital message saying only 'save us.' Believing it to \
	be a potential trap, Spiral HQ has deployed Desna's Recon Rangers to investigate the facility \
	and assist anyone who may have sent the message.

