	I'll always be here to keep your armor looking unique!

r.shopping_again_12b = Thanks Bechamel, I'll be seeing you!

# LET'S GO SHOPPING AGAIN B-TEST
m.shopping_again_b = Let's Go Shopping!
o.shopping_again_b = Follow Bechamel on a tour of the Bazaar's more advanced offerings
b.shopping_again_b = Now it's time to learn about some of the more advanced services the Bazaar \
	offers.  Follow knight Bechamel and pay a visit to Punch and Vise, Brinks and even visit \
	Bechamel's own shop!

n.shopping_again_b = Bechamel
m.shopping_again_b_1a = Hi there {0}!  Wow, you've made Soldier already?  You're really moving \
	up fast in the ranks. \n\
	\n\
	Anyway, I'm Bechamel, and I'm here to give you a tour of some of the Bazaar's more advanced \
	services. To start, do you want to learn how to even further power up that gear of yours?

m.advanced_alchemy = Advanced Alchemy
o.advanced_alchemy = Visit Bosco and discover the potential of advanced alchemy
b.advanced_alchemy = Now that you have achieved the rank of Soldier, Bosco in the Haven Bazaar \
	has some new information for you regarding advanced forms of alchemy.  Pay him a visit and \
	learn about the hidden potential in some weapons and gear!

n.advanced_alchemy = Bosco
m.advanced_alchemy_1a = We meet again, {0}.  Spiral HQ has asked me to introduce you to some \
	advanced alchemy.  Don't worry, this won't take long.  I've got an old mecha knight to work \
	on anyway.

r.advanced_alchemy_1a = Lay it on me, Bosco.

m.advanced_alchemy_2a = Basically it comes down to 'branching.'  You see, most of the alchemy \
	you have likely seen up to this point follows a linear evolution path.  It simply improves \
	over time and each upgrade is better than the last. \n\
	\n\
	But not all items are like that.  Many of them can become multiple, completely different \
	types of items than their original!

r.advanced_alchemy_2a = Wow, sounds like I have a lot to learn!

m.advanced_alchemy_3a = You'll figure it out as you go along, trust me.  Take this Brandish for \
	example.  It has within it the potential to become three different types of elemental \
	blades that deliver powerful status conditions, or even a shadowy sword of darkness! \n\
	\n\
	You just need to discover the recipes that require a brandish and get crafting to find out. \
	Here, you can even keep this Brandish I've got.  Transmute it into something amazing.

r.advanced_alchemy_3a = Thanks Bosco!  I'll gather some recipes and get crafting!

m.hall_of_heroes_0 = Hall of Heroes
o.hall_of_heroes_0 = Attain rank of Soldier

m.hall_of_heroes_1 = Hall of Heroes
o.hall_of_heroes_1 = Visit the Hall of Heroes wearing at least 2 Star gear and receive certification
b.hall_of_heroes_1 = The Hall of Heroes is where knights go to receive their Star Certification \
	allowing them to access deeper depths of the Clockworks.  Each certification ensures a knight \
	meets the star level required to deal with challenges in the upcoming missions. \n\
	\n\
	The Hall of Heroes also allows knights the opportunity to speak to veteran knights and \
	discover their loadouts, even offering the opportunity to purchase recipes for \
	these loadouts. \n\
	\n\
	Visit the Hall of Heroes and receive your 2 Star Certification in order to obtain access to \
	missions within deeper levels of the Clockworks.

#Conversation (used at in the hall):
n.hall_of_heroes_0 = Spiral Warden
m.hall_of_heroes_0_1a = Well met, {0}. This is the Hall of Heroes, where veteran knights come \
	to offer their services to members of our order who have attained the rank of Soldier or \
	higher. \n\
	\n\
	By undertaking more missions, I am confident that you will one day stand among us.

r.hall_of_heroes_0_1a = End conversation

