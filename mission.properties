m.p_r3_mat_0 = Monstrous Research
o.p_r3_mat_0 = Turn in the requested materials to Spiral HQ for research.
b.p_r3_mat_0 = Spiral HQ is always seeking to further understand the creatures inhabiting the \
	Clockworks through the examination of materials.  If you have some materials to spare, you \
	can further increase your prestige by donating materials to Spiral HQ.

