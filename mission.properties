#Conversations in-mission
#Lost Soul 1
n.apocrea_1 = Lost Soul
m.apocrea_1_1a = What's this? Another poor soul ripe for harvest by the Apocrea?

r.apocrea_1_1a = What is this place and what are you talking about?

m.apocrea_1_2a = You, curious traveler, stand in the Obsidian Nexus, realm of the Apocrea. You \
	will likely never see the sun again.

r.apocrea_1_2a = What do you mean? Who are the Apocrea?

m.apocrea_1_3a = The Apocrea are stuff of nightmares: a terrible legion of otherworldly phantasms \
	whose only ambition seems to be trapping and devouring the souls of all life. \n\
	\n\
	Though you may venture beyond this nexus, you will undoubtedly fall into one of their traps \
	along the way.

r.apocrea_1_3a = Tell me about these traps.

m.apocrea_1_4a = The Apocrea bend reality, twisting the environment they invade into a trap. In \
	these traps they stalk any life, harvesting their souls for some unimaginable purpose.

r.apocrea_1_4a = I won't let them take me so easily.

m.apocrea_1_5a = You don't understand, do you? You simply don't have a choice.

r.apocrea_1_5a = End conversation

#Lost Soul 2
m.apocrea_2_1a = What's this? You still have your body. Perhaps you can help us.

r.apocrea_2_1a = Who are you?

m.apocrea_2_2a = I'm just another soul hiding from the gaze of the Apocrea. But I refuse to give \
	up. Until they find me I will do anything I can to save another soul from my fate.

r.apocrea_2_2a = How can I help?

m.apocrea_2_3a = Soon you will find yourself in one of the traps set by the Apocrea. If you are \
	powerful enough to escape then you may be able to save some of the other lost souls along \
	the way.

r.apocrea_2_3a = I will try. Tell me what to do.

m.apocrea_2_4a = Lost souls trapped by the Apocrea are bound to the realities they have created. \
	Find the lost souls and free them from the bonds of the Apocrea.

r.apocrea_2_4a = Continue

m.apocrea_2_5a = Once freed you will collect an Apocrean Sigil as proof of your deed. Bring these \
	to me and my friend here will reward you with special treasures I have collected during my \
	time in this world. You can use these items to craft rare and powerful items using that \
	obelisk of creation over there.

r.apocrea_2_5a = I will do my best.

m.apocrea_2_6a = Good luck to you. Travel swiftly and avoid their grasp.

r.apocrea_2_6a = End conversation.

