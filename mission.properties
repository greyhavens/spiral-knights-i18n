# Mission Start
n.anniversary_start = Biscotti

m.anniversary_start_1 = {0}! Am I glad to see you!  Things are getting pretty bad down here.

r.anniversary_start_1 = What's going on, Biscotti?

m.anniversary_start_2 = So here's the thing... I was tasked with baking cakes for the big \
	Spiral Knights Anniversary Celebration and I may have got in a tiny bit over my head \
	when I said I could bake a couple million of them in just a week. \n\
	\n\
	To speed up the process I may have used a teensy weensy bit of pure, unrefined, dark matter \
	instead of baking powder...

r.anniversary_start_2 = You what?!

m.anniversary_start_3 = In any case it would seem that this new 'recipe' caused the cakes to \
	turn into horrible monsters that have overtaken my kitchen and infested the Clockworks.  \
	I'd like to have my kitchen back, so could you please assist me in destroying \
	these horrible Creep Cakes?

r.anniversary_start_3 = Though my training never included confectionery combat, I'm in!

m.anniversary_start_4 = Great!  I'll meet you near the exit once you've cleared them \
	out.  Careful though, they seem to have adapted the use of birthday candles as weapons...

r.anniversary_start_4 =  End conversation

# Mission End

n.anniversary_end = Biscotti

m.anniversary_end_1 = {0}! You did it!  I've got my kitchen back! \n\
	\n\
	Remember, you can exchange the Cake Slices you receive for awesome cake helms from \
	Maskwell in the Haven Town Square. It's just like that old baker's saying, 'Wear the \
	hide of your fallen foes to prove your might as a warrior!' \n\
	\n\
	Ok, maybe I just say that.

r.anniversary_end_1 =  End conversation

# Gremlin Chef finale
n.anniversary_gremlin = Groat
n.anniversary_dread_velvet = Dread Velvet

m.anniversary_gremlin_1a = A dash of Moonstone, a pinch of... H... How did you... \
	Who are you!? You're not supposed to be here!

m.anniversary_gremlin_1b = Out, out, oooout! Too many cooks in the kitchen! \
	Too many cooks in the kitchen!

m.anniversary_gremlin_2 = What are you doing!? My cakes! My pretty cakes! \
	Unacceptable!

m.anniversary_gremlin_3 = Guuurgle! Such strength! You shall be consumed \
	and your power added to my own!

m.anniversary_gremlin_4a = You... I... What was that? Did you say something?

r.anniversary_gremlin_4a = Biscotti asked me to come check on you.

m.anniversary_gremlin_4b = Oh no! Tell her the cakes will be ready. \
	Erm, I'm just a little behind.  I'll make you a deal: \
	I'll give you some extra cake if we can keep this between \
	you and me. I don't want to be kicked out of the party.

