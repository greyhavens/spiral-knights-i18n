m.rescues_and_recycling = Rescues and Recycling
o.rescues_and_recycling = Shut down the gremlin deconstruction site and rescue the captive knights
b.rescues_and_recycling = A 'Deconstruction Zone' is a gremlin work site where gremlins seem to \
	tear apart existing levels and use the components to build new levels. Their ability to \
	rapidly engineer levels and machines is incredible, surpassed only by their hostility to \
	anyone who crosses their path. \n\
	\n\
	Recon Knights have discovered that a squad may have observed their engineering marvels a \
	little too closely as they are now being held captive in one of the deconstruction sites near \
	depth 10.  It is unclear what the gremlins have in store for these knights or if they simply \
	plan on letting them perish along with the rest of the level they are dismantling.

m.shocking_sentient_sentries = Shocking Sentient Sentries
o.shocking_sentient_sentries = Battle your way to the secret weapons facility
b.shocking_sentient_sentries = Recon Knights have uncovered a secret weapons facility that \
	according to the intel we have available, could belong to a high ranking gremlin of The \
	Crimson Order.  It is heavily fortified by a small army of electrified constructs who have \
	no doubt been programmed to defend the facility at all costs. \n\
	\n\
	While it is unclear if this weapons stash actually belongs to a gremlin of \
	The Crimson Order, it is no less worth infiltrating and neutralizing the weapons stash. \n\
	\n\
	It is advised that you prepare yourself with elemental damage and shock resistant gear \
	before deploying.

