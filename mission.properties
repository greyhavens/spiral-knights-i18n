	takes to get in, acquire the intel and get out alive!

m.p_legion_almire_r9 = Legion of Almire
o.p_legion_almire_r9 = Recover an ancient Almirian codex
b.p_legion_almire_r9 = Warning: This is a Dangerous Mission! \n\
	\n\
	Desna and her Recon Rangers are an elite team tasked with recovering intel from some of the \
	most dangerous levels of the Clockworks.  Joining them could lead to great rewards, but it is \
	guaranteed to be a perilous journey! \n\
	\n\
	Spiral HQ believes that an ancient codex originating from the cursed kingdom of Almire is \
	located somewhere in a dark and terrifying necropolis.  This necropolis is believed to be \
	teeming with all manners of undead monstrosities and only the Recon Rangers have what it \
	takes to get in, acquire the intel and get out alive!

m.legion_almire_1a = Nothing like a death-defying romp through a haunted necropolis to really get \
	the blood pumping, eh Rangers? \n\
	\n\
	The necropolis originates from Almire, fallen kingdom of some crazy lord something-something, \
	population: innumerable legions of Undead.  Apparently these less-than-living residents are \
	guarding something that Spiral HQ would like to acquire. \n\
	\n\
	Our job is to recover a special book, a piece of a much larger collection of works that may \
	give us more insight into the nature of this cursed kingdom.  So grab your helmets, and your \
	best zombie-basher- I'm not expecting a warm reception. \n\
	\n\
	Let's ride, Rangers!

r.legion_almire_1a = (End conversation)

n.legion_almire_book = Almirian codex text:
m.legion_almire_2a = An excerpt from the accounts of Lord Brandell, High Chancellor of Almire: \n\
	\n\
	Like so many of its people, Law and Order have fled Almire.  Only Justice remains, but she \
	too has been twisted by the cursed flames that ravage our kingdom.  Justice is now the \
	burning scepter of our once great Lord Vanaduke.  Justice is swift, unflinching, merciless. \n\
	\n\
	My position has afforded me much in my life.  I used to love the view that my tower offers. \
	From these lofty heights I thought of myself as the first one to greet the spring season, the \
	first to smell the life in the air as the flowers bloomed.

r.legion_almire_2a = (Continue reading)

m.legion_almire_3a = Now only death and smoke hang in the air, even from these great heights. \
	And the fires; the unnatural fires that seem to burn eternal, the fires that turn even the \
	most pious men into horrible nightmares, I know that these fires shall soon take me as well. \n\
	\n\
	I will not give my former Lord the gift of my own life.  It is not his to take, to twist. \
	This shall be my final order.  This shall be my Justice.

r.legion_almire_3a = (End reading)

