m.operation_crimson_hammer_1 = Operation Crimson Hammer
o.operation_crimson_hammer_1 = Join Lieutenant Feron in a siege of the Grand Arsenal of Warmaster \
	Seerus.
b.operation_crimson_hammer_1 = Warmaster Seerus is the evil master of munitions within the \
	gremlin's all-powerful Crimson Order  Thought to be the true mastermind behind the Roarmulus \
	Twins and countless other gremlin weapons, he is the Crimson Order's creator and supplier for \
	their diabolical engines of war. \n\
	\n\
	Recon Knights under the command of Lieutenant Feron recently discovered Seerus's 'Grand \
	Arsenal,' his development center and storage facility for all his weaponry.  Now, Feron \
	himself is leading several squads of knights directly into the Grand Arsenal, with the \
	intention of weeding out Seerus and destroying his war machines. \n\
	\n\
	Met with heavy resistance, Feron's squads require reinforcements and Spiral HQ is sending you \
	in to assist.

