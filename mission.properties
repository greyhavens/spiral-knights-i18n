	\n\
	I'll contact you later as soon as I have my tracking equipment back online!

r.new_threat_12a = Roger that, Kora.

m.pierce_of_cake = Pierce of Cake
o.pierce_of_cake = Learn about monsters that inflict piercing damage
b.pierce_of_cake = Now that you are undertaking missions in 'Tier 2' of the Clockworks, monsters \
	will begin inflicting special damage types that you need to be aware of and prepare for \
	or else you could face certain doom! \n\
	\n\
	One of our lead Biotechs, Hahn, has prepared a brief lesson on piercing monsters.  Speak \
	with him via comlink before taking on any further missions.

n.pierce_of_cake = Hahn
m.pierce_of_cake_1a = Hello there, {0}.  Spiral HQ has informed me that you will be needing a \
	quick lesson in the species of monsters within the Clockworks that inflict \
	piercing damage, yes?

r.pierce_of_cake_1a = Yes, they said that-

m.pierce_of_cake_2a = Very well {0}, let's get right to it.  It seems the closer monsters get to \
	the Core, the more their unique properties begin to surface.  In most cases this takes the \
	form of their being able to inflict special damage types that require special defenses \
	in order to withstand properly. \n\
	\n\
	In Tier 2, a monster inflicting a special damage type will always produce a split \
	normal/special damage output.  Thus, normal defense is still a somewhat valid defense choice.

r.pierce_of_cake_2a = Ah, so you're saying that-

m.pierce_of_cake_3a = Yes, at this point you must begin forming an arsenal that protects you \
	against special damage types. \n\
	\n\
	Your current missions will have you facing monsters with piercing damage attacks.  Thus, \
	you must begin acquiring helmets, armor and shields that defend against piercing damage.

r.pierce_of_cake_3a = What types of monsters inflict-

m.pierce_of_cake_4a = Piercing damage is produced by slime and beast family monsters. \
	Additionally, slime monsters tend to be weak to shadow damage and beasts themselves to \
	piercing damage. Keep this in mind. \n\
	\n\
	Now then, is there anything else you require?

r.pierce_of_cake_4a = You talked pretty fast, can you go over it-
#(Start with 'very well {0}...)
r.pierce_of_cake_4b = I think I've got it thanks for-
m.pierce_of_cake_5a = My pleasure. Good day.

r.pierce_of_cake_5a = End conversation

m.oilers_in_boilers = Oilers in the Boilers
o.oilers_in_boilers = Discover and destroy the source of the fiery slimes invasion
b.oilers_in_boilers = A boiler room beneath Moorcroft Manor has been overrun by a legion of oily \
	slimes known as 'oilers' that seem to enjoy fiery conditions.  This could prove disastrous \
	for any levels in close proximity should the slimes enter the boilers and cause an explosion. \n\
	\n\
	Moorcroft Manor serves as an invaluable connection point into Tier 2 and its departed \
	residents have been the most gracious of hosts.  It is in Spiral HQ's best interest to send a \
	squad in to deal with the smoldering slimes before they create a firestorm that seals off our \
	access to Tier 2. \n\
	\n\
	It is up to you to locate the oilers and remove them from the boilers!

m.frostifur_fandango = Frostifur Fandango
o.frostifur_fandango = Hunt down the ferocious Snowclaw Pack
b.frostifur_fandango = Spiral HQ is receiving numerous reports of squads being wiped out by \
	a pack of wolvers known as 'the Snowclaw Pack' near depth 10.  These ferocious frostifurs \
	have an icy bite and are very territorial. Due to their relentless attacks, Spiral HQ is \
	requesting an experienced squad infiltrate their den and destroy them to prevent any further \
	casualties. \n\
	\n\
	It is advised that you prepare yourself with piercing damage and freeze resistant gear \
	before deploying.

m.monstrous_research_3 = Monstrous Research
o.monstrous_research_3 = Turn in the requested materials to Biotech Hahn for research.
b.monstrous_research_3 = Biotech Hahn is attempting to further his research of slime and beast \
	family monsters and is requesting samples from your recent missions.  He has specifically \
	requested that you be reminded of his 'very informative lecture' that was given to you \
	'free of charge' when making your decision as to whether or not to comply.

