m.toxic_plant_1a = Alright Rangers, listen up - we've got orders to infiltrate a gremlin bioweapons \
	facility lead by a member of their 'Crimson Order,' known as 'Herex.'  This is just a fancy way of \
	saying that one of the craziest of the crazy gremlins likes to load his gun with unconventional \
	bullets. \n\
	\n\
	We don't know what he has cooking down there so arm yourself and don't forget to wear a mask. \
	If Herex is anything like Seerus you're liable to catch more than a cold down there. \n\
	\n\
	Let's ride, Rangers! \n\

r.toxic_plant_1a = (End conversation)

n.toxic_plant_2a = Secret Memo

m.toxic_plant_2a = An official order from Herex, the Whispering Venom: \n\
	\n\
	Production of Compound 42 is to cease immediately.  While a formidable poison and no doubt \
	useful in achieving a... 'higher' power amongst the Order, it seems to have formed an \
	intelligence well beyond the scope of a standard bio-toxin.

r.toxic_plant_2a = (Continue reading)

m.toxic_plant_2b = All traces of Compound 42 should be eliminated, along with the facility and any engineers \
	not part of the inner fold. Remind the scorchers who find these orders uncomfortable that \
	those who disobey shall soon hear my whisper in their ears. \n\
	\n\
	Seal the doors and burn everything to the ground.

r.toxic_plant_2b = (End reading)

m.p_heart_of_ice_r4 = Heart of Ice
o.p_heart_of_ice_r4 = Discover the source of the terrible blizzards emanating from Amu-Sol
b.p_heart_of_ice_r4 = Warning: This is a Dangerous Mission! \n\
	\n\
	Desna and her Recon Rangers are an elite team tasked with recovering intel from some of the \
	most dangerous levels of the Clockworks.  Joining them could lead to great rewards, but it is \
	guaranteed to be a perilous journey! \n\
	\n\
	Spiral HQ has detected a sudden climate shift emanating from deep within the Clockworks. \
	Freak snowstorms and blizzards have begun surging through the depths seeming to originate \
	from an inhospitable, fiendish city known as 'Amu-Sol.'  The Recon Rangers have been \
	dispatched to infiltrate Amu-Sol and discover the source of these freezing storms.

