#Cobalt
n.hall_of_heroes_cobalt = Jorin

m.hall_of_heroes_cobalt_1a = Well met, {0}.  I'm Jorin, a knight who has mastered the standard \
	issue Spiral Knight gear.  The recipes I have for you produce very reliable weapons and \
	gear. \n\
	\n\
	Just because your weapons don't output fancy special damage types or your armor defends from \
	status conditions doesn't mean you can't shake it in the Clockworks.  The gear I specialize \
	in is good for just about any situation.  It will keep you alive and packs a punch on almost \
	any monster that comes your way.

r.hall_of_heroes_cobalt_1a = Ok, let's see what you have to offer.  (Browse recipes)
r.hall_of_heroes_cobalt_1b = End conversation


#Striker
n.hall_of_heroes_striker = Echo

m.hall_of_heroes_striker_1a = Greetings {0}, I'm Echo, a knight who utilizes gear fit for a squad \
	striker.  The recipes I have for you produce weapons and gear that focus on rapid, \
	close-quarters combat. \n\
	\n\
	The arsenal of a striker focuses on speed.  You want to get in close with your enemy, hit \
	them hard and get out.  The gear I specialize in will make you a knight that leaps into \
	battle ahead of your squad, striking first before they can even fire off a shot.

r.hall_of_heroes_striker_1a = Ok, let's see what you have to offer.  (Browse recipes)
r.hall_of_heroes_striker_1b = End conversation

#Heavy
n.hall_of_heroes_heavy = Izola

m.hall_of_heroes_heavy_1a = Hello {0}, I'm Izola, a knight who utilizes gear fit for a squad \
	guardian.  The recipes I have for you produce highly defensive armor and hard-hitting \
	weapons. \n\
	\n\
	Heavy weapons require precise timing to use effectively and the gear tends to slow you down \
	some.  But what you sacrifice in usability is returned in sheer power.  The gear I \
	specialize in will make you a knight that your squad can depend upon to stay alive and face \
	even the fiercest of monsters.

r.hall_of_heroes_heavy_1a = Ok, let's see what you have to offer.  (Browse recipes)
r.hall_of_heroes_heavy_1b = End conversation

#Gunner
n.hall_of_heroes_gunner = Daxen

m.hall_of_heroes_gunner_1a = Howdy {0}, the name's Daxen. I'm a knight who specializes in \
	gunslinging.  The recipes I have for you produce weapons and gear that focus on ranged \
	combat... you know, shootin' stuff. \n\
	\n\
	Handguns allow you to hit your enemies from a safe distance, but don't offer you many options \
	once they close in on ya.  You've got to think and shoot fast to be a good gunslinger.  The \
	gear I specialize in will make you a dead shot, not a dead knight.

r.hall_of_heroes_gunner_1a = Ok, let's see what you have to offer.  (Browse recipes)
r.hall_of_heroes_gunner_1b = End conversation

#Bomber
n.hall_of_heroes_bomber = Remi

m.hall_of_heroes_bomber_1a = Hello {0}, I'm Remi, a knight who specializes in bombs and \
	explosives.  The recipes I have for you are pretty straightforward- producing weapons and \
	gear that focus on blowing up your enemies to smithereens! \n\
	\n\
	Using bombs isn't a fire and forget kind of affair though.  Bombs require an understanding of \
	timing, both before and after you drop one, in order to get the most bang for your buck.  The \
	gear I specialize in will make you a knight that your squad sends in to take down many \
	enemies at once.  Bombs are great for clearing out a mob of beasties in one swift KA-BOOM!

r.hall_of_heroes_bomber_1a = Ok, let's see what you have to offer.  (Browse recipes)
r.hall_of_heroes_bomber_1b = End conversation

#Piercing Def
n.hall_of_heroes_piercing = Walkon

m.hall_of_heroes_piercing_1a = Hi there {0}, I'm Walkon, a knight who utilizes gear that offers \
	high piercing damage defense.  The recipes I have for you produce armor and shields that \
	protect you from the piercing attacks of slimes and beasts. \n\
	\n\
	One of the best parts about choosing piercing defense is that the armor is often made of \
	soft, squishy jelly materials.  You could just about fall asleep in it!

r.hall_of_heroes_piercing_1a = Ok, let's see what you have to offer.  (Browse recipes)
r.hall_of_heroes_piercing_1b = End conversation

#Elemental Def
n.hall_of_heroes_elemental = Archilus

m.hall_of_heroes_elemental_1a = Greetings {0}, I'm Archilus, a knight who utilizes gear that \
	offers high elemental damage defense.  The recipes I have for you produce armor and shields \
	that protect you from the elemental attacks of constructs and gremlins. \n\
	\n\
	Elemental resistant armor and shields are adapted from Owlite technology.  Though the \
	Owlites themselves no longer exist, their amazing elemental mastery lives on in this gear.

r.hall_of_heroes_elemental_1a = Ok, let's see what you have to offer.  (Browse recipes)
r.hall_of_heroes_elemental_1b = End conversation

#Shadow Def
n.hall_of_heroes_shadow = Sylvin

m.hall_of_heroes_shadow_1a = Hello {0}, I am Sylvin, a knight who utilizes gear that offers high \
	shadow damage defense.  The recipes I have for you produce armor and shields that protect \
	you from the shadow attacks of fiends and the undead. \n\
	\n\
	Shadow defense can be harnessed from the shadows themselves.  The armor and shields I \
	specialize in are derived from the very fiendish and undead creatures that seek to use the \
	power of the shadows against you.  Plus, it looks incredibly scary and cool.

r.hall_of_heroes_shadow_1a = Ok, let's see what you have to offer.  (Browse recipes)
r.hall_of_heroes_shadow_1b = End conversation

#Specialist
n.hall_of_heroes_specialist = Zebulon

m.hall_of_heroes_specialist_1a = Hi there {0}, I'm Zebulon, a knight who utilizes specialty gear \
	that is suited for specific scenarios.  The recipes I have for you produce weapons that \
	target specific monster families and gear that has mixed defense types. \n\
	\n\
	Sometimes what you really need is a sword that smites the undead or armor that raises your \
	slime smashing proficiency.  The gear I specialize in is often built for a specific task, but \
	is also great to mix and match with other sets.  Experiment!

r.hall_of_heroes_specialist_1a = Ok, let's see what you have to offer.  (Browse recipes)
r.hall_of_heroes_specialist_1b = End conversation

