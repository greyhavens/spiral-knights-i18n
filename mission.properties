m.chilled_to_bone = Chilled to the Bone
o.chilled_to_bone = Investigate the shadowy remains of the Candlestick Keep
b.chilled_to_bone = By now you have no doubt run into strange, undead monsters known as \
	'spookats.'  Recon Knights have finally discovered what seems to be the source of these \
	ghostly cat-like creatures. \n\
	\n\
	Large concentrations of spookats have been sighted in what is believed to be the darkened \
	remains of an owlite castle.  Dubbed the 'Candlestick Keep' this shadowy realm is only \
	illuminated by a series of owlite candles.    \n\
	\n\
	Proceed with caution while exploring outside the light of the candles.  Lurking in the dark \
	are enormous spookats known as 'grimalkins.'  Grimalkins seem to withstand all weaponry and \
	are to be avoided.  Your only defense is to stay in the light! \n\
	\n\
	Spiral HQ has issued you this mission in order to collect more data on the origins of the \
	spookats and the mystery behind the fall of the owlites.  Investigate the Candlestick Keep \
	and report your findings!

m.work_idle_hands = Work for Idle Hands
o.work_idle_hands = Crash the fiendish office party!
b.work_idle_hands = Devilites are a type of fiend that seem to have a very rigid corporate \
	structure that governs their every action.  Recon Knights have discovered a series of \
	devilite 'offices' throughout the Clockworks, typically found in the remains of an \
	alien city. \n\
	\n\
	Analysis of the data collected from these offices indicates that devilite corporations are \
	outsourced by gremlins in order to design and manage various projects that include weapons \
	specifically engineered to target Spiral Knight squads. \n\
	\n\
	It's time these devilites were issued pink slips and their fiendish projects cancelled.

m.monstrous_research_5 = Monstrous Research
o.monstrous_research_5 = Turn in the requested materials to Biotech Hahn for research.
b.monstrous_research_5 = Biotech Hahn is attempting to further his research of fiend and undead \
	family monsters and is requesting samples from your recent missions.  He has once again \
	specifically requested that you be reminded of his 'best free lecture yet' when making your \
	decision as to whether or not to comply.

# RANK 5-2
m.another_trace = Another Trace
o.another_trace = Contact Intel Agent Kora via comlink
b.another_trace = The technicians in the Haven Laboratory report that their tracking system has \
	finally been repaired and brought back online. Intel Agent Kora would like to bring you up to \
	speed on the challenges ahead. Contact her via comlink for the details.

n.another_trace = Kora

m.another_trace_1a = Hello {0}, I'm happy to report that my equipment is back up and running! \
	Now I have some good news and bad news for you.  The good news is: I've been able to track \
	down the source of that energy signature. Here is the bad news: the energy source has been \
	pinpointed to a highly dangerous area of the Clockworks that Recon Knights have dubbed the \
	'Royal Jelly Palace.'

r.another_trace_1a = You're kidding me, right?

m.another_trace_2a = The place is as strange as it sounds.  Apparently, monsters within the \
	slime family actually have a ruling aristocracy of elite slimes.  These 'Royal Jellies' are \
	enormous, selfish and ill-tempered slimes that live in opulent palaces that we can only guess \
	have been squatted in as we do not believe slimes are capable of building structures.

r.another_trace_2a = Ok...

m.another_trace_3a = The energy signature is coming from somewhere in the Royal Jelly Palace \
	and we need you to investigate.  Royal Jellies are very territorial so you might have \
	to get past its lair in order to reach your objective. Be wary though, a Royal Jelly \
	surrounds itself with plenty of protection.  You will likely face significant resistance as \
	you investigate the palace.

r.another_trace_3a = You can count on me, Kora.

m.another_trace_4a = Good luck, {0}.  Be sure to thoroughly prepare before attempting this mission.

r.another_trace_4a = End conversation

m.time_enough_at_last = Time Enough at Last
o.time_enough_at_last = Discover the fate of the lost knight within the Scarlet Fortress
b.time_enough_at_last = A knight named Edger has gone missing while exploring the Scarlet \
	Fortress.  Given that this crumbling castle is swarming with spookats and jelly cubes, his \
	squadmates fear for his safety and have asked a more experienced knight like yourself to \
	investigate. \n\
	\n\
	Locate Edger within the fortress and bring him back to Haven!

#Conversation (used at the end of the mission):
n.time_enough_at_last = Edger
m.time_enough_at_last_1a = Oh hello there.  I suppose you're with Spiral HQ.

r.time_enough_at_last_1a = Yes, you must be Edger.  Your squadmates requested that I come find you.

m.time_enough_at_last_2a = Ah yes, my squad.  A good bunch... strong and determined.  I'm not \
	sure I really fit in to be honest, was always more of a reader!  They should be fine without \
	me I would imagine.

r.time_enough_at_last_2a = Without you?  No, I'm here to bring you back.

m.time_enough_at_last_3a = I don't know about that... I'm fine here amongst all these ancient \
	tomes.  I've got plenty to read, more than I ever could in a lifetime.  But I suppose that \
	won't be a problem. \n\
	\n\
	Please, just head on back to Haven.  Let my squad know that I'm ok and that I'm safe.

r.time_enough_at_last_3a = Safe?  This place is swarming with monsters!

m.time_enough_at_last_4a = Yes, it is isn't it?  I should not have come here alone.  I should \
	have stayed with my squad. \n\
	\n\
	(Edger looks off into the distance) \n\
	\n\
	I don't even remember how it happened.... maybe I never will.  But it didn't hurt.

r.time_enough_at_last_4a = Are you saying that...?

m.time_enough_at_last_5a = I'm saying that I have a lot of reading to do now.  The fight is \
	over, that's all. \n\
	\n\
	Please, head back to Haven and let everyone know things are ok.

r.time_enough_at_last_5a = I'll let them know, Edger.

m.rise_or_fall = Rise or Fall
o.rise_or_fall = Test your might with a slimy showdown in the Battle Arena
b.rise_or_fall = Infiltrating the Royal Jelly Palace and taking on the hordes of slimes that \
	serve the great Royal Jelly is not going to be an easy task.  It is highly recommended you \
	seek one of the 'Battle Arenas' within the Clockworks and determine if your equipment is up \
	to the challenge of facing so many savage slimes. \n\
	\n\
	Spiral HQ has located one of these mysterious arenas that seems to be filled with all manner \
	of gooey gladiators seeking a challenge.  Give them a good fight!

m.hall_of_heroes_2 = Hall of Heroes
o.hall_of_heroes_2 = Visit the Hall of Heroes wearing at least 3 Star gear and receive certification
b.hall_of_heroes_2 = In order to venture even deeper within the Clockworks you must once again \
	visit the Hall of Heroes and speak to Lieutenant Barrus to receive your 3 Star Certification.

#Conversation (used at in the hall):
m.hall_of_heroes_2_2a = Well met, {0}. It is good to see you once more. \n\
	\n\
	Now then {0}, for your 3 Star Certification you must be currently equipped with a 3 star or \
	greater armor, helmet, shield and weapon.

m.hall_of_heroes_2_3a = Congratulations {0}, you meet the necessary requirements and have \
	received your 3 Star Certification.  Take the elevator behind me in order to complete your \
	mission.

m.hall_of_heroes_2_3b = I'm sorry {0}, but you currently do not meet the necessary requirements. \
	Please speak to me again when you are currently equipped with a 3 star or greater armor, \
	helmet, shield and weapon.

m.sovereign_slime = The Sovereign Slime
o.sovereign_slime = Infiltrate the Royal Jelly Palace and find the mysterious energy source
b.sovereign_slime = The source of the strange energy signature is believed to be located \
	somewhere in the Royal Jelly Palace, the home to one of the members of the slime \
	aristocracy, the Royal Jelly. \n\
	\n\
	The might of these sovereign slimes is not to be underestimated.  Should you find yourself \
	facing this hot-tempered highborn, you would be wise to be equipped with the appropriate \
	gear and backed by a full squad of experienced knights. \n\
	\n\
	It is highly recommended that you equip yourself with pierce resistant gear and shadow damage \
	weapons before deploying for the Royal Jelly Palace!

# RANK 6-1

m.explosive_plot = An Explosive Plot
o.explosive_plot = Contact Intel Agent Kora via comlink
b.explosive_plot = Recon Knights have discovered what they believe to be a gremlin-hatched plot \
	to destroy Haven!  As a Knight Elite, you have been selected by Spiral HQ to investigate \
	this matter.  Contact Intel Agent Kora for details.

n.explosive_plot = Kora
m.explosive_plot_1a = Congratulations {0}!  Knight Elite huh?  Wow, you must be proud!

r.explosive_plot_1a = Thanks Kora.  I owe a lot to your intel.

m.explosive_plot_2a = Oh {0}, I'm just doing my job.  And speaking of which, I have \
	a job for you!

r.explosive_plot_2a = I'm ready.

m.explosive_plot_3a = Our recent intel from Recon Knights suggest that gremlins are planning \
	something big.  We believe they are developing some kind of weapon they're calling \
	'Project R' that will be targeting Haven itself.  Spiral HQ and the Strangers themselves are \
	requesting that you investigate the matter given your performance in the Royal Jelly Palace.

r.explosive_plot_3a = It's because the Strangers took us in that they're now targeted...

m.explosive_plot_4a = Yes, I feel the same way.  We owe it to them to put an end to this gremlin \
	threat as quickly as possible. \n\
	\n\
	I've lined up several missions for you that will take you to locations where gremlins seem \
	to be gathering resources for Project R.  Your briefing should explain everything.

r.explosive_plot_4a = Roger that Kora, I'm on my way!

m.explosive_plot_5a = In the mean time we'll run an analysis on that strange device you found \
	in the Royal Jelly Palace. If it is related to the Artifact, we'll find out soon enough! \n\
	\n\
	Good luck, {0}.

r.explosive_plot_5a = End conversation

m.axes_of_evil = Axes of Evil
o.axes_of_evil = Stop the gremlin logging operation in the Jigsaw Valley
b.axes_of_evil = A gremlin logging operation has been discovered in levels known as the 'Jigsaw \
	Valley.'  These strangely carved islands are home to an even stranger species of twisting \
	trees that gremlins seem to be determined to completely wipe out. \n\
	\n\
	Spiral HQ believes that gremlins are using the lumber from this operation as resources for \
	the development of Project R and needs you to enter the Jigsaw Valley and shut it down.

m.plan_of_attack = Plan of Attack
o.plan_of_attack = Recover the gremlin schematics in the secret test lab
b.plan_of_attack = Deep within a toxic cavern lies a hidden test lab that gremlins have been \
	using as a testing ground for components of Project R.  One of these components still in \
	development is reported to have schematics for the project close by. \n\
	\n\
	If this is true there will likely be a terminal of some kind close to one of Project R's \
	components.  Locate the terminal and recover the schematics for analysis.  It should shed \
	light on the exact nature of Project R.

m.high_temperature_hostages = High Temperature Hostages
o.high_temperature_hostages = Rescue the captured knights within the fiery Deconstruction Zone
b.high_temperature_hostages = Intel had reported a gremlin deconstruction crew dismantling a \
	portion of the Clockworks in order to generate scrap resources for use in their Project R. \
	Using powerful welding torches, they are truly burning the place to the ground. \n\
	\n\
	One of the squads investigating the site has gone missing and is believed to be now held \
	in captivity at the site. \n\
	\n\
	Infiltrate the fiery deconstruction zone and rescue the captive knights.  But be warned, \
	the deconstruction crew are said to have a powerful security construct hidden \
	somewhere on site.

# RANK 6-2
m.target_acquired = Target Acquired
o.target_acquired = Contact Intel Agent Kora via comlink
b.target_acquired = After analyzing the schematics you recovered from the gremlin test lab, \
	Spiral HQ now knows the nature of Project R as well as its location within a gremlin \
	munitions facility.  Spiral HQ is requesting that you enter this facility and destroy \
	Project R before it can be used on Haven.  Speak with Intel Agent Kora for full details.

n.target_acquired = Kora
m.target_acquired_1a = Hello {0}, I hope you're ready for me to send you out into the lion's \
	den once more.

r.target_acquired_1a = I understand that Spiral HQ has uncovered the nature of Project R.

m.target_acquired_2a = Yes, Project R appears to be in fact two massive weapons known as the \
	'Roarmulus Twins.'  Designed by one of the Crimson Order itself, the Roarmulus Twins are \
	some kind of construct cannon that the gremlins intend on moving up the Clockworks into the \
	Haven Arcade! \n\
	\n\
	Based on what the schematics suggest, their power far exceeds standard gremlin weaponry and \
	could be truly devastating to Haven, Spiral HQ and the Strangers should it reach the Arcade.

r.target_acquired_2a = If you know where it is, I'll put a stop to it.

m.target_acquired_3a = We have pinpointed its location to be in the deepest level of a gremlin \
	facility known as the 'Ironclaw Munitions Factory.'  The factory is used for the production \
	of all manners of gremlin weaponry and is highly dangerous, even to the gremlins working \
	there. \n\
	\n\
	You must prepare yourself for heavy resistance from shock-powered constructs and gremlins.

r.target_acquired_3a = I'll be sure to get my hands on the appropriate gear for the job.

m.target_acquired_4a = There's one last thing- it seems you won't be the first knight to have \
	entered the Ironclaw Munitions Factory.  We've detected another Alpha Squad recon module \
	somewhere within the factory.  Please attempt to recover it.  I hope that analysis proves \
	that Euclid's squad made it out of there alive...

r.target_acquired_4a = Roger that Kora.

m.whipping_mishandling =  Whipping and Mishandling
o.whipping_mishandling = Deliver the supplies to the research team within the fiendish \
	city of Sol' Fork
b.whipping_mishandling = After Recon Knights discovered a fiendish city known as Sol' Fork, \
	Spiral HQ deployed a research team to station itself in the heart of the city and study \
	the devilites within.  Their findings have become the basis for our understanding of \
	devilite culture and their motives for working with gremlins. \n\
	\n\
	This research team is in desperate need of supplies in order to maintain working on-site.  \
	It would be of great help to Spiral HQ's continued research to have a squad enter the city \
	and deliver the necessary supplies.

m.sewer_stash = Sewer Stash
o.sewer_stash = Destroy the gremlin war machines hidden in the wasteworks
b.sewer_stash = It seems that the Ironclaw Munitions Factory is not the only place gremlins are \
	storing high-powered weaponry.  Intel suggests that once manufactured, weapons are moved \
	out of the Ironclaw Munitions Factory and stored in secret weapon caches throughout the \
	Clockworks. \n\
	\n\
	One of these caches has been uncovered in one of the Clockwork's wasteworks systems.  It's \
	likely not going to be pretty reaching it, but eliminating the weapons stored in these \
	wasteworks could result in far fewer casualties in the future.

m.built_to_destroy = Built to Destroy!
o.built_to_destroy = Dismantle the Roarmulus Twins in the heart of the Ironclaw Munitions Factory
b.built_to_destroy = Once known to Spiral HQ as 'Project R,' the Roarmulus Twins have been \
	identified as a gremlin-engineered weapon of tremendous power built with the sole purpose of \
	destroying Haven.  Stored deep within the heart of the Ironclaw Munitions Factory, this \
	weapon is not only protected by hordes of shock-powered constructs and gremlins, but the \
	factory is a highly dangerous, explosive hazard itself! \n\
	\n\
	In addition to shutting down the Roarmulus Twins, Spiral HQ would like you to recover the \
	Alpha Squad recon module that is believed to be located somewhere within the factory. \n\
	\n\
	It is highly recommended that you form a full squad before deploying.

n.built_to_destroy = Crimson Order Terminal
m.built_to_destroy_1a = "The Nine see all, hear all. Obey the Iron Law."
r.built_to_destroy_1a = Read Crimson Order Directives.
r.built_to_destroy_1b = Read Crimson Order Transmissions.
r.built_to_destroy_1c = Leave the terminal.

m.built_to_destroy_2a = Crimson Order Directives: \n\
	\n\
	- It is the DUTY of every Gremlin to repel the metal intruders! \n\
	\n\
	- Every Gremlin must work to destroy Haven. Cradle belongs us! \n\
	\n\
	- Every Gremlin must remain LOYAL to King Tinkinzar and the Crimson Order. The Iron Law must be obeyed!
r.built_to_destroy_2a = Return

m.built_to_destroy_2b = Transmission: \n\
	\n\
	'They continue to advance and thwart our schemes!  How could they have \
	discovered Project R?  Why was there no advance warning of the attack?' \n\
	\n\
	'Herex and his minions were supposed to be spying on them but they have all vanished like \
	cowards.' \n\
	\n\
	'To defy the Iron Law is to defy the Order!  Track the traitor down.  Herex will answer for \
	this setback.'

m.hall_of_heroes_3 = Hall of Heroes
o.hall_of_heroes_3 = Visit the Hall of Heroes wearing at least 4 Star gear and receive certification
b.hall_of_heroes_3 = In order to venture even deeper within the Clockworks you must visit the \
	Hall of Heroes and speak to Lieutenant Barrus to receive your 4 Star Certification.

#Conversation (used at in the hall):
m.hall_of_heroes_3_2a = Well met, {0}. It is good to see you once more. \n\
	\n\
	Now then {0}, for your 4 Star Certification you must be currently equipped with a 4 star or \
	greater armor, helmet, shield and weapon.

m.hall_of_heroes_3_3a = Congratulations {0}, you meet the necessary requirements and have \
	received your 4 Star Certification.  Take the elevator behind me in order to complete your \
	mission.

m.hall_of_heroes_3_3b = I'm sorry {0}, but you currently do not meet the necessary requirements. \
	Please speak to me again when you are currently equipped with a 4 star or greater armor, \
	helmet, shield and weapon.

# RANK 7-1
m.darkest_depths = Darkest Depths
o.darkest_depths = Contact Intel Agent Kora via comlink
b.darkest_depths = Having defeated the Roarmulus Twins and recovered the Alpha Squad recon \
	module, it's time to check in with Intel Agent Kora to get a report on the analysis of the \
	module and information about your new access to some of the deepest depths of the Clockworks.

n.darkest_depths = Kora
m.darkest_depths_1a = {0}, you defeated the Roarmulus Twins and saved Haven!  On behalf of the \
	Strangers and all the Spiral Knights in Haven, thank you!  I can see why you have been \
	promoted to Defender, you are truly deserving of such an honor.

r.darkest_depths_1a = Thank you Kora, I'm just as glad as anyone to have Haven safe once more.

m.darkest_depths_2a = Yes, it has become something of a second home for us hasn't it?  Almost \
	like we belong here, it's strange.

r.darkest_depths_2a = What do you mean?

m.darkest_depths_3a = It's just a feeling really.  I hear it from some of the other knights as \
	well: a feeling like we... belong here, like maybe the crash occurred for a reason. \n\
	\n\
	But that just can't be, right?  In any case, I'm rambling now.  Back to the mission!

r.darkest_depths_3a = What's the scoop, Kora?

m.darkest_depths_4a = As a Defender, you can now undertake missions in Tier 3 of the Clockworks.  \
	These are the deepest and most dangerous depths of the Clockworks, delve any further and \
	you will reach the Core itself. \n\
	\n\
	Perhaps if you make it that far, you can locate the Alpha Squad, I just don't know.

r.darkest_depths_4a = I'll make it.  Just you wait.

m.darkest_depths_5a = Then let's get started.  Now that you've stopped the immediate threat to \
	Haven, Spiral HQ is hoping to pick up the trail of the Artifact. It won't be easy. \
	Fortunately I've got some missions lined up for you that will be invaluable for your survival \
	in the dark depths you are about to face. \
	Good luck to you, {0}.

r.darkest_depths_5a = Thanks Kora.  I'll do my best.

m.alchemy_mastery = Alchemy Mastery
o.alchemy_mastery = Discover the potential of master level alchemy
b.alchemy_mastery = Bosco in the Haven Bazaar has more information for you regarding the highest \
	level of alchemy available to you.  Mastery level alchemy will be instrumental in your \
	survival as you attempt to reach the Core of the Clockworks.

n.alchemy_mastery = Bosco
m.alchemy_mastery_1a = Hello again, {0}.  I understand you're well on your way to reaching the \
	Core and need an arsenal that will keep you alive.

r.alchemy_mastery_1a = I could always use a good sword.

m.alchemy_mastery_2a = A good sword is, well, good and all, but how about a great sword? If you \
	want weapons that will shake the heavens, then mastery level alchemy is what you need. \n\
	\n\
	Once you craft an item into its 4 and 5 star incarnation, you unlock that item's true hidden \
	potential.

r.alchemy_mastery_2a = Sounds impressive.

m.alchemy_mastery_3a = At 4 and 5 star level, gear offers the best protection you can find and \
	weapons pack the biggest punch.  If you want to stay alive where you're heading, you need to \
	start building an arsenal of 4 and 5 star gear. \n\
	\n\
	And remember- as items reach 5 star they typically can branch even more than before.  Your \
	combat options are about to really open up.  Plan your arsenal with care.

r.alchemy_mastery_3a = I will Bosco, thanks.

m.alchemy_mastery_4a = Before you go, here's a few materials to get you started.  Good luck.

r.alchemy_mastery_4a = End conversation

# RANK 7-2
m.best_of_beast = Best of the Beast
o.best_of_beast = Learn about the most powerful beast and slime monsters
b.best_of_beast = After a recent promotion, Biotech Hahn has earned the title of 'Chief Biotech.' \
	He was informed of your recent accomplishments and would like to give you a quick briefing \
	on what you can expect from the beast and slime family of monsters as you approach the Core.

n.best_of_beast = Hahn
m.best_of_beast_1a = Hello {0}, good to see you still standing.  While normally not the concern \
	of a Chief Biotech, I specifically requested the opportunity to inform you about the dangers \
	that lie ahead for you in Tier 3 of the Clockworks.  Can't have you winding up dead as a \
	result of some junior Biotech's misinformation.

r.best_of_beast_1a = Well thanks Hahn, it's almost as if-

m.best_of_beast_2a = Yes well, let's get started then. \n\
	\n\
	Tier 3 is closest to the Core and much like how high level items respond to its power, so do \
	monsters.  Many of them take on new forms and are considered at their most dangerous.  You \
	must prepare before taking on each mission.

r.best_of_beast_2a = I understand my upcoming missions will have me facing mostly beast and \
	slime monsters.

m.best_of_beast_3a = Should you find yourself facing beast and slime monsters in Tier 3, be \
	aware that they are capable of pure piercing damage.  Only the best piercing-resistant gear \
	will keep you alive in the face of these powerful, piercing predators. \n\
	\n\
	Once you've completed your upcoming missions we'll talk again.  Good luck, {0}.

r.best_of_beast_3a = Roger that Hahn, talk to you soon.

m.in_cold_blood = In Cold Blood
o.in_cold_blood = Prevent the lost squad from becoming dinner to a lounge of lethal lizards
b.in_cold_blood = Something has really riled up the chromalisks in the levels below the town of \
	Emberlight.  Spiral HQ sent a squad in to investigate and they quickly fell off the radar. \
	Now they've sent out a distress signal stating that they're cornered at depth 21 by \
	chromalisks of all varieties. \n\
	\n\
	Biotechs speculate these chromalisks are agitated due to their proximity to the Core. \
	Others believe it may be mating season.  Regardless of the reason, the squad needs saving \
	before they meet their end to the likes of these lizards!

m.vicious_viscous = Vicious and Viscous
o.vicious_viscous = Prove your valor against a legion of powerful piercing monsters
b.vicious_viscous = Spiral HQ would like you to investigate levels of the Clockworks where the \
	most powerful slime and beast monsters reside.  By exploring these levels and transferring \
	your combat data back to Spiral HQ, all knights would ultimately benefit from your dangerous \
	experience. \n\
	\n\
	It is highly recommended that you equip yourself with piercing resistant gear with piercing \
	and shadow damage weapons!

m.monstrous_research_6 = Monstrous Research
o.monstrous_research_6 = Turn in the requested materials to Spiral HQ for research
b.monstrous_research_6 = Having faced the jaws of the most ferocious wolvers, avoided the spikes \
	of fully evolved jelly cubes and even the vile regurgitations of virulisks, you have no doubt \
	collected samples from these encounters that would be of great use to Spiral HQ's research \
	teams.

# RANK 7-3
m.creators_and_created = Creators and the Created
o.creators_and_created = Learn about the most powerful construct and gremlin monsters
b.creators_and_created = In order to be fully prepared for the challenges ahead, Chief Biotech \
	Hahn is requesting you contact him before undertaking the new missions that you have \
	available to you.

n.creators_and_created = Hahn
m.creators_and_created_1a = Hello {0}, it seems you had few problems with the oozing hordes and \
	their like which can no doubt be chalked up to a good education on their behaviors prior to \
	the mission.

r.creators_and_created_1a = That and a solid arsenal, yeah.

m.creators_and_created_2a = Firepower will only get you so far, {0}.  Case in point, the gremlins \
	are no doubt strong on their own, what with just sheer numbers and all, but these little, \
	furry geniuses sought to also bolster their strength by creating an army of constructs.

r.creators_and_created_2a = So all constructs in the Clockworks were created by the gremlins?

m.creators_and_created_3a = Not all, but most of them are believed to have been directly \
	manufactured from gremlin design, yes.  We think that most were originally engineered during \
	the building of the Clockworks.  Some remain under gremlin control, others have gone rogue \
	and the rest have become something else entirely.

r.creators_and_created_3a = What do you mean?

m.creators_and_created_4a = We've had a few cases where knights have met non-hostile constructs \
	that they swear behaved like true sentient creatures.  But that is very difficult to believe. \
	Gremlins are brilliant, but brilliant at the kind of direct engineering that simply gets the \
	job done and little else.  Brute force. \n\
	\n\
	Artificial life?  Well, that's something else entirely.

r.creators_and_created_4a = Let's talk about the hostile ones I'm likely to meet.

m.creators_and_created_5a = Right.  Spiral HQ has informed me you'll likely be facing hordes of \
	gremlins and constructs on this next go around.  Keep in mind that in Tier 3, these monsters \
	can inflict pure elemental damage.  Do be sure to gear up appropriately.

r.creators_and_created_5a = Will do, later Hahn.

m.beyond_axes_of_evil = Beyond the Axes of Evil
o.beyond_axes_of_evil = Crush the new gremlin logging operation in the Jigsaw Valley
b.beyond_axes_of_evil = Despite your previous efforts, gremlins have reformed their logging \
	operation in the Jigsaw Valley in order to supply their munitions plants with resources. \
	Given the results of their last project, the Roarmulus Twins, Spiral HQ would like you to \
	end their eco-destruction before it becomes anything more serious!

m.spark_roar = Spark and Roar
o.spark_roar = Prove your valor against a legion of elite elemental monsters
b.spark_roar = An exceptionally high concentration of constructs has been found guarding an \
	area of the Clockworks that Spiral HQ suspects could be a Crimson Order hideout. Unlike other \
	monsters, constructs don't seem capable of reproducing on their own, meaning that any time \
	one is deconstructed, it's a permanent dent in their numbers. It will be a worthwhile task \
	regardless of Crimson Order influence or not. \n\
	\n\
	Spiral HQ is requesting that you enter these levels, investigate the possible hideout, and \
	eliminate the construct threat. \n\
	\n\
	It is highly recommended that you equip yourself with elemental resistant gear with elemental \
	and shadow damage weapons!

m.cryptic_coder_spark_roar = The Iron Law is Broken! \n\
	The Crimson Order is False! \n\
	The Nine are blind, they cannot see the Truth that lies below. \n\
	The Nine are deaf, they cannot hear the Resonance that beats within this world. \n\
	\n\
	Herex no longer serves as one of the Nine. \n\
	Only Herex sees and hears the Truth. Only Herex will prevail. \n\
	Follow Herex and you will be spared.

m.monstrous_research_7 = Monstrous Research
o.monstrous_research_7 = Turn in the requested materials to Spiral HQ for research
b.monstrous_research_7 = Having fought the elite Darkfang Clan gremlins, evaded the crushing \
	blows of lumbers and withstood the optic blasts of retrodes, you have no doubt collected \
	samples from these encounters that would be of great use to Spiral HQ's research teams.

# RANK 8-1
m.darkest_forces = Darkest Forces
o.darkest_forces = Learn about the most powerful fiend and undead monsters
b.darkest_forces = Hearing that your next missions will have you facing the likes of fiendish \
	and undead monsters in the depths of Tier 3, Chief Biotech Hahn has requested you contact \
	him before deploying for your latest missions.

n.darkest_forces = Hahn
m.darkest_forces_1a = {0}, still holding it together I see and earning the rank of Defender Elite \
	no less.  Bravo. \n\
	\n\
	I've had a chance to analyze your combat data from your last mission and it's proving quite \
	interesting.  The mecha knights in particular appear to actually be reacting to your attacks \
	as if improvising.  But I can't say just yet. \n\
	\n\
	In any case, that's not relevant to today's data that I'm presenting.

r.darkest_forces_1a = Yes, my next missions will have me facing fiends and undead.  Sounds fun.

m.darkest_forces_2a = You have a strange definition of recreation if that's the case.  Tier 3 \
	fiends and undead are nothing to sneeze at, in fact they're among the worst creatures you'll \
	find so close to the Core. \n\
	\n\
	Devilite management seems to be the worst at these depths and that results in some very \
	violent devilites.

r.darkest_forces_2a = They weren't exactly easy going to begin with...

m.darkest_forces_3a = Exactly, and they're worse now.  And the same goes for the undead.  You'll \
	find that howlitzers become particularly bothersome with their enhanced firing and homing \
	capabilities. \n\
	\n\
	Lastly, prepare for fiend and undead monsters to potentially deal pure shadow damage.  As \
	always, choose the right gear for the job should you want to live long enough to hear from \
	me again.

r.darkest_forces_3a = Well, I certainly wouldn't want to miss that.

m.darkest_forces_4a = Yes, I can think of no greater tragedy.  Good luck then, {0}.

r.darkest_forces_4a = End conversation

m.return_of_ur = The Return of Ur
o.return_of_ur = Stop the devilites from summoning an army of nightmarish trojan warriors
b.return_of_ur = A Recon squad has reported that deep within a fiendish city, devilites are \
	attempting to summon a legion of powerful trojan warriors.  Based on intel from a devilite \
	internal memo, the trojans are known as the 'Legion of Ur,' and are said to have once \
	numbered in the thousands.  Strangely, the memo indicated that the Legion of Ur was sealed \
	away in the Underworld and that an alternative approach would be required for bringing them \
	back. \n\
	\n\
	Whatever means the devilites intend to use to bring a few thousand trojans into the \
	Clockworks, they must be stopped.  Infiltrate their city and stop the fiendish army before \
	they become unstoppable!

m.weight_of_darkness = Weight of Darkness
o.weight_of_darkness = Prove your valor against a legion of supreme shadow monsters
b.weight_of_darkness = It is speculated that all fiends within the Clockworks crossed over from a \
	dimension known as the Underworld.  While how they crossed over and what their motives are \
	on Cradle is unclear, data collected from fiendish cities seems to indicate that they are \
	now stranded on Cradle, much like us. \n\
	\n\
	The undead on the other hand remain a mystery.  Why spirits return to the material realm is \
	unknown, though it is clear that many of the spirits within the Clockworks have come from \
	other worlds.  Given how hostile these creatures can be, the only way to obtain useful data \
	is through direct interactions, like combat. \n\
	\n\
	Spiral HQ is requesting that you collect combat data for the powerful fiend and undead \
	monsters in Tier 3 of the Clockworks in order to better understand the nature of these \
	creatures. \n\
	\n\
	It is highly recommended that you equip yourself with shadow resistant gear with elemental \
	and piercing damage weapons!

m.monstrous_research_8 = Monstrous Research
o.monstrous_research_8 = Turn in the requested materials to Spiral HQ for research
b.monstrous_research_8 = Having smashed the most terrifying zombies to dust, escaped the cold \
	maws of grimalkins and stood victorious in battle against an army of trojans, you have no \
	doubt collected samples from these encounters that would be of great use to Spiral HQ's \
	research teams.

# RANK 8-2
m.becoming_champion = Becoming a Champion
o.becoming_champion = Speak with Lieutenant Feron via Comlink
b.becoming_champion = Having heard of your many accomplishments and successful missions completed \
	for Spiral HQ, Lieutenant Feron would like to speak with you.

n.becoming_champion = Feron
m.becoming_champion_1a = Well met {0}, it has been some time since I first met you having just \
	arrived from the Rescue Camp.  You've come along way since then, rising to the rank of \
	Defender Elite no less. \n\
	\n\
	You are a gifted soldier, {0}.  I have no doubt you will soon be a Champion amongst the \
	Spiral Knights and instrumental in our solving the great mystery that is the Core, restoring \
	the Skylark and returning home.  You have proven that you have what it takes to face the \
	legions of dark forces that lurk below the surface.

r.becoming_champion_1a = I'll fight to the very end, Lieutenant.  I know what's at stake.

m.becoming_champion_2a = I've heard Spiral HQ has lined up for you some missions befitting a \
	true Champion.  But in order to become one, you'll need the right gear. \n\
	\n\
	I am entrusting you with the tools you will need to become such a Champion.  With these \
	recipes, you can craft the highest caliber of gear of the Spiral Order.  With it you can \
	finally wear the armor of the Azure Guardian, wield the might of the Leviathan Blade, and \
	face anything in the protection of the Aegis.

r.becoming_champion_2a = I am honored, Lieutenant.

m.becoming_champion_3a = Then use them with honor and let them protect you from the fury of the \
	countless foes you will soon face.  The Core that we seek, there's something truly dreadful \
	about it.  I know that it may very well be what gets us home, but I can't shake this feeling \
	that we've been thinking about it all wrong.

r.becoming_champion_3a = What do you mean?

m.becoming_champion_4a = I mean that the Core isn't a big battery that runs this world, but \
	rather it and the whole of this world is a massive prison designed to keep something from \
	ever leaving. \n\
	\n\
	Think about our geo-scans of Cradle just before the crash- they show it as being composed of \
	hundreds of massive slabs of other worlds, almost like plates of armor.  Then you have the \
	Clockworks, the most unnatural thing I've ever seen.  An entire world whose sole purpose \
	seems to be stopping anyone from ever reaching its Core.

r.becoming_champion_4a = I think you're on to something, Lieutenant.

m.becoming_champion_5a = I've been talking with Spiral HQ about it now for some time and they're \
	prepared to investigate it further.  Though I don't think I'll be changing their mind about \
	trying to open the Core any time soon.  That's still priority number one for now. \n\
	\n\
	All I can say is be careful out there, {0}.  I think this world has more surprises in store \
	for us than we know.

r.becoming_champion_5a = Roger that.

m.vile_engine = The Vile Engine
o.vile_engine = Locate and destroy the bizarre slime generators below the lichen colony
b.vile_engine = Somewhere below a level that lichens have taken to inhabiting lies a strange \
	facility of unknown origin that seems to be used for the production of toxic slime monsters. \
	The 'slime generators' are capable of rapidly producing slime monsters that then quickly \
	populate nearby levels. \n\
	\n\
	Squads in neighboring levels have already reported overwhelming numbers of toxic slimes, \
	making it impossible to lead expeditions beyond depth 23.  It is time a knight of your \
	caliber form a squad to infiltrate this strange facility and shut down production of these \
	vile creatures. \n\
	\n\
	Any data that you could collect as to their origin would be highly valuable to Spiral HQ.

m.rotting_metropolis = The Rotting Metropolis
o.rotting_metropolis = Discover the fate of the lost squad in the toxic city
b.rotting_metropolis = It would seem as though those slime generators have been around much \
	longer than we thought, seeping their vile toxins into any levels that should be near them. \n\
	\n\
	A modern city, much like those that the devilites inhabit seems to be overrun with these \
	toxins, and was probably left behind by both the devilites and gremlins as a result.  Now a \
	legion of slime and undead creatures haunt the place, festering in the poisons that linger in \
	the air.  A squad that was attempting to pass through the city has gone missing.  Given that \
	the very air is toxic, it is urgent that an experienced team enter this city and rescue the \
	squad.  There is little hope left for them otherwise.

m.great_escape = The Great Escape
o.great_escape = Infiltrate the gremlin prison, free the captured Knights and stage an escape
b.great_escape = Recon Knights have collected intel that has revealed the gremlin 'Crimson Order' \
	has begun ordering gremlins to build makeshift prisons within the Clockworks where Spiral \
	Knights are being taken and imprisoned.  It is believed that these orders are coming in \
	direct response to your destruction of the Roarmulus Twins. \n\
	\n\
	Further data suggests that these makeshift prisons are a temporary solution until a larger \
	facility can be built.  Spiral HQ however, has no intention of these imprisoned knights \
	staying long enough to find out.

n.great_escape = Sputterspark
m.great_escape_1a = Surprise! Looks like you took the bait. That's good, because I needed test \
	subjects for my latest invention.

m.great_escape_2a = Behold! The Sparkcaster 9000 Deluxe! A triumph in gremlin engineering!

m.great_escape_3a = One was clearly not enough last time... so now there are two! TWO! Brilliant!

m.great_escape_4a = Hah! You'll never reach me in my 'Room of Invincibility'! You'll be trapped \
	in that control room forever! ...Erm, wait. I might have overlooked something...

m.hall_of_heroes_4 = Hall of Heroes
o.hall_of_heroes_4 = Visit the Hall of Heroes wearing 5 Star gear and receive certification
b.hall_of_heroes_4 = In order to venture deep enough to reach the Core you must visit the Hall \
	of Heroes and speak to Lieutenant Barrus to receive your 5 Star Certification.

#Conversation (used at in the hall):
m.hall_of_heroes_4_2a = Well met, {0}. It is good to see you once more.  Few knights make it this \
	far and can assemble an arsenal of such great power. \n\
	\n\
	Now then {0}, for your 5 Star Certification you must be currently equipped with a 5 star or \
	greater armor, helmet, shield and weapon.

m.hall_of_heroes_4_3a = Congratulations {0}, you meet the necessary requirements and have \
	received your 5 Star Certification.  Take the elevator behind me in order to complete your \
	mission.

m.hall_of_heroes_4_3b = I'm sorry {0}, but you currently do not meet the necessary requirements. \
	Please speak to me again when you are currently equipped with a 5 star or greater armor, \
	helmet, shield and weapon.

# RANK 9-1
m.ending_in_fire = Ending in Fire
o.ending_in_fire = Contact Intel Agent Kora via comlink
b.ending_in_fire = A strange energy anomaly has been been detected in the levels just above \
	the Core.  Contact Intel Agent Kora for details.

n.ending_in_fire = Kora
m.ending_in_fire_1a = Hello {0}, and congratulations in rising to the rank of Champion.  Allow \
	me to say that in my experience working with you that you are truly deserving of such a \
	title.  It is because of you that so many knights have returned to the surface safely and \
	that we know so much more about the Clockworks.

r.ending_in_fire_1a = Thanks Kora, I plan on being the first to reach the Core!

m.ending_in_fire_2a = At the rate you're going you just might, {0}!  Though based on new intel \
	it would seem that's not going to be easy.

r.ending_in_fire_2a = What have you got for me?

m.ending_in_fire_3a = We thought things were getting pretty predictable, even at the depths \
	you've been exploring.  The Core was in sight.  But now some kind of massive negative energy \
	anomaly has surfaced above the Core, blocking access to it.  Recon Knights have said that \
	all they see near it is fire, endless fire. \n\
	\n\
	We don't know what it is just yet, but squads near that depth have already gone missing.  \
	This is bad news.

r.ending_in_fire_3a = How can I help?

m.ending_in_fire_4a = We need you to explore the surrounding levels and collect any intel you \
	can.  You can start with an Owlite castle of some sort that recently surfaced near this \
	anomaly.

r.ending_in_fire_4a = Roger that Kora, I'm off.

m.occurance_at_owlite_keep = An Occurrence at Owlite Keep
o.occurance_at_owlite_keep = Locate the ancient tome within the haunted Owlite keep
b.occurance_at_owlite_keep = An unlikely source of intel has surfaced from the residents of \
	Moorcroft Manor.  A few of the spookats that call it home contacted one of our visiting \
	Recon Knights and provided details of the negative energy mass that has appeared above \
	the Core. \n\
	\n\
	Calling it 'a place of burning hatred' and 'a prison for dark souls' they say that you can \
	read all about it in 'one of those weird Owlite books' in an Owlite keep they pinpointed. \n\
	\n\
	If what they claim is true Spiral HQ could gain valuable intel from investigating the Owlite \
	keep.  Just remember that these Owlite structures have all proven to be swarming with the \
	lost souls of countless undead monsters.  Prepare accordingly.

n.occurance_at_owlite_keep = Owlite tome text:
m.occurance_at_owlite_keep_1a = (This appears to be the Owlite tome that the spookats said \
	describe the place above the Core.  Its pages are very worn and only portions of the original \
	text can be deciphered.)

r.occurance_at_owlite_keep_1a = Continue reading

m.occurance_at_owlite_keep_2a = ...This world has seen few greater tragedies than the fall of \
	the great Kingdom of Almire.  Once a vibrant, beautiful realm of lush forests and sweeping \
	plains... \n\
	\n\
	...neighboring kingdoms declared war... \n\
	\n\
	...seeking the power needed to turn the tide, Lord Vanaduke of Almire fled into the \
	mountains...

r.occurance_at_owlite_keep_2a = Continue reading

m.occurance_at_owlite_keep_3a = ...returning as something unnatural... \n\
	\n\
	...endless inferno.... \n\
	\n\
	...Almire destroyed... \n\
	\n\
	...they can never leave, they can never escape the flames...

r.occurance_at_owlite_keep_3a = Continue reading

m.occurance_at_owlite_keep_4a = (The remaining pages are too deteriorated to decipher anything \
	further save for a date of the events described which suggest that the Kingdom of Almire was \
	destroyed over a thousand years ago.)

r.occurance_at_owlite_keep_4a = End reading

m.aggressive_assembly = Aggressive Assembly
o.aggressive_assembly = Rescue the lost squad and decommission the factory foreman
b.aggressive_assembly = Aggressive Assembly Briefing

m.silent_legion = The Silent Legion
o.silent_legion = Pursue Guardian Knight Arkus and bring him back to Haven
b.silent_legion = Guardian Knight Arkus was one of the finest warriors serving the Spiral Knights \
	until some time shortly after the crash.  As one of the first to search for the Alpha Squad, \
	Arkus's own squad perished in a grisly battle with a horde of dust zombies.  Since then, \
	Arkus has blamed himself for their loss, saying that he betrayed his Guardian's Oath to \
	protect his squad. \n\
	\n\
	Arkus now journeys into the Clockworks alone, never risking the loss of another squad and we \
	believe, somehow trying to find the squad he once lost.  As these expeditions began to appear \
	self-destructive, Spiral HQ issued him a direct order to cease. \n\
	\n\
	Arkus ignored these orders and has gone deep into the Clockworks and not returned.  Not \
	wanting to lose the last member of his squad, Spiral HQ is asking you to pursue him to his \
	last known whereabouts, some kind of mysterious statuary at depth 26.

n.silent_legion = Arkus
r.end_module = End Module
n.recon_module = Recon Module
m.silent_legion_recon_mod = I am drawn to this place. \n\
	\n\
	In the eyes of these silent warriors I see myself: cold, strong, unflinching... and crumbling. \
	I have been asked to let it go, to move on, but this I cannot do. \n\
	\n\
	Their faces, their dying cries... they haunted me in my dreams, so I no longer sleep.  Now I \
	see them when I close my eyes, so I shall not blink. \n\
	\n\
	I will remain here, among the stones... never blinking, never forgetting.


m.silent_legion_1a = Have they sent you for me?  To bring me back?  No, I am where I belong now. \
	I no longer serve the Spiral Order and will remain here. \n\
	\n\
	Leave this place and never come back.  Leave me be.

m.silent_legion_2a = I could swear I heard them just now, their voices carrying in the wind.  No \
	longer screams, no longer cries- whispers.  Indecipherable even in the stillness of this \
	place.  Are they leaving me here?  Why must I be left behind? \n\
	\n\
	You... I warned you not to proceed, to stay away from me.  Now you'll learn what they did... \
	that those who are close to me die!

m.silent_legion_3a = An intense sadness radiates from his fallen form.  His eyes fade and a \
	darkness washes over him.  Arkus is lost.

# RANK 9-2
m.eye_of_needle = Eye of the Needle
o.eye_of_needle = Contact Intel Agent Kora via comlink
b.eye_of_needle = After compiling the data you collected from the Owlite keep and additional \
	intel from Recon Knights, Intel Agent Kora has prepared a debriefing for you with regard to \
	the mass of negative energy blocking access to the Core.

n.eye_of_needle = Kora
m.eye_of_needle_1a = {0}, I'm glad you called, I have something big here for you.

r.eye_of_needle_1a = What is it, Kora?

m.eye_of_needle_2a = That mass of negative energy we've been investigating is a portion of an \
	ancient kingdom called Almire, the very same realm described in that Owlite tome you \
	discovered!

r.eye_of_needle_2a = But that tome suggested Almire was destroyed over a thousand years ago...

m.eye_of_needle_3a = Exactly!  So what the heck is it doing in the Clockworks now?  It just \
	doesn't make any sense. \n\
	\n\
	So, if we are to believe that indeed a lost kingdom from the past has somehow wound up in a \
	massive, mechanical world in present day, the question remains, why?

r.eye_of_needle_3a = And why is it now blocking access to the Core, now that we're so close?

m.eye_of_needle_4a = It's all a bit too convenient.  But do gremlins really have this kind of \
	power?  I suspect something more than even what they are capable of engineering. \n\
	\n\
	In any case, this Almire, it's not a kingdom any longer.  All that remains is a great citadel \
	that seems to be engulfed in never-ending flames that Spiral HQ has been calling the \
	'Firestorm Citadel.'  From what we can tell, the whole place is swarming with undead and \
	built like a fortress.

r.eye_of_needle_4a = I take it the only way to the Core is through the Firestorm Citadel?

m.eye_of_needle_5a = It would seem so.  And this place, it just radiates evil, it's almost \
	indescribable.  It's even starting to affect the levels surrounding it- fires are breaking \
	out everywhere. \n\
	\n\
	You're one of the best we've got, {0} and if there's anyone that could lead a squad through \
	the citadel it's you.  But even reaching it won't be easy.  We're going to need to take care \
	of a few fires and gather a bit more intel before storming the gates.

r.eye_of_needle_5a = Roger that.  So you've got some missions lined up for me?

m.eye_of_needle_6a = Indeed.  Let's start by putting out some fires and then we'll see about \
	trying to get to the citadel.  Given the opposition, it's a one in a million shot. \n\
	\n\
	Good luck, {0}.

r.eye_of_needle_6a = End conversation

m.terminal_meltdown = Terminal Meltdown
o.terminal_meltdown = Destroy the fiery monsters in the fuel depot and prevent an explosive disaster
b.terminal_meltdown = Drawn to the Firestorm Citadel, a horde of fiery slime and beast monsters \
	have swarmed a nearby fuel depot putting the depot and our access to the citadel at risk. \
	Should these monsters spread the fires into the fuel drums, the whole place will go up in \
	flames. \n\
	\n\
	Spiral HQ needs you to enter the depot and put out the fire before time runs out and an \
	explosive disaster is triggered!

m.alone_in_dark = Alone in the Dark
o.alone_in_dark = Make contact with a lost soul of Almire in the soldier's graveyard
b.alone_in_dark = The spookats of Moorcroft Manor have another valuable piece of intel for us \
	that is worth investigating.  They say that a lost soul of the former Kingdom of Almire \
	resides in a soldier's graveyard near the Firestorm Citadel.  This soul is willing to \
	provide us with the information on the nature of the citadel as well as how we can get \
	through it and reach the Core. \n\
	\n\
	Reaching him will not be easy given his location.  Graveyards are terrible places, especially \
	at this depth.  It is highly advisable that you move through the graveyard as quickly as \
	possible in your search for this lost soul.

#Conversation (in level):
n.alone_in_dark = Lost Soul of Almire
m.alone_in_dark_1a = (You see the lost soul of Almire standing before you.  In his face you see \
	a profound sadness.  Staring beyond you he begins to speak without introduction.) \n\
	\n\
	Lord Vanaduke brought the fire from the mountains to our kingdom.  Everything burned.  His \
	enemies.  Even his family. \n\
	\n\
	My family was lost too.  I fled the battle as soon as I saw the wave of flames in the \
	distance.  I was able to reach my home just in time to see it burn.  I don't even remember \
	how it ended.  I have no memory of my passing.

r.alone_in_dark_1a = Continue listening

m.alone_in_dark_2a = Lord Vanaduke rules over the citadel now.  His soul bound to some horrific \
	armored prison. \n\
	\n\
	He has the citadel ready for battle at all times, believing that his kingdom is still under \
	siege.  He doesn't even realize that what he is trying to protect was lost a thousand \
	years ago.

r.alone_in_dark_2a = Continue listening

m.alone_in_dark_3a = Should you attempt to enter the citadel and manage to reach the throne room, \
	please, end his suffering.  Allow the souls he keeps bound to this world a chance to return \
	to their loved ones. \n\
	\n\
	And one more thing- I've heard that some kind of force of nature had once tried to right his \
	wrongs but Lord Vanaduke imprisoned it somewhere within his fortress.  Finding and freeing \
	it may prove useful.

r.alone_in_dark_3a = Thank you.

m.alone_in_dark_4a = (The lost soul continues to stare beyond you, saying nothing.)

r.alone_in_dark_4a = End conversation

m.the_gauntlet = The Gauntlet
o.the_gauntlet = Battle your way to the Firestorm Citadel through a bulwark of monstrous might
b.the_gauntlet = One final battle stands in your way before reaching the Firestorm Citadel. \
	Thought to be devised by Lord Vanaduke himself, this unrelenting gauntlet is teeming with all \
	manners of dark creatures and culminates in a nightmarish battle arena that must be conquered \
	in order to gain access to the gates of the Firestorm Citadel. \n\
	\n\
	This mission will take everything you've got and requires a full arsenal of powerful weapons \
	and gear.  If Lord Vanaduke is testing you, give him the fight that he's asking for and show \
	him what a true Champion can do!

# RANK 9-3
m.heart_of_matter = Heart of the Matter
o.heart_of_matter = Contact Lieutenant Vaelyn via comlink
b.heart_of_matter = Lieutenant Vaelyn led the first squad into the Clockworks that attempted to \
	located the Alpha Squad.  She is a talented squad leader thought to be on par with Euclid \
	himself.  Vaelyn has never given up her search and is now attempting to put together an \
	on-site Core research team in order to better understand the very place where the Alpha \
	Squad's trail is thought to end.

n.heart_of_matter = Vaelyn
m.heart_of_matter_1a = Hello {0}, I've been meaning to talk to you for some time, but it seems \
	Spiral HQ is keeping you very busy.

r.heart_of_matter_1a = Hello, Lieutenant.  How can I help you?

m.heart_of_matter_2a = As you know I am attempting to assemble a research team to work on-site in \
	the Core terminal.  In order to successfully utilize it to restore the Skylark, it is \
	imperative that we reach it and set up this research station. \n\
	\n\
	All evidence seems to point towards you having the potential to finally reach the Core.  By \
	breaking through the Firestorm Citadel and establishing a link to the Core, my team could set \
	up the necessary supply lines and get to work immediately.  But we can't do that while that \
	infernal citadel and its horrible ruler stand in our way.

r.heart_of_matter_2a = I've prepared for facing the Firestorm Citadel, you can count on me.

m.heart_of_matter_3a = Thank you, {0}.  I hope you succeed.  As you know, we believe the Alpha Squad \
	made it this far, but it is unclear what became of them... Euclid, Parma, Grantz.... Rulen. \n\
	\n\
	(Lieutenant Vaelyn seems to almost drift off)

r.heart_of_matter_3a = Lieutenant?

m.heart_of_matter_4a = Sorry, yes of course.  Good luck to you, {0}.  Assemble the best squad you \
	can and lead them well.  We're all counting on you.

r.heart_of_matter_4a = Roger that, Lieutenant.

m.king_of_ashes = The King of Ashes
o.king_of_ashes = Defeat Lord Vanaduke in the Firestorm Citadel and reach the Core
b.king_of_ashes = Within the ever-burning depths of the Firestorm Citadel, Lord Vanaduke lies in \
	wait for any living being to pass into his accursed kingdom.  Any squad that has ever \
	attempted to infiltrate the citadel has perished or was simply lost, like the countless \
	lost souls bound to this terrible realm. \n\
	\n\
	Lord Vanaduke is ready for war, believing in his twisted mind that any who dare enter the \
	citadel to be an invading force bent on overtaking his kingdom.  He stands as the last \
	obstacle before gaining access to the Core and the Spiral Knights having any chance of \
	restoring the Skylark and returning home. \n\
	\n\
	As a Champion of the Spiral Knights, you alone have what it takes to lead a team into the \
	very heart of this inferno and face the titanic might of Lord Vanaduke.

# RANK 9-4
m.true_champion = A True Champion
o.true_champion = Contact Intel Agent Kora via comlink
b.true_champion = Having come out of the Firestorm Citadel alive, Intel Agent Kora eagerly awaits \
	to hear from you.

n.true_champion = Kora
m.true_champion_1a = {0}! Oh, {0} you made it! Haha! \n\
	\n\
	I am so happy you came out of there alive!  I was worried sick about you!

r.true_champion_1a = It's good to know you care, Kora.

m.true_champion_2a = Well, as far as I'm concerned this is only the beginning for you, {0}.  You \
	are a true Champion of the Spiral Knights.  And since I haven't been reassigned, I suppose \
	it's just the beginning for 'us' as well!

r.true_champion_2a = I'm looking forward to lots more intel then, Kora.

m.true_champion_3a = You can always count on me! \n\
	\n\
	Now then, I'm sure you've got lots to do.  We're going crazy over here trying to make heads \
	or tails over that recon module you discovered outside of the Core.  How the heck could the \
	Alpha Squad have 'entered' the Core?

r.true_champion_3a = If there's a way, we'll find it.

m.true_champion_4a = Yes, I suppose we just might.  Safe travels then, {0}.

r.true_champion_4a = End conversation

m.honor_duty = Honor and Duty
o.honor_duty = Contact Lieutenant Feron via comlink
b.honor_duty = Lieutenant Feron would like a brief word with you regarding your achievement in \
	breaking through the Firestorm Citadel.

n.honor_duty = Feron
m.honor_duty_1a = Well met, {0}, Champion of the Spiral Knights.  Your service to our cause has \
	been of the highest caliber.  Without you, reaching the Core would still be a dream.  Now, we \
	have a chance of actually restoring the Skylark and returning home.

r.honor_duty_1a = It's been an honor to serve, Lieutenant.

m.honor_duty_2a = I've read your report of the Core, it's fascinating.  What an impossible \
	structure and to think that the Alpha Squad might actually still be alive but... inside that \
	thing is just incredible. \n\
	\n\
	I understand that Lieutenant Vaelyn has already led a team to the Core terminal and is \
	establishing a base of operations for research.  This is of great value to all Spiral Knights \
	and we have you to thank!

r.honor_duty_2a = I hope her findings produce something meaningful.

m.honor_duty_3a = Aye, as do we all. \n\
	\n\
	Now then, {0}, you need to prepare for what's to come.  Reaching the Core is only the \
	beginning for us.  I suspect that Spiral HQ will be issuing you many more missions in the \
	future that could only be taken on by someone of your ability. \n\
	\n\
	And finally, it is my pleasure to inform you that you will soon be awarded one of the \
	greatest honors of the Spiral Knights, the rank of Vanguard.  I will see you in the Hall of \
	Heroes.

r.honor_duty_3a = Thank you, Lieutenant.

m.search_continues = The Search Continues
o.search_continues = Contact Lieutenant Vaelyn via comlink
b.search_continues = Lieutenant Vaelyn would like to thank you for opening up a path to the Core \
	and allowing her to set up an on-site research base.


n.search_continues = Vaelyn
m.search_continues_1a = {0}, I cannot thank you enough.  We've already established our research \
	base and are collecting a tremendous amount of data that we would have never had without your \
	efforts.

r.search_continues_1a = Thank you, Lieutenant. Any more information with regard to the Alpha Squad?

m.search_continues_2a = The recon module you collected is very strange.  I have no reason to \
	believe what Parma was saying isn't true, but how it happened I just can't say.  Everything \
	about the Core suggests there are no 'doors' into it.  It's not a structure built to enter \
	from the outside.  Rather, it seems just the opposite.

r.search_continues_2a = A prison to keep something inside?

m.search_continues_3a = Perhaps.  It certainly could be when you look at it.  We'll need to study \
	it further.

r.search_continues_3a = And the 'living darkness' she described?

m.search_continues_4a = I don't know, but it is certainly a terrifying picture she has painted. \
	Something stirs within the heart of this world, {0}, something terrible.  I've felt it since \
	we first set foot on this world; invisible eyes watching our every move, shapes that form \
	just out of view... something greater than gremlins calls this world home.

r.search_continues_4a = What will you do now, Lieutenant?

m.search_continues_5a = I haven't given up the search for Euclid, Parma, Grantz and Rulen.  \
	They're out there somewhere and I will find them, even if it means entering the Core myself.

r.search_continues_5a = I wish you luck, Lieutenant.

m.search_continues_6a = You as well, Vanguard.

r.search_continues_6a = End conversation

m.hall_of_heroes_5 = Hall of Heroes
o.hall_of_heroes_5 = Visit the Hall of Heroes and receive your commendation
b.hall_of_heroes_5 = It is time you entered the Hall of Heroes once more.  Having been fully Star \
	Certified and successfully completed so many missions that have ensured the survival of the \
	Spiral Knights on Cradle, Spiral HQ is preparing you for the high rank of Vanguard.

n.hall_of_heroes_5a = Barrus
m.hall_of_heroes_5_1a = Well met, {0}. It is good to see you once more and under such auspicious \
	terms.

r.hall_of_heroes_5_1a = Hello, Lieutenant.

m.hall_of_heroes_5_2a = You stand within the Hall of Heroes, where the best of the Spiral Knights \
	offer what they can to aspiring knights.  Knights like you yourself once were when you first \
	emerged from your drop pod and found your way to Haven. \n\
	\n\
	And after so many successful missions, daring rescues and exemplary performance in battle, \
	you now stand fit to join these heroes.

r.hall_of_heroes_5_2a = Continue

m.hall_of_heroes_5_3a = {0}, it is my great honor, in the company of all those who support you \
	and whom you serve, to award you the high rank of Vanguard of the Spiral Knights.

r.hall_of_heroes_5_3a = I am honored.

m.hall_of_heroes_5_4a = Now then, greet those that have helped you become what you are today. \
	When you are done, take the elevator back up to receive your commendation.

r.hall_of_heroes_5_4a = End conversation

n.hall_of_heroes_5b = Kora
m.hall_of_heroes_5_5a = Nice to finally meet you in person, {0}!  Congratulations!

n.hall_of_heroes_5c = Feron
m.hall_of_heroes_5_6a = Serve with honor, Vanguard.

n.hall_of_heroes_5d = Hahn
m.hall_of_heroes_5_7a = {0}, I thought you would be taller.

n.hall_of_heroes_5e = Bosco
m.hall_of_heroes_5_8a = Wow, you really did it!

n.hall_of_heroes_5f = Bechamel
m.hall_of_heroes_5_9a = Hi {0}!  Look at you, wow!  Hey, Vanguard or not you know where to go if you want to really stand out right?

n.hall_of_heroes_5g = Wegner
m.hall_of_heroes_5_10a = Congratulations {0}.  The Geo Knights owe a great deal to your efforts.

n.hall_of_heroes_5h = Chromalisk
m.hall_of_heroes_5_11a = (He appears to be staring very intently at the corner.)

n.hall_of_heroes_5i = Desna
m.hall_of_heroes_5_12a = Vanguard, eh?  The Rangers are always looking for skilled knights like \
	you, {0}.  After all this pomp is done, come see me if you want to laugh in the face of death \
	and danger once more!

# RANK 10-1
m.breaking_in_recruits = Breaking In the Recruits
o.breaking_in_recruits = Help a group of fresh recruits survive their first tour of duty
b.breaking_in_recruits = After braving the depths of Firestorm Citadel, Spiral HQ believes you \
	have earned a much deserved break. As a newly anointed Vanguard of the Spiral Knights, \
	Lieutenant Feron believes you are the perfect candidate for training a group of raw recruits \
	how to survive the dangers of this world. Your mission is to link up with the recruits on \
	the surface of Cradle and help them survive their first tour of duty.

n.breaking_in_recruits_1 = Botshoes
n.breaking_in_recruits_2 = Kneepo
n.breaking_in_recruits_3 = Wargel

m.breaking_in_recruits_1a = Greetings, little. One. Don't step. On snipes.
r.breaking_in_recruits_1a = Umm...

m.breaking_in_recruits_2a = Greetings. Get shinies. Get Shinies.
r.breaking_in_recruits_2a = Are you okay?

m.breaking_in_recruits_3a = Snipes. Buy? Sell?
r.breaking_in_recruits_3a = Right...

n.breaking_in_recruits_kora = Kora
m.breaking_in_recruits_k1a = Gremlins!? Am I reading this data right? An ambush!? How were they \
	able to trick our sensors?
r.breaking_in_recruits_k1a = They were disguised as Strangers.
m.breaking_in_recruits_k2a = This is no longer routine training! Get those Recruits to the elevator. \
We're extracting them back to Haven. You on the other hand need to head down and see who's at the bottom of this.
r.breaking_in_recruits_k2a = Roger that Kora.

m.crimson_chaos = Crimson Chaos
o.crimson_chaos = Investigate a Crimson Order base that has suddenly gone silent
b.crimson_chaos = Spiral HQ has been monitoring several known Crimson Order bases in hopes of \
	intercepting one of their elusive high-ranking members. Recon knights assigned to watch \
	one of those bases report that it has suddenly gone silent and have requested backup before \
	investigating it further. Head down to their location and investigate the base for any signs \
	of what has happened.

m.cryptic_coder_crimson_chaos = Infiltrate the Complex. \n\
	Take all schematics. \n\
	The Nine are quiet but we will silence them. \n\
	The Knights pursue but we will halt them. \n\
	\n\
	Only Herex comprehends the Truth. Only Herex will descend. \n\
	There can be no other.

m.from_below = It Came From Below
o.from_below = Find and save the squad of Recon Rangers
b.from_below = A squad of Desna's Recon Rangers is trapped somewhere in the depths of the \
	Clockworks by a mysterious force. Judging from the severity of the reports and panicked \
	communications from the squad, Spiral HQ believes that only someone with your experience is \
	capable of handling whatever deadly force has trapped them.

# RANK 10-2
m.the_flickering_flame = The Flickering Flame
o.the_flickering_flame = Contact Intel Agent Kora via comlink
b.the_flickering_flame = After your victory in Firestorm Citadel, the nature sprites of the great \
	Spirit Mother finally began to make headway in battling the cursed flames engulfing the \
	charred remains of Almire. A recent flare-up has impeded that progress, hinting at some \
	lingering malevolent force that continues to fuel the fires. Contact Intel Agent Kora \
	for details.

n.the_flickering_flame = Kora
m.the_flickering_flame_1a = Oh, {0}! As if all these strange occurrences weren't bad enough, I \
	have some shocking news for you.

r.the_flickering_flame_1a = More trouble, Kora?

m.the_flickering_flame_2a = We were in the middle of receiving a report from Lieutenant Vaelyn's \
	team at the Core Terminal when our signal was disrupted. It took some time, but I've managed \
	to pinpoint the source of the disruption. It's coming from that strange device you discovered \
	near Vanaduke's throne room in Firestorm Citadel.  It seems like someone has activated it.

r.the_flickering_flame_2a = Activated it? How?

m.the_flickering_flame_3a = We don't know for sure but it has to be related to the Artifact. The \
	energy signatures are identical. If the Artifact is involved that means...

r.the_flickering_flame_3a = That gremlin Herex must be involved.

m.the_flickering_flame_4a = That is our assumption as well. I hate to send you back into that \
	horrible place, {0}, but if there is any hope of quickly getting to the bottom of this mystery \
	it is you. The citadel is still very dangerous so please be careful!

r.the_flickering_flame_4a = End conversation.

m.shadowplay = Shadowplay
o.shadowplay = Discover the source of the disturbance in Firestorm Citadel
b.shadowplay = Even after Lord Vanaduke's defeat at your hands, Firestorm Citadel continues to \
	burn with accursed flames. Though the nature sprites have been steadily making progress in \
	fighting the flames, something or someone has recently caused a violent resurgence in its \
	destructive power. Spiral HQ requests that you gather together a crack squad of knights and \
	return to the collapsing ruins of Firestorm Citadel in order to discover the source of the \
	disturbance.

# Players encounter Herex at the altar.  He activates it with the Artifact and talks to the players
# before vanishing.
n.shadowplay = Herex
m.shadowplay_1a = Too late again! I have already collected the power I need to use the Artifact \
	and nothing you can do now will stop what I have set in motion.

r.shadowplay_1a = This ends here, Herex!

m.shadowplay_2a = Go. I will allow you to have one last moment before I destroy your meddling \
	kind. However, should you choose to turn down my generous offer then you are welcome to come \
	and face me in the Core where I will hasten your demise.

r.shadowplay_2a = I'll see you there.
m.shadowplay_3a = I look forward to our next...meeting.

m.a_call_to_arms = A Call to Arms
o.a_call_to_arms = Receive an emergency comlink message
b.a_call_to_arms = A frantic emergency comlink message broadcasts across all channels.

n.a_call_to_arms = Vaelyn
m.a_call_to_arms1 = This is Vaelyn at the Core Terminal. Team wiped out. Darkness everywhere. \
	Send help. It is opening.
r.a_call_to_arms1 = End transmission.

m.dreams_and_nightmares = Dreams and Nightmares
o.dreams_and_nightmares = Prepare for the worst and journey to the Core
b.dreams_and_nightmares = Respond to the distress signal from the Core Terminal. \
	We have no intel on what to expect. \
	\n\
	This is a dangerous mission. Prepare for anything.

n.dreams_and_nightmares_1 = Vaelyn
m.dreams_and_nightmares_1a = Backup at last! {0}, look! The Core is opening!

n.dreams_and_nightmares_2 = Herex
m.dreams_and_nightmares_2a = Such power! I never imagined...!

m.dreams_and_nightmares_3a = ...and it will be unleashed. You! I will make you its first victims.

# Vaelyn
m.dreams_and_nightmares_4a = {0}, this is almost certainly a trap and I can't ask you to come \
	with me, but I'm going in there. If there's even a chance that Rulen and the other Alpha \
	Squad members are alive I need to try and find them.

m.dreams_and_nightmares_5a = Well, guess it's time to be a hero again. Shall we?

m.dreams_and_nightmares_5b = Herex slipped away! I lost sight of him as things went black. \
	It felt like a thousand hands were pulling us away. As if something didn't want us to follow.

m.dreams_and_nightmares_5c = Whatever that was, we're here now. Wherever here is. \
	It looks like our only option is to see where this leads.

# convo at start of Refuge
n.dreams_and_nightmares_3 = Parma's Scout
m.dreams_and_nightmares_6a = Amazing...I never thought I'd see another one of us ever again! \
	I'm glad to see you made it here safely.

# Vaelyn
m.dreams_and_nightmares_7a = Parma! Your Scout! You're alive! \
	Where are you!? We need to get you back to Haven.

#Player started convo
m.dreams_and_nightmares_8 = Apologies for not appearing in person. I'm hidden away in a safe place. \
	I knew I'd never make it there in time when I noticed your signal. Luckily I was able to \
	pull some strings and find you an exit.

r.dreams_and_nightmares_8 = Where's Rulen?  Euclid?  Grantz?

m.dreams_and_nightmares_8a = Grantz he...he fell while protecting us from The Swarm. He stood \
	his ground even when the rest of us were forced to flee. I'll never forget how brave he \
	was.

m.dreams_and_nightmares_9a = The rest of us thought we weren't going to make it. But then...then \
	the light surrounded us and we were safe. We've taken to calling it The Sleeper. We aren't \
	sure what it is exactly, but it needs our help. This world was created to protect it but \
	somehow The Swarm breached the Core and has been feeding on the energy and growing like a \
	leech ever since.

m.dreams_and_nightmares_9b = Euclid volunteered to help The Sleeper. I'm sure he's in here \
	somewhere battling The Swarm even as we speak. As for Rulen...Vaelyn I'm sorry. He disappeared \
	shortly after Euclid made his decision. I haven't been able to find him ever since.

m.dreams_and_nightmares_10a = There isn't much time. I can't reach you from here and you need to make it out. \
	Warn headquarters. Warn Haven! \
	If the Core isn't kept sealed The Swarm will escape and it will continue to consume \
	everything and everyone.

m.dreams_and_nightmares_11a = But what about you and the others?

m.dreams_and_nightmares_12a = The Swarm keeps growing stronger while The Sleeper grows weaker. \
	Without us, all of us, The Swarm will win. Once, the gremlins were in charge of maintaining \
	Cradle's defenses. But they had their own plans. We need to be Cradle's champions now. \n\
	\n\
	It's our sacrifice.

m.dreams_and_nightmares_13a = Continue to fight the good fight, {0}. Remember what you've learned. \
	Farewell!

m.delved_too_deep = Delved Too Deep
o.delved_too_deep = Contact Intel Agent Kora via comlink
b.delved_too_deep = The truth has been revealed. It's time to update Intel Agent Kora and Spiral \
	HQ about what you and Lieutenant Vaelyn have learned.

n.delved_too_deep = Kora
m.delved_too_deep_1a = Come in, {0}! I can't believe it! I lost your signal completely when you \
	entered the Core Terminal. What happened down there?

r.delved_too_deep_1a = It's a long story, Kora.

m.delved_too_deep_2a = I bet. I guess you'll have to fill me in for once!

r.delved_too_deep_2a = (Tell Kora about The Swarm, The Sleeper, and the Alpha Squad)

m.delved_too_deep_3a = Amazing that after all this time we didn't know the truth. I mean, we've \
	suspected for a while now that this planet was some kind of prison but who could have \
	guessed that this 'Swarm' was just waiting for someone to stumble across the Core and free it?

r.delved_too_deep_3a = What do we do now?

m.delved_too_deep_4a = If what Parma said is true then we're the last line of defense against The \
	Swarm. {0}, I won't lie but this might change everything. We'll need to pass this on to \
	Spiral HQ immediately. I'll round everyone up and send you a mission to accept when you're \
	ready.

r.delved_too_deep_4a = End conversation.

# RANK 10-3
m.guardians_of_cradle = Guardians of Cradle
o.guardians_of_cradle = Join Spiral HQ and discuss what to do next
b.guardians_of_cradle = You have been invited to attend a meeting with several members of Spiral \
	HQ to discuss what to do next about the Core and the threat of the Swarm. Join them in the \
	Hall of Heroes to learn about Operations Missions.

n.guardians_of_cradle_1 = Ozlo
m.guardians_of_cradle_1a = Hail, Vanguard {0}. Kora said you had news of the Alpha Squad. Please, \
	give us your report.

r.guardians_of_cradle_1a = (Give Captain Ozlo your full report)

m.guardians_of_cradle_2a = Then it sounds like we narrowly avoided a horrible catastrophe. If we \
	had opened the Core and unleashed The Swarm all of Cradle might have been destroyed. Perhaps \
	even the universe!

r.guardians_of_cradle_2a = Continue

m.guardians_of_cradle_3a = The Alpha Squad's sacrifice will not be in vain. I will immediately \
	order our forces to undertake special Operations Missions all over Cradle. If there are \
	forces trying to free The Swarm, we'll have to stop them.

r.guardians_of_cradle_3a = Continue

m.guardians_of_cradle_4a = {0}, you've already done so much for all of us but I must now ask you \
	to make one final sacrifice. We might never have a chance to return home to Isora, but right \
	now Cradle needs us. I would like you to spearhead our Operations on Cradle.

r.guardians_of_cradle_4a = It would be my honor, Captain.

m.guardians_of_cradle_5a = Very good, {0}. You will find a new set of missions for you under \
	Operations. These new missions will be grouped according to their overall objective and can \
	be tackled in parallel to each other. This should allow you maximum flexibility in order to \
	respond to each new threat as they come up. Farewell, {0}, 'Guardian of Cradle'.

r.guardians_of_cradle_5a = End conversation.

n.guardians_of_cradle_2 = Feron
m.guardians_of_cradle_6a = Hail, Vanguard. It will be a rough road ahead of us but I am confident \
	that we are up to the challenge.

n.guardians_of_cradle_3 = Vaelyn
m.guardians_of_cradle_7a = I don't know if I feel better or worse after finding out what happened \
	to everyone in the Core. Poor Grantz...Parma...Euclid...Rulen...

r.guardians_of_cradle_7a = I know, Vaelyn. I feel the same way.

m.guardians_of_cradle_8a = Well, I won't dishonor them by giving up now. We've come so far after \
	all. 'Time to be a hero again!' Right, {0}?

n.guardians_of_cradle_4 = Desna
m.guardians_of_cradle_9a = Quite the scarab nest we've stirred up this time eh, {0}? Reminds me \
	of the time we engaged the Morai siege fleets over Isora. That was quite an all or nothing \
	gamble. Doesn't surprise me in the least that we're the only thing standing between us and \
	utter annihilation again.

n.guardians_of_cradle_6 = Wegner
m.guardians_of_cradle_11a = What little we've recovered from the Core Terminal has every Geo \
	Knight, Biotech, and Tech Knight absolutely stumped. We'll be analyzing these findings \
	for quite some time.

n.guardians_of_cradle_7 = Hahn
m.guardians_of_cradle_10a = (For the first time since you've known him, Hahn is silent. He seems \
	to be contemplating your findings very carefully.)


