m.hall_of_heroes_1_1a = Well met, {0}. I'm Lieutenant Barrus, Warden of the Hall of Heroes. \n\
	\n\
	You are here because Spiral HQ has marked you as having potential to become a Vanguard of \
	the Spiral Knights.  The Hall of Heroes is now at your disposal.  As you move up in rank, \
	you will receive new missions to visit and have access to more recipes from the veteran \
	knights in this hall.

r.hall_of_heroes_1_1a = I was told I am to receive Star Certification here?

m.hall_of_heroes_1_2a = Yes, in order to access deeper stratums of the Clockworks you must first \
	receive Star Certification.  This entails speaking to me when you have equipped armor, a \
	helmet, a shield and at least one weapon of a specific star level or greater.

r.hall_of_heroes_1_2a = Roger.

m.hall_of_heroes_1_3a = Congratulations {0}, you meet the necessary requirements and have \
