m.p_r3_kit = Supply Delivery
o.p_r3_kit = Gather supplies for delivery to Knights stationed in Moorcroft Manor.
b.p_r3_kit = Some knights are part of special research teams that rarely get the chance to stay \
	above ground for very long.  These knights often use the subtowns of the Clockworks as base \
	camps.  While the monsters that run these towns are friendly, often the amenities are not \
	exactly well suited for knights. \n\
	\n\
	These knights could always use supplies to make their stay a little more comfortable. A happy \
	researcher is a productive researcher!

