n.tortodrone_1 = 'Fiendish Memo'
m.tortodrone_1a = [All] Important Employee Reminder: \n\
	\n\
	An ID Card is required to access the staging area. Properly presenting the ID Card will \
	consume it to power the Grim Gate. Remember: "When you Use it, you Lose it." \n\
	\n\
	ID Cards not used in this manner ("lost, broken, or misplaced") will need to be reissued \
	by HR. The cost for a card replacement will be deducted from your next paycheck and a \
	black mark will be added to your employee file. Don't let this happen to you. \
	Don't lose your ID Card. \n\
	\n\
	Cheers, \n\
	Morgral'm \n\
	Assistant Supervisor of Resource Allocations, Undercorp

r.tortodrone_1a = (End reading)
