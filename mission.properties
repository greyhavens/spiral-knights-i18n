m.lab_firestorm_citadel = Laboratory


m.laboratory_visit = A Visit to the Lab
o.laboratory_visit = Visit the Lab and meet with Biotech Morlin
b.laboratory_visit = Biotech Morlin is in charge of the Lab located in the Haven Garrison. He \
	seeks a capable knight willing to brave the Clockworks in order to secure a cache of 'battle \
	sprites' lost during the crash of the Skylark.

n.biotech_chief = Morlin
n.laboratory_visit = Morlin
m.laboratory_visit_1a = Greetings, {0}!  I hear you've recently arrived in Haven from across the \
	great chasm.  While you were out there, did you encounter any of our battle sprites?

r.laboratory_visit_1a = What's a 'battle sprite'?

m.laboratory_visit_2a = Ah, that's right, you're a new recruit.  Most knights encounter their \
	first sprite on the battlefield.  Chances are you've not had the opportunity to see one yet. \n\
	\n\
	Allow me to explain...

r.laboratory_visit_2a = Continue

#(image of proto sprite)
m.laboratory_visit_3a = A battle sprite is an AI-driven construct capable of reconnaissance and \
	light combat support.  Battle sprites are highly adaptable.  Their AI allows them to acutely \
	observe their surroundings and aid their knight in the most optimal way.

r.laboratory_visit_3a = Sounds very useful. How do I get one?

#(same image of proto sprite)
m.laboratory_visit_4a = When a battle sprite is issued to a knight, a 'bond' is written into the \
	sprite's code to support the knight no matter the circumstances.  They will never leave your \
	side! \n\
	\n\
	Unfortunately, the cargo crates holding the Skylark's cache of battle sprites fell deep into \
	the Clockworks after the crash.

r.laboratory_visit_4a = How can I help, Morlin?

m.laboratory_visit_5a = A recon squad has managed to track down where many of these battle \
	sprites have landed.  Rhendon has been sent ahead to scout out three of these sites and will \
	meet up with you in the Clockworks. \n\
	\n\
	You must secure our battle sprites before they fall into enemy hands!

r.laboratory_visit_5a = Leave it to me, Morlin. I'll secure those sprites.

# RANK 2-2

m.skies_under_cradle = Skies Under Cradle
o.skies_under_cradle = Chart an expedition through the Aurora Isles
b.skies_under_cradle = The Clockworks are a fascinating underground complex that houses entire \
	worlds within its colossal, iron geo-globes.  One of them that recon knights have \
	discovered is known as the 'Aurora Isles,' a series of mysterious floating islands \
	under a false sky. \n\
	\n\
	As a newly ranked Apprentice, you now have clearance to explore the ruins within these \
	islands and collect any useful materials you may discover.

m.scarlet_fortress = The Scarlet Fortress
o.scarlet_fortress = Chart an expedition through the haunted halls of the Scarlet Fortress
b.scarlet_fortress = Entirely different from the Aurora Isles, recon knights have discovered \
	another geo-globe containing the remains of a seemingly ancient castle.  Dubbed the \
	'Scarlet Fortress,' this crumbling castle is also the home to a horde of restless spirits. \
	Proceed with caution when exploring its twisting passages.

m.monstrous_research = Monstrous Research
o.monstrous_research = Turn in the requested materials to Spiral HQ for research
b.monstrous_research = By now you have likely collected a few material samples from your early \
	expeditions into the Clockworks.  Spiral HQ is requesting some of those materials for \
	their ongoing research of the creatures inhabiting the Clockworks.

m.alchemy_beginners = Alchemy for Beginners
o.alchemy_beginners = Learn about the wonders of alchemy!
b.alchemy_beginners = Alchemy is a craft mastered by the Spiral Knights that allows for the \
	inherent powers of various materials to awaken and fuse with each other in order to form \
	powerful, new items!  The Spiral Order has relied on alchemy as their primary means of \
	creating the very arsenals that Knights have relied upon for centuries. \n\
	\n\
	Discover how it will become an important part of your survival on this alien world.

n.alchemy_beginners = Bosco
#(port to alchemy station in the bazaar)
m.alchemy_beginners_1a = Hello there, {0}!  My name is Bosco and I'm here to give you a rundown \
	on the basics of alchemy. \n\
	\n\
	It's pretty simple stuff really, thanks to these Alchemy Stations.  They do all the \
	heavy lifting for ya!

r.alchemy_beginners_1a = I'm all ears, Bosco.

#(image)
m.alchemy_beginners_2a = Ok, here is the gist of it all- collect materials and recipes and \
	turn them into weapons and gear.  Easy right?

r.alchemy_beginners_2a =  Continue

#(image)
m.alchemy_beginners_3a = When you acquire a recipe and use it, it consumes \
	the recipe, but logs it in your 'known' recipes forever!  Once it's known, you can create \
	as many items of that recipe as you wish, so long as you have the right materials.

r.alchemy_beginners_3a =  Continue

#(image)
m.alchemy_beginners_4a = When you interact with an Alchemy Station you will open the alchemy \
	interface where you can see your known recipe...

r.alchemy_beginners_4a = Continue

#(image)
m.alchemy_beginners_5a = ...and the required materials, orbs of alchemy, and crowns needed to \
	transmute the item.

r.alchemy_beginners_5a = Continue

#(image)
m.alchemy_beginners_6a = Many recipes require an equip-able, leveled item.  These are called \
	'special items' in a recipe and you are free to select the special item you wish, provided \
	it's the correct item. \n\
	\n\
	This is useful if the recipe calls for an item that you have two copies of, but \
	one is superior.

r.alchemy_beginners_6a = Continue

#(image)
m.alchemy_beginners_7a = Once you're ready to transmute the item, click 'Transmute' \
	and hold your breath!

r.alchemy_beginners_7a = Hold my breath?

#(image)
m.alchemy_beginners_8a = Yes indeed!  That's because every time you transmute an item through \
	alchemy, there is a chance you can get one of several Unique Variants that makes your item \
	much more powerful!

r.alchemy_beginners_8a = Sounds great!

m.alchemy_beginners_9a = That covers the basics for alchemy.  I can go over it all once more \
	if you like, or mark you as having cleared this mission and send you on your way.

r.alchemy_beginners_9a = Let's go over it all one more time.
r.alchemy_beginners_9b = I think I've got it, thanks!

m.alchemy_beginners_10a = No problem, from the top then...
r.alchemy_beginners_10a = Continue
#(start from the first image)
m.alchemy_beginners_10b = You'll be alchemizing amazing items in no time!  In fact, here are a \
	couple of recipes to get you started.

r.alchemy_beginners_10b = Complete mission

m.time_to_crafty = Time to Get Crafty
o.time_to_crafty = Alchemize a Hot Edge and Frost Gun and turn it in for inspection.
b.time_to_crafty = Bosco would like you to alchemize a Hot Edge and Frost Gun for him to inspect. \
	If it's good, he'll inform Spiral HQ that you've grasped the vital art of alchemy and even \
	add a couple powerful Unique Variants to your new weapons.  What a generous guy!

m.mission_sprite_1 = A Revelation in Flames
o.mission_sprite_1 = Secure a cache of battle sprites and return them to the Lab
b.mission_sprite_1 = Rhendon is waiting for you in an area of the Clockworks known as the Sunset \
	Steppes where reconnaissance has located a cache of missing battle sprites.  Secure the \
	sprites and clear the area of hostiles.  You are authorized to utilize any sprites you secure \
	in order to complete the mission.

n.mission_sprite_1a = Rhendon
m.mission_sprite_1_1a = Alright, {0}, let's get started. Looks like you and I get to go on a \
	little sprite hunt, eh? \n\
	\n\
	I've aligned my tracker with the recon knight intel but something's not right. The energy \
	signature I'm detecting is erratic, but still definitely a battle sprite. They may be in \
	trouble, so let's hurry!

m.mission_sprite_1_2a = What the- are these...battle sprites? Something has happened to them, \
	they've changed into some kind of creature.

#>(auto proceed)
#[image of Rhendon reaching out to a Drakon who is responding in a friendly manner]
#(Rhendon reaches out to one of the battle sprites)

m.mission_sprite_1_3a = They seem friendly. In fact they seem to behave just like the battle \
	sprites I know. Only difference is they, uh, well, look like dragons.

#>(auto proceed)

#[spawn a drakon on every party member]
m.mission_sprite_1_4a = Hey, it looks like one of the sprites has taken a liking to you! Well, \
	let's not let that extra power go to waste, I'll stay here and protect these sprites. You use \
	your new friend to help clear the rest of the area of hostiles.

m.mission_sprite_1_5a = I'll stay here and protect these sprites. Some of these sprite transport \
	crates are empty. I think someone or something is after them. \n\
	\n\
	You go on ahead and clear the area of hostiles so that a rescue squad can arrive safely.

r.mission_sprite_1_5a = I'm on it!

# Post-mission lab report
# Note: Morlin is standing over by the sprite table thing examining the drakon
n.mission_sprite_1b = Morlin
m.mission_sprite_1_6a = This is astounding! The battle sprites you recovered from the \
	Sunset Steppes have somehow morphed into a new entity!

r.mission_sprite_1_6a = They look like dragons from fairy tales.

m.mission_sprite_1_7a = Indeed.  Though their cellular identity is still wholly that of a battle \
	sprite.  My hypothesis is that somehow they rapidly evolved to survive in their new \
	environment, but how?  Our technology could never do something like that...

r.mission_sprite_1_7a = Cradle is growing more mysterious by the day.

m.mission_sprite_1_8a = Yes.  It would seem as though we have much to learn of this place. \n\
	\n\
	Rhendon's report noted that many of the sprites were missing from the site. He suggested \
	foul play.

r.mission_sprite_1_8a = Perhaps gremlins are trying to steal our technology?

m.mission_sprite_1_9a = If so, we must prevent further damage.  Now please, there are yet more \
	sprites to be rescued.  And who knows what we'll discover when we get there!

r.mission_sprite_1_9a = End conversation

m.mission_sprite_2 = Angels from Antiquity
o.mission_sprite_2 = Secure a cache of battle sprites and return them to the Lab
b.mission_sprite_2 = Rhendon is waiting for you in an area of the Clockworks known as the \
	Restless Railroad where reconnaissance has located a cache of missing battle sprites. Secure \
	the sprites and clear the area of hostiles. You are authorized to utilize any sprites you \
	secure in order to complete the mission.

n.mission_sprite_2a = Rhendon
m.mission_sprite_2_1a = How about this place, huh? Looks like some kind of old rail station \
	overrun with restless spirits. What an odd place to find underground. \n\
	\n\
	Anyway, we better head to the cache of sprites fast given what we found back in the Sunset \
	Steppes. Let's go!

m.mission_sprite_2_2a = First dragons and now... little winged feline creatures? I can't believe \
	we're seeing this phenomenon again!

#>(auto proceed)
#[spawn a seraphynx on every party member]
m.mission_sprite_2_3a = Wow, {0}, you seem to have a way with battle sprites! Let's not waste any \
	time. Clear the path ahead so a rescue team can get through safely!

m.mission_sprite_2_4a = Uh, I think these sprites are studying these old books. I didn't even \
	know they could read! \n\
	\n\
	Anyway, I'll stay here and protect these sprites. I see more empty transport crates; not good. \
	You go on ahead and clear the area of hostiles so that a rescue squad can arrive safely.

r.mission_sprite_2_4a = I'm on it!

# Post-mission lab report

n.mission_sprite_2b = Morlin
m.mission_sprite_2_6a = Once again these sprites seem to have adapted their form to suit their \
	surrounding environment.

r.mission_sprite_2_6a = What have they become this time?

m.mission_sprite_2_7a = It's unclear, {0}. Given Rhendon's report, I'd say they learned something \
	from the old arcane tomes you discovered near these sprites. Fascinating that they appear to \
	have adapted their combat abilities because of this.

r.mission_sprite_2_7a = Are you saying these sprites learned magic spells from an old book?

m.mission_sprite_2_8a = Yes, it seems that these sprites have mastered the ability to focus their \
	powers on skills that protect their knight. Given that and their appearance I've dubbed them \
	'seraphynx.'

r.mission_sprite_2_8a = Clever.

m.mission_sprite_2_9a = Yes I know. Anyway I also understand that some of the sprite transport \
	crates were empty again. Something is not right... \n\
	\n\
	Now then, secure that last cache of sprites before whatever is stealing sprites finds it!

r.mission_sprite_2_9a = I'm on my way.

m.mission_sprite_3 = The Phantom Mask
o.mission_sprite_3 = Secure a cache of battle sprites and return them to the Lab
b.mission_sprite_3 = Rhendon is waiting for you in an abandoned gremlin chemical plant where \
	reconnaissance has located a cache of missing battle sprites. Secure the sprites and clear \
	the area of hostiles. You are authorized to utilize any sprites you secure in order to \
	complete the mission.

n.mission_sprite_3a = Rhendon
m.mission_sprite_3_1a = Be on your guard here, {0}, whatever the gremlins were up to here has made \
	for a very treacherous environment. \n\
	\n\
	Let's hurry to the sprite cache before any more are lost!

m.mission_sprite_3_2a = Yikes, are those the sprites or some kind of phantom?

m.mission_sprite_3_3a = Once again the sprites have changed and this time they're really creeping \
	me out!

# [spawn a maskeraith on every party member]

m.mission_sprite_3_4a = Heh, don't look now, {0}, but there's a ghost over your shoulder! Let's \
	hope these sprites haven't invested all their power into good looks. \n\
	\n\
	Use that one to clear the path ahead so a rescue team can get through safely!

m.mission_sprite_3_5a = Once again, lots of empty transport crates. Trouble is brewing, {0}. You \
	best go on ahead and clear the area of hostiles so that a rescue squad can arrive safely.

r.mission_sprite_3_5a = Anything else?

m.mission_sprite_3_6a = I'm curious... what do you think is behind their masks? Wait, no, I don't \
	want to know.

r.mission_sprite_3_6a = End conversation

# Post-mission lab report

n.mission_sprite_3b = Morlin
m.mission_sprite_3_7a = Discoveries on the planet grow stranger by the day. Now our sprites are \
	adapting the form of some kind of phantom.

r.mission_sprite_3_7a = They look like living shadows.

m.mission_sprite_3_8a = Yes, quite. These sprites have adapted the power to cloak, to use the \
	very shadows around them for subterfuge. Between that and their newfound skills in toxins and \
	debilitations, I'd say they could be quite handy on the battlefield.

r.mission_sprite_3_8a = I assume you've named them as well?

m.mission_sprite_3_9a = Why yes, given their outward appearance I think 'maskeraith' suits them \
	nicely!

r.mission_sprite_3_9a = Charming.

m.mission_sprite_3_10a = Your sarcasm has been noted. \n\
	\n\
	Now then, about those empty sprite transport crates; we have confirmed foul play.

r.mission_sprite_3_10a = Give me the details.

m.mission_sprite_3_11a = A recon squad has reported a large construct monster the likes of which \
	we've never seen before making off with several battle sprites. We believe the gremlins to be \
	behind it all.

r.mission_sprite_3_11a = I'll put an end to their scheme.

m.mission_sprite_3_12a = I admire your courage but if initial reports of this construct monster \
	are accurate, you'll need some additional help. I'll prepare a selection of battle sprites to \
	be ready for bonding to you, {0}. We'll talk again once I've made the proper preparations.

r.mission_sprite_3_12a = See you soon, Morlin.

# RANK 2-3

m.choose_your_sprite = An Eternal Bond
o.choose_your_sprite = Talk to Morlin and choose a battle sprite as your companion
b.choose_your_sprite = Morlin has prepared three of the battle sprites you rescued for you to \
	evaluate. You have been authorized to choose one of these battle sprites and become bonded \
	with it. This battle sprite will forever aid you in your future adventures, so \
	choose wisely. \n\
	\n\
	This mission cannot be repeated.

n.choose_your_sprite = Morlin
m.choose_your_sprite_1a = Greetings, {0}! Now that I've had sufficient time to research the \
	battle sprites you rescued I can give you a proper evaluation of each. \n\
	\n\
	Despite their well, strange appearance, we have concluded that these 'new' battle sprites are \
	not only suitable for combat but may have even further enhanced capabilities as a result of \
	their transformation.

r.choose_your_sprite_1a = Continue

m.choose_your_sprite_2a = I will provide you with a summary of each battle sprite. In recognition \
	of your valor in rescuing these sprites, Spiral HQ has authorized you to bond with one. This \
	bond will last forever and is a significant responsibility. \n\
	\n\
	Please think carefully before making your decision; there is no going back once you decide.

r.choose_your_sprite_2a = I understand, Morlin.

m.choose_your_sprite_3a = There are three distinct battle sprites available. Each has responded \
	to the power emanating from this world differently and each offers a unique combat \
	experience. \n\
	\n\
	These sprites include the fiery drakon, the radiant seraphynx, and the shadowy maskeraith.

r.choose_your_sprite_3a = Tell me about the drakon.
r.choose_your_sprite_3b = Tell me about the seraphynx.
r.choose_your_sprite_3c = Tell me about the maskeraith.
r.choose_your_sprite_3d = I am ready to choose my battle sprite.
r.choose_your_sprite_3e = I'm not ready to choose yet.

#[image of a drakon using his skills]
m.choose_your_sprite_4a = The drakon is a battle sprite that embodies fiery destruction. Its \
	skills focus on direct assault: firebolt creates an explosive projectile, flame barrier \
	surrounds its knight with protective fireballs, and firestorm creates a massive wave \
	of flames. \n\
	\n\
	The drakon is best suited for fearless knights who prefer frontline, destructive combat.

r.choose_your_sprite_4a = The drakon sounds like the battle sprite for me!
r.choose_your_sprite_4b = Tell me about the other battle sprites.

#[image of a seraphynx using his skills]

m.choose_your_sprite_5a = The seraphynx is a battle sprite that embodies protection and \
	restoration. Its skills focus on supporting knights in combat: ray of light creates a steady \
	beam of holy light, heart attack increases the chance of hearts dropping from monsters, and \
	angelic aura creates a light shield that protects its knight and party members within. \n\
	\n\
	The seraphynx is best suited for knights who wish to protect their party and provide them aid.

r.choose_your_sprite_5a = The seraphynx sounds like the battle sprite for me!

#[image of a maskeraith using his skills]

m.choose_your_sprite_6a = The maskeraith is a battle sprite that embodies deception and \
	debilitation. Its skills focus on subterfuge: caustic quills fire poisonous quills that \
	explode when followed with an attack, shadow cloak allows a knight to become invisible to \
	monsters, and hexing haze allows the knight to inflict monsters with a timed damage blast. \n\
	\n\
	The maskeraith is best suited for knights who wish to lurk in the shadows and strike the \
	enemy with sneak attacks.

r.choose_your_sprite_6a = The maskeraith sounds like the battle sprite for me!

m.choose_your_sprite_7a = Excellent! Which battle sprite will you choose as your companion?

r.choose_your_sprite_7a = I choose the drakon.
r.choose_your_sprite_7b = I choose the seraphynx.
r.choose_your_sprite_7c = I choose the maskeraith.
r.choose_your_sprite_7d = I would like to hear about the battle sprites again.
r.choose_your_sprite_7e = I'm not ready to choose yet.

#[image of a drakon using his skills]
m.choose_your_sprite_8a = So, you have chosen the fiery drakon, battle sprite of those who prefer \
	frontline, destructive combat? \n\
	\n\
	Once you choose there is no going back!

r.choose_your_sprite_8a = Yes, I choose the drakon.
r.choose_your_sprite_8b = I'm not sure, tell me again about the battle sprites.

#[image of a seraphynx using his skills]
m.choose_your_sprite_9a = So, you have chosen the radiant seraphynx, battle sprite of those who \
	wish to protect their party and provide them aid? \n\
	\n\
	Once you choose there is no going back!

r.choose_your_sprite_9a = Yes, I choose the seraphynx.

#[image of a maskeraith using his skills]

m.choose_your_sprite_10a = So, you have chosen the shadowy maskeraith, battle sprite of those who \
	wish to lurk in the shadows and strike the enemy with sneak attacks? \n\
	\n\
	Once you choose there is no going back!

r.choose_your_sprite_10a = Yes, I choose the maskeraith.

m.choose_your_sprite_11a = Congratulations, {0}! You have become bonded with your battle sprite! \
	It will no doubt be an invaluable companion to you in your missions ahead. \n\
	\n\
	If you have any further questions about raising your new battle sprite, be sure to speak to \
	me or Biscotti here in the Lab.

r.choose_your_sprite_11a = Thank you, Morlin. I will do my best to raise this sprite well.

m.choose_your_sprite_12a = That's fine, just talk to me again when you are ready to choose.
r.choose_your_sprite_12a = End conversation

# RANK 3-1

m.prestigious_opportunity = A Prestigious Opportunity
o.prestigious_opportunity = Contact Intel Agent Kora and receive Prestige Mission authorization
b.prestigious_opportunity = It seems you have been excelling in the eyes of Spiral HQ.  Contact \
	Intel Agent Kora and learn how you can take on extra missions from Spiral HQ.

n.prestigious_opportunity = Kora
m.prestigious_opportunity_1a = Greetings {0}, and congratulations on becoming a Squire!  Your \
	performance has caught the attention of Spiral HQ and they have given you authorization to \
	now take on Prestige Missions. \n\
	\n\
	Prestige Missions are select missions offered to you daily that offer prestige as rewards \
	for completion.  Sometimes these missions require supplying Spiral HQ or other Knights \
	with items and other times they will have you exploring the Clockworks.

r.prestigious_opportunity_1a = Sounds good, Kora.

m.prestigious_opportunity_2a = Prestige Missions are entirely optional and cannot be repeated \
	in a single day.  And don't forget to keep an eye out for special missions that offer large \
	prestige rewards!

r.prestigious_opportunity_2a = Thank you, Kora.  I'll do my best.

m.prestigious_opportunity_3a = I have faith in you, {0}.  I just know that you will be among \
	the select Knights skillful enough to reach the Core and with any luck, \
	get us off this planet.

r.prestigious_opportunity_3a = Complete Mission

m.minerals_rock = Minerals Rock!
o.minerals_rock = Report to Chief Geo Knight Wegner in the Haven Arcade
b.minerals_rock = Chief Geo Knight Wegner is responsible for researching the strange minerals \
	that Knights have begun mining from within the Clockworks.  He believes that they may hold \
	the answer to gaining entry into the Core and retrieving the energy needed to \
	restore the Skylark. \n\
	\n\
	Meet with him in the Haven Arcade and gain an understanding of how you can help his research \
	as well as harness the true power of the Haven Arcade!

n.arc_mintut = Wegner

m.arc_mintut_1 = Hello. I'm Wegner, Chief Geo Knight of the Skylark and head of \
  geological studies within the Clockworks.

r.arc_mintut_1 = I'm here to learn about the minerals found within the Clockworks.

# IMAGE: step1_minerals.png
m.arc_mintut_2 = During your travels in the Clockworks you will encounter five special minerals: \
  crimsonite, moonstone, valestone, luminite and dark matter.

r.arc_mintut_2 = Continue

# IMAGE: step2_gather.png
m.arc_mintut_3 = You will find ore deposits in all levels of the Clockworks, and you must attack \
  them in order to break them down into a size you can carry. You can only pick up one at a \
  time, but you can swap them by picking up \
  another. Look for the biggest, shiniest one you can find. They are the most valuable.

r.arc_mintut_3 = Continue

m.arc_mintut_4 = Once you safely reach the elevator, the mineral you are carrying gets deposited in your \
  arsenal for use later. Everyone in your party gets everyone else's minerals, so no need \
  to fight over who gets the best one!

r.arc_mintut_4 = Continue

m.arc_mintut_5 = Minerals are used to create sprite food in the Laboratory. Sprite food is very \
  important to the development of your sprite, so grab those minerals when you see them!

r.arc_mintut_5 = Continue

m.arc_mintut_6 = Our geological research is ongoing, so there may yet be other fascinating uses \
  for these strange and powerful minerals.

r.arc_mintut_6 = Sounds great! Thanks for the info!

# TRUNCATED VERSION FOR WITHIN THE CLOCKWORKS
m.cwt_mintut_1 = This is Wegner, Chief Geo Knight of the Skylark. I'm picking up a high \
  concentration of mineral deposits in your area.

r.cwt_mintut_1 = Minerals? You mean these colorful rocky pillars?

# IMAGE: step1_minerals.png
m.cwt_mintut_2 = Yes, exactly! During your travels in the Clockworks you will encounter five \
  special minerals: crimsonite, moonstone, valestone, luminite and dark matter.

r.cwt_mintut_2 = Continue

# IMAGE: step2_gather.png
m.cwt_mintut_3 = Attack a mineral column in order to break it down into a size you can \
  carry. You can only pick up one at a time, but you can swap them by picking up another. Look \
  for the biggest, shiniest one you can find. They are the most valuable.

r.cwt_mintut_3 = Continue

m.cwt_mintut_4 = Once you reach the elevator, the mineral you are carrying gets deposited in your \
  arsenal for use later. Everyone in your party gets everyone else's minerals, so no need \
  to fight over who gets the best one!

r.cwt_mintut_4 = Continue

m.cwt_mintut_5 = Minerals are used to create sprite food in the Laboratory. Sprite food is very \
  important to the development of your sprite, so grab those minerals when you see them!

r.cwt_mintut_5 = Continue

m.cwt_mintut_6 = Our geological research is ongoing, so there may yet be other fascinating uses \
  for these strange and powerful minerals.

r.cwt_mintut_6 = Sounds great! Thanks for the info!

m.alien_ooze = Alien Ooze
o.alien_ooze = Rescue the field research team from a lichen colony
b.alien_ooze = One of our field research teams is under siege from a large colony of lichens. \
	Lichens are an alien species of the slime family thought to have come to the Clockworks via \
	a meteor that crashed on to the surface of Cradle.  This particular species of slime is \
	formed from innumerable smaller slimes that form mobile, sentient 'colonies.' \n\
	\n\
	Lichen colonies can further combine to form larger and larger versions of themselves, rapidly \
	evolving a range of deadly claws and barbs.  Prevent them from combining at all costs and \
	save the research team!

n.techknight_ooze = Tech Knight Povla
m.alien_ooze_1a = I have nothing to say yet, but it involves Beast Bells. (DEV-ONLY)

r.alien_ooze_1a = End conversation

m.toy_soldiers = Toy Soldiers
o.toy_soldiers = Destroy the Mecha Knight factory's production center
b.toy_soldiers = Recon Knights are reporting much greater numbers of mecha knights in the \
	first stratum of the Clockworks and have discovered a mecha knight production facility \
	close to Haven. \n\
	\n\
	Mecha knights are believed to be gremlin-engineered sentries of the construct family that \
	share many of the capabilities of a Spiral Knight.  Proceed with caution when seeking out the \
	production center and then shut it down for good!

m.monstrous_research_2 = Monstrous Research
o.monstrous_research_2 = Turn in the requested materials to Spiral HQ for research.
b.monstrous_research_2 = By now you have likely collected some interesting materials in the first \
	stratum of the Clockworks that would be useful to Spiral HQ.  Help advance their continued \
	research of the mysteries of Cradle by donating materials.

m.the_collector = The Collector
o.the_collector = Save the sprites and the researchers from the Collector
b.the_collector = There have been scattered reports of a large, mechanical entity we have named \
	the 'Collector' who has been intercepting our knights and taking both them and the sprites \
	they were tracking and imprisoning them in a well-guarded compound deep within the \
	Clockworks.  Armed with your new sprite, your mission is to find this 'Collector' and rescue \
	the knights and sprites it has taken captive.

n.collector_prisoner = Veteran Knight
m.collector_prisoner_1a = Ugh, I can barely see... did Spiral HQ send you to rescue us?

r.collector_prisoner_1a = Yes, but can you tell me what happened?

m.collector_prisoner_2a = My rescue team was ambushed by some giant mechanical horror. We didn't \
	stand a chance. I'm glad you got here when you did, otherwise I don't know if we would have \
	made it.

r.collector_prisoner_2a = Can you make it back to Haven?

m.collector_prisoner_3a = I think so... we'll try and slip out when we can.\n\
	\n\
	Oh, but be careful! Whatever caught us is still here, guarding a large cache of our captured \
	battle sprites. If you plan on fighting it, beware its deadly charge. Good hunting!

r.collector_prisoner_3a = End conversation

# RANK 3-2

m.pioneers = The Pioneers
o.pioneers = Contact Intel Agent Kora via comlink
b.pioneers = After the crash of the Skylark, Captain Ozlo selected an elite squad of Spiral Knights to be the first to enter the Clockworks.  They were never seen again.  Contact Intel Agent Kora and learn how you will play a role in solving this mystery.

n.pioneers = Kora
m.pioneers_1a = Hello {0}, I hope you're doing well.  Something has come up that will require \
	you to face your greatest challenge yet. \n\
	\n\
	I have an order from Spiral HQ that comes from Captain Ozlo himself.  You have been \
	selected as one of the Knights to actively search for traces of the Alpha Squad.

r.pioneers_1a = Alpha Squad?  Sounds vaguely familiar...

m.pioneers_2a = It should, there're plenty of new recruits that chatter about them constantly. \
	They're like heroes to some knights. \n\
	\n\
	The Alpha Squad was an elite squad of knights that Ozlo personally selected to first enter \
	the Clockworks in an effort to locate the source of the massive energy signal below.  Because \
	all systems on the Skylark were offline for several weeks, radio communication was not \
	possible.  Instead, they left a series of recon modules throughout their travels, sort of \
	like a breadcrumb trail.

r.pioneers_2a = Continue

m.pioneers_3a = When our technicians finally got the Skylark's communications systems online, we \
	could not establish a link with the Alpha Squad and they have never been heard from since. \
	Their channel is completely dead. \n\
	\n\
	Their dead line is what has us all scratching our heads.  Our comlinks are built to withstand \
	all manners of extreme conditions, even explosions.  Heck, they survived the Skylark going \
	down after all.  There's nothing I can think of that could kill the link completely.

r.pioneers_3a = Where do I come in to all of this?

m.pioneers_4a = We need you to discover what happened to them.  You'll start by seeking out known \
	locations of their recon modules and collecting them for analysis.  I will be in charge of \
	locating their general whereabouts and directing you toward them.  It's your job to go into \
	the wild to retrieve them. \n\
	\n\
	Additionally, I'll provide you with a quick background of each of the four members of \
	the Alpha Squad: Squad Leader Euclid, Squad Guardian Grantz, Squad Recon Parma, and Squad \
	Technician Rulen.

r.pioneers_4a = Tell me about Squad Leader Euclid.

m.pioneers_5a = Euclid wasn't your typical knight.  By the time most in his division were getting \
	their Squire crest, he had already achieved Vanguard.  As a Squad Leader, he lead a series \
	of successful assaults against the Morai during the liberation of Isora.  A brilliant \
	tactician, he was known for getting the job done with half the knights of other squads.

r.pioneers_5a = Continue

m.pioneers_6a = It was for this reason that Ozlo selected him to take a small squad down into the \
	unknown depths of the Clockworks.  After all, if you cut your teeth battling under Morai \
	typhoon fire you could probably handle anything right? \n\
	\n\
	But maybe the Clockworks proved too much for even his ability.  We just don't know.

r.pioneers_6a =  Tell me about Squad Guardian Grantz.

m.pioneers_7a = Grantz was the real veteran of the bunch.  A seasoned Guardian, Grantz \
	specialized in keeping his squad safe, namely by crushing anything that would mean to \
	do them harm. \n\
	\n\
	Grantz took his Guardian's Oath very seriously, often putting himself directly in harm's way \
	in order to protect another.  The guy was selfless.  I imagine that if disaster truly befell \
	the Alpha Squad, Grantz didn't let it end without one hell of a fight.

r.pioneers_7a = Tell me about Squad Recon Parma.

m.pioneers_8a = Parma was the youngest of the bunch, a very talented Recon, but with little \
	combat experience.  She and I went to academy together and I can remember the day when the \
	simulator technicians had thought their program was busted due to Parma's performance.  She \
	actually apologized! \n\
	\n\
	But still, I'm worried about her.  From the reports that I've read, the Clockworks are \
	unlike anything we've ever encountered.  I only hope that as she keeps them informed of \
	what's ahead, that they will watch her back.

r.pioneers_8a = Tell me about Squad Technician Rulen.

m.pioneers_9a = Rulen was recruited as the technical genius that Captain Ozlo believed would be \
	required for navigating the vast, mechanized world of the Clockworks.  His primary \
	responsibilities included everything from disabling locks to repairing armor to wrecking \
	sentient constructs.  He was additionally the lead on analyzing the Core once the squad \
	reached it.

r.pioneers_9a = Continue

m.pioneers_10a = Rulen was very... logical.  I think he was very aware of the odds we have of \
	reaching the Core and then doing something with it in order to restore the Skylark.  I think \
	Rulen knew exactly what kind of mission he was undertaking when they made their first descent \
	into the darkness of the Clockworks.

r.pioneers_10a = So where do I start?

m.pioneers_11a = Right, down to business.  We've located an Alpha Squad recon module in \
	an area of the Clockworks known as the 'Gloaming Wildwoods.'  However, this particular zone \
	is home to a horrible creature known as 'the Snarbolax.' \n\
	\n\
	The Snarbolax has made fast work of Squires like yourself, but I know you can handle it, {0}. \
	But you're going to need to prepare.  I've issued you a series of missions that will \
	allow you to assemble a loadout fit for taking on this terrible beast and reclaiming \
	that recon module!

r.pioneers_11a = I'll do my best to recover the recon module and destroy the Snarbolax!

m.pioneers_12a = We're counting on you, {0}.

r.pioneers_12a = End conversation

m.faith_armor = Faith in Armor
o.faith_armor = Navigate the trap-filled chamber and rescue the apprentice, Wilks
b.faith_armor = An apprentice named Wilks who had just arrived from a Rescue Camp has found \
	himself in what Spiral HQ calls a 'Trap Chamber.'  These levels of most likely gremlin \
	design seem to be specifically built to trap and ultimately eliminate those attempting \
	to explore the Clockworks. \n\
	\n\
	Wilks probably didn't know what he had got himself into until it was too late.  Now \
	he's stuck somewhere in the chamber and needs your help. \n\
	\n\
	Some traps can be avoided and sometimes you may find that you just have to take the hit. \
	In saving Wilks, you will no doubt learn the true value of strong armor.

m.strength_unity = Strength in Unity
o.strength_unity = Defend the Geo Knights from a monstrous assault
b.strength_unity = Something has riled up a pack of beasts in the Aurora Isles and they have \
	descended upon a Geo Knight research team.  Cornered, the team has sent a distress signal and \
	Spiral HQ has issued the task of saving them to you. \n\
	\n\
	By standing together, the Geo Knights have made it this long but their time is running out. \
	Assemble a team and confront the beasts that seek to devour your fellow knights!

m.blades_fallen = Blades of the Fallen
o.blades_fallen = Place the sword of an unknown knight at the memorial in the soldier's graveyard
b.blades_fallen = Not every knight who enters the Clockworks returns to feel the sun on \
	their face once more.  Within the perilous depths of the Clockworks, those that brave its \
	dangers always face the reality that every expedition may be their last.  Sometimes \
	their bodies can be recovered and other times all that is left is remnants of their gear. \n\
	\n\
	Just outside of Haven, Spiral HQ has built a soldier's graveyard where fallen knights can lay \
	to rest.  As a Spiral Knight, you must face the reality of death in order to understand its \
	gravity. \n\
	\n\
	Deliver the remains of an unknown knight, a sword, to a memorial within the graveyard.  But \
	stay alert- dark energies resonate from the graveyard, attracted to the countless souls it \
	houses.

# RENAMED FROM roar_snarbolax
m.shadow_beast = Shadow of the Beast
o.shadow_beast = Defeat the Snarbolax in the Gloaming Wildwoods and recover the recon module
b.shadow_beast = Spiral HQ has detected a recon module left by the Alpha Squad somewhere within \
	the Gloaming Wildwoods.  It is your mission to locate and retrieve the module. \n\
	\n\
	The Gloaming Wildwoods is home to packs of wild beasts that have proven deadly for squads in \
	the past. Because of this, Tech Knights have placed Beast Bells throughout the area. \
	Striking them should stun any beasts caught within the sound wave they produce. \n\
	\n\
	Be advised that Recon Knights have reported the presence of a terrible beast the likes which \
	we have not seen before stalking this forest.  Known as 'the Snarbolax,' it appears as a \
	shadowy mass of fangs and claws and seems completely immune to our weaponry.  Should you \
	encounter it, try and find a means of escape as fast as possible.

# RANK 4-1
m.new_chapter = A New Chapter
o.new_chapter = Contact Intel Agent Kora via comlink
b.new_chapter = Having defeated the Snarbolax and recovered the Alpha Squad recon module, it's \
	time to check in with Intel Agent Kora to get a report on the analysis of the module and \
	information about certification in the Hall of Heroes.

n.new_chapter = Kora

m.new_chapter_1a = Congratulations on becoming a Soldier, {0}!  I hear you really gave that \
	Snarbolax a clobbering, well done! \n\
	\n\
	We've had an opportunity to analyze Euclid's recon module you discovered in the Snarbolax's \
	lair.  Based on the recording, it seems that Euclid suspected something our Geo Knights \
	discovered sometime after the crash- that the levels within the Clockworks are comprised of \
	terrain from multiple alien worlds!

r.new_chapter_1a = What? How is that possible?

m.new_chapter_2a = We can't say for sure just yet, but it would seem as though that however \
	Cradle was formed, it included large pieces of other worlds around it.  If this is true then \
	we've never seen anything like this before.

r.new_chapter_2a = What a strange world.  What else do you have for me, Kora?

m.new_chapter_3a = Spiral HQ has authorized you to visit the Hall of Heroes and receive your \
	2 Star Certification. \n\
	\n\
	The Hall of Heroes is a place where Knights rising in the ranks like yourself will visit to \
	both learn about and acquire new recipes for gear as well as receive certification to go \
	deeper into the Clockworks. \n\
	\n\
	Your first visit requires only that you wear all 2 Star gear, which you already have so it \
	should be a piece of cake!

r.new_chapter_3a = Thanks Kora, I'll do my best!

m.shopping_again = Let's Go Shopping Again!
o.shopping_again = Follow Bechamel on a tour of the Bazaar's more advanced offerings
b.shopping_again = Bechamel has already given you a tour of the Haven Bazaar that included where \
	to acquire new weapons, armor and recipes.  Now it's time to pay him another visit and learn \
	about some of the more advanced services the Bazaar offers. \n\
	\n\
	You will pay a visit to Punch and Vise, Brinks and even visit Bechamel's own shop!

n.shopping_again = Bechamel
m.shopping_again_1a = Hi there {0}!  Wow, you've made Soldier already?  You're really moving \
	up fast in the ranks. \n\
	\n\
	Anyway, I'm here to give you a tour of some of the Bazaar's more advanced services. \
	To start, do you want to learn how to even further power up that gear of yours?

r.shopping_again_1a = Do I ever!

m.shopping_again_2a = Who doesn't right?  Let's head over to Punch and Vise's workshop.

r.shopping_again_2a = (Follow Bechamel)
#(move to Punch and Vise)

m.shopping_again_3a = Punch and Vise are gremlin smiths that can change the properties of your \
	weapons and gear.

r.shopping_again_3a = Gremlins?!

m.shopping_again_4a = Take it easy {0}, not all gremlins are cut from the same cloth.  Some \
	disagree with the ways of King Tinkinzar and the Crimson Order.  In fact, somewhere down \
	in the Clockworks I'm told there's an entire town full of gremlins who left the Great Colony.

r.shopping_again_4a = Well, if you say so...

m.shopping_again_5a = Ok, back to business then. \n\
	\n\
	Punch can add Unique Variants, a kind of special bonus to your weapons and gear for a price. \
	But his methods are, er... chaotic.  You never really know what you're going to get. \n\
	\n\
	Vise is a little more precise.  He can unbind your weapons and gear for a price, allowing you \
	to sell or gift the item again!

r.shopping_again_5a = Handy, I'll keep it in mind.  What else you got?

m.shopping_again_6a = Let's go visit Brinks.

r.shopping_again_6a = (Follow Bechamel)
#(move to Brinks)

m.shopping_again_7a = Brinks is the Token Trader, issuing certain items to Knights in exchange for \
	tokens that can be collected within the Clockworks.  Tokens can be found in treasure blocks, \
	issued as mission rewards or found when defeating special boss monsters.

r.shopping_again_7a = I've got it.  Anything else?

m.shopping_again_8a = Just one last shop to visit and then we're done. \
	I've saved the best for last.

r.shopping_again_8a = (Follow Bechamel)
#(move to Bechamel)

m.shopping_again_9a = Here we have... me!  I'm the Accessorizor, adding accessories to your gear \
	so long as you have a ticket.  With accessories, you can make your gear really stand out in \
	a crowd, I highly suggest giving it a try.  You'll soon become the apple of every one's eye!

r.shopping_again_9a = Where do I find accessory tickets?

m.shopping_again_10a = You can find accessory tickets inside lockboxes or at the Auction House if \
	another Knight happens to be selling them.

r.shopping_again_10a = Roger.

