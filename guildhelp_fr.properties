t.hall = Si\u00e8ge de guilde
t.guild_hall_header = Si\u00e8ge de guilde
m.guild_hall_info = Le Si\u00e8ge de guilde est le centre nerveux pour tous les guildes Spiral \
  Knights. Ici, des membres de guilde peuvent prendre un repos, planifier les missions pour le \
  futur, et prendre avantage des fonctions disponibles au Si\u00e8ge de guilde. On peut \
  modifier et agrandir le Si\u00e8ge de guilde - tout sur votre commande! Le si\u00e8ge peut \
  contenir une grande vari\u00e9t\u00e9 de meubles et de salles uniques, alors coordonnez avec \
  vos amis et faites de votre Si\u00e8ge de guilde une vraie r\u00e9flexion de vous-m\u00eame! \n\
  \u00c0 la premi\u00e8re ouverture d'un Si\u00e8ge de guilde, il y a deux salles: un lobby et \
  la salle de Console de commande. Des guildes d\u00e9sirant plus d'espace \u00e0 modifier \
  peuvent acheter des agrandissements pour agrandir les dimensions de leur si\u00e8ge de \
  guilde. Ces customisations sont disponibles dans le Console de commande dans la Mode de plan.\n\
  Les guildes qui ont agrandi leurs Si\u00e8ges peuvent remplir cet espace avec une vari\u00e9t\u00e9 des salles diff\u00e9\
  rentes, disponibles au Emporium Birdsong. Ces salles existent comme des salles simples et \
  vides, parfaites pour d\u00e9corer avec des meubles, ou elles contiennent l'un des agr\u00e9ments sp\u00e9\
  ciaux, comme un terminal d'alchimie, des boutiques, et encore plus! \n\
  Les Si\u00e8ges de guilde n\u00e9cessitent une grande quantit\u00e9 des ressources \u00e0 maintenir, repr\u00e9sent\u00e9es par un co\u00fbt \u00e0 \
  l'heure pour l'entretien en Crowns. Comme un Si\u00e8ge de guilde acquiert plus des \
  agrandissements et des salles, le co\u00fbt augmentera aussi, alors assurez-vous qu'il y a \
  assez de Crowns dans votre Tr\u00e9sorerie de guilde pour payer le tout!

t.treasury = Tr\u00e9sorerie
t.treasury_header = Tr\u00e9sorerie de guilde
m.treasury_info = La tr\u00e9sorerie de guilde contient tous les items et crowns poss\u00e9d\u00e9\
  s collectivement par la guilde. Afin d'\u00eatre plac\u00e9 dans un si\u00e8ge de guilde, les \
  meubles doivent d'abord \u00eatre ajout\u00e9s \u00e0 la tr\u00e9sorerie. Les co\u00fbts des \
  nouvelles salles, des items de l'Emporium Birdsong, et les frais d'entretien hebdomadaire \
  sont aussi pay\u00e9s par la tr\u00e9sorerie, alors les membres du guildent devront \u00eatre \
  diligents pour la garder pleine de crowns!\n\
  AVERTISSMENT: Ce qui est ajout\u00e9 \u00e0 la tr\u00e9sorerie ne peut jamais \u00eatre enlev\u00e9, m\u00eame pas par le ma\u00ee\
  tre de guilde. En ajoutant des items ou des crowns \u00e0 la tr\u00e9sorerie, ils deviennent \
  pour toujours la propri\u00e9t\u00e9 du guilde, sans exceptions.
l.treasury_console = La tr\u00e9sorerie de guilde est acc\u00e9d\u00e9e en utilisant le Console \
  de commande. |action | console

t.emporium_header = Emporium Birdsong
m.emporium_info = L'Emporium Birdsong permet des membres du rang sup\u00e9rieur d\u2019acheter \
  des items pour le guilde en utilisant les fonds de la Tr\u00e9sorerie de guilde. Ces items \
  incluent une vari\u00e9t\u00e9 de meubles et am\u00e9liorations du Si\u00e8ge de guilde. Les \
  items achet\u00e9s viennent directement \u00e0 la Tr\u00e9sorerie de guilde, alors ils ne \
  peuvent pas \u00eatre retir\u00e9s du guilde. Les meubles existent dans un assortiment de \
  genres et tailles et ils sont utilis\u00e9s pour d\u00e9corer vos salles et corridors de \
  votre Si\u00e8ge de guilde. Quelques meubles ont aussi des effets sp\u00e9ciaux lorsqu'ils \
  sont activ\u00e9s! On peut placer tous les meubles dans la Tr\u00e9sorerie de guilde au Si\u00e8\
  ge de guilde en utilisant le Mode de plan. L'Emporium Birdsong est aussi la place pour \
  acheter des salles pour les nouveaux agrandissements ou pour remplacer les salles existants \
  avec les types nouvelles et diff\u00e9rentes. Comme les grandeurs du Si\u00e8ge de guildes \
  sont agrandis en ajoutant des agrandissements, la s\u00e9lection d'items disponibles dans le \
  catalogue d'Emporium Birdsong agrandit aussi. N'oubliez pas de chercher le catalogue pour \
  voir les nouveaux choses!
l.emporium_console = L'Emporium Birdsong et le Mode de plan sont acc\u00e9d\u00e9s en utilisant \
  le Console de commande. | action | console

t.storage = Entreposage
t.storage_header = Entreposage de guilde
m.storage_info = L'Entreposage de guilde fonctionne comme un Arsenal partag\u00e9. Les membres \
  de guilde du rang appropri\u00e9 peuvent ajouter ou enlever les \u00e9quipements ou des items \
  au Entreposage comme ils veulent. C'est une bonne fa\u00e7on de partager des ressources entre \
  les membres de guilde, ou pour aider des nouveaux membres! AVERTISSEMENT: Des items mis dans \
  l'Entreposage de guilde peuvent \u00eatre enlev\u00e9s et r\u00e9clam\u00e9s par n'importe \
  quel membre de guilde avec l'acc\u00e8s au Entreposage de guilde. Ne mettez pas des items \
  dans l'Entreposage de guilde si vous voulez les garder pour vous-m\u00eame!
l.storage_console = L'Entreposage de guilde est acc\u00e9d\u00e9 en utilisant le Console de \
  commande. |action | console

t.design = Mode de plan
t.design_header = Mode de plan
m.design_info = Le Mode de plan permet un membre de guilde du rang correspondant \u00e0 \
  arranger des meubles et des autres infrastructures dans un Si\u00e8ge de guilde. Lorsqu'on \
  est dans le Mode de plan, on peut les ramasser ou les placer (comme les Cl\u00e9s d'or ou les \
  Statues lourds), et par d\u00e9faut, on peut changer la direction des meubles en utilisant le \
  Molette de souris. Quand vous \u00eates content avec l'arrangement, vous pouvez Publier vos \
  changements et les montrer \u00e0 la reste de guilde avec le Console de commande.
u.design_wiki = La liste compl\u00e8te de meubles est trouv\u00e9e sur notre wiki officiel. | \
  URL | http://wiki.spiralknights.com/Furniture
l.design_console = Le Mode de plan est acc\u00e9d\u00e9 en utilisant le Console de commande. | \
  action | console

t.record = Rapports de guilde
t.record_header = Rapports de guilde
m.record_info = Les Rapports de guilde enregistrent les activit\u00e9s r\u00e9centes et \
  importantes dans le guilde, comme les dons \u00e0 la Tr\u00e9sorerie de guilde, les d\u00e9p\u00f4\
  ts et retraites des Entreposages de guilde, et des promotions, des additions, ou les d\u00e9\
  parts des membres de guilde. Ces rapports permettent les membres du rang sup\u00e9rieur de \
  suivre ceux et celles qui donnent ou prennent trop du guilde et de s'agir en cons\u00e9quence.
l.record_console = Les Rapports de guilde sont acc\u00e9d\u00e9s en utilisant le Console de \
  commande. | action | console
