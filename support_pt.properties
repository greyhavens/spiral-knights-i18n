m.file_a_complaint = REGISTRAR DEN\u00daNCIA

m.header_step1 = Voc\u00ea est\u00e1 prestes a registrar uma den\u00fancia contra \
outro jogador para que os Game Masters a analisem.

m.header_step2 = Qual infra\u00e7\u00e3o?

m.subheader_step2 = J\u00e1 salvamos o registro do chat ofensivo para anex\u00e1-lo \
\u00e0 den\u00fancia, ent\u00e3o n\u00e3o \u00e9 preciso ter pressa daqui em diante. \
Escolha com cuidado a op\u00e7\u00e3o correta que corresponde ao que \
o jogador fez:

m.subheader_step2_email = J\u00e1 salvamos o e-mail ofensivo para anex\u00e1-lo \
\u00e0 den\u00fancia, ent\u00e3o n\u00e3o \u00e9 preciso ter pressa daqui em diante. \
Escolha com cuidado a op\u00e7\u00e3o correta que corresponde ao que \
o jogador fez:

m.subheader_step2_giftbox = J\u00e1 salvamos a mensagem ofensiva da caixa de presentes para anex\u00e1-la \
\u00e0 den\u00fancia, ent\u00e3o n\u00e3o \u00e9 preciso ter pressa daqui em diante. \
Escolha com cuidado a op\u00e7\u00e3o correta que corresponde ao que \
o jogador fez:

m.header_step2-11 = N\u00e3o listado:

m.header_step3 = Enviando den\u00fancia

m.header_step4 = Obrigado!
m.subheader_step4 = Sua den\u00fancia foi enviada. Obrigado por nos ajudar a manter o jogo um \
  ambiente agrad\u00e1vel.\n\n\
\
  N\u00f3s lemos todas as den\u00fancias registradas, mas n\u00e3o informamos o que acontece com \
  cada uma delas. Talvez n\u00e3o consigamos analis\u00e1-la imediatamente, mas fique tranquilo: \
  todas s\u00e3o lidas e tratadas de acordo com nossas pol\u00edticas.

m.header_step5 = Houve um problema
m.subheader_step5 = Sua den\u00fancia falhou: {0}.

m.header_step200 = Chat ofensivo
m.subheader_step200 = Chat ofensivo geralmente inclui palavr\u00f5es, linguagem sexual, linguagem violenta \
  ou linguagem racista. Permitimos algum uso de linguagem ofensiva quando \u00e9 apenas provoca\u00e7\u00e3o \
  inofensiva, mas quando \u00e9 direcionada a jogadores e se torna pessoal, deixa de ser aceit\u00e1vel.

m.header_step201 = Spam
m.subheader_step201 = Spam \u00e9 quando algu\u00e9m repete texto ou envia longas linhas de caracteres \
  aleat\u00f3rios com o \u00fanico prop\u00f3sito de irritar os outros, porque isso enche a tela de chat e \
  impede a conversa normal.\n\n\
  \u00c9 importante que voc\u00ea s\u00f3 registre uma den\u00fancia de spam quando o spam tiver sido t\u00e3o grave \
  que impossibilitou conversar com outras pessoas. Por exemplo, algumas linhas com poucos \
  caracteres, embora talvez desnecess\u00e1rias, n\u00e3o s\u00e3o graves o bastante para justificar uma \
  den\u00fancia. Al\u00e9m disso, se as linhas repetidas estiverem muito espa\u00e7adas (como 10 segundos \
  entre elas), isso tamb\u00e9m n\u00e3o impedir\u00e1 as pessoas de conversar, mesmo que seja irritante.

m.header_step202 = Incomodando
m.subheader_step202 = Se o jogador sobre o qual voc\u00ea quer reclamar est\u00e1 apenas incomodando, isso \
  n\u00e3o se qualifica como motivo para den\u00fancia.\n\n\
\
  Coisas irritantes incluem xing\u00e1-lo ou provoc\u00e1-lo.

m.header_step203 = Menor de idade
m.header_step204 = Nome ofensivo
m.header_step205 = Registrou uma den\u00fancia contra mim
m.subheader_step205 = Voc\u00ea n\u00e3o deve registrar uma den\u00fancia contra algu\u00e9m s\u00f3 porque essa pessoa \
  registrou uma den\u00fancia contra voc\u00ea.\n\n\
  Os Game Masters ler\u00e3o todas as den\u00fancias e, se voc\u00ea n\u00e3o tiver infringido nenhuma regra \
  no caso registrado contra voc\u00ea, n\u00e3o precisa se preocupar.

m.header_step206 = Informa\u00e7\u00f5es pessoais
m.subheader_step206 = Revelar informa\u00e7\u00f5es pessoais n\u00e3o \u00e9 aceit\u00e1vel, sejam elas do pr\u00f3prio jogador \
  ou de outro. Pedir informa\u00e7\u00f5es pessoais tamb\u00e9m n\u00e3o \u00e9 aceit\u00e1vel.\n\n\
\
  Perguntar a idade de algu\u00e9m, em que s\u00e9rie est\u00e1 ou que esportes pratica etc. \
  n\u00e3o \u00e9 considerado informa\u00e7\u00e3o pessoal.\n\n\
\
  J\u00e1 coisas como n\u00famero de telefone, endere\u00e7o ou nome real s\u00e3o informa\u00e7\u00f5es pessoais e \
  nunca devem ser reveladas.

m.header_step207 = Golpe
m.subheader_step207 = Golpe \u00e9 quando um jogador tenta enganar voc\u00ea para fazer algo que n\u00e3o deveria. \
  Exemplos:\n\
  - Tentar fazer voc\u00ea revelar o nome da sua conta ou sua senha.\n\
  - Querer trocar contas com voc\u00ea.\n\
  - Alegar ser um Game Master ou um amigo seu para tirar vantagem disso.\n\
  H\u00e1 muitas outras formas de golpe.

m.header_step208 = Hackeamento
m.subheader_step208 = Hackeamento \u00e9 quando algu\u00e9m est\u00e1 tentando obter o nome da sua conta ou \
  sua senha, ou j\u00e1 conseguiu fazer isso.\n\n\
  A grande maioria dos problemas de hackeamento, na verdade, n\u00e3o \u00e9 hackeamento, mas sim \
  compartilhamento descuidado de contas ou senhas. Voc\u00ea nunca deve compartilhar sua senha com \
  ningu\u00e9m por motivo algum. Game Masters tamb\u00e9m nunca pedir\u00e3o isso.

m.header_step209 = Troca errada
m.subheader_step209 = \u00c0s vezes cometemos um erro ao trocar com outros jogadores. Isso acontece com \
  todos n\u00f3s.\n\n\
  Mas os Game Masters n\u00e3o podem saber qual era o acordo da troca. Um jogador pode dizer que \
  aquilo n\u00e3o foi o combinado, enquanto o outro pode dizer que foi. E n\u00e3o podemos simplesmente \
  escolher um lado \u00e0s cegas. Por isso precisamos confiar que os jogadores conferem com aten\u00e7\u00e3o \
  o que est\u00e3o trocando antes de clicar para confirmar.\n\n\
  Portanto, se voc\u00ea acabou fazendo uma troca que n\u00e3o pretendia, receio que os Game Masters n\u00e3o \
  poder\u00e3o ajud\u00e1-lo. O melhor \u00e9 conversar com o outro jogador e ver se ele \u00e9 gentil o bastante \
  para desfazer a troca.\n\n\
  E lembre-se: nunca entregue algo "emprestado" a menos que voc\u00ea esteja disposto a aceitar \
  que o jogador talvez n\u00e3o devolva o item. Os Game Masters n\u00e3o poder\u00e3o recuper\u00e1-lo para voc\u00ea.

m.header_step210 = N\u00e3o listado

m.option_1_0 = 1. Lembre-se de que voc\u00ea pode clicar em jogadores e escolher "Ignorar" para bloquear \
  qualquer chat ou correio vindo deles. Clique aqui para ignorar {0} e cancelar a den\u00fancia.
m.option_1_1 = 2. Se {0} foi ofensivo ou assediou voc\u00ea e n\u00e3o parou quando solicitado, clique \
  aqui para registrar uma den\u00fancia.
m.option_1_2 = 3. Se voc\u00ea pretendia enviar uma mensagem para {0}, clique aqui.

m.option_2_0 = >Chat ofensivo
m.option_2_1 = >Spam
m.option_2_2 = >Incomodando
m.option_2_3 = >Menor de idade, abaixo de 13
m.option_2_4 = >Nome ofensivo
m.option_2_5 = >Registrou uma den\u00fancia contra mim
m.option_2_6 = >Informa\u00e7\u00f5es pessoais
m.option_2_7 = >Golpe
m.option_2_8 = >Hackeamento
m.option_2_9 = >Troca errada
m.option_2_10 = >N\u00e3o listado

m.option_4_0 = Se sua den\u00fancia foi por chat ofensivo, ass\u00e9dio de jogador etc., este seria \
  um bom momento para ignorar {0}, assim voc\u00ea nunca mais ser\u00e1 incomodado por essa pessoa. \
  Jogar deve ser divertido; n\u00e3o deixe que outros jogadores estraguem isso.

m.option_200_0 = Temos filtros de chat para remover palavras ofensivas. Se voc\u00ea desativou \
  o filtro de chat, ent\u00e3o n\u00e3o deveria registrar den\u00fancias contra jogadores por usarem essas \
  palavras ofensivas. Para ativar o filtro de chat, clique aqui.
m.option_200_1 = Esteja ciente de que o que voc\u00ea considera ofensivo e pessoal talvez n\u00e3o seja \
  geralmente considerado ofensivo. Portanto, pense com cuidado se qualquer pessoa acharia \
  aquele chat ofensivo. Se voc\u00ea leu e entendeu tudo isso e ainda deseja enviar a den\u00fancia, \
  ent\u00e3o clique aqui.

m.option_201_0 = Em vez disso, voc\u00ea poderia simplesmente clicar aqui para ignorar {0}, assim n\u00e3o \
  precisar\u00e1 mais ouvi-lo.
m.option_201_1 = Se voc\u00ea tem certeza de que isso se qualificou como spam, clique em OK para \
  registrar a den\u00fancia.

m.option_202_0 = Sabemos que esse jogador pode estar estragando parte da divers\u00e3o que voc\u00ea est\u00e1 \
  tendo, mas a melhor forma de lidar com jogadores assim \u00e9 ignor\u00e1-los para n\u00e3o ter de se \
  incomodar com eles novamente. Clique aqui para ignorar {0}.

m.option_203_0 = Voc\u00ea precisa ter 13 anos ou mais para jogar este jogo. Se algu\u00e9m admitir no chat \
  que tem menos de 13 anos, clique aqui para registrar a den\u00fancia contra essa pessoa.\n\n\
  N\u00c3O use esta op\u00e7\u00e3o se voc\u00ea apenas acreditar que o jogador \u00e9 menor de idade, pois \u00e9 preciso \
  haver prova no chat dos \u00faltimos minutos. Se n\u00e3o houver prova, voc\u00ea deve descartar a \
  den\u00fancia. \n\n\
  Use o bom senso: se a pessoa disser que tem 4 anos enquanto escreve perfeitamente, por \
  exemplo, isso claramente n\u00e3o \u00e9 verdade e voc\u00ea n\u00e3o deve registrar a den\u00fancia.

m.option_204_0 = Nomes ofensivos n\u00e3o s\u00e3o aceit\u00e1veis. Esteja ciente de que o que voc\u00ea considera \
  ofensivo talvez n\u00e3o seja considerado ofensivo de modo geral. Portanto, clique aqui para \
  registrar a den\u00fancia apenas se tiver certeza de que qualquer pessoa acharia aquele nome ofensivo.

m.option_206_0 = Se n\u00e3o houver d\u00favida de que eram informa\u00e7\u00f5es pessoais, clique aqui para \
  registrar a den\u00fancia.

m.option_207_0 = Se voc\u00ea acredita que algu\u00e9m est\u00e1 tentando aplicar um golpe malicioso em voc\u00ea, \
  clique aqui para enviar a den\u00fancia. Voc\u00ea pode querer avisar esse jogador de que ele foi \
  denunciado, assim outros jogadores ao redor tamb\u00e9m poder\u00e3o ouvir e tomar precau\u00e7\u00f5es.

m.option_208_0 = Se um jogador est\u00e1 tentando obter o nome da sua conta ou sua senha neste exato \
  momento, ou j\u00e1 fez isso e est\u00e1 admitindo no chat, voc\u00ea deve clicar aqui para registrar uma den\u00fancia.
m.option_208_1 = Se um jogador j\u00e1 assumiu o controle da sua conta, voc\u00ea precisar\u00e1 entrar em \
  contato conosco por meio do nosso formul\u00e1rio de suporte para recuperar sua conta.\n\n\
  Esteja ciente de que precisamos de prova de quem \u00e9 o dono da conta, e s\u00f3 podemos obter isso \
  confirmando como a conta foi paga.\n\n\
  Clique aqui para come\u00e7ar a recuperar sua conta paga que foi tomada.

m.option_210_0 = Voc\u00ea s\u00f3 deve usar esta op\u00e7\u00e3o se nenhuma das outras cobrir sua den\u00fancia. Clique \
  aqui para voltar e ver se alguma das outras op\u00e7\u00f5es pode ser \u00fatil.
m.option_210_1 = Se voc\u00ea tem certeza de que as outras op\u00e7\u00f5es n\u00e3o cobrem sua den\u00fancia, e tem \
  certeza de que o jogador violou nossos Termos de Servi\u00e7o, ent\u00e3o escreva aqui uma breve \
  explica\u00e7\u00e3o do que \u00e9 a sua den\u00fancia.
m.option_210_2 = Enviar den\u00fancia.

m.button_0 = >Clique aqui para descartar a den\u00fancia.
m.button_1 = >Clique aqui para voltar.
m.button_2 = >Termos de Servi\u00e7o
