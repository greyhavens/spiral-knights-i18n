m.sl_elevator_active = Zum \u00d6ffnen wird ein Shadow Key ben\u00f6tigt.\n\
  Shadow Keys k\u00f6nnen in Lockboxes gefunden werden oder im Magazin gekauft werden.

m.sl_elevator_closed = Derzeit nicht verf\u00fcgbar.

