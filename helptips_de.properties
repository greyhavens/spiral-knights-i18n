t.scenario_fiendnotice_1 = Notiz f\u00fcr alle Angestellten
m.scenario_fiendnotice_1 = Aufgrund kontinuierlich schlechter Leistungen gibt es weder \
  bezahlten Urlaub noch Kaffee im Pausenraum.

