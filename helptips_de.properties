  er diesen Schatz finden wollte...

# Mission Text
#...................................................................................................

t.mineral_tut = Mineralien
m.mineral_tut = Greife an, um Mineralien zu zerschlagen und sie aufzuheben! Trage immer eines \
  auf einmal.

m.bramble = Manche Areale sind mit Dornen bewachsen, die dir Schaden zuf\u00fcgen, wenn du \
  durch sie hindurchl\u00e4ufst!

m.mission_trap_chamber = Alle Dronen k\u00f6nnen sich auf einige verschiedene Arten bewegen.
m.mission_trap_chamber_2 = Sie k\u00f6nnen get\u00f6tet werden, aber oft kann man sie einfach \
  meiden.
m.mission_trap_chamber_3 = Alle Dronen mit goldener R\u00fcstung sind unverwundbar.
m.mission_trap_chamber_4 = Dronen k\u00f6nnen auch Status-Schaden verursachen.

t.plan_o_attack = Gremlin-Schemata
m.plan_o_attack = Der Monitor zeigt Daten an, die vom Prototypen einer gewaltigen \
