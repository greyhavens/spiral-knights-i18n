  coraz\u00f3n de la F\u00e1brica de Municiones Ironclaw y no solamente est\u00e1 protegida por \
  hordas de gremlins y constructores con poder de choque, sino que la f\u00e1brica misma \
  es altamente peligrosa y explosiva!\n\
  \n\
  Adem\u00e1s de acabar con los Gemelos Roarmulus, el Cuartel General Spiral quiere que \
  recuperes el m\u00f3dulo de reconocimiento del Escuadr\u00f3n Alpha, que se cree est\u00e1 ubicado en alg\u00fan lugar dentro de la f\u00e1\
  brica. Se recomienda que formes un escuadr\u00f3n completo antes de desplegar.

