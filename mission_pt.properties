m.laboratory_visit = Una Visita al Lab
o.laboratory_visit = Visita el Lab y conoce al Biotech Morlin
b.laboratory_visit = El Biotech Morlin est\u00e1 a cargo del Lab ubicado en la Guarnici\u00f3n de Haven.  Est\u00e1 a la b\u00fa\
  squeda de un cavaleiro capaz y deseoso de enfrentar a los Clockworks para poder asegurar un \
  alijo de 'sprites de batalla' que se perdieron cuando el Alondra se estrell\u00f3.

m.laboratory_visit_1a = Saludos, {0}!  Me enter\u00e9 de que llegaste hace poco a Haven \
  despu\u00e9s de cruzar el gran precipicio.  Mientras estuviste all\u00e1, te \
  encontraste con alguno de los sprites de batalla?

r.laboratory_visit_1a = Qu\u00e9 es un 'sprite de batalla'?

m.laboratory_visit_2a = Ah, cierto! Eres un novo recluta. La mayor\u00eda de los \
  cavaleiros se encuentran con su primer sprite en el fragor de la batalla. Lo m\u00e1s \
  probable es que no hayas tenido la oportunidad de ver a uno todav\u00eda.\n\
  \n\
  Permite que te explique...

r.laboratory_visit_2a = Continuar

#(image of proto sprite)
m.laboratory_visit_3a = Un sprite de batalla es un constructor manejado por la IU que es capaz \
  de hacer misiones de reconocimiento y de dar apoyo ligero en el combate.  Los sprites son muy \
  adaptables.  Su IU les permite observar agudamente su entorno y ayudar a su cavaleiro de la \
  mejor manera.

r.laboratory_visit_3a = Parece que son muy \u00fatiles. C\u00f3mo obtengo uno?

#(same image of proto sprite)
m.laboratory_visit_4a = Cuando un sprite de batalla se asigna a un cavaleiro, se graba un \
  'lazo' en el c\u00f3digo del sprite para apoyar a ese cavaleiro sin importar las \
  circunstancias. Nunca te dejaran de lado!\n\
  \n\
  Lamentablemente, las cajas de embalaje que guardaban el alijo de sprites de batalla del \
  Alondra se perdieron en las profundidades de los Clockworks despu\u00e9s de la colisi\u00f3n.

r.laboratory_visit_4a = C\u00f3mo puedo ayudar, Morlin?

m.laboratory_visit_5a = Un escuadr\u00f3n de reconocimiento se las ha ingeniado para rastrear \
  el lugar donde muchos de esos sprites de batalla llegaron. Rhendon se ha adelantado para \
  explorar tres de estos sitios y se encontrar\u00e1 contigo en los Clockworks. \n\
  \n\
  Debes asegurar tus sprites de batalla antes de que terminen en manos de los enemigos!

r.laboratory_visit_5a = D\u00e9jamelo a mi, Morlin. Yo mantendr\u00e9 seguros a los sprites.

# RANK 2-2

m.skies_under_cradle = El Cielo bajo Cradle
o.skies_under_cradle = Encuentra la ruta y ve de expedi\u00e7\u00e3o en los Islotes Aurora
b.skies_under_cradle = Los Clockworks son un fascinante complejo bajo tierra que alberga mundos \
  enteros dentro de sus colosales geoglobos de hierro. Uno de ellos que han descubierto los \
  cavaleiros Recon es conocido como 'Islotes Aurora', una serie de misteriosas islas flotantes \
  bajo un falso cielo.\n\
  \n\
  Con tu novo rango de Aprendiz, ahora tienes autorizaci\u00f3n para explorar las ruinas en \
  estas islas y recolectar cualquiera de los \u00fatiles materiales que puedes descubrir.

m.scarlet_fortress = La Fortaleza Escarlata
o.scarlet_fortress = Encuentra la ruta y ve de expedi\u00e7\u00e3o a los pasajes embrujados de la \
  Fortaleza Escarlata.
b.scarlet_fortress = Los cavaleiros del equipo de reconocimiento han descubierto otro geoglobo \
  completamente diferente de Islotes Aurora, que contiene los restos de un antiguo castillo. \
  Conocido como 'Fortaleza Escarlata', este ruinoso castillo es tambi\u00e9n el hogar de una \
  horda de agitados esp\u00edritus. Procede con precauci\u00f3n cuando explores sus retorcidos \
  pasillos.

m.monstrous_research = Investigaci\u00f3n Monstruosa
o.monstrous_research = Entrega los materiales de investigaci\u00f3n solicitados por el Cuartel \
  General Spiral
b.monstrous_research = Ya debes haber recolectado algunas muestras de materiales de tus \
  primeras expediciones a los Clockworks. El Cuartel General Spiral est\u00e1 solicitando \
  algunos de esos materiales para su investigaci\u00f3n de las criaturas que viven en los \
  Clockworks.

m.alchemy_beginners = Alquimia para Principiantes
o.alchemy_beginners = Aprende acerca de las maravillas de la alquimia!
b.alchemy_beginners = La alquimia es un arte dominado por los Cavaleiros Spiral que permite que \
  el poder inherente de varios materiales se active y se fusione entre si para formar poderosos art\u00ed\
  culos novos! La Orden Spiral ha confiado en la alquimia como su medio principal para crear \
  los mismos arsenales que los cavaleiros han usado por centurias.\n\
  \n\
  Descubre como se convertir\u00e1 en una parte importante de tu supervivencia en este mundo \
  alien\u00edgena.

#(port to alchemy station in the bazaar)
m.alchemy_beginners_1a = Saludos, {0}! Mi nombre es Bosco y estoy aqu\u00ed para darte ponerte al d\u00ed\
  a en los principios de alquimia.\n\
  \n\
  En realidad es muy sencillo gracias a estas M\u00e1quinas de Alquimia. Ellas hacen todo el \
  trabajo pesado por ti.

r.alchemy_beginners_1a = Soy todo o\u00eddos, Bosco.

#(image)
m.alchemy_beginners_2a = Bien, lo esencial aqu\u00ed es recolectar materiales y recetas y \
  convertirlos en armas y equipamiento. F\u00e1cil verdad?

r.alchemy_beginners_2a = Continuar

#(image)
m.alchemy_beginners_3a = Cuando adquieres una receta y la aprendes, la receta se consume, \
  pero la graba en tus 'recetas conocidas' para siempre!  Una vez conocida, puedes crear todos \
  los items de esa receta las veces que quieras, siempre y cuando tengas los \
  materiales indicados.

r.alchemy_beginners_3a = Continuar

#(image)
m.alchemy_beginners_4a = Cuando interaccionas con una M\u00e1quina de Alquimia se abre la \
  interfaz de alquimia donde puedes ver tus recetas conocidas...

r.alchemy_beginners_4a = Continuar

#(image)
m.alchemy_beginners_5a = \u2026 y los materiales, crowns, orbes de alquimia y energia \
  requeridos para transmutar el articulo.

r.alchemy_beginners_5a = Continuar

#(image)
m.alchemy_beginners_6a = Muchas recetas requieren un articulo equipable de cierto nivel. En una \
  receta estos son conocidos como items 'especiales'  y puedes escoger el art\u00ed\
  culo especial que deseas, siempre y cuando sea el item correcto.\n\
  \n\
  Esto es \u00fatil si la receta necesita un item del cual tienes dos copias, pero una \
  es superior a la otra.

r.alchemy_beginners_6a = Continuar

#(image)
m.alchemy_beginners_7a = Una vez que est\u00e9s listo para transmutar el item, haz \
  clic en 'Trasmutar', y cont\u00e9n el aliento!

r.alchemy_beginners_7a = Contener el aliento?

#(image)
m.alchemy_beginners_8a = Si, as\u00ed es! Eso es porque cada vez que transmutas un \
  item a trav\u00e9s de alquimia, existe una posibilidad de que obtengas una de muchas \
  Variantes \u00danicas que hacen a tu item mucho m\u00e1s poderoso!

r.alchemy_beginners_8a = Suena muy bien!

m.alchemy_beginners_9a = Eso cubre los principios de alquimia. Puedo explicarte una vez m\u00e1\
  s si lo deseas, o puedo marcar esta misi\u00f3n como completada y enviarte a tu propio \
  camino.

r.alchemy_beginners_9a = Repasemos todo una vez m\u00e1s.
r.alchemy_beginners_9b = Creo que me qued\u00f3 claro, gracias!

m.alchemy_beginners_10a = No hay problema, desde el principio entonces...
r.alchemy_beginners_10a = Continuar
#(start from the first image)
m.alchemy_beginners_10b = Estar\u00e1s alquemizando items sorprendentes en poco \
  tiempo! De hecho, he aqu\u00ed un par de recetas para que comiences.

r.alchemy_beginners_10b = Miss\u00e3o completada.

m.time_to_crafty = Hora de Ponerse Artero
o.time_to_crafty = Alquemiza un Hot Edge y un Frost Gun y pres\u00e9ntalos para inspecci\u00f3n.
b.time_to_crafty = A Bosco le gustar\u00eda que le alquemizaras un Hot Edge y un Frost Gun para \
  que los pueda inspeccionar.  Si est\u00e1n bien hechos, entonces informar\u00e1 al Cuartel \
  General Spiral que has comprendido el vital arte de la alquimia y tambi\u00e9n le a\u00f1adir\u00e1 un par de Variantes \u00danicas a tus armas.  Que tipo tan generoso!

m.mission_sprite_1 = Una Revelaci\u00f3n en las Llamas
o.mission_sprite_1 = Rescata un alijo de sprites de batalla y regr\u00e9salos al Lab
b.mission_sprite_1 = Rhendon te espera en un \u00e1rea de los Clockworks conocida como Estepas \
  al Ocaso, donde el equipo de reconocimiento ha localizado un alijo de sprites de batalla \
  perdidos. Rescata a los sprites y limpia la zona de hostiles. Est\u00e1s autorizado para usar \
  cualquier sprite que rescates para poder concluir la misi\u00f3n.

m.mission_sprite_1_1a = Muy bien {0}, vamos a empezar. Parece que tu y yo nos vamos a una peque\u00f1a cacer\u00eda de sprites, cierto? \n\
  \n\
  He alineado mi rastreador con los datos de intescolhancia del cavaleiro recon, pero algo anda \
  mal. La firma de energia que estoy detectando es err\u00e1tica, pero definitivamente es \
  un sprite de batalla. Es probable que est\u00e9n en problemas, as\u00ed que hay que apurarnos!

m.mission_sprite_1_2a = Pero que- esos son...sprites de batalla? Algo les ha pasado, se \
  han transformado en alg\u00fan tipo de criatura.

#>(auto proceed)
#[image of Rhendon reaching out to a Drakon who is responding in a friendly manner]
#(Rhendon reaches out to one of the battle sprites)

m.mission_sprite_1_3a = Parecen ser amistosos.  De hecho, parecen comportarse como los sprites \
  de batalla que conozco. La \u00fanica diferencia es que, uh, bueno, parecen dragones.

#>(auto proceed)

#[spawn a drakon on every party member]
m.mission_sprite_1_4a = Oye, parece que le gustas a uno de esos sprites! Bien, no dejemos \
  que ese poder\u00edo extra se pierda, me quedar\u00e9 aqu\u00ed para proteger a estos \
  sprites. Tu usa a tu novo amigo para que te ayude a limpiar de hostiles el resto del \u00e1rea.

m.mission_sprite_1_5a = Me quedar\u00e9 aqu\u00ed para proteger a estos sprites. Algunas de las \
  cajas de transporte est\u00e1n vac\u00edas. Creo que algo o alguien est\u00e1 tras de ellos. \n\
  \n\
  Ustedes adel\u00e1ntense y limpien el \u00e1rea de hostiles para que el escuadr\u00f3n de \
  rescate pueda llegar de manera segura.

r.mission_sprite_1_5a = Estoy en eso!

# Post-mission lab report
# Note: Morlin is standing over by the sprite table thing examining the drakon
m.mission_sprite_1_6a = Esto es asombroso! Los sprites de batalla que recobraste de \
  las Estepas al Ocaso se han transformado en una nueva entidad!

r.mission_sprite_1_6a = Parecen dragones de cuentos de hadas.

m.mission_sprite_1_7a = Ciertamente.  Aunque su identidad celular es completamente aquella de \
  un sprite de batalla.  Mi hip\u00f3tesis es que de alguna manera evolucionaron r\u00e1\
  pidamente para sobrevivir en su novo entorno, pero c\u00f3mo?  Nuestra tecnolog\u00eda nunca podr\u00eda hacer algo como eso...

r.mission_sprite_1_7a = Cradle se est\u00e1 poniendo m\u00e1s misterioso cada d\u00eda.

m.mission_sprite_1_8a = Si.  Podr\u00eda parecer como que todav\u00eda tenemos mucho que \
  aprender de ese lugar. \n\
  \n\
  El reporte de Rhendon hace notar que muchos de los sprites faltaban en el sitio. Suger\u00eda que hubo juego sucio.

r.mission_sprite_1_8a = Tal vez los gremlins est\u00e1n tratando de robarse nuestra \
  tecnolog\u00eda?

m.mission_sprite_1_9a = De ser as\u00ed, debemos evitar que haya m\u00e1s da\u00f1o. Ahora, por \
  favor, hay m\u00e1s sprites que necesitan ser recatados. Y qui\u00e9n sabe lo que \
  descubramos una vez que lleguemos all\u00e1!

r.mission_sprite_1_9a = Terminar conversaci\u00f3n

m.mission_sprite_2 = \u00c1ngeles de la Antig\u00fcedad
o.mission_sprite_2 = Rescata un alijo de sprites de batalla y regr\u00e9salos al Lab
b.mission_sprite_2 = Rhendon te espera en un \u00e1rea de los Clockworks conocida como \
  Ferrocarril Inquieto, donde el equipo de reconocimiento ha localizado un alijo de sprites de \
  batalla perdidos. Rescata a los sprites y limpia la zona de hostiles. Est\u00e1s autorizado \
  para usar cualquier sprite que rescates para poder concluir la misi\u00f3n.

m.mission_sprite_2_1a = Qu\u00e9 opinas de este lugar, eh? Parece que es un tipo de \
  estaci\u00f3n de ferrocarril vieja infestada con esp\u00edritus errantes. Que lugar tan extra\u00f1\
  o para encontrase bajo tierra.\n\
  \n\
  De cualquier manera, despu\u00e9s de lo que encontramos all\u00e1 en las Estepas al Ocaso, \
  mejor vamos r\u00e1pido a donde est\u00e1 el alijo de sprites. Vamos!

m.mission_sprite_2_2a = Primero dragones y ahora... criaturitas felinas con alas? \
  No puedo creer que estemos viendo este fen\u00f3meno otra vez!

#>(auto proceed)
#[spawn a seraphynx on every party member]
m.mission_sprite_2_3a = Guau {0}, parece que tienes buena mano con los sprites de \
  batalla! No perdamos el tiempo. Limpia el camino adelante para que un equipo de rescate \
  pueda pasar de manera segura!

m.mission_sprite_2_4a = Uh, me parece que esos sprites est\u00e1n estudiando esos viejos \
  libros. No sab\u00eda que pod\u00edan leer!\n\
  \n\
  De cualquier manera, me quedar\u00e9 aqu\u00ed para proteger a estos sprites. Veo que hay m\u00e1\
  s cajas de transporte vac\u00edas; eso no est\u00e1 bien. Tu adel\u00e1ntate y limpia el \u00e1\
  rea de hostiles para que el escuadr\u00f3n de rescate pueda llegar de manera segura.

r.mission_sprite_2_4a = Estoy en eso!

# Post-mission lab report

m.mission_sprite_2_6a = Una vez m\u00e1s estos sprites parecen haber adaptado su forma para \
  acomodarse a su entorno.

r.mission_sprite_2_6a = En qu\u00e9 se han convertido esta vez?

m.mission_sprite_2_7a = No est\u00e1 claro, {0}. Dado el reporte de Rhendon, dir\u00eda que han \
  aprendido algo de los arcanos tomos que descubriste cerca de estos sprites. Es fascinante \
  como parecen haber adaptado sus habilidades de combate debido a esto.

r.mission_sprite_2_7a = Dices que estos sprites aprendieron conjuros m\u00e1gicos de un viejo libro?

m.mission_sprite_2_8a = Si, al parecer estos sprites han dominado la habilidad de enfocar sus \
  poderes en habilidades que protegen a su cavaleiro. Debido a esto y a su apariencia, se les \
  han llamado 'seraphynx.'

r.mission_sprite_2_8a = Bastante ingenioso.

m.mission_sprite_2_9a = Si lo se. De cualquier manera, tambi\u00e9n entiendo que algunas de las \
  cajas de transporte de los sprites estaban vac\u00edas otra vez. Algo no est\u00e1 bien... \n\
  \n\
  Pues bien, asegura ese \u00faltimo alijo de sprites antes de que lo que sea que se est\u00e9 \
  robando sprites lo encuentre!

r.mission_sprite_2_9a = Voy para all\u00e1.

m.mission_sprite_3 = La M\u00e1scara Fantasma
o.mission_sprite_3 = Rescata un alijo de sprites de batalla y regr\u00e9salos al Lab
b.mission_sprite_3 = Rhendon te espera en una planta qu\u00edmica gremlin abandonada, donde el \
  equipo de reconocimiento ha localizado un alijo de sprites de batalla perdidos. Rescata a los \
  sprites y limpia la zona de hostiles. Est\u00e1s autorizado para usar cualquier sprite que \
  rescates para poder concluir la misi\u00f3n.

m.mission_sprite_3_1a = Ponte en guardia aqu\u00ed {0}, lo que sea que esos gremlins estaban \
  tramando aqu\u00ed ha hecho que se convierta en un entorno muy traicionero. \n\
  \n\
  Debemos apresurarnos a llegar al alijo de sprites antes de que se pierdan m\u00e1s!

m.mission_sprite_3_2a = C\u00f3rcholis, esos son sprites o son alg\u00fan tipo de fantasma?

m.mission_sprite_3_3a = Una vez m\u00e1s los sprites han cambiado y esta vez de veras me est\u00e1n asustando!

# [spawn a maskeraith on every party member]

m.mission_sprite_3_4a = Eh, no mires ahora {0}, pero hay un fantasma sobre tu hombro!  \
  Esperemos que estos sprites no hayan invertido todo su poder s\u00f3lo en verse bien.\n\
  \n\
  Usa este para limpiar el camino all\u00e1 adelante y que un equipo de rescate pueda \
  pasar de manera segura!

m.mission_sprite_3_5a = Una vez m\u00e1s, muchas cajas de transporte vac\u00edas. Se nos \
  avecinan problemas, {0}. Mejor te adelantas y limpias el \u00e1rea de hostiles para que un \
  equipo de rescate pueda llegar de manera segura.

r.mission_sprite_3_5a = Algo m\u00e1s?

m.mission_sprite_3_6a = Tengo curiosidad... qu\u00e9 piensas que hay detr\u00e1s de sus m\u00e1\
  scaras? Espera, mejor no, no quiero saber.

r.mission_sprite_3_6a = Terminar conversaci\u00f3n

# Post-mission lab report

m.mission_sprite_3_7a = Los descubrimientos en el planeta se hacen m\u00e1s extra\u00f1os cada d\u00ed\
  a. Ahora nuestros sprites est\u00e1n adoptando la forma de alg\u00fan tipo de fantasma.

r.mission_sprite_3_7a = Parecen sombras vivientes.

m.mission_sprite_3_8a = Si, ciertamente. Estos sprites han adoptado el poder del encubrimiento, \
  para usar las mismas sombras a su alrededor como subterfugio. Entre eso y sus nuevas \
  habilidades en toxinas y debilitamiento, dir\u00eda que podr\u00edan ser muy \u00fatiles en \
  el campo de batalla.

r.mission_sprite_3_8a = Puedo asumir que les has puesto nombre tambi\u00e9n?

m.mission_sprite_3_9a = Pues ciertamente, debido a su apariencia externa, pienso que \
  'maskeraith' les queda muy bien!

r.mission_sprite_3_9a = Encantador.

m.mission_sprite_3_10a = Tu sarcasmo ha sido tomado en cuenta. \n\
  \n\
  Ahora bien, acerca de esas cajas de transporte de sprite vac\u00edas: hemos confirmado que \
  hubo juego sucio.

r.mission_sprite_3_10a = Dame los detalles.

m.mission_sprite_3_11a = Un escuadr\u00f3n de rescate ha reportado que un enorme monstruo \
  constructor como no hemos visto antes se ha llevado muchos sprites de batalla. Creemos que \
  los gremlins est\u00e1n detr\u00e1s de todo esto.

r.mission_sprite_3_11a = Pondr\u00e9 un alto a sus argucias.

m.mission_sprite_3_12a = Admiro tu valor, pero si los reportes preliminares de este monstruo \
  constructor son acertados, necesitar\u00e1s ayuda adicional. \n\
  \n\
  Preparar\u00e9 una selecci\u00f3n de sprites de batalla para que est\u00e9n listos para \
  formar lazos contigo, {0}. \n\
  \n\
  Hablaremos de novo una vez que haya hecho los preparativos adecuados.

r.mission_sprite_3_12a = Nos vemos pronto, Morlin.

# RANK 2-3

m.choose_your_sprite = Un Lazo Eterno
o.choose_your_sprite = Habla con Morlin y elije un sprite de batalla como tu compa\u00f1ero
b.choose_your_sprite = Morlin ha preparado tres de los sprites de batalla que rescataste para \
  que los eval\u00faes. Has sido autorizado para elegir a uno de esos sprites de batalla y que \
  formes un lazo con ellos. Este sprite de batalla te ayudar\u00e1 por siempre en tus aventuras \
  futuras, as\u00ed que escolha sabiamente.\n\
  \n\
  Esta misi\u00f3n no puede repetirse.

m.choose_your_sprite_1a = Saludos, {0}! Ahora que he tenido el tiempo suficiente para \
  investigar a los sprites de batalla que has rescatado, puedo darte una evaluaci\u00f3n \
  adecuada de cada uno de ellos.\n\
  \n\
  A pesar de su muy extra\u00f1a apariencia, hemos llegado a la conclusi\u00f3n de que estos \
  'novos' sprites de batalla no s\u00f3lo son adecuados para el combate, sino que pueden tener \
  capacidades mejoradas como resultado de su transformaci\u00f3n.

r.choose_your_sprite_1a = Continuar

m.choose_your_sprite_2a = Te har\u00e9 un resumen de cada uno de los sprites de batalla. Como \
  reconocimiento a tu valor durante el rescate de estos sprites, el Cuartel General Spiral ha \
  autorizado que formes un lazo con uno de ellos. Este lazo dura para siempre pero es tambi\u00e9\
  n una gran responsabilidad.\n\
  \n\
  Por favor pi\u00e9nsalo cuidadosamente antes de tomar una decisi\u00f3n, ya que no hay vuelta \
  atr\u00e1s una vez que decidas.

r.choose_your_sprite_2a = Lo entiendo, Morlin.

m.choose_your_sprite_3a = Hay tres tipos distintos de sprites de batalla disponibles. Cada uno \
  responde de diferente forma al poder que emana de este mundo y cada uno ofrece experiencias \
  de combate \u00fanicas.\n\
  \n\
  Estos sprites incluyen al feroz drakon, el radiante seraphynx y el enigm\u00e1tico maskeraith.

r.choose_your_sprite_3a = Cu\u00e9ntame acerca del drakon.
r.choose_your_sprite_3b = Cu\u00e9ntame acerca del seraphynx.
r.choose_your_sprite_3c = Cu\u00e9ntame acerca del maskeraith.
r.choose_your_sprite_3d = Estoy listo para elegir mi sprite de batalla.
r.choose_your_sprite_3e = Todav\u00eda no estoy listo para elegir.

#[image of a drakon using his skills]
m.choose_your_sprite_4a = El drakon es un sprite de batalla que personifica la destrucci\u00f3n \
  con fuego. Sus habilidades se enfocan en el asalto directo: el rel\u00e1mpago de fuego crea \
  un proyectil explosivo, la barrera en llamas rodea a su cavaleiro con orbes de fuego y la \
  tormenta de fuego crea una masiva ola de fuego.\n\
  \n\
  El drakon es m\u00e1s adecuado para los cavaleiros intr\u00e9pidos que prefieren el combate \
  destructivo al frente de la batalla.

r.choose_your_sprite_4a = El drakon suena como que es el sprite de batalla para mi!
r.choose_your_sprite_4b = Cu\u00e9ntame de los otros sprites de batalla.

#[image of a seraphynx using his skills]

m.choose_your_sprite_5a = El seraphynx es un sprite de batalla que personifica la protecci\u00f3n y la restauraci\u00f3\
  n. Sus habilidades se enfocan en apoyar a los cavaleiros en el combate: el rayo de luz crea \
  un haz de luz sagrada, el ataque al coraz\u00f3n aumenta la probabilidad de que encuentres \
  corazones y el aura angelical crea un escudo de luz que protege a su cavaleiro y a los \
  miembros del grupo dentro de el.\n\
  \n\
  El seraphynx es m\u00e1s adecuado para los cavaleiros que desean proteger a su grupo y darles \
  su ayuda.

r.choose_your_sprite_5a = El seraphynx parece ser el sprite de batalla para mi!

#[image of a maskeraith using his skills]

m.choose_your_sprite_6a = El maskeraith es un sprite de batalla que personifica la decepci\u00f3\
  n y el debilitamiento. Sus habilidades se enfocan en el subterfugio: plumas causticas que \
  disparan plumas envenenadas que explotan cuando son seguidas por un ataque, el manto de \
  sombra permite que el cavaleiro se haga invisible y la neblina hechizada que permite que el \
  cavaleiro inflija da\u00f1o explosivo cronometrado a los monstruos.\n\
  \n\
  El maskeraith es m\u00e1s adecuado para los cavaleiros que desean acechar en las sombras y \
  atacar a los enemigos a hurtadillas.

r.choose_your_sprite_6a = El maskeraith parece ser el sprite de batalla para mi!

m.choose_your_sprite_7a = Excelente! Cu\u00e1l sprite de batalla elegir\u00e1s como tu compa\u00f1ero?

r.choose_your_sprite_7a = Elijo al drakon.
r.choose_your_sprite_7b = Elijo al seraphynx.
r.choose_your_sprite_7c = Elijo al maskeraith.
r.choose_your_sprite_7d = Me gustar\u00eda que me explicaras otra vez acerca de los sprites de \
  batalla.
r.choose_your_sprite_7e = Todav\u00eda no estoy listo para elegir.

#[image of a drakon using his skills]
m.choose_your_sprite_8a = Entonces, escolhas al fogoso drakon, el sprite de batalla de \
  aquellos que prefieren el combate destructivo al frente de la batalla? \n\
  \n\
  Una vez que hayas elegido ya no hay vuelta atr\u00e1s!

r.choose_your_sprite_8a = Si, elijo al drakon.
r.choose_your_sprite_8b = No estoy seguro, dime otra vez todo acerca de los sprites de batalla.

#[image of a seraphynx using his skills]
m.choose_your_sprite_9a = Entonces, escolhas al radiante seraphynx, el sprite de batalla de \
  aquellos que desean proteger a su grupo y darles su ayuda?\n\
  \n\
  Una vez que hayas elegido ya no hay vuelta atr\u00e1s!

r.choose_your_sprite_9a = Si, elijo al seraphynx.

#[image of a maskeraith using his skills]

m.choose_your_sprite_10a = Entonces, escolhas al sombr\u00edo maskeraith, el sprite de \
  batalla de aquellos que desean acechar en las sombras y atacar a los enemigos a hurtadillas?\n\
  \n\
  Una vez que hayas elegido ya no hay vuelta atr\u00e1s!

r.choose_your_sprite_10a = Si, elijo al maskeraith.

m.choose_your_sprite_11a = Felicidades, {0}! Has formado un lazo con un sprite de \
  batalla! Sin duda ser\u00e1 un compa\u00f1ero invaluable en las misiones que te esperan.\n\
  \n\
  Si tienes m\u00e1s preguntas de la manera como hay que criar a tu novo sprite de batalla, \
  aseg\u00farate de hablar con Biscotti o conmigo aqu\u00ed en el Lab.

r.choose_your_sprite_11a = Gracias, Morlin. Har\u00e9 lo posible para criar bien a este sprite.

m.choose_your_sprite_12a = Esta bien, habla conmigo otra vez cuando est\u00e9s listo para elegir.
r.choose_your_sprite_12a = Terminar conversaci\u00f3n

# RANK 3-1

m.prestigious_opportunity = Una Prest\u00edgiosa Oportunidad
o.prestigious_opportunity = Contacta al Agente de Intescolhancia Kora y recibe la autorizaci\u00f3n para la Miss\u00e3o de Prest\u00edgio
b.prestigious_opportunity = Al parecer te has estado luciendo a los ojos del Cuartel General \
  Spiral. Contacta al Agente de Intescolhancia Kora y aprende como puedes tomar misiones extra \
  del Cuartel General Spiral.

m.prestigious_opportunity_1a = Saludos {0}, y felicidades por convertirte en Escudeiro! Tu \
  desempe\u00f1o ha llamado la atenci\u00f3n del Cuartel General Spiral y te han dado \
  autorizaci\u00f3n para que ahora puedas tomar Miss\u00f5es de Prest\u00edgio.\n\
  \n\
  Las Miss\u00f5es de Prest\u00edgio son misiones selectas que se ofrecen diariamente y que otorgan \
  prestigio como recompensa al concluirlas. Algunas veces estas misiones requieren proveer al \
  Cuartel General Spiral o a otros cavaleiros de items, y otras veces las misiones te \
  har\u00e1n explorar los Clockworks.

r.prestigious_opportunity_1a = Suena bien, Kora.

m.prestigious_opportunity_2a = Las Miss\u00f5es de Prest\u00edgio son completamente opcionales y no se \
  pueden repetir en un mismo d\u00eda. Y no te olvides de estar atento a misiones especiales \
  que ofrecen grandes recompensas de prestigio.

r.prestigious_opportunity_2a = Gracias Kora, har\u00e9 mi mejor esfuerzo.

m.prestigious_opportunity_3a = Tengo fe en ti {0}. S\u00e9 que ser\u00e1s uno de los Cavaleiros \
  selectos suficientemente h\u00e1biles para alcanzar el Core y con algo de suerte, sacarnos de \
  este planeta.

r.prestigious_opportunity_3a = Miss\u00e3o completada.

m.minerals_rock = Minerales Roqueros!
o.minerals_rock = Rep\u00f3rtate con el Cavaleiro Geo en Jefe Wegner en la Arcade de Haven
b.minerals_rock = El Cavaleiro Geo en Jefe Wegner es responsable de investigar los extra\u00f1\
  os minerales que los cavaleiros han empezado a extraer de los Clockworks. El cree que pueden \
  contener la respuesta para ganar acceso al Core para recuperar la energia necesaria para \
  restaurar el Alondra.\n\
  \n\
  Encu\u00e9ntralo en la Arcade de Haven y obt\u00e9n una comprensi\u00f3n de c\u00f3mo puedes \
  ayudar en su investigaci\u00f3n as\u00ed como la manera de dominar el verdadero poder \
  de la Arcade de Haven!


m.arc_mintut_1 = Saludos. Soy Wegner, Cavaleiro Geo en Jefe del Alondra y encargado de los \
  estudios geol\u00f3gicos en los Clockworks.

r.arc_mintut_1 = Estoy aqu\u00ed para aprender acerca de los minerales que se encuentran en los \
  Clockworks.

# IMAGE: step1_minerals.png
m.arc_mintut_2 = Durante tus viajes a los Clockworks encontrar\u00e1s cinco minerales \
  especiales: crimsonite, moonstone, valestone, luminite y dark matter.

r.arc_mintut_2 = Continuar

# IMAGE: step2_gather.png
m.arc_mintut_3 = Encontrar\u00e1s dep\u00f3sitos minerales en todos los niveles de los \
  Clockworks, y debes atacarlos para romperlos en pedazos a un tama\u00f1o que puedas cargar. S\u00f3\
  lo puedes recoger uno a la vez, aunque puedes intercambiarlo al recoger otro. Busca el m\u00e1\
  s grande y brillante que puedas encontrar. Son los m\u00e1s valiosos.

r.arc_mintut_3 = Continuar

m.arc_mintut_4 = Una vez que llegues sano y salvo al elevador, el mineral que est\u00e9s \
  cargando se deposita en tu arsenal para usarse despu\u00e9s. Todos en tu grupo reciben los \
  minerales de los dem\u00e1s, as\u00ed que no hay necesidad de pelear por obtener el \
  mejor!

r.arc_mintut_4 = Continuar

m.arc_mintut_5 = Los minerales se usan para crear comida para los sprites en el Laboratorio. La \
  comida para sprites es muy importante para el desarrollo de tu sprite, as\u00ed que \
  recoge esos minerales cuando los veas!

r.arc_mintut_5 = Continuar

m.arc_mintut_6 = Nuestra investigaci\u00f3n geol\u00f3gica est\u00e1 en curso, as\u00ed que es \
  posible que en el futuro haya otros usos fascinantes para estos extra\u00f1os y poderosos \
  minerales.

r.arc_mintut_6 = Suena estupendo. Gracias por la informaci\u00f3n!

# TRUNCATED VERSION FOR WITHIN THE CLOCKWORKS
m.cwt_mintut_1 = Soy Wegner, Cavaleiro Geo en Jefe del Alondra. Estoy recibiendo se\u00f1ales \
  de una alta concentraci\u00f3n de dep\u00f3sitos de minerales en tu \u00e1rea.

r.cwt_mintut_1 = Minerales? Te refieres a esos pilares rocosos de colores?

# IMAGE: step1_minerals.png
m.cwt_mintut_2 = Si, exactamente! Durante tus traves\u00edas en los Clockworks encontrar\u00e1\
  s cinco minerales especiales: crimsonite, moonstone, valestone, luminite y dark matter.

r.cwt_mintut_2 = Continuar

# IMAGE: step2_gather.png
m.cwt_mintut_3 = Ataca una columna de mineral para poder romperla hasta que sea de un tama\u00f1o que puedas cargar. S\u00f3\
  lo puedes cargar uno a la vez, pero los puedes intercambiar levantando otro. Busca el m\u00e1\
  s grande y brillante que puedas encontrar. Esos son los m\u00e1s valiosos.

r.cwt_mintut_3 = Continuar

m.cwt_mintut_4 = Una vez que llegas al elevador, el mineral que est\u00e1s cargando se deposita \
  en tu arsenal para usarse despu\u00e9s. Todos los que est\u00e9n en tu grupo reciben los \
  minerales de los dem\u00e1s, as\u00ed que no hay necesidad de pelearse por el mejor!

r.cwt_mintut_4 = Continuar

m.cwt_mintut_5 = Los minerales se usan para crear comida de sprites en el Laboratorio. La \
  comida de sprites es muy importante para el desarrollo de tu sprite, as\u00ed que \
  agarra esos minerales cuando los veas!

r.cwt_mintut_5 = Continuar

m.cwt_mintut_6 = Nuestra investigaci\u00f3n geol\u00f3gica est\u00e1 en desarrollo, as\u00ed \
  que puede que haya otros usos fascinantes para estos extra\u00f1os y poderosos minerales.

r.cwt_mintut_6 = Suena excelente! Gracias por la informaci\u00f3n!

m.alien_ooze = Sudor Alien\u00edgena
o.alien_ooze = Rescata al equipo de investigaci\u00f3n de campo de los lichens
b.alien_ooze = Uno de nuestros equipos de investigaci\u00f3n de campo est\u00e1 sitiado por una \
  colonia de lichens. Los lichens son una especie alien\u00edgena de la familia slime de la que \
  se piensa que han llegado a los Clockworks en un meteoro que se estrell\u00f3 en la \
  superficie de Cradle. Esta especie de slime en particular est\u00e1 formada de innumerables \
  slimes m\u00e1s peque\u00f1os que forman 'colonias' m\u00f3viles y que poseen conciencia.\n\
  \n\
  Las colonias de lichen se pueden volver a combinar para formar versiones m\u00e1s y m\u00e1s \
  grandes de si mismas, desarrollando r\u00e1pidamente un gran rango de garras y p\u00faas mortales.

n.techknight_ooze = Cavaleiro Tech Povla
m.alien_ooze_1a = Todav\u00eda no tengo nada que decir, pero tiene que ver con Campanas de \
  Monstruos. (DEV-ONLY)

r.alien_ooze_1a = Terminar conversai\u00f3n

m.toy_soldiers = Soldados de Juguete
o.toy_soldiers = Destruye el centro de producci\u00f3n de la f\u00e1brica de Mecha Knights
b.toy_soldiers = Los cavaleiros Recon han reportado un mayor n\u00famero de mecha knights en el \
  primer estrato de los Clockworks y han descubierto una instalaci\u00f3n de producci\u00f3n de \
  mecha knights cercana Haven.\n\
  \n\
  Se cree que los mecha knights son centinelas de ingenier\u00eda gremlin de la familia de los \
  construct que comparten muchas de las habilidades de los Cavaleiros Spiral. Procede con \
  precauci\u00f3n cuando busques el centro de producci\u00f3n y despu\u00e9s acaba con \
  ellos de una vez por todas!

m.monstrous_research_2 = Investigaci\u00f3n Monstruosa
o.monstrous_research_2 = Entrega los materiales de investigaci\u00f3n solicitados por el \
  Cuartel General Spiral
b.monstrous_research_2 = Ya debes haber recolectado algunas muestras de interesantes materiales \
  en el primer estrato de los Clockworks que puede ser \u00fatil para el Cuartel General \
  Spiral. Dona materiales para ayudar a continuar su investigaci\u00f3n de los misterios de \
  Cradle.

m.the_collector = El Coleccionista
o.the_collector = Salva a los sprites y los investigadores del Coleccionista
b.the_collector = Ha habido reportes aislados de una gran entidad mec\u00e1nica a la que hemos \
  llamado el 'Coleccionista', quien ha estado interceptando a nuestros cavaleiros y llev\u00e1\
  ndoselos a ellos y a los sprites que buscaban y los ha encarcelado en un resguardado recinto \
  en las profundidades de los Clockworks.  Armado con tu nievo sprite, tu misi\u00f3n es \
  encontrar a este 'Coleccionista' y rescatar a los cavaleiros y los sprites que tiene \
  cautivos.

n.collector_prisoner = Cavaleiro Veterano
m.collector_prisoner_1a = Puf, Apenas puedo ver... El Cuartel General Spiral te envi\u00f3 a rescatarnos?

r.collector_prisoner_1a = Si, pero me puedes decir que pas\u00f3?

m.collector_prisoner_2a = Mi equipo de rescate fue emboscado por un gigante horror mec\u00e1\
  nico. No tuvimos ninguna oportunidad. Me da gusto que hayas llegado cuando lo hiciste, de \
  otra manera, no se si hubi\u00e9ramos podido lograrlo.

r.collector_prisoner_2a = Puedes regresar a Haven?

m.collector_prisoner_3a = Creo que si... trataremos de escabullirnos cuando podamos.\n\
  \n\
  Oh, pero ten cuidado!  Lo que sea que nos haya atrapado todav\u00eda est\u00e1 all\u00e1 \
  afuera, resguardando un gran alijo de sprites de batalla capturados. Si planeas pelear contra \
  eso, ten cuidado con su ataque mortal. Buena cacer\u00eda!

r.collector_prisoner_3a = Terminar conversaci\u00f3n

# RANK 3-2

m.pioneers = Los Pioneros
o.pioneers = Contacta al Agente de Intescolhancia Kora v\u00eda Comlink
b.pioneers = Despu\u00e9s de que el Alondra se estrellara, el Comandante Ozlo seleccion\u00f3 un escuadr\u00f3n \u00e9\
  lite de Cavaleiros Spiral para que fueran los primeros en entrar a los Clockworks. Nunca se \
  les volvi\u00f3 a ver. Contacta al Agente de Intescolhancia Kora y aprende como puedes jogar tu \
  papel para resolver este misterio.

m.pioneers_1a = Saludos {0}, espero que est\u00e9s bien. Ha surgido algo que requerir\u00e1 que te enfrentes a tu m\u00e1s grande desaf\u00edo hasta ahora.\n\
  \n\
  Tengo una orden de Spiral HQ que viene del Comandante Ozlo en persona. Has sido seleccionado \
  como uno de los cavaleiros para buscar activamente rastros del Escuadr\u00f3n Alpha.

r.pioneers_1a = Escuadr\u00f3n Alpha? Suena vagamente conocido...

m.pioneers_2a = Deber\u00eda, hay muchos novos reclutas que parlotean acerca de ellos \
  constantemente. Son como h\u00e9roes para algunos cavaleiros.\n\
  \n\
  El Escuadr\u00f3n Alpha era un escuadr\u00f3n de \u00e9lite que Ozlo personalmente seleccion\u00f3 \
  para que fueran los primeros en entrar a los Clockworks en un esfuerzo por localizar la \
  fuente de una se\u00f1al masiva debajo. Ya que los sistemas a bordo del Alondra estuvieron \
  fuera de l\u00ednea  por varias semanas, la comunicaci\u00f3n por radio no era posible. En \
  lugar de eso, dejaron una serie de m\u00f3dulos de reconocimiento a trav\u00e9s de sus viajes, algo as\u00ed \
  como un rastro de migajas.

r.pioneers_2a = Continuar

m.pioneers_3a = Cuando nuestros t\u00e9cnicos finalmente restablecieron los sistemas de \
  comunicaci\u00f3n del Alondra, no pudimos establecer un enlace con el Escuadr\u00f3n Alpha y \
  desde entonces nunca m\u00e1s se supo de ellos. Su canal est\u00e1 completamente muerto.\n\
  \n\
  Esta l\u00ednea muerta es lo que nos tiene rasc\u00e1ndonos la cabeza. Nuestros enlaces de \
  comunicaci\u00f3n est\u00e1n construidos para resistir todo tipo de condiciones extremas, \
  hasta explosiones. Es m\u00e1s, sobrevivieron la ca\u00edda del Alondra despu\u00e9s de todo. \
  No puedo pensar en nada que pudiera haber eliminado el enlace completamente.

r.pioneers_3a = C\u00f3mo intervengo yo en todo esto?

m.pioneers_4a = Necesitamos que descubras que sucedi\u00f3 con ellos. Empezar\u00e1s por buscar \
  las ubicaciones conocidas de sus m\u00f3dulos de reconocimiento y recolectarlos para ser \
  analizados. Yo estar\u00e9 a cargo de localizar su posici\u00f3n general y te dirigir\u00e9 \
  hacia ellos. Es tu trabajo aventurarte en lo salvaje y recuperarlos.\n\
  \n\
  Adem\u00e1s, te proveer\u00e9 con un peque\u00f1o historial de cada uno de los miembros del \
  Escuadr\u00f3n Alpha: L\u00edder de Escuadr\u00f3n Euclid, Guardi\u00e1n de Escuadr\u00f3n \
  Grantz, Recon de Escuadr\u00f3n Parma, y T\u00e9cnico de Escuadr\u00f3n Rulen.

r.pioneers_4a = Cu\u00e9ntame acerca del L\u00edder de Escuadr\u00f3n Euclid.

m.pioneers_5a = Euclid no era el cavaleiro t\u00edpico.  Cuando la mayor\u00eda de su divisi\u00f3\
  n estaba obteniendo el emblema de Escudeiro, el ya hab\u00eda alcanzado el rango de \
  Vanguarda.  Como L\u00edder de Escuadr\u00f3n, el lider\u00f3 una serie de ataques exitosos \
  contra los Morai durante la liberaci\u00f3n de Isora.  Un estratega brillante, fue conocido \
  por conseguir objetivos con la mitad de los cavaleiros de otros escuadrones.

r.pioneers_5a = Continuar

m.pioneers_6a = Fue por esta raz\u00f3n que Ozlo lo seleccion\u00f3 para tomar un peque\u00f1o escuadr\u00f3\
  n dentro de las desconocidas profundidades de los Clockworks. Despu\u00e9s de todo, si te \
  cortas los dientes peleando en batalla bajo un tif\u00f3n de fuego Morai  puedes manejar \
  cualquier problema, verdad?\n\
  \n\
  Pero tal vez los Clockworks probaron ser demasiado a\u00fan para su habilidad.

r.pioneers_6a = Cu\u00e9ntame acerca del Guardi\u00e1n de Escuadr\u00f3n Grantz.

m.pioneers_7a = Grantz era el verdadero veterano del grupo. Un sazonado Guardi\u00e1n, Grantz \
  se especializaba en mantener su escuadr\u00f3n seguro, sobre todo aplastando cualquier cosa \
  que intentara causarles da\u00f1o.\n\
  \n\
  Grantz tom\u00f3 su voto de Guardi\u00e1n muy en serio, frecuentemente interponi\u00e9ndose \
  al frente del peligro para proteger a otros. El tipo era desinteresado. Me imagino que si el \
  desastre de verdad cay\u00f3 encima del Escuadr\u00f3n Alpha, Grantz no permiti\u00f3 que \
  sucediera sin dar una infernal batalla.

r.pioneers_7a = Cu\u00e9ntame acerca del Recon de Escuadr\u00f3n Parma.

m.pioneers_8a = Parma era la m\u00e1s joven del grupo, una muy talentosa Recon, pero con poca \
  experiencia en batalla. Estuvimos juntos en la academia y recuerdo el d\u00eda que los t\u00e9\
  cnicos del simulador pensaron que su programa estaba descompuesto debido al desempe\u00f1o de Parma. Se disculp\u00f3!\n\
  \n\
  Pero aun as\u00ed, nos preocupamos por ella. Por los reportes que he le\u00eddo, los \
  Clockworks no tienen comparaci\u00f3n con nada de lo que hemos enfrentado antes. Solo espero \
  que mientras ella los mantenga informados de lo que hay adelante, los otros cuidaran su \
  espalda.

r.pioneers_8a = Cu\u00e9ntame acerca del T\u00e9cnico del Escuadr\u00f3n Rulen

m.pioneers_9a = Rulen fue reclutado como el genio t\u00e9cnico que el Comandante Ozlo cre\u00ed\
  a que seria requerido para navegar el vasto y mecanizado mundo de los Clockworks.  Sus \
  responsabilidades principales inclu\u00edan de todo, desde neutralizar candados a reparar \
  armaduras y a demoler construcciones que poseen consciencia.  Tambi\u00e9n estaba a cargo de \
  analizar el Core una vez que el escuadr\u00f3n llegara all\u00ed.

r.pioneers_9a = Continuar

m.pioneers_10a = Rulen era muy\u2026 l\u00f3gico. Creo que \u00e9l estaba muy consciente de las \
  probabilidades que ten\u00edamos de alcanzar el Core y despu\u00e9s hacer algo con tal de \
  restaurar el Alondra. Creo que Rulen sab\u00eda exactamente qu\u00e9 clase de misi\u00f3n \
  estaba tomado cuando hicieron su primer descenso en la oscuridad de los Clockworks.

r.pioneers_10a = As\u00ed que d\u00f3nde comienzo?

m.pioneers_11a = Bien, vamos al grano. Hemos localizado un m\u00f3dulo de reconocimiento del \
  Escuadr\u00f3n Alpha en un \u00e1rea de los Clockworks conocida como 'Bosque en Crep\u00fa\
  sculo.'  Sin embargo, esta zona en particular es el hogar de un terrible criatura conocida \
  como 'el Snarbolax.' \n\
  \n\
  El Snarbolax ha derrotado f\u00e1cilmente a Escudeiros como t\u00fa, pero yo se que puedes \
  manejarlo {0}. Pero necesitaras prepararte. Te he asignado una serie de misiones que te \
  permitir\u00e1n ensamblar una panoplia apropiada para poder enfrentar a esta terrible bestia \
  y reclamar ese m\u00f3dulo de reconocimiento!

r.pioneers_11a = Har\u00e9 mi mejor esfuerzo por recuperar el m\u00f3dulo de \
  reconocimiento y destruir el Snarbolax!

m.pioneers_12a = Contamos contigo, {0}.

r.pioneers_12a = Terminar conversaci\u00f3n.

m.faith_armor = Conf\u00eda en la Armadura
o.faith_armor = Navega por la c\u00e1mara llena de trampas y rescata al Aprendiz Wilks.
b.faith_armor = Un aprendiz llamado Wilks que acaba de llegar del Campamento de Rescate se \
  encuentra en lo que el Cuartel General Spiral llama una 'C\u00e1mara de Trampa'. Estos \
  niveles de lo que de seguro es dise\u00f1o gremlin parecen estar construidos espec\u00ed\
  ficamente para atrapar y en \u00faltima instancia eliminar, a aquellos que se atrevan a \
  explorar los Clockworks.\n\
  \n\
  Wilks probablemente no sab\u00eda en lo que se met\u00eda hasta que era demasiado tarde. \
  Ahora est\u00e1 atrapado en alg\u00fan lugar de la c\u00e1mara y necesita tu ayuda.\n\
  \n\
  Algunas trampas se pueden evitar y algunas veces te encontrar\u00e1s con que tienes que \
  aguantar el golpe. Al salvar a Wilks, sin duda aprender\u00e1s el valor de una fuerte \
  armadura.

m.strength_unity = La Uni\u00f3n hace la Fuerza
o.strength_unity = Defiende a los Cavaleiros Geo de un asalto monstruoso
b.strength_unity = Algo ha irritado a una manada de bestias en los Islotes Aurora y han atacado \
  al equipo de investigaci\u00f3n de Cavaleiros Geo. Al verse acorralados, el equipo ha enviado \
  una se\u00f1al de socorro y el Cuartel General Spiral te ha designado la misi\u00f3n de salvarlos.\n\
  \n\
  Al mantenerse unidos, los Cavaleiros Geo han sobrevivido todo este tiempo pero se les est\u00e1 acabando el tiempo. Re\u00fane a un equipo y enfr\u00e9\
  ntate a las bestias que buscan devorarlos!

m.blades_fallen = Las Espadas de los Ca\u00eddos
o.blades_fallen = Colocar la espada de un cavaleiro desconocido en el monumento en el \
  cementerio del soldado.
b.blades_fallen = No todos los cavaleiros que entran a los Clockworks regresan para sentir el \
  sol en sus rostros una vez m\u00e1s. Dentro de las peligrosas profundidades de los \
  Clockworks, aquellos que se atreven a enfrentar sus peligros siempre se enfrentan a la \
  realidad de que esa misma expedi\u00e7\u00e3o puede ser la \u00faltima. Algunas veces sus cuerpos \
  pueden ser recobrados y en otras ocasiones todo lo queda son restos de su equipo.\n\
  \n\
  Justo afuera de Haven, el Cuartel General Spiral ha construido un cementerio de soldados \
  donde los cavaleiros ca\u00eddos pueden ir a descansar. Como Cavaleiro Spiral, debes \
  enfrentar la realidad de la muerte para poder entender su gravedad.\n\
  \n\
  Entrega los restos de un cavaleiro desconocido, una espada, en el monumento dentro del \
  cementerio. Pero mantente alerta - hay energia oscura que resuena dentro del cementerio, \
  atra\u00edda a las incontables almas que abriga.

# RENAMED FROM roar_snarbolax
m.shadow_beast = La Sombra de la Bestia
o.shadow_beast = Derrota al Snarbolax en Bosque en Crep\u00fasculo y recupera el m\u00f3dulo de reconocimiento.
b.shadow_beast = Spiral HQ ha detectado un m\u00f3dulo dejado por el Escuadr\u00f3n Alpha en alg\u00fa\
  n lugar dentro de Bosque en Crep\u00fasculo. Tu misi\u00f3n es localizar y recuperar el m\u00f3dulo.\n\
  \n\
  El Bosque en Crep\u00fasculo aloja jaur\u00edas de bestias salvajes que han demostrado ser \
  mortales para escuadrones en el pasado. Es por esto, que Cavaleiros Tech han colocado Beast \
  Bells a trav\u00e9s del \u00e1rea. Golpearlas debe aturdir cualquier bestia atrapada en la \
  onda de sonido que producen.\n\
  \n\
  Ten en cuenta que cavaleiros Recon han reportado la presencia de una terrible bestia  de un \
  tipo que nunca hemos visto antes asechando este bosque. Conocida como 'el Snarbolax' aparece \
  como una masa de sombras colmillos y garras y parece ser completamente inmune a nuestro \
  armamento. En caso de encontrarte con esta bestia, intenta encontrar una manera de escapar lo \
  m\u00e1s r\u00e1pido posible.

# RANK 4-1
m.new_chapter = Un Nuevo Cap\u00edtulo
o.new_chapter = Contacta al Agente de Intescolhancia Kora v\u00eda Comlink
b.new_chapter = Despu\u00e9s de derrotar al Snarbolax y de recobrar el m\u00f3dulo de \
  reconocimiento del Escuadr\u00f3n Alpha, es el momento de hacer contacto con el Agente Kora \
  para receber un reporte del an\u00e1lisis del m\u00f3dulo y la informaci\u00f3n acerca de la \
  certificaci\u00f3n en el Sal\u00f3n de H\u00e9roes.


m.new_chapter_1a = Felicidades por convertirte en Soldado, {0}!  Escuch\u00e9 que le \
  diste una buena paliza a ese Snarbolax, bien hecho!\n\
  \n\
  Tuvimos la oportunidad de analizar el m\u00f3dulo de reconocimiento de Euclid que descubriste \
  en la guarida del Snarbolax. Basados en la grabaci\u00f3n, parece que Euclid sospechaba algo \
  que nuestros Cavaleiros Geo descubrieron alg\u00fan tiempo despu\u00e9s de estrellarnos- \
  que los niveles dentro de los Clockworks est\u00e1n conformados de terreno de m\u00faltiples mundos alien\u00edgenas!

r.new_chapter_1a = Qu\u00e9? C\u00f3mo es eso posible?

m.new_chapter_2a = Todav\u00eda no podemos decir con seguridad, pero parece que cualquiera que \
  fuera la forma en que Cradle se form\u00f3, incluy\u00f3 partes grandes de otros mundos a su \
  alrededor. Si esto es verdad, entonces nunca hemos visto nada como esto antes.

r.new_chapter_2a = Que mundo tan extra\u00f1o. Qu\u00e9 m\u00e1s tienes para mi, Kora?

m.new_chapter_3a = El Cuartel General Spiral te ha autorizado a visitar el Sal\u00f3n de los H\u00e9\
  roes para receber tu Certificaci\u00f3n 2 Estrelas.\n\
  \n\
  El Sal\u00f3n de los H\u00e9roes es un lugar donde los Cavaleiros que van subiendo en los \
  rangos como tu visitar\u00e1n tanto para aprender acerca de y adquirir nuevas recetas para \
  equipo, as\u00ed como para receber la certificaci\u00f3n para bajar a niveles m\u00e1s \
  profundos dentro de los Clockworks.\n\
  \n\
  Tu primera visita requiere solamente que vistas equipo 2 Estrelas que ya tienes as\u00ed que deber\u00e1 pan comido!

r.new_chapter_3a = Gracias Kora, lo har\u00e9 lo mejor que pueda!

m.shopping_again = Vamos de compras otra vez!
o.shopping_again = Sigue a Bechamel en un tour de las ofertas m\u00e1s avanzadas en el Bazar
b.shopping_again = Bechamel ya te ha dado un tour del Bazar de Haven que inclu\u00eda los \
  lugares donde comprar nuevas armas, armaduras y recetas. Ahora es el momento de visitarlo de \
  novo y aprender algo de los servicios m\u00e1s avanzados que el Bazar tiene para ofrecer.\n\
  \n\
  Visitar\u00e1s a Punch y Vise, Brinks y tambi\u00e9n visitar\u00e1s la tienda del mismo \
  Bechamel!

m.shopping_again_1a = Hola {0}!  Guau, ya eres Soldado? Realmente te est\u00e1s moviendo r\u00e1pido en los rangos.\n\
  \n\
  De cualquier modo, estoy aqu\u00ed para darte un tour de algunos de los servicios m\u00e1s \
  avanzados del Bazar. Para empezar, quieres aprender como hacer m\u00e1s poderoso a\u00fan ese equipo tuyo?

r.shopping_again_1a = Que si quiero!

m.shopping_again_2a = Qui\u00e9n no quiere, cierto?  Vamos al taller de Punch y Vise.

r.shopping_again_2a = (Sigue a Bechamel)
#(move to Punch and Vise)

m.shopping_again_3a = Punch y Vise son herreros gremlin que pueden cambiar las propiedades de \
  tus armas y equipo.

r.shopping_again_3a = Gremlins?!

m.shopping_again_4a = T\u00f3malo con calma {0}, no todos los gremlins est\u00e1n cortados con \
  la misma tijera. Algunos no est\u00e1n de acuerdo con los m\u00e9todos del Rey Tinkinzar y la \
  Orden Crimson. De hecho, me han dicho que en alg\u00fan lugar dentro de los Clockworks hay un \
  mundo entero lleno de gremlins que dejaron la Gran Colonia.

r.shopping_again_4a = Bueno, si tu lo dices...

m.shopping_again_5a = De acuerdo, regresemos a nuestro asunto.\n\
  \n\
  Punch puede a\u00f1adir Variantes \u00danicas por un precio, este es un tipo de b\u00f4nus especial \
  para tus armas y equipo. Pero sus m\u00e9todos son... ca\u00f3ticos. Nunca sabes en realidad \
  lo que vas a receber.\n\
  \n\
  Vise es un poco m\u00e1s preciso. Puede desligar tus armas y equipo por un precio, lo \
  que te permite volver a vender o regalar el item!

r.shopping_again_5a = Muy \u00fatil, lo tendr\u00e9 en mente. Qu\u00e9 m\u00e1s tienes?

m.shopping_again_6a = Vamos a visitar a Brinks.

r.shopping_again_6a = (Sigue a Bechamel)
#(move to Brinks)

m.shopping_again_7a = Brinks es el Mercader de Sellos, otorga ciertos items a los \
  Cavaleiros a cambio de los sellos que se pueden recolectar dentro de los Clockworks. \n\
  \n\
  Los sellos se pueden encontrar en bloques de tesoro, se otorgan como recompensas de misiones \
  o se encuentran al derrotar a ciertos jefes especiales.

r.shopping_again_7a = Entendido. Algo m\u00e1s?

m.shopping_again_8a = Solo queda una tienda por visitar y terminamos. Dej\u00e9 lo mejor para el final.

r.shopping_again_8a = (Sigue a Bechamel)
#(move to Bechamel)

m.shopping_again_9a = Aqu\u00ed tenemos... a mi! Soy el Complementador, a\u00f1ado \
  accesorios a tu equipo siempre y cuando tengas un cup\u00f3n. Con los accesorios, puedes \
  hacer que tu equipo sobresalga en una multitud. Recomiendo ampliamente probarlos. Muy pronto tu equipo ser\u00e1 la ni\u00f1a de los ojos de todos!

r.shopping_again_9a = D\u00f3nde encuentro cupones de accesorios?

m.shopping_again_10a = Puedes encontrar los cupones para accesorios dentro de los lockboxes o \
  en la Casa de Subastas si alg\u00fan otro cavaleiro anduviera vendiendo uno.

r.shopping_again_10a = Entendido.

m.shopping_again_11a = Bueno, eso cubre lo b\u00e1sico del Bazar. Es realmente un lugar fant\u00e1\
  stico para encontrar casi todo lo que necesitas.\n\
  \n\
  Quieres repasarlo de novo o crees haberlo captado todo?

r.shopping_again_11a = Me gustar\u00eda que me dieras el tour una vez m\u00e1s.
r.shopping_again_11b = Creo que ya me qued\u00f3 claro Bechamel, gracias!

m.shopping_again_12a = No hay problema, tengo tiempo.  Vamos de novo con Punch y Vise.
r.shopping_again_12a = (Sigue a Bechamel)
#(starts at Punch and Vise)
m.shopping_again_12b = Excelente! Me da gusto haber podido ayudar. Buena suerte y \
  recuerda que siempre estar\u00e9 aqu\u00ed para hacer que tu armadura se vea \u00fanica!

r.shopping_again_12b = Gracias Bechamel, nos vemos!

# LET'S GO SHOPPING AGAIN B-TEST
m.shopping_again_b = Vamos de compras!
o.shopping_again_b = Sigue a Bechamel en un tour de las ofertas m\u00e1s avanzadas en el Bazar
b.shopping_again_b = Ahora es el momento de aprender acerca de los servicios m\u00e1s avanzados \
  que el Bazar ofrece. Sigue al cavaleiro Bechamel y visita a Punch y Vise, Brinks y puedes \
  visitar la tienda del mismo Bechamel!

m.shopping_again_b_1a = Hola {0}! Guau, ya eres Soldado? Te est\u00e1s moviendo r\u00e1pido por los rangos.\n\
  \n\
  De cualquier forma, soy Bechamel y estoy aqu\u00ed para darte un tour de algunos de los \
  servicios m\u00e1s avanzados del Bazar. Para empezar, quieres aprender c\u00f3mo mejorar a\u00fan m\u00e1s ese equipo tuyo?

m.advanced_alchemy = Alquimia Avanzada
o.advanced_alchemy = Visita a Bosco y descubre el potencial de la alquimia avanzada
b.advanced_alchemy = Ahora que has logrado el rango de Soldado, Bosco en el Bazar de Haven \
  tiene nueva informaci\u00f3n para ti acerca de las formas de alquimia avanzadas. Hazle \
  una visita y aprende acerca del potencial escondido en algunas armas y equipo!

m.advanced_alchemy_1a = Nos encontramos de novo, {0}.  El Cuartel General Spiral me ha pedido \
  que te ense\u00f1e algo de alquimia avanzada. No te preocupes, esto no tomar\u00e1 mucho \
  tiempo. De igual manera, tengo un viejo mecha knight en el que voy a trabajar.

r.advanced_alchemy_1a = Cu\u00e9ntamelo, Bosco

m.advanced_alchemy_2a = B\u00e1sicamente se refiere a 'ramificaciones'. Ver\u00e1s, la mayor \
  parte de la alquimia que es posible que hayas visto hasta este punto sigue un sendero de \
  evoluci\u00f3n linear. Simplemente mejora con el tiempo, y cada mejora es mejor que la \
  anterior.\n\
  \n\
  Pero no todos los items son como esto. Muchos de ellos se pueden convertir en m\u00faltiples tipos, \
  completamente diferentes que el original!

r.advanced_alchemy_2a = Guau, parece que tengo mucho por aprender!

m.advanced_alchemy_3a = Lo averiguar\u00e1s conforme avances, conf\u00eda en mi. Pongamos de \
  ejemplo este Brandish. Dentro de si tiene el potencial de convertirse en tres diferentes \
  tipos de espadas elementales que infligen poderosas condiciones de estatus, o a\u00fan podr\u00eda ser una espada sombr\u00ed\
  a espada de la oscuridad!\n\
  \n\
  Solo necesitas descubrir las recetas que requiere un brandish y ponerte a manufacturarlas \
  para averiguarlo. Toma, puedes quedarte con esta Brandish. Puedes transmutarla en algo \
  extraordinario.

r.advanced_alchemy_3a = Gracias Bosco! Juntar\u00e9 unas recetas y me pondr\u00e9 a hacerlas!

m.hall_of_heroes_0 = Sal\u00f3n de H\u00e9roes
o.hall_of_heroes_0 = Obt\u00e9n rango de Soldado

m.hall_of_heroes_1 = Sal\u00f3n de los H\u00e9roes
o.hall_of_heroes_1 = Visita el Sal\u00f3n de los H\u00e9roes vistiendo equipo de al menos 2 \
  estrellas y recibe tu certificaci\u00f3n
b.hall_of_heroes_1 = El Sal\u00f3n de los H\u00e9roes es el lugar en que los cavaleiros reciben \
  si Certificaci\u00f3n de Estrelas lo que les permite bajar a mayores profundidades en los \
  Clockworks. Cada certificaci\u00f3n asegura que un cavaleiro tenga el nivel de estrella \
  requerido para lidiar con los retos de las misiones por venir.\n\
  \n\
  El Sal\u00f3n de los H\u00e9roes tambi\u00e9n permite que los cavaleiros tengan la \
  oportunidad de hablar con cavaleiros veteranos y descubran sus panoplias, y se les puede \
  ofrecer la oportunidad de comprar recetas para ellas.\n\
  \n\
  Visita el Sal\u00f3n de los H\u00e9roes y recibe tu Certificaci\u00f3n 2 Estrelas para poder \
  obtener acceso a las misiones dentro de los niveles m\u00e1s profundos de los Clockworks.

#Conversation (used at in the hall):
n.hall_of_heroes_0 = Alcaide Spiral
m.hall_of_heroes_0_1a = Bien llegado, {0}. Este es el Sal\u00f3n de H\u00e9roes, donde \
  cavaleiros veteranos vienen a ofrecer sus servicios a miembros de nuestra orden que han \
  alcanzado el rango de Soldado o m\u00e1s alto.\n\
  \n\
  Si tomas m\u00e1s misiones, estoy seguro que alg\u00fan d\u00eda estar\u00e1s entre nosotros

r.hall_of_heroes_0_1a = Terminar conversaci\u00f3n.

m.hall_of_heroes_1_1a = Tanto gusto {0}, soy el Teniente Barrus, Guardi\u00e1n del Sal\u00f3n de los H\u00e9roes.\n\
  \n\
  Est\u00e1s aqu\u00ed porque el Cuartel General Spiral te ha marcado como poseedor del \
  potencial para convertirte en Vanguarda de los cavaleiros Spiral.  El Sal\u00f3n de los H\u00e9roes est\u00e1 ahora a tu disposici\u00f3\
  n. Conforme avances en los rangos, receber\u00e1s nuevas misiones para visitar y tendr\u00e1s acceso a m\u00e1\
  s recetas de los cavaleiros veteranos en este sal\u00f3n.

r.hall_of_heroes_1_1a = Me dijeron que iba a receber la Certificaci\u00f3n de Estrella aqu\u00ed?

m.hall_of_heroes_1_2a = Si, para que puedas entrar a estratos m\u00e1s profundos en los \
  Clockworks primero debes receber tu Certificaci\u00f3n de Estrella. Esto implica hablar \
  conmigo cuando hayas equipado armadura, yelmo y escudo y al menos un arma de un nivel de \
  estrella espec\u00edfico o mayor.

r.hall_of_heroes_1_2a = Entendido.

m.hall_of_heroes_1_3a = Felicidades, cumples con los requisitos necesario y has recibido tu \
  Certificaci\u00f3n de 2 estrellas. Toma el elevador detr\u00e1s de mi para que puedas \
  concluir tu misi\u00f3n.

r.hall_of_heroes_1_3a = Terminar conversaci\u00f3n.

m.hall_of_heroes_1_3b = Lo siento {0}, pero en este momento no cumples con los requisitos \
  necesarios.  Por favor habla conmigo otra vez cuando tengas equipado una armadura, yelmo, \
  escudo y arma de 2 estrellas o m\u00e1s.

r.hall_of_heroes_1_3b = Terminar conversaci\u00f3n.

#*Completed requirements but have not exited properly:

m.hall_of_heroes_1_3c = Por favor toma el elevador que est\u00e1 detr\u00e1s de mi para \
  concluir tu misi\u00f3n.

r.hall_of_heroes_1_3c = Terminar conversaci\u00f3n.

#*Completed mission and returned:

m.hall_of_heroes_1_4 = Bienvenido de novo al Sal\u00f3n de los H\u00e9roes, {0}.  Por favor \
  habla con los heroicos cavaleiros que ves frente a ti antes de lograr ganar acceso a sus \
  armas y equipo.

r.hall_of_heroes_1_4 = Gracias Teniente, lo har\u00e9.

# RANK 4-2
m.new_threat = Una Nueva Amenaza
o.new_threat = Confronta una nueva y peligrosa amenaza a Haven
b.new_threat = Fuerzas mortales conspiran contra Haven.  Contacta al Agente de Intescolhancia \
  Kora y aprende acerca de lo que puedes hacer para ayudar.

m.new_threat_1a = Saludos, {0}!  Tenemos dos misiones de vital importancia.  Primero, \
  hemos localizado una firma de energia similar a la que emana de ese Artefacto que \
  encontraste en los Clockworks. Nos estamos enfocando en esa firma de energia. Encontrar \
  la fuente nos podr\u00eda ayudar a comprender lo que el conspirador gremlin Razwog planea \
  hacer con el Artefacto o lo que el aparato es capaz de hacer.

r.new_threat_1a = Continuar

m.new_threat_2a = Y hablando de gremlins, estamos empezando a receber un alarmante n\u00famero \
  de reportes de movilizaciones de gremlins en los Clockworks bajo Haven.  No tenemos muchos \
  detalles todav\u00eda, pero dadas las relaciones que hemos tenido con ellos hasta ahora, \
  suponemos que se est\u00e1n preparando para un ataque.

r.new_threat_2a = Continuar

m.new_threat_3a = El Cuartel General Spiral cree que tu eres la mejor opci\u00f3n para ayudar a \
  localizar esta firma de energia, ya que fuiste tu quien nos trajo el Artefacto en primer \
  lugar.  Enviaremos a Rhendon para que investigue que traman los Gremlins.

r.new_threat_3a = Continuar

m.new_threat_4a = (Kora hace una pausa)\n\
  \n\
  Hablando del rey de Roma, Rhendon me est\u00e1 hablando, dice que es urgente. Lo voy a \
  conectar...

r.new_threat_4a = Continuar

m.new_threat_5a = {0}, algo muy grande sucede ac\u00e1 en el Lab. Mejor vienes para ac\u00e1 de inmediato!

r.new_threat_5a = Entendido. Voy para all\u00e1!
#(Teleport player to fake Garrison scene)

m.new_threat_bystander_1a = Casi no salimos vivos de ah\u00ed. Todo estaba bien un momento y lo \
  siguiente que vemos son gremlins saltando de la tierra!

m.new_threat_bystander_1b = Ten cuidado ah\u00ed.  Parece que ten\u00edan uno grande con \
  ellos...

m.new_threat_bystander_1c = Me preocupan los sprites!

n.new_threat_bystander_1d = Cavaleiro Veterano
m.new_threat_bystander_1d = Acabo de escuchar una explosi\u00f3n en la parte trasera del \
  lab!\n\
  \n\
  Nosotros nos encargaremos de estos monstruos, {0}. Tu ve y aseg\u00farate que el \
  Artefacto est\u00e9 seguro!  Apres\u00farate!

#Rhendon
m.new_threat_6a = Hab\u00eda sonidos de gritos y explosiones que ven\u00edan del lab justo \
  ahora.  Creo que estamos bajo ataque!  Es mejor que te equipes bien.  No tengo idea de \
  lo que sucede ah\u00ed pero necesitamos prepararnos para cualquier cosa!

r.new_threat_6a = Terminar conversaci\u00f3n

m.new_threat_7a = Hsst! As\u00ed que ustedes son los que derrotaron a Razgow y tomaron \
  algo que me pertenece.  No son dignos de poseer este poderoso Artefacto as\u00ed que estoy aqu\u00ed \
  para quitarles esa carga.

