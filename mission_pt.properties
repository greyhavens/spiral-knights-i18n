b.chilled_to_bone = Sin duda alguna, ya debes haber encontrado esos extra\u00f1os monstruos \
  conocidos como 'spookats'. Los cavaleiros Recon finalmente han descubierto lo que parece ser \
  la fuente de estas fantasmales criaturas gatunas.\n\
  \n\
  Se ha visto una gran concentraci\u00f3n de spookats en lo que se cree que son los oscurecidos \
  restos de una mansi\u00f3n owlite. Este sombr\u00edo reino llamado 'Torre del Candelero' est\u00e1 \
  iluminado solamente por una serie de velas owlite.\n\
  \n\
  Procede con precauci\u00f3n mientras exploras fuera de la luz de las velas. Acechando en la \
  oscuridad est\u00e1n unos enormes spookats conocidos como 'grimalkins'. Al parecer los \
