b.p_anniversary_shock_r3 = Hemos estado recibiendo reportes de que Groat, un chef de Emberlight \
  ha estado actuando... extra\u00f1amente. Parece que Biscotti lo ha comisionado para que le \
  ayude a hornear, pero parece que la responsabilidad se le ha ido a la cabeza.  Despareci\u00f3 \
  en los Clockworks poco despu\u00e9s de que Biscotti le entregara la \u00faltima carga de \
  masa. Con las celebraciones de aniversario bajo riesgo otra vez, Biscotti necesita \
  algunos campeones culinarios para que la ayuden a arreglar este mejunje!

