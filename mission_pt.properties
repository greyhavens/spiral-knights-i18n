m.p_r3_mat_0 = Investigaci\u00f3n Monstruosa
o.p_r3_mat_0 = Entrega los materiales de investigaci\u00f3n solicitados por el Cuartel General \
  Spiral
b.p_r3_mat_0 = El Cuartel General Spiral siempre est\u00e1 buscando entender m\u00e1s a la \
  criaturas que habitan en los Clockworks por medio de la examinaci\u00f3n de materiales. Si \
  tienes algunos materiales que te sobren, puedes incrementar tu prestigio donando materiales \
  al Cuartel General Spiral.

