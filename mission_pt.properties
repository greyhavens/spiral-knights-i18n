m.ghost_machine_1a = Presten atenci\u00f3n, Soldados! El Cuartel General Spiral ha \
  recibido una se\u00f1al de socorro muy cr\u00edptica de una instalaci\u00f3n completamente \
  desconocida dentro de los Clockworks.\n\
  \n\
  Seg\u00fan veo esto, estamos a punto de tirarnos de cabeza en lo que puede ser una peligrosa \
  misi\u00f3n de rescate o una trampa mortal. De cualquier manera, la mejor forma en que puedes \
  solucionar la situaci\u00f3n reside en tu arsenal en este momento. As\u00ed que \u00e1rmate y prep\u00e1rate para el combate. \n\
  \n\
  Al ataque, Soldados!

