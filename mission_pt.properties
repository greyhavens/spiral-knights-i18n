m.p_legion_almire_r4 = Legi\u00f3n de Almire
o.p_legion_almire_r4 = Recobra un antiguo c\u00f3dice de Almire
b.p_legion_almire_r4 = Advertencia: Esta es una misi\u00f3n peligrosa! \n\
  \n\
  Desna y sus Soldados Recon son un equipo \u00e9lite que tienen la tarea de recobrar datos de \
  intescolhancia de algunos de los niveles m\u00e1s peligrosos en los Clockworks  Si te unes a \
  ellos te puede llevar a obtener grandes recompensas, pero se garantiza que ser\u00e1 un viaje peligroso!\n\
  \n\
  El Cuartel General Spiral cree que un antiguo c\u00f3dice originado en el reino maldito de \
  Almire est\u00e1 localizado en alg\u00fan lugar de la oscura y terror\u00edfica necr\u00f3\
  polis.  Se cree que esta necr\u00f3polis pulula de todo tipo de monstruosidades y s\u00f3lo \
  los Soldados Recon tienen lo que se necesita para entrar en ella, adquirir los datos de \
  intescolhancia y salir vivos!

