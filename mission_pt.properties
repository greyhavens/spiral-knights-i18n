# Winterfest Danger Mission Event 7,9
#..................................................................................................
m.p_winterfest_danger_r7 = Asalto Grinchlin!
o.p_winterfest_danger_r7 = Los Grinchlins han saboteado Winterfest por \u00faltima vez. Ll\u00e9vales la pelea a ellos!
b.p_winterfest_danger_r7 = Advertencia: Esta es una misi\u00f3n peligrosa!\n\
  \n\
  A nombre de Impostoclaus, el Cuartel General Spiral ha localizado la base de operaciones de \
  los nefarios Grinchlins. Es momento de llevarles la pelea y terminar el terrorismo al \
  Festival de Invierno de una vez por todas. Pero no ser\u00e1 una tarea sencilla.\n\
  \n\
  Aquellos que acepten esta misi\u00f3n deben subir al Monte Krampus, una excursi\u00f3n \
  peligrosa llena de emboscadas Grinchlin y trampas mortales de hielo. Por el camino encontrar\u00e1\
  s refugios que te permitir\u00e1n recoger tesoros Grinchlin y escapar de la monta\u00f1a, o \
  continuar hacia la cima en busca de mayores recompensas! Pero est\u00e1s advertido: los \
  Grinchlins y sus aliados son un grupo de taca\u00f1os y no otorgan NADA de bot\u00edn. Todos \
  los tesoros que se encontrar\u00e1n en el Monte Krampus se encuentra en los refugios. Y si \
  decides dejarlos pasar para buscar mayores recompensas despu\u00e9s, corres el riesgo \
  de perderlo todo si fracasas!\n\
  \n\
  Algunos dicen que en la cima del Monte Krampus se encuentra un alijo de bot\u00edn Grinchlin \
  que puede contener tesoros que nadie nunca ha visto antes...

