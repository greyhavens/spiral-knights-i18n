#Conversations in-mission
#Lost Soul 1
n.apocrea_1 = Alma Perdida
m.apocrea_1_1a = Qu\u00e9 es esto? Otra pobre alma madura para cosecharse por los \
  Apocrea?

r.apocrea_1_1a = Qu\u00e9 es este lugar y de qu\u00e9 hablas?

m.apocrea_1_2a = Tu, viajero curioso, p\u00e1rate en el Nexus de Obsidiana, en el reino de los \
  Apocrea. Es muy probable que nunca m\u00e1s veas la luz del sol.

r.apocrea_1_2a = A qu\u00e9 te refieres? Quienes son los Apocrea?

m.apocrea_1_3a = Los Apocrea est\u00e1n hechos de pesadillas: una terrible legi\u00f3n de \
  fantasmas de otro mundo cuya \u00fanica ambici\u00f3n parece ser la de atrapar y devorar toda \
  la vida de las almas. \n\
  \n\
  Aunque te pudieras aventurar m\u00e1s all\u00e1 de este nexus, sin duda caer\u00e1s en alguna \
  de sus trampas durante la traves\u00eda.

r.apocrea_1_3a = Cu\u00e9ntame acerca estas trampas.

m.apocrea_1_4a = Los Apocrea alteran la realidad, retorciendo el ambiente que invaden y \
  convirti\u00e9ndolo en una trampa. En estas trampas acechan cualquier forma de vida, \
  cosechando sus almas para alg\u00fan prop\u00f3sito inimaginable.

r.apocrea_1_4a = No los dejar\u00e9 llevarme tan f\u00e1cilmente.

m.apocrea_1_5a = No lo entiendes, verdad? Simplemente no tienes la opci\u00f3n.

r.apocrea_1_5a = Terminar conversaci\u00f3n

#Lost Soul 2
m.apocrea_2_1a = Qu\u00e9 es esto? Todav\u00eda tienes tu cuerpo. Tal vez tu puedas \
  ayudarnos.

r.apocrea_2_1a = Qui\u00e9n eres?

m.apocrea_2_2a = Yo soy solo otra alma escondida de la mirada de los Apocrea. Pero me reh\u00fa\
  so a darme por vencido. Hasta que me encuentren har\u00e9 lo posible por salvar otras almas \
  de mi destino.

r.apocrea_2_2a = C\u00f3mo puedo ayudar?

m.apocrea_2_3a = Pronto te encontrar\u00e1s en una de las trampas que han puesto los Apocrea. \
  Si eres lo suficientemente poderoso para escapar, entonces tal vez pudieras salvar algunas de \
  las otras almas perdidas en el camino.

r.apocrea_2_3a = Lo intentar\u00e9. Dime lo que tengo que hacer.

m.apocrea_2_4a = Las almas perdidas atrapadas por los Apocrea est\u00e1n fusionadas a las \
  realidades que ellos han creado. Encuentra las almas perdidas y liberales del yugo de los \
  Apocrea.

r.apocrea_2_4a = Continuar

m.apocrea_2_5a = Una vez liberadas, podr\u00e1s recolectar un sello Apocrean Sigil como prueba \
  de tu haza\u00f1a. Tr\u00e1emelos y mi amigo aqu\u00ed te recompensar\u00e1 con tesoros \
  especiales que he coleccionado durante mi tiempo en este mundo. Puedes usarlos para \
  transmutar raros y poderosos items usando el obelisco de la creaci\u00f3n que est\u00e1 all\u00e1.

r.apocrea_2_5a = Har\u00e9 mi mejor esfuerzo.

m.apocrea_2_6a = Te deseo buena suerte. Viaja raudamente y evita que te agarren.

r.apocrea_2_6a = Terminar conversaci\u00f3n.

