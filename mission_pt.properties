  \n\
  Uno de los escuadrones que est\u00e1n investigando el sitio se ha perdido y se cree que ahora \
  est\u00e1n cautivos en el sitio.\n\
  \n\
  Inf\u00edltrate en la abrasadora Zona en Deconstrucci\u00f3n y rescata a los cavaleiros \
  cautivos. Pero escucha esta advertencia, se dice que el personal de la Zona en Deconstrucci\u00f3\
  n tiene una poderosa seguridad construct escondida en alg\u00fan lugar del sitio.

# RANK 6-2
m.target_acquired = Objetivo Adquirido
