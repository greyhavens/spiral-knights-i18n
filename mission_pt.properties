m.p_tortodrone_r3 = Marcha de los Tortodrones
o.p_tortodrone_r3 = Investiga en la Arboleda Ancestral y det\u00e9n la conspiraci\u00f3n demon\u00edaca.
b.p_tortodrone_r3 = Pedazos de tortodrones ca\u00eddos y pu\u00f1ados de materia oscura han \
  estado apareciendo por los Clockworks, lo que a llevado a que el Cuartel General Spiral crea \
  que los Demonios tienen algo que ver con la desaparici\u00f3n de esos m\u00edticos seres. \
  Para poder descubrir lo que traman los Demonios, necesitas encontrar la manera de abrir uno \
  de sus Portales Siniestros y viajar por el. El Cuartel General Spiral sospecha que los glifos \
  que los Demonios llevan con ellos pueden ser la llave para que puedas abrir el portal.

