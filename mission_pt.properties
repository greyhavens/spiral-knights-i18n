m.reporting_duty = Reportarse para Servicio Activo
o.reporting_duty = Rep\u00f3rtate con el Teniente Feron en la Arcade de Haven
b.reporting_duty = El Teniente Feron es responsable de supervisar la operaci\u00f3n minera de \
  los Clockworks en la Arcade de Haven. Rep\u00f3rtate con el y aprende acerca de la situaci\u00f3n en Haven y la misi\u00f3\
  n del Cuartel General Spiral de llegar al Core de Cradle.


m.reporting_duty_1a = Tanto gusto, soldado. Y un buen trabajo al llegar a nuestro campamento \
  base aqu\u00ed en Haven. Soy el Teniente Feron.  He sido designado por el Capit\u00e1n Ozlo \
  para supervisar nuestra operaci\u00f3n de miner\u00eda en los Clockworks.\n\
  \n\
  Frente a ti se encuentra la Arcade, un fascinante complejo que sirve como enlace al coraz\u00f3\
  n de los Clockworks.  Como veo que eres novo aqu\u00ed, te dar\u00e9 un resumen de lo que el \
  Cuartel General Spiral est\u00e1 haciendo aqu\u00ed.

r.reporting_duty_1a = Ciertamente suena importante. Dime como funciona.

m.reporting_duty_2a = Despu\u00e9s de que el Alondra se estrellara, su principal fuente de \
  Tearium explot\u00f3, destruyendo una porci\u00f3n de la nave y dej\u00e1ndola sin su \
  principal fuente de poder.  Debido a que no hemos encontrado varias toneladas de Tearium \
  tiradas por ah\u00ed, podemos decir que esa ave ha perdido sus alas.\n\
  \n\
  Con la ayuda de los Strangers, hemos podido establecer una peque\u00f1a base operaciones aqu\u00ed \
  en Haven.  Una vez que pusimos en l\u00ednea nuestros sistemas, descubrimos que dentro del \
  coraz\u00f3n de esta roca resuena una se\u00f1al de poder de magnitud sin precedente.

r.reporting_duty_2a = Si tan s\u00f3lo pudi\u00e9ramos dominar ese poder...

m.reporting_duty_3a = Exactamente! El n\u00facleo del Core de los Clockworks bien pudiera \
  contener la fuente de energia que necesitamos para crear una nueva fuente de poder para \
  el Alondra y restaurarlo a su condici\u00f3n operacional. Solamente hay un problema, los \
  mismos Clockworks parecen estar construidos sobre una loca trampa mortal. \n\
  \n\
  Llegar al Core no va a ser sencillo...

r.reporting_duty_3a = Estoy dispuesto para esta tarea!

m.reporting_duty_4a = Ese es el esp\u00edritu que me gusta ver. Contin\u00faa completando \
  misiones para el Cuartel General Spiral conforme te sean asignadas. Con tu ayuda tenemos una \
  oportunidad de llegar al Core y salvar Isora.

r.reporting_duty_4a = Entendido, Teniente.

m.reporting_duty_5a = Entonces ahora te autorizo para tomar Miss\u00f5es de la Arcade.  Puedes \
  ganar acceso a la Arcade desde tu interfaz de Miss\u00f5es o acercarte directamente a los \
  portales que est\u00e1n en la misma Arcade.  Hay un enorme mundo bajo tus pies que est\u00e1 \
  esperando a ser explorado.\n\
  \n\
  Que tengas buena suerte!

r.reporting_duty_5a = Terminar conversaci\u00f3n.

m.go_shopping = Vamos de compras!
o.go_shopping = Visita el Bazar de Haven y descubre lo que tiene para ofrecerte.
b.go_shopping = El Bazar de Haven es el lugar donde se pueden encontrar todo tipo de art\u00ed\
  culos y servicios. Ya sea que est\u00e9s buscando una espada m\u00e1s poderosa o si solo \
  quieres que tu armadura sobresalga en las multitudes, tiene lo que necesitas!

m.go_shopping_1a = Bienvenido al Bazar de Haven! Es un placer conocerte {0}, mi nombre es \
  Bechamel. En vista de que trabajo aqu\u00ed en el Bazar, el Cuartel General Spiral me ha \
  pedido que les muestre a los reci\u00e9n llegados este fabuloso epicentro de comercio y que \
  les diga todo lo que tiene que ofrecer.\n\
  \n\
  Vamos a dar una vuelta r\u00e1pida? Trata de aguantarme el paso, camino r\u00e1pido.

r.go_shopping_1a = Gu\u00edame, Bechamel
#(move to Quillion)

m.go_shopping_2a = Los Strangers como Quillion aqu\u00ed venden armas y armaduras.  Cada uno se \
  especializa en un tipo particular de item, as\u00ed que habla con ellos e investiga \
  lo que llevan. No son muy platicadores, pero tienen nuevas existencias todos los d\u00edas!\n\
  \n\
  S\u00f3lo aseg\u00farate de haber alcanzado el rango apropiado para equipar un item!

r.go_shopping_2a = Los Strangers venden otras cosas aparte de armas y equipo?

m.go_shopping_3a = Me da gusto que hayas preguntado, ciertamente lo hacen!  Vamos a ver a \
  Vatel.

r.go_shopping_3a = (Sigue a Bechamel)
#(move to Vatel)

m.go_shopping_4a = Aqu\u00ed Vatel te vender\u00e1 una selecci\u00f3n de recetas as\u00ed como \
  cambios de color personal y otros items.

r.go_shopping_4a = Recetas?  Para armas y equipo?

m.go_shopping_5a = As\u00ed es, puedes adquirir recetas y materiales para que puedas alquimizar \
  armas y equipo en las m\u00e1quinas de alquimia. Ven, te mostrar\u00e9 una.

r.go_shopping_5a = Entendido.
#(move to alchemy station)

m.go_shopping_6a = Aqu\u00ed tenemos una m\u00e1quina de alquimia y con la que sin duda estar\u00e1\
  s muy familiarizado mientras mejoras tu arsenal. Pero no necesitas preocuparte demasiado por \
  eso ya lo m\u00e1s posible es que el Cuartel General Spiral te de una misi\u00f3n despu\u00e9\
  s que te explique todo eso.\n\
  \n\
  Bueno, esto es suficiente para tu primer tour. Quieres que lo repasemos otra vez o \
  crees que ya lo tienes?

r.go_shopping_6a = Me gustar\u00eda que me dieras el tour otra vez.
r.go_shopping_6b = Creo que me qued\u00f3 claro, Bechamel, gracias!

m.go_shopping_7a = No hay problema, tengo tiempo.  Empecemos desde el principio.

r.go_shopping_7a = (Seguir a Bechamel)
#(starts at Quillion)
m.go_shopping_7b = Excelente! Me da gusto haber podido ayudar a orientarte. Buena suerte, {0}!

r.go_shopping_7b = Gracias Bechamel, nos vemos!

# ----- GO SHOPPING B-TEST -----------------------------------------
m.go_shopping_b = Problemas en el Bazar
o.go_shopping_b = Ayuda a un cavaleiro en problemas.
b.go_shopping_b = El Bazar de Haven es un lugar donde se puede encontrar todo tipo de bienes y \
  servicios. Sin embargo, parece haber alg\u00fan tipo de conmoci\u00f3n justo afuera del \
  normalmente bullicioso mercado. Parece que no hay tiempo que perder, se est\u00e1 armando un l\u00edo!

m.go_shopping_b_1a = Guau, me da gusto que hayas llegado cuando lo hiciste. Esos problem\u00e1\
  ticos gremlins iban a destruir todo! El bazar se hubiera arruinado!\n\
  \n\
  Oh cierto, d\u00f3nde est\u00e1n mis modales? Mi nombre es Tylen, es un placer \
  conocerte, {0}.

r.go_shopping_b_1a = Est\u00e1 todo bien, Tylen?

m.go_shopping_b_2a = Ahora si est\u00e1. Iba en camino al bazar a dejar algunos suprimentos \
  cuando esos gremlins me emboscaron. Pens\u00e9 que eran de Emberlight, una colonia de \
  gremlins marginados, pero al parecer estaba equivocado.\n\
  \n\
  S\u00f3lo para sentirme seguro, me podr\u00edas ayudar a llevar estos items al bazar?

r.go_shopping_b_2a = Claro que si, vamos al bazar.

m.go_shopping_b_3a = Guau, eso fue mucho m\u00e1s r\u00e1pido con tu ayuda, {0}. Escucha, si \
  alguna vez necesitas un tour guiado por el bazar, solo ven a hablar conmigo. Te puedo decir \
  cualquier cosa que necesites saber acerca de las tiendas y servicios que hay aqu\u00ed.\n\
  \n\
  Ve a mirar por ah\u00ed! Estoy seguro que encontrar\u00e1s bastantes items interesantes. Gracias otra vez!

r.go_shopping_b_3a = Terminar conversaci\u00f3n

m.pumping_up = Prepar\u00e1ndote
o.pumping_up = Visita el Sal\u00f3n de Entrenamiento Avanzado y aprende \u00fatiles t\u00e9cnicas nuevas
b.pumping_up = Puedes usar el Sal\u00f3n de Entrenamiento Avanzado las veces que quieras para \
  que puedas practicar con nuevas armas o aprender acerca de otras caracter\u00edsticas \u00fa\
  nicas de los Clockworks. \u00c9chale un vistazo y ve lo que tiene para ofrecerte!

# Show image of training hall entrance
m.pumping_up_1a = Saludos {0}. Me llamo Konway. El Cuartel General Spiral dice que necesitas \
  unos consejos adicionales para ayudarte en las misiones por venir.\n\
  \n\
  Quieres encontrarme en el Sal\u00f3n de Entrenamiento Avanzado para ponerte al d\u00eda?

r.pumping_up_1a = Seguro, Konway. Voy para all\u00e1.

m.pumping_up_2a = Bienvenido al Sal\u00f3n de Entrenamiento Avanzado, {0}. Aqu\u00ed encontrar\u00e1s \u00fa\
  tiles consejos de supervivencia para ayudarte en tu traves\u00eda por los Clockworks.\n\
  \n\
  Quieres un tour de las instalaciones?

r.pumping_up_2a = Muy bien. [Seguir a Konway]
r.pumping_up_2b = No gracias, vagar\u00e9 por mi cuenta.

m.pumping_up_3a = Ac\u00e1 tenemos una colecci\u00f3n de valiosos items y objetos que \
  seguramente encontrar\u00e1s en los Clockworks.

r.pumping_up_3a = Continuar

m.pumping_up_4a = Algunos items se pueden usar para atacar monstruos, como estos \
  viales. Puedes practicar a levantarlos y tirarlos en este campo de objetivos.

r.pumping_up_4a = Continuar

m.pumping_up_5a = A lo largo de esta pared al norte tenemos todo tipo de bloques, \
  interruptores, puertas y botones de los Clockworks. Si deseas derrotar a los tortuosos y \
  mortales mecanismos all\u00e1 abajo, entonces te sugiero que te familiarices con la \
  manera como estos funcionan!

r.pumping_up_5a = Continuar

m.pumping_up_6a = En la zona al este tenemos un par de habitaciones para practicar el combate. \
  Estos Cubos de Entrenamiento son pr\u00e1cticamente inofensivos y son perfectos para \
  experimentar con tus t\u00e9cnicas de armas y escudo!

r.pumping_up_6a = Continuar

m.pumping_up_7a = Por \u00faltimo, tenemos la trampa y los cuartos de peligro. Puedes venir aqu\u00ed \
  para ver como puedes afectar las trampas algunas veces y tambi\u00e9n aprender acerca de las \
  trampas que infligen diferentes tipos de da\u00f1o.

r.pumping_up_7a = Continuar

m.pumping_up_8a = Pues bien, este es el final del tour, {0}. Quieres que lo repasemos \
  otra vez o est\u00e1s listo para intentar todo por tu cuenta?

r.pumping_up_8a = Repasemos todo otra vez. [Reiniciar el tour]
r.pumping_up_8b = No, gracias. Estoy listo para irme.

m.pumping_up_9a = Muy bien, empecemos desde el principio.

# Show image of training hall entrance
m.pumping_up_9b = Excelente, entonces te dar\u00e9 el cr\u00e9dito por esta misi\u00f3n.\n\
  \n\
  Recuerda, si deseas regresar por m\u00e1s entrenamiento, el Sal\u00f3n de Entrenamiento \
  Avanzado est\u00e1 ubicado en la Plaza del Pueblo de Haven. Ten cuidado all\u00e1 afuera, {0}.

r.pumping_up_9a = Continuar
r.pumping_up_9b = Gracias! Me voy a entrenar. [Concluir misi\u00f3n]

