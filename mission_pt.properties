m.p_r7_min = Investigaci\u00f3n Geol\u00f3gica
o.p_r7_min = Entrega los materiales solicitados por el Cuartel General Spiral para su \
  investigaci\u00f3n.
b.p_r7_min = El Cavaleiro Geo en Jefe Wegner siempre est\u00e1 buscando avanzar su investigaci\u00f3\
  n de los misteriosos minerales que se encuentran en los Clockworks. Los experimentos que \
  conduce en estas muestras generalmente resultan en su desintegraci\u00f3n. Debido a esto \
  siempre necesita de valientes cavaleiros que indaguen en los Clockworks para conseguirle m\u00e1s muestras.

m.p_r7_weap_3 = Apropiaci\u00f3n de Armas
o.p_r7_weap_3 = Entrega el item solicitado al escuadr\u00f3n necesitado.
b.p_r7_weap_3 = Los cavaleiros que han sido rescatados de los gremlins con frecuencia se quedan \
  sin otra cosa que mostrar por su cautiverio que las malas memorias de haber estado encerrado \
  en una jaula y de ser objeto de las burlas de sus captores.  Sus armas siempre son robadas y \
  su equipo queda da\u00f1ado por los ingenieros gremlin para evitar cualquier idea de \
  supervivencia en caso de intentar escapar.  \n\
  \n\
  El Cuartel General Spiral necesita que otros cavaleiros con acceso a amplios recursos den una \
  mano y proporcionen las armas y equipo necesarios para que estos cavaleiros puedan regresar a \
  sus escuadrones listos para la batalla.

m.p_r7_weap_4 = Apropiaci\u00f3n de Armas
o.p_r7_weap_4 = Entrega el item solicitado al escuadr\u00f3n necesitado.
b.p_r7_weap_4 = Los cavaleiros que han sido rescatados de los gremlins con frecuencia se quedan \
  sin otra cosa que mostrar por su cautiverio que las malas memorias de haber estado encerrado \
  en una jaula y de ser objeto de las burlas de sus captores.  Sus armas siempre son robadas y \
  su equipo queda da\u00f1ado por los ingenieros gremlin para evitar cualquier idea de \
  supervivencia en caso de intentar escapar.  \n\
  \n\
  El Cuartel General Spiral necesita que otros cavaleiros con acceso a amplios recursos den una \
  mano y proporcionen las armas y equipo necesarios para que estos cavaleiros puedan regresar a \
  sus escuadrones listos para la batalla.

m.p_r7_gate_beast = Naturaleza de la Bestia
o.p_r7_gate_beast = Rescata a los Cavaleiros Geo de las garras de las bestias salvajes!
b.p_r7_gate_beast = Nuestros Cavaleiros Geo arriesgan sus vidas trabajando en la parte agreste \
  de los Clockworks. Aunque sus hallazgos son invaluables, con frecuencia se encuentran en \
  territorio wolver. Estas bestias salvajes acechan implacablemente a los Cavaleiros Geo, \
  secuestr\u00e1ndolos en la noche cuando bajan la guardia. Algunas veces, los wolvers forman \
  una manada y asaltan equipos de investigaci\u00f3n completos. Es durante esos momentos que se \
  llama a un talentoso escuadr\u00f3n para que vaya a salvarlos.

m.p_r7_gate_slime = Una Pizca de Sal
o.p_r7_gate_slime = Entrega un cargamento de sal de roca al equipo de investigaci\u00f3n que se \
  encuentra en los Lares de Lichens!
b.p_r7_gate_slime = La mejor manera de mantener a raya a los slimes es con grandes cantidades \
  de sal de roca, Los slime odian eso ya que cuando lo tocan se disuelven. No es nada bonito.  \n\
  \n\
  Los equipos de investigaci\u00f3n que se encuentran en los lares de lichen frecuentemente \
  rodean completamente su campamento con sal de roca para no terminar como la cena de alg\u00fan slime. Como podr\u00e1\
  s imaginar, se acaban esa cosa r\u00e1pido. Cuando les queda poca, se llama a un escuadr\u00f3\
  n a pelear su camino hasta llegar al campamento para entregar el sazonador salva vidas.

m.p_r7_gate_construct = Asalto a la Sala de M\u00e1quinas 13
o.p_r7_gate_construct = Destruye las m\u00e1quinas de guerra operacionales dentro de la f\u00e1brica en ruinas!
b.p_r7_gate_construct = Los gremlins no son muy buenos para limpiar su cochinero. Nuestros \
  cavaleiros Recon muchas veces se tropiezan con lo que creen que son f\u00e1bricas gremlin \
  fuera de servicio que todav\u00eda est\u00e1n pululando con constructs hostiles y en algunos casos todav\u00eda almacenan m\u00e1\
  quinas de guerra operacionales!  \n\
  \n\
  El Cuartel General Spiral ha ordenando que cuando sea posible, se cierren para siempre estas \
  f\u00e1bricas y sus m\u00e1quinas de guerra para evitar futuras bajas.

m.p_r7_gate_gremlin = Atraco Peligroso
o.p_r7_gate_gremlin = Roba los esquem\u00e1ticos del sitio de construcci\u00f3n gremlin!
b.p_r7_gate_gremlin = Los sitios de construcci\u00f3n gremlin con frecuencia contienen valiosas \
  esquem\u00e1ticas de estructuras y armas gremlin. Una vez que el Cuartel General Spiral las \
  obtiene, proporcionan una rara comprensi\u00f3n de la ingenier\u00eda gremlin.  \n\
  \n\
  Las esquem\u00e1ticas gremlin generalmente est\u00e1n guardadas en terminales en alg\u00fan \
  lugar del sitio. Estas terminales est\u00e1n cerradas y fuertemente custodiadas. Una vez que \
  llames la atenci\u00f3n de un gremlin, espera que el escuadr\u00f3n entero vaya tras de \
  ti!

m.p_r7_gate_fiend = Cautivos de Collar Blanco
o.p_r7_gate_fiend = Libera a los cavaleiros cautivos en la prisi\u00f3n corporativa fiendish!
b.p_r7_gate_fiend = Una ciudad fiendish es un extra\u00f1o lugar que el Cuartel General Spiral \
  no entiende completamente. Hay devilites por todos lados, y si hay alguno de sus Pit Boss en \
  las cercan\u00edas, har\u00e1n lo posible para verse como que son productivos. \
  Lamentablemente, la productividad es definida por el ataque o el encarcelamiento de los \
  intrusos, como un escuadr\u00f3n de cavaleiros que pase por ah\u00ed.  \n\
  \n\
  No es claro cual es el prop\u00f3sito que sirven los cavaleiros encarcelados en la agenda de \
  los devilite. Aquellos que han sobrevivido a su captura han reportado que las condiciones son \
  bajas, pero lo peor eran las enormes cantidades de papeleo que deb\u00edan concluir \
  diariamente. Esta es una suerte que ning\u00fan cavaleiro se merece!

m.p_r7_gate_undead = Miedo Atroz
o.p_r7_gate_undead = Salva al cavaleiro perdido y evita que se una a los rangos de los \
  muertos en el castillo hechizado!
b.p_r7_gate_undead = Las ruinas de los castillos Owlite son lugares oscuros y malditos que est\u00e1\
  n pululando de legiones de spookats. Lo peor de estos, los aparentemente invencibles \
  grimalkins, merodean constante,ente en las sombras, esperando el momento en que tu luz \
  salvadora finalmente se apague.  \n\
  \n\
  Algunos cavaleiros sucumben a la oscuridad y se paralizan de miedo en estos sombr\u00edos reinos. Lo \u00fa\
  nico que los puede salvar son los valientes cavaleiros que hace mucho perdieron sus miedos \
  infantiles a la oscuridad y a todas las terribles criaturas que acechan dentro.

# RANK 9

m.p_r9_kit = Entrega de Suministros
o.p_r9_kit = Re\u00fane suprimentos para entregar a los cavaleiros que se encuentran en \
  Emberlight.
b.p_r9_kit = Algunos cavaleiros son parte de los equipos de investigaci\u00f3n que raramente \
  tienen la oportunidad de quedarse en la superficie por mucho tiempo. Estos cavaleiros \
  generalmente usan los pueblos subterr\u00e1neos de los Clockworks como campamentos. Aunque \
  los monstruos que manejan estos pueblos son amistosos, muchas veces los servicios no son \
  adecuados para los cavaleiros.\n\
  \n\
  Estos cavaleiros siempre pueden usar esos suprimentos para mantenerse un poco m\u00e1s c\u00f3modos. \
  Un investigador feliz es un investigador productivo!

