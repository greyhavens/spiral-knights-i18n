e.operation_crimson_hammer = Operaci\u00f3n Crimson Hammer

m.operation_crimson_hammer_1 = Operaci\u00f3n Crimson Hammer
o.operation_crimson_hammer_1 = \u00danete al Teniente Feron en un asalto al Gran Arsenal del \
  Warmaster Seerus.
b.operation_crimson_hammer_1 = El Warmaster Seerus es el amo y se\u00f1or de los gremlins de la \
  Orden Crimson.  Se piensa que es el cerebro detr\u00e1s de los Gemelos Roarmulus y otras \
  incontables armas gremlin, es el creador de la Orden Crimson y el proveedor de sus diab\u00f3licas m\u00e1quinas de guerra.\n\
  \n\
  Los Cavaleiros Recon bajo el mando del Teniente Feron descubrieron recientemente el 'Gran \
  Arsenal' de Seerus; su centro de desarrollo y almacenes para todo su armamento.  Ahora, Feron \
  mismo est\u00e1 guiando a varios escuadrones de cavaleiros directamente al Gran Arsenal, con \
  la intenci\u00f3n de eliminar a Seerus y destruir sus m\u00e1quinas de guerra.\n\
  \n\
  Habiendo encontrado una gran resistencia, los escuadrones de Feron requieren de refuerzos y \
  el Cuartel General Spiral te est\u00e1 enviando a ti para ayudarlos.

m.operation_crimson_hammer_2 = Operaci\u00f3n Crimson Hammer
o.operation_crimson_hammer_2 = \u00danete al Teniente Feron en un asalto al Gran Arsenal del \
  Warmaster Seerus.
b.operation_crimson_hammer_2 = El Warmaster Seerus es el amo y se\u00f1or de los gremlins de la \
  Orden Crimson.  Se piensa que es el cerebro detr\u00e1s de los Gemelos Roarmulus y otras \
  incontables armas gremlin, el es el creador de la Orden Crimson y el proveedor de sus diab\u00f3licas m\u00e1quinas de guerra.\n\
  \n\
  Los Cavaleiros Recon bajo el mando del Teniente Feron descubrieron recientemente el 'Gran \
  Arsenal' de Seerus; su centro de desarrollo y almacenes para todo su armamento.  Ahora, Feron \
  mismo est\u00e1 guiando a varios escuadrones de cavaleiros directamente al Gran Arsenal, con \
  la intenci\u00f3n de eliminar a Seerus y destruir sus m\u00e1quinas de guerra.\n\
