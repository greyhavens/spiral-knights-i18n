n.winterfest_danger = Cavaleiro Tenzhill
m.winterfest_danger_1a = Salutaciones! Debes ser el valiente cavaleiro que el Cuartel \
  General Spiral ha enviado para lidiar con estos Grinchlins. El Monte Krampus no es como otros \
  niveles, as\u00ed que permite que te explique como funciona.

r.winterfest_danger_1a = Necesito toda la ayuda que me puedan dar, dime todo lo que sepas.
r.winterfest_danger_1b = No tengo tiempo de platicar.

m.winterfest_danger_2a = El Monte Krampus es el hogar de la facci\u00f3n Grinchlin y sus \
  aliados. Son un grupo muy taca\u00f1o y ellos no otorgan nada de bot\u00edn. Todos sus tesoros est\u00e1\
  n guardados en los refugios que encontrar\u00e1s arriba en la monta\u00f1a.

r.winterfest_danger_2a = Continuar

m.winterfest_danger_3a = Estos refugios te ofrecen dos opciones: salir de la monta\u00f1a y \
  reclamar algo del tesoro Grinchlin, o seguir hacia arriba en la monta\u00f1a.\n\
  \n\
  Si decides seguir, dejar\u00e1s pasar el bot\u00edn en ese refugio, pero encontrar\u00e1s a\u00fan m\u00e1\
  s tesoros en el siguiente refugio.

r.winterfest_danger_3a = Continuar

m.winterfest_danger_4a = El Monte Grinchlin es un ambiente opresivo y pocos cavaleiros \
  probablemente tendr\u00e1n la fortaleza para alcanzar la cima. Si sientes que las cosas se \
  ponen muy duras, toma la salida! De otra manera corres el riesgo de perderlo \
  todo!

r.winterfest_danger_4a = Entiendo.

m.winterfest_danger_5a = Te deseo buena suerte. Y trata de mantenerte abrigado!

r.winterfest_danger_5a = Terminar conversaci\u00f3n

