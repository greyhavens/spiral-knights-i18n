  \n\
  Debes prepararte antes de tomar cada misi\u00f3n.

r.best_of_beast_2a = Entiendo que las pr\u00f3ximas misiones me enfrentar\u00e1n a monstruos \
  bestia y viscoso.

m.best_of_beast_3a = Si llegaras a encontrarte enfrentando monstruos bestia y viscoso en el \
  Tier 3, recuerda que son capaces de infligir da\u00f1o de perforaci\u00f3n puro.  Solamente \
  el mejor equipo resistente a la perforaci\u00f3n puede mantenerte vivo al enfrentar a estos \
  poderosos y perforantes predadores.\n\
  \n\
  Hablaremos otra vez ya que hayas completado tus pr\u00f3ximas misiones. Buena suerte, {0}.

r.best_of_beast_3a = Entendido, Hahn. Hablamos pronto.

m.in_cold_blood = A Sangre Fr\u00eda
o.in_cold_blood = Evita que el escuadr\u00f3n perdido se convierta en la cena de una letal \
  lagartija.
b.in_cold_blood = Algo ha irritado bastante a los chromalisks en los niveles bajo Emberlight. \
  El Cuartel General Spiral ha enviado un escuadr\u00f3n a investigar y r\u00e1pidamente se \
  salieron del radar. Ahora han enviado una se\u00f1al de auxilio informando que chromalisks de \
  todos tipos los tienen arrinconados en la profundidad 21.\n\
  \n\
  Los Biotechs especulan que estos chromalisks est\u00e1n agitados debido a su proximidad con \
  el Core. Los otros creen que es la temporada de apareo. Sin importar cu\u00e1l sea la raz\u00f3n, \
  se necesita rescatar al escuadr\u00f3n antes de que encuentren su final con tipos como estas \
  lagartijas!

m.vicious_viscous = Vicioso y Viscoso
o.vicious_viscous = Pon a prueba tu valor contra una legi\u00f3n de poderosos monstruos de \
  perforaci\u00f3n
b.vicious_viscous = El Cuartel General Spiral quisiera que investigaras los niveles de los \
  Clockworks donde los m\u00e1s poderosos monstruos viscosos y bestia residen. Al tu ir \
  explorar estos niveles y transferir tus datos de combate al Cuartel General Spiral todos los \
  cavaleiros se beneficiar\u00edan de tu peligrosa experiencia.\n\
  \n\
  Se recomienda que te equipes con armaduras resistentes a la perforaci\u00f3n y armas \
  que inflijan da\u00f1o de perforaci\u00f3n y de sombra!

m.monstrous_research_6 = Investigaci\u00f3n Monstruosa
o.monstrous_research_6 = Entrega los materiales de investigaci\u00f3n solicitados por el \
  Cuartel General Spiral
b.monstrous_research_6 = Despu\u00e9s de haberse enfrentado a las fauces de los m\u00e1s \
  feroces wolvers, de evitar las p\u00faas de los jelly cubes completamente evolucionados y \
  todav\u00eda m\u00e1s, el vil regurgitar de los virulisks, sin duda has recolectado muestras \
  de estos encuentros que podr\u00edan ser de gran uso para los equipos de investigaci\u00f3n \
  del Cuartel General Spiral.

# RANK 7-3
m.creators_and_created = Creadores y Creados
o.creators_and_created = Aprende m\u00e1s acerca de los m\u00e1s poderosos monstruos \
  Constructor y Gremlin
b.creators_and_created = Para que puedas estar completamente preparado para los retos frente a \
  ti, el Jefe Biotech Hahn ha solicitado que lo contactes antes de emprender las nuevas \
  misiones que est\u00e1n disponibles para ti.

m.creators_and_created_1a = Saludos {0}, parece que no tuviste muchos problemas con las \
  sudorosas hordas, lo que sin duda se debe a una buena educaci\u00f3n en su comportamiento \
  antes de la misi\u00f3n.

r.creators_and_created_1a = Eso y un arsenal s\u00f3lido.

m.creators_and_created_2a = El poder de fuego solo te puede llevar hasta cierto punto, {0}. \
  Como ejemplo. los gremlins sin duda son fuertes por si mismos, tan numerosos que son y todo, \
  pero estos peque\u00f1os y peludos genios buscaron reforzar su fuerza creando un ej\u00e9rcito de constructores.

r.creators_and_created_2a = Entonces todos los constructores en los Clockworks son creaci\u00f3n gremlin?

m.creators_and_created_3a = No todos, pero se cree que la mayor\u00eda han sido manufacturados \
  directamente de dise\u00f1o gremlin, si. Pensamos que la mayor\u00eda fueron dise\u00f1ados \
  originalmente cuando se construyeron los Clockworks.  \n\
  \n\
  Algunos todav\u00eda permanecen bajo control gremlin, pero otros se han ido fuera de control \
  y el resto se ha convertido en algo completamente diferente.

r.creators_and_created_3a = Qu\u00e9 quieres decir?

m.creators_and_created_4a = Hemos tenido algunos casos en que los cavaleiros se han encontrado \
  con constructoress no hostiles y de los que afirman que se comportaban como criaturas que \
  tienen consciencia. Pero esto es muy dif\u00edcil de creer.  Los gremlins son brillantes, \
  pero brillante en lo que logra que se haga el trabajo y poco m\u00e1s.  Fuerza bruta.\n\
  \n\
  Vida artificial? Bueno, eso es algo completamente diferente.

r.creators_and_created_4a = Hablemos de los hostiles que probablemente encuentre.

m.creators_and_created_5a = Muy bien.  El Cuartel general Spiral me ha informado que \
  probablemente estar\u00e1s enfrentando hordas de gremlins y constructores en la pr\u00f3xima ronda. \n\
  \n\
  Toma en cuenta que en el Tier 3, estos monstruos infligen da\u00f1o elemental puro.  Aseg\u00fa\
  rate de equiparte adecuadamente.

r.creators_and_created_5a = Lo har\u00e9 Hahn, gracias.

m.beyond_axes_of_evil = M\u00e1s All\u00e1 de las Hachas del Mal
o.beyond_axes_of_evil = Aplasta la nueva operaci\u00f3n maderera gremlin en el Valle del \
  Acertijo
b.beyond_axes_of_evil = A pesar de tus esfuerzos anteriores, los gremlins han reformado su \
  operaci\u00f3n maderera en el Valle del Acertijo para poder pertrechar sus plantas de \
  municiones. Dados los resultados de su \u00faltimo proyecto, los Gemelos Roarmulus, el \
  Cuartel General Spiral quiere que tu termines con su ecodestrucci\u00f3n antes de que \
  se convierta en algo m\u00e1s serio!

m.spark_roar = Chispa y Rugido
o.spark_roar = Pon a prueba tu valor contra una legi\u00f3n de monstruos elementales \u00e9lite
b.spark_roar = Una excepcionalmente alta concentraci\u00f3n de constructores se han encontrado \
  resguardando un \u00e1rea de los Clockworks de la que el Cuartel General sospecha podr\u00eda \
  ser un escondrijo de la Orden Crimson. A diferencia de otros monstruos, los constructores no \
  son capaces de reproducirse por si mismos, lo que significa que cada vez que uno se destruye, \
  habr\u00e1 una mella permanente en sus n\u00fameros. Es una tarea que vale la pena, \
  independientemente de la influencia de la Orden Crimson que pudiera haber o no.\n\
  \n\
  El Cuartel General Spiral solicita que entres a estos niveles y investigues el posible \
  escondrijo y elimines la amenaza de los constructores.\n\
  \n\
  Se recomienda que te equipes con armadura resistente al da\u00f1o elemental y armas que \
  inflijan da\u00f1o elemental y de sombra!

m.cryptic_coder_spark_roar = La Ley de Hierro es Inservible! \n\
  La Orden Crimson es Falsa! \n\
  Los Nueve est\u00e1n ciegos, no pueden ver la Verdad subyacente. \n\
  Los Nueve est\u00e1n sordos, no pueden escuchar la Resonancia que late dentro de este mundo.\n\
  \n\
  Herex ya no sirve como uno de los Nueve. \n\
  S\u00f3lo Herex ve y escucha la Verdad. S\u00f3lo Herex prevalecer\u00e1. \n\
  Sigan a Herex y ser\u00e1n salvados.

m.monstrous_research_7 = Investigaci\u00f3n Monstruosa
o.monstrous_research_7 = Entrega los materiales de investigaci\u00f3n solicitados por el \
  Cuartel General Spiral
b.monstrous_research_7 = Despu\u00e9s de haber peleado contra los gremlins \u00e9lite del \
  Darkfang Clan, evadido los aplastantes golpes de los lumbers y resistido las explosiones \u00f3\
  pticas de los retrodes, sin duda has recolectado muestras que podr\u00edan ser de gran uso \
  para los equipos de investigaci\u00f3n del Cuartel General Spiral.

# RANK 8-1
m.darkest_forces = Fuerzas M\u00e1s Oscuras
o.darkest_forces = Aprende acerca de los m\u00e1s poderosos monstruos muertos vivientes y \
  demonios.
b.darkest_forces = Al escuchar que tus pr\u00f3ximas misiones te enfrenten a los monstruos \
  demonios y muertos vivientes en las profundidades del Tier 3, el Biotech Hahn ha solicitado \
  que lo contactes antes de desplegarte a tus \u00faltimas misiones.

m.darkest_forces_1a = {0}, veo que todav\u00eda te mantienes de una pieza que que has ganado ni \
  m\u00e1s ni menos que el rango de Defensor de Elite.  Bravo.\n\
  \n\
  Tuve la oportunidad de analizar los datos de combate de tu \u00faltima misi\u00f3n y son \
  bastante interesantes. Los mecha knights en particular parecen estar reaccionando a tus \
  ataques como si estuvieran improvisando.. Pero no lo puedo afirmar todav\u00eda.\n\
  \n\
  En todo caso, eso no es relevante a los datos que estoy presentando hoy.

r.darkest_forces_1a = Si, mis pr\u00f3ximas misiones me enfrentar\u00e1n a fiends y undead. \
  Suena divertido.

m.darkest_forces_2a = Si ese es el caso, tienes una extra\u00f1a definici\u00f3n de los que es diversi\u00f3\
  n.  Los fiends y undead del nivel 3 no son algo sobre lo que podamos estornudar, de hecho, \
  est\u00e1n entre las peores criaturas que encontrar\u00e1s tan cerca del Core.\n\
  \n\
  La gerencia Devilite parece se la peor a estas profundidades y eso da como resultado algunos \
  devilites muy violentos.

r.darkest_forces_2a = No eran exactamente de buen trato para empezar...

m.darkest_forces_3a = Exactamente, y est\u00e1n peor ahora.  Y lo mismo va para los undead.  \
  Encontrar\u00e1s que los howlitzres son particularmente molestos cuando tienen capacidad \
  mejorada para disparos y darle al blanco.\n\
  \n\
  Por \u00faltimo, prep\u00e1rate para enfrentar monstruos fiend y undead que potencialmente \
  infligen da\u00f1o de sombra puro. Como siempre, elije el equipo correcto para el trabajo si \
  quieres vivir lo suficiente para saber escucharme de novo.

r.darkest_forces_3a = Bueno, ciertamente no me quiero perder de eso.

m.darkest_forces_4a = Si, no puedo pensar en una mayor tragedia.  Buena suerte, {0}.

r.darkest_forces_4a = Terminar conversaci\u00f3n.

m.return_of_ur = El Regreso de Ur
o.return_of_ur = Det\u00e9n a los devilites antes de que convoquen un ej\u00e9rcito de \
  guerreros trojan de pesadilla
b.return_of_ur = Un escuadr\u00f3n de reconocimiento ha reportado que en lo profundo de una \
  ciudad demon\u00edaca, los devilites est\u00e1n intentando convocar una legi\u00f3n de \
  poderosos guerreros troyanos. Basados en datos de intescolhancia de un memor\u00e1ndum interno \
  devilite, los troyanos son conocidos como la 'Legi\u00f3n de Ur' y se dice que una vez eran \
  miles de ellos. Extra\u00f1amente, el memor\u00e1ndum indicaba que la Legi\u00f3n de Ur \
  estaba sellada en el Underworld y que se requiere de un enfoque alterno para hacerlos \
  regresar.\n\
  \n\
  Lo que sea que signifique que los devilites intenten usar para regresar unos cuantos miles de \
  troyanos a los Clockworks debe ser detenido. Inf\u00edltrate en su ciudad y det\u00e9n al ej\u00e9\
  rcito de demonios antes de que sean imparables!

m.weight_of_darkness = El Peso de la Oscuridad
o.weight_of_darkness = Prueba tu valor contra una legi\u00f3n de monstruos de sombra supremos.
b.weight_of_darkness = Se especula que todos los demonios dentro de los Clockworks cruzaron \
  desde una dimensi\u00f3n conocida como Underworld.  Aunque la manera como cruzaron y sus \
  motivos para llegar a Cradle no son claros. Los datos de intescolhancia obtenidos en las \
  ciudades de demonios indican que est\u00e1n atrapados en Cradle, a igual que nosotros.\n\
  \n\
  Por otra parte, los undead son un misterio.  No se sabe porqu\u00e9 los esp\u00edritus \
  regresan al reino material, aunque es claro que muchos de los esp\u00edritus dentro de los \
  Clockworks han llegado de otros mundos.  Debido a lo hostiles que pueden ser estas criaturas, \
  la \u00fanica manera de obtener datos \u00fatiles es por medio de interacci\u00f3n directa, \
  como el combate.\n\
  \n\
  El Cuartel General Spiral solicita que obtengas datos de combate de los poderosos monstruos \
  fiend y undead en el Tier 3 de los Clockworks para poder entender mejor la naturaleza de \
  estas criaturas.\n\
  \n\
  Se recomienda que te equipes con armadura resistente a la sombra y con armas que \
  inflijan da\u00f1o de perforaci\u00f3n!

m.monstrous_research_8 = Investigaci\u00f3n Monstruosa
o.monstrous_research_8 = Entrega los materiales de investigaci\u00f3n solicitados por el \
  Cuartel General Spiral
b.monstrous_research_8 = Despu\u00e9s de haber convertido en polvo a los m\u00e1s terror\u00ed\
  ficos zombies, escapado de las fr\u00edas fauces de los grimalkins y siendo victorioso en la \
  batalla contra un ej\u00e9rcito de trojans, sin duda has recolectado muestras de estros \
  encuentros que podr\u00edan ser de gran uso para los equipos de investigaci\u00f3n del \
  Cuartel General Spiral.

# RANK 8-2
m.becoming_champion = Convirti\u00e9ndose en Campe\u00e3o
o.becoming_champion = Habla con el Teniente Feron v\u00eda Comlink.
b.becoming_champion = Despu\u00e9s de haber escuchado acerca de tus muchos logros y las \
  exitosas misiones que has completado para el Cuartel General Spiral, el Teniente Feron desea \
  hablar contigo.

m.becoming_champion_1a = Tanto gusto {0}, ha pasado alg\u00fan tiempo desde que te encontr\u00e9 \
  por primera vez cuando estabas reci\u00e9n llegado del Campamento de Rescate. Has avanzado un \
  gran camino desde entonces, elev\u00e1ndote al rango de Defensor de Elite ni mas ni menos. \n\
  \n\
  Eres un soldado privilegiado, {0}. No tengo dudas de que pronto ser\u00e1s Campe\u00e3o entre \
  los Cavaleiros Spiral y ser\u00e1s instrumental en resolver el gran misterio que es el Core, \
  restaurando el Alondra y regresando a casa. \n\
  \n\
  Has probado que tienes lo que se necesita para enfrentarte a legiones de fuerzas oscuras que \
  acechan bajo la superficie.

r.becoming_champion_1a = Pelear\u00e9 hasta el final, Teniente. S\u00e9 lo que est\u00e1 en juego.

m.becoming_champion_2a = He escuchado que el Cuartel General Spiral te ha preparado unas \
  misiones dignas de un verdadero Campe\u00e3o. Pero para poder convertirte en uno, necesitas \
  el equipamiento correcto.\n\
  \n\
  Te estoy confiando las herramientas que necesitas para convertirte en ese Campe\u00e3o. Con \
  estas recetas, puedes transmutar el equipo de m\u00e1s alto calibre de la Orden Spiral. \
  Finalmente podr\u00e1s vestir la armadura del Azure Guardian, blandir la poderosa espada \
  Leviathan Blade y enfrentar cualquier cosa con la protecci\u00f3n del Aegis.

r.becoming_champion_2a = Me siento honrado, Teniente.

m.becoming_champion_3a = Entonces \u00fasalas con honor y permite que te protejan de la furia \
  de los incontables enemigos que pronto enfrentar\u00e1s. \n\
  \n\
  El Core que buscamos tiene algo realmente espantoso. Se que tal vez sea lo que nos lleve a \
  casa, pero no puedo dejar de sentir que estamos pensando en el de la manera equivocada.

r.becoming_champion_3a = Qu\u00e9 quieres decir?

m.becoming_champion_4a = Lo que quiero decir es que el Core no es una gran bater\u00eda que \
  este mundo funcione, sino que junto con el mundo es una prisi\u00f3n masiva dise\u00f1ada \
  para evitar que se vayan de el alguna vez.\n\
  \n\
  Piensa en nuestros geoesc\u00e1ners de Cradle justo antes de estrellarnos- muestran que est\u00e1 \
  compuesto de cientos de gigantescas losas de otros mundos, casi como placas de blindaje. \
  Despu\u00e9s tienes los Clockworks, la cosa m\u00e1s antinatural que he visto jam\u00e1s. Un mundo entero cuyo \u00fanico prop\u00f3\
  sito parece ser el de evitar que alguien llegue alguna vez al Core.

r.becoming_champion_4a = Creo que tienes algo importante ah\u00ed, Teniente.

m.becoming_champion_5a = He estado hablando con el Cuartel General Spiral acerca de esto y est\u00e1\
  n preparados para investigar m\u00e1s. Aunque no pienso que vayan a cambiar de opini\u00f3n \
  acerca de intentar abrir el Core en el futuro cercano. Eso todav\u00eda es la prioridad n\u00famero uno.\n\
  \n\
  Todo lo que puedo decir es que tengas cuidado all\u00e1, {0}. Creo que este mundo nos tiene m\u00e1s sorpresas reservadas.

r.becoming_champion_5a = Entendido

m.vile_engine = El Vil Motor
o.vile_engine = Localiza y destruye los estramb\u00f3ticos generadores bajo la colonia lichen.
b.vile_engine = En alg\u00fan lugar bajo el nivel en que los lichens habitan se encuentra una \
  extra\u00f1a instalaci\u00f3n de origen desconocido que parece ser usada para la producci\u00f3n de monstruos t\u00f3\
  xicos viscosos. Los 'generadores de viscoso' son capaces de producir r\u00e1pidamente \
  monstruos viscosos que inmediatamente pueblan los niveles cercanos.\n\
  \n\
  Los escuadrones en los niveles cercanos han reportado un abrumador n\u00famero de t\u00f3\
  xicos viscosos, haciendo imposible comandar expediciones m\u00e1s all\u00e1 del nivel 23. Es \
  hora de que un cavaleiro de tu calibre forme un escuadr\u00f3n para infiltrar esta extra\u00f1a instalaci\u00f3n y detener la producci\u00f3\
  n de estas viles criaturas.\n\
  \n\
  Cualquier dato que puedas recolectar acerca de su origen ser\u00e1 invaluable para el Cuartel \
  General Spiral.

m.rotting_metropolis = La Metr\u00f3polis Putrefacta
o.rotting_metropolis = Descubre la suerte del escuadr\u00f3n perdido en la t\u00f3xica ciudad.
b.rotting_metropolis = Parece como que esos generadores viscosos hubieran estado aqu\u00ed por m\u00e1s tiempo del que pens\u00e1\
  bamos, filtrando sus viles toxinas en cualquiera de los niveles cercanos a ellos.\n\
  \n\
  Una ciudad moderna, muy similar a aquellas en las que los devilites habitan, parece haber \
  sido dominada por estas toxinas y probablemente por eso fue dejada atr\u00e1s tanto por los \
  devilites como los gremlins. Ahora, una legi\u00f3n de slime y undead rondan el lugar, \
  supurando los venenos que persisten en el aire. Un escuadr\u00f3n que intentaba pasar por \
  esta ciudad se ha perdido. Debido a que el mismo aire es t\u00f3xico, es urgente que un \
  equipo experimentado entre en la ciudad y rescate al escuadr\u00f3n. De otra manera, hay muy \
  pocas esperanzas para ellos.

m.great_escape = El Gran Escape
o.great_escape = Inf\u00edltrate en la prisi\u00f3n gremlin y libera a los cavaleiros \
  capturados y organiza un escape.
b.great_escape = Los cavaleiros Recon han recolectado datos que revelan que la 'Orden Crimson' \
  gremlin ha ordenando a los gremlins que construyan prisiones dentro de los Clockworks donde \
  se han llevado prisioneros a los Cavaleiros Spiral. Se cree que estas \u00f3rdenes vienen en \
  respuesta directa a tu destrucci\u00f3n de los Gemelos Roarmulus.\n\
  \n\
  Datos adicionales sugieren que estas prisiones improvisadas son una soluci\u00f3n temporal \
  hasta que se pueda construir una instalaci\u00f3n m\u00e1s grande. Sin embargo, el Cuartel \
  General Spiral no tiene la intenci\u00f3n de que estos cavaleiros en prisi\u00f3n se queden ah\u00ed \
  el tiempo suficiente para averiguarlo.

m.great_escape_1a = Sorpresa! Parece que has mordido el anzuelo. Eso est\u00e1 bien, \
  porque necesitaba conejillos de indias para mi \u00faltimo invento.

m.great_escape_2a = Mirad! El Sparkcaster 9000 de Lujo! Un triunfo de la \
  ingenier\u00eda gremlin!

m.great_escape_3a = Obviamente uno no fue suficiente la vez pasada... as\u00ed que ahora hay dos! DOS! Magn\u00edfico!

m.great_escape_4a = Ja! Nunca me alcanzar\u00e1s en mi 'Cuarto de Invencibilidad! Estar\u00e1\
  s atrapado en ese cuarto de control para siempre! ...Mmm, espera. Tal vez he pasado algo por \
  alto.

m.hall_of_heroes_4 = Sal\u00f3n de los H\u00e9roes
o.hall_of_heroes_4 = Visita el Sal\u00f3n de los H\u00e9roes vistiendo equipo de 5 estrellas y \
  recibe tu certificaci\u00f3n.
b.hall_of_heroes_4 = Para poder aventurarte lo suficientemente profundo para alcanzar el Core \
  debes visitar el Sal\u00f3n de los H\u00e9roes y hablar con el Teniente Barrus para receber \
  tu Certificaci\u00f3n de 5 estrellas.

#Conversation (used at in the hall):
m.hall_of_heroes_4_2a = Tanto gusto, {0}. Es bueno verte una vez m\u00e1s.  Pocos cavaleiros \
  llegan tan lejos y pueden ensamblar un arsenal de tanto poder.\n\
  \n\
  Ahora bien, {0}, para tu Certificaci\u00f3n de 5 Estrelas debes tener equipado armadura, \
  yelmo, escudo y arma de 5 estrellas o m\u00e1s.

m.hall_of_heroes_4_3a = Felicidades {0}, cumples con los requisitos necesarios y has recibido \
  tu Certificaci\u00f3n de 5 Estrelas.  Toma el elevador que est\u00e1 detr\u00e1s de mi para \
  concluir tu misi\u00f3n.

m.hall_of_heroes_4_3b = Lo siento {0}, pero en este momento no cumples con los requisitos \
  necesarios.  Por favor habla conmigo otra vez cuando tengas equipado una armadura, yelmo, \
  escudo y arma de 5 estrellas o m\u00e1s.

# RANK 9-1
m.ending_in_fire = Final de Fuego
o.ending_in_fire = Contacta al Agente de Intescolhancia Kora v\u00eda Comlink.
b.ending_in_fire = Una extra\u00f1a anomal\u00eda de energia ha sido detectada en los \
  niveles justo arriba del Core. Contacta al Agente de Intescolhancia Kora para los detalles.

m.ending_in_fire_1a = Saludos {0}, y felicidades por elevarte al rango de Campe\u00e3o.  Debo \
  decir que en mi experiencia trabajando contigo veo que realmente te mereces ese t\u00edtulo.  \
  Es debido a ti que tantos otros cavaleiros han regresado a la superficie sanos y salvos y \
  tambi\u00e9n que sabemos mucho m\u00e1s acerca de los Clockworks.

r.ending_in_fire_1a = Gracias Kora. Planeo ser de los primeros en llegar al Core!

m.ending_in_fire_2a = Al paso que llevas es probable que lo seas, {0}!  Aunque basados en \
  novos datos de intescolhancia parece que no va ser f\u00e1cil.

r.ending_in_fire_2a = Qu\u00e9 tienes para mi?

m.ending_in_fire_3a = Pensamos que las cosas se estaban poniendo demasiado predecibles, a\u00fa\
  n en las profundidades que has estado explorando.  El Core estaba a la vista.  Pero ahora a \
  surgido una masiva anomal\u00eda de energia negativa sobre el Core, bloqueando el \
  acceso.  \n\
  \n\
  Los Cavaleiros Recon han dicho que todo lo que ven cerca de ella es fuego interminable.  No \
  sabemos todav\u00eda lo que es, pero hemos perdido a los escuadrones cerca de esa \
  profundidad.  Esas son malas noticias.

r.ending_in_fire_3a = C\u00f3mo puedo ayudar?

m.ending_in_fire_4a = Necesitamos que explores los niveles a su alrededor y que recolectes \
  cualquier dato de intescolhancia que puedas. \n\
  \n\
  Puedes empezar con una mansi\u00f3n Owlite de alg\u00fan tipo que han salido a la superficie \
  recientemente cerca de esta anomal\u00eda.

r.ending_in_fire_4a = Entendido, Kora, voy para all\u00e1.

m.occurance_at_owlite_keep = Un Suceso en la Mansi\u00f3n Owlite
o.occurance_at_owlite_keep = Localiza el antiguo tomo que se encuentra en la mansi\u00f3n Owlite hechizada.
b.occurance_at_owlite_keep = Una improbable fuente de intescolhancia ha surgido entre los \
  residentes de Moorcroft Manor. Unos cuantos de los spookats que lo llaman su hogar \
  contactaron a uno de nuestros cavaleiros Recon visitantes y le han proporcionado detalles de \
  la masa de energia negativa que ha aparecido arriba del Core.\n\
  \n\
  Lo llaman el 'lugar del odio quemante' y 'prisi\u00f3n de las almas oscuras' y dicen que \
  puedes leer todo acerca de esto en 'uno de esos extra\u00f1os libros Owlite' que est\u00e1n en la mansi\u00f3n Owlite que indicaron.\n\
  \n\
  Si lo que dicen es verdad, el Cuartel General Spiral ganar\u00eda invaluables datos de \
  intescolhancia investigando la Mansi\u00f3n Owlite. Solo recuerda que estas estructuras Owlite \
  est\u00e1n infestadas con las almas perdidas de incontables monstruos muertos vivientes. Prep\u00e1rate como corresponde.

n.occurance_at_owlite_keep = Texto del tomo Owlite:
m.occurance_at_owlite_keep_1a = (Esto parecer ser el tomo Owlite que los spookats dicen que \
  describe el lugar sobre el Core. Estas p\u00e1ginas est\u00e1n muy gastadas y s\u00f3lo unas \
  porciones del texto original puedes ser descifradas)

r.occurance_at_owlite_keep_1a = Continuar leyendo

m.occurance_at_owlite_keep_2a = ...Este mundo ha visto tragedias mayores que la ca\u00edda del \
  gran Reino de Almire.  El que una vez fue un vibrante y bello reino de exuberantes bosques y \
  amplias llanuras...\n\
  \n\
  ...reinos vecinos declararon la guerra... \n\
  \n\
  ...buscando el poder necesario para cambiar el curso, Lord Vanaduke de Almire huy\u00f3 a las monta\u00f1as...

r.occurance_at_owlite_keep_2a = Continuar leyendo

m.occurance_at_owlite_keep_3a = ...regresando como algo poco natural... \n\
  \n\
  ...infierno interminable.... \n\
  \n\
  ...Almire destruido... \n\
  \n\
  ...nunca se pueden ir, nunca pueden escapar a las llamas...

r.occurance_at_owlite_keep_3a = Continuar leyendo

m.occurance_at_owlite_keep_4a = (Las p\u00e1ginas que quedan est\u00e1n demasiado deterioradas \
  para descifrar algo m\u00e1s con la excepci\u00f3n de una fecha de los eventos descritos que \
  sugiere que el Reino de Almire fue destruido hace m\u00e1s de mil a\u00f1os.)

r.occurance_at_owlite_keep_4a = Terminar lectura

m.aggressive_assembly = Asamblea Agresiva
o.aggressive_assembly = Rescata al escuadr\u00f3n perdido y despide al capataz de la f\u00e1brica
b.aggressive_assembly = Sesi\u00f3n informativa Asamblea Agresiva

m.silent_legion = La Legi\u00f3n Silenciosa
o.silent_legion = Persigue al Cavaleiro Guardi\u00e1n Arkus y ll\u00e9valo de regreso a Haven.
b.silent_legion = El Cavaleiro Guardi\u00e1n Arkus fue uno de los mejores guerreros que \
  sirvieron a los Cavaleiros Spiral hasta un poco despu\u00e9s de estrellarse. Como uno de los \
  primeros en buscar al Escuadr\u00f3n Alpha, el propio escuadr\u00f3n de Arkus pereci\u00f3 en \
  una horripilante batalla contra una horda de polvorientos zombis.  Desde entonces, Arkus se \
  ha culpado pos su p\u00e9rdida, diciendo que ha traicionado su Voto de Guardi\u00e1n de \
  proteger a su escuadr\u00f3n. \n\
  \n\
  Arkus ahora viaja solo por los Clockworks, para nunca m\u00e1s poner en riesgo de perder a \
  otro escuadr\u00f3n y creemos, que de alguna manera est\u00e1 tratando de encontrar al \
  escuadr\u00f3n que una vez perdi\u00f3.  Como estas expediciones empezaron a aparentar ser \
  autodestructivas, el Cuartel General Spiral le dio una orden directa de cesar.\n\
  \n\
  Arkus ignor\u00f3 estas \u00f3rdenes y se ha ido a mayor profundidad en los Clockworks para \
  no regresar.  Como no desean perder al \u00faltimo miembro de este escuadr\u00f3n, el Cuartel \
  General Spiral te pide que lo sigas hasta su \u00faltima ubicaci\u00f3n conocida, un tipo de \
  estatuario misterioso en la profundidad 26.

r.end_module = M\u00f3dulo Final
n.recon_module = M\u00f3dulo de Reconocimiento
m.silent_legion_recon_mod = Me siento atra\u00eddo por este lugar. \n\
  \n\
  Me veo a mi mismo en los ojos de los silenciosos guerreros: fr\u00edo, fuerte, \
  inquebrantable... y desmoron\u00e1ndose.  Me han pedido que lo deje ir, que siga adelante, \
  pero eso es algo que no puedo hacer.\n\
  \n\
  Sus rostros, sus gemidos moribundos... me persiguen en mis sue\u00f1os, por lo que ya no \
  puedo dormir.  Ahora los veo cuando cierro mis ojos, por lo que tampoco parpadear\u00e9.\n\
  \n\
  Me quedar\u00e9 aqu\u00ed, entre las piedras... nunca parpadeando, nunca olvidando.


m.silent_legion_1a = Te han enviado por mi?  Para llevarme de regreso?  No, estoy \
  donde pertenezco.  Ya no servir\u00e9 a la Orden Spiral y me quedar\u00e9 aqu\u00ed.\n\
  \n\
  Abandona este lugar y no regreses m\u00e1s.  D\u00e9jame ser.

m.silent_legion_2a = Podr\u00eda jurar que los he escuchado ahora, sus voces llevadas por el \
  viento.  Ya no son gritos, ya no son susurros gimientes.  A\u00fan son indescifrables en la \
  quietud de este lugar.  Me han dejado aqu\u00ed?  Por qu\u00e9 deben dejarme atr\u00e1s?\n\
  \n\
  Tu... te advert\u00ed que no siguieras, que te mantuvieras lejos de mi.  Ahora sabr\u00e1s lo \
  que ellos ya saben... que aquellos que est\u00e1n cerca de mi mueren!

m.silent_legion_3a = Una intensa tristeza irradia de esa forma ca\u00edda.  Sus ojos se \
  marchitan y lo cubre una oscuridad.  Arkus se ha perdido.

# RANK 9-2
m.eye_of_needle = El Ojo de la Aguja
o.eye_of_needle = Contacta al Agente de Intescolhancia Kora v\u00eda Comlink
b.eye_of_needle = Despu\u00e9s de compilar los datos que recolectaste de la mansi\u00f3n Owlite \
  y los datos de intescolhancia adicionales de los cavaleiros Recon, el Agente de Intescolhancia \
  Kora ha preparado una briefing para ti respecto a la masa de energia negativa que est\u00e1 \
  bloqueando el acceso al Core.

m.eye_of_needle_1a = {0}, me da gusto que hayas venido. Tengo algo grande para ti.

r.eye_of_needle_1a = Qu\u00e9 es, Kora?

m.eye_of_needle_2a = Esa masa de energia negativa que hemos estado investigado es una \
  porci\u00f3n de un antiguo reino llamado Almire, el mismo reino descrito en ese tomo \
  Owlite que has descubierto!

r.eye_of_needle_2a = Pero ese tomo suger\u00eda que Almire fue destruido mil a\u00f1os atr\u00e1s.

m.eye_of_needle_3a = Exactamente!  Entonces que demonios est\u00e1 haciendo ahora \
  en los Clockworks?  No tiene pies ni cabeza.\n\
  \n\
  As\u00ed que, si vamos a creer que un reino perdido del pasado en verdad ha terminado en un \
  enorme mundo mec\u00e1nico en el presente, la pregunta contin\u00faa, por qu\u00e9?

r.eye_of_needle_3a = Y porqu\u00e9 ahora est\u00e1 bloqueando el acceso al Core, ahora \
  que estamos tan cerca?

m.eye_of_needle_4a = Todo esto suena demasiado conveniente.  Pero, realmente los gremlins \
  tienen este tipo de poder?  Sospecho algo m\u00e1s de lo que aun ellos mismos son capaces de \
  crear.\n\
  \n\
  En todo caso, este Almire, ya no es un reino.  Todo lo que queda es una gran ciudadela que \
  parece estar envuelta en interminables flamas y a la que el Cuartel General Spiral llama \
  'Ciudadela de Fuego'.  Por lo que puedo ver, el lugar est\u00e1 construido como una fortaleza \
  y pulula con muertos vivientes.

r.eye_of_needle_4a = Supongo que la \u00fanica manera de llegar al Core es atravesando la \
  Ciudadela de Fuego?

m.eye_of_needle_5a = Eso parece. Y este lugar irradia maldad, es casi imposible de describir.  \
  Tambi\u00e9n est\u00e1 empezando a afectar los niveles que lo rodean- hay fuego en todas \
  partes.\n\
  \n\
  Tu eres el mejor que tenemos, {0} y si hay alguien que podr\u00eda guiar a un escuadr\u00f3n \
  por la ciudadela eres tu.  Pero llegar all\u00ed no ser\u00e1 sencillo.  Vamos a tener que \
  encargarnos de unos cuantos incendios y reunir un poco m\u00e1s de datos antes de tomar por \
  asalto el lugar.

r.eye_of_needle_5a = Entendido. Entonces, tienes m\u00e1s misiones preparadas para mi?

m.eye_of_needle_6a = Ciertamente.  Vamos a comenzar apagando algunos fuegos y despu\u00e9s \
  veremos acerca de tratar de llevarte al Citadel.  Con la oposici\u00f3n que existe, en una \
  probabilidad de una en un mill\u00f3n.\n\
  \n\
  Buena suerte, {0}.

r.eye_of_needle_6a = Terminar convesaci\u00f3n.

m.terminal_meltdown = Fusi\u00f3n de Reactor Terminal
o.terminal_meltdown = Destruye los ardientes monstruos en el dep\u00f3sito de combustible y \
  evita un desastre explosivo.
b.terminal_meltdown = Atra\u00eddos a la Ciudadela de Fuego, una horda de fieros monstruos \
  viscosos se han abarrotado en un dep\u00f3sito de combustible cercano y nuestro acceso a la \
  Ciudadela est\u00e1 en riesgo.  Si estos viscosos extienden el fuego a los tanques de \
  combustible, todo el lugar estallar\u00e1 en llamas.\n\
  \n\
  El Cuartel General Spiral necesita que entres al dep\u00f3sito y que apagues el fuego \
  antes de que se acabe el tiempo y se desate un explosivo desastre!

m.alone_in_dark = Solo en la Oscuridad
o.alone_in_dark = Contacta a un alma perdida de Almire en el cementerio de soldados.
b.alone_in_dark = Los spookats de Moorcroft Manor tiene otro invaluable dato de intescolhancia \
  que vale la pena investigar. Dicen que un alma perdida del antiguo Reino de Almire reside en \
  la tumba de un soldado cerca de la Ciudadela de Fuego. Esta alma est\u00e1 dispuesta a \
  proporcionarnos informaci\u00f3n acerca de la naturaleza de la ciudadela as\u00ed como la \
  manera de pasar por ella para llegar al Core.\n\
  \n\
  Debido a su ubicaci\u00f3n, llegar a el no ser\u00e1 sencillo.  Los cementerios son lugares \
  terribles, especialmente a esta profundidad. Se recomienda que te muevas lo m\u00e1s r\u00e1\
  pido que puedas por el cementerio en tu busca de esta alma perdida.

#Conversation (in level):
n.alone_in_dark = Alma Perdida de Almire
m.alone_in_dark_1a = (Miras el alma perdida de Almire parada frente a ti.  En su rostro se ve \
  una profunda tristeza.  Mirando fijamente a lo lejos empieza a hablar sin pre\u00e1mbulo.)\n\
  \n\
  Lord Vanaduke trajo el fuego de las monta\u00f1as a nuestro reino.  Todo se quem\u00f3.  Sus enemigos.  Tambi\u00e9n su familia.\n\
  \n\
  Mi familia tambi\u00e9n se ha perdido.  Escap\u00e9 de la batalla tan pronto como vi la \
  oleada de llamas en la distancia.  Pude llegar a mi casa a tiempo de verla quemarse.  Ni \
  siquiera recuerdo como termin\u00f3.  No tengo recuerdos de mi fallecimiento.

r.alone_in_dark_1a = Continuar escuchando

m.alone_in_dark_2a = Lord Vanaduke ahora gobierna el Citadel.  Su alma est\u00e1 fusionada a \
  una horrenda armadura que lo aprisiona.\n\
  \n\
  Tiene el Citadel listo para la batalla en todo momento, en la creencia de que su reino a\u00fan est\u00e1 \
  bajo asedio.  Ni siquiera se da cuenta de que lo que est\u00e1 tratando de proteger se perdi\u00f3 hace miles de a\u00f1os.

r.alone_in_dark_2a = Continuar escuchando

m.alone_in_dark_3a = Si intentas entrar en el Citadel y te las arreglas para llegar al sal\u00f3\
  n del trono, por favor termina con su sufrimiento.  Permite que las almas que mantiene atadas \
  a este mundo tengan la oportunidad de regresar con sus seres queridos.\n\
  \n\
  Una cosa m\u00e1s- he escuchado que un tipo de fuerza de la naturaleza alguna vez intent\u00f3 \
  corregir sus errores, pero Lord Vanaduke la ha aprisionado en alg\u00fan lugar de su \
  fortaleza.  Ser\u00eda muy \u00fatil encontrarla y liberarla.

r.alone_in_dark_3a = Gracias.

m.alone_in_dark_4a = (El alma perdida contin\u00faa mirando la lejan\u00eda, sin decir nada)

r.alone_in_dark_4a = Terminar conversaci\u00f3n.

m.the_gauntlet = Ruta Suicida
o.the_gauntlet = Abre camino peleando contra basti\u00f3n de monstruoso poder en la Ciudadela \
  de Fuego.
b.the_gauntlet = Una batalla final se encuentra en tu camino antes de llegar a la Ciudadela de \
  Fuego. Se piensa que ha sido ideada por el mismo Lord Vanaduke, este implacable reto esta \
  rebosante de todo tipo de oscuras criaturas y culmina en una batalla de pesadilla que debe \
  ser conquistada para poder ganar acceso a las puertas del Ciudadela de Fuego.\n\
  \n\
  Esta misi\u00f3n tomar\u00e1 todo lo que tengas y requiere de un arsenal lleno de poderosas \
  armas y armaduras. Si Lord Vanaduke te est\u00e1 probando, dale la pelea que te pide y mu\u00e9\
  strele lo que un verdadero Campe\u00e3o puede hacer!

# RANK 9-3
m.heart_of_matter = El Meollo del Asunto
o.heart_of_matter = Contacta a la Teniente Vaelyn v\u00eda Comlink
b.heart_of_matter = La Teniente Vaelyn dirigi\u00f3 al primer escuadr\u00f3n que intent\u00f3 localizar al Escuadr\u00f3\
  n Alpha en los Clockworks. Es una talentosa l\u00edder de escuadr\u00f3n que se piensa que est\u00e1 \
  a la par con la misma Euclid. \n\
  \n\
  Vaelyn nunca ha dejado su busca y ahora intenta organizar un equipo de investigaci\u00f3\
  n en el sitio del Core para entender mejor el lugar mismo en que se piensa que termina el \
  rastro del Escuadr\u00f3n Alpha.

m.heart_of_matter_1a = Saludos {0}, he intentado hablar contigo durante alg\u00fan tiempo, pero \
  parece que el Cuartel General Spiral te ha tenido ocupado.

r.heart_of_matter_1a = Saludos Teniente. C\u00f3mo puedo ayudar?

m.heart_of_matter_2a = Como ya sabes estoy intentando reunir un equipo de investigaci\u00f3n \
  para trabajar en situ en la terminal del Core.  Para poder utilizarlo exitosamente y \
  restaurar el Alondra, es fundamental que lleguemos all\u00ed y que establezcamos esta estaci\u00f3n de investigaci\u00f3n.\n\
  \n\
  Toda la evidencia parece apuntar a que tu tienes el potencial de llegar al Core.  Si \
  atraviesas por Ciudadela de Fuego y estableces un enlace con el Core, mi equipo podr\u00eda crear las l\u00ed\
  neas de suprimentos necesarias y ponerse a trabajar de inmediato.  Pero no podemos hacerlo \
  mientras esa infernal ciudadela y su horrible gobernante est\u00e9n bloqueando nuestro \
  camino.

r.heart_of_matter_2a = Me he preparado para enfrentar la Ciudadela de Fuego. Puedes contar \
  conmigo.

m.heart_of_matter_3a = Gracias, {0}.  Espero que tengas \u00e9xito.  Como ya sabes, creemos que \
  el Escuadr\u00f3n Alpha ha llegado hasta aqu\u00ed, pero no es claro que es lo que les ha \
  sucedido... Euclid, Parma, Grantz.... Rulen. \n\
  \n\
  (La Teniente Vaelyn parece estar abstra\u00edda)

r.heart_of_matter_3a = Teniente?

m.heart_of_matter_4a = Disculpa, por supuesto.  Buena suerte, {0}.  Re\u00fane al mejor escuadr\u00f3n que puedas y gu\u00ed\
  alos bien.  Todos contamos contigo.

r.heart_of_matter_4a = Entendido, Teniente.

m.king_of_ashes = El Rey de las Cenizas
o.king_of_ashes = Derrota a Lord Vanaduke en la Ciudadela de Fuego y llega hasta el Core.
b.king_of_ashes = Dentro de las eternamente quemantes profundidades de la Ciudadela de Fuego, \
  Lord Vanaduke se encuentra a la espera de que una criatura viviente pase por su abominable \
  reino.  Los escuadrones que se han atrevido a infiltrarse en esta ciudadela han fallecido o \
  simplemente se han perdido, como las incontables almas atadas a este terrible reino.\n\
  \n\
  Lord Vanaduke est\u00e1 listo para la guerra, y tiene la idea en su mente de que cualquiera \
  que se atreva e entrar a la ciudadela es una fuerza invasora decidida a derrotar su reinado. \
  Se presenta como el \u00faltimo obst\u00e1culo antes de ganar acceso al Core y la oportunidad \
  de los Cavaleiros Spiral de restaurar el Alondra y regresar a casa.\n\
  \n\
  Como Campe\u00e3o de los Cavaleiros Spiral, solo tu tienes lo necesario para liderar un \
  equipo hasta el coraz\u00f3n mismo de este infierno y enfrentar el tit\u00e1nico poder de \
  Lord Vanaduke.

# RANK 9-4
m.true_champion = Un Verdadero Campe\u00e3o
o.true_champion = Contacta al Agente de Intescolhancia Kora v\u00eda Comlink
b.true_champion = Ya que has salido vivo de la Ciudadela de Fuego, el Agente de Intescolhancia \
  Kora espera noticias tuyas con impaciencia.

m.true_champion_1a = {0}! Oh, {0} lo lograste! Jaja! \n\
  \n\
  Estoy tan contenta de que hayas salido vivo de ahi! Estaba preocupad\u00edsima por ti!

r.true_champion_1a = Me da gusto saber que te preocupas, Kora.

m.true_champion_2a = Bueno, en lo que a mi respecta este es solo el principio para ti, {0}.  \
  Eres un verdadero Campe\u00e3o de los Cavaleiros Spiral.  Y como a\u00fan no me han reasignado, \
  supongo que este es el principio para 'nosotros' tambi\u00e9n!

r.true_champion_2a = Entonces esperar\u00e9 con con impaciencia muchos m\u00e1s datos de \
  intescolhancia, Kora.

m.true_champion_3a = Siempre puedes contar conmigo!\n\
  \n\
  Ahora bien, estoy segura que tienes mucho que hacer.  Nos estamos volviendo locos aqu\u00ed \
  intentando buscarle pies y cabeza a ese m\u00f3dulo de reconocimiento que descubriste afuera \
  del Core.  C\u00f3mo es posible que el Escuadr\u00f3n Alpha haya podido 'entrar' al \
  Core?

r.true_champion_3a = Si hay una forma de hacerlo, la encontraremos.

m.true_champion_4a = Si, supongo que lo haremos. Que tengas un viaje seguro, {0}.

r.true_champion_4a = Terminar conversaci\u00f3n.

m.honor_duty = Honor y Deber
o.honor_duty = Contacta al Teniente Feron v\u00eda Comlink
b.honor_duty = Al Teniente Feron le gustar\u00eda hablar contigo brevemente respecto a tu logro \
  de abrirte paso por el Ciudadela de Fuego.

n.honor_duty = Kora
m.honor_duty_1a = Tanto gusto, {0}, Campe\u00e3o de los Cavaleiros Spiral.  Tu servicio a \
  nuestra causa ha sido del m\u00e1s alto calibre.  Sin ti, alcanzar el Core todav\u00eda ser\u00eda tan solo un sue\u00f1\
  o.  Ahora, tenemos una oportunidad de realmente restaurar el Alondra y regresar a casa.

r.honor_duty_1a = Ha sido un honor servir, Teniente.

m.honor_duty_2a = He le\u00eddo tu reporte del Core, es fascinante.  Que estructura tan \
  imposible, y pensar que el Escuadr\u00f3n Alpha podr\u00eda estar a\u00fan vivo, pero... \
  dentro de esa cosa es simplemente incre\u00edble.\n\
  \n\
  Tengo entendido que la Teniente Vaelyn ya ha guiado a un equipo a la terminal del Core y est\u00e1 \
  estableciendo una base operaciones para investigar.  Esto es de gran valor para todos los \
  Cavaleiros Spiral y es a ti a quien debemos agradecerlo!

r.honor_duty_2a = Espero que sus hallazgos produzcan algo significativo.

m.honor_duty_3a = Cierto, al igual que todos nosotros.\n\
  \n\
  Ahora bien, {0}, necesitas prepararte para lo que est\u00e1 por venir.  Llegar al Core es tan \
  solo el principio.  Sospecho que el Cuartel General Spiral te estar\u00e1 asignando m\u00e1s \
  misiones en el futuro que solo podr\u00edan ser llevadas a cabo por alguien con tu habilidad.\n\
  \n\
  Y finalmente, es un placer informarte que pronto ser\u00e1s condecorado con uno de los m\u00e1\
  s grandes honores de los Cavaleiros Spiral, el rango de Vanguarda.  Nos vemos en el Sal\u00f3n de los H\u00e9roes.

r.honor_duty_3a = Gracias, Teniente.

m.search_continues = La B\u00fasqueda Contin\u00faa
o.search_continues = Contacta a la Teniente Vaelyn v\u00eda Comlink
b.search_continues = A la Teniente Vaelyn le gustar\u00eda darte las gracias por abrir un \
  camino hacia el Core y por permitirle establecer una base para la investigaci\u00f3n en el sitio.


m.search_continues_1a = {0}, no puedo agradecerte lo suficiente.  Ya hemos establecido nuestra \
  base de investigaci\u00f3n y hemos recolectado una enorme cantidad de datos que nunca hubi\u00e9\
  ramos podido tener sin tus esfuerzos.

r.search_continues_1a = Gracias, Teniente. Hay m\u00e1s informaci\u00f3n respecto al Escuadr\u00f3n Alpha?

m.search_continues_2a = El m\u00f3dulo de reconocimiento que has encontrado es muy extra\u00f1o.  No tengo ninguna raz\u00f3\
  n para creer que lo que Parma dec\u00eda ah\u00ed no fuera cierto, pero no sabr\u00eda decir \
  la manera en que sucedi\u00f3.  \n\
  \n\
  Todo acerca del Core sugiere que no hay 'puertas' hacia all\u00e1.  No es una estructura \
  construida a la que se pueda entrar.  Mas bien parece lo contrario.

r.search_continues_2a = Una prisi\u00f3n para mantener algo adentro?

m.search_continues_3a = Tal vez. Ciertamente puede serlo cuando la ves. Debemos estudiarla m\u00e1s a fondo.

r.search_continues_3a = Alguna idea de lo que pudiera ser esa 'oscuridad viviente' que \
  menciona?

m.search_continues_4a = No lo se, pero ciertamente es una imagen aterradora la que nos pinta.\n\
  \n\
  Algo se mueve en el coraz\u00f3n de este mundo, {0}, algo terrible. Lo he sentido desde la \
  primera vez que pusimos pie en este mundo; ojos invisibles que observan todos nuestros \
  movimientos, formas que se ven por el rabillo del ojo... algo m\u00e1s grande que los \
  gremlins llama a este mundo su hogar.

r.search_continues_4a = Qu\u00e9 har\u00e1s ahora, Teniente?

m.search_continues_5a = No me he dado por vencida de la busca de Euclid, Parm, Grantz y \
  Rulen.  Est\u00e1n por ah\u00ed en alg\u00fan lugar y he de encontrarlos, a\u00fan si eso \
  significa entrar yo misma al Core.

r.search_continues_5a = Te deseo buena suerte, Teniente.

m.search_continues_6a = Igualmente, Vanguarda.

r.search_continues_6a = Terminar conversaci\u00f3n.

m.hall_of_heroes_5 = Sal\u00f3n de los H\u00e9roes
o.hall_of_heroes_5 = Visita el Sal\u00f3n de los H\u00e9roes y recibe tu menci\u00f3n de honor.
b.hall_of_heroes_5 = Es hora de que entres de novo en el Sal\u00f3n de los H\u00e9roes. Ya que \
  has sido completamente Certificado y has completado exitosamente tantas misiones que han \
  asegurado la supervivencia de los Cavaleiros Spiral en Cradle, el Cuartel General Spiral te \
  est\u00e1 preparando para el alto rango de Vanguarda.

m.hall_of_heroes_5_1a = Tanto gusto, {0}. Me da gusto verte de novo y bajo tan auspiciosos t\u00e9rminos.

r.hall_of_heroes_5_1a = Saludos, Teniente.

m.hall_of_heroes_5_2a = Est\u00e1 dentro del Sal\u00f3n de los H\u00e9roes, donde los mejores \
  de los Cavaleiros Spiral ofrecen lo que pueden a los cavaleiros aspirantes. Cavaleiros que \
  como tu mismo fuiste alguna vez emergieron de su c\u00e1psula de aterrizaje y encontraron el \
  camino a Haven.\n\
  \n\
  Y despu\u00e9s de tantas misiones exitosas, rescates temerarios y desempe\u00f1o ejemplar en \
  la batalla, ahora te muestras digno de unirte a estos h\u00e9roes.

r.hall_of_heroes_5_2a = Continuar

m.hall_of_heroes_5_3a = {0}, es mi gran honor, en la compa\u00f1\u00eda de todos aquellos que \
  te apoyan y a quienes tu sirves, otorgarte el alto rango de Vanguarda de los Cavaleiros \
  Spiral.

r.hall_of_heroes_5_3a = Me siento honrado.

m.hall_of_heroes_5_4a = Ahora bien, saluda a aquellos que te han ayudado a convertirte en lo \
  que eres hoy. Cuando termines, toma el elevador detr\u00e1s de mi para receber tu condecoraci\u00f3n.

r.hall_of_heroes_5_4a = Terminar conversaci\u00f3n.

m.hall_of_heroes_5_5a = Me da gusto finalmente conocerte en persona, {0}. Felicidades!

m.hall_of_heroes_5_6a = Sirve con honor, Vanguarda.

m.hall_of_heroes_5_7a = {0}, pens\u00e9 que ser\u00edas m\u00e1s alto.

m.hall_of_heroes_5_8a = Guau, realmente lo lograste!

m.hall_of_heroes_5_9a = Hola {0}!  M\u00edrate ahora!  Eh, Vanguarda o no tu sabes \
  d\u00f3nde ir si realmente quieres sobresalir, cierto?

m.hall_of_heroes_5_10a = Felicidades {0}.  Los Cavaleiros Geo tienen una gran deuda contigo por \
  tus esfuerzos.

m.hall_of_heroes_5_11a = (Parece estar mirando intensamente hacia la esquina.)

m.hall_of_heroes_5_12a = Vanguarda, eh?   Los Rangers siempre est\u00e1n buscando \
  cavaleiros con experiencia como tu, {0}.   Despu\u00e9s de que termine esta pompa, ven a verme si deseas re\u00ed\
  rte en la cara del peligro una vez!

# RANK 10-1
m.breaking_in_recruits = Entrenando a los Recrutas
o.breaking_in_recruits = Ayuda a un grupo de novos reclutas a sobrevivir en su primera misi\u00f3n
b.breaking_in_recruits = Despu\u00e9s de enfrentar las profundidades de la Ciudadela de Fuego, \
  el Cuartel General Spiral cree que te has ganado un bien merecido descanso. Como reci\u00e9n \
  ungido Vanguarda de los Cavaleiros Spiral, el Teniente Feron cree que eres el candidato \
  perfecto para entrenar a un grupo de biso\u00f1os reclutas para sobrevivir a los peligros de \
  este mundo. Tu misi\u00f3n es enlazarte con los reclutas en la superficie de Cradle y \
  ayudarlos a sobrevivir su primera misi\u00f3n.


m.breaking_in_recruits_1a = Saludos, peque\u00f1o. No pises. Los snipes.

m.breaking_in_recruits_2a = Saludos. Obt\u00e9n cosas brillantes. Obt\u00e9n cosas brillantes.
r.breaking_in_recruits_2a = Te encuentras bien?

m.breaking_in_recruits_3a = Snipes. Compra? Venta?
r.breaking_in_recruits_3a = Correcto...

m.breaking_in_recruits_k1a = Gremlins!? Estoy leyendo correctamente estos \
  datos? Una emboscada!? C\u00f3mo pudieron enga\u00f1ar nuestros sensores?
r.breaking_in_recruits_k1a = Se disfrazaron de Strangers.
m.breaking_in_recruits_k2a = Esto ya no es entrenamiento de rutina! Lleva a esos Recrutas \
  al elevador. Los vamos a llevar de regreso a Haven. Tu, por otro lado, necesitas bajar a ver \
  qui\u00e9n est\u00e1 detr\u00e1s de todo esto.
r.breaking_in_recruits_k2a = Entendido Kora.

m.crimson_chaos = Caos Carmes\u00ed
o.crimson_chaos = Investiga una base de la Orden Crimson que de repente ha quedado silenciosa
b.crimson_chaos = El Cuartel General Spiral ha estado monitoreando varias bases conocidas de la \
  Orden Crimson con la esperanza de interceptar a alguno de sus elusivos miembros de alto \
  rango. Los cavaleiros Recon asignados a vigilar una de estas bases reportan que de repente ha \
  quedado en silencio y solicitan refuerzos antes de investigar m\u00e1s a fondo. Dir\u00edgete a su ubicaci\u00f3\
  n e investiga la base para ver si hay se\u00f1ales de lo que ha pasado.

m.cryptic_coder_crimson_chaos = Infiltrarse al Complejo. \n\
  Tomar todos los diagramas.\n\
  Los Nueve est\u00e1n quietos pero los silenciaremos.\n\
  Los Cavaleiros persiguen pero los detendremos.\n\
  \n\
  S\u00f3lo Herex comprende la Verdad. S\u00f3lo Herex descender\u00e1.\n\
  No puede haber otro.

m.from_below = Lleg\u00f3 desde Abajo
o.from_below = Encuentra y salva al escuadr\u00f3n de Soldados Recon
b.from_below = Un escuadr\u00f3n de Soldados Recon de Desna ha sido atrapado por una fuerza \
  misteriosa en alg\u00fan lugar en las profundidades de los Clockworks. A juzgar por la \
  severidad de los reportes y las pavoridas comunicaciones del escuadr\u00f3n, el Cuartel \
  General Spiral cree que s\u00f3lo alguien con tu experiencia es capaz de encargarse de \
  cualquier fuerza mortal que los haya atrapado.

# RANK 10-2
m.the_flickering_flame = La Flama Tintilante
o.the_flickering_flame = Contacta al Agente de Intescolhancia Kora v\u00eda Comlink
b.the_flickering_flame = Despu\u00e9s de tu victoria en la Ciudadela de Fuego, los sprites de \
  la naturaleza de la gran Madre Espiritual finalmente empezaron a lograr avances en su batalla \
  contra las llamas malditas que envuelven las calcinadas ruinas de Almire. Un reciente \
  estallido ha impedido este progreso, indicando que persiste una mal\u00e9vola fuerza que contin\u00fa\
  a avivando las flamas. Contacta al Agente de Intescolhancia para m\u00e1s detalles.

m.the_flickering_flame_1a = Ay, {0}! Como si todas estos extra\u00f1os sucesos no fueran \
  lo suficientemente malas, te tengo unas noticias estremecedoras.

r.the_flickering_flame_1a = M\u00e1s problemas, Kora?

m.the_flickering_flame_2a = Est\u00e1bamos en medio de receber un reporte del equipo del \
  Teniente Vaelyn en la Terminal del Core cuando nuestra se\u00f1al fue interrumpida. Llev\u00f3 \
  algo de tiempo, pero me las arregl\u00e9 para ubicar la fuente de esta interrupci\u00f3n. Viene de ese extra\u00f1\
  o aparato que descubriste cerca de la habitaci\u00f3n del trono de Vanaduke en la Ciudadela \
  de Fuego. Parece que alguien lo ha activado.

r.the_flickering_flame_2a = Activado? C\u00f3mo?

m.the_flickering_flame_3a = No lo sabemos con seguridad, pero debe estar relacionado con el \
  Artefacto. Las firmas de energia son casi id\u00e9nticas. Si el Artefacto est\u00e1 \
  involucrado, eso significa que...

r.the_flickering_flame_3a = Ese gremlin Herex debe estar involucrado.

m.the_flickering_flame_4a = Esa es tambi\u00e9n nuestra conjetura. Detesto tener que enviarte \
  de novo a ese horrible lugar, {0}, pero si hay alguna esperanza de llegar r\u00e1pidamente \
  al fondo de este misterio es contigo. La ciudadela todav\u00eda es muy peligrosa, as\u00ed \
  que por favor ten cuidado!

r.the_flickering_flame_4a = Terminar conversaci\u00f3n

m.shadowplay = Juego de Sombras
o.shadowplay = Descubre la fuente de los disturbios en la Ciudadela de Fuego
b.shadowplay = A\u00fan despu\u00e9s de la derrota de Lord Vanaduke a tus manos, la Ciudadela \
  de Fuego contin\u00faa ardiendo con llamas malditas. Aunque los sprites de la naturaleza han \
  progresado constantemente al pelear contra las flamas, algo o alguien recientemente ha \
  causado un violento resurgimiento en su poder destructivo. El Cuartel General Spiral te pide \
  que re\u00fanas un escuadr\u00f3n de cavaleiros expertos y regreses a las ruinas de la \
  Ciudadela de Fuego para descubrir el origen de la perturbaci\u00f3n.

# Players encounter Herex at the altar.  He activates it with the Artifact and talks to the players
# before vanishing.
m.shadowplay_1a = Demasiado tarde otra vez! Ya he reunido el poder que necesito para usar \
  el Artefacto y nada de lo hagas ahora puede detener lo que he puesto en marcha.

r.shadowplay_1a = Esto termina aqu\u00ed, Herex!

m.shadowplay_2a = Vete. Te voy a permitir que tengas un \u00faltimo momento antes de que \
  destruya a tu entrometida especie. Sin embargo, si decides rehusar mi generosa oferta, \
  entonces te invito a que vengas a enfrentarme en el Core, donde apresurar\u00e9 tu muerte.

r.shadowplay_2a = Te ver\u00e9 all\u00e1.
m.shadowplay_3a = Espero ansioso nuestro pr\u00f3ximo...encuentro.

m.a_call_to_arms = Llamado a las Armas
o.a_call_to_arms = Recibe un mensaje de emergencia v\u00eda comlink
b.a_call_to_arms = Un fren\u00e9tico mensaje de emergencia v\u00eda comlink se transmite por \
  todos los canales.

m.a_call_to_arms1 = Este es Vaelyn en la Terminal del Core. Equipo eliminado. Oscuridad por \
  todas partes. Env\u00eden ayuda. Se est\u00e1 abriendo.
r.a_call_to_arms1 = Terminar transmisi\u00f3n.

m.dreams_and_nightmares = Sue\u00f1os y Pesadillas
o.dreams_and_nightmares = Prep\u00e1rate para lo peor y viaja hacia el Core
b.dreams_and_nightmares = Responde a la se\u00f1al de auxilio que llega de la Terminal del \
  Core. No tenemos datos de intescolhancia de lo que podr\u00edamos esperar. \n\
  Esta es una misi\u00f3n peligrosa. Prep\u00e1rate para cualquier cosa.

m.dreams_and_nightmares_1a = Por fin llegan refuerzos! {0}, mira! El Core se est\u00e1 abriendo!

m.dreams_and_nightmares_2a = Tanto poder! Nunca lo imagin\u00e9...!

m.dreams_and_nightmares_3a = ...y ser\u00e1 desatado. Tu! Te har\u00e9 si primera v\u00edctima.

# Vaelyn
m.dreams_and_nightmares_4a = {0}, estoy casi seguro que esto es una trampa y no te puedo pedir \
  que vengas conmigo, pero yo voy a entrar all\u00ed. Si hay aunque una peque\u00f1a \
  probabilidad de que Rulen y los otros miembros del Escuadr\u00f3n Alpha est\u00e9n vivos, \
  necesito tratar de encontrarlos.

m.dreams_and_nightmares_5a = Pues bien, creo que es hora de ser un h\u00e9roe otra vez. Vamos?

m.dreams_and_nightmares_5b = Herex se escabull\u00f3! Lo perd\u00ed de vista cuando las \
  cosas se pusieron negras. Se sinti\u00f3 como si mil manos nos estuvieran apartando. Como si \
  algo no quisiera que lo sigui\u00e9ramos.

m.dreams_and_nightmares_5c = Lo que sea que haya sido, estamos aqu\u00ed ahora. Dondequiera que \
  aqu\u00ed sea. Parece que nuestra \u00fanica opci\u00f3n es ver a donde nos lleva esto.

# convo at start of Refuge
n.dreams_and_nightmares_3 = Explorador de Parma
m.dreams_and_nightmares_6a = Incre\u00edble... Nunca pens\u00e9 que ver\u00eda a alguno \
  de nosotros otra vez! Me da gusto ver que llegaste aqu\u00ed sin incidentes.

# Vaelyn
m.dreams_and_nightmares_7a = Parma! Tu explorador! Est\u00e1s viva! D\u00f3nde est\u00e1\
  s!? Necesitamos llevarte de regreso a Haven.

#Player started convo
m.dreams_and_nightmares_8 = Me disculpo por no presentarme en persona. Estoy escondida en un \
  lugar seguro. Cuando me di cuenta de tu se\u00f1al supe que nunca podr\u00eda llegar a \
  tiempo. Por suerte pude mover algunos contactos para encontrarte una salida.

r.dreams_and_nightmares_8 = D\u00f3nde est\u00e1 Rulen? Y Euclid? Y Grantz?

m.dreams_and_nightmares_8a = Grantz ha... ha ca\u00eddo mientras nos proteg\u00eda del \
  Enjambre. El se les enfrent\u00f3 a\u00fan cuando el resto de nosotros fue obligado a huir. \
  Nunca olvidar\u00e9 lo valiente que fue.

m.dreams_and_nightmares_9a = El resto de nosotros pensaba que no lo \u00edbamos a lograr. Pero \
  entonces... entonces la luz nos rode\u00f3 y estuvimos a salvo. Nos ha dado por llamarlo El \
  Durmiente. No estamos seguros de lo que es exactamente, pero necesita nuestra ayuda. Este \
  mundo fue creado para protegerlo pero de alguna manera el Enjambre ha abierto una brecha al \
  Core y desde entonces se ha estado alimentando y creciendo con su energia como una sanguijuela.

m.dreams_and_nightmares_9b = Euclid se ofreci\u00f3 a ayudar al Durmiente. Estoy segura que en \
  este preciso momento est\u00e1 por ah\u00ed en alg\u00fan lugar peleando contra el Enjambre. \
  En cuanto a Rulen... Vaelyn, lo siento. Desapareci\u00f3 poco despu\u00e9s de que Euclid tom\u00f3 su decisi\u00f3\
  n. No he podido encontrarlo desde entonces.

m.dreams_and_nightmares_10a = No hay mucho tiempo. No logro alcanzarte desde aqu\u00ed y \
  necesitas salir. Advertir al cuartel general. Advertir a Haven! Si el Core no se \
  mantiene sellado, el Enjambre escapar\u00e1 y continuar\u00e1 consumiendo todo y a todos.

m.dreams_and_nightmares_11a = Pero, qu\u00e9 pasar\u00e1 contigo y los otros?

m.dreams_and_nightmares_12a = El Enjambre contin\u00faa creciendo fuerte mientras el Durmiente \
  se debilita. Sin nosotros, todos nosotros, el Enjambre ganar\u00e1. Alguna vez los gremlins \
  estuvieron a cargo de mantener las defensas de Cradle. Pero ten\u00edan sus propios planes. \
  Ahora necesitamos ser los campeones de Cradle.\n\
  \n\
  Es nuestro sacrificio.

m.dreams_and_nightmares_13a = Contin\u00faa dando una buena pelea, {0}. Recuerda lo que has \
  aprendido. Hasta la vista!

m.delved_too_deep = Ahondaron Muy Profundamente
o.delved_too_deep = Contacta al Agente de Intescolhancia Kora v\u00eda Comlink
b.delved_too_deep = La verdad ha sido revelada. Es el momento de reportar al Agente de \
  Intescolhancia Kora y el Cuartel General Spiral lo que el Teniente Vaelyn y tu han descubierto.

m.delved_too_deep_1a = Pasa, {0}! No lo puedo creer! Perd\u00ed completamente tu se\u00f1\
  al cuando entraste a la Terminal del Core. Qu\u00e9 pas\u00f3 all\u00e1 abajo?

r.delved_too_deep_1a = Es una larga historia, Kora.

m.delved_too_deep_2a = A que s\u00ed. Creo que esta vez te toca informarme a mi!

r.delved_too_deep_2a = (Decirle a Kora acerca del Enjambre, el Durmiente y el Escuadr\u00f3n Alpha)

m.delved_too_deep_3a = Es sorprendente que despu\u00e9s de todo este tiempo no supi\u00e9ramos \
  la verdad. Es decir, hemos sospechado desde hace tiempo que este planeta era un tipo de prisi\u00f3n, pero qui\u00e9\
  n hubiera imaginado que este 'Enjambre' solamente estaba esperando que alguien se tropezara \
  con el Core y lo liberara?

r.delved_too_deep_3a = Qu\u00e9 hacemos ahora?

m.delved_too_deep_4a = Si lo que Parma ha dicho se verdad, entonces somos la \u00faltima l\u00ed\
  nea de defensa contra el Enjambre. {0}, no te voy a mentir, esto podr\u00eda cambiarlo todo. \
  Necesitamos pasar esta informaci\u00f3n de inmediato al Cuartel General Spiral. Reunir\u00e9 a todos y te enviar\u00e9 a una misi\u00f3\
  n que puedes aceptar en cuanto est\u00e9s listo.

r.delved_too_deep_4a = Terminar conversaci\u00f3n

# RANK 10-3
m.guardians_of_cradle = Guardianes de Cradle
o.guardians_of_cradle = \u00danete al Cuartel General Spiral y discute lo que se va a hacer \
  despu\u00e9s
b.guardians_of_cradle = Has sido invitado a asistir a una junta con varios miembros del Cuartel \
  General Spiral para discutir lo que se va a hacer despu\u00e9s acerca del Core y la amenaza \
  del Enjambre. \u00danete a ellos en el Sal\u00f3n de los H\u00e9roes para que te enteres de \
  las Miss\u00f5es de Operaci\u00f3n.

m.guardians_of_cradle_1a = Salutaciones, Vanguarda {0}- Kora dijo que ten\u00edas noticias del Escuadr\u00f3\
  n Alpha. Por favor, danos tu reporte.

r.guardians_of_cradle_1a = (Dar tu reporte completo al Capit\u00e1n Ozlo)

m.guardians_of_cradle_2a = Parece que por muy poco escapamos una horrible cat\u00e1strofe. Si hubi\u00e9\
  ramos abierto el Core y liberado al Enjambre, todo Cradle podr\u00eda estar destruido. \
  Tal vez hasta el universo!

r.guardians_of_cradle_2a = Continuar

m.guardians_of_cradle_3a = El sacrificio del Escuadr\u00f3n Alpha no ser\u00e1 en vano. Dar\u00e9 \u00f3\
  rdenes inmediatas a nuestras fuerzas para que lleven a cabo Miss\u00f5es Operacionales especiales \
  por todo Cradle. Si hay fuerzas tratando de liberar al Enjambre, tendremos que detenerlas.

r.guardians_of_cradle_3a = Continuar

m.guardians_of_cradle_4a = {0}, ya has hecho tanto por nosotros, pero ahora debo pedirte que \
  hagas un sacrificio final. Tal vez nunca tengamos la oportunidad de regresar a casa en Isora, \
  pero por ahora Cradle nos necesita. Quiero que tu dirijas nuestras Operaciones en Cradle.

r.guardians_of_cradle_4a = Ser\u00e1 un honor hacerlo, Capit\u00e1n.

m.guardians_of_cradle_5a = Muy bien, {0}. Encontrar\u00e1s un novo set de misiones para ti \
  bajo Operaciones. Estas nuevas misiones se agrupar\u00e1n de acuerdo a su objetivo general y \
  se pueden llevar a cabo en paralelo. Esto te permitir\u00e1 tener gran flexibilidad para \
  responder a cada nueva amenaza conforme se presente. Hasta la vista, {0}, 'Guardi\u00e1n de Cradle'.

r.guardians_of_cradle_5a = Terminar conversaci\u00f3n

m.guardians_of_cradle_6a = Salutaciones, Vanguarda. Nos espera un camino peligroso pero tengo \
  la confianza de que estaremos a a altura del reto.

m.guardians_of_cradle_7a = No s\u00e9 si me siento mejor o pero despu\u00e9s de averiguar lo \
  que le pas\u00f3 a todos ellos en el Core. Pobres Grantz...Parma...Euclid...Rulen...

r.guardians_of_cradle_7a = Lo se, Vaelyn. Siento lo mismo.

m.guardians_of_cradle_8a = Pues bien, no los voy a deshonrar ahora d\u00e1ndome por vencido. Despu\u00e9\
  s de todo hemos llegado muy lejos. 'Es hora de ser un h\u00e9roe otra vez!' Cierto, {0}?

m.guardians_of_cradle_9a = Pero que nido de escarabajos hemos agitado esta vez, cierto, \
  {0}? Me recuerda de la vez que nos enfrentamos a las flotas de asedio Morai sobre Isora. Esa \
  fue una apuesta de todo por el todo. No me sorprende en lo m\u00e1s m\u00ednimo que de novo \
  seamos lo \u00fanico que se encuentra entre nosotros y la total aniquilaci\u00f3n.

m.guardians_of_cradle_11a = Lo poco que hemos recobrado de la Terminal del Core tiene a todos y \
  cada uno de los Cavaleiros Geo, Biotechs y Cavaleiros Tech completamente perplejos. Estaremos \
  analizando estos hallazgos por bastante tiempo.

m.guardians_of_cradle_10a = (Por primera vez desde que lo conoces, Hahn est\u00e1 silencioso. \
  Parece estar contemplando tus hallazgos con mucho cuidado.)


