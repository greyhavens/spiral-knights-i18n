# Mission Start

m.anniversary_start_1 = {0}! Si que estoy feliz de verte! Las cosas se est\u00e1n \
  poniendo muy feas por aqu\u00ed.

r.anniversary_start_1 = Que est\u00e1 pasando, Biscotti?

m.anniversary_start_2 = As\u00ed es como est\u00e1n las cosas\u2026 Yo ten\u00eda la tarea de \
  hornear pasteles para la gran Celebraci\u00f3n de Aniversario de Spiral Knights y  tal vez se \
  me pas\u00f3 la mano cuando dije que pod\u00eda hornear un par de millones en tan solo una \
  semana.\n\
  \n\
  Para acelerar el proceso es posible que haya usado un poquit\u00edn de pura, y no refinada, \
  materia oscura en lugar de levadura\u2026

r.anniversary_start_2 = Qu\u00e9 hiciste qu\u00e9?

m.anniversary_start_3 = En todo caso parece ser que esta nueva 'receta' caus\u00f3 que los \
  pasteles se convirtieran en horribles monstruos que han controlado mi cocina e infestado los \
  Clockworks. Me gustar\u00eda recuperar mi cocina, podr\u00edas asistirme en la \
  destrucci\u00f3n de estos Creep Cakes?

r.anniversary_start_3 = Aunque mi entrenamiento no incluy\u00f3 combate de reposter\u00eda, cuenta conmigo!

m.anniversary_start_4 = Excelente! Te encontrar\u00e9 cerca de la salida una vez que \
  hayas terminado con ellos. Ten cuidado, ellos parecen haberse adaptado al uso de velas de \
  cumplea\u00f1os como armas\u2026

r.anniversary_start_4 = Terminar conversaci\u00f3n

# Mission End


m.anniversary_end_1 = {0}! Lo hiciste! Tengo mi cocina de vuelta!\n\
  \n\
  Recuerda, puedes intercambiar las Rebanadas de Pastel que recibas por incre\u00edbles yelmos \
  de pastel de Maskwell en la Plaza Central de Haven. Es como el viejo dicho de los pasteleros. \
  'Viste la piel de tus enemigos ca\u00eddos para probar tu poder\u00edo de guerrero!'\n\
  \n\
  Ok, tal vez solo yo digo eso.

r.anniversary_end_1 = Terminar conversaci\u00f3n

# Gremlin Chef finale

m.anniversary_gremlin_1a = Un trozo de Moonstone, una pizca de... C... C\u00f3mo has...  Qui\u00e9n eres!?   No deber\u00edas estar aqu\u00ed!

m.anniversary_gremlin_1b = Fuera, fuera, fueeeera! Demasiados cocineros en la \
  cocina! Demasiados cocineros en la cocina!

m.anniversary_gremlin_2 = Qu\u00e9 est\u00e1s haciendo!? Mis pasteles! Mis bellos pasteles! Inaceptable!

m.anniversary_gremlin_3 = Booorboteo! Cuanta fuerza! Ser\u00e1s consumido y \
  tu poder se a\u00f1adir\u00e1 al m\u00edo!

m.anniversary_gremlin_4a = Tu... yo... Qu\u00e9 fue eso? Dijiste algo?

r.anniversary_gremlin_4a = Biscotti me pidi\u00f3 que viniera a ver como estabas.

m.anniversary_gremlin_4b = Oh no! Dile que los pasteles estar\u00e1n listos. Erm, s\u00f3\
  lo estoy un poco atrasado.  Har\u00e9 un trato contigo: Te dar\u00e9 m\u00e1s pasteles si \
  puedes mantener esto solo entre tu y yo. No quiero que me saquen de la fiesta.

