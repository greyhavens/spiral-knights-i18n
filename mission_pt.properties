  una serie de 'oficinas' devilite por todos los Clockworks, y generalmente se encuentran en \
  los restos de una ciudad alien\u00edgena.\n\
  \n\
  Los an\u00e1lisis de los datos recolectados de estas oficinas indican que las corporaciones \
  devilites est\u00e1n subcontratadas por gremlins para poder dise\u00f1ar y manejar diversos \
  proyectos que incluyen armas dise\u00f1adas espec\u00edficamente para tener como blanco a los \
  escuadrones de cavaleiros Spiral.\n\
  \n\
  Es hora de darles su carta de despido a estos devilites y de cancelar sus demon\u00edacos proyectos.

