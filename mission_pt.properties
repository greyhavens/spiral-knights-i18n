m.toxic_plant_1a = Muy bien, soldados, escuchen! - tenemos \u00f3rdenes de infiltrarnos \
  en la f\u00e1brica de armas biol\u00f3gicas gremlin manejada por un miembro de su 'Orden \
  Crimson' conocido como  'Herex.'  Esta es solo una manera elegante de decir que a uno de los \
  locos m\u00e1s locos de los gremlins locos le gusta cargar sus pistolas con balas poco \
  convencionales.\n\
  \n\
  No sabemos lo que han estado cocinando all\u00e1 abajo as\u00ed que \u00e1rmense bien y no se \
  olviden de ponerse una m\u00e1scara. Si Herex se parece en algo a Seerus, es probable que \
  atrapen algo m\u00e1s que un resfriado all\u00e1 abajo.\n\
  \n\
  Vamos de paseo, Soldados!
r.toxic_plant_1a = (Terminar conversaci\u00f3n)

n.toxic_plant_2a = Memor\u00e1ndum Secreto

m.toxic_plant_2a = Una orden oficial de Herex, el Veneno Susurrante:\n\
  La producci\u00f3n del Compuesto 42 debe cesar inmediatamente.  A\u00fan cuando es un veneno \
  formidable y sin duda es \u00fatil para lograr un... poder 'm\u00e1s alto' en la Orden, \
  parece que ha formado una intescolhancia mucho m\u00e1s all\u00e1 del alcance de una biotoxina \
  est\u00e1ndar.

r.toxic_plant_2a = (Continuar leyendo)

m.toxic_plant_2b = Todos los rastros del Compuesto 42 deben ser eliminados, junto con la f\u00e1\
  brica y cualquier ingeniero que no sea parte del c\u00edrculo interno. Recuerden a los \
  lanzallamas que no se encuentren c\u00f3modos con estas directivas que aquellos que \
  desobedezcan escuchar\u00e1n muy pronto mi susurro en sus o\u00eddos.\n\
  \n\
  Sellen las puertas y quemen todo hasta los cimientos.

r.toxic_plant_2b = (Terminar lectura)

