m.plan_of_attack = Plan de Ataque
o.plan_of_attack = Recobra las esquem\u00e1ticas Gremlin en el laboratorio de pruebas secreto.
b.plan_of_attack = Muy profundo en el interior de la t\u00f3xica caverna se encuentra un \
  laboratorio de pruebas que los gremlins han estado usando como campo de pruebas para los \
  componentes del Proyecto R. Se reporta que uno de estos componentes en desarrollo tiene las \
  esquem\u00e1ticas de un proyecto cercano.\n\
  \n\
  Si esto es verdad es muy probable que haya una terminal de alg\u00fan tipo cerca de uno de \
  los componentes del Proyecto R. Localiza la terminal y recupera el esquem\u00e1tico para su an\u00e1\
  lisis. Esto debe aclarar la naturaleza exacta del Proyecto R.

m.high_temperature_hostages = Rehenes de Alta Temperatura
o.high_temperature_hostages = Rescata a los cavaleiros que han sido capturados en la abrasadora \
