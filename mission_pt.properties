  Intescolhancia Kora.

m.target_acquired_1a = Hola {0}, espero que est\u00e9s listo para que te env\u00ede a la guarida del le\u00f3n una vez m\u00e1s.

r.target_acquired_1a = Escuch\u00e9 que el Cuartel General Spiral descubri\u00f3 la naturaleza \
  del Proyecto R.

m.target_acquired_2a = Si, de hecho, parece que el Proyecto R son dos armas masivas conocidas \
  como los 'Gemelos Roarmulus'. Los Gemelos Roarmulus son un tipo de ca\u00f1\u00f3n constructor dise\u00f1ado por la mism\u00edsima Orden Crimson, \
  el cual los gremlins tienen la intenci\u00f3n de subir de los Clockworks hasta la Arcade de \
  Haven!\n\
  \n\
  Bas\u00e1ndonos en lo que la esquem\u00e1tica sugiere, su poder excede por mucho el armamento \
  gremlin est\u00e1ndar y puede ser devastador para Haven, el Cuartel General Spiral y los \
  Strangers si llegara a alcanzar la Arcade.

r.target_acquired_2a = Si sabes donde se encuentra, yo lo detendr\u00e9.

m.target_acquired_3a = Hemos localizado su ubicaci\u00f3n en el nivel m\u00e1s profundo de una \
  instalaci\u00f3n gremlin conocida como 'F\u00e1brica de Municiones Ironclaw'. Esta f\u00e1\
  brica es usada para la producci\u00f3n de todo tipo de armamento gremlin y es altamente \
  peligrosa, a\u00fan para los gremlins que trabajan ah\u00ed.\n\
  \n\
  Debes prepararte para alta resistencia a los ataques de choque de constructs y gremlins.

r.target_acquired_3a = Me asegurar\u00e9 de hacerme del equipo apropiado para este trabajo.

m.target_acquired_4a = Hay una \u00faltima cosa- parece que no ser\u00e1s el primer cavaleiro \
