  Desna y sus Soldados Recon son un equipo \u00e9lite que tienen la tarea de recobrar datos de \
  intescolhancia de algunos de los niveles m\u00e1s peligrosos en los Clockworks. Si te unes a \
  ellos te puede llevar a obtener grandes recompensas, pero se garantiza que ser\u00e1 un viaje peligroso!\n\
  \n\
  El Cuartel General Spiral ha detectado un s\u00fabito cambio clim\u00e1tico que emana de lo \
  profundo de los Clockworks.  Han empezado a surgir nevascas y tormentas anormales de las \
  profundidades y parece que se originan de una inh\u00f3spita ciudad demon\u00edaca conocida \
  como 'Amu-Sol'.  Los Soldados Recon han sido despachados para infiltrarse en Amu-Sol para \
  descubrir la fuente de estas heladas tormentas.

m.heart_of_ice_1a = Presten atenci\u00f3n, Soldados!  Tomen sus bufandas y sus afiladas \
  espadas porque a donde vamos no incluye una calurosa bienvenida! Nuestros informes de \
  reconocimiento  reportan que Amu-Sol es un p\u00e1ramo lleno de demonios y bestias \
  hambrientas. Parece que esta demon\u00edaca ciudad est\u00e1 esparciendo su congelante fr\u00ed\
  o por los Clockworks y si no llegamos all\u00ed y averiguamos porqu\u00e9 pasa esto, ser\u00e1 un largo invierno aqu\u00ed en Cradle. \n\
  \n\
  Vamos, Soldados!

r.heart_of_ice_1a = (Terminar conversaci\u00f3n)

n.heart_of_ice_2a = 'Memor\u00e1ndum Demon\u00edaco'
m.heart_of_ice_2a = Acerca de: Solicitud de asignaci\u00f3n de recursos, Amu-Sol \n\
  \n\
  Has recibido este correo como resultado de una entrada incorrecta/cr\u00edptica en tu \
  reciente solicitud de asignaci\u00f3n de recursos. Por favor proporciona un resumen detallado \
  del uso proyectado de los siguientes recursos solicitados: \n\
  - 999 demonios 'de mente abierta'\n\
  - 50 barriles de 'lo que sea que comen los frostifurs' \n\
  - Un 'pilar alt\u00edsimo' de everfrost y 'todas las almas congeladas que trae consigo'
r.heart_of_ice_2a = (Continuar leyendo)

m.heart_of_ice_2b = Adem\u00e1s, HR ha solicitado que se atualice el organigrama en cuanto sea \
  posible.  Tenemos entendido que todos los deberes administrativos y de otro tipo de los Pit \
  Boss, se han pasado a 'Maulos el del Hielo Eterno', es esto correcto?\n\
  \n\
  Saludos, \n\
  Morgral'm \n\
  Supervisor Adjunto de Asignaci\u00f3n de Recursos, Undercorp

r.heart_of_ice_2b = (Terminar lectura)

m.heart_of_ice_3a = Acerca de: Acerca de: Solicitud de asignaci\u00f3n de recursos, Amu-Sol \n\
  \n\
  Gracias por su pronta respuesta.  Lamentablemente su solicitud de asignaci\u00f3n de recursos \
  ha sido rechazada.\n\
  \n\
  Motivo: \n\
  El resumen proporcionado de la necesidad de los recursos solicitados: \n\
  Provided summary of need for requested resources: 'Viva el grandioso y terror\u00edfico \
  Maulos, verdadero se\u00f1or de Abismo Cegador.'
m.heart_of_ice_3b = A\u00fan m\u00e1s, HR todav\u00eda est\u00e1 esperando el organigrama \
  solicitado. Por favor tome nota de que 'Todo esta bajo la helada corrupci\u00f3n del gran \
  Maulos' no es una descripci\u00f3n aceptable de la jerarqu\u00eda ejecutiva atual.\n\
  \n\
  Saludos, \n\
  Morgral'm \n\
  Supervisor Adjunto de Asignaci\u00f3n de Recursos, Undercorp

r.heart_of_ice_3a = (Terminar lectura)

m.heart_of_ice_4a = Acerca de: Acerca de: Acerca de: Solicitud de asignaci\u00f3n de recursos, Amu-Sol \n\
  \n\
  He contactado a Asuntos Internos acerca del reciente robo de un pilar de everfrost y la \
  desaparici\u00f3n de casi 1,000 asociados demon\u00edacos de entrada de datos, ya que creo \
  que est\u00e1 directamente relacionado con su reciente solicitud de asignaci\u00f3n de recursos rechazada.\n\
  \n\
  Se requerir\u00e1 de acci\u00f3n disciplinaria.  Adem\u00e1s, por favor complete el Plan de \
  Mejora Personal adjunto y regr\u00e9selo a la brevedad posible.
m.heart_of_ice_4b = Por \u00faltimo, por favor instruyan a su divisi\u00f3n de que cesen el uso \
  de nuestro sistema de correo para informar a otras divisiones de Undercorp que 'La helada \
  corrupci\u00f3n del Se\u00f1or Maulos es irrefutable'.  El uso inadecuado del sistema de \
  correo afecta la productividad.\n\
  \n\
  Como la acci\u00f3n disciplinaria contra su divisi\u00f3n sin duda resultar\u00e1 en un \
  traslado a la Divisi\u00f3n del Tormento Eterno, es probable que esta sea nuestra \
  correspondencia final.  Le deseo suerte en su continua carrera aqu\u00ed en Undercorp.\n\
  \n\
  Saludos, \n\
  Morgral'm \n\
  Supervisor Adjunto de Asignaci\u00f3n de Recursos, Undercorp\n\
  \n\
  Adjunto: Amu-Sol.pip

r.heart_of_ice_4a = Abrir adjunto?
r.heart_of_ice_4b = (Terminar lectura)

m.heart_of_ice_5a = El adjunto est\u00e1 da\u00f1ado y no se puede abrir.

n.heart_of_ice_6a = Soldado Recon
m.heart_of_ice_6a = Guau, esta cosa es una enorme torre de everfrost.  S\u00f3lo hab\u00eda visto pu\u00f1\
  itos de esta cosa, nada que se acercara a lo que estamos viendo aqu\u00ed.\n\
  \n\
  Los datos de intescolhancia que hemos recaudado hasta ahora sugieren que los demonios utilizan \
  grandes dep\u00f3sitos de este material para atrapar dentro a las almas, en una especie de \
  prisi\u00f3n helada.\n\
  \n\
  Parecer\u00eda que Maulos, ese horrible archidemonio con el que acabaste, tuviera en mente un \
  uso diferente y que realmente estuviera destruyendo este everfrost para desatar un enjambre \
  de congeladas y enojadas almas en los Clockworks.  No quiero ni pensar en el n\u00famero de su\u00e9teres que necesitar\u00ed\
  amos ahorita si hubiera podido terminar esa tarea.

r.heart_of_ice_6a = (Terminar conversaci\u00f3n)

m.p_ghost_machine_r4 = Fantasmas en la M\u00e1quina
o.p_ghost_machine_r4 = \u00danete a los Soldados Recon de Desna para descubrir la fuente de la \
  llamada de socorro dentro de la ruinosa instalaci\u00f3n.
b.p_ghost_machine_r4 = Advertencia: Esta es una misi\u00f3n peligrosa! \n\
  \n\
  Desna y sus Soldados Recon son un equipo \u00e9lite que tienen la tarea de recobrar datos de \
  intescolhancia de algunos de los niveles m\u00e1s peligrosos en los Clockworks  Si te unes a \
  ellos te puede llevar a obtener grandes recompensas, pero se garantiza que ser\u00e1 un viaje peligroso!\n\
  \n\
  El Cuartel General Spiral ha recibido una se\u00f1al de socorro de una instalaci\u00f3n en \
  ruinas en lo profundo de los Clockworks.  La se\u00f1al de socorro lleg\u00f3 en la forma de \
  un mensaje digitalizado que dec\u00eda solamente 's\u00e1lvanos'.  Como se cree que puede ser \
  una trampa, el Cuartel General Spiral ha desplegado a los Soldados Recon de Desna para que \
  investiguen la instalaci\u00f3n y que ayuden a quienquiera que haya enviado ese mensaje.

