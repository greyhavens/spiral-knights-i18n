b.p_moorcroft1 = Alguien o algo ha convocado una horda de kats negros malditos en los \
  Clockworks. Estas sombr\u00edas bestias ans\u00edan el poder arcano y han asaltado la valiosa \
  colecci\u00f3n de grimorios m\u00e1gicos de los Archivos de Moorcroft Manor.\n\
  \n\
  Estos tomos antiguos en las manos equivocadas pueden ser catastr\u00f3ficos, pero resulta que \
  los kats negros no pueden leer, as\u00ed que decidieron com\u00e9rselos.\n\
  \n\
  Los residentes de Moorcroft Manor desean que recuperes estas P\u00e1ginas Antiguas de los \
  grimorios m\u00e1gicos pero que probablemente se ubican en los est\u00f3magos de los kats \
  negros. Te dejaremos la tarea de averiguar c\u00f3mo recuperarlos...\n\
  \n\
  Para esta misi\u00f3n, viaja a las profundidades de una alcantarilla podrida donde los datos \
  de intescolhancia han ubicado el nido de los kats negros. Recobra esas P\u00e1ginas \
  Antiguas y regresa a Moorcroft Manor!

