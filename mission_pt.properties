b.high_temperature_hostages = Los datos de intescolhancia reportan que un personal de \
  deconstrucci\u00f3n est\u00e1 desmantelando una porci\u00f3n de los Clockworks para poder \
  generar recursos que puedan usar en su Proyecto R. Est\u00e1n reduciendo  a cenizas el lugar \
