# RANK 1-1
m.first_contact = Primer Contacto
o.first_contact = Contacta al Agente de Intescolhancia Kora v\u00eda Comlink
b.first_contact = Has escapado de la c\u00e1psula de aterrizaje que se ha estrellado y has \
  llegado al Campamento de Rescate en el momento en que el sol se pone por el paisaje alien\u00ed\
  gena. Ahora es el momento de establecer contacto con el Cuartel General Spiral usando tu \
  Comlink.

m.first_contact_1a = Saludos {0}, este es el Agente de Intescolhancia Kora confirmando el \
  contacto con el Cuartel General Spiral. Ser\u00e9 tu enlace principal con el Cuartel General \
  Spiral durante el tiempo que est\u00e9s aqu\u00ed en Cradle y te dar\u00e9 datos de \
  intescolhancia para las muchas y peligrosas misiones que te esperan.\n\
  \n\
  La briefing sobre los resultados de tu entrenamiento en el Alondra sugiere que \
  estar\u00e1s bien preparado para lo que est\u00e1 por venir. Espero con gusto nuestro trabajo \
  juntos.

r.first_contact_1a = Suena bien, Kora, qu\u00e9 es lo que sigue?

m.first_contact_2a = Est\u00e1s ansioso, eso es bueno. Tu misi\u00f3n atual es llegar al \
  pueblo de Haven que es donde el Cuartel General Spiral tiene su base de operaciones. Pasa el \
  tiempo que desees dentro del Campamento de Rescate para que te prepares para el viaje que est\u00e1 por venir.\n\
  \n\
  Usa a cualquiera de los mercaderes ambulantes as\u00ed como el conocimiento de otros \
  cavaleiros en el campamento para aprender como sobrevivir en el novo mundo. Te contactar\u00e9 \
  de novo una vez que llegues a Haven.\n\
  \n\
  Te deseo la mejor de las suertes.

r.first_contact_2a = Voy en camino.

m.abandoned_depot = El Dep\u00f3sito Abandonado
o.abandoned_depot = Aprende las reglas b\u00e1sicas de supervivencia en el Dep\u00f3sito Abandonado.
b.abandoned_depot = Los cavaleiros que se encuentran en el Campamento de Rescate han convertido \
  un edificio abandonado bajo la superficie de Cradle en una estaci\u00f3n de entrenamiento \
  para ayudar a ense\u00f1ar a los novos reclutas las bases de supervivencia dentro de los \
  Clockworks. Ten cuidado! Como es parte de los Clockworks es muy probable que est\u00e9 \
  habitado por todo tipo de monstruos. Mantente alerta!

# Rhendon RC
#...................................................................................................

m.securing_camp = Si Decides Aceitar
b.securing_camp = Antes de que intentes investigar las profundidades infestadas de monstruos \
  bajo el Campamento de Rescate, Rhendon quiere ponerte al tanto acerca de c\u00f3mo hacer \
  misiones para el Cuartel General Spiral.
o.securing_camp = Encuentra a Rhendon y habla con el para ganar acceso a las misiones.

m.securing_camp_1a = Pues bien, parece que estamos en problemas aqu\u00ed, {0}. Hay mucho \
  trabajo por hacer antes de que este campamento est\u00e9 listo y funcionando, as\u00ed \
  que ahora has sido autorizado para receber misiones! Puedes encontrar misiones disponibles en \
  la barra de Actividades.

r.securing_camp_1a = Miss\u00f5es?

m.securing_camp_2a = Las misiones van desde peligrosas incursiones de combate hasta hablar con \
  ciertas personas como yo. Al concluir estas misiones, progresar\u00e1s hasta alcanzar novos \
  rangos, los cuales te dar\u00e1n acceso a equipo a\u00fan m\u00e1s poderoso. \n\
  \n\
  Greta me ha informado que te har\u00e1s cargo del problema que tenemos con la falta de poder \
  en el Generador Antiguo, es correcto?

r.securing_camp_2a = Si, eso es correcto.

m.securing_camp_3a = Bueno, mantente alerta. Si la superficie de este mundo pulula de \
  monstruos, qui\u00e9n sabe lo que encontrar\u00e1s all\u00e1 abajo en la oscuridad!

r.securing_camp_3a = Gracias, Rhendon. Tendr\u00e9 cuidado.

m.securing_camp_4a = Recuerda aceptar la misi\u00f3n y ten cuidado all\u00e1 abajo!

r.securing_camp_4a = Terminar conversaci\u00f3n

#Old securing camp dialog
m.rc_buddyknight_1a = {0}!  Escuch\u00e9 que te han seleccionado para salvar el d\u00eda, \
  eh?  Bueno, antes de que te me vuelvas todo 'h\u00e9roe' y te vayas a la oscuridade all\u00e1 abajo, por qu\u00e9 \
  no vamos tu y yo al otro lado del campamento y les damos una lecci\u00f3n a los monstruos que \
  arrasaron este campamento anoche?

r.rc_buddyknight_1a = Seguro, me apunto.

# [proto bomb image]
m.rc_buddyknight_2a = Bien, entonces necesitas una de estas!  Es una Proto Bomb y \
  sirve para hacer que las cosas hagan bum! \n\
  \n\
  Ten\u00eda una de m\u00e1s en mi c\u00e1psula, as\u00ed que consid\u00e9rala un recompensa \
  anticipada por salvar nuestro pellejo.

# (Rhendon gives you a Proto Bomb)

r.rc_buddyknight_2a = Gracias Rhendon, esto me ser\u00e1 \u00fatil!

m.rc_buddyknight_3a = Vamos a darle buen uso de una vez. \n\
  \n\
  Puedes aceptar misiones haciendo clic en el bot\u00f3n 'Miss\u00f5es' en la parte de arriba de la \
  pantalla y aceptar la misi\u00f3n que te he dado.

r.rc_buddyknight_3a = Terminar conversaci\u00f3n

m.rc_buddyknight_4a = Acepta mi misi\u00f3n y vamos a explotar cosas!

r.rc_buddyknight_4a = Terminar conversaci\u00f3n

# After you complete the mission
m.rc_buddyknight_5a = Parec\u00eda que el mismo mundo intentaba atraparte all\u00e1 atr\u00e1s, estuvo cerca!\n\
  \n\
  Mantente alerta cuando vayas a explorar el Generador Antiguo. Si la superficie de este mundo \
  est\u00e1 pululando con monstruos y llena de trampas, quien sabe lo que encontrar\u00e1s all\u00e1 abajo en las oscuridad!

r.rc_buddyknight_5a = Gracias Rhendon, tendr\u00e9 cuidado.

m.securing_camp_b = Asegurando el Campamento
o.securing_camp_b = Ayuda a Rhendon a destruir los monstruos que invadieron el Campamento \
  de Rescate!
b.securing_camp_b = Antes de que intentes investigar las profundidades infestadas de monstruos \
  bajo el Campamento de Rescate, a Rhendon le gustar\u00eda que trataras de ayudarlo a eliminar \
  algunos de los monstruos que atacaron el Campamento de Rescate anoche.

m.securing_camp_b_1a = Ah\u00ed est\u00e1s, {0}!  Comenzaba a pensar que no ibas a \
  venir!\n\
  \n\
  Bueno, pongamos manos a la obra para asegurar este lugar.  Pero primero, necesitas equipar el \
  Proto Bomb que te he dado. Encam\u00ednate a la Estaci\u00f3n de Arsenal detr\u00e1s de mi y equ\u00edpala.

r.securing_camp_b_1a = Ir\u00e9 a la Estaci\u00f3n del Arsenal y equipar\u00e9 mi Proto Bomb!

#[arsenal station highlights]

#[bomb category highlights]

#[proto bomb highlights]

#[image of uncharged to charged states]
m.securing_camp_b_2a = Excelente!  Ahora, una lecci\u00f3n r\u00e1pida acerca de los \
  ataques cargados.\n\
  \n\
  Los ataques cargados se pueden hacer con cualquier arma al mantener pulsado el bot\u00f3n \
  ATACAR y esperando a que el aura de carga alcance su carga m\u00e1xima.  Te puedes \
  seguir moviendo por todos lados mientras cargas!

r.securing_camp_b_2a = Bueno, y despu\u00e9s qu\u00e9?

#[image of gun and sword charge attacks]
m.securing_camp_b_3a = Una vez que el aura de carga haya alcanzado su carga m\u00e1xima, libera el bot\u00f3\
  n de ATACAR y desata un ataque devastador!

r.securing_camp_b_3a = Bastante sencillo, qu\u00e9 m\u00e1s?

#[image of bomb charging and explosion]
m.securing_camp_b_4a = Las bombas son especiales en el sentido de que no tienen un ataque est\u00e1ndar.  Una bomba S\u00d3\
  LO se puede usar como ataque cargado, as\u00ed que aseg\u00farate de ser m\u00e1s h\u00e1\
  bil que los monstruos mientras cargas!

r.securing_camp_b_4a = Entendido, Rhendon.

m.securing_camp_b_5a = Bueno, practica unos cuantos ataques de bomba y encam\u00ednate ah\u00ed \
  para destruir a esos monstruos!

r.securing_camp_b_5a = Suena como todo un bombazo!

#As the player enters the room, a monster door appears behind them.  Focus on Rehndon at the door:
m.securing_camp_b_6a = Algo ha pasado!  Esa puerta apareci\u00f3 detr\u00e1s tuyo como una trampa!\n\
  \n\
  Defi\u00e9ndete, {0}!

#The player destroys all the monsters.
m.securing_camp_b_7a = Qu\u00e9 rayos fue eso?  De donde sali\u00f3 esa puerta? \n\
  \n\
  Pareciera que este mundo mec\u00e1nico bajo nuestros pies la trae en nuestra contra, {0}. Mantente alerta! \n\
  \n\
  De cualquier manera, creo que esta \u00e1rea est\u00e1 segura, al menos hasta que caiga la \
  noche.  Regresemos al campamento.

r.securing_camp_b_7a = Terminar conversaci\u00f3n

# RANK 1-2

m.crossing_chasm = Cruzando el Precipicio
o.crossing_chasm = Cruza el peligroso abismo y contacta al el Cuartel General Spiral en Haven
b.crossing_chasm = Para poder llegar a la base de operaciones del Cuartel General Spiral en \
  Haven deber\u00e1s bajara a los Clockworks y cruzar un enorme precipicio. El viaje ser\u00e1 \
  peligroso y se recomienda que tengas todo lo que necesitas antes de partir.\n\
  \n\
  Al concluir esta misi\u00f3n dejar\u00e1s el Campamento de Rescate atr\u00e1s.

m.first_contact_b = Primer Contacto
o.first_contact_b = Contacta al Cuartel General Spiral v\u00eda Comlink
b.first_contact_b = Ahora que la energia ha sido restaurada en el Campamento de Rescate, \
  puedes usar tu Comlink para contactar al Cuartel General Spiral e investigar donde se han \
  ubicado despu\u00e9s de que el Alondra se estrellara.  \n\
  \n\
  Una vez que hagas contacto con el Cuartel General Spiral esperemos que averig\u00fces lo que caus\u00f3 \
  el accidente y la naturaleza de este mundo extra\u00f1o que ahora habitas.

m.first_contact_b_1a = Este es el Agente de Intescolhancia Kora del Cuartel General Spiral! \
  Hemos recibido una se\u00f1al de auxilio desde tus coordenadas, me escuchas?

r.first_contact_b_1a = Este es {0} del Alondra. Te escucho fuerte y claro, Kora.

m.first_contact_b_2a = Me da gusto conocerte, {0}.  Cu\u00e1l es tu situaci\u00f3n?

r.first_contact_b_2a = (Decirle a Kora acerca del Generador Antiguo, Razwog y el misterioso \
  Artefacto.)

m.first_contact_b_3a = Guau, suena como que ya tuviste una gran aventura, {0}!  El \
  Cuartel General Spiral ciertamente va a estar interesado en ese artefacto que has recobrado.  \
  Es extraordinario que hayas podido enfrentarte contra un Gremlin en los Clockworks y que \
  hayas sobrevivido.

r.first_contact_b_3a = Gremlin?  Los Clockworks?

#[image of gremlins in the Clockworks]
m.first_contact_b_4a = Parece que te tengo que poner al d\u00eda.  Nos hemos estrellado en un \
  planeta conocido como 'Cradle.'  Cradle es un mundo fascinante y en el interior del planeta \
  bajo la superficie hay un complejo mec\u00e1nico siempre cambiante llamado los 'Clockworks'.\n\
  \n\
  Al parecer los Clockworks han sido construidos por 'gremlins,' una raza peluda de monstruos \
  mal\u00e9volos que no han tomado nuestra presencia amablemente.

r.first_contact_b_4a = Quiero ayudar en todo lo que pueda.  D\u00f3nde est\u00e1 ubicado \
  ahora el Cuartel General Spiral?

#[image of RC map leading to Haven]
m.first_contact_b_5a = Descubrimos un pueblo conocido como 'Haven' y ah\u00ed establecimos \
  nuestra base de operaciones. Los locales nos han dado comida, abrigo y energia.  No es \
  Isora, pero por ahora es nuestro hogar. \n\
  \n\
  He localizado con exactitud donde te encuentras.  Sin embargo, tendr\u00e1s que cruzar un \
  enorme precipicio para poder llegar a Haven.  Tal vez ahora que tu campamento tiene energia podr\u00e1s encontrar por ah\u00ed alg\u00fa\
  n elevador hacia los Clockworks.  Puede que sea posible llegar con nosotros de esa manera.

r.first_contact_b_5a = Gracias Kora, voy a intentar encontrar un camino por el precipicio hasta \
  Haven.

m.first_contact_b_6a = Por lo que he escuchado, si alguien puede hacerlo eres tu, {0}!  Buena suerte!

r.first_contact_b_6a = Terminar conversaci\u00f3n

# RANK 1-3
m.ancient_generator = El Generador Antiguo
o.ancient_generator = Explora el Generador Antiguo y restaura la energia en el \
  Campamento de Rescate antes de que caiga la noche!
b.ancient_generator = El Campamento de Rescate no tiene energia y por eso, no tiene medios \
  de defenderse de la arremetida de los monstruos que lo atacan en la noche.  Con el sol poni\u00e9ndose tan r\u00e1\
  pido, depende de ti entrar a las oscuras profundidades bajo el campamento para localizar el \
  Generador Antiguo.\n\
  \n\
  Si puedes restaurar la energia en el Campamento de Rescate , los Cavaleiros Spiral podr\u00e1\
  n encender sus torretas y crear un per\u00edmetro defensivo. Una vez que est\u00e9 seguro, ser\u00e1 \
  posible volver a hacer contacto con el Cuartel General Spiral.

m.ancient_generator_1a = Qu\u00e9 tenemos aqu\u00ed? M\u00e1s criaturitas que \
  llegaron del cielo?  Vienen a tomar mi poder y a perturbar mi investigaci\u00f3n? \n\
  \n\
  Nadie interrumpe el trabajo del gran Conspirador Razwog!  Me encargar\u00e9 de \
  que nunca salgan vivos de aqu\u00ed!

m.ancient_generator_2a = Desagradable cosilla! No te atrevas a tocar ese artefacto! \n\
  \n\
  Argh!  Regresar\u00e9 por ti!

# RANK 1-4
m.crossing_chasm_b = Cruzando el Precipicio
o.crossing_chasm_b = Cruza el peligroso precipicio con Rhendon y descubre un camino hacia Haven
b.crossing_chasm_b = Ahora que has restaurado la energia en el Campamento de Rescate y que \
  has establecido contacto con el Cuartel General Spiral, es el momento de que intentes cruzar \
  el precipicio y llegues a Haven donde el resto de los Cavaleiros Spiral se han refugiado.\n\
  \n\
  Para poder cruzar el precipicio necesitas bajar a los Clockworks en un elevador y encontrar \
  otro que te suba al otro lado.  No hay manera de saber que peligros acechan en las oscuras \
  profundidades, as\u00ed que Rhendon te acompa\u00f1ar\u00e1 en tu traves\u00eda.

n.arsenal_knight = T\u00e9cnico
m.arsenal_knight_1a = Puedes usar la Estaci\u00f3n de Arsenal detr\u00e1s de mi para cambiar tu \
  equipo. Una vez que vayas a los Clockworks, solo podr\u00e1s cambiar tu armamento equipado en \
  una Estaci\u00f3n de Arsenal como esta, as\u00ed que ser\u00e1 mejor que est\u00e9s preparado!

r.arsenal_knight_1a = Terminar conversaci\u00f3n

m.crossing_chasm_b_1a = Pensaste que podr\u00edas simplemente irte con el artefacto?  \
  Entr\u00e9galo ahora mismo o encender\u00e9 este fusible y te convertir\u00e9 en un mill\u00f3n de peque\u00f1os pedazos quemados!

m.chasm_b_rhendon_1a = Parece que no tenemos otra opci\u00f3n, {0}.  No vale la pena morirse \
  por ese trasto.

m.crossing_chasm_b_2a = Perfecto!  Me quedar\u00e9 con el artefacto y te quemar\u00e9 \
  completamente al mismo tiempo!\n\
  \n\
  Jajaja!

m.chasm_b_rhendon_2a = Ese demonio! \n\
  \n\
  Todo este lugar se viene abajo! Necesitamos buscar la manera de apagar este fuego ahora \
  mismo!

m.crossing_chasm_b_3a = Qu\u00e9?!   Sigues aqu\u00ed?! \n\
  \n\
  Este artefacto es m\u00edo!  Ustedes miserables cavaleiros nunca tendr\u00e1n su poder!\n\
  \n\
  Tendr\u00e9 que destruirte yo mismo!

m.razwog_defeated = Hay un extra\u00f1o s\u00edmbolo carmes\u00ed en el atuendo de Razwog.

n.cryptic_coder = Codificador Cr\u00edptico
m.cryptic_coder = Conspirador Razwog: Trabaja lejos de los otros. La Orden nunca debe saber que \
  tenemos el artefacto. Encuentra la manera de darle poder. Tr\u00e1emelo ac\u00e1. No me \
  traiciones.  Yo lo sabr\u00e9.\n\
  \n\
  -H
r.end_coder = Cerrar mensaje

m.crossing_chasm_b_4a = Gracias, {0}.  Pens\u00e9 que hab\u00edan acabado con nosotros all\u00e1 atr\u00e1s.\n\
  \n\
  Llevemos el artefacto al Cuartel General Spiral antes de que alguien m\u00e1s intente agarrarlo.

m.crossing_chasm_b_5a = \u00d3rale, {0}! Veo que has adquirido una Proto Bomb! Son \
  muy \u00fatiles cuando necesitas lidiar con grupos de enemigos.

r.crossing_chasm_b_5a = C\u00f3mo la uso?

m.crossing_chasm_b_6a = Las bombas son especiales en el sentido de que no tienen un ataque est\u00e1ndar. Una bomba S\u00d3\
  LO puede ser usada como un ATAQUE CARGADO, as\u00ed que aseg\u00farate de evadir a los \
  monstruos mientras cargas!\n\
  \n\
  No dudes en probarla primero. Solo recuerda equiparla en esa estaci\u00f3n de arsenal m\u00e1s adelante.

r.crossing_chasm_b_6a = Continuar

m.crossing_chasm_b_7a = Llevar\u00e9 el artefacto al Lab.  Cuando est\u00e9s listo deber\u00ed\
  as ir a Haven a reunirte con el resto del grupo.  \n\
  \n\
  Tengo el presentimiento de que estaremos atrapados en este planeta por alg\u00fan tiempo, as\u00ed que deber\u00ed\
  amos ver lo que podemos hacer para ayudar.

r.crossing_chasm_b_7a = Terminar conversaci\u00f3n

# RANK 2-1
#RENAMED FROM get_energrized
m.welcome_to_haven = Bienvenido a Haven!
o.welcome_to_haven = Contacta al Agente de Intescolhancia Kora v\u00eda Comlink
b.welcome_to_haven = Despu\u00e9s de sobrevivir el viaje a Haven debes contactar al Agente de \
  Intescolhancia Kora v\u00eda Comlink para darle tu reporte. Ella tiene la informaci\u00f3n de \
  lo que hay que hacer despu\u00e9s, as\u00ed como instrucciones especiales del uso de la energia.

m.welcome_to_haven_1a = Lo lograste, {0}!  Me da gusto que hayas llegado sano y salvo a \
  Haven. Confirmar\u00e9 con el Cuartel General Spiral de que a partir de ahora estar\u00e1s \
  llevando a cabo misiones en Haven. \n\
  \n\
  Para empezar, te he dado unas cuantas misiones que te ayudar\u00e1n a aclimatarte con lo que \
  Haven tiene para ofrecerte. Aseg\u00farate de saludar a los Strangers en lo que empiezas a \
  explorar.

r.welcome_to_haven_1a = Strangers?

m.welcome_to_haven_2a = Los habitantes nativos de Haven son llamados 'Strangers'. No puedes \
  equivocarte al identificarlos- son esas figuras altas e imponentes que llevan m\u00e1scaras. \
  A pesar de su apariencia intimidante, han sido de mucha ayuda para nosotros y por lo general \
  se mantienen apartados. Ciertamente parece que les gustan a los peque\u00f1os y extra\u00f1\
  os pajaritos que habitan en el pueblo!

r.welcome_to_haven_2a = Me asegurar\u00e9 de saludar cuando vea a un Stranger.

m.welcome_to_haven_3a = Excelente, gracias por ser tan buen embajador!\n\
  \n\
  Por \u00faltimo, necesito que te pongas al d\u00eda con algo llamado 'energia'. Es muy \
  importante para tu misi\u00f3n aqu\u00ed en Cradle.

r.welcome_to_haven_3a = Soy todo o\u00eddos, Kora. Dime acerca de la energia!

#(image)
m.welcome_to_haven_4a = La energia es esencial para poder adquirir equipo poderoso y items del Dep\u00f3sito de Suministros.\n\
  \n\
  Encontrar\u00e1s todo tipo de usos para ella en tus traves\u00edas, solamente busca el s\u00edmbolo de la energia!

r.welcome_to_haven_4a = Continuar

m.welcome_to_haven_5a = La energia solamente se puede obtener en compras por medio de una \
  transacci\u00f3n con dinero real o en intercambio por medio del Dep\u00f3sito de Energ\u00ed\
  a.  Para comprar o intercambiar por energia, simplemente abre el Dep\u00f3sito de \
  Suministros y haz clic en 'Obtener energia'.

r.welcome_to_haven_5a = Quisiera repasar tu cursillo de energia una vez m\u00e1s.
#6a -> Repeat tutorial
r.welcome_to_haven_5b = Obtener energia y hacer cosas fant\u00e1sticas- lo tengo!

m.welcome_to_haven_6a = Te contactar\u00e9 otra vez muy pronto, buena suerte {0}!

r.welcome_to_haven_6a = Terminar conversaci\u00f3n.

#WELCOME TO HAVEN B-TEST
m.welcome_to_haven_b = Bienvenido a Haven!
o.welcome_to_haven_b = Contacta al Agente de Intescolhancia Kora v\u00eda Comlink
b.welcome_to_haven_b = Despu\u00e9s de sobrevivir el viaje a Haven debes contactar al Agente de \
  Intescolhancia Kora v\u00eda Comlink para darle tu reporte. Ella tiene la informaci\u00f3n de \
  lo que hay que hacer despu\u00e9s, as\u00ed como instrucciones especiales del uso de la energia.

