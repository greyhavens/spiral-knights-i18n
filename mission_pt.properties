  alta defensa y armas que golpean muy duro.\n\
  \n\
  Para usar las armas pesadas de manera efectiva se requiere de calcular el tiempo de ataque \
  con precisi\u00f3n y el equipo tiende a hacerte un poco m\u00e1s lento. Pero lo que \
  sacrificas en usabilidad se convierte en poder puro. El equipo en el que me especializo te \
  convertir\u00e1 en el cavaleiro en el que tu escuadr\u00f3n depender\u00e1 para mantenerse \
  vivo y enfrentar hasta el m\u00e1s feroz de los monstruos.

