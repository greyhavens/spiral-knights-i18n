n.tortodrone_1 = 'Memor\u00e1ndum Demon\u00edaco'
m.tortodrone_1a = [Todos] Recordatorio Importante para los Empleados:\n\
  \n\
  Se requiere un ID Card para entrar al \u00e1rea de pruebas. Al presentar un ID card \
  correctamente se consumir\u00e1 para dar poder al Portal Siniestro. Recuerden: "Es como las \
  lentejas, la tomas o la dejas."\n\
  \n\
  Los ID Cards que no se usen de esta manera (""perdidos, rotos o extraviados"") tendr\u00e1n \
  que ser reexpedidos por Recursos Humanos. El costo del reemplazo ser\u00e1 deducido de su pr\u00f3ximo pago y se a\u00f1adir\u00e1 \
  una marca negra a su archivo de empleado. No dejen que esto les pase. No pierdan su ID Card.\n\
  \n\
  Saludos, \n\
  Morgral'm \n\
  Supervisor de Asignaciones de Recursos, Undercorp

r.tortodrone_1a = (Terminar lectura)
