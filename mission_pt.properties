  \n\
  El arsenal de un striker se enfoca en la velocidad.  Quieres estar cerca de tu enemigo, \
  pegarles fuerte y salir de ah\u00ed.  El equipo en el que me especializo har\u00e1 de ti un \
  cavaleiro que entra directo a la batalla antes que su escuadr\u00f3n, atacando primero antes \
