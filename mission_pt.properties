m.legion_almire_1a = Nada como un revolc\u00f3n a muerte por la necr\u00f3polis embrujada para \
  hacer que la sangre fluya, cierto, Rangers?\n\
  \n\
  La necr\u00f3polis se origin\u00f3 en Almire, el reino ca\u00eddo de un se\u00f1or esto y lo \
  otro, poblaci\u00f3n: innumerables legiones de Muertos Vivientes. Aparentemente estos \
  residentes no tan vivos est\u00e1n resguardando algo que el Cuartel General Spiral desea \
  adquirir.\n\
  \n\
  Nuestra tarea es recuperar un libro especial, una pieza de una colecci\u00f3n mucho m\u00e1s vasta que nos podr\u00ed\
  a dar un mejor entendimiento de este reino maldito.  As\u00ed que agarren sus yelmos y su \
  mejor aplastazombis. No espero una c\u00e1lida bienvenida.\n\
  \n\
  V\u00e1monos, Rangers!

r.legion_almire_1a = (Terminar conversaci\u00f3n)

n.legion_almire_book = Texto del c\u00f3digo de Almire:
m.legion_almire_2a = Un extracto del recuento de Lord Brandell, Alto Canciller de Almire: \n\
  \n\
  Como mucha de su gente, la Ley y el Orden se han escapado de Almire.  S\u00f3lo la Justicia \
  se queda, pero tambi\u00e9n ella se ha retorcido tanto a causa de las llamas malditas que \
  asolan nuestro reino.  La Justicia es ahora el cetro en llamas del que fuera nuestro gran \
  Lord Vanaduke. La Justicia es r\u00e1pida, inmutable y sin misericordia.\n\
  \n\
  Mi posici\u00f3n me ha dado muchos privilegios en la vida.  Amaba la vista que ofrec\u00eda \
  mi torre,  Desde esta majestuosa altura pensaba que era el primero en dar la bienvenida a la \
  primavera, el primero en oler la vida en el aire cuando florec\u00edan las flores.

r.legion_almire_2a = (Continuar leyendo)

m.legion_almire_3a = Ahora solo el humo persiste en el aire, a\u00fan a estas grandes alturas. \
  Y el fuego, los fuegos poco naturales que parecen quemar eternamente, los fuegos que cambian \
  a\u00fan hasta a los hombres m\u00e1s piadosos en horribles pesadillas.  Se que estos fuegos \
  pronto me tomar\u00e1n a mi tambi\u00e9n.\n\
  \n\
  No dar\u00e9 al que fue mi Se\u00f1or el regalo de mi propia vida.  No es suya para que la \
  tome, para que la moldee.  Esta ser\u00e1 mi orden final.  Esta ser\u00e1 mi Justicia.

r.legion_almire_3a = (Terminar lectura)

m.p_toxic_plant_r4 = Compuesto 42
o.p_toxic_plant_r4 = Investiga la planta de armas biol\u00f3gicas gremlin
b.p_toxic_plant_r4 = Advertencia: Esta es una misi\u00f3n peligrosa! \n\
  \n\
  Desna y sus Soldados  Recon son un equipo \u00e9lite que tienen la tarea de recobrar datos de \
  intescolhancia de algunos de los niveles m\u00e1s peligrosos en los Clockworks  Si te unes a \
  ellos te puede llevar a obtener grandes recompensas, pero se garantiza que ser\u00e1 un viaje peligroso!\n\
  \n\
  El Cuartel General Spiral ha descubierto una f\u00e1brica de armas biol\u00f3gicas gremlin \
  dentro de los Clockworks.  Se cree que esta f\u00e1brica pertenece a un miembro de la Orden \
  Crimson conocido solamente como 'Herex'.  Los Soldados Recon tienen la tarea de infiltrarse \
  en la f\u00e1brica y descubrir la naturaleza de las armas biol\u00f3gicas de Herex antes de \
  que las pongan en uso.
