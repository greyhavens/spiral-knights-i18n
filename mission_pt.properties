  compensar con deliciosos dulces los problemas ocasionados.\n\
  \n\
  Celebra el Festival de la Cosecha Oscura y ayuda a los Strangers buscando al Punkin King y \
  pagando tributo. Seguramente recolectaras algunos dulces en el camino, as\u00ed que \
  visita la Plaza de Haven y c\u00e1mbialos por premios!

