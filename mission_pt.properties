m.p_halloween_r3 = La Cosecha Oscura
o.p_halloween_r3 = Busca una audiencia con el Punkin King.
b.p_halloween_r3 = Cada a\u00f1o los Strangers de Haven pagan tributo a un peculiar esp\u00ed\
  ritu conocido como el 'Punkin King' con tal de asegurar una saludable cosecha de oto\u00f1o. \
  A este travieso fantasma le encanta jogar bromas en su audiencia pero es r\u00e1pido al \
  compensar con deliciosos dulces los problemas ocasionados.\n\
  \n\
  Celebra el Festival de la Cosecha Oscura y ayuda a los Strangers buscando al Punkin King y \
  pagando tributo. Seguramente recolectaras algunos dulces en el camino, as\u00ed que \
  visita la Plaza de Haven y c\u00e1mbialos por premios!

