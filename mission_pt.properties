  \n\
  Las pistolas te permiten atacar a tus enemigos desde una distancia segura, pero no ofrecen \
  muchas opciones una vez que se te acercan. Tienes que pensar y disparar r\u00e1pido para ser \
  un buen pistolero. El equipo en el que me especializo te har\u00e1 tirador mortal y no un \
  cavaleiro tirado.

