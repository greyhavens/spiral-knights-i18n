# Desk Clerk
#...................................................................................................

n.deskclerk = Recepcionista

m.deskclerk_1a = Bienvenido a Moorcroft Manor, donde los esp\u00edritus agotados vienen a \
  descansar las piernas (si es que tienen). Si quieres pasar la noche, recuerda que giramos la \
  habitaci\u00f3n cada noventa y nueve a\u00f1os; tambi\u00e9n servimos un desayuno continental \
  por cortes\u00eda de la casa cada luna llena y no olvides que quiz\u00e1s te quedes aqu\u00ed \
  por los siglos de los siglos... \u00a1Que disfrutes de tu estancia!

r.deskclerk_1a = Mmm... \u00bfGracias?


m.moorcroft_archives_1a = Bienvenido a los Archivos de Moorcroft, viajero. Aqu\u00ed encontrar\u00e1s una ilustre colecci\u00f3\
  n de grimorios antiguos de muchos mundos ya olvidados. Es digno de verse, \u00a1lo s\u00e9!\n\
  \n\
  Eres libre de echar una ojeada pero por favor no toques - algunos de estos libros est\u00e1n llenos de un incre\u00edble poder m\u00edstico. \u00a1Podr\u00edas lastimarte!

r.moorcroft_archives_1a = Gracias, \u00a1tendr\u00e9 cuidado!

m.moorcroft_archives_2a = Oh {0}, \u00a1es horrible, verdaderamente horrible! \n\
  \n\
  Un terror\u00edfico enjambre de kats negros sali\u00f3 de alg\u00fan oscuro portal de lo \
  profundo de los Mecanismos \u00a1y ha asaltado los Archivos de Moorcroft!

r.moorcroft_archives_2a = \u00bfQu\u00e9 son los kats negros?

m.moorcroft_archives_3a = Los kats negros son las almas m\u00e1s oscuras de la antigua Tribu \
  Kat. Llevan consigo la maldici\u00f3n m\u00e1s grande de todas y sin pensar buscan devorar \
  las auras m\u00e1gicas. Este constante consumir poderes los hace incre\u00edblemente fuertes.\n\
  \n\
  Seguramente fueron atra\u00eddos por el poder que irradia de los antiguos grimorios aqu\u00ed en los Archivos.\n\
  \n\
  Por favor {0}, \u00a1debes ayudarnos a restaurar los Archivos de Moorcroft!

r.moorcroft_archives_3a = Ayudar\u00e9 todo lo que pueda, Pembrooke.

m.moorcroft_archives_4a = Entonces explora los Mecanismos y busca a esos miserables kats \u00a1y destr\u00fayelos! A\u00fa\
  n si se comieron los libros podr\u00e1s recobrar las P\u00e1ginas Antiguas. Estas p\u00e1\
  ginas se le pueden dar a Montague a cambio de recompensas. \u00a1Ay\u00fadanos y te ayudaremos!\n\
  \n\
  Los kats negros se pueden encontrar al azar cuando te encuentres con spookats en el Nivel 2 y \
  el Nivel 3 (Portales de la Arcada y Misiones). Tambi\u00e9n hay una Misi\u00f3n de Prestigio diaria \u00a1\
  que seguramente lleva al nido de los black kats!

r.moorcroft_archives_4a = \u00a1Encontrar\u00e9 a esos kats negros y recobrar\u00e9 las P\u00e1ginas Antiguas!

m.moorcroft_archives_5a = \u00a1Estupendo!  Buena suerte, {0}. La necesitar\u00e1s, los kats \
  negros son un grupo con mala suerte.

r.moorcroft_archives_5a = Terminar conversaci\u00f3n

