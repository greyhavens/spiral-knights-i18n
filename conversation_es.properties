m.mission_cogknight_camp2_g = \u00a1Si tan solo hubiera una manera de abrir esos portones!
m.mission_cogknight_camp3_a = \u00a1Entramos! \u00a1Aqu\u00ed es!
m.mission_cogknight_camp3_b = \u00a1Ten cuidado al enfrentarte al Warmaster!
m.mission_cogknight_camp3_c = Hemos pasado a trav\u00e9s de sus defensas. \u00a1Ahora est\u00e1n arrinconados!
m.mission_cogknight_camp3_d = Buena suerte ah\u00ed, \u00a1sabemos que puedes lograrlo!
m.mission_cogknight_epilogue_a = No te preocupes por Feron, sanar\u00e1 en poco tiempo.
m.mission_cogknight_epilogue_b = Y pensar... que esto pudo haber atacado a Haven.
m.mission_cogknight_epilogue_c = \u00a1La victoria es nuestra!
m.mission_cogknight_epilogue_d = Hasta ahora no hemos recuperado el cuerpo de Seerus, pero no \
