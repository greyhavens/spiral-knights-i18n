#
# Translation messages

msgbundle_class = com.threerings.projectx.client.ControlAwareMessageBundle

## GENERAL

m.please_wait = Por favor espera

# Energy Info
#...................................................................................................

n.energy_info = Caballero Energ\u00e9tico

m.energy_info_1a = \u00bfSabes cu\u00e1l es el recurso m\u00e1s importante en Cradle? \u00a1La \
  ENERG\u00cdA! As\u00ed es, amigo m\u00edo, \u00a1algo tan especial que vale la pena gritarlo a \
  los cuatro vientos! \u00bfQuieres saber m\u00e1s sobre esta cosa tan importante? \u00a1Resulta \
  que soy todo un experto en la materia!

r.energy_info_1a = Obviamente debo saber de qu\u00e9 se trata. \u00a1Cu\u00e9ntame m\u00e1s!

r.energy_info_1b = No gracias, soy feliz en la ignorancia.

m.energy_info_2a = \u00a1Fenomenal! Te lo voy a explicar en tres sencillas lecciones: qu\u00e9 es la energ\u00eda, c\u00f3mo se usa y c\u00f3mo puedes obtener m\u00e1s.

r.energy_info_2a = \u00bfQu\u00e9 es la energ\u00eda?

r.energy_info_2b = \u00bfC\u00f3mo se usa la energ\u00eda?

r.energy_info_2c = \u00bfC\u00f3mo se puede conseguir m\u00e1s energ\u00eda?

r.energy_info_2d = Tus lecciones me han llenado de energ\u00eda. \u00a1Voy a la aventura!

m.energy_info_3a = La energ\u00eda es un poder muy especial que emana constantemente del centro \
  del Core en este mundo. Es completamente estable y nunca se pierde a menos que se intercambie \
  o se gaste. (Puedes ver cu\u00e1nta energ\u00eda tienes en el m\u00f3dulo de energ\u00eda de tu arsenal.)

m.energy_info_3b = \u00a1La energ\u00eda se usa para todo tipo de cosas! Es la moneda principal \
  para comprar art\u00edculos en el Dep\u00f3sito de Suministros, te permite comprar mejoras para \
  ti, revivir en los Mecanismos cuando se te acaban los Sparks of Life, y es necesaria para formar \
  un gremio.\n\nTambi\u00e9n encontrar\u00e1s en el mundo todo tipo de dispositivos que funcionan \
  con energ\u00eda. Solo busca el s\u00edmbolo azul de energ\u00eda en el dispositivo.

m.energy_info_3c = La energ\u00eda solo puede obtenerse compr\u00e1ndola con dinero real o \
  intercambi\u00e1ndola en el Mercado de Energ\u00eda. Para comprar o intercambiar energ\u00eda, \
  solo abre el Dep\u00f3sito de Suministros y haz clic en el bot\u00f3n 'Obtener energ\u00eda'.

r.energy_info_3a = Tengo otra pregunta m\u00e1s.

r.energy_info_3b = Tus lecciones me han energizado. \u00a1Voy a la aventura, adi\u00f3s!



## TUTORIAL

# Rescue Agent
#...................................................................................................

n.tut_intro = Agente de Rescate

m.tut_intro_1a = \u00a1Bienvenido a Cradle, recluta! Siempre nos da gusto ver que un caballero \
  sobrevive a una ca\u00edda sano y salvo. Tenemos un Campamento de Rescate no muy lejos de donde \
  est\u00e1s. Te guiar\u00e9 hasta all\u00e1, pero ten lista tu espada: \u00a1hay enemigos en el \
  camino!\n
r.tut_intro_1a = \u00a1Comprendido, all\u00e1 voy!


m.tut_intro2_1a = ...responde, {0}, \u00bfest\u00e1s ah\u00ed? \u00a1Habla el Caballero Recon \
  Rhendon!

r.tut_intro2_1a = Aqu\u00ed estoy, \u00bfqu\u00e9 pasa?

m.tut_intro2_2a = Acabas de estrellarte en la superficie de Cradle.  Mi c\u00e1psula de escape \
  se estrell\u00f3 justo al norte de tu posici\u00f3n.  Debemos reunirnos y encontrar el punto \
  de reuni\u00f3n m\u00e1s cercano.  \n\
  \n\
  Ten cuidado y prepara tu espada, \u00a1hay criaturas hostiles por todas partes!

r.tut_intro2_2a = Entendido, Rhendon. \u00a1Voy para all\u00e1!


m.tut_intro3_1a = \u00a1{0}!  \u00a1Me da mucho gusto verte!  Este lugar es tan extra\u00f1o \
  que estoy feliz al ver un rostro familiar y no otro hostil.

r.tut_intro3_1a = Tambi\u00e9n me da gusto verte, Rhendon.  \u00bfD\u00f3nde est\u00e1n los \
  otros sobrevivientes?

m.tut_intro3_2a = Establec\u00ed un comlink con unos Caballeros que han formado un Campamento \
  de Rescate all\u00e1 adelante.  Si te enfilas hacia el norte, eventualmente llegar\u00e1s.\n\
  \n\
  Me voy a quedar aqu\u00ed por ahora para ubicar a otros caballeros que se hayan estrellado en \
  esta zona.  Te ver\u00e9 en el Campamento de Rescate al atardecer. \n\
  \n\
  \u00a1Y si encuentras algo verdaderamente peligroso, pulsa [[?DEFEND]] para usar tu escudo!

r.tut_intro3_2a = \u00a1Entonces voy a reconocer el terreno! Ten cuidado, Rhendon.

m.tut_intro4_1a = Me voy a quedar aqu\u00ed por ahora para localizar a cualquier otro caballero \
  que se haya estrellado en esta \u00e1rea.  Te encontrar\u00e9 en el Campamento de Rescate al \
  norte.\n\
  \n\
  Si encuentras cualquier cosa realmente peligrosa \u00a1pulsa [[?DEFEND]] para usar tu escudo!

r.tut_intro4_1a = Ir\u00e9 a investigar lo que hay adelante. Cu\u00eddate, Rhendon.

m.tut_intro3_3a = \u00a1Buena suerte!
m.tut_intro3_3b = \u00a1Ten cuidado!
m.tut_intro3_3c = Recuerda, \u00a1pulsa [[?DEFEND]] para usar tu escudo!

# Warden Companion
#.................................................................................................
n.tut_warden = Alcaide Spiral
m.tut_warden_1a = Salutaciones, caballero. Debes ser {0}, Rhendon nos inform\u00f3 por radio que ven\u00ed\
  as en camino. Ven con nosotros, el Campamento de Rescate est\u00e1 adelante.

r.tut_warden_1a = Excelente, espero con ansia una comida caliente.

m.tut_warden_2a = Ya somos dos. Ahora vamos a- \n\nEspera, algo no est\u00e1 bien. \
  \u00a1Prep\u00e1rate, creo que tenemos compa\u00f1\u00eda!

r.tut_warden_2a = Terminar conversaci\u00f3n

m.tut_warden_3a = \u00a1Bien hecho, {0}! Al parecer sabes moverte en el campo de batalla. \n\n\
  Vamos, dirij\u00e1monos al campamento. Tal vez puedas ayudarnos a averiguar qu\u00e9 rayos \
  est\u00e1 pasando aqu\u00ed.

r.tut_warden_3a = Terminar conversaci\u00f3n

# Final Test Knight
#...................................................................................................


m.final_test_knight_1a = \u00a1Asombroso!  \u00a1Nunca pens\u00e9 que un nuevo recluta se \
  pudiera arrastrar vivo fuera de esas ruinas ardientes!  Debes ser algo especial... \n\
  \n\
  El nombre es Feron, Teniente de la Orden Spiral.  Pens\u00e1bamos que esta zona estaba \
  abandonada y en ruinas, pero de repente el elevador rugi\u00f3 de vuelta a la vida.  Mientras \
  investig\u00e1bamos todo el lugar se incendi\u00f3.\n\
  \n\
  \u00bfC\u00f3mo fue que terminaste aqu\u00ed?

r.final_test_knight_1a = (Decirle a Feron del Campamento de Rescate, Razwog y el Artefacto)

m.final_test_knight_2a = Ya veo. Esta informaci\u00f3n ser\u00e1 muy interesante para el Cuartel \
  General Spiral. Nuestro campamento base en Haven est\u00e1 un poco m\u00e1s adelante. Sube al \
  elevador y conoce a los otros caballeros que, como t\u00fa, sobrevivieron al choque. Los \
  t\u00e9cnicos del Lab estar\u00e1n ansiosos por estudiar ese artefacto. Se har\u00e1n cargo de \
  \u00e9l en cuanto llegues a Haven.\n\nNo te preocupes por los otros que quedan en el Campamento \
  de Rescate. Gracias a ti, tenemos un sistema de elevadores en funcionamiento para llegar hasta \
  ellos. \u00a1Los has salvado a todos!

r.final_test_knight_2a = Gracias, Teniente. Me enfilar\u00e9 hacia Haven.

# Rescued Stranger
#...................................................................................................

m.rescued_stranger_1a = Saludos, peque\u00f1o. Encontrar\u00e1s que hay muchos peligros en este \
  nuevo mundo, \u00a1pero tambi\u00e9n muchas oportunidades para los aventureros y los valientes! \
  Uno de los tuyos te espera un poco m\u00e1s adelante en el sendero. Sin duda nos volveremos a \
  ver. \u00a1Adi\u00f3s por ahora!
r.rescued_stranger_1a = Terminar conversaci\u00f3n


## RESCUE CAMP KNIGHTS

# Greta B
#...................................................................................................

m.rc_greet2_1a = Saludos, soy la L\u00edder de Escuadr\u00f3n Greta. T\u00fa debes ser {0}. \
  Rhendon nos dijo que te esper\u00e1ramos, y llegas justo a tiempo. Este Campamento de Rescate se \
  enfrenta a una crisis.

r.rc_greet2_1a = \u00bfCu\u00e1l es el problema, Greta?

m.rc_greet2_2a = En resumen, este campamento no tiene energ\u00eda y el sol se va a poner \
  pronto. Anoche hubo todo tipo de horribles monstruos atac\u00e1ndonos en la oscuridad.  No \
  pod\u00edamos ver nada y no ten\u00edamos una fuente de poder para nuestras torretas \
  defensivas.\n\
  \n\
  ...perdimos a muchos reclutas. \n\
  \n\
  Necesitamos canalizar la fuente de poder al Campamento de Rescate para poder establecer un \
  per\u00edmetro defensivo \u00a1antes de que caiga la noche!

r.rc_greet2_2a = \u00bfC\u00f3mo puedo ayudar a canalizar la energ\u00eda al campamento?

m.rc_greet2_3a = Nuestros esc\u00e1neres han localizado un generador antiguo bajo este campamento. \
  Deber\u00eda enviar su energ\u00eda a la superficie, pero algo parece estar desvi\u00e1ndola.\n\n\
  Necesitamos que vayas a investigar ese generador y que desv\u00edes la energ\u00eda de nuevo \
  hacia la superficie. Pero debes estar preparado: es un territorio completamente inexplorado y \
  pululan los monstruos.\n\nRhendon dijo que quer\u00eda reunirse contigo antes de esta \
  misi\u00f3n. \u00bfPor qu\u00e9 no vas a verlo primero?

r.rc_greet2_3a = Me reunir\u00e9 con Rhendon antes de investigar el generador.

m.rc_greet2_4a = Por favor {0}, ay\u00fadanos a restaurar la energ\u00eda en el Campamento de \
  Rescate para que podamos establecer un per\u00edmetro defensivo.  \u00a1No podemos darnos el \
  lujo de perder m\u00e1s reclutas a las criaturas de la noche!

r.rc_greet2_4a = \u00a1Har\u00e9 lo mejor posible!

m.rc_greet3_1a = \u00a1Has restaurado la energ\u00eda y nos has salvado a todos, {0}!  No puedo \
  agradecerte lo suficiente, todos estos reclutas te deben la vida.\n\
  \n\
  Ahora deber\u00edas intentar contactar al Cuartel General Spiral v\u00eda tu Comlink.

r.rc_greet3_1a = Terminar conversaci\u00f3n

# Rescue Camp Recruit Knights
#...................................................................................................
n.rc_recruit = Recluta
m.rc_recruit_a = Podemos no tener una fuente de energ\u00eda, pero lo menos que puedo hacer es \
  iniciar una fogata para darnos un poco de luz esta noche.

m.rc_recruit_b = No se ha podido rescatar mucho equipo de las c\u00e1psulas de aterrizaje.  Ni \
  siquiera hay suficiente para cada uno de los Caballeros en buena condici\u00f3n f\u00edsica.

m.rc_recruit_c = \u00bfPuedes creer esto?  Todo este precipicio est\u00e1 lleno de una \
  gigantesca maquinaria de alg\u00fan tipo.  Parece que no tiene fondo.\n\
  \n\
  \u00bfMe pregunto si todo el planeta es as\u00ed?

m.rc_recruit_d = Con el calor de la fogata y la seguridad de las torretas defensivas, creo que \
  dormir\u00e9 muy bien esta noche.

m.rc_recruit_e = \u00a1Puedo sentir la electricidad en el aire!  Despu\u00e9s de todo, \u00a1\
  parece que no haremos nuestra batalla final esta noche!

m.rc_recruit_f = Dicen que vas a bajar en este elevador hacia el precipicio m\u00e1s abajo. Eres much\u00edsimo m\u00e1s valiente que yo...

r.rc_recruit = Terminar conversaci\u00f3n

# Technician Knight
#...................................................................................................
n.rc_technician = T\u00e9cnico
m.rc_technician_a = De acuerdo a estos escaneos debe haber una fuente de poder en las \
  profundidades bajo el campamento, pero ha sido desviada de alguna manera...

m.rc_technician_b = Esta cosa es in\u00fatil sin energ\u00eda.  \u00a1\u00bfC\u00f3mo se supone \
  que nos podamos defender de estos monstruos?!

m.rc_technician_c = \u00a1La energ\u00eda ha regresado al campamento repentinamente!  \u00a1Lo lograste, {0}!

r.rc_technician = Terminar conversaci\u00f3n

# Injured Knight
#...................................................................................................
n.rc_injured = Caballero Herido
m.rc_injured_a = Unos monstruos terribles nos atacaron en la oscuridad anoche.  Fue un caos \
  total.  Sin una fuente de poder para encender las torretas no nos pudimos defender.\n\
  \n\
  Se perdieron tantos valientes Caballeros...

m.rc_injured_b = Uno de esos monstruos mec\u00e1nicos me atrap\u00f3.  \u00a1Las garras de esa \
  maldita cosa rasgaron a trav\u00e9s de mi armadura!

m.rc_injured_c = Gracias a ti no tendremos que enfrentar otra noche como la de anoche...

m.rc_injured_d = Con la energ\u00eda restaurada pude arreglar mi armadura.  \u00a1Espero que no \
  nos enfrentemos a muchos m\u00e1s de esos monstruosos baldes oxidados otra vez!

r.rc_injured = Terminar conversaci\u00f3n


# Nervous Knight
#...................................................................................................

n.rc_nervous = Caballero Nervioso

m.rc_nervous_1a = Quiero comprar algo con las Crowns que he conseguido en los Campos de \
  Entrenamiento, pero el mercader me da escalofr\u00edos. \u00bfQu\u00e9 esconder\u00e1 debajo de esas togas?

r.rc_nervous_1a = Fin de la conversaci\u00f3n

# Forge Knight
#...................................................................................................
n.rc_forge = Caballero de la Forja
m.forge_knight_1a = Cradle es un mundo peligroso y para poder sobrevivir, es importante \
  asegurarse que tengas equipo poderoso en tu arsenal.  Para hacerlo, necesitas usar la Forja.

r.forge_knight_1a = \u00bfQu\u00e9 es la Forja?

m.forge_knight_2a = La Forja usa el fuego que se acumula en tu equipo y lo combina con el poder \
  de los Fire Crystals para liberar su nuevo potencial.

r.forge_knight_2a = Continuar

m.forge_knight_3a = En el pueblo, puedes ganar acceso a la Forja en cualquier momento.  En los \
  Mecanismos, puedes ganar acceso a ella usando una Estaci\u00f3n de Arsenal.

r.forge_knight_3a = Continuar

m.forge_knight_4a = Cuando uses la Forja, ver\u00e1s una lista de los art\u00edculos que \
  est\u00e9n listos para nivelarse. Al seleccionar un art\u00edculo, ver\u00e1s c\u00f3mo puede \
  mejorarse.

r.forge_knight_4a = Continuar

m.forge_knight_5a = Cada art\u00edculo requerir\u00e1 un tipo espec\u00edfico de Fire Crystal. \
  Los Fire Crystals pueden obtenerse en el Dep\u00f3sito de Suministros, se pueden ganar al \
  completar ciertas misiones \u00a1y se pueden encontrar en bloques de tesoro en los \
  Mecanismos!

r.forge_knight_5a = \u00bfC\u00f3mo funcionan los Fire Crystals?

m.forge_knight_6a = Los Fire Crystals son algo inestables, as\u00ed que la cantidad necesaria para \
  forjar con \u00e9xito var\u00eda. \n\u00a1Adem\u00e1s, hemos descubierto que a\u00f1adir \
  m\u00e1s Fire Crystals da la oportunidad de obtener bonos especiales que se aplicar\u00e1n al \
  art\u00edculo! \n
r.forge_knight_6a = \u00a1Suena excelente!

m.forge_knight_7a = Ahora que sabes acerca de la Forja, \u00bfte gustar\u00eda verla?

r.forge_knight_7a = \u00a1Seguro! (Abrir la Forja)
r.forge_knight_7b = La ver\u00e9 despu\u00e9s. (Terminar conversaci\u00f3n)

# Geo Knight
#...................................................................................................

n.rc_soil = Caballero Geo

m.rc_soil_1a = Estoy recogiendo muestras geol\u00f3gicas para el Cuartel General Spiral. Por \
  ahora mis pruebas han identificado cientos de muestras diferentes de suelo en cada cent\u00ed\
  metro cuadrado bajo la superficie. Eso no puede ser posible, debo haber calculado mal...

r.rc_soil_1a = Terminar conversaci\u00f3n.

# Veteran Knights
#...................................................................................................
n.rc_vet_1 = Alcaide Spiral
n.rc_vet_2 = Caballero Veterano

m.rc_vet_1a = Gracias por tu ayuda anterior. \u00a1Cu\u00eddate!
m.rc_vet_2a = Siempre debes estar en guardia. \u00bfQui\u00e9n sabe qu\u00e9 otros peligros nos \
  esperan en este mundo?
m.rc_vet_3a = No podr\u00e9 descansar hasta que no estemos enlazados con el Cuartel General \
  Spiral.

r.rc_vet_1a = Terminar conversaci\u00f3n

# Rhendon
#...................................................................................................

m.rc_rhendon_1a = \u00bfQu\u00e9 rayos crees que es esto, {0}? Debe ser importante si ese tal \
  Razwog se enfureci\u00f3 tanto cuando se lo quitaste.\n\n\u00a1Se lo tiene merecido por tratar \
  de matarte y todo eso!

r.rc_rhendon_1a = Terminar conversaci\u00f3n

# Kinter
#...................................................................................................


m.rc_instruct_1a = Bienvenido, recluta. Siempre es bueno ver que otro caballero logra llegar al \
  Campamento de Rescate. Imagino que te est\u00e1s preparando para tu viaje a Haven. Un buen lugar \
  para comenzar es el portal a los Mecanismos que se encuentra aqu\u00ed. Simplemente \
  ac\u00e9rcate al panel de control en la parte norte del elevador y pulsa el bot\u00f3n de \
  acci\u00f3n ([[?ACTION]]).\n\n\u00bfAlguna pregunta?

r.rc_instruct_1a = \u00bfQue si tengo alguna pregunta? \u00a1Ya lo creo!

r.rc_instruct_1b = Nada de preguntas, solo acciones. Me voy a entrenar.

m.rc_instruct_2a = \u00bfQu\u00e9 m\u00e1s quieres saber?

r.rc_instruct_2a = \u00bfLos Mecanismos?

r.rc_instruct_2b = \u00bfMencionaste unos portales?

r.rc_instruct_2c = Pens\u00e1ndolo bien, mejor me voy.


m.rc_instruct_3a = Los Mecanismos son un conjunto muy complejo de engranajes y maquinarias que \
  se encuentran debajo de la superficie del mundo. Son verdaderamente impresionantes. Nos \
  encontramos en un extra\u00f1o y peligroso mundo, recluta. Ten cuidado.

m.rc_instruct_3b = Un 'portal' es un punto de acceso a los Mecanismos. Tienen la forma de los \
  elevadores que ves frente a ti. Cada portal tiene un monitor que muestra su icono exclusivo, \
  as\u00ed como un panel de control que permite al usuario entrar al portal. Este portal siempre \
  te llevar\u00e1 al mismo lugar, pero otros portales tienen pisos cambiantes debajo de ellos. \
  \u00a1En esos, nunca sabes con exactitud lo que sigue!


r.rc_instruct_3a = Tengo otra pregunta.

r.rc_instruct_3b = Gracias por la informaci\u00f3n. Me voy por ahora.


# Boomer
#...................................................................................................


m.rc_bomb_1a = \u00bfHas tenido oportunidad de probar las bombas? A diferencia de otras armas, \
  las bombas solo se pueden usar con un ataque cargado. Si las usas de otra manera se apagar\u00e1\
  n, pero si las cargas... \u00a1BUM! \u00a1Pueden hacerle serios da\u00f1os a varios monstruos \
  a la vez!

r.rc_bomb_1a = \u00a1Deben ser la bomba! Quiz\u00e1s le compre algunas al mercader ambulante.


# Cautious Knight
#...................................................................................................

n.rc_warning = Caballero Cauteloso

m.rc_warning_1a = Al subir estas escaleras est\u00e1 el portal a Haven. Aseg\u00farate de hablar \
  con Virgil antes de entrar para que sepas qu\u00e9 esperar.

r.rc_warning_1a = Entendido, hablar\u00e9 con Virgil antes de entrar.


# Sleepy Knight
#...................................................................................................

n.rc_sleepy = Caballero So\u00f1oliento

m.rc_sleepy_1a = Este entrenamiento es... agotador... solo necesito... descansar los ojos... un \
  momento...

r.rc_sleepy_1a = Terminar conversaci\u00f3n.


# Virgil
#...................................................................................................


m.rc_virgil_1a = Ten cuidado all\u00e1 adelante.

r.rc_virgil_1a = \u00bfPor qu\u00e9 es eso?

m.rc_virgil_2a = Este pasaje cruza exactamente sobre un enorme precipicio.  No quiero que vayas \
  a salir volando hacia el olvido all\u00e1 abajo.

r.rc_virgil_2a = \u00bfEntonces por qu\u00e9 est\u00e1 ese pasaje aqu\u00ed?

m.rc_virgil_3a = Parece que lleva hasta un tipo de elevador, pero sin energ\u00eda, toda esa cosa est\u00e1 muerta.

r.rc_virgil_3a = Tendr\u00e9 cuidado.

m.rc_virgil_4a = Saludos, {0}.  Cuando restauraste la energ\u00eda al campamento, este elevador \
  se encendi\u00f3 tambi\u00e9n. Me imagino que te llevar\u00e1 a mucha profundidad en el \
  precipicio que se ve all\u00e1 abajo y lo  que encontrar\u00e1s ah\u00ed es una inc\u00f3gnita. \n\
  \n\
  Si tu objetivo es viajar a esas profundidades, aseg\u00farate de que est\u00e1s listo para \
  enfrentar lo que sea que te vaya a estar esperando.

r.rc_virgil_4a = Terminar conversaci\u00f3n

m.rc_end_1a = Has llegado, recluta. Este es el portal final por el que saldr\u00e1s del \
  Campamento de Rescate para llegar a Haven. Una vez que cruces el precipicio no necesitar\u00e1s regresar aqu\u00ed.  Podr\u00e1\
  s comprar todo lo que has encontrado en este campamento y mucho m\u00e1s en Haven.\n\
  \n\
  \u00bfTienes alguna pregunta?

r.rc_end_1a = S\u00ed, tengo algunas preguntas.

r.rc_end_1b = Lo he entendido todo, no tengo m\u00e1s preguntas.

m.rc_end_2a = \u00bfEn qu\u00e9 puedo ayudarte?

r.rc_end_2a = \u00bfCuando llegue a Haven ya no podr\u00e9 volver?

r.rc_end_2b = \u00bfQu\u00e9 peligros me esperan detr\u00e1s del portal final?

r.rc_end_2c = \u00bfQu\u00e9 tengo que hacer cuando llegue a Haven?

r.rc_end_2d = No tengo m\u00e1s preguntas, me pondr\u00e9 en marcha.

m.rc_end_3a = No podr\u00e1s volver, no. Tu entrenamiento inicial habr\u00e1 terminado cuando \
  llegues a Haven y tu nuevo objetivo ser\u00e1 ayudar a los Spiral Knights que ya se \
  encuentran all\u00e1.

m.rc_end_3b = Aunque la senda es peligrosa no tendr\u00e1s que bajar a mucha profundidad, por \
  lo que podr\u00e1s lidiar f\u00e1cilmente con los monstruos que te encuentres. Sin embargo, \
  los exploradores han reportado m\u00e1s actividad de los Gremlins en la zona desde que  \
  pusimos el campamento, as\u00ed que ten cuidado.

m.rc_end_3c = Cuando llegues a Haven, te aconsejo que explores la ciudad y te familiarices con los \
  lugares de inter\u00e9s y los servicios que ofrece. Tambi\u00e9n tendr\u00e1s acceso a equipo \
  m\u00e1s poderoso del que te podemos ofrecer aqu\u00ed y estar\u00e1s rodeado de muchos \
  caballeros con m\u00e1s experiencia. P\u00eddeles ayuda si te pierdes.

r.rc_end_3a = Tengo otra pregunta.

r.rc_end_3b = Gracias por todo. Cruzar\u00e9 el portal final cuando est\u00e9 listo.

