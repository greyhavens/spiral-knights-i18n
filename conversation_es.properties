# Greeter
#...................................................................................................


m.atg_greeter_1a = Bienvenido a nuestro sal\u00f3n de entrenamiento avanzado. Aqu\u00ed \
  encontrar\u00e1s \u00fatiles consejos de supervivencia que te ayudar\u00e1n en tu viaje por los \
  Mecanismos.\n\n\u00bfQuieres recibir alguna orientaci\u00f3n?

r.atg_greeter_1a = Seguro, \u00bfpor d\u00f3nde empiezo?

r.atg_greeter_1b = No, gracias. Prefiero explorar el lugar por mi cuenta.

m.atg_greeter_2a = Hacia el oeste, aprender\u00e1s acerca de los \u00fatiles art\u00edculos que \
  se encuentran en los Mecanismos. Hacia el norte, aprender\u00e1s sobre una gran variedad de \
  tipos de bloques y puertas. Hacia el este, encontrar\u00e1s una selecci\u00f3n de trampas y \
  peligros, as\u00ed como un cuarto de combate para practicar la defensa contra cubos de \
  entrenamiento. No te preocupes, \u00a1hemos tomado precauciones para asegurarnos que estos \
  cubos sean inofensivos!

r.atg_greeter_2a = \u00a1Gracias! Ahora me voy a explorar.

## HAVEN KNIGHTS

# Fountain
#...................................................................................................


m.fountain_1 = \u00a1Saludos y bienvenido a Haven! Si te diriges al norte, llegar\u00e1s a la \
  Arcada, donde podr\u00e1s ponerte al corriente sobre los detalles de nuestra misi\u00f3n. Si te \
  diriges al oeste, llegar\u00e1s al Bazar, donde los Strangers tienen una selecci\u00f3n de \
  equipo y armas a la venta. \u00a1Revisa sus existencias a diario, ya que cambian!

r.fountain_1 = Gracias por la informaci\u00f3n, \u00a1me voy a explorar!

# Gym Signpost
#...................................................................................................


m.atg_guard = \u00a1Saludos! M\u00e1s all\u00e1 de esta puerta encontrar\u00e1s el sal\u00f3n de \
  entrenamiento avanzado. Como Caballero Spiral, eres libre de usarlo para practicar tus \
  habilidades y aprender m\u00e1s sobre los Mecanismos.

r.atg_guard = \u00a1Gracias! Ir\u00e9 a ver lo que hay dentro.


# Arcade Leader
#...................................................................................................


m.arc_leader_1 = Gusto en conocerte soldado y felicidades por llegar al campamento base aqu\u00ed \
  en Haven. Soy el Teniente Feron y he sido asignado por el Capit\u00e1n Ozlo para supervisar \
  la operaci\u00f3n de miner\u00eda en los Mecanismos. \n\
  \n\
  Frente a ti se encuentra la 'Arcada', un fascinante complejo que sirve como nuestro enlace al \
  coraz\u00f3n de los Mecanismos. En vista de que eres nuevo por aqu\u00ed, te dar\u00e9 un \
  breve resumen de lo que el Cuartel General Spiral nos tiene haciendo aqu\u00ed.

r.arc_leader_1 = Suena muy importante, dime c\u00f3mo funciona todo esto.

m.arc_leader_2 = Despu\u00e9s de que el Alondra se estrellara, su principal fuente de Tearium \
  explot\u00f3 destruyendo una parte de la nave y dej\u00e1ndola sin su fuente de poder \
  principal. Ya que desde entonces no hemos podido encontrar los cientos de toneladas de \
  Tearium necesarias, podemos decir que esa ave ha perdido sus alas.\n\
  \n\
  Con la ayuda de los Strangers, hemos podido establecer una peque\u00f1a base de operaciones \
  aqu\u00ed en Haven. Una vez que pusimos nuestros sistemas en l\u00ednea, descubrimos que \
  dentro del coraz\u00f3n de esta roca resuena una se\u00f1al de poder de magnitud sin \
  precedente.

r.arc_leader_2 = Si pudi\u00e9ramos aprovechar ese poder...

m.arc_leader_3 = \u00a1Exactamente! El Core de los Mecanismos bien podr\u00eda contener la fuente \
  de energ\u00eda que necesitamos para crear una nueva fuente de poder para el Alondra y \
  devolverlo a condiciones operativas. Solo hay un problema: los propios Mecanismos parecen estar \
  construidos como una especie de trampa mortal de locos.\n\nLlegar al Core no va a ser sencillo...

r.arc_leader_3 = \u00a1Yo puedo hacerlo!

m.arc_leader_4 = \u00a1Esa es la actitud que me gusta ver! Funciona as\u00ed: usa los portales que \
  est\u00e1n m\u00e1s adelante para explorar los Mecanismos y recuperar minerales especiales. \
  Despu\u00e9s, deposita esos minerales en los portales para cambiar los Mecanismos de abajo y \
  crear niveles nuevos e inexplorados.\n\nCreemos que los minerales son la clave para abrir un \
  camino hacia el Core, \u00a1solo necesitamos descubrir c\u00f3mo usarlos!

r.arc_leader_4 = Entiendo mi misi\u00f3n.

m.arc_leader_5 = Has demostrado que est\u00e1s listo para el combate y conf\u00edo en que \
  servir\u00e1s a la Orden Spiral con valent\u00eda. Los portales que llevan a los Mecanismos \
  est\u00e1n justo adelante. \n\n\u00a1Te deseo buena suerte!

r.arc_leader_5 = Terminar Conversaci\u00f3n
r.arc_leader_5_accept = \u00bfLlegar a la Terminal 1? \u00a1Enseguida!


# Wegner Basic
#...................................................................................................


m.arc_mintut_1 = Hola, soy Wegner, Caballero Geo en Jefe del Alondra y responsable de los estudios \
  geol\u00f3gicos en los Mecanismos.

r.arc_mintut_1 = Estoy aqu\u00ed para aprender acerca de los minerales que se encuentran en los \
  Mecanismos.

# IMAGE: step1_minerals.png
m.arc_mintut_2 = Durante tus viajes a los Mecanismos encontrar\u00e1s cinco minerales \
  especiales: crimsonite, moonstone, valestone, luminite y dark matter.

r.arc_mintut_2 = Continuar

# IMAGE: step2_gather.png
m.arc_mintut_3 = Encontrar\u00e1s dep\u00f3sitos de minerales en todos los niveles de los \
  Mecanismos y deber\u00e1s atacarlos para poder romperlos a un tama\u00f1o que sea posible \
  cargarlos. Solo puedes cargar uno a la vez, pero los puedes cambiar si recoges otro. Busca el \
  m\u00e1s grande y brillante que puedas encontrar. Son los m\u00e1s valiosos.

r.arc_mintut_3 = Continuar

m.arc_mintut_4 = Una vez que hayas llegado sano y salvo al elevador, el mineral que est\u00e9s \
  cargando se deposita en tu arsenal para que lo uses despu\u00e9s. Todos los que est\u00e9n en \
  tu grupo reciben los minerales de los dem\u00e1s, \u00a1as\u00ed que no hay necesidad de \
  pelear acerca de qui\u00e9n obtiene el mejor!

r.arc_mintut_4 = Continuar

m.arc_mintut_5 = Los minerales se usan para crear comida para los sprites en el Laboratorio. La \
  comida para sprites es muy importante para el desarrollo de tu sprite, \u00a1as\u00ed que \
  recoge esos minerales cuando los veas!

r.arc_mintut_5 = Continuar

m.arc_mintut_6 = Nuestra investigaci\u00f3n geol\u00f3gica est\u00e1 en curso, as\u00ed que es \
  posible que en el futuro haya otros usos fascinantes para estos extra\u00f1os y poderosos \
  minerales.

r.arc_mintut_6 = \u00a1Suena estupendo! \u00a1Gracias por la informaci\u00f3n!

