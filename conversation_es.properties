m.mission_cogknight_camp2_a = \u00a1Vimos las explosiones desde el campamento! \u00a1Eso fue incre\u00edble!
m.mission_cogknight_camp2_b = \u00a1No hubi\u00e9ramos podido pasar por esa artiller\u00eda sin tu ayuda!
m.mission_cogknight_camp2_c = \u00a1Resiste!
m.mission_cogknight_camp2_d = Vimos a los Gremlins escondiendo minas por ah\u00ed, \u00a1ten cuidado donde pisas!
m.mission_cogknight_camp2_e = \u00a1Los mantendremos a raya!
m.mission_cogknight_camp2_f = \u00a1Ac\u00e9rquense sigilosamente y vean si pueden entrar a esa \
