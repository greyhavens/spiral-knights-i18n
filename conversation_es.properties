## RETURN TO FIRESTORM CITADEL


m.rfc_court_1a = Saludos de nuevo, tra\u00eddo por las estrellas.
r.rfc_court_1a = \u00bfTra\u00eddo por las estrellas?
m.rfc_court_2a = Si, nosotros los sprites de la naturaleza somos la lluvia, las ra\u00edces y \
  la tierra. Pero tu no eres como nosotros. Tu eres como los que est\u00e1n all\u00e1 abajo.
r.rfc_court_2a = Hablando de 'abajo', \u00bfc\u00f3mo llego all\u00ed?  \u00a1Este lugar se est\u00e1 colapsando!
m.rfc_court_3a = Tristemente, a\u00fan con nuestro enlace a la Madre Espiritual restaurado, no \
  podemos hacer mucho para salvar este lugar. Sim embargo, a\u00fan cuando un camino se cierra \
  otro puede abrirse. Es la naturaleza de este mundo cambiante. Buena fortuna, tra\u00eddo de las estrellas.
r.rfc_court_3a = (Terminar conversaci\u00f3n)

m.rfc_court_4a = Aunque has derrotado a Vanaduke, parece que la maldici\u00f3n que ha tra\u00eddo sobre este reino a\u00fa\
  n permanece. Requiere de todo nuestro poder para mantener estos furiosos fuegos de sombra \
  bajo control.

m.rfc_court_5a = Todos nosotros sentimos el momento en que derrotaste a Vanaduke. La ciudadela \
  completa se sacudi\u00f3 cuando cay\u00f3 y por un momento pensamos que este reino ser\u00eda \
  destruido junto con su gobernante. \u00a1Debes tener cuidado al deambular por estos pasillos \
  con el lugar destroz\u00e1ndose de esta manera!

m.rfc_court_6a = Pl\u00e1ntate firmemente, viajero. Est\u00e1s presente en la corte del Reino \
  de Almire. \u00bfQue no escuchas las trompetas resonar por el regreso de nuestras poderosas \
  legiones? \u00bfNo est\u00e1s intimidado por la prestigiosa her\u00e1ldica de nuestras \
  grandes casa y hombres de estado?

r.rfc_court_6a = Ciertamente, parece muy impresionante.
r.rfc_court_6b = No veo ni oigo nada de esas cosas.

m.rfc_court_7a = (Sientes un gran orgullo del caballero ca\u00eddo, pero no dice nada m\u00e1s \
  y mira a la distancia hacia una vida que s\u00f3lo el puede ver.)
m.rfc_court_7b = (Tus palabras no parecen inmutar al caballero ca\u00eddo, cuya mente parece \
  estar perdida en alg\u00fan lugar en las glorias de su vida pasada.)

r.rfc_court_8a = (Terminar conversaci\u00f3n)

n.rfc_noble_1 = Cortesano Perdido
n.rfc_dungeon_1a = He permanecido en estos pasillos a\u00fan despu\u00e9s de estas largas \
  centurias, con mi maldecido se\u00f1or negando  mi descanso eterno.  Siento que a\u00fan ahora su esp\u00ed\
  ritu se aferra a este reino destrozado. Se reh\u00fasa a irse y por lo tanto nos condena a \
  todos.

n.rfc_noble_2 = Noble Aprisionado
n.rfc_dungeon_2a = Fui encarcelado aqu\u00ed hace m\u00e1s de mil a\u00f1os por hablar contra \
  mi se\u00f1or feudal, como castigo fui sentenciado a estar aqu\u00ed de por vida.  Cuando los \
  fuegos arrasaron la ciudadela a\u00fan en mi muerte no pude encontrar la libertad. Mi alma \
  est\u00e1 atada a estas piedras malditas.

