m.mission_crimson_chaos_recon_1 = \u00a1Mucho gusto de verte! {0}, cuando escuch\u00e9 que te enviar\u00edan no lo pod\u00eda creer. \u00a1El mism\u00ed\
  simo Vencedor de Vanaduke! Es un honor reportarme contigo.
r.mission_crimson_chaos_recon_1 = \u00bfQu\u00e9 has encontrado?
m.mission_crimson_chaos_recon_2 = Pues eso mismo es el problema {0}, nada. Hemos estado \
