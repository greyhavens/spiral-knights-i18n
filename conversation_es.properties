## FIRESTORM CITADEL

# Lost Soul 1: Greeter
#...................................................................................................

n.fc_greeter = Alma Perdida

m.fc_greeter_1 = Escucha mi advertencia, viajero, este lugar es peligroso y terrible. Est\u00e1\
  s frente a los portales de la Ciudadela de Fuego, antiguo coraz\u00f3n del gran reino de \
  Almire donde ahora solo gobierna el fuego y la malicia. \n\
  \n\
  Sal de aqu\u00ed si quieres sobrevivir.

r.fc_greeter_1 = Ya que he venido, debo continuar.

m.fc_greeter_2 = Espero que tu fin sea r\u00e1pido y sin sufrimiento.

r.fc_greeter_2 = Terminar conversaci\u00f3n.


# Lost Soul 2: Bridge End
#...................................................................................................

n.fc_bridge = Alma Perdida

m.fc_bridge_1 = Muy pocos consiguen atravesar el puente, viajero. Quiz\u00e1s tengas suerte y \
  sobrevivas, o quiz\u00e1s... no; hasta los Sprites buenos del inframundo son devorados por \
  las llamas de Vanaduke. No hay esperanza alguna.

r.fc_bridge_1a = \u00bfVanaduke?

r.fc_bridge_1b = Debo continuar.

m.fc_bridge_2 = Lord Vanaduke es el maestro de este reino asolado. El que una vez fue el rey de \
  Almire, Vanaduke ahora dirige a una terrible legi\u00f3n en las cenizas de su antiguo reino. \
  M\u00e1s te vale no cruzarte en su camino.

r.fc_bridge_2 = No he venido a pelear con Vanaduke.

m.fc_bridge_3 = Eso no depende de ti.

r.fc_bridge_3 = Terminar conversaci\u00f3n.


# Court Sprite 1
#...................................................................................................


m.fc_court_1 = Tu... tu no eres uno de los perdidos... debes de ser fuerte para haber llegado \
  hasta aqu\u00ed. \u00a1Por favor, debes ayudarme!

r.fc_court_1 = \u00bfY a qui\u00e9n estar\u00eda ayudando?

m.fc_court_2 = Soy un Sprite, una fuerza de la naturaleza a quien han convocado a este reino \
  para apagar las llamas artificiales que lo est\u00e1n consumiendo. Pero Vanaduke nos descubri\u00f3 y nos encarcel\u00f3\
  . He logrado escapar, pero los dem\u00e1s Sprites siguen bajo su custodia. \n\
  \n\
  Nadie puede atravesar este campo porque las columnas de fuego de sombra bloquean todas las \
  salidas. Solo se puede apagar el fuego de sombra con el agua de estos pozos espirituales. Es \
  el agua m\u00e1s pura que existe en la naturaleza y fluye directamente de los manantiales del \
  reino de la Madre Espiritual.

r.fc_court_2 = Esos pozos tienen pinta de estar secos...

m.fc_court_3 = Sin la energ\u00eda de los dem\u00e1s sprites, el agua no volver\u00e1 a correr \
  por este reino. Hace falta un v\u00ednculo mental con la Madre Espiritual para lograr apenas \
  unas gotas de agua en este mundo tan sofocante. El amo de este reino quiere que estas llamas \
  ardan para siempre.

r.fc_court_3 = \u00a1Liberar\u00e9 a los Sprites!

m.fc_court_4 = As\u00ed que eres valiente adem\u00e1s de viajero... Encontrar\u00e1s a los m\u00ed\
  os por todo el campo. Ten cuidado porque los terribles secuaces de Vanaduke los custodian. \
  Hay muchos patrullando el camino principal, as\u00ed que cuida tus espaldas cuando te muevas. \n\
  \n\
  Una vez que encuentres a un Sprite, ll\u00e9valo al c\u00edrculo sagrado que ves delante de \
  ti. Est\u00e1n sin duda debilitados por la maldici\u00f3n de Vanaduke y necesitar\u00e1n \
  rejuvenecer. Una vez que est\u00e9n todos juntos, crearemos un v\u00ednculo mental con la \
  Madre Espiritual para devolver el agua a los pozos.

r.fc_court_4_accept = \u00bfLiberar a los 6 Sprites Perdidos? \u00a1Yo puedo hacer eso!
r.fc_court_4 = Volver\u00e9 pronto.

m.fc_court_5 = Que la Madre Espiritual sea tu gu\u00eda.

r.fc_court_5 = Terminar conversaci\u00f3n.


# Court Sprite 2
#...................................................................................................

m.fc_court_reminder_1 = Una vez que encuentres a un Sprite, ll\u00e9valo al c\u00edrculo \
  sagrado que ves delante de ti. Est\u00e1n sin duda debilitados por la maldici\u00f3n de \
  Vanaduke y necesitar\u00e1n rejuvenecer. Una vez que est\u00e9n todos juntos, crearemos un v\u00ed\
  nculo mental con la Madre Espiritual para devolver el agua a los pozos.\n\
  \n\
  \u00a1Date prisa, por favor!

r.fc_reminder_1 = Terminar conversaci\u00f3n.


# Court Sprite 3
#...................................................................................................

m.fc_court_complete_1 = \u00a1Nuestro v\u00ednculo mental con la Madre Espiritual es fuerte \
  gracias a ti! Usa el agua que fluye de los pozos espirituales para apagar el fuego de sombra. \
  El camino est\u00e1 lleno de fuego de sombra y de secuaces de Vanaduke. Los Sprites no \
  podemos ayudarte en esa batalla, pero al menos podremos convocar pozos espirituales en \
  algunas zonas.

r.fc_court_complete_1 = Servir\u00e1 de gran ayuda, gracias.



## CORE RESEARCH

# Vaelyn
#...................................................................................................

n.parmas_scout = Explorador de Parma

m.core_lead_1 = \u00a1Ave C\u00e9sar!  Soy el Teniente Vaelyn, comandante de la investigaci\u00f3\
  n del Core. Es claro que eres uno de los m\u00e1s fuertes caballeros Spiral Knights que \
  alcanzan esas profundidades infernales, pero la fuerza por si misma no te llevar\u00e1 m\u00e1s lejos.

r.core_lead_1 = \u00bfCu\u00e1l es la situaci\u00f3n, Teniente?

m.core_lead_2 = Estamos tratando de encontrar la manera de activar el n\u00facleo del Core por \
  medio del poder de los minerales que se encuentran en los Mecanismos. Esos minerales son \
  capaces de transformar los Mecanismos - hemos visto esto en la Arcada de Haven. Creemos que \
  podemos usar ese poder para activar el Core y... abrirlo de alguna manera.

r.core_lead_2 = \u00bfLo quieren abrir?

m.core_lead_3 = Si, el mismo Capit\u00e1n Ozlo nos ha ordenado esperar lo m\u00e1s posible \
  hasta que aprendamos m\u00e1s. Si alguna vez dejamos este planeta, ser\u00e1 gracias a su Core.\n  \
  \n\
  Tengo la plena seguridad que adem\u00e1s de ser una potencial fuente de energ\u00eda, el Core act\u00fa\
  a como el centro nervioso de todo lo que ves en los Mecanismos. Se puede sentir en el poco \
  aire que hay all\u00e1 abajo: una salvaje y ominosa presencia que no es una simple m\u00e1quina.

r.core_lead_3 = \u00bfEst\u00e1s diciendo que est\u00e1... viva?

m.core_lead_4 = Estoy diciendo que sabemos que este mundo no es natural, y yo no creo que estas \
  hordas de miserables Gremlins, sin importar que trabajadores sean, hayan creado este mundo en \
  su totalidad. Debieron tener ayuda de algo m\u00e1s all\u00e1 de sus medidas y probablemente \
  lo que se encuentra en el n\u00facleo del Core.\n\
  \n\
  Lo mismo aplica al Escuadr\u00f3n Alpha. Ellos no iban a desaparecer, a\u00fan dentro del las \
  profundidades de los Mecanismos. Ellos eran los mejores entre nosotros, el Core mismo los \
  absorbi\u00f3

r.core_lead_4 = \u00bfPero yo pensaba que no hab\u00eda manera de entrar en el?

m.core_lead_5 = No se c\u00f3mo, pero ellos debieron encontrar la manera. Seguramente lo \
  hicieron... y ahora se han ido.

r.core_lead_5 = Terminar conversaci\u00f3n.


# Technician
#...................................................................................................

n.core_tech = T\u00e9cnico

m.core_tech_1 = Bienvenido al campamento de investigaci\u00f3n en el sitio del Core. \u00bfNos \
  traes noticias de la superficie?

r.core_tech_1 = Me gustar\u00eda saber c\u00f3mo puedo ayudar.

m.core_tech_2 = Eso es sencillo, contin\u00faa recolectando minerales dentro de los Mecanismos \
  y dando potencia a esos portales dentro de la Arcada. Necesitamos analizar la manera en que \
  el poder de los minerales afecta el Core. El problema es que es muy poco el poder que nos \
  llega a esta profundidad.  S\u00f3lo podemos reunir una cierta cantidad de datos de cada \
  portal cuando se abren.

r.core_tech_2 = \u00bfAlgo m\u00e1s?

m.core_tech_3 = \u00bfAire fresco?  \u00bfCalor?  Estas profundidades no son un ambiente que \
  muchos de nosotros podamos soportar por mucho tiempo, pero el Teniente insiste que \
  continuemos, que tal vez la oleada de voltaje del pr\u00f3ximo portal nos proporcione la \
  respuesta que necesitamos.\n\
  \n\
  Ciertamente no puedes decir que nuestra Teniente no est\u00e1 comprometida con la causa. No \
  creo haberla visto cerrar los ojos ni mucho menos dormir.

r.core_tech_3 = Continuar\u00e9 explorando y recolectando los minerales que necesitas para tu \
  investigaci\u00f3n.

# Rank 10+
