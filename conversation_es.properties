m.mission_gatelock_disengage_2 = Desactivando bloqueo del Portal 2.
m.mission_cogknight_camp_a = \u00a1Por fin llegaron refuerzos del Cuartel General Spiral!
m.mission_cogknight_camp_b = Uno de nuestros escuadrones ha logrado entrar pero est\u00e1n incomunicados, \u00a1s\u00e1lvalos si puedes!
m.mission_cogknight_camp_c = \u00a1Necesitamos que entres y que elimines esos ca\u00f1ones!
m.mission_cogknight_camp_d = Ten cuidado, esos Gremlins han cubierto el lugar con alambre de p\u00faas.
m.mission_cogknight_camp_e = Los Gremlins esconden explosivos en esos b\u00fankers, \u00a1estoy \
  seguro que si tiramos algo dentro de ellos los har\u00e1n explotar!
m.mission_cogknight_camp_f = \u00a1Ten cuidado all\u00ed!
m.mission_cogknight_battle_a = No puedo...seguir...
m.mission_cogknight_battle_b = \u00a1No podermos infiltrarnos a la base hasta que destruyas esa \
  artiller\u00eda!
m.mission_cogknight_battle_c = Ve adentro, usa el elevador... \u00a1explota lo que sea que est\u00e9 \
  controlando esos disparos!
m.mission_cogknight_battle_d = \u00a1Lo lograste!  \u00a1Esa explosi\u00f3n destruy\u00f3 los ca\u00f1ones!
m.mission_cogknight_prisoner_a = \u00a1El Warmaster Seerus est\u00e1 loco!  \u00a1Estoy mejor \
  en Emberlight!
m.mission_cogknight_prisoner_b = Me escabullir\u00e9 de aqu\u00ed ya que est\u00e9 seguro.  \u00a1Gracias por rescatarme!
m.mission_cogknight_ambushed = \u00a1T-ten cuidado...ellos...ellos est\u00e1n en todas \
