m.mission_cogmaster_4 = \u00a1Qui\u00e9n los envi\u00f3 infernales asesinos de hierro?  \u00bf\
  Acaso fue Herex?  No importa. Tengo maneras de averiguarlo...
m.mission_crimson_propaganda_1 = Los Nine ven todo, oyen todo.
