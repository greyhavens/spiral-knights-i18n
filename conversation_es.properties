# Tylen Bazaar Tour
#...................................................................................................
m.bazaar_tour_1a = \u00a1Bienvenido al Bazar, {0}! \u00bfQuieres un tour de las tiendas o \
  servicios?

r.bazaar_tour_1a = Seguro, mu\u00e9strame las tiendas. (Sigue a Tylen)
r.bazaar_tour_1b = \u00bfQu\u00e9 servicios puedo encontrar aqu\u00ed? (Sigue a Tylen)
r.bazaar_tour_1c = No gracias, puedo explorar por mi cuenta.

m.bazaar_tour_2a = Los Strangers como Quillion te venden armas y armaduras. Cada uno se \
  especializa en un tipo de art\u00edculo en particular, as\u00ed que habla con ellos para saber \
  lo que tienen. No son muy parlanchines, \u00a1pero todos los d\u00edas tienen art\u00edculos \
  nuevos en existencia! \n\n\u00a1Solo aseg\u00farate de haber alcanzado el rango apropiado para \
  equipar un art\u00edculo!

r.bazaar_tour_2a = \u00bfLos Strangers venden algo adem\u00e1s de armas y equipo?

m.bazaar_tour_3a = Me alegra que lo preguntes, \u00a1claro que s\u00ed! Vamos a ver a Vatel.

r.bazaar_tour_3a = (Sigue a Tylen)
#(move to Vatel)

m.bazaar_tour_4a = Aqu\u00ed Vatel te puede vender una selecci\u00f3n de recetas as\u00ed como \
  cambios de color personal y otros art\u00edculos.

r.bazaar_tour_4a = \u00bfRecetas? \u00bfPara armas y equipo?

m.bazaar_tour_5a = As\u00ed es. Puedes adquirir recetas y materiales para transmutar armas y \
  equipo en las estaciones de alquimia. Vamos, te mostrar\u00e9 una.

r.bazaar_tour_5a = Entendido.
#(move to alchemy station)

m.bazaar_tour_6a = Aqu\u00ed tenemos una estaci\u00f3n de alquimia con la que sin duda te \
  familiarizar\u00e1s cuando mejores tu arsenal.\n\
  \n\
  Pues bien, eso es todo en cuanto a tiendas. \u00bfQuieres otro tour?

r.bazaar_tour_6a = Me gustar\u00eda ver las tiendas otra vez. (Sigue a Tylen)
r.bazaar_tour_6b = Me gustar\u00eda ver los servicios. (Sigue a Tylen)
r.bazaar_tour_6c = No gracias, puedo explorar por mi cuenta.

m.bazaar_tour_7a = Punch y Vise son herreros gremlin que pueden cambiar las propiedades de tus \
  armas y equipo.

r.bazaar_tour_7a = \u00a1\u00bfGremlins?!

m.bazaar_tour_8a = T\u00f3malo con calma {0}, no todos los gremlins est\u00e1n cortados con la \
  misma tijera.  Algunos no est\u00e1n de acuerdo con las ideas del Rey Tinkinzar y la Orden \
  Crimson. De hecho, se ha dicho que en alg\u00fan lugar de los Mecanismos existe un pueblo de \
  gremlins que dejaron la Gran Colonia.

r.bazaar_tour_8a = Bueno, si t\u00fa lo dices...

m.bazaar_tour_9a = Bueno, de vuelta a lo que habl\u00e1bamos.\n\
  \n\
  Punch puede a\u00f1adir Variantes \u00danicas, que son un tipo de bono especial para tus \
  armas y equipo, por un precio. Pero sus m\u00e9todos son, er... ca\u00f3ticos. Nunca se sabe \
  lo que vas a obtener.\n\
  \n\
  Vise es un poco m\u00e1s preciso. Puede desligar tus armas y equipo por un precio, \u00a1permiti\u00e9\
  ndote vender o regalar el art\u00edculo!

r.bazaar_tour_9a = Muy \u00fatil, lo tendr\u00e9 en mente. \u00bfQu\u00e9 m\u00e1s tienes?

m.bazaar_tour_10a = Vamos a visitar a Brinks.

r.bazaar_tour_10a = (Sigue a Tylen)
#(move to Brinks)

m.bazaar_tour_11a = Brinks es el Mercader de Sellos, que entrega ciertos art\u00edculos a los \
  Caballeros a cambio de sellos que han encontrado en los Mecanismos. Los sellos se pueden \
  encontrar en cajas de tesoro, se otorgan como recompensas de misiones o se encuentran al \
  derrotar jefes monstruos especiales.

r.bazaar_tour_11a = Entendido. \u00bfHay algo m\u00e1s?

m.bazaar_tour_12a = Solo nos queda una \u00faltima tienda por visitar y terminamos. He guardado lo \
  mejor para el final.

r.bazaar_tour_12a = (Sigue a Tylen)
#(move to Bechamel)

m.bazaar_tour_13a = Aqu\u00ed tenemos a Bechamel el Complementador, quien puede a\u00f1adir \
  accesorios a tu equipo siempre y cuando tengas un cup\u00f3n. Con los accesorios, puedes \
  hacer que tu equipo se destaque en la multitud, recomiendo ampliamente que lo intentes.  \u00a1Pronto ser\u00e1s la ni\u00f1a de los ojos de todos!

r.bazaar_tour_13a = \u00bfD\u00f3nde encuentro cupones de accesorios?

m.bazaar_tour_14a = Puedes encontrar cupones de accesorios en lockboxes o en la Casa de Subastas, \
  si alg\u00fan otro caballero los est\u00e1 vendiendo.

r.bazaar_tour_14a = Entendido.

m.bazaar_tour_15a = Pues bien, eso cubre lo b\u00e1sico del Bazar.  Es realmente un lugar fant\u00e1stico para encontrar pr\u00e1\
  cticamente todo lo que necesites.\n\
  \n\
  \u00bfQuieres que lo repasemos otra vez, o ya te queda claro?

r.bazaar_tour_15a = Me gustar\u00eda ver las tiendas. (Sigue a Tylen)
r.bazaar_tour_15b = Me gustar\u00eda ver los servicios otra vez. (Sigue a Tylen)
r.bazaar_tour_15c = No gracias, puedo explorar por mi cuenta.

m.bazaar_tour_16a = \u00bfOtro tour? No hay problema, \u00a1s\u00edgueme!
r.bazaar_tour_16a = (Sigue a Tylen)

m.bazaar_tour_16b = \u00a1Excelente! Me da gusto haber podido ayudar a orientarte. \u00a1Te \
  deseo buena suerte, {0}!

r.bazaar_tour_16b = Gracias Tylen, \u00a1nos vemos!



