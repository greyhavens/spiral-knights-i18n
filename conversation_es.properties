m.dark_harvest_exp = \u00a1Bienvenido al Festival de la Cosecha Oscura!\n\
  \u00a1Esta celebraci\u00f3n anual honra a los muertos vivientes con m\u00e1scaras festivas, \
  deliciosas golosinas y peligrosos trucos! \n\
  \n\
  Para participar, explora los Mecanismos e intenta encontrar al legendario 'Punkin King'. Esta \
