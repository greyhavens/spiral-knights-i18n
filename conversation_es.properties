m.npc_recruit_b = \u00bfSe me olvid\u00f3 mi Calibur en la Estaci\u00f3n de Arsenal...?
m.npc_recruit_c = Creo que debo crear un mejor escudo en cuanto regrese a Haven.
m.npc_recruit_d = \u00a1Esta es mi primera expedici\u00f3n a los Mecanismos!
m.npc_recruit_e = \u00bfTienes algunos consejos que puedas darme?
m.npc_recruit_f = \u00bfD\u00f3nde se le pone el seguro a esta cosa?
m.npc_recruit_g = \u00bfYa viste los Cuartos de Peligro? He o\u00eddo que son muy peligrosos.

m.npc_survivorknight_a = Ellos... ellos han alcanzado a todos menos a mi. Me escond\u00ed en un rinc\u00f3n.
m.npc_survivorknight_b = Ellos llegaron de la oscuridad. No hubo tiempo de reaccionar.
m.npc_survivorknight_c = Yo no ped\u00ed esto.

m.npc_mineraltech_a = Soy un investigador de campo trabajando bajo las \u00f3rdenes del \
  Caballero Geo en Jefe Wegner.
m.npc_mineraltech_b = Hmm, ciertas combinaciones parecen atraer diferentes tipos de monstruos.
m.npc_mineraltech_c = No te preocupes de Hubert, se le han quitado las p\u00faas.

m.npc_minerknight_a = S\u00f3lo puedes cargar un mineral a la vez, as\u00ed que elije el m\u00e1s grande.
m.npc_minerknight_b = El Cuartel General Spiral quiere que carguemos esos minerales hasta \
  Haven.
m.npc_minerknight_c = Dicen que estos minerales dan potencia a todos los portales de la Arcada.

m.npc_techknight_a = Estoy recolectando muestras de todo este estrato.
m.npc_techknight_b = La buena informaci\u00f3n es como un buen pud\u00edn, nunca se puede tener \
