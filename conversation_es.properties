# Anniversary
#...................................................................................................


m.biscotti_1 = Saludos, soy Biscotti, \u00a1Chef en Jefe del Alondra! Tenemos una peque\u00f1a situaci\u00f3\
  n en nuestras manos que puede o no involucrar monstruos sentientes, pasteles monstruosos que \
  pueden o no haber tomado el control de mi cocina e infestado los Mecanismos...\n\
  \n\
  De cualquier manera, he hecho un trato con los Strangers para proveer recompensas a cambio de \
  rebanadas de pastel que prueban que has erradicado estos horribles monstruos que pueden o no \
  existir.

r.biscotti_1 = Todo esto suena muy extra\u00f1o, pero estoy m\u00e1s que dispuesto a ayudar en \
  lo que pueda.

m.biscotti_2 = \u00a1Excelente! Existen dos maneras en las que me puedes ayudar:\n\
  \n\
  Puedes aceptar la nueva Misi\u00f3n de Prestigio 'Tart\u00e1strofe Total', la cual est\u00e1 disponible diariamente.\n\
  \n\
  O puedes aventurarte en los Mecanismos y eliminar la infestaci\u00f3n de estos 'Creep Cakes' \
  tanto como lo desees. \u00a1Tan solo busca el rastro de bet\u00fan!

r.biscotti_2 = De nuevo, esto es muy raro Biscotti, pero har\u00e9 mi mejor esfuerzo.

m.biscotti_3 = Gracias {0}, lo aprecio. Y hazme un favor, por favor no menciones este \
  'incidente' al Cuartel General Spiral\u2026

r.biscotti_3 = Terminar conversaci\u00f3n.


# Tortodrone Event Haven
#...................................................................................................

m.tortodrone_haven_1 = El Cuartel General Spiral nos tiene investigando reportes de piezas que \
  se han ca\u00eddo de los tortodrones y montones de materia oscura que aparecen por los \
  Mecanismos. Kora cree que los Demonios est\u00e1n tramando algo. Hay evidencia de que jugaron \
  un papel en la desaparici\u00f3n de los tortodrones.

r.tortodrone_haven_1 = \u00bfQu\u00e9 encontraste?

m.tortodrone_haven_2 = Encontramos un extra\u00f1o portal escondido en un jard\u00edn \
  misterioso al que el Cuartel General Spiral llama el Portal Siniestro. Por lo que hemos \
  podido decodificar, necesitas alg\u00fan tipo de llave para abrirlo. El Cuartel General \
  Spiral piensa que los glifos que vimos que los Demonios estaban cargando pueden tener algo \
  que ver con la apertura de ese portal.

r.tortodrone_haven_2 = \u00a1Gracias por el aviso! Buscar\u00e9 esos glifos.

