# IMAGE: codex_vanaduke.png

n.monster_codex_battlepod = C\u00f3dice Monstruoso:
m.monster_codex_battlepod = C\u00e1psula de Batalla \nEstos aut\u00f3matas inm\u00f3viles esconden \
