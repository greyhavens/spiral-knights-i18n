  parec\u00eda obra de los jellies.

m.lab_progress_7 = En muy raras ocasiones he encontrado jellies que no nos atacan en cuanto nos \
  ven. Ahora le estoy quitando las p\u00faas a este. \u00a1Son algo lindos cuando no est\u00e1n \
  tratando de atravesarte!

# Roarmulus
m.lab_progress_8 = Este gremlin viene de la colonia en Emberlight, en lo profundo de los \
  Mecanismos. Son un grupo de marginados que desafiaron al Rey Tinkinzar y la Orden Crimson. \
  Esperamos poder hacer un tratado con ellos que nos permita usar su colonia como base de \
  operaciones para nuestras misiones en las profundidades subterr\u00e1neas.

m.emberlight_visitor_1a = Los gremlins de Emberlight te agradecen que hayas detenido esta \
  amenaza.

r.emberlight_visitor_1a = Continuar

m.emberlight_visitor_2a = \u00a1Pero vengo a advertirles! Orden Crimson no parar con Proyecto \
  Roarmulus. Orden Crimson desesperada por destruir a todos los enemigos. Altos, peque\u00f1os y \
  marginados. \u00a1Todos enemigos de Orden Crimson!

r.emberlight_visitor_2a = Gracias por la advertencia, Pakrat.

m.emberlight_visitor_3a = \u00bfPuedo ayudarte en algo?
r.emberlight_visitor_3a = Cu\u00e9ntame acerca de Emberlight.
r.emberlight_visitor_3b = \u00bfPor qu\u00e9 el Rey Tinkinzar trata de destruir Haven?
r.emberlight_visitor_3c = Tengo suficiente informaci\u00f3n, gracias. (Terminar conversaci\u00f3n)

m.emberlight_visitor_4a = Emberlight fundada por gremlins marginados de Gran Colonia. Gremlins de \
  Emberlight no obedecen Ley de Hierro, as\u00ed que huir o morir. Empezamos de nuevo con \
  Emberlight. Nueva colonia hogar de pocos de nosotros: casi todos exconspiradores, algunos \
  mercaderes, algunos combatientes, todos traidores a ojos de gremlins de Gran Colonia.

r.emberlight_visitor_4a = Una pregunta m\u00e1s, Pakrat.

m.emberlight_visitor_4b = Nadie sabe con seguridad. Tinkinzar no visto en muchos, muchos \
  a\u00f1os. Orden Crimson lleva a cabo planes de Tinkinzar para Cradle. Emberlight mancha en plan \
  maestro porque construida por marginados. Haven probablemente igual, fundada por no gremlins. \
  \u00a1No parte del plan!

# Vanaduke
m.lab_progress_9 = \u00a1Otro dispositivo extra\u00f1o! Est\u00e1 claro que este no lo fabricaron \
  los de Almire, del mismo modo que el anterior no lo fabricaron los jellies. Sin embargo, hemos \
  notado algo: este dispositivo todav\u00eda est\u00e1 activo. Adem\u00e1s, su firma de \
  energ\u00eda es similar a las lecturas que tomamos del Artefacto antes de que lo robaran. Creo \
  que esto requiere m\u00e1s investigaci\u00f3n.

m.almire_historian_1a = Hemos recuperado lo poco que queda en los restos de la Mansi\u00f3n \
  Owlite referente al Reino de Almire. Combinado con los fragmentos que obtuvimos de los \
  sprites de la naturaleza dentro de la misma Ciudadela de Fuego, empezamos a tener un panorama \
  m\u00e1s claro de la historia de Almire.

r.almire_historian_1a = \u00bfQu\u00e9 sabes de Almire?

m.almire_historian_2a = En los tomos que hemos recuperado, descubrimos que hace miles de a\u00f1os \
  la Ciudadela de Fuego formaba parte de un reino mucho m\u00e1s grande conocido como Almire. \
  Aunque limitaba con otras naciones agresivas, Almire era famosa por la destreza marcial de sus \
  muchas legiones. Estas legiones mantuvieron a salvo el reino durante muchos a\u00f1os. Por \
  desgracia, no fueron suficientes.

r.almire_historian_2a = \u00bfQu\u00e9 pas\u00f3 con el resto del reino?

m.almire_historian_3a = Pues bien, ahora sabemos que hab\u00eda enormes ciudadelas que albergaban \
  las fuerzas armadas de Almire y grandes fincas para sus casas nobles. Debi\u00f3 de ser algo \
  digno de verse. Suponemos que el resto del reino sigue siendo unas ruinas humeantes en \
  alg\u00fan lugar. Es posible que una parte haya sobrevivido... aunque, dada la evidencia \
  anecd\u00f3tica, creemos que es poco probable en el mejor de los casos.

# Biscotti, Lab Pre-Selection
#...................................................................................................

m.lab_biscotti_1a = \u00a1Saludos! \u00a1Soy Biscotti, Chef en Jefe del Alondra! Todav\u00eda \
  estoy calibrando la alquimia del alimento de sprites de batalla, as\u00ed que habla conmigo despu\u00e9s.

r.lab_biscotti_1a = \u00bfLos sprites de batalla comen?

m.lab_biscotti_2a = \u00a1As\u00ed es! Un sprite de batalla puede sintetizar materia y convertirla \
  en energ\u00eda utilizable. Esta m\u00e1quina puede tomar ciertos materiales y transmutarlos en \
  alimento extra especial para sprites... es decir, cuando por fin est\u00e9 calibrada.

r.lab_biscotti_2a = Hablar\u00e9 contigo despu\u00e9s, gracias.

# Biscotti, Lab Post-Selection
#...................................................................................................
m.lab_biscotti_3a = \u00a1Saludos, {0}! Como Chef en Jefe del Alondra, me han asignado para \
  supervisar el desarrollo nutricional de nuestros nuevos compa\u00f1eros sprite. Parece que \
  realmente se han diversificado all\u00e1 en los Mecanismos. Ser\u00e1 interesante ver c\u00f3mo \
  se desarrollan.\n\n\u00bfTienes alguna pregunta acerca de la alimentaci\u00f3n y cuidado de tu \
  sprite?

m.lab_biscotti_3aa = \u00bfTienes alguna pregunta acerca de la alimentaci\u00f3n y cuidado de \
  tu sprite?

r.lab_biscotti_3a = \u00bfC\u00f3mo alimento a mi sprite de batalla?
r.lab_biscotti_3b = Cu\u00e9ntame acerca de su apetito.
r.lab_biscotti_3c = Cu\u00e9ntame acerca de sus art\u00edculos favoritos.
r.lab_biscotti_3d = Cu\u00e9ntame acerca de los art\u00edculos requeridos.
r.lab_biscotti_3e = Nada por ahora, gracias.

m.lab_biscotti_4a = \u00a1Alimentar a tu sprite de batalla es sencillo! Simplemente abre la \
  interfaz del sprite de batalla y selecciona el \u00edcono de tu sprite. Desde ah\u00ed puedes \
  seleccionar un material de tu arsenal y ponerlo en la charola de alimentaci\u00f3n.\n\
  \n\
  Una vez que hayas puesto un material para que tu sprite lo sintetice, simplemente haz clic en \
  'alimentar sprite' y \u00a1buen provecho!

r.lab_biscotti_4a = Tengo otras preguntas.
r.lab_biscotti_4aa = Eso es todo por ahora, \u00a1gracias!

m.lab_biscotti_4b = Los sprites tienen un apetito preestablecido que limita la cantidad de \
  materiales que pueden comer en un cierto tiempo. Cuando alimentas a tu sprite con un \
  material, su apetito disminuye. Una vez que se ha mermado completamente, ya no podr\u00e1s alimentarlo.

r.lab_biscotti_4b = \u00bfC\u00f3mo aumenta el apetito?

m.lab_biscotti_5b = El apetito de un sprite aumentar\u00e1 naturalmente con el tiempo, aunque \
  lo hace despacio. Para incrementar su apetito r\u00e1pidamente, ll\u00e9valo a una aventura \
  en los Mecanismos. \u00a1Absorber el fuego de los monstruos es una buena manera de quemar \
  calor\u00edas!

m.lab_biscotti_4c = En cualquier momento, el sprite tendr\u00e1 un 'art\u00edculo favorito', un \
  material especial que es el que disfruta m\u00e1s comer. Alimentar a tu sprite con uno de \
  ellos es un deleite y le otorga mucho fuego al sprite.

r.lab_biscotti_4c = \u00bfD\u00f3nde puedo adquirir estos art\u00edculos?

m.lab_biscotti_5c = Los art\u00edculos favoritos se pueden transmutar con esta misma m\u00e1quina \
  de alquimia que ves frente a ti. Solo se necesitan dos unidades de un mismo material y algunos \
  minerales de los Mecanismos. \u00a1F\u00e1cil!

m.lab_biscotti_4d = Los art\u00edculos requeridos aparecer\u00e1n una vez que tu sprite est\u00e9 \
  listo para nivelarse. Cuando tu sprite haya consumido suficiente fuego, aparecer\u00e1 un aviso \
  de 'material requerido' sobre la charola de alimentaci\u00f3n. DEBES alimentar a tu sprite con \
  este material para que pueda seguir avanzando.

r.lab_biscotti_4d = Continuar

m.lab_biscotti_5d = En la mayor\u00eda de los casos, este es un art\u00edculo favorito est\u00e1\
  ndar, pero cuando tu sprite est\u00e1 listo para evolucionar, requerir\u00e1 de un Evo Catalyst.

# Riley, Harness Merchant
#...................................................................................................
m.lab_harness_1a = Soy Riley, el asistente de Morlin. Estoy inventando una manera de mejorar \
  a\u00fan m\u00e1s a nuestros sprites de batalla. Vuelve m\u00e1s tarde, cuando hayas adquirido \
  un sprite con el que tengas un lazo permanente.

r.lab_harness_1a = Volver\u00e9 despu\u00e9s, gracias.

# Morlin, Sprite Tutorial
#...................................................................................................
m.sprite_tut_1a = Saludos, {0}. Me imagino que tienes algunas preguntas acerca de los sprites de \
  batalla. \u00bfC\u00f3mo te puedo ayudar?
m.sprite_tut_1aa = \u00bfM\u00e1s preguntas acerca de los sprites de batalla? \u00bfC\u00f3mo te puedo ayudar?

r.sprite_tut_1a = \u00bfC\u00f3mo se nivelan y evolucionan los sprites de batalla?
r.sprite_tut_1b = Cu\u00e9ntame acerca de las habilidades de los sprites.
r.sprite_tut_1c = \u00bfQu\u00e9 son los arneses de los sprites?
r.sprite_tut_1d = \u00bfQu\u00e9 son las ventajas de los sprites?
r.sprite_tut_1e = Nada por ahora, gracias.

m.sprite_tut_2a = Los sprites de batalla se nivelan al adquirir fuego, de la misma manera que \
  tus armas y equipo. Pueden adquirir fuego de dos maneras: absorbi\u00e9ndolo mientras peleas \
  en los Mecanismos y consumiendo materiales y sintetiz\u00e1ndolos en fuego.

r.sprite_tut_2a = Continuar

m.sprite_tut_3a = Alimentar a tu sprite con materiales es la manera m\u00e1s r\u00e1pida de \
  nivelarlo. Habla con Biscotti aqu\u00ed en el Lab para m\u00e1s informaci\u00f3n acerca de la \
  alimentaci\u00f3n de los sprites.

r.sprite_tut_3a = \u00bfY c\u00f3mo evoluciona mi sprite?

m.sprite_tut_4a = Tu sprite evolucionar\u00e1 conforme lo niveles. En ciertos niveles clave, tu \
  sprite requerir\u00e1 que lo alimentes con un Evo Catalyst para poder nivelarlo m\u00e1s. Una \
  vez alimentado, \u00a1tu sprite cambiar\u00e1 su apariencia f\u00edsica!\n\nSer\u00e1 muy \
  interesante ver c\u00f3mo estas extra\u00f1as y nuevas formas de sprites de batalla evolucionan \
  con el tiempo.

r.sprite_tut_4a = Tengo otras preguntas.
r.sprite_tut_4aa = Eso es todo por ahora, \u00a1gracias!

m.sprite_tut_2b = Conforme un sprite se nivela, aprender\u00e1 nuevas habilidades de combate y \
  adem\u00e1s ganar\u00e1 puntos de habilidad.

r.sprite_tut_2b = Continuar

m.sprite_tut_3b = Cada sprite de batalla aprender\u00e1 tres habilidades que puede usar en \
  combate. Las habilidades se aprenden autom\u00e1ticamente en ciertos niveles conforme el \
  sprite se nivela.\n\
  \n\
  Las habilidades de combate se hacen m\u00e1s fuertes con los puntos de habilidad.

r.sprite_tut_3b = Continuar

m.sprite_tut_4b = Los puntos de habilidad se ganan regularmente conforme el sprite se nivela. Se \
  pueden aplicar a las habilidades en la interfaz del sprite de batalla.\n\nAl aplicar un punto de \
  habilidad, debes elegir qu\u00e9 aspecto mejorar, como el tiempo de espera o el da\u00f1o total.

r.sprite_tut_4b = Continuar

m.sprite_tut_5b = Y no te preocupes por aplicar los puntos de habilidad 'de la manera equivocada', \
  \u00a1ya que con el tiempo ganar\u00e1s suficientes puntos de habilidad para llevar todas tus \
  habilidades al m\u00e1ximo!

r.sprite_tut_5b = Continuar

m.sprite_tut_6b = Una vez que hayas aplicado todos tus puntos de habilidad y que hayas logrado \
  un nivel muy alto con tu sprite, empezar\u00e1s a seleccionar tus 'habilidades m\u00e1ximas'.  \
  Las habilidades m\u00e1ximas son versiones mejoradas de las habilidades de tu sprite. Cada \
  habilidad de sprite tiene dos opciones para una habilidad m\u00e1xima.

r.sprite_tut_6b = Continuar

m.sprite_tut_7b = Solo puedes seleccionar una habilidad m\u00e1xima por cada habilidad de sprite, \
  \u00a1as\u00ed que elige sabiamente! Ten en cuenta tambi\u00e9n que seleccionar habilidades \
  m\u00e1ximas cambiar\u00e1 a\u00fan m\u00e1s la apariencia de tu sprite.\n\n\u00a1Con todas \
  estas opciones, tu sprite de nivel m\u00e1ximo seguramente se ver\u00e1 y se comportar\u00e1 de \
  manera diferente al resto!

r.sprite_tut_7b = Tengo otras preguntas.
r.sprite_tut_7bb = Eso es todo por ahora, \u00a1gracias!

m.sprite_tut_2c = Todos los sprites de batalla visten un arn\u00e9s mec\u00e1nico que alinea \
  sus habilidades con un tipo de da\u00f1o.  Sin embargo, no todos los sprites pueden vestir \
  todos los arneses. Por ejemplo, un drakon no puede infligir da\u00f1o de perforaci\u00f3n.\n\
  \n\
  De manera predeterminada, tienes un iron harness que cualquier sprite puede equipar.  Si \
  deseas expandirte como tal vez lo hagas con tus armas y tu equipo, necesitar\u00e1s comprar \
  arneses nuevos.

r.sprite_tut_2c = \u00bfD\u00f3nde puedo comprar m\u00e1s arneses?

m.sprite_tut_3c = Ve con Riley aqu\u00ed en el Lab para comprar arneses nuevos. Una vez comprado, \
  el arn\u00e9s se a\u00f1ade autom\u00e1ticamente a tu lista de arneses en la interfaz del sprite \
  de batalla.\n\nAdem\u00e1s, cada vez que compres una mejora directa de un arn\u00e9s que ya \
  tengas, este ser\u00e1 reemplazado por el arn\u00e9s superior.

r.sprite_tut_3c = Continuar

m.sprite_tut_4c = Las mejoras de arn\u00e9s definitivamente valen las crowns. \u00a1Las versiones \
  superiores de cada arn\u00e9s reducen el tiempo de espera de las habilidades de combate!

r.sprite_tut_4c = Tengo otras preguntas.
r.sprite_tut_4cc = Eso es todo por ahora, \u00a1gracias!

m.sprite_tut_2d = Los sprites de batalla obtienen ventajas en ciertos niveles que puedes equipar \
  en la interfaz del sprite de batalla. Las ventajas otorgan bonos a tus estad\u00edsticas.

r.sprite_tut_2d = Continuar

m.sprite_tut_3d = Las ventajas se desbloquean al azar. Algunas ventajas son mucho m\u00e1s raras \
  que otras y requieren que un sprite alcance un nivel muy alto para desbloquearlas todas.\n\n\
  \u00a1Incluso puedes obtener ventajas despu\u00e9s de alcanzar el nivel 100!

r.sprite_tut_3d = Tengo otras preguntas.
r.sprite_tut_3dd = Eso es todo por ahora, \u00a1gracias!

