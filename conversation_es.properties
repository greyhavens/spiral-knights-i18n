# Bechamel (Guild Hall)

m.gh_bechamel_1 = Saludos {0}, \u00bfen qu\u00e9 te puedo ayudar?
r.gh_bechamel_acc = \u00a1Ponte accesorios!
r.gh_bechamel_statue = Haz una estatua.
r.gh_bechamel_end = No importa...

m.gh_bechamel_2 = \u00a1Por favor examina la previsualizaci\u00f3n de la estatua con cuidado! \
  Algunas veces me da trabajo fabricar algunos accesorios como auras y art\u00edculos \
  especiales en forma de estatua. No hay reembolsos, \u00a1as\u00ed que aseg\u00farate que te \
  gusta lo que ves antes de comprarlo!

# Hunters Lodge
#...................................................................................................

m.hunter_1a = Saludos mi estimado caballero. Soy Armero, gran cazador de la selva y comisario \
  de este prestigioso pabell\u00f3n que est\u00e1 frente a ti.\n\
  \n\
  En las paredes puedes ver muchos trofeos reclamados en muchas de nuestras arriesgadas \
  expediciones, donde la vida y las extremidades se ponen a riesgo para poder experimentar la \
  salvaje y pura emoci\u00f3n de la caza.\n\
  \n\
  Ahora digo, \u00bftienes esa misma chispa dentro de ti?  \u00bfEl mismo gusto por el aire \
  libre y por el peligro?

r.hunter_1a = He visto mi cuota de peligro, y me gusta.

m.hunter_2a = \u00a1Sensacional! Entonces, tal vez tus amigos y tu puedan prestar servicio a \
  este pabell\u00f3n.  Veras, la m\u00e1quina de alquimia que est\u00e1 frente a ti puede \
  fabricar magn\u00edficos trofeos de monstruos para tu Sal\u00f3n de Gremio.\n\
  \n\
  La m\u00e1quina de alquimia usa materiales y crowns de la Tesorer\u00eda del Gremio y \
  deposita los resultados en la misma Tesorer\u00eda del Gremio.

r.hunter_2a = Ah, \u00bfentonces es un trabajo de equipo?

m.hunter_3a = \u00bfCiertamente! Los trofeos de monstruos requieren de una gran cantidad de \
  materiales, as\u00ed que es perfectamente razonable que se requiera de un esfuerzo de equipo.\n\
  \n\
  Por \u00faltimo, algunos de los materiales que necesitar\u00e1n s\u00f3lo se pueden obtener a \
  cambio de sellos de jefe con Brinks en el Bazar de Haven.  \u00a1Son una prueba de tu valor \
  al derrotar tan temibles criaturas!

r.hunter_3a = Entonces que comience la cacer\u00eda.

m.hunter_4a = \u00a1Ese es el esp\u00edritu! \u00a1Dales una lecci\u00f3n a esos monstruos!

r.hunter_4a = Terminar conversaci\u00f3n

# Monster Pockets
#...................................................................................................


m.mon_pocket_1 = \u00a1Saludos!  Soy Nonna de la Agencia de Adopci\u00f3n de Emberlight.  \n\
  \n\
  En la Agencia de Adopci\u00f3n de Emberlight recogemos peque\u00f1os monstruos que se han \
  perdido en las profundas oscuridades de los Mecanismos.  Ya que no tienen un hogar ni manera \
  de cuidarse solos, \u00a1tratamos de buscar un buen hogar para estos necesitados monstruos!  \n\
  \n\
  Al comprar uno de estos adorables 'monstruos de bolsillo', puedes llevar contigo \u00a1tu propio monstruo beb\u00e9!  \n\
  \n\
  La Agencia de Adopci\u00f3n de Emberlight visitar\u00e1 Haven de tiempo en tiempo, \u00a1y \
  nunca se sabe lo que tendremos para ofrecer!

r.mon_pocket_1 = \u00a1Mu\u00e9strame quienes est\u00e1n para adopci\u00f3n!
r.mon_pocket_2 = Gracias Nonna, tal vez para la pr\u00f3xima.


# Shadow Lair Warden
#...................................................................................................

n.sl_guard = Alcaide Spiral

m.sl_guard_1 = \u00a1Bien hecho, caballero! Ante ti se encuentran los elevadores que llevan a \
  lo que el Cuartel General Spiral llama 'Guarida de las Sombras'. La Guarida de las Sombras \
  contiene algunos de los m\u00e1s poderosos monstruos de los Mecanismos, aseg\u00farate de \
  llevar equipo para Nivel 3 antes de ir m\u00e1s lejos.

r.sl_guard_1 = Continuar

m.sl_guard_2 = Los Caballeros Recon que se han aventurado en estos extra\u00f1os mundos nuevos, \
  dicen sentir una terrible oscuridad que los envuelve en todos los rincones. Hay algo m\u00e1s que sucede aqu\u00ed \
  y necesitamos nuestros caballeros m\u00e1s \u00e9lite para investigar.

r.sl_guard_2 = Entendido. \u00bfQue m\u00e1s necesito?

m.sl_guard_3 = Todas las Guaridas de las Sombras est\u00e1n cerradas con un extra\u00f1o \
  mecanismo que solo puede ser abierto con un 'Shadow Key.'  Los Shadow Keys se pueden comprar \
  en la Casa de Subastas.\n\
  \n\
  Una vez que un miembro del grupo usa un Shadow Key, el grupo se cierra y no puede ser \
  cambiado, \u00a1escoge a los miembros de tu grupo sabiamente!

r.sl_guard_3 = \u00a1Obtendr\u00e9 una Shadow Key y empezar\u00e9 a investigar!

m.sl_guard_4 = Que tengas buena suerte entonces. Hasta ahora la Guarida de las Sombras es el \
  desaf\u00edo m\u00e1s grande al que te enfrentar\u00e1s.

r.sl_guard_4 = Terminar conversaci\u00f3n


