# Drakon Skills and Augments

m.firebolt = Firebolt
d.firebolt = Launches a searing ball of fire that explodes on impact.

m.impact = Impact
d.impact = Increases the damage of firebolt.

m.extra_crispy = Extra Crispy
d.extra_crispy = Increases the potency of the fire and chance to set targets ablaze.

m.concussive_firebolt = Concussive Firebolt
d.concussive_firebolt = Adds a chance for a powerful stun to the firebolt.

m.meteoric_firebolt = Meteoric Firebolt
d.meteoric_firebol = Increases the size of the firebolt's explosion.

m.flame_barrier = Flame Barrier
d.flame_barrier = Surround yourself with a barrier of flames that enhances your defenses \
	while burning nearby targets.

m.high_heat = High Heat
d.high_heat = Increases the offensive power of the flame barrier.

m.heavy_smoke = Heavy Smoke
d.heavy_smoke = Increases the defensive power and duration of the flame barrier.

m.scorching_barrier = Scorching Barrier
d.scorching_barrier = Increases the number of orbiting fireballs and their size.

m.backfire_barrier = Backfire Barrier
d.backfire_barrier = Gain a brief movement speed boost upon executing flame barrier.

m.firestorm = Firestorm
d.firestorm = Summon the power of true dragon fire to burn everything in your path.

m.five_alarm = Five Alarm
d.five_alarm = Increases the duration and size of the firestorm.

m.frenzied_firestorm = Frenzied Firestorm
d.frenzied_firestorm = For every monster caught in the blaze, you and your party have a chance of \
	receiving an attack power and speed bonus.

m.explosive_firestorm = Explosive Firestorm
d.explosive_firestorm = Creates a series of explosions when unleashing the firestorm.

# Seraphynx Skills and Augments

m.ray_of_light = Ray of Light
d.ray_of_light = Fires a concentrated beam of light that damages anything passing through it.

m.magnify = Magnify
d.magnify = Increases the reach and power of the ray of light.

m.enduring_light = Enduring Light
d.enduring_light = Increases the duration of the ray of light.

m.dazzling_light_ray = Dazzling Light Ray
d.dazzling_light_ray = The ray of light deals extra damage to undead and fiend family monsters.

m.disintegration_ray = Disintegration Ray
d.disintegration_ray = The ray of light also reduces the defense of its targets.

m.heart_attack = Heart Attack
d.heart_attack = Enchants a group of targets. If enchanted target is destroyed, it has a \
	chance of dropping extra restorative hearts.

m.extra_hearty = Extra Hearty
d.extra_hearty = Increases the chance of hearts dropping and duration of the enchantment.

m.wide_embrace = Wide Embrace
d.wide_embrace = Increases the area of effect of heart attack.

m.iron_heart_attack = Iron Heart Attack
d.iron_heart_attack = Targets destroyed while enchanted may also drop defense orbs.

m.violent_heart_attack = Violent Heart Attack
d.violent_heart_attack = Targets destroyed while enchanted create an explosion.

m.angelic_aura = Angelic Aura
d.angelic_aura = Creates protective aura around you that also protects any party members within it.

m.protection = Protection
d.protection = Increases the defensive powers of the angelic aura.

m.cover = Cover
d.cover = Increases the size and duration of the angelic aura.

m.seraphic_aura = Seraphic Aura
d.seraphic_aura = Party members within the protective aura gain increased shield regen.

m.valkyrian_aura = Valkyrian Aura
d.valkyrian_aura = Party members within the protective aura gain a charge speed bonus.


# Maskeraith Skills and Augments

m.caustic_quills = Caustic Quills
d.caustic_quills = Fires a series of quills that stick to targets and inflict poison. \
	For each hit a quilled target receives, they lose one quill and take additional damage.

m.venom = Venom
d.venom = Increases the potency of the poison inflicted.

m.bristle = Bristle
d.bristle = Increases the number of quills fired and their sticking duration.

m.vengeful_quills = Vengeful Quills
d.vengeful_quills = Each time a quilled target is hit, another quill is fired from the target \
	to the next available target.

m.virulent_quills = Virulent Quills
d.virulent_quills = Each time a quilled target is hit there is a chance to trigger a poisonous explosion.

m.shadow_cloak = Shadow Cloak
d.shadow_cloak = Grants you partial invisibility and a defensive boost for a limited time. \
	Shadow Cloak is cancelled if you take damage, attack, or perform any other action.

m.dark_veil = Dark Veil
d.dark_veil = Increases the defensive power of the shadow cloak.

m.enduring_night = Enduring Night
d.enduring_night = Increases duration of the shadow cloak.

m.deadly_shadow_cloak = Deadly Shadow Cloak
d.deadly_shadow_cloak = Gain an attack power and attack speed bonus when shadow cloak activates. \
	Bonus lasts for a short duration after shadow cloak expires.

m.vengeful_shadow_cloak = Vengeful Shadow Cloak
d.vengeful_shadow_cloak = Creates an explosive disruption field around you when shadow cloak is \
	interrupted that has a chance to stun targets.

m.hexing_haze = Hexing Haze
d.hexing_haze = Creates a miasma around you that hexes any target within. Each hex has a \
	timer that deals damage to its target upon termination. For every target acquired by \
	hexing haze, the duration of the miasma increases.

m.no_mercy = No Mercy
d.no_mercy = Increases the damage inflicted by hexing haze.

m.plentiful_pain = Plentiful Pain
d.plentiful_pain = Increases the bonus duration of hexing haze as additional targets \
	are acquired.

m.haunted_haze = Haunted Haze
d.haunted_haze = Any target that dies as a result of the damage caused by hexing haze will \
	spawn a vengeful ghost that seeks out other targets and explodes on impact.

m.chaotic_haze = Chaotic Haze
d.chaotic_haze = Targets damaged by hexing haze have a chance of receiving a random status condition.


