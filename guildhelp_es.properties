t.hall = Sal\u00f3n de Gremio
t.guild_hall_header = Sal\u00f3n de Gremio
m.guild_hall_info = El Sal\u00f3n de Gremio es el centro nervioso de cualquier gremio de Spiral \
  Knights.  Aqu\u00ed, los miembros del gremio pueden relajarse, planear misiones futuras y \
  tomar ventaja de las diversas instalaciones a su disposici\u00f3n.  El Sal\u00f3n de Gremio \
  es extremadamente personalizable y se puede expandir para acomodarse a gremios de cualquier \
  tama\u00f1o.  Tambi\u00e9n contiene una gran variedad de mobiliario y habitaciones \u00fanicas, as\u00ed \
  que coordina con tus amigos para hacer de tu Sal\u00f3n de Gremio \u00a1un verdadero reflejo \
  de tu gremio!\n\
  \n\
  Cuando se abre un Sal\u00f3n de Gremio por primera vez, consiste de dos habitaciones: un \
  lobby y el cuarto de la Consola de Mando.  Los Gremios que deseen m\u00e1s espacio para \
  personalizar pueden comprar expansiones para aumentar el tama\u00f1o base de su Sal\u00f3n de Gremio. Estas est\u00e1\
  n disponibles en la Consola de Mando mientras se est\u00e1 en Modo de Dise\u00f1o. \n\
  Los Gremios que han expandido el espacio utilizable de su sal\u00f3n pueden llenar ese \
  espacio con una variedad de habitaciones, disponibles para su compra en el Emporio Birdsong. \
  Pueden ser tan sencillas como un cuarto vac\u00edo para poner muebles, o pueden contener \
  alguna de las diferentes instalaciones para gremios, \u00a1como terminales de alquimia, \
  tiendas y m\u00e1s!\n\
  \n\
  Los Salones de Gremio requieren de una gran cantidad de recursos, lo que representa como un \
  costo de mantenimiento en Crowns por semana. Mientras el Sal\u00f3n de Gremio gana en \
  expansiones y habitaciones este costo se incrementa, \u00a1as\u00ed que aseg\u00farate de que \
  haya suficientes Crowns en la Tesorer\u00eda del Gremio para pagarlo todo!

t.treasury = Tesorer\u00eda
t.treasury_header = Tesorer\u00eda
m.treasury_info = La Tesorer\u00eda del Gremio contiene todos los art\u00edculos y crowns que \
  son propiedad colectiva del gremio.  Para poder colocarse en un Sal\u00f3n de Gremio, el \
  mobiliario debe primero a\u00f1adirse a la Tesorer\u00eda de ese gremio.  El costo de nuevas \
  habitaciones, art\u00edculos del Emporio Birdsong y el mantenimiento semanal tambi\u00e9n se pagan de la Tesorer\u00eda, \u00a1as\u00ed \
  que los miembros del gremio deben asegurarse de mantener la Tesorer\u00eda del Gremio llena \
  de crowns! \n\
  \n\
  ADVERTENCIA: Cualquier cosa que se a\u00f1ada a la Tesorer\u00eda del Gremio nunca podr\u00e1 \
  ser removida por ninguno de los miembros del gremio, incluyendo el l\u00edder del gremio.  Al a\u00f1adir art\u00ed\
  culos o crowns a la Tesorer\u00eda del Gremio, estos pasan a formar parte de la propiedad del \
  gremio para siempre. No hay excepciones.
l.treasury_console = Se puede ganar acceso a la Tesorer\u00eda del Gremio desde la Consola de \
  Mando. | action | console

t.emporium_header = Emporio Birdsong
m.emporium_info = El Emporio Birdsong permite que los miembros del gremio de alto rango compren \
  art\u00edculos para el gremio usando los fondos de la Tesorer\u00eda del Gremio.  Estos art\u00ed\
  culos incluyen diversos art\u00edculos de mobiliario y mejoras para el Sal\u00f3n de Gremio.  Los art\u00ed\
  culos comprados van directamente a la Tesorer\u00eda del Gremio, por lo que nunca pueden ser \
  removidos del Sal\u00f3n de Gremio.  Hay varios tipos y tama\u00f1o de mobiliario y se usa \
  para decorar las habitaciones y pasillos de tu Sal\u00f3n de Gremio para hacerlos m\u00e1s hogare\u00f1os. \u00a1Algunos muebles tambi\u00e9\
  n tienen efectos especiales al activarlos!\n\
  \n\
  Cualquier mueble que est\u00e9 actualmente en la Tesorer\u00eda del Gremio se puede colocar \
  en el Sal\u00f3n de Gremio usando el Modo de Dise\u00f1o.  El Emporio Birdsong es tambi\u00e9\
  n el lugar donde se comprar habitaciones para llenar nuevas expansiones o para reemplazar \
  habitaciones existentes con otras nuevas y diferentes. Conforme el Sal\u00f3n de Gremio \
  aumenta su tama\u00f1o al a\u00f1adir expansiones, la selecci\u00f3n de art\u00edculos \
  disponibles en el cat\u00e1logo del Emporio Birdsong tambi\u00e9n aumenta.  \u00a1Aseg\u00fa\
  rate de revisar seguido para ver lo que est\u00e1 disponible!
l.emporium_console = Se puede ganar acceso al Emporio Birdsong y al Modo de Dise\u00f1o desde \
  la Consola de Mando. | action | console

t.storage = Almac\u00e9n
t.storage_header = Almac\u00e9n
m.storage_info = El Almac\u00e9n del Gremio funciona como un Arsenal compartido. Los miembros \
  del gremio del rango apropiado pueden a\u00f1adir o quitar equipo o art\u00edculos del Almac\u00e9n como deseen.  \u00a1\
  Es una gran manera de compartir recursos entre los miembros del gremio, o de ayudar a los \
  nuevos miembros!\n\
  \n\
  ADVERTENCIA: Los art\u00edculos colocados en el Almac\u00e9n del Gremio pueden ser removidos \
  y reclamados por cualquier miembro del gremio con acceso al Almac\u00e9n del Gremio.  \u00a1No pongas en el Almac\u00e9n de Gremio art\u00ed\
  culos que quieras para ti!
l.storage_console = Se puede ganar acceso al Almac\u00e9n del Gremio desde la Consola de Mando. \
  | action | console

t.design = Modo de Dise\u00f1o
t.design_header = Modo de Dise\u00f1o
m.design_info = El Modo de Dise\u00f1o permite a los miembros del gremio de suficiente rango \
  acomodar el mobiliario y la dem\u00e1s infraestructura dentro del Sal\u00f3n de Gremio.  Una \
  vez que est\u00e9 en Modo de Dise\u00f1o, los muebles se pueden levantar y se pueden volver a \
  colocar de igual manera que una Gold Key o una Estatua Pesada, tambi\u00e9n se pueden rotar \
  al sostenerlos usando la Rueda del Rat\u00f3n y los puedes regresar a la Tesorer\u00eda \
  usando la tecla X en el teclado. \n\
  \n\
  Cuando est\u00e9s satisfecho con la decoraci\u00f3n, puedes Publicar tus cambios desde la \
  Consola de Mando para hacerlos visibles para el resto de tu gremio.
u.design_wiki = Una lista completa del mobiliario disponible se puede encontrar en nuestro wiki \
  oficial. | URL | http://wiki.spiralknights.com/es/Mobiliario
l.design_console = Se puede ganar acceso al Modo de Dise\u00f1o desde la Consola de Comando. | \
  action | console

t.record = Registros del Gremio
t.record_header = Registros
m.record_info = Los Registros del Gremio llevan un importante diario de la actividad reciente \
  dentro del gremio, tales como donativos a la Tesorer\u00eda del Gremio, dep\u00f3sitos y \
  retiros de los diversos Almacenes de Gremio, promociones, adiciones o salidas de miembros del \
  gremio.  \n\
  \n\
  Permiten que los miembros del gremio de alto rango est\u00e9n al tanto de qui\u00e9n ha hecho \
  donativos o qui\u00e9n ha sacado bastante del gremio y as\u00ed puedan actuar en \
  consecuencia.
l.record_console = Se puede ganar acceso a los Registros del Gremio desde la Consola de Mando. \
  | action | console
