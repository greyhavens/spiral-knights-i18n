m.casino_jelly_a = Glorp! Ich habe eine Crown verschluckt. Schmackhaft.
m.casino_jelly_b = Ich komme gerade vom Friseur. Sieht man das?
m.casino_jelly_c = Eines Tages gewinne ich genug, um mir meinen eigenen Palast zu bauen. Glorp \
  glorp!

m.casino_yesman_a = Am\u00fcsier' dich!
m.casino_yesman_b = Jederglibber ist willkommen im Golden Slime!
m.casino_yesman_c = Es tut mir leid, dass du die Happy Hour um eine Minute verpasst hast. N\u00e4chstes Mal.
m.casino_yesman_d = Jederglibber ist ein Gewinner im Golden Slime!
m.casino_yesman_e = Angestellte von Undercorp bekommen eine Gratis-Tasse bei jedem Besuch.

m.casino_pitboss_a = Die Produktivit\u00e4t ist um zwei Prozent gestiegen, seit ich \
  verpflichtende \u00dcberstunden begonnen habe.
m.casino_pitboss_b = Ich habe mich selbst zum Senior Manager Gr\u00e4sslicher Ger\u00e4te der Zerst\u00f6rung bef\u00f6rdert.
m.casino_pitboss_c = Ich habe meine Angestellten hart daf\u00fcr arbeiten lassen, dass ich \
  heute stehe, wo ich stehe.
m.casino_pitboss_d = Ich habe gerade eine weitere Gro\u00dfbestellung f\u00fcr B\u00fcroartikel \
  aufgegeben. Sie gehen uns st\u00e4ndig aus.
m.casino_pitboss_e = Der Kerl von Teufel-IT wollte unser B\u00fcro komplett auf Glyphen-Nutzung \
  umstellen, aber ich verschwende gerne Papier, wenn ich dazu Gelegenheit habe.,

m.casino_monster_a = Hey, nicht schummeln!
m.casino_monster_b = H\u00f6r' auf, mir \u00fcber die Schulter zu schauen!
m.casino_monster_c = Ich glaube, niemandem wird auffallen, dass ich weg bin.
m.casino_monster_d = Kann ich mir deine Waffe leihen?
m.casino_monster_e = Hey, runter da vorne!
m.casino_monster_f = Pssst, sag' niemandem, dass ich hier bin.

m.casino_klepto_a = Ich werde nichts stehlen... ich schw\u00f6r'!
m.casino_klepto_b = Hey, was ist das da dr\u00fcben?
m.casino_klepto_c = Ich bin nicht der Kleptolisk, den du suchst.

m.casino_skelly_a = Soo... hell....
m.casino_skelly_b = Versuchs nochmal...
m.casino_skelly_c = Ich war nie weg...

m.casino_royaljelly_a = Ich bin gerade von Moorcroft eingeflogen, und Junge, sind meine Royal \
  Cores ersch\u00f6pft.
m.casino_royaljelly_b = Hier hast du einen Jelly Gem...
m.casino_royaljelly_c = Schlubbern drei Lichen in ein Zimmer...
m.casino_royaljelly_d = Denk' daran, deiner Bedienung Trinkgeld zu geben.

m.casino_guard_a = Glorp! Keine Probleme hier.
m.casino_guard_b = Golde Slime heisst dich willkommen. Glorp!
m.casino_guard_c = Glorp glorp. Hab' Spa\u00df.

m.casino_imposto_a = Noch einen Gel Core bitte. Gesch\u00fcttelt.
m.casino_imposto_b = Oh, dich habe ich hier bisher noch nie gesehen.
m.casino_imposto_c = Herr Ober? Oh, entschuldigen Sie, guter Sir.

