## TIER GUARD

# Tier Guard
#...................................................................................................


m.tier_1_requirements = Sei gegr\u00fc\u00dft, {0}. Um weitergehen und die tieferen Tiefen des \
  Uhrwerks erforschen zu d\u00fcrfen, musst du zuerst Rang 4-2 erreichen.\n\
  \n\
  Komme hierher zur\u00fcck, wenn du die n\u00f6tigen Rang-Missionen absolviert hast.

m.tier_2_requirements = Sei gegr\u00fc\u00dft, {0}. Um weitergehen und die tieferen Tiefen des \
  Uhrwerks erforschen zu d\u00fcrfen, musst du zuerst Rang 7-1 erreichen.\n\
  \n\
  Komme hierher zur\u00fcck, wenn du die n\u00f6tigen Rang-Missionen absolviert hast.

r.tier_unequipped = Verstanden, ich kehre f\u00fcr den Moment um.

m.tier_done = Sei gegr\u00fc\u00dft, {0}. Nachdem du den n\u00f6tigen Rang erreicht hast, hast \
  du nun die Erlaubnis, die tieferen Tiefen des Uhrwerks zu erforschen. Viel Gl\u00fcck.

r.tier_accept = Verstanden, bin unterwegs.

## FIRESTORM CITADEL

# Lost Soul 1: Greeter
#...................................................................................................


m.fc_greeter_1 = Beachte meine Warnung, Reisender! Dies ist ein gef\u00e4hrliches und \
  schreckliches Land. Du stehst vor den Toren der Feuersturm-Zitadelle, dem einstigen Herzen \
  des K\u00f6nigreichs von Almire, das dem Feuer und der Dunkelheit anheimgefallen ist.\n\
  \n\
  Geh fort von hier, wenn dir dein Leben lieb ist.

r.fc_greeter_1 = Ich bin so weit gereist, da kann ich nicht umkehren.

m.fc_greeter_2 = M\u00f6ge dein Ende kurz und schmerzlos sein.

r.fc_greeter_2 = Gespr\u00e4ch beenden


# Lost Soul 2: Bridge End
#...................................................................................................


m.fc_bridge_1 = Nur wenige schaffen es \u00fcber die Br\u00fccke, Reisender. Vielleicht hast du \
  ja eine Chance zu \u00fcberleben oder vielleicht... nein, selbst die Sprites unten werden von \
  Vanadukes Flammen verschlungen. Es ist hoffnungslos.


r.fc_bridge_1b = Ich darf nicht aufgeben.

m.fc_bridge_2 = Lord Vanaduke ist der Herrscher dieses gebrochenen Landes. Einst war Vanaduke \
  der K\u00f6nig von Almire, doch nun befehligt er eine schreckliche Legion in der Asche seines \
  einstigen K\u00f6nigreichs. Du solltest ihm aus dem Weg gehen.

r.fc_bridge_2 = Ich bin nicht hier, um mich mit Vanaduke anzulegen.

m.fc_bridge_3 = Du hast keine Wahl.

r.fc_bridge_3 = Gespr\u00e4ch beenden


# Court Sprite 1
#...................................................................................................


m.fc_court_1 = Du ... du geh\u00f6rst nicht zu den Verirrten. Du musst stark sein, weil du's \
  bis hierher geschafft hast. Bitte, hilf mir!

r.fc_court_1 = Wem soll ich helfen?

m.fc_court_2 = Ich bin ein Sprite, eine nat\u00fcrliche Kraft, die in dieses Land gerufen \
  wurde, um das unnat\u00fcrliche Feuer zu l\u00f6schen, das es verzehrt. Aber Vanaduke hat uns \
  entdeckt und eingesperrt. Ich konnte entkommen, aber die anderen Sprites sind noch immer \
  gefangen. \n\
  \n\
  Nun kann keiner weiter als bis zum Hof gelangen, denn S\u00e4ulen aus Schattenfeuer \
  versperren die Ausg\u00e4nge. Schattenfeuer kann nur mit dem Wasser, das aus diesen \
  Geisterquellen entspringt, gel\u00f6scht werden. Es ist das reinste Wasser in der Natur und \
  flie\u00dft direkt aus den Quellen des Landes der Geistmutter selbst.

r.fc_court_2 = Diese Brunnen sind ausgetrocknet...

m.fc_court_3 = Ohne die Kraft der anderen Sprites wird niemals wieder Wasser durch dieses Land \
  flie\u00dfen. Wir m\u00fcssen uns auf die Verbindung zur Geistmutter konzentrieren, um auch \
  nur ein paar Tropfen Wasser auf diese unterdr\u00fcckte Welt hinabregnen zu lassen. Der \
  Herrscher dieses Landes hat daf\u00fcr gesorgt, dass die Flammen um ihn herum f\u00fcr immer lodern.

r.fc_court_3 = Ich befreie die Sprites!

m.fc_court_4 = Dann bist du ein tapferer Reisender. Du findest mein Volk \u00fcberall in diesem \
  Hof. Doch sei auf der Hut, denn Vanadukes schreckliche Diener bewachen sie. Die meisten \
  bewachen den Hauptweg, sei also wachsam, wenn du weitergehst.\n\
  \n\
  Wenn du ein Sprite findest, bring es zur\u00fcck zum heiligen Kreis vor dir. Sie sind \
  zweifellos durch Vanadukes Fluch geschw\u00e4cht und es muss ihnen neues Leben eingehaucht \
  werden. Wenn sechs von uns wiedervereint sind, werden wir eine Verbindung zur Geistmutter \
  herstellen und die Brunnen mit Wasser f\u00fcllen.

r.fc_court_4_accept = 6 Lost Sprites befreien? Das schaffe ich!
r.fc_court_4 = Ich bin bald zur\u00fcck.

m.fc_court_5 = M\u00f6ge die Geistmutter mit dir sein.

r.fc_court_5 = Gespr\u00e4ch beenden


# Court Sprite 2
#...................................................................................................

m.fc_court_reminder_1 = Wenn du ein Sprite findest, bring es zur\u00fcck zum heiligen Kreis vor \
  dir. Sie sind zweifellos durch Vanadukes Fluch geschw\u00e4cht und es muss ihnen neues Leben \
  eingehaucht werden. Wenn wir wieder alle vereint sind, werden wir eine Verbindung zur \
  Geistmutter herstellen und die Brunnen mit Wasser f\u00fcllen. \n\
  \n\
  Bitte beeil dich!

r.fc_reminder_1 = Gespr\u00e4ch beenden


# Court Sprite 3
#...................................................................................................

m.fc_court_complete_1 = Unsere Verbindung zur Geistmutter ist jetzt stark dank dir! Nimm das \
  Wasser aus den Geisterquellen und l\u00f6sche damit das Schattenfeuer. Der Pfad voraus ist \
  voller Schattenfeuer und wimmelt von Vanadukes Dienern. Wir Sprites k\u00f6nnen dich zwar \
  nicht im Kampf unterst\u00fctzten, aber wir werden an bestimmten Orten Geisterquellen \
  entstehen lassen.

r.fc_court_complete_1 = Das wird mir eine gro\u00dfe Hilfe sein, vielen Dank!



## CORE RESEARCH

# Vaelyn
#...................................................................................................

n.parmas_scout = Parmas Aufkl\u00e4rer

m.core_lead_1 = Gr\u00fc\u00dfe! Ich bin Leutnant Vaelyn, der kommandierende Offizier f\u00fcr \
  die Erforschung des Core. Du bist eindeutig einer der st\u00e4rksten der Spiral Knights, der \
  diese infernalischen Tiefen erreicht, aber St\u00e4rke allein wird dich nicht weiter bringen.

r.core_lead_1 = Wie ist die Lage, Leutnant?

m.core_lead_2 = Wir versuchen, einen Weg zu finden, den Core durch die Kraft der Mineralien aus \
  dem Uhrwerk zu aktivieren. Diese Mineralien sind in der Lage, das Uhrwerk zu ver\u00e4ndern - \
  wir haben das in der Arcade von Haven gesehen. Wir glauben, wie k\u00f6nnen diese Kraft \
  nutzen, den Core zu aktivieren und ... irgendwie zu \u00f6ffnen.

r.core_lead_2 = Ihr wollt ihn \u00f6ffnen?

m.core_lead_3 = Ja, Captain Ozlo h\u00f6chstpers\u00f6nlich hat befohlen, dass wir so lange wie \
  m\u00f6glich durchhalten und herausfinden, so viel wir k\u00f6nnen. Wenn wir je diesen \
  Planeten verlassen, wird es wegen des Core sein.\n\
  \n\
  Ich bin sicher, dass der Core au\u00dfer einer Energiequelle auch eine Art Nervenzentrum f\u00fc\
  r alles ist, was du im Uhrwerk siehst. Man kann es in der wenigen Luft hier unten f\u00fchlen; ein seltsames Gef\u00fc\
  hl, dass das hier mehr als nur eine Maschine ist.

r.core_lead_3 = Sagst du, dass er... lebt?

m.core_lead_4 = Ich sage, wir wissen, dass diese ganze Welt nicht nat\u00fcrlich ist, und ich f\u00fc\
  r meinen Teil glaube nicht, dass diese Horden mieser Gremlins, egal, wie flei\u00dfig sie \
  sind, eine ganze Welt gebaut haben k\u00f6nnten. Sie m\u00fcssen Hilfe gehabt haben, von \
  etwas weit jenseits ihrere M\u00f6glichkeiten, und vielleicht befindet sich das im Core.\n\
  \n\
  Das gleiche gilt f\u00fcr das Alpha-Team. Es w\u00e4re nicht einfach verschwunden, selbst in \
  den tiefsten Tiefen des Uhrwerks. Sie waren unsere allerbesten. Es war der Core, der sie \
  verschlungen hat.

r.core_lead_4 = Aber ich dachte, es g\u00e4be keinen Weg hinein?

m.core_lead_5 = Ich weiss nicht wie, aber sie werden einen Weg gefunden haben. Sie m\u00fc\
  ssen... und jetzt sind sie verschwunden.

r.core_lead_5 = Konversation beenden


# Technician
#...................................................................................................

n.core_tech = Techniker

m.core_tech_1 = Willkommen im Core-Forschungslager vor Ort. Hast du Neuigkeiten von der Oberfl\u00e4che?

r.core_tech_1 = Ich w\u00fcsste gerne, wie ich helfen kann.

m.core_tech_2 = Das ist einfach, sammle weiter Mineralien im Uhrwerk und versorge damit die \
  Tore in der Arcade. Wir m\u00fcssen analysieren, wie die Kraft der Mineralien den Core \
  beeinflusst. Das Problem ist, dass nur sehr wenig davon bis hier unten reicht. Wir k\u00f6\
  nnen nur begrenzt Daten von jedem Tor sammeln, wenn es sich \u00f6ffnet.

r.core_tech_2 = Sonst noch was?

m.core_tech_3 = Frischluft? W\u00e4rme? Diese Tiefen sind keine Umgebung, in der viele von uns \
  es lange aushalten, aber der Leutnant besteht darauf, dass wir dranbleiben und dass \
  vielleicht das n\u00e4chste sich \u00f6ffnende Tor uns die Antworten gibt, die wir brauchen.

r.core_tech_3 = Ich werde weiter das Uhrwerk erforschen und die f\u00fcr die Forschung ben\u00f6\
  tigten Mineralien sammeln.

# Rank 10+
#...................................................................................................
m.mission_crimson_chaos_recon_1 = Freut mich, dich zu sehen! Als ich h\u00f6rte, dass sie dich \
  schicken, {0}, konnte ich es nicht glauben. DEN Vernichter von Vanaduke! Es ist eine Ehre \
  unter dir zu dienen.
r.mission_crimson_chaos_recon_1 = Was habt ihr gefunden?
m.mission_crimson_chaos_recon_2 = Das ist es ja, {0}, nichts. Wir haben die Basis dort unten f\u00fc\
  r Wochen beobachtet, dann wurde es ruhig. Sehr pl\u00f6tzlich. Wir wissen nicht, was du da \
  unten finden wirst. Unsere Sensoren zeigen keine aktiven Lebensformen.
r.mission_crimson_chaos_recon_2 = Danke f\u00fcr die Informationen, ich werde es mir ansehen.

m.mission_camefrombelow = Alle sind weg. Es.. es kam von unten.

# Unnamed NPCs
#...................................................................................................

m.core_resting_1 = Keine Sorge. Er zieht das durch.

m.core_resting_2 = Ich kann es kaum erwarten, nach Haven zur\u00fcckzukommen...

m.core_resting_3 = Ich hoffe diese Vorr\u00e4te kommen bald.

m.core_guard_1 = Du solltest mit Vaelyn reden.

m.core_guard_2 = Bringst du uns Vorr\u00e4te?

m.core_busy_1 = Entschuldigung. Kann jetzt nicht reden.


m.barracks_booster_1 = M\u00f6chtest du sogar noch mehr Krogmo Coins bei jedem Kampf verdienen?

m.barracks_booster_2 = Kaufe einen Krogmo Coin Booster beim Aufr\u00fcstungs-H\u00e4ndler!

## RETURN TO FIRESTORM CITADEL


m.rfc_court_1a = Sei abermals gegr\u00fc\u00dft, Sternengeborener.
r.rfc_court_1a = Sternengeboren?
m.rfc_court_2a = Ja, wir Natur-Sprites sind der Regen, die Wurzel und die Erde. Aber du bist \
  nicht wie wir. Du bist wie jene von unten.
r.rfc_court_2a = Wo wir gerade von 'unten' sprechen, wie komme ich jetzt dorthin? Dieser Ort \
  hier bricht zusammen!
m.rfc_court_3a = Leider ist es so, dass wir selbst nachdem unsere Verbindung zur Spirit Mother \
  wiederhergestellt wurde, nur bedingt viel zur Rettung dieses Orts beitragen k\u00f6nnen. \
  Dennoch, selbst wenn ein Pfad verschlossen wird, k\u00f6nnte sich ein anderer auftun. Es \
  liegt in der Natur dieser sich ver\u00e4ndernden Welt. Viel Gl\u00fcck, Sternengeborener.
r.rfc_court_3a = (Konversation beenden)

m.rfc_court_4a = Obwohl du Vanaduke besiegt hast, scheint es als w\u00fcrde der Fluch, den er \u00fc\
  ber diesen Ort gebracht hat, noch immer verweilen. Es braucht all unsere Kraft, diese w\u00fc\
  tenden Schattenfeuer im Zaum zu halten.

m.rfc_court_5a = Wir alle konnten den Moment sp\u00fcren, in dem du Vanaduke besiegt hast. Die \
  gesamte Zitadelle erbebte als er fiel und f\u00fcr einen Moment dachten wir, dass dieses \
  Reich zusammen mit seinem Herrscher zerst\u00f6rt w\u00fcrde. Du muss sehr vorsichtig auf \
  deinem Weg durch diese Hallen sein, jetzt wo er derart zerf\u00e4llt!

m.rfc_court_6a = Halte ein, Reisender. Du stehst im Hofe des K\u00f6nigreichs von Almire. H\u00f6\
  rst du nicht die Fanfaren, die die R\u00fcckkehr der m\u00e4chtigen Legionen verk\u00fcnden? \
  Erzitterst du nicht in Ehrfurcht vor den pr\u00e4chtigen Bannern unserer gro\u00dfartigen H\u00e4user und Staatsm\u00e4nner?

r.rfc_court_6a = Sicher, es scheint sehr beeindruckend.
r.rfc_court_6b = Ich sehe oder h\u00f6re nichts dergleichen.

m.rfc_court_7a = (Du sp\u00fcrst den gro\u00dfen Stolz  des gefallenen Ritters, doch er sagt \
  nichts mehr und starrt in die Ferne, auf ein Lebensalter, das nur er sieht.)
m.rfc_court_7b = (Deine Worte scheinen den gefallenen Ritter nicht zu ber\u00fchren; seine \
  Gedanken scheinen sich irgendwo in den glorreichen Zeiten seiner Vergangenheit verloren zu \
  haben.)

r.rfc_court_8a = (Konversation beenden)

n.rfc_noble_1 = Verirrter H\u00f6fling
n.rfc_dungeon_1a = Ich verweilte in diesen Hallen, sogar nach all diesen langen Jahrhunderten, \
  meine ewige Ruhe verwehrt von meinem verfluchten Herrn. Ich f\u00fchle seinen Geist sogar \
  jetzt noch an diesem zerbrochenen Reich festhalten. Er weigert sich, zu gehen, und weiht uns \
  damit alle dem Untergang.

n.rfc_noble_2 = Gefangener Nobelmann
n.rfc_dungeon_2a = Ich wurde hier vor \u00fcber tausend Jahren eingekerkert, als Strafe, weil \
  ich meine Stimme gegen meinen Lehensherrn erhoben habe; verurteilt, auf Lebenszeit hier zu \
  sein. Als die Feuer die Zitadelle heimsuchten fand ich noch nicht einmal im Tod Freiheit. \
  Meine Selle ist an diese verfluchten Steine gebunden.

# Scenario NPCs
#...................................................................................................
t.npc_campguard = Wache des Lagers
m.npc_campguard_a = Pass da draussen auf dich auf, Knight.
m.npc_campguard_b = Willkommen in unserem Lager! Setz dich ans Lagerfeuer, wenn du etwas Rast \
  brauchst.
m.npc_campguard_c = Wir ruhen uns hier ein wenig aus bevor wir weiter ins Uhrwerk vordringen.
m.npc_campguard_d = Ich halte hier Wache. Man weiss nie, wann Monster angreifen k\u00f6nnten.
m.npc_campguard_e = Gr\u00fc\u00dfe!

t.npc_veteran = Knight-Veteran
m.npc_veteran_a = Ich habe immer eine Auwahl an Ausr\u00fcstung dabei... nur f\u00fcr alle F\u00e4lle.
m.npc_veteran_b = Vergiss deinen Schild nicht, er wird dein Leben retten!
m.npc_veteran_c = Ich trage immer einen Blaster, man weiss nie, wann er n\u00fctzlich sin k\u00f6nnte.
m.npc_veteran_d = Ich muss diese neuen Rekruten vor \u00c4rger bewahren.
m.npc_veteran_e = Eine Bombe ist eine tolle M\u00f6glichkeit, mit Horden von Monstern fertig zu \
  werden.
m.npc_veteran_f = Ich habe f\u00fcr diese direkten Auseinandersetzungen ein Schwert dabei.
m.npc_veteran_g = Gute Vorbereitung ist der beste Weg im Uhrwerk zu \u00fcberleben.
m.npc_veteran_h = Bleib bei deiner Truppe - denke daran, dass es gef\u00e4hrlich ist, allein \
  loszuziehen!

m.npc_captainknight_a = Erinnert euch an euer Training, Knights!
m.npc_captainknight_b = Hebt eure Schilde, um Attacken abzuwehren!
m.npc_captainknight_c = Vergesst nicht, eure Bombe zu z\u00fcnden!
m.npc_captainknight_d = Koordiniert eure Attacken!
m.npc_captainknight_e = Nutzt die Umgebung zu eurem Vorteil!
m.npc_captainknight_f = Geht in Deckung, wenn ihr \u00fcberrumpelt werdet!
m.npc_captainknight_g = Denkt daran, euren Truppenmitgliedern zu helfen!

t.npc_recruit = Rekrut
m.npc_recruit_a = Ich muss mich nur ein wenig ausruhen bevor es weitergeht.
m.npc_recruit_b = Habe ich mein Calibur bei der Arsenal Station gelassen...?
m.npc_recruit_c = Ich glaube ich muss einen besseren Schild bauen, wenn ich zur\u00fcck in Haven bin.
m.npc_recruit_d = Das ist meine erste Expedition ins Uhrwerk!
m.npc_recruit_e = Hast du irgendwelche Tips f\u00fcr mich?
m.npc_recruit_f = Wo ist die Sicherung bei diesem Ding?
m.npc_recruit_g = Hast du schon eine Gefahrenzone gesehen? Ich habe geh\u00f6rt, die sind echt hart.

m.npc_survivorknight_a = Sie... Sie haben alle erwischt ausser mir. Ich habe mich einfach in \
  einer Ecke versteckt.
m.npc_survivorknight_b = Sie kamen aus der Dunkelheit. Es war keine Zeit zu reagieren.
m.npc_survivorknight_c = Ich habe nicht danach gefragt.

m.npc_mineraltech_a = Ich bin ein Feldforscher, der f\u00fcr Chief Geo Knight Wegner arbeitet.
m.npc_mineraltech_b = Hmm, bestimmte Kombinationen scheinen unterschiedliche Arten von Monstern \
  anzuziehen.
m.npc_mineraltech_c = K\u00fcmmere dich nicht um Hubert, seine Stacheln wurden entfernt.

m.npc_minerknight_a = Du kannst immer nur ein Mineral auf einmal tragen, also suche dir das gr\u00f6\u00dfte St\u00fcck aus.
m.npc_minerknight_b = Das Spiral HQ will, dass wir diese Mineralien hoch nach Haven schaffen.
m.npc_minerknight_c = Sie sagen, dass diese Mineralien jedes Tor in der Arcade betreiben.

m.npc_techknight_a = Ich sammle Proben von \u00fcberall in dieser Schicht.
m.npc_techknight_b = Brauchbare Daten sind wie guter Pudding, man kann nie genug davon haben.
m.npc_techknight_c = Nur ein paar mehr Tests..

m.npc_campknight_a = Setz dich und ruh dich eine Weile aus.
m.npc_campknight_b = Komm, w\u00e4rme dich am Feuer auf.
m.npc_campknight_c = Ich f\u00fchle bereits wie der Frost schmilzt.

m.npc_graveknight_a = Nein, es sind einfach zu viele... ich kann sie nicht l\u00e4nger bek\u00e4mpfen. Alles was \u00fc\
  brig ist ist das Licht dieser Kerzen. Ohne es, ich...

m.npc_rummageknight_a = Ich bin sicher, es war hier irgendwo...
m.npc_rummageknight_b = Ich kann gerade nicht reden.

m.npc_supplies_a = Diese Vorr\u00e4te kamen gerade rechtzeitig.
m.npc_supplies_b = Es ist Tage her, dass wir frische Vorr\u00e4te hatten.
m.npc_supplies_c = Danke f\u00fcr das Aufstocken unserer Vorr\u00e4te.

m.npc_onwatch_a = Ich kann gerade nicht sprechen, ich bin auf Wache.
m.npc_onwatch_b = Ich weiss, sie werden wiederkommen.
m.npc_onwatch_c = Hast du da drau\u00dfen etwas gesehen?

m.npc_lostknight_a = Danke, dass du mich "gerettet" hast, aber ich f\u00fchle mich gut.
m.npc_lostknight_b = Es ist gut zu wissen, dass Spiral HQ mich nicht vergessen hat.
m.npc_lostknight_c = Ich k\u00f6nnte gehen, aber denk an all das, was ich lernen k\u00f6nnte, wenn ich bleibe!

m.npc_teaser_knight = Diese letzte Mission war definitiv eine seltsame. Wir haben uns den Weg \
  zu einem Transporter freigemacht, als wir einige seltsame Strukturen in der Entfernung \
  bemerkt haben. Wir haben aber keinen Weg entdeckt, sie zu erreichen. Ich sch\u00e4tze, wir m\u00fc\
  ssen einfach danach Ausschau halten in der Zukunft. Das Uhrwerk bewegt sich schlie\u00dflich st\u00e4ndig.
r.npc_teaser_knight = Konversation beenden.

m.npc_supply_teaser_knight = Tut mir leid, ich habe nicht viel Zeit, zu reden. Ich muss all \
  diese Versorgungsg\u00fcter hinunter zu unseren Vorposten bringen. Die Leute vergessen gerne, \
  dass ohne Knights wie uns, die Vorr\u00e4te hinunter ins Uhrwerk bringen, unsere M\u00f6\
  glichkeiten, weiter entfernt liegende Gebiete auszusp\u00e4hen, erheblich begrenzter w\u00e4ren. Was f\u00fc\
  r ein undankbarer Job, was?

# Casino NPCs
