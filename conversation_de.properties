  zu entkommen und eine Ladung Grinchlin-Sch\u00e4tze auf dem Weg mitzunehmen!\n\
  \n\
  Solltest du dich allerdings entscheiden, darauf zu verzichten und den Berg weiter zu \
  besteigen, warten noch gr\u00f6\u00dfere Sch\u00e4tze....

r.winterfest_branch_exit = Modul schlie\u00dfen

n.winterfest_campknight = Campwache
m.winterfest_campknight_1a = Es ist ein gef\u00e4hrlicher Aufstieg, {0}. Achte auf deinen Tritt \
  und vorsicht vor den Grinchlin-Fallen!
m.winterfest_campknight_2a = S,,,sss,,,,sooo ka... kaka... kaaalt...
m.winterfest_campknight_3a = Diese Grinchlins sind trickreich und unvorhersagbar. Ich empehle, \
  genug Ausr\u00fcstung mitzunehmen um auf alles vorbereitet zu sein, was sie nach dir werfen.
r.winterfest_campknight_1a = Gespr\u00e4ch beenden

# Anniversary
#...................................................................................................


m.biscotti_1 = Hallo auch, ich bin Biscotti, Chefk\u00f6chin der Skylark! Es k\u00f6nnte sein, \
  dass wir uns gerade mit einer Situation rumschlagen, bei der intelligente, monstr\u00f6se \
  Kuchen, vielleicht oder vielleicht auch nicht, eine Rolle spielen und die, vielleicht oder \
  vielleicht auch nicht, meine K\u00fcche komplett erobert und sich im Uhrwerk ausgebreitet \
  haben.\n\
  \n\
  Ich habe mit den Strangers ausgemacht, dass sie Belohnungen f\u00fcr diejenigen \
  bereitstellen, die Kuchenst\u00fccke als Beweis daf\u00fcr abliefern, dass sie bei der Ausl\u00f6\
  schung dieser furchtbaren Monster geholfen haben, die es vielleicht gibt - oder vielleicht \
  auch nicht.

r.biscotti_1 = Das klingt alles sehr merkw\u00fcrdig, aber ich helfe gern, wenn ich kann.

m.biscotti_2 = Gro\u00dfartig! Es gibt zwei Arten, auf die du mir helfen kannst:\n\
  \n\
  Nimm die neue Prestige-Mission 'Tortale Katastrophe' an, die t\u00e4glich verf\u00fcgbar ist.\n\
  \n\
  Oder du kannst das Uhrwerk bereisen und den Befall mit 'Creep Cakes' dort bek\u00e4mpfen, soviel du m\u00f6\
  chtest. Suche einfach nach verd\u00e4chtigem Zuckerguss.

r.biscotti_2 = Nochmal, das ist wirklich seltsam, Biscotti, aber ich gebe mein Bestes.

m.biscotti_3 = Danke, {0}, ich wei\u00df das zu sch\u00e4tzen. Und tu mir einen Gefallen, bitte \
  erw\u00e4hne diesen kleinen 'Vorfall' nicht gegen\u00fcber dem Spiral HQ...

r.biscotti_3 = Gespr\u00e4ch beenden


# Tortodrone Event Haven
#...................................................................................................
n.recon = Sp\u00e4her

m.tortodrone_haven_1 = Spiral HQ hat uns Untersuchungen anstellen lassen aufgrund von Berichten \
  dar\u00fcber, dass Teile von gefallenen Tortodrones und Dark Matter \u00fcberall im Uhrwerk \
  auftauchen. Kora glaubt, dass die D\u00e4monen etwas im Schilde f\u00fchren. Es gibt \
  Hinweise, dass sie eine Rolle beim Verschwinden der Tortodrones gespielt haben.

r.tortodrone_haven_1 = Was habt ihr herausgefunden?

m.tortodrone_haven_2 = Versteckt in einem mysteri\u00f6sen Garten haben wir ein seltsames \
  Portal gefunden, das Spiral HQ d\u00fcsteres Portal nennt. Ausgehend von dem, was wir \
  entziffern konnten, wirst du eine Art Schl\u00fcssel brauchen, um es zu \u00f6ffnen. Spiral \
  HQ glaubt, dass die Glyphen, die wir entdeckt haben - die, die D\u00e4monen mit sich \
  herumtragen - etwas mit dem \u00d6ffnen des Portals zu tun haben k\u00f6nnten.

r.tortodrone_haven_2 = Danke f\u00fcr den Tip! Ich werde mir diese Glyphen besorgen!

#
# Bechamel (Guild Hall)



# Hunters Lodge
#...................................................................................................

m.hunter_1a = Hallo, mein lieber Knight, ich bin Armero, ein gro\u00dfer J\u00e4ger und Kurator \
  dieser prestigetr\u00e4chtigen Loge, die du hier siehst.\n\
  \n\
  An den W\u00e4nden befinden sich viele Troph\u00e4en, die bei mutigen Expeditionen gesammelt \
  wurden, bei denen Leib und Leben riskiert wurde, um den ungez\u00e4hmten Nervenkitzel der \
  Jagd zu erleben.\n\
  \n\
  Nun frage ich, hast du das gleiche Feuer in dir? Den gleichen Durst nach freier Wildnis, nach \
  Gefahr?

r.hunter_1a = Ich habe so meine Erfahrungen mit der Gefahr, und ich stehe darauf.

m.hunter_2a = Klasse! Dann sind du und deine Kumpane dieser Loge vielleicht von Nutzen. Siehst \
  du, mit der Alchemie-Maschine da vor dir kann man beeindruckende Monster-Troph\u00e4en f\u00fc\
  r eure Gildenhalle erstellen.\n\
  \n\
  Die Alchemie-Maschine verwendet Materialien und Crowns aus eurer Gilden-Schatzkammer und \
  platziert die Ergebnisse ebenfalls in der Gilden-Schatzkammer.

r.hunter_2a = Ah, also ist das eine Team-Aufgabe?

m.hunter_3a = In der Tat! Monster-Troph\u00e4en brauchen eine gro\u00dfe Zahl an Materialien, \
  also ist es nur sinnig, dass das die Anstrengungen einer ganzen Gruppe notwendig macht.\n\
  \n\
  Zu guter Letzt, einige der Materialien, die ihr brauchen werdet, k\u00f6nnen nur besorgt \
  werden, indem man Boss-Token bei Brinks im Basar von Haven ausgibt. Sie dienen als Beweis \
  eurer Tapferkeit, die es braucht, um solche furchterregenden Kreaturen zu besiegen!

r.hunter_3a = So beginnt nun die Jagd.

m.hunter_4a = Das ist die richtige Einstellung! Gebt diesen Monstern was sie verdienen!

r.hunter_4a = Konversation beenden.

# Monster Pockets
#...................................................................................................


m.mon_pocket_1 = Wir von der Emberlight Adoptions-Agentur sammeln Monster-Babys ein, die es \
  geschafft haben, sich in den dunkelsten Tiefen des Uhrwerks zu verirren. Nachdem sie kein \
  Zuhause mehr haben und keine M\u00f6glichkeit, sich selbst zu versorgen, versuchen wir ein \
  gutes Zuhause f\u00fcr diese bed\u00fcrftigen Monster zu finden!\n\
  \n\
  Wenn du eine dieser bezaubernden 'Monster Pockets' kaufst, kannst du dein ganz eigenes \
  Monster-Baby mit dir herumtragen!\n\
  \n\
  Die Emberlight Adoptions-Agentur wird Haven von Zeit zu Zeit wieder besuchen und man kann nie \
  wissen, was wir anzubieten haben!

r.mon_pocket_1 = Zeig mir, wen man adoptieren kann!
r.mon_pocket_2 = Danke Nonna, vielleicht beim n\u00e4chsten Mal.


# Shadow Lair Warden
#...................................................................................................


m.sl_guard_1 = Sei gegr\u00fc\u00dft, Knight. Vor dir liegen Transporter, die hinunter f\u00fc\
  hren zu dem, was das Spiral HQ 'Shadow Lairs' nennt. Shadow Lairs beherbergen die m\u00e4\
  chtigsten Monster des Uhrwerks, also stelle sicher, dass du vollst\u00e4ndig f\u00fcr Rang 3 \
  ausgestattet bist bevor du weitergehst.

r.sl_guard_1 = Weiter

m.sl_guard_2 = Aufkl\u00e4rer-Knights die durch diese seltsame, neue Welt gereist sind \
  behaupten, dass sie an jeder Ecke eine f\u00fcrchterliche Finsternis sp\u00fcren, die sie \
  umgibt. Irgend etwas anderes geht hier vor und wir werden unsere besten Elite-Knights \
  brauchen, um das zu untersuchen.

r.sl_guard_2 = Verstanden. Was brauche ich sonst noch?

m.sl_guard_3 = Alle Schattenreiche sind mit einem ungew\u00f6hnlichen Mechanismus verschlossen, \
  der nur mir einem 'Shadow Key' ge\u00f6ffnet werden kann. Shadow Keys kann man im Magazin \
  kaufen.\n\
  \n\
  Wenn ein Gruppenmitglied einen Shadow Key benutzt, wird die Gruppe gesperrt und kann nicht \
  mehr ver\u00e4ndert werden, also w\u00e4hle deine Gruppenmitglieder weise!

r.sl_guard_3 = Ich werde mir einen Shadow Key besorgen und mit den Nachforschungen beginnen!

m.sl_guard_4 = Dann viel Gl\u00fcck. Shadow Lairs werden die gr\u00f6\u00dfte Herausforderung \
  sein, der du bisher begegnet bist.

r.sl_guard_4 = Unterhaltung beenden


