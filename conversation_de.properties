m.mission_collectorknight_a = Es sieht k\u00fcnstlich erschaffen aus, aber es scheint auch ein \
  dunkles Bewusstsein zu haben...
m.mission_collectorknight_b = Sie sind \u00fcberall um uns herum aus dem Boden gebrochen...
m.mission_collectorknight_c = Dieser Ort jagt mir Schauer \u00fcber den R\u00fccken.
m.mission_collectorknight_d = Bitte, rette die Kampfsprites!

m.mission_survivorknight_a = V-vorsicht...es verfolgt uns...es beobachtet jede unserer \
  Bewegungen!
m.mission_survivorknight_b = Es hat uns gejagt...hat den Rest meines Teams erwischt...
m.mission_survivorknight_c = Der W\u00e4chter des Dickichts...der schreckliche Snarbolax!

m.mission_researcher_a = Wir haben diesen Meteoriten untersucht als diese Lichen auftauchten!
m.mission_researcher_b = Wir sitzen in der Falle! Bitte hilf uns diese Lichen zu besiegen!
m.mission_researcher_c = Ich weiss nicht, wie lange unser Kraftfeld noch h\u00e4lt...

m.mission_lockedoutknight_a = Danke f\u00fcr die Hilfe!
m.mission_lockedoutknight_b = Wir waren dabei den Transporter zu sichern, als sich die T\u00fcr hinter uns schlo\u00df.
m.mission_lockedoutknight_c = Danke, dass du unser Team gerettet hast!

m.mission_lab_bystander_a = Sie kamen aus dem Nichts...
m.mission_lab_bystander_b = Unsere Wachen wurden \u00fcberw\u00e4ltigt. Wir hatten nie eine \
  Chance.
m.mission_lab_bystander_c = Wir hatten eine Barrikade um das Artefakt errichtet, aber sie wurde \u00fc\
  berrant. Es tut mir leid...

m.seerus_1 = Du suchst nach Macht? Den Zorn eines brennenden Sterns, gebunden in Stahl? Ich \
  werde dir beides zeigen!
m.seerus_defeated = Ich w\u00fcrde es lieber brennen sehen, anstatt das Arsenal in die H\u00e4\
  nde eines Anderen fallen zu lassen!

m.mission_cogmaster_1 = Zwei Kanonen haben aufgeh\u00f6rt zu schie\u00dfen! Sofortiger Bericht, \
  ihr Bastarde!
m.mission_cogmaster_2 = Eindringlinge in meinem Arsenal? Ich werde daf\u00fcr Sorgen, dass ihr \
  euch... leise verabschiedet.
m.mission_cogmaster_3 = Glaubt, ihr k\u00f6nnt einfach die Vordert\u00fcr aufmachen und \
  hereinspazieren?! Daf\u00fcr werdet ihr leiden!
m.mission_cogmaster_4 = Wer hat euch geschickt, infernalische, eiserne Assassinen? War es \
  Herex? Es spielt keine Rolle. Es gibt Wege, das herauszufinden...
m.mission_crimson_propaganda_1 = Die Neun sehen alles, h\u00f6ren alles.
m.mission_crimson_propaganda_2 = King Tinkinzar allein gebietet \u00fcber die Iron Law!
m.mission_explosion_warning = Warnung! Explosion registriert! Sofort evakuieren!
m.mission_gatelock_disengage_1 = Tor-Verriegelung 1 l\u00f6st sich.
m.mission_gatelock_disengage_2 = Tor-Verriegelung 2 l\u00f6st sich.
m.mission_cogknight_camp_a = Endlich Verst\u00e4rkung vom Spiral HQ!
m.mission_cogknight_camp_b = Eine unserer Truppen hat es nach drinnen geschafft, wurde aber \
  abgeschnitten; rette sie, wenn du kannst!
m.mission_cogknight_camp_c = Du musst es nach drinnen schaffen und diese Kanonen ausschalten!
m.mission_cogknight_camp_d = Vorsicht, diese Gremlins haben den Ort mit Stacheldraht umgeben.
m.mission_cogknight_camp_e = Die Gremlins verstecken Sprengstoff in diesen Bunkern, ich wette, \
  etwas hineinzuwerfen, wird ihn z\u00fcnden!
m.mission_cogknight_camp_f = Sei vorsichtig da drin!
m.mission_cogknight_battle_a = Kann nicht.. weitermachen...
m.mission_cogknight_battle_b = Wir werden nicht weiter in die Basis vordringen k\u00f6nnen, bis \
  du diese Artillerie-Kanonen zerst\u00f6rt hast!
m.mission_cogknight_battle_c = Gelange nach drinnen, benutze den Transporter...jage in die Luft \
  was auch immer diese Kanonen kontrolliert!
m.mission_cogknight_battle_d = Du hast es geschafft! Die Explosion hat die Kanonen \
  ausgeschaltet!
m.mission_cogknight_prisoner_a = Warmaster Seerus ist irre! Ich sollte nach Emberlight fliehen!
m.mission_cogknight_prisoner_b = Ich werde mich rausschleichen, wenn es sicher ist. Danke, dass \
  Du mich gerettet hast!
m.mission_cogknight_ambushed = V-vorsicht...sie...sie sind \u00fcberall...in den Schatten...!
m.mission_cogknight_camp2_a = Wir haben die Explosion sogar vom Lager aus gesehen! Das war \
  erstaunlich!
m.mission_cogknight_camp2_b = Wir h\u00e4tten es ohne deine Hilfe nie an der Artillerie vorbei \
  geschafft!
m.mission_cogknight_camp2_c = Durchhalten!
m.mission_cogknight_camp2_d = Wir haben die Gremlins hier draussen Minen verstecken sehen, pass \
  auf wo du hintrittst!
m.mission_cogknight_camp2_e = Wir werden standhalten!
m.mission_cogknight_camp2_f = Schleiche herum und schau, ob du irgendwie in dieses Torhaus \
  kommst!
m.mission_cogknight_camp2_g = Wenn es nur einen Weg g\u00e4be, irgendwie diese Tore zu \u00f6ffnen!
m.mission_cogknight_camp3_a = Wir sind drin! Das ist es!
m.mission_cogknight_camp3_b = Sei vorsichtig, wenn du dem Warmaster gegen\u00fcber trittst!
m.mission_cogknight_camp3_c = Wir haben ihre Verteidigung durchbrochen. Jetzt sind sie \
  umzingelt!
m.mission_cogknight_camp3_d = Viel Gl\u00fcck da drin, wir wissen, dass du es schaffst!
m.mission_cogknight_epilogue_a = Mach dir keine Sorgen um Feron, der wird in k\u00fcrzester \
  Zeit geheilt sein.
m.mission_cogknight_epilogue_b = Nur daran zu denken, dass all das auf Haven h\u00e4tte losgelassen werden k\u00f6nnen...
m.mission_cogknight_epilogue_c = Der Sieg ist unser!
m.mission_cogknight_epilogue_d = Bis jetzt haben wir Seerus' Leichnam noch nicht geborgen, aber \
  niemand k\u00f6nnte je diese Explosion \u00fcberlebt haben...
m.mission_cogknight_epilogue_e = Es wird ewig dauern, diese Gremlin-Geheimschrift zu \
  entziffern...

m.mission_apocrea_warden = Sei auf der Hut wenn du weitergehst. Das sieht mir nach einer Falle \
  aus.

m.och_leader_1_1a = Sei gegr\u00fc\u00dft, {0}! Freut mich zu sehen, dass Spiral HQ uns Verst\u00e4\
  rkung geschickt hat, und das keinen Moment zu fr\u00fch! Wir stehen mit dem R\u00fccken zur \
  Wand und brauchen Hilfe!
r.och_leader_1_1a = Wie kann ich helfen, Lieutenant?
m.och_leader_1_2a = Unser Vorsto\u00df ist zum Erliegen gekommen wegen der Artillerie auf den \
  Mauern, die uns in Schach h\u00e4lt. Wir haben etwas zuvor f\u00fcr eine Ablenkung gesorgt, \
  damit ein kleiner Trupp Knights die Front durchbrechen und diese Artillerie zum Schweigen \
  bringen kann... aber sie scheinen gescheitert zu sein. Jetzt sind sie dort drinnen gefangen \
  und wir stecken hier draussen fest!\n\
  \n\
  Du musst die Frontlinien durchbrechen, in das Artillerie-Kontrollzentrum eindringen und einen \
  Weg finden, diese Kanonen ein f\u00fcr alle mal auszuschalten! In der Zwischenzeit werde ich \
  die Truppen neu formieren, so dass wir deinem Angriff folgen k\u00f6nnen. Viel Gl\u00fcck da drin, Soldat!
r.och_leader_1_2a = Ich werde sie nicht entt\u00e4uschen, Lieutenant.

m.och_leader_2_1a = Gut gemacht, {0}! Das war ein h\u00fcbsches Feuerwerk! Dank dir war es uns \
  m\u00f6glich, diese verfluchte Landezone zu r\u00e4umen und unsere Operationsbasis zu den \
  inneren Toren zu verlegen!
r.och_leader_2_1a = Was jetzt, Lieutenant?
m.och_leader_2_2a = Diese schweren Zahnr\u00e4der sind uns im Weg, und nach den Berichten von \
  Aufkl\u00e4rern, kann man sie nur von innerhalb zweier angrenzender Tor-H\u00e4user \u00f6\
  ffnen. Ich werde nicht unn\u00f6tig Leben verschwenden, indem ich frontal gegen das Torhaus \
  anst\u00fcrme. Du musst einen anderen Weg finden. Umgehe die Verteidigungen, gelange ins \
  Tor-Haus und \u00f6ffne die Tore!
r.och_leader_2_2a = Die Tore sind so gut wie offen, Lieutenant!

m.och_leader_3_1a = (Lieutenant  Feron scheint verletzt worden zu sein) \n\
  \n\
  Da bist du ja, {0}, hier f\u00fcr das gro\u00dfe Finale, was?

r.och_leader_3_1a = Sind sie in Ordnung, Lieutenant?

m.och_leader_3_2a = Es waren diese verdammten, schleichenden D\u00e4monen! Sie kamen aus den \
  Schatten und haben uns einen Hinterhalt gelegt. Wenn ich Seerus in die Finger kriege, werde \
  ich.. Ah!\n\
  \n\
  (Feron sackt seitlich weg, offensichtlich schwerer verletzt, als es zun\u00e4chst den Anschein hatte)\n\
  \n\
  Mist, ich habe Probleme, mein Schwert festzuhalten...

r.och_leader_3_2a = Lieutenant, es sieht aus als-

m.och_leader_3_3a = Ja, es scheint ganz als w\u00e4re ich nicht mehr fit genug f\u00fcr diesen \
  Kampf. Es liegt jetzt an dir, {0}. Du allein verf\u00fcgst \u00fcber die St\u00e4rke, Seerus \
  entgegenzutreten, und ihn zur Rechenschaft zu ziehen. Viele Knights haben hier heute ihr \
  Leben verloren. Ehre ihr Andenken, indem du die Sache zu Ende bringst!

r.och_leader_3_3a = Verstanden, Lieutenant. Ich werde den Warmaster daf\u00fcr bezahlen lassen.

m.och_leader_4_1a = {0}! Ich kann es kaum glauben, dass du es geschafft hast, dich direkt mit \
  dem Warmaster anzulegen und es dann lebendig aus diesem Inferno geschafft hast! Du hast das \
  Zeug zu einem echten Helden!

r.och_leader_4_1a = Sie sehen eindeutig besser aus, Lieutenant.

m.och_leader_4_2a = Mit Hilfe der Biotechs sollte ich in null komma nichts wieder auf dem Damm \
  und einsatzbereit sein. {0}, ich kann nicht genug betonen, wie wichtig dieser Sieg f\u00fcr \
  alle Spiral Knights ist. Du hast uns geholfen, der Crimson Order einen schweren Schlag zu \
  versetzen, indem du ihr Gro\u00dfes Arsenal zerst\u00f6rt hast.\n\
  \n\
  Dank dir werden die Gremlins jetzt f\u00fcr einige Zeit keine schweren Kriegsmaschinen mehr \
  haben. Und dadurch, dass unsere Techniker nun das untersuchen, was in Seerus' pers\u00f6\
  nlichem Quartier zu finden ist, werden wir am Ende vielleicht wertvolle Einblicke in die \
  Gremlin-Technologie erhalten und vielleicht sogar den Aufenthaltsort des Rests der Crimson \
  Order erfahren.

r.och_leader_4_2a = Es war mir eine Ehre, ihnen zu helfen.

m.och_leader_4_3a = Nimm dir etwas Zeit und genie\u00dfe diesen gro\u00dfartigen Sieg. Spiral \
  HQ wird sicher wieder nach dir verlangen!

r.och_leader_4_3a = Bis zum n\u00e4chsten Mal, Lieutenant.

