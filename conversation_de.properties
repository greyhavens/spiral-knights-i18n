# Dark Harvest Festival
#...................................................................................................


m.dark_harvest_exp = Willkommen beim Dunklen Erntefest! Diese allj\u00e4hrliche Feier ehrt die \
  Untoten mit festlichen Masken, k\u00f6stlichen Leckereien und gef\u00e4hrlichen Streichen!\n\
  \n\
  Um teilzunehmen, erforsche das Uhrwerk und versuche den legend\u00e4ren 'Punkin King' zu \
  finden. Dieses ghulische Gem\u00fcse vergibt S\u00fc\u00dfigkeiten an Besucher! Die S\u00fc\u00dfigkeiten k\u00f6nnen bei den H\u00e4\
  ndlern hier auf dem Stadtplatz von Haven gegen Monstermasken eingetauscht werden!\n\
  \n\
  Solltest du noch in paar mehr brauchen oder eine direkte Vorgehensweise bevorzugen, dann wird \
  dir unser H\u00e4ndler auch S\u00fc\u00dfigkeiten verkaufen.

r.dark_harvest_exp = Klingt nach Spa\u00df! Ich ziehe los, den Punkin King zu finden!


# Winterfest
#...................................................................................................


m.impostoclaus = Glorp, glorp, glorp! Frohes Winterfest!\n\
  \n\
  Lass dich vom Geist der Feiertage durchdringen durch Schneeballschlachten in winterlichen \
  Lockdown-Ebenen und tausche Krogmo Coins gegen zauberhafte Santy Hats ein!

r.impostoclaus = Ich glaube an dich, Impostoclaus!

m.impostoclaus_1a = Glorp! Glorp! Glorp! Frohes Winterfest!\n\
  \n\
  Diese ganz besondere Zeit des Jahres isr endlich da, wenn eine zarte Decke wundervoll wei\u00df\
  en Schnees Haven bedeckt und jeder Stranger, jede Schnepfe und jeder Knight sein Herz mit \
  Festtags-Freude f\u00fcllt.\n\
  \n\
  Aber dir muss ich leider sagen, dass traurigerweise nicht alles gut ist. Ohne Motiv oder \
  Grund hat eine Gruppe schrumpelherziger Grinchlins die Winterfest-Saison bedroht!
r.impostoclaus_1a = Nicht unter meinem Kommando. Ich werde das Winterfest retten! Wie kann ich \
  helfen?

m.impostoclaus_2a = Solcher Mut, solcher Schneid! Ja, mit etwas Gl\u00fcck hast du vielleicht \
  eine Chance gegen die schrecklichen Unholde, die es darauf abgesehen haben Winferfest-Tr\u00e4ume zu vernichten.\n\
  \n\
  Also achte auf die neu hinzugef\u00fcgte Winterfest-Mission, greif dir dein Schwert und ich \
  werde f\u00fcr deine Belohnungen sorgen!
r.impostoclaus_2a = Die Mission 'Rette das Winterfest!' abschlie\u00dfen und spezielle \
  Winterfest-Belohnungen bekommen? Ich bin schon dabei!

r.impostoclaus_3a = Winterfest-Belohnungs-Laden ansehen
r.impostoclaus_3b = Konversation beenden.

m.impostoclaus_win = Glorp! Glorp! Das Winterfest ist gerettet und eins ist klar: Alle Herzen \
  singen nun, erf\u00fcllt von Winterfest-Frohsinn!
m.impostoclaus_fail = Unsere Mission, das Winterfest zu retten, endet in einer Niederlage! Die \
  Grinchlins haben gewonnen, wir m\u00fcssen uns zur\u00fcckziehen!

