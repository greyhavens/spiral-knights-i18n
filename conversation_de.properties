#
# Translation messages

msgbundle_class = com.threerings.projectx.client.ControlAwareMessageBundle

## GENERAL

m.please_wait = Bitte warten

# Energy Info
#...................................................................................................

n.energy_info = Energiegeladener Knight

m.energy_info_1a = Wei\u00dft du, was die wichtigste Ressource auf Cradle ist? ENERGIE! Ganz \
  genau, mein Freund, etwas so Besonderes, dass es sich lohnt, es laut herauszuschreien! Willst du \
  etwas \u00fcber dieses superwichtige Zeug erfahren? Zuf\u00e4lligerweise bin ich Experte auf dem \
  Gebiet!

r.energy_info_1a = Aber ja, ich sollte alles dar\u00fcber wissen! Erz\u00e4hl mal!

r.energy_info_1b = Nein danke, ich bin auch unwissend ganz zufrieden.

m.energy_info_2a = Klasse! Ich erkl\u00e4re es dir in drei einfachen Lektionen: was Energie ist, \
  wie man sie benutzt und wie du mehr davon bekommst.

r.energy_info_2a = Was ist Energie?

r.energy_info_2b = Wie benutzt man sie?

r.energy_info_2c = Wie bekommt man mehr Energie?

r.energy_info_2d = Was f\u00fcr energiegeladene Tipps! Auf ins Abenteuer, tsch\u00fcss!

m.energy_info_3a = Energie ist eine besondere Kraft, die fortw\u00e4hrend aus dem Kern dieser Welt \
  str\u00f6mt. Sie ist absolut stabil und geht nie verloren, au\u00dfer man gibt sie in einem \
  Handel weiter oder gibt sie anderweitig aus. (Im Energie-Modul deines Arsenals kannst du sehen, \
  wie viel Energie du gerade hast.)

m.energy_info_3b = Energie ist f\u00fcr alle m\u00f6glichen Dinge von Nutzen! Sie ist die \
  Hauptw\u00e4hrung, mit der man Dinge aus dem Magazin kaufen kann, sie erlaubt dir, \
  Aufr\u00fcstungen f\u00fcr dich zu kaufen, dich im Uhrwerk wiederzubeleben, wenn dir die Sparks \
  of Life ausgehen, und sie ist notwendig, um eine Gilde zu gr\u00fcnden.\n\nDu wirst auch eine \
  ganze Reihe von Ger\u00e4tschaften in dieser Welt finden, die mit Energie betrieben werden. \
  Achte einfach auf das blaue Energie-Symbol auf dem Ger\u00e4t.

m.energy_info_3c = Energie kann nur durch einen Kauf mit echtem Geld erworben oder auf dem \
  Energiemarkt eingetauscht werden. Um Energie zu kaufen oder einzutauschen, \u00f6ffne einfach \
  das Magazin und klicke auf 'Energie holen'.

r.energy_info_3a = Ich habe noch eine Frage.

r.energy_info_3b = Was f\u00fcr energiegeladene Tipps! Auf ins Abenteuer, tsch\u00fcss!



## TUTORIAL

# Rescue Agent
#...................................................................................................

n.tut_intro = Rettungsagent

m.tut_intro_1a = Willkommen auf Cradle, Rekrut! Ist immer sch\u00f6n, wenn ein Knight so einen \
  Absturz in einem St\u00fcck \u00fcberlebt. Wir haben nicht weit von deiner Position ein \
  Rettungslager aufgeschlagen. Ich werde dich dorthin f\u00fchren, aber halte dein Schwert bereit \
  - auf dem Weg vor uns lauern Feinde!\n
r.tut_intro_1a = Verstanden, bin unterwegs!


m.tut_intro2_1a = ...kommen, {0}, bist du da? Hier ist Aufkl\u00e4rer-Knight Rhendon!

r.tut_intro2_1a = Ich bin hier, was ist passiert?

m.tut_intro2_2a = Du bist gerade auf der Oberfl\u00e4che von Cradle aufgeschlagen. Meine \
  Rettungskapsel ist etwas n\u00f6rdlich von deiner Position abgest\u00fcrzt. Wir sollten uns \
  treffen und den n\u00e4chsten Sammelpunkt finden.\n\
  \n\
  Sei vorsichtig, und halte dein Schwert bereit, hier sind \u00fcberall gef\u00e4hrliche \
  Kreaturen unterwegs!

r.tut_intro2_2a = Verstanden, Rhendon. Ich bin zu dir unterwegs!


m.tut_intro3_1a = {0}! Bin ich froh dich zu sehen, Kumpel! Dieser Planet ist so fremdartig, es \
  ist sch\u00f6n mal ein vertrautes Gesicht zu sehen und nicht noch ein feindseliges Vieh.

r.tut_intro3_1a = Ich bin auch froh, dich in einem St\u00fcck zu sehen, Rhendon. Wo sind die \
  anderen \u00dcberlebenden?

m.tut_intro3_2a = Ich habe \u00fcber Comlink Verbindung zu Knights aufgenommen, die weiter \
  vorne ein Rettungslager aufgebaut haben. Wenn du weiter nordw\u00e4rts gehst, solltest du es \
  irgendwann erreichen. \n\
  \n\
  Ich werde f\u00fcr den Moment hier bleiben und andere Knights aufsp\u00fcren, die in dieser \
  Gegend abgest\u00fcrzt sind. Ich treffe dich vor Sonnenuntergang im Rettungslager.\n\
  \n\
  Und sollte dir etwas wirklich Gef\u00e4hrliches begegnen, dr\u00fccke [[?DEFEND]], um deinen \
  Schild zu verwenden!

r.tut_intro3_2a = Ich werde dann mal vorausgehen! Sei vorsichtig, Rhendon.

m.tut_intro4_1a = Ich werde f\u00fcr den Moment hier bleiben und andere Knights aufsp\u00fcren, \
  die in der Gegend abgest\u00fcrzt sind. Wir sehen uns dann im Rettungslager im Norden.\n\
  \n\
  Und solltest du irgendetwas wirklich Gef\u00e4hrlichem begegnen, dr\u00fccke [[?DEFEND]], um \
  deinen Schild zu benutzen!

r.tut_intro4_1a = Ich gehe dann mal vor! Sei vorsichtig, Rhendon.

m.tut_intro3_3a = Viel Gl\u00fcck!
m.tut_intro3_3b = Sei vorsichtig!
m.tut_intro3_3c = Denke daran, dr\u00fccke [[?DEFEND]], um deinen Schild zu benutzen!

# Warden Companion
#.................................................................................................
m.tut_warden_1a = Gr\u00fc\u00dfe, Knight. Du musst {0} sein, Rhendon hat uns angefunkt und uns \
  mitgeteilt, dass du unterwegs bist. Komm mit uns, das Rettungslager ist gleich da vorn.

r.tut_warden_1a = Gro\u00dfartig, ich freue mich auf eine warme Mahlzeit.

m.tut_warden_2a = Das tun wir beide. Jetzt lass uns-\n\
  \n\
  Warte mal, da stimmt was nicht. Halte dich bereit, ich glaube, wir haben Gesellschaft!

r.tut_warden_2a = Gespr\u00e4ch beenden

m.tut_warden_3a = Gut gemacht, {0}! Sieht so aus, als ob du dich auf dem Schlachtfeld auskennst.\n\
  \nKomm, lass uns zum Lager gehen. Vielleicht kannst du uns helfen herauszufinden, was hier zum \
  Kuckuck eigentlich los ist.

r.tut_warden_3a = Gespr\u00e4ch beenden

# Final Test Knight
#...................................................................................................


m.final_test_knight_1a = Verbl\u00fcffend! Ich h\u00e4tte nie erwartet, dass ein neuer Rekrut \
  lebend aus diesem brennenden Wrack gekrochen kommt! Du musst wirklich was Besonderes sein...\n\n\
  Mein Name ist Feron, Lieutenant des Spiral Order. Wir hatten zuvor gedacht, dieser gesamte \
  Komplex w\u00e4re ausgestorben und verlassen, bis der Transporter dort hinein pl\u00f6tzlich \
  angesprungen ist. Bei der Erforschung ist das gesamte Ding dann recht bald in Flammen \
  aufgegangen!\n\nWie bist du hier gelandet?

r.final_test_knight_1a = (Erz\u00e4hle Feron vom Rettungslager, Razwog und dem Artefakt)

m.final_test_knight_2a = Ich verstehe. Das sind sehr interessante Informationen f\u00fcr das \
  Spiral HQ. Unser Basislager in Haven ist gleich dort vorne. Fahre mit dem Transporter nach \
  oben und triff dich mit den anderen Knights, die wie du den Absturz \u00fcberlebt haben. Die \
  Techniker im Labor sind sicher ganz scharf darauf, das Artefakt zu untersuchen. Sie werden \
  sich darum k\u00fcmmern, wenn du Haven erreicht hast.\n\
  \n\
  Mach dir keine Sorgen um die anderen im Rettungslager. Dank dir haben wir nun ein \
  funktionierendes Transportersystem, um sie zu erreichen. Du hast sie alle gerettet!

r.final_test_knight_2a = Danke, Lieutenant, ich mache mich jetzt auf den Weg nach Haven.

# Rescued Stranger
#...................................................................................................

m.rescued_stranger_1a = Hallo, kleiner Knight. Du wirst feststellen, dass es viele Gefahren in \
  dieser neuen Welt gibt, aber auch viele Chancen f\u00fcr die Abenteuerlustigen und Mutigen! Ein \
  Kamerad von dir erwartet dich gleich da oben, ein St\u00fcck den Weg hinauf. Wir werden uns \
  zweifelsohne wiedersehen. Leb wohl, f\u00fcrs Erste!
r.rescued_stranger_1a = Gespr\u00e4ch beenden


## RESCUE CAMP KNIGHTS

# Greta B
#...................................................................................................

m.rc_greet2_1a = Gr\u00fc\u00dfe, ich bin Gruppenf\u00fchrerin Greta. Du musst {0} sein. Rhendon \
  hat uns gesagt, dass wir deine Ankunft erwarten k\u00f6nnen, und das nicht einen Moment zu \
  fr\u00fch. Dieses Rettungslager steckt in einer Krise.

r.rc_greet2_1a = Was gibt es f\u00fcr ein Problem, Greta?

m.rc_greet2_2a = Kurz gesagt, dieses Camp hat keinen Strom und die Sonne geht bald unter. \
  Letzte Nacht haben uns in der Dunkelheit alle m\u00f6glichen, furchtbaren Monster \
  heimgesucht. Wir konnten nichts sehen und hatten keine Energie f\u00fcr unsere Abwehr-Gesch\u00fctzt\u00fcrme.\n\
  \n\
  ...wir haben viele Rekruten verloren.\n\
  \n\
  Wir m\u00fcssen Energie zum Rettungslager leiten, damit wir einen Verteidigungs-Ring um das \
  Lager errichten k\u00f6nnen, bevor die Nacht hereinbricht!

r.rc_greet2_2a = Wie kann ich helfen, Energie zum Lager zu leiten?

m.rc_greet2_3a = Unsere Scanner haben einen uralten Generator unter dem Lager aufgesp\u00fcrt. \
  Er sollte Energie zur Oberfl\u00e4che schicken, aber etwas scheint sie abzulenken.\n\
  \n\
  Wir brauchen dich, um den alten Generator zu erforschen und die Energie wieder zur\u00fcck zur Oberfl\u00e4\
  che zu lenken. Aber du musst wachsam sein - es ist v\u00f6llig unerforschtes Gebiet und \
  wimmelt nur so von Monstern.\n\
  \n\
  Rhendon sagte, dass er dich sehen will, bevor du diese Mission beginnst. Warum triffst du \
  dich nicht zuerst mit ihm?

r.rc_greet2_3a = Ich werde mich mit Rhendon treffen, bevor ich den Generator erkunde.

m.rc_greet2_4a = Bitte, {0}, hilf uns, die Energie im Rettungslager wiederherzustellen, damit \
  wir eine Verteidigung errichten k\u00f6nnen. Wir k\u00f6nnen es uns nicht leisten, noch mehr \
  Rekruten an die Kreaturen der Nacht zu verlieren!

r.rc_greet2_4a = Ich werde mein Bestes geben!

m.rc_greet3_1a = Du hast die Energieversorgung wiederhergestellt und uns alle gerettet, {0}! \
  Ich kann dir gar nicht genug danken, alle diese Rekruten verdanken dir ihr Leben.\n\
  \n\
  Du solltest jetzt versuchen, das Spiral HQ \u00fcber Comlink zu kontaktieren.

r.rc_greet3_1a = Gespr\u00e4ch beenden

# Rescue Camp Recruit Knights
#...................................................................................................
n.rc_recruit = Rekrut
m.rc_recruit_a = Wir haben vielleicht keine Energie, aber das Mindeste, was ich tun kann, ist, ein \
  Feuer zu entz\u00fcnden, damit wir heute Nacht wenigstens ein bisschen Licht haben.

m.rc_recruit_b = Es wurde nicht viel Ausr\u00fcstung aus den Rettungskapseln geborgen. Es gibt \
  hier nicht mal genug f\u00fcr jeden f\u00e4higen Knight.

m.rc_recruit_c = Ist das zu glauben? Der gesamte Abgrund ist von einer Art gigantischen \
  Maschine erf\u00fcllt. Es scheint ewig weit nach unten zu gehen.\n\
  \n\
  Ich frage mich, ob der gesamte Planet so aussieht?

m.rc_recruit_d = Dank der W\u00e4rme des Feuers und der Sicherheit, die die \
  Verteidigungsgesch\u00fctze bieten, werde ich heute Nacht wohl gut schlafen.

m.rc_recruit_e = Ich kann Elektrizit\u00e4t in der Luft sp\u00fcren! Sieht so aus, als w\u00fc\
  rden wir heute Nacht doch nicht in unserem letzten Gefecht k\u00e4mpfen!

m.rc_recruit_f = Es hei\u00dft, du wirst mit diesem Transporter hinunter in den Abgrund fahren. Du \
  bist verflixt viel mutiger als ich...

r.rc_recruit = Gespr\u00e4ch beenden

# Technician Knight
#...................................................................................................
n.rc_technician = Techniker
m.rc_technician_a = Nach den Scans zu urteilen, m\u00fcsste es irgendeine Energiequelle in den \
  Tiefen unter dem Lager geben, aber sie wird irgendwie umgeleitet...

m.rc_technician_b = Dieses Ding ist nutzlos ohne Energie. Wie sollen wir uns nur gegen diese \
  Monster verteidigen?!

m.rc_technician_c = Es flie\u00dft wieder Energie durchs Lager! Du hast es geschafft, {0}!

r.rc_technician = Gespr\u00e4ch beenden

# Injured Knight
#...................................................................................................
n.rc_injured = Verletzter Knight
m.rc_injured_a = Letzte Nacht haben uns schreckliche Monster in der Dunkelheit angegriffen. Es \
  war ein totales Chaos. Ohne Energie f\u00fcr die Gesch\u00fctze konnten wir uns nicht \
  verteidigen.\n\
  \n\
  Der Verlust so vieler mutiger Knights...

m.rc_injured_b = Eins von diesen mechanischen Monstern hat mich erwischt. Die Krallen von dem \
  verfluchten Ding gingen glatt durch meine R\u00fcstung!

m.rc_injured_c = Dank dir m\u00fcssen wir nicht noch so eine Nacht wie die letzte \
  durchstehen...

m.rc_injured_d = Mit Hilfe der wiederhergestellten Energie konnte ich meine R\u00fcstung \
  reparieren. Hoffentlich begegne ich nicht wieder zu vielen von diesen monstr\u00f6sen Rostk\u00fcbeln!

r.rc_injured = Gespr\u00e4ch beenden


# Nervous Knight
#...................................................................................................

n.rc_nervous = Nerv\u00f6ser Knight

m.rc_nervous_1a = Mit den Crowns, die ich mir beim Training verdient habe, m\u00f6chte ich mir \
  etwas kaufen, aber dieser H\u00e4ndler macht mir echt Angst. Was er wohl unter dieser Robe \
  versteckt?

r.rc_nervous_1a = Gespr\u00e4ch beenden

# Forge Knight
#...................................................................................................
n.rc_forge = Knight der Schmiede
m.forge_knight_1a = Cradle ist eine gef\u00e4hrliche Welt, und um zu \u00fcberleben, ist es \
  wichtig, dass du m\u00e4chtige Ausr\u00fcstung in deinem Arsenal hast. Daf\u00fcr wirst du die \
  Schmiede benutzen m\u00fcssen.

r.forge_knight_1a = Was ist die Schmiede?

m.forge_knight_2a = Die Schmiede nutzt die W\u00e4rme, die in deiner Ausr\u00fcstung gespeichert \
  ist, und kombiniert sie mit der Kraft von Fire Crystals, um ihr neues Potenzial freizusetzen.

r.forge_knight_2a = Weiter

m.forge_knight_3a = In der Stadt kannst du die Schmiede jederzeit benutzen. Im Uhrwerk kannst \
  du auf sie zugreifen, indem du eine Arsenal-Station benutzt.

r.forge_knight_3a = Weiter

m.forge_knight_4a = Wenn du die Schmiede benutzt, siehst du eine Liste aller Gegenst\u00e4nde, die \
  bereit sind, im Level aufzusteigen. Wenn du einen Gegenstand ausw\u00e4hlst, kannst du sehen, \
  wie er verbessert werden kann.

r.forge_knight_4a = Weiter

m.forge_knight_5a = Jeder Gegenstand ben\u00f6tigt eine bestimmte Art von Fire Crystal. Fire \
  Crystals kann man im Magazin bekommen, durch das Abschlie\u00dfen bestimmter Missionen verdienen \
  und in Schatzbl\u00f6cken im Uhrwerk finden!

r.forge_knight_5a = Wie funktionieren Fire Crystals?

m.forge_knight_6a = Fire Crystals sind etwas instabil; die f\u00fcr einen \
  erfolgreichen Schmiedevorgang ben\u00f6tigte Menge variiert. \n\
  Au\u00dferdem haben wir herausgefunden, dass das Hinzuf\u00fcgen von mehr Fire Crystals \
  Chancen auf besondere Boni bietet, die auf den Gegenstand angewendet werden. \n\

r.forge_knight_6a = Klingt gro\u00dfartig!

m.forge_knight_7a = Jetzt, wo du dich mit der Schmiede auskennst, willst du mal einen Blick \
  riskieren?

r.forge_knight_7a = Sicher! (Schmiede \u00f6ffnen)
r.forge_knight_7b = Ich schaue es mir sp\u00e4ter an. (Gespr\u00e4ch beenden)

# Geo Knight
#...................................................................................................


m.rc_soil_1a = Ich sammle geologische Proben f\u00fcr das Spiral HQ. Bisher zeigen meine Tests in \
  jedem Zentimeter Boden unter unseren F\u00fc\u00dfen Hunderte verschiedener Bodenarten. Das kann \
  aber nicht sein, ich muss mich verrechnet haben...

r.rc_soil_1a = Gespr\u00e4ch beenden

# Veteran Knights
#...................................................................................................
n.rc_vet_2 = Knight-Veteran

m.rc_vet_1a = Danke f\u00fcr die Hilfe vorher. Pass auf dich auf!
m.rc_vet_2a = Sei immer auf der Hut. Wer wei\u00df, welche weiteren Gefahren uns auf dieser \
  Welt erwarten?
m.rc_vet_3a = Ich werde mich erst entspannen k\u00f6nnen, wenn wir Verbindung mit dem Spiral HQ \
  hergestellt haben.

r.rc_vet_1a = Gespr\u00e4ch beenden

# Rhendon
#...................................................................................................

m.rc_rhendon_1a = Was zum Geier glaubst du, was dieses Ding ist, {0}? Muss wichtig sein, wenn \
  dieser Razwog derart durchgedreht ist, als du es dir geschnappt hast.\n\
  \n\
  Geschieht ihm recht daf\u00fcr, dass er versucht hat, dich umzubringen und so!

r.rc_rhendon_1a = Gespr\u00e4ch beenden

# Kinter
#...................................................................................................


m.rc_instruct_1a = Gr\u00fc\u00dfe, Rekrut. Es ist immer gut zu sehen, dass ein weiterer Knight \
  es ins Rettungslager geschafft hat. Ich sch\u00e4tze, du m\u00f6chtest dich auf deine Reise \
  nach Haven vorbereiten. Ein guter Ort daf\u00fcr ist das Tor zum Uhrwerk hier. N\u00e4here \
  dich einfach dem Steuerpult am n\u00f6rdlichen Ende des Transporters und dr\u00fccke die \
  Aktionstaste ([[?ACTION]]).\n\
  \n\
  Noch Fragen?

r.rc_instruct_1a = Fragen? Na und ob!

r.rc_instruct_1b = Keine Fragen. Zeit zu handeln. Ich bin dann weg.

m.rc_instruct_2a = Was m\u00f6chtest du wissen?

r.rc_instruct_2a = Das "Uhrwerk"?

r.rc_instruct_2b = Du hast etwas von einem "Tor" gesagt?

r.rc_instruct_2c = Wenn ich nochmal so dar\u00fcber nachdenke, ich muss los.


m.rc_instruct_3a = Das Uhrwerk ist ein enormer Komplex von Getrieben und Maschinen unter der \
  Oberfl\u00e4che dieser Welt. Es ist ein wahrlich beeindruckender Anblick. Wir leben in einer \
  seltsamen und gef\u00e4hrlichen Welt. Pass auf dich auf.

m.rc_instruct_3b = Ein "Tor" ist ein Eintrittspunkt in das Uhrwerk. Tore haben die Gestalt der \
  Transporter, die du vor dir siehst. Jedes Tor hat einen Monitor, der sein einzigartiges Symbol \
  anzeigt, und ein Steuerpult, mit dem man das Tor betreten kann. Dieses Tor hier f\u00fchrt stets \
  an den gleichen Ort, aber unter anderen Toren verschieben sich die Ebenen. Bei denen wei\u00df \
  man nie so genau, was als N\u00e4chstes kommt!


r.rc_instruct_3a = Ich habe noch eine andere Frage.

r.rc_instruct_3b = Vielen Dank f\u00fcr die Informationen! Ich bin dann weg.


# Boomer
#...................................................................................................


m.rc_bomb_1a = Hast du schon mal Bomben ausprobiert? Bomben k\u00f6nnen nur mit einem \
  Spezialangriff gez\u00fcndet werden. Alles andere l\u00e4sst nur die Z\u00fcndschnur \
  ausgehen. Aber mit einem Spezialangriff ... BUMM! Sie k\u00f6nnen mehreren Monstern auf \
  einmal gro\u00dfen Schaden zuf\u00fcgen.

r.rc_bomb_1a = Bombig! Vielleicht kaufe ich eine vom reisenden H\u00e4ndler.


# Cautious Knight
#...................................................................................................

n.rc_warning = Vorsichtiger Knight

m.rc_warning_1a = Am oberen Ende der Treppe liegt das Tor nach Haven. Rede besser mit Virgil, \
  bevor du es betrittst, damit du wei\u00dft, was dich erwartet.

r.rc_warning_1a = Sicher, ich werde mir anh\u00f6ren, was Virgil zu sagen hat.


# Sleepy Knight
#...................................................................................................

n.rc_sleepy = Schl\u00e4friger Knight

m.rc_sleepy_1a = Training ... so hart ... muss mich ausruhen ... Lider so schwer ...

r.rc_sleepy_1a = Gespr\u00e4ch beenden


# Virgil
#...................................................................................................


m.rc_virgil_1a = Sei vorsichtig, dort vorne.

r.rc_virgil_1a = Wieso das?

m.rc_virgil_2a = Dieser Steg f\u00fchrt direkt hinaus \u00fcber einen gewaltigen Abgrund. Will \
  ja nicht, dass es dich in das darunterliegende Nirgendwo weht.

r.rc_virgil_2a = Warum ist der Steg denn dann da?

m.rc_virgil_3a = Er scheint zu einer Art Transporter zu f\u00fchren, aber ohne Energie ist das \
  ganze Ding einfach tot.

r.rc_virgil_3a = Ich werde vorsichtig sein.

m.rc_virgil_4a = Gr\u00fc\u00dfe, {0}. Als du die Energie im Lager wiederhergestellt hast, ist \
  dieser Transporter ebenfalls angesprungen. Ich vermute, er wird dich tief hinunter in den \
  Abgrund bringen, und was du dort finden wirst, wei\u00df keiner so genau.\n\nWenn es dein Ziel \
  ist, in diese Tiefen hinabzusteigen, dann stelle sicher, dass du f\u00fcr alles bereit bist, was \
  dich dort erwartet.

r.rc_virgil_4a = Gespr\u00e4ch beenden

m.rc_end_1a = Das ist es, Rekrut. Das ist das letzte Tor. Es f\u00fchrt aus dem Rettungslager \
  hinaus und durch den Abgrund bis nach Haven. Sobald du hindurchgeschritten bist, musst du nie \
  wieder hierher zur\u00fcckkehren. Du findest in Haven alles, was man im Rettungslager kaufen \
  kann - und noch viel mehr. \n\
  \n\
  Noch Fragen?

r.rc_end_1a = Ja, ich w\u00fcrde dich gerne noch etwas fragen.

r.rc_end_1b = Alles klar, keine Fragen.

m.rc_end_2a = Wie kann ich dir helfen?

r.rc_end_2a = Kann ich von Haven aus echt nicht mehr zur\u00fcck?

r.rc_end_2b = Was erwartet mich im letzten Tor?

r.rc_end_2c = Was soll ich tun, wenn ich in Haven bin?

r.rc_end_2d = Ich habe keine weiteren Fragen. Mach's gut.

m.rc_end_3a = Nein, du kannst dann nicht mehr zur\u00fcck. Wenn du Haven erreicht hast, ist \
  dein Training beendet und deine neue Aufgabe wird es sein, den Spiral Knights dort zu helfen.

m.rc_end_3b = Der Weg ist zwar gef\u00e4hrlich, aber du wirst nicht besonders tief hinunter \
  reisen. Die Monster, denen du begegnest, solltest du \u00fcberw\u00e4ltigen k\u00f6nnen. Unsere Sp\u00e4\
  her berichten jedoch von einer erh\u00f6hten Anzahl an Gremlins rund um das Lager. Sei also \
  auf der Hut.

m.rc_end_3c = Wenn du in Haven bist, solltest du dir die Stadt ansehen und dich mit den \
  dortigen Gegebenheiten und M\u00f6glichkeiten vertraut machen. Du wirst dort bessere Ausr\u00fc\
  stung bekommen als hier und mit vielen erfahrenen Knights reden k\u00f6nnen. Scheu dich \
  nicht, sie um Rat zu fragen, wenn du nicht mehr weiter wei\u00dft.

r.rc_end_3a = Ich habe noch eine andere Frage.

r.rc_end_3b = Danke dir. Wenn ich bereit bin, gehe ich ins letzte Tor.

# Haven Entrance
#...................................................................................................

n.hav_guardian = Besch\u00fctzer-Knight

m.hav_guardian_1a = Willkommen in Haven, {0}, wir haben dich erwartet.

r.hav_guardian_1a = Gespr\u00e4ch beenden

m.hav_entryknight_1a = Bist du vom Abgrund her gekommen? Wie?
m.hav_entryknight_2a = Immer gut, einen anderen Spiral Knight zu sehen!
m.hav_entryknight_3a = Du solltest dich hinter die Stadtmauern begeben. Es ist hier drau\u00dfen \
  nicht sicher.

## ADVANCED TRAINING KNIGHTS
# Gym
#...................................................................................................

# Greeter
#...................................................................................................


m.atg_greeter_1a = Willkommen in unserer Trainingshalle f\u00fcr Fortgeschrittene. Hier findest du \
  n\u00fctzliche \u00dcberlebenstipps, die dir auf deiner Reise durch das Uhrwerk helfen werden. \n\
  \nSoll ich dir erkl\u00e4ren, wo du was findest?

r.atg_greeter_1a = Sicher, wo soll ich anfangen?

r.atg_greeter_1b = Nein danke, ich werde diesen Ort auf eigene Faust erforschen.

m.atg_greeter_2a = Westlich von hier kannst du etwas \u00fcber n\u00fctzliche Gegenst\u00e4nde \
  lernen, die man im Uhrwerk findet. In n\u00f6rdlicher Richtung erf\u00e4hrst du mehr \u00fc\
  ber unterschiedliche Arten von Bl\u00f6cken und T\u00fcren. Im Osten findest du eine \
  Ansammlung von Fallen und Gefahren und auch einen Kampfraum, wo du Verteidigung gegen ein \
  paar Trainingsw\u00fcrfel \u00fcben kannst. Keine Sorge, wir haben Vorsichtsma\u00dfnahmen \
  getroffen, um sicherzustellen, dass die W\u00fcrfel v\u00f6llig harmlos sind!

r.atg_greeter_2a = Danke! Dann gehe ich mal auf Erkundung.

## HAVEN KNIGHTS

# Fountain
#...................................................................................................


m.fountain_1 = Sei gegr\u00fc\u00dft und willkommen in Haven! Wenn du dich nach Norden begibst, \
  gelangst du in die Arcade, wo du Details zu deiner Mission erfahren kannst. Wenn du dich nach \
  Westen wendest, kommst du in den Basar, wo die Strangers eine Auswahl an Ausr\u00fcstung und \
  Waffen zum Verkauf anbieten. Schaue dort t\u00e4glich vorbei, die Auswahl ver\u00e4ndert sich!

r.fountain_1 = Danke f\u00fcr die Information, ich werde mich umsehen!

# Gym Signpost
#...................................................................................................


m.atg_guard = Gr\u00fc\u00dfe! Hinter dieser T\u00fcr findest du die Trainingshalle f\u00fcr \
  Fortgeschrittene. Als Spiral Knight steht es dir frei, sie zu nutzen, um deine F\u00e4\
  higkeiten zu trainieren und mehr \u00fcber das Uhrwerk zu erfahren.

r.atg_guard = Danke! Ich schaue mal, was sich da drinnen befindet.


# Arcade Leader
#...................................................................................................


m.arc_leader_1 = Sei gegr\u00fc\u00dft, Soldat, und gut gemacht, dass du es bis hierher in unser \
  Basislager in Haven geschafft hast. Ich bin Lieutenant Feron. Ich wurde von Captain Ozlo \
  beauftragt, unseren Bergbaubetrieb im Uhrwerk zu beaufsichtigen.\n\nVor dir liegt die "Arcade", \
  ein faszinierender Komplex, der als unsere Verbindung zum Herzen des Uhrwerks dient. Da du hier \
  neu bist, werde ich dir einen kurzen \u00dcberblick dar\u00fcber geben, womit uns das Spiral HQ \
  hier beauftragt hat.

r.arc_leader_1 = Das klingt wichtig, erz\u00e4hl mir, wie das alles funktioniert.

m.arc_leader_2 = Nachdem die Skylark abgest\u00fcrzt war, ist ihr prim\u00e4rer Tearium-Kern \
  explodiert, hat einen Teil des Schiffs zerst\u00f6rt und sie hat so auch ihre Hauptenergiequelle \
  verloren. Und nachdem wir bisher nicht wirklich mehrere hundert Tonnen Tearium irgendwo \
  herumliegen gesehen haben, ist unser Vogel sprichw\u00f6rtlich fl\u00fcgellahm, um nicht zu \
  sagen nutzlos.\n\nMit Hilfe der Strangers haben wir es geschafft, eine kleine Operationsbasis in \
  Haven aufzubauen. Sobald wir unsere Systeme dort zum Laufen gebracht hatten, haben wir entdeckt, \
  dass vom Herzen dieses Felsens eine Energiesignatur unerwarteter und so nie gekannter \
  St\u00e4rke ausgesendet wird.

r.arc_leader_2 = Wenn wir diese Energie irgendwie nutzbar machen k\u00f6nnten...

m.arc_leader_3 = Ganz genau! Im Core des Uhrwerks k\u00f6nnte tats\u00e4chlich die \
  Energiequelle zu finden sein, die wir brauchen, um die Skylark wieder betriebsbereit machen \
  zu k\u00f6nnen. Da gibt es nur ein Problem - das Uhrwerk scheint wie so eine Art irre \
  Todesfalle angelegt zu sein.\n\
  \n\
  Den Core zu erreichen wird nicht einfach sein...

r.arc_leader_3 = Ich bin bereit f\u00fcr diese Aufgabe!

m.arc_leader_4 = Das ist die Einstellung, die ich sehen will. So wird es laufen: Du benutzt die \
  Tore da vorne, um das Uhrwerk zu erforschen, und sammelst dort spezielle Mineralien. Dann \
  bringst du diese Mineralien zur\u00fcck zu den Toren, um das darunterliegende Uhrwerk zu \
  ver\u00e4ndern und so neue, unerforschte Ebenen zu erschaffen.\n\nWir glauben, die Mineralien \
  sind der Schl\u00fcssel dazu, einen Weg zum Core zu finden, wir m\u00fcssen nur herausfinden, \
  wie man sie genau einsetzt!

r.arc_leader_4 = Ich verstehe meine Mission.

m.arc_leader_5 = Du hast bewiesen, dass du kampfbereit bist, und ich bin \u00fcberzeugt, dass du \
  dem Spiral Order mutig dienen wirst. Die Tore zum Uhrwerk sind gleich da vorne.\n\nViel \
  Gl\u00fcck!

r.arc_leader_5 = Gespr\u00e4ch beenden
r.arc_leader_5_accept = Terminal 1 erreichen? Bin dabei!


# Wegner Basic
#...................................................................................................


m.arc_mintut_1 = Hallo. Ich bin Wegner, Chief Geo Knight der Skylark und oberster \
  Verantwortlicher f\u00fcr geologische Studien im Uhrwerk.

r.arc_mintut_1 = Ich bin hier, um etwas \u00fcber die Mineralien zu erfahren, die man im \
  Uhrwerk findet.

# IMAGE: step1_minerals.png
m.arc_mintut_2 = W\u00e4hrend deiner Reisen durchs Uhrwerk wirst du auf f\u00fcnf spezielle \
  Mineralien sto\u00dfen: Crimsonite, Moonstone, Valestone, Luminite und Dark Matter.

r.arc_mintut_2 = Weiter

# IMAGE: step2_gather.png
m.arc_mintut_3 = Du wirst in allen Ebenen des Uhrwerks Mineralvorkommen finden, und du musst sie \
  angreifen, um sie in St\u00fccke zu zerschlagen, die du tragen kannst. Du kannst immer nur ein \
  St\u00fcck auf einmal tragen, aber du kannst es austauschen, indem du ein anderes aufhebst. \
  Halte Ausschau nach dem gr\u00f6\u00dften und gl\u00e4nzendsten St\u00fcck, das du finden \
  kannst. Das sind die wertvollsten.

r.arc_mintut_3 = Weiter

m.arc_mintut_4 = Sobald du den Transporter heil erreicht hast, wird das Mineral, das du \
  tr\u00e4gst, f\u00fcr die sp\u00e4tere Verwendung in deinem Arsenal verstaut. Jeder in deiner \
  Gruppe bekommt auch alle Mineralien der anderen, man muss also nicht darum streiten, wer das \
  beste bekommt!

r.arc_mintut_4 = Weiter

m.arc_mintut_5 = Mineralien werden dazu verwendet, Sprite-Futter im Labor herzustellen. \
  Sprite-Futter ist sehr wichtig f\u00fcr die Entwicklung deines Sprites, also greif dir diese \
  Mineralien, wenn du sie siehst!

r.arc_mintut_5 = Weiter

m.arc_mintut_6 = Unsere geologischen Untersuchungen dauern an, also kann es sein, dass es noch \
  andere faszinierende Nutzungsm\u00f6glichkeiten f\u00fcr diese seltsamen und m\u00e4chtigen Mineralien gibt.

r.arc_mintut_6 = Klingt toll! Danke f\u00fcr die Infos!

# Wegner Advanced
#...................................................................................................

# Bosco
#...................................................................................................


m.hav_mecha_1a = Diesen kaputten Mecha Knight habe ich g\u00fcnstig bekommen. Wenn ich ihn \
  wieder hinkriege, habe ich einen pers\u00f6nlichen Leibw\u00e4chter f\u00fcr meine \
  Expeditionen in das Uhrwerk.

r.hav_mecha_1a = Gespr\u00e4ch beenden

# Tylen Bazaar Tour
#...................................................................................................
m.bazaar_tour_1a = Willkommen im Basar, {0}! M\u00f6chtest du eine F\u00fchrung zur Erkl\u00e4rung der L\u00e4\
  den und Dienstleistungen?

r.bazaar_tour_1a = Sicher, zeig' mir die L\u00e4den. (Tylen folgen)
r.bazaar_tour_1b = Welche Dienstleistungen kann ich hier finden? (Tylen folgen)
r.bazaar_tour_1c = Nein danke, ich sehe mich auf eigene Faust um.

m.bazaar_tour_2a = Strangers wie Quillion hier verkaufen dir Waffen und R\u00fcstungen. Jeder hat \
  sich auf eine bestimmte Art von Gegenst\u00e4nden spezialisiert, also rede mit ihnen und finde \
  heraus, was sie f\u00fchren. Sie sind nicht sehr gespr\u00e4chig, aber sie haben jeden Tag eine \
  neue Ladung Gegenst\u00e4nde im Angebot!\n\nAchte nur darauf, dass du den n\u00f6tigen Rang \
  hast, um einen Gegenstand auszur\u00fcsten!

r.bazaar_tour_2a = Verkaufen die Strangers auch noch etwas au\u00dfer Waffen und Ausr\u00fcstung?

m.bazaar_tour_3a = Gut, dass du gefragt hast, das tun sie n\u00e4mlich! Gehen wir r\u00fcber zu Vatel.

r.bazaar_tour_3a = (Tylen folgen)
#(move to Vatel)

m.bazaar_tour_4a = Vatel hier kann dir eine Auswahl an Rezepten verkaufen, sowie Gegenst\u00e4nde zum \u00c4ndern deiner pers\u00f6\
  nlichen Farbe, und noch andere Dinge.

r.bazaar_tour_4a = Rezepte? F\u00fcr Waffen und Ausr\u00fcstung?

m.bazaar_tour_5a = Das ist richtig, du kannst dir Rezepte und Materialien besorgen, um per \
  Alchemie an Alchemiestationen Waffen und Ausr\u00fcstung zu erstellen. Komm mit, ich zeige \
  dir eine.

r.bazaar_tour_5a = Verstanden.
#(move to alchemy station)

m.bazaar_tour_6a = Hier haben wir eine Alchemiestation, mit der du ohne Zweifel sehr vertraut \
  werden wirst, w\u00e4hrend du dein Arsenal erweiterst.\n\
  \n\
  Nun, das wars mit den L\u00e4den. H\u00e4ttest du gern eine weitere F\u00fchrung?

r.bazaar_tour_6a = Ich w\u00fcrde gerne nochmal die L\u00e4den sehen. (Tylen folgen)
r.bazaar_tour_6b = Ich w\u00fcrde mir gerne die Dienstleistungen ansehen. (Tylen folgen)
r.bazaar_tour_6c = Nein danke, ich sehe mich auf eigene Faust um.

m.bazaar_tour_7a = Punch und Vise sind Gremlin-Schmiede, die die Eigenschaften deiner Waffen \
  und Ausr\u00fcstung ver\u00e4ndern k\u00f6nnen.


m.bazaar_tour_8a = Ganz ruhig, {0}, nicht alle Gremlins sind aus dem gleichen Holz geschnitzt. \
  Manche sind nicht damit einverstanden, wie King Tinkinzar und der Crimson Order die Dinge \
  handhaben. Man hat mir sogar erz\u00e4hlt, dass es irgendwo unten im Uhrwerk eine ganze Stadt \
  voller Gremlins gibt, die die gro\u00dfe Kolonie verlassen haben.

r.bazaar_tour_8a = Naja, wenn du das sagst...

m.bazaar_tour_9a = Okay, zur\u00fcck zum Gesch\u00e4ftlichen.\n\nPunch kann gegen Bezahlung \
  einmalige Varianten zu deinen Waffen und deiner Ausr\u00fcstung hinzuf\u00fcgen, eine Art \
  speziellen Bonus. Aber seine Methoden sind, \u00e4hm... chaotisch. Du wei\u00dft nie wirklich, \
  was du bekommen wirst.\n\nVise ist ein wenig pr\u00e4ziser. Er kann gegen Bezahlung die Bindung \
  deiner Waffen und Ausr\u00fcstung l\u00f6sen, sodass du den Gegenstand wieder verkaufen oder \
  verschenken kannst!

r.bazaar_tour_9a = Praktisch, ich werde es mir merken. Was sonst noch?

m.bazaar_tour_10a = Lass uns Brinks besuchen.

r.bazaar_tour_10a = (Tylen folgen)
#(move to Brinks)

m.bazaar_tour_11a = Brinks ist der Marken-H\u00e4ndler, der Knights bestimmte Gegenst\u00e4nde gibt im Austausch f\u00fc\
  r Marken, die im Uhrwerk gesammelt werden k\u00f6nnen. Marken kann man in Schatzbl\u00f6cken \
  finden, sie werden als Missions-Belohnung vergeben oder nach dem Sieg \u00fcber besondere \
  Boss-Monster gefunden.

r.bazaar_tour_11a = Kapiert. Noch etwas?

m.bazaar_tour_12a = Nur noch ein letzter Laden, dann sind wir durch. Ich habe mir den besten bis \
  zum Schluss aufgehoben.

r.bazaar_tour_12a = (Tylen folgen)
#(move to Bechamel)

m.bazaar_tour_13a = Hier haben wir Bechamel, den Zubeh\u00f6r-Ausstatter, der deiner \
  Ausr\u00fcstung Zubeh\u00f6r hinzuf\u00fcgen kann, solange du ein Ticket hast. Mit Zubeh\u00f6r \
  kannst du daf\u00fcr sorgen, dass deine Ausr\u00fcstung wirklich aus der Masse hervorsticht. Ich \
  kann dir nur empfehlen, es auszuprobieren. Du wirst schon bald der absolute Blickfang sein!

r.bazaar_tour_13a = Woher bekomme ich Zubeh\u00f6r-Tickets?

m.bazaar_tour_14a = Du kannst Tickets f\u00fcr Zubeh\u00f6r in Lockboxen finden oder im \
  Auktionshaus, falls andere Knights welche verkaufen.

r.bazaar_tour_14a = Verstanden.

m.bazaar_tour_15a = Nun, das deckt alles Grundlegende \u00fcber den Basar ab. Es ist wirklich \
  ein fantastischer Ort, alles zu finden, was du brauchst.\n\
  \n\
  M\u00f6chtest du, dass ich das alles nochmal erkl\u00e4re oder denkst du, dass du es \
  verstanden hast?

r.bazaar_tour_15a = Ich w\u00fcrde gerne die L\u00e4den sehen. (Tylen folgen)
r.bazaar_tour_15b = Ich w\u00fcrde gerne nochmal die Dienstleistungen erkl\u00e4rt bekommen. \
  (Tylen folgen)
r.bazaar_tour_15c = Nein danke, ich sehe mich auf eigene Faust um.

m.bazaar_tour_16a = Eine weitere F\u00fchrung? Kein Problem, folge mir.
r.bazaar_tour_16a = (Tylen folgen)

m.bazaar_tour_16b = Wundervoll! Ich bin froh, dass ich dir helfen konnte, dich zurechtzufinden. \
  Viel Gl\u00fcck, {0}!

r.bazaar_tour_16b = Danke Tylen, wir sehen uns!



# Monstrous Codex
#...................................................................................................
r.monster_codex = Buch schlie\u00dfen

n.monster_codex_trojan = Monster-Kodex:
m.monster_codex_trojan = Trojan\n\
  Diese massigen Leviathane k\u00f6nnen mit Angriffen von vorn nicht verwundet werden. Triff \
  den Kristall auf ihrem R\u00fccken, um sie in die Knie zu zwingen.
# IMAGE: codex_trojan.png

n.monster_codex_zombie = Monster-Kodex:
m.monster_codex_zombie = Zombies\nSchlurfende Zombies erheben sich wieder von den Toten, wenn sie \
  in der N\u00e4he eines Grim Totem besiegt werden. Locke sie weg, damit du ihnen die ewige Ruhe \
  schenken kannst.
# IMAGE: codex_zombie.png

n.monster_codex_devilites = Monster-Kodex:
m.monster_codex_devilites = Devilites\n\
  Devilites sind die Arbeitstiere der Unterwelt. Wenn ein Pit Boss einen unterbesch\u00e4\
  ftigten Devilite erwischt, kann er ihn zu einem w\u00fctenden Overtimer oder einem gef\u00fcgigen Yesman bef\u00f6rdern.
# IMAGE: codex_devilites.png

n.monster_codex_snarbolax = Monster-Kodex:
m.monster_codex_snarbolax = Snarbolax\nDer mythische Snarbolax ist immun gegen die Angriffe von \
  Knights. Die Beast Bell zu l\u00e4uten, wenn er in der N\u00e4he ist, wird das Biest aber \
  bet\u00e4uben und verwundbar machen.
# IMAGE: codex_snarbolax.png

n.monster_codex_royal_jelly = Monster-Kodex:
m.monster_codex_royal_jelly = Royal Jelly\nDieser gewaltige Glibberw\u00fcrfel geht leicht in die \
  Luft und dreht dann ordentlich durch. Wenn seine k\u00f6niglichen Vorkoster fehlen, wird ein \
  vergiftetes Parfait f\u00fcr ihn zur k\u00f6niglichen Qual.
# IMAGE: codex_royal_jelly.png

n.monster_codex_roarmulus_twins = Monster-Kodex:
m.monster_codex_roarmulus_twins = Roarmulus Twins\n\
  Diese gigantischen Gun Puppies tragen undurchdringliche R\u00fcstung und m\u00e4chtige \
  Munition zur Schau. Ihre Panzer sind so dick, dass nur die br\u00fcderliche Feuerkraft ihnen \
  etwas anhaben kann.
# IMAGE: codex_roarmulus_twins.png

n.monster_codex_vanaduke = Monster-Kodex:
m.monster_codex_vanaduke = Lord Vanaduke\n\u00dcber den ewigen Herzog des Almirischen Imperiums \
  ist nur wenig bekannt. Unsere Sensoren zeigen an, dass die Maske sowohl eine Quelle der Macht \
  als auch eine m\u00f6gliche Schw\u00e4che ist.
# IMAGE: codex_vanaduke.png

n.monster_codex_battlepod = Monster-Kodex:
m.monster_codex_battlepod = Battlepod\nDiese unbeweglichen Automaten verbergen ein kleines Arsenal \
  unter ihrer doppelten Panzerung. Jeder Battlepod hat eine einzigartige Kombination aus Angriffen \
  und Abwehrmechanismen, die dich auf Trab halten wird.
# IMAGE: codex_battlepod.png

# Laboratory Guards
#...................................................................................................

m.guard_laboratory_1a = Entschuldigung, {0}, du bist noch nicht berechtigt, das Labor zu \
  betreten.
r.guard_laboratory_1a = Gespr\u00e4ch beenden

## HAVEN LABORATORY
#...................................................................................................


m.lab_knight1_1a = Wir haben aus der Skylark geborgen, was wir konnten, und den Rest mit Hilfe der \
  Strangers zusammengest\u00fcckelt.
r.lab_knight1_1a = Gespr\u00e4ch beenden

m.lab_knight2_1a = Das, was der Core dieser Welt ausstrahlt, hatte seltsame Auswirkungen auf \
  unsere Kampfsprites.

m.lab_knight3_1a = Wir haben es geschafft, den sekund\u00e4ren Generator aus der Skylark zu \
  holen, sogar gr\u00f6\u00dftenteils intakt. Leider ist er kaum stark genug, um dieses Labor \
  am Laufen zu halten, geschweige denn, unser Schiff zu betreiben. Wir m\u00fcssen eine andere \
  Energiequelle finden, wenn wir darauf hoffen wollen, je nach Hause zu kommen.

m.lab_knight4_1a = Aufkl\u00e4rungs-Trupps haben einige seltsame und bemerkenswerte Dinge aus \
  dem Uhrwerk geborgen.

m.lab_knight5_1a = {0}, hast du diese Mineralien schon einmal gesehen auf deinen Reisen? Sie \
  sind faszinierend! Du solltest Chief Geo Knight Wegner danach fragen. Ich habe geh\u00f6rt, \
  er ist der Experte in Sachen Mineralien!

m.lab_knight6_1a = Wir gehen bei diesem Artefakt, das du gefunden hast, keine Risiken ein, {0}. \
  Eines Tages k\u00f6nnten die Gremlins deswegen hier wieder aufkreuzen. Sei wachsam!

m.lab_knight7_1a = Die ersten Messungen sprengen alle Skalen, {0}! Wir hatten es noch nie mit \
  etwas wie dem hier zu tun. Es wird einige Zeit dauern, bis wir v\u00f6llig verstehen, wof\u00fcr \
  dieser Gegenstand benutzt wird.

m.lab_hahn_1a = (Hahn scheint besch\u00e4ftigt zu sein und bemerkt dich offenbar nicht.)

## Progression NPCS
#...................................................................................................

# Snarbolax
m.lab_progress_1 = Ich wette, diese Beast Bells waren richtig praktisch, was, {0}?
r.lab_progress_cont = Weiter
r.lab_progress_end = Gespr\u00e4ch beenden

m.lab_progress_2 = Danke, dass du den Snarbolax besiegt hast. Zu viele unserer Knappen haben durch \
  diese Bestie ein vorzeitiges Ende gefunden. Ich werde bestimmt besser schlafen, jetzt, da ich \
  wei\u00df, dass diese Bedrohung hinter uns liegt.\n\nIch freue mich schon darauf, von deinen \
  zuk\u00fcnftigen Heldentaten zu h\u00f6ren, Soldat!

# Lab, Post-Attack
m.lab_progress_3 = Zum Gl\u00fcck war der Schaden am Labor nicht allzu gro\u00df. Zumindest die \
  Ausr\u00fcstung f\u00fcr den Unterhalt unserer Kampfsprites ist intakt.

m.lab_progress_4 = Wir haben die Zahl der Patrouillen in Haven verdoppelt, f\u00fcr den Fall, \
  dass ein weiterer Angriff erfolgt, aber ich habe das Gef\u00fchl, dass diese Gremlins bereits \
  bekommen haben, weswegen sie gekommen sind...

m.lab_progress_5 = Es wird etwas Zeit brauchen, bis all unsere Ausr\u00fcstung wieder voll \
  funktionsf\u00e4hig ist.

# Royal Jelly
m.lab_progress_6 = Dieser Glibber-Palast... was f\u00fcr ein seltsamer Ort. Ich frage mich \
  auch, was das f\u00fcr ein komischer Apparat ist, den du im Palast gefunden hast? Es hat \
  nicht ausgesehen, als w\u00e4re es von solchen wie den Glibbern gebaut worden.

m.lab_progress_7 = Bei sehr seltenen Gelegenheiten habe ich Glibber gefunden, die uns nicht gleich \
  angegriffen haben, als sie uns gesehen haben. Bei diesem hier entferne ich gerade die Stacheln. \
  Sie sind irgendwie niedlich, wenn sie nicht versuchen, dich aufzuspie\u00dfen!

# Roarmulus
m.lab_progress_8 = Dieser Gremlin kommt aus der Kolonie Emberlight, tief im Uhrwerk. Sie sind eine \
  Gruppe Ausgesto\u00dfener, die sich King Tinkinzar und dem Crimson Order widersetzt haben. Wir \
  hoffen, wir k\u00f6nnen einen Vertrag mit ihnen abschlie\u00dfen, der es uns erlaubt, ihre \
  Kolonie als Operationsbasis f\u00fcr unsere Missionen tiefer unter der Erde zu verwenden.

m.emberlight_visitor_1a = Gremlins von Emberlight danken dir, dass du dieser Bedrohung ein Ende \
  gemacht hast.

r.emberlight_visitor_1a = Weiter

m.emberlight_visitor_2a = Aber ich komme, dich zu warnen! Crimson Order nich aufgeh\u00f6rt mit \
  Projekt Roarmulus. Crimson Order verzweifelt, will alle Feinde zerst\u00f6ren. Gro\u00dfe \
  welche, kleine welche und Ausgesto\u00dfene. Alles Feinde f\u00fcr Crimson Order!

r.emberlight_visitor_2a = Danke f\u00fcr die Warnung, Pakrat.

m.emberlight_visitor_3a = Dir bei etwas helfen?
r.emberlight_visitor_3a = Erz\u00e4hl' mir von Emberlight.
r.emberlight_visitor_3b = Warum versucht King Tinkinzar, Haven zu zerst\u00f6ren?
r.emberlight_visitor_3c = Ich habe genug Informationen, danke. (Gespr\u00e4ch beenden)

m.emberlight_visitor_4a = Emberlight gegr\u00fcndet von Ausgesto\u00dfenen der gro\u00dfen \
  Kolonie. Gremlins von Emberlight folgen nicht Eisernem Gesetz, also wir fliehen oder sterben. \
  Wir anfangen neu in Emberlight. Neue Kolonie Heimat f\u00fcr wenige von uns: meiste \
  Ex-Pl\u00e4neschmieder, manche H\u00e4ndler, manche K\u00e4mpfer, alle Verr\u00e4ter in Augen \
  von Gremlins von gro\u00dfer Kolonie.

r.emberlight_visitor_4a = Eine weitere Frage, Pakrat.

m.emberlight_visitor_4b = Keiner wei\u00df sicher. Tinkinzar nicht gesehen f\u00fcr viele, viele \
  Jahre, von niemandem. Crimson Order folgt Tinkinzars Pl\u00e4ne f\u00fcr Cradle. Emberlight \
  Schandfleck auf gro\u00dfem Plan, weil gebaut von Ausgesto\u00dfenen. Haven vielleicht genauso, \
  gemacht von Nicht-Gremlins. Nicht Teil von Plan!

# Vanaduke
m.lab_progress_9 = Noch eine seltsame Apparatur! Diese hier wurde definitiv genauso wenig von den \
  Almirians gebaut, wie die letzte von Glibbern gebaut wurde. Eine Sache haben wir allerdings \
  bemerkt: Dieser Apparat ist immer noch aktiv. Au\u00dferdem \u00e4hnelt die Energiesignatur den \
  Messwerten, die wir vom Artefakt genommen hatten, bevor es gestohlen wurde. Ich denke, hier \
  braucht es weitere Nachforschungen.

m.almire_historian_1a = Wir haben das wenige geborgen, was in Owlite Keep \u00fcber das \
  K\u00f6nigreich Almire noch \u00fcbrig war. Zusammen mit den Schnipseln, die wir von den \
  Nature-Sprites in der Feuersturm-Zitadelle selbst erhalten haben, beginnen wir, ein klareres \
  Bild von Almires Geschichte zu bekommen.

r.almire_historian_1a = Was habt ihr \u00fcber Almire herausgefunden?

m.almire_historian_2a = Aus den B\u00fcchern, die wir geborgen haben, haben wir erfahren, dass \
  die Feuersturm-Zitadelle einst ein Teil eines viel gr\u00f6\u00dferen K\u00f6nigreichs war, \
  bekannt als Almire, vor vielen tausend Jahren. Obwohl es an viele aggressive Nationen \
  angrenzte, war Almire f\u00fcr die Kampfkraft seiner vielen Legionen ber\u00fchmt. Diese \
  Legionen haben f\u00fcr das K\u00f6nigreich f\u00fcr viele Jahre f\u00fcr Sicherheit gesorgt. \
  Leider waren sie nicht genug.

r.almire_historian_2a = Was passierte mit dem Rest des K\u00f6nigreichs?

m.almire_historian_3a = Nun, wir wissen, dass massive Zitadellen als Behausungen f\u00fcr Almires \
  bewaffnete Truppen dienten und gro\u00dfe Anwesen f\u00fcr die Adelsh\u00e4user. Es muss ein \
  einmaliger Anblick gewesen sein. Wir nehmen an, dass der Rest des K\u00f6nigreichs irgendwo als \
  schwelende Ruine existiert. Es ist m\u00f6glich, dass etwas davon \u00fcberlebt hat... aber \
  angesichts der d\u00fcnn ges\u00e4ten Beweise halten wir das bestenfalls f\u00fcr \
  unwahrscheinlich.

# Biscotti, Lab Pre-Selection
#...................................................................................................

m.lab_biscotti_1a = Hallo! Ich bin Biscotti, Chefkoch der Skylark! Ich bin immer noch dabei, die \
  Futter-Alchemiestation f\u00fcr Kampfsprites zu kalibrieren, also schau bitte sp\u00e4ter wieder \
  vorbei.

r.lab_biscotti_1a = Kampfsprites brauchen Futter?

m.lab_biscotti_2a = Tats\u00e4chlich! Ein Kampfsprite kann Materie in nutzbare Energie \
  umwandeln. Diese Maschine hier kann bestimmte Materialien per Alchemie in spezielles \
  Sprite-Futter umwandeln... also, wird es k\u00f6nnen, wenn sie fertig kalibriert ist.

r.lab_biscotti_2a = Danke, ich schaue sp\u00e4ter nochmal vorbei.

# Biscotti, Lab Post-Selection
#...................................................................................................
m.lab_biscotti_3a = Hallo, {0}! Als Chefkoch der Skylark wurde ich daf\u00fcr eingeteilt, mich um \
  die ern\u00e4hrungstechnische Entwicklung unserer neuen Sprite-Freunde zu k\u00fcmmern. Sie \
  scheinen sich dort unten im Uhrwerk wirklich sehr unterschiedlich entwickelt zu haben. Es wird \
  interessant sein zu sehen, wie sie sich entwickeln.\n\nHast du irgendwelche Fragen dazu, wie du \
  dich um deinen Sprite k\u00fcmmern und wie du ihn f\u00fcttern solltest?

m.lab_biscotti_3aa = Hast du weitere Fragen dazu, wie du dich um deinen Sprite k\u00fcmmern und wie du ihn f\u00fcttern solltest?

r.lab_biscotti_3a = Wie f\u00fcttere ich meinen Kampfsprite?
r.lab_biscotti_3b = Erz\u00e4hle mir etwas \u00fcber Appetit.
r.lab_biscotti_3c = Erz\u00e4hle mir etwas \u00fcber bevorzugte Gegenst\u00e4nde.
r.lab_biscotti_3d = Erz\u00e4hle mir etwas \u00fcber notwendige Gegenst\u00e4nde.
r.lab_biscotti_3e = Nicht jetzt, danke.

m.lab_biscotti_4a = Deinen Sprite zu f\u00fcttern, ist einfach! \u00d6ffne einfach das \
  Kampfsprite-Men\u00fc und w\u00e4hle das Sprite-Symbol an. Von da aus kannst du ein Material aus \
  deinem Arsenal w\u00e4hlen und es in den F\u00fctterungs-Slot ziehen.\n\nSobald du ein Material \
  ausgew\u00e4hlt hast, das dein Sprite verarbeiten soll, einfach auf 'Sprite f\u00fcttern' \
  klicken. Guten Appetit!

r.lab_biscotti_4a = Ich habe andere Fragen.
r.lab_biscotti_4aa = Das ist alles f\u00fcr den Moment, danke!

m.lab_biscotti_4b = Sprites haben einen begrenzten Appetit, der die Menge an Materialien \
  beschr\u00e4nkt, die sie auf einmal fressen k\u00f6nnen. Wenn du deinem Sprite Material \
  verf\u00fctterst, verringert sich sein Appetit. Wenn der Appetit vollst\u00e4ndig aufgebraucht \
  ist, kannst du den Sprite nicht mehr f\u00fcttern.

r.lab_biscotti_4b = Wie nimmt der Appetit eines Sprites zu?

m.lab_biscotti_5b = Der Appetit eines Sprites steigert sich ganz normal im Laufe der Zeit, \
  allerdings langsam. Mache mit dem Sprite einen Ausflug ins Uhrwerk, um seinen Appetit \
  schneller zu steigern. W\u00e4rme von Monstern zu absorbieren ist eine gute Methode, Kalorien \
  zu verbrennen!

m.lab_biscotti_4c = Ein Sprite hat zu jeder Zeit einen 'bevorzugten Gegenstand', ein besonderes \
  Material, das er am liebsten frisst. Es ist eine besondere Belohnung, wenn du deinem Sprite \
  das zu fressen gibst und es verleiht deinem Sprite eine Menge W\u00e4rme.

r.lab_biscotti_4c = Woher bekomme ich diese Gegenst\u00e4nde?

m.lab_biscotti_5c = Bevorzugte Gegenst\u00e4nde k\u00f6nnen mit genau dieser Alchemiestation hier \
  vor dir per Alchemie hergestellt werden. Alles, was man daf\u00fcr braucht, sind zwei St\u00fcck \
  desselben Materials und einige Mineralien aus dem Uhrwerk. Einfach!

m.lab_biscotti_4d = Notwendige Gegenst\u00e4nde werden auftauchen, wenn dein Sprite bereit ist, \
  im Level aufzusteigen. Wenn dein Sprite genug W\u00e4rme aufgenommen hat, wird ein \
  'notwendiger Gegenstand' \u00fcber dem F\u00fctterungs-Slot erscheinen. Dieses Material MUSST \
  du an den Sprite verf\u00fcttern, damit er sich weiter entwickeln kann.

r.lab_biscotti_4d = Weiter

m.lab_biscotti_5d = In den meisten F\u00e4llen ist es nur ein gew\u00f6hnlicher bevorzugter \
  Gegenstand, aber wenn dein Sprite bereit ist, sich weiterzuentwickeln, wird ein Evo Catalyst \
  ben\u00f6tigt.

# Riley, Harness Merchant
#...................................................................................................
m.lab_harness_1a = Ich bin Riley, Morlins Assistent. Ich bin dabei, eine Methode zu entwickeln, \
  wie sich unsere Kampfsprites sogar noch weiter entwickeln k\u00f6nnen. Schau sp\u00e4ter \
  wieder vorbei, wenn du einen dauerhaft an dich gebundenen Sprite hast.

r.lab_harness_1a = Ich schaue sp\u00e4ter nochmal vorbei, danke.

# Morlin, Sprite Tutorial
#...................................................................................................
m.sprite_tut_1a = Gr\u00fc\u00dfe, {0}. Ich kann mir vorstellen, dass du einige Fragen \u00fc\
  ber Kampfsprites hast. Wie kann ich helfen?
m.sprite_tut_1aa = Mehr Fragen zu den Kampfsprites? Wie kann ich dir behilflich sein?

r.sprite_tut_1a = Wie steigen Sprites im Level auf und entwickeln sich weiter?
r.sprite_tut_1b = Erz\u00e4hle mir etwas \u00fcber die F\u00e4higkeiten der Sprites.
r.sprite_tut_1c = Was sind Harnische f\u00fcr Sprites?
r.sprite_tut_1d = Was sind Sprite-Boni?
r.sprite_tut_1e = Im Moment nichts, danke.

m.sprite_tut_2a = Kampfsprites steigen im Level auf, indem sie W\u00e4rme sammeln, genau wie deine \
  Waffen und Ausr\u00fcstung. Sie k\u00f6nnen auf zwei Arten W\u00e4rme sammeln: indem sie sie \
  absorbieren, w\u00e4hrend du im Uhrwerk k\u00e4mpfst, und indem sie Materialien fressen und in \
  W\u00e4rme umwandeln.

r.sprite_tut_2a = Weiter

m.sprite_tut_3a = Materialien an deinen Sprite zu verf\u00fcttern ist der schnellste Weg, ihn \
  im Level steigen zu lassen. Sprich mit Biscotti hier im Labor, um mehr Informationen \u00fcber das F\u00fc\
  ttern von Sprites zu bekommen.

r.sprite_tut_3a = Und wie entwickelt sich mein Sprite weiter?

m.sprite_tut_4a = Dein Sprite wird sich weiterentwickeln, wenn er im Level aufsteigt. Auf \
  bestimmten Schl\u00fcssel-Leveln wirst du einen Evo Catalyst an deinen Sprite verf\u00fcttern \
  m\u00fcssen, damit er weiter im Level aufsteigen kann. Sobald er ihn gefressen hat, wird dein \
  Sprite sein Aussehen ver\u00e4ndern!\n\nEs wird interessant sein zu sehen, wie diese neuen, \
  fremden Arten von Kampfsprites sich im Laufe der Zeit entwickeln.

r.sprite_tut_4a = Ich habe weitere Fragen.
r.sprite_tut_4aa = Das ist f\u00fcr den Moment alles, danke!

m.sprite_tut_2b = W\u00e4hrend ein Sprite im Level aufsteigt, lernt er neue Kampff\u00e4higkeiten \
  und erh\u00e4lt F\u00e4higkeitspunkte.

r.sprite_tut_2b = Weiter

m.sprite_tut_3b = Jeder Kampfsprite lernt drei F\u00e4higkeiten, die du im Kampf einsetzen kannst. \
  F\u00e4higkeiten werden automatisch auf bestimmten Leveln erlernt, wenn der Sprite im Level \
  aufsteigt.\n\nKampff\u00e4higkeiten werden mit F\u00e4higkeitspunkten st\u00e4rker.

r.sprite_tut_3b = Weiter

m.sprite_tut_4b = F\u00e4higkeitspunkte bekommt man regelm\u00e4\u00dfig, wenn ein Sprite im Level \
  aufsteigt. Sie k\u00f6nnen im Kampfsprite-Men\u00fc auf F\u00e4higkeiten verteilt werden.\n\n\
  Wenn du einen F\u00e4higkeitspunkt verteilst, musst du eine Verbesserung ausw\u00e4hlen, wie \
  etwa die Cooldown-Dauer oder den Gesamtschaden.

r.sprite_tut_4b = Weiter

m.sprite_tut_5b = Und mach dir keine Sorgen darum, F\u00e4higkeitspunkte 'falsch' zu verteilen, \
  denn du wirst im Laufe der Zeit genug F\u00e4higkeitspunkte bekommen, um alle F\u00e4higkeiten \
  auf das Maximum zu bringen!

r.sprite_tut_5b = Weiter

m.sprite_tut_6b = Wenn du alle deine F\u00e4higkeitspunkte verteilt und mit deinem Sprite ein sehr \
  hohes Level erreicht hast, beginnst du, deine 'ultimativen F\u00e4higkeiten' auszuw\u00e4hlen. \
  Ultimative F\u00e4higkeiten sind verbesserte Versionen deiner Sprite-F\u00e4higkeiten. F\u00fcr \
  jede Sprite-F\u00e4higkeit gibt es zwei m\u00f6gliche ultimative F\u00e4higkeiten.

r.sprite_tut_6b = Weiter

m.sprite_tut_7b = Du kannst pro Sprite-F\u00e4higkeit nur eine ultimative F\u00e4higkeit ausw\u00e4hlen, also w\u00e4\
  hle weise! Beachte auch, dass die Auswahl von ultimativen F\u00e4higkeiten das Aussehen \
  deines Sprites weiter ver\u00e4ndern wird.\n\
  \n\
  Mit all diesen M\u00f6glichkeiten wird dein Sprite sich in Aussehen und Verhalten sicher vom \
  Rest abheben!

r.sprite_tut_7b = Ich habe weitere Fragen.
r.sprite_tut_7bb = Das ist f\u00fcr den Moment alles, danke!

m.sprite_tut_2c = Alle Kampfsprites tragen einen mechanischen Harnisch, der ihre F\u00e4higkeiten \
  auf eine bestimmte Schadensart ausrichtet. Nicht jeder Sprite kann aber jeden Harnisch tragen. \
  Zum Beispiel kann ein Drakon keinen Perforationsschaden verursachen.\n\nStandardm\u00e4\u00dfig \
  hast du einen Iron Harness, den jeder Sprite tragen kann. Wenn du dich, wie wohl auch bei deinen \
  Waffen und deiner Ausr\u00fcstung, breiter aufstellen willst, musst du neue Harnische kaufen.

r.sprite_tut_2c = Wo kann ich mehr Harnische kaufen?

m.sprite_tut_3c = Geh zu Riley hier im Labor, um neue Harnische zu kaufen. Wenn du einen Harnisch \
  kaufst, wird er automatisch deiner Liste an Harnischen im Kampfsprite-Men\u00fc \
  hinzugef\u00fcgt.\n\nAu\u00dferdem wird jedes Mal, wenn du eine direkte Aufwertung eines \
  Harnischs kaufst, den du besitzt, der alte Harnisch durch den neuen, besseren ersetzt.

r.sprite_tut_3c = Weiter

m.sprite_tut_4c = Aufwertungen f\u00fcr Harnische sind die Crowns wirklich wert. Die besseren \
  Versionen jedes Harnischs bringen reduzierte Cooldown-Zeit f\u00fcr die F\u00e4higkeiten mit sich!

r.sprite_tut_4c = Ich habe noch andere Fragen.
r.sprite_tut_4cc = Das ist alles f\u00fcr den Moment, danke!

m.sprite_tut_2d = Kampfsprites erhalten Boni auf bestimmten Levels, die dann \u00fcber das Sprite-Men\u00fc verwaltet werden k\u00f6\
  nnen. Durch Boni werden die Eigenschaften verbessert.

r.sprite_tut_2d = Weiter

m.sprite_tut_3d = Boni werden zuf\u00e4llig freigeschaltet. Mancher Bonus ist seltener als \
  andere und es kann sein, dass der Sprite sehr hoch aufsteigen muss, um alle freizuschalten.\n\
  \n\
  Man kann sogar noch Boni erhalten, nachdem Level 100 erreicht wurde!

r.sprite_tut_3d = Ich habe andere Fragen.
r.sprite_tut_3dd = Das ist alles f\u00fcr den Moment, danke.

## HAVEN STRANGERS


# Hailoh
#...................................................................................................


m.hav_greeter_1a = Willkommen in Haven, kleiner Knight. Schlie\u00df dich deinen Freunden an und \
  beschaffe Sch\u00e4tze aus dem Uhrwerk. Sch\u00e4tze sind bei den Strangers sehr beliebt.

r.hav_greeter_1a = Gespr\u00e4ch beenden


# Warnel
#...................................................................................................


m.hav_snipes_1a = Pass auf, dass du auf keine Schnepfe trittst, kleiner Knight.

r.hav_snipes_1a = Schnepfen?

m.hav_snipes_2a = Schnepfen sind die anmutigen, entz\u00fcckenden, reizend rundlichen V\u00f6gel, \
  die du \u00fcberall in Haven herumlaufen siehst. Manche sagen, sie seien die sch\u00f6nsten \
  Gesch\u00f6pfe der Galaxis, aber das w\u00fcrdest du von den Schnepfen selbst niemals \
  h\u00f6ren, denn sie sind unglaublich bescheiden.

r.hav_snipes_2a = Gespr\u00e4ch beenden


# Plinkop
#...................................................................................................


m.hav_clock_1a = Hall\u00f6chen, kleiner Knight! Du siehst aus, als k\u00f6nntest du ein paar \
  Informationen gebrauchen.

r.hav_clock_1a = Erz\u00e4hl mir, was du \u00fcber das Uhrwerk wei\u00dft.

r.hav_clock_1b = Im Moment brauche ich nichts, danke.

m.hav_clock_2a = Ich werde dir sagen, was ich wei\u00df, kleiner Knight.

r.hav_clock_2a = Wie alt ist das Uhrwerk?

r.hav_clock_2b = Wie ist das Uhrwerk entstanden?

r.hav_clock_2c = Was ist im Herzen des Uhrwerks?

r.hav_clock_2d = Da warten ein paar Abenteuer auf mich. Bis dann!

m.hav_clock_3a = Das ist schwer zu sagen, denn so vieles darin scheint aus verschiedenen Welten zu \
  stammen. Manches kommt aus sehr alten Welten, die zweifellos einst unz\u00e4hlige antike \
  G\u00f6tter und Wesen beherbergten. \n\nDiese Welt ist unnat\u00fcrlich. Was man in ihr sieht, \
  war niemals dazu bestimmt, hier zu sein. Die gro\u00dfe Vergangenheit so vieler Welten dreht \
  sich endlos in den R\u00e4dern dieser gewaltigen Maschine... Ich finde das ziemlich traurig.

m.hav_clock_3b = Es gibt unterschiedliche Theorien. Manche sagen, die Gremlins, die jetzt daran \
  arbeiten, seien daf\u00fcr verantwortlich. Aber selbst f\u00fcr ihre unermesslich gro\u00dfe \
  Zahl und Arbeitskraft scheint mir das zu gro\u00df. Und selbst wenn das stimmen w\u00fcrde, \
  wie haben sie "angefangen"? Woher haben sie die Energie?

m.hav_clock_3c = Etwas von unermesslicher Macht, kleiner Knight. Aus der Mitte des Uhrwerks kommt \
  ein Energiesignal von enormer St\u00e4rke, aber das ist alles, was wir wissen. Niemand hat es je \
  bis zum Core geschafft. Und falls doch, so ist er niemals zur\u00fcckgekehrt. \n\nDie Gremlins \
  w\u00e4ren da wohl die richtigen Ansprechpartner, denn sie sind wahrscheinlich tiefer im Uhrwerk \
  gewesen als jede andere Kreatur. Aber das d\u00fcrfte schwierig werden, denn sie sind ziemlich \
  unangenehme Zeitgenossen.

r.hav_clock_3a = Ich habe noch eine Frage.

r.hav_clock_3b = Danke f\u00fcr die Infos, Gro\u00dfer, wir sehen uns in der Stadt.


# Bootshuze
#...................................................................................................


m.hav_grem_1a = Hall\u00f6chen, kleiner Knight! Du siehst aus, als k\u00f6nntest du ein paar \
  Informationen gebrauchen.

r.hav_grem_1a = Erz\u00e4hl mir, was du \u00fcber die Gremlins wei\u00dft.

r.hav_grem_1b = Im Moment brauche ich nichts, danke.

m.hav_grem_2a = Mein Wissen geh\u00f6rt dir, kleiner Knight.

r.hav_grem_2a = Was genau sind Gremlins eigentlich?

r.hav_grem_2b = Haben die Gremlins einen Anf\u00fchrer?

r.hav_grem_2c = Gibt es auch freundliche Gremlins im Uhrwerk?

r.hav_grem_2d = Ich muss jetzt weiter. Vielleicht ein andermal...

m.hav_grem_3a = Gremlins sind unheimlich geschickt darin, alle Arten von Maschinen und \
  Mechanismen zu bauen und zu zerlegen. Sie sind gleichzeitig geniale Erfinder und eine Macht \
  von gewaltiger Zerst\u00f6rungskraft.

m.hav_grem_3b = Alle Gremlins der Kolonie dienen King Tinkinzar. Tinkinzar soll ein gro\u00dfer \
  Herrscher und ein wahres Genie von einem Mechaniker sein, der f\u00fcr die Vision des gesamten \
  Uhrwerks verantwortlich ist. Wir glauben allerdings, dass gew\u00f6hnliche Gremlins den \
  K\u00f6nig niemals zu Gesicht bekommen und seine Befehle stattdessen von seinem Crimson Order \
  \u00fcberbracht und ausgef\u00fchrt werden. Der Crimson Order ist eine furchterregende, \
  fanatische Bande von Gremlins, die als Einzige beim gro\u00dfen K\u00f6nig Audienz haben.

m.hav_grem_3c = Die meisten davon werden dich angreifen, sobald sie dich sehen, aber es gibt \
  ein paar Gremlins, die aus der Kolonie ausgesto\u00dfen wurden und in den St\u00e4dtchen \
  unterhalb der Oberfl\u00e4che Zuflucht gefunden haben. Sie haben ein hartes Leben, gehasst \
  von anderen ihrer Art, in einer Welt, die sie nicht l\u00e4nger ihr Zuhause nennen.

r.hav_grem_3a = Ich habe noch eine Frage.

r.hav_grem_3b = Danke f\u00fcr die Infos, Gro\u00dfer, wir sehen uns in der Stadt.



## MOORCROFT MANOR

# Konjuring Kat  (Moorcroft Event Mission)
#...................................................................................................


m.ritual_1a = Was f\u00fcr ein dunkles Ritual?

r.ritual_1a = Ich gehe jetzt...

r.ritual_1b = Ich denke ich habe etwas, das f\u00fcr dich von Interesse sein k\u00f6nnte.
m.ritual_2b = Wo hast du das gefunden?! Gib es her! Ich kann endlich meine Arbeit beenden! Aber \
  nur eine freundliche Warnung: Ich habe keine Ahnung, was passieren k\u00f6nnte. Es k\u00f6\
  nnte sehr schlimm werden. Du solltest besser vorbereitet sein f\u00fcr den Fall, dass es... \
  ungem\u00fctlich wird.

r.ritual_2b = Ich habe ein wirklich schlechtes Gef\u00fchl bei der Sache, aber okay...
r.ritual_2c = Nein danke, ich behalte das Buch f\u00fcr den Moment.

m.ritual_3a = Okay, los geht's...\n\
  \n\
  KAT-TU... BLOOGATO... NEKO!
r.ritual_3a = Konversation beenden.

m.ritual_4a = Also, das kam unerwartet. Das n\u00e4chste Mal kriege ich es hin!
r.ritual_4a = Seufz...



# Desk Clerk
#...................................................................................................


m.deskclerk_1a = Willkommen in Moorcroft Manor, wo m\u00fcde Seelen die Beine hochlegen k\u00f6\
  nnen (sofern vorhanden). Wenn du die Nacht bleiben m\u00f6chtest, bitte bedenke, dass wir die \
  Zimmer alle neunundneunzig Jahre etwas drehen, bei Vollmond ein kostenloses Fr\u00fchst\u00fc\
  ck servieren und dass du diesen Ort nie mehr verlassen kannst. Wir w\u00fcnschen einen sch\u00f6nen Aufenthalt!

r.deskclerk_1a = \u00c4h ... Danke sehr?


m.moorcroft_archives_1a = Willkommen in den Archiven von Moorcroft, Reisender. Hier findest du \
  eine illustre Sammlung antiker Schriften aus vielen vergessenen Welten. Ich wei\u00df, was f\u00fcr ein Anblick!\n\
  \n\
  Du kannst dich gerne umsehen, aber bitte nichts anfassen - einige dieser B\u00fccher sind erf\u00fc\
  llt von unvorstellbaren mystischen Kr\u00e4ften. Du k\u00f6nntest dich verletzen!

r.moorcroft_archives_1a = Danke, ich werde vorsichtig sein.

m.moorcroft_archives_2a = Oh {0}, es ist schrecklich, einfach schrecklich!\n\
  \n\
  Ein furchteinfl\u00f6\u00dfender Schwarm Black Kats ist aus einem dunklen Portal aus den \
  Tiefen des Uhrwerks gekommen und hat die Archive von Moorcroft gepl\u00fcndert!

r.moorcroft_archives_2a = Was sind Black Kats?

m.moorcroft_archives_3a = Black Kats sind die finstersten Seelen des fr\u00fcheren Kat-Stammes. \
  Sie tragen den st\u00e4rksten Fluch von allen mit sich und jagen ohne jede R\u00fccksicht \
  nach magischen Auras die sie verschlingen k\u00f6nnen. Der st\u00e4ndige Konsum solcher Kr\u00e4\
  fte macht sie unglaublich stark.\n\
  \n\
  Sie wurden wahrscheinlich von den Kr\u00e4ften angezogen, die von den alten Schriften hier im \
  Archiv ausgestrahlt werden.\n\
  \n\
  Bitte {0}, du musst uns helfen, die Archive von Moorcroft wiederherzustellen!

r.moorcroft_archives_3a = Ich werde in jeder mir m\u00f6glichen Form helfen, Pembrooke.

m.moorcroft_archives_4a = Dann durchforste das Uhrwerk nach diesen elenden Kats und vernichte \
  sie! Sogar wenn sie die B\u00fccher gefressen haben, wirst du die alten Schriften bergen k\u00f6nnen. Diese Seiten k\u00f6\
  nnen bei Montague im Tausch gegen Belohnungen abgegeben werden. Hilf uns und wir werden dir \
  helfen!\n\
  \n\
  Auf Black Kats kann man zuf\u00e4llig treffen, wenn man Spookats auf Rang 2 oder 3 begegnet \
  (Arcade-Tore und Missionen). Es gibt auch eine t\u00e4gliche Prestige-Mission, die dich \
  wahrscheinlich zu einem Nest der Black Kats f\u00fchrt.

r.moorcroft_archives_4a = Ich werde diese Black Kats finden und die alten Schriften zur\u00fcckbringen!

m.moorcroft_archives_5a = Klasse! Viel Gl\u00fcck, {0}. Du wirst es brauchen - Black Kats sind \
  ein unheilvoller Haufen...

r.moorcroft_archives_5a = Konversation beenden

