m.vise_seerus = Hallo auch, Junge!\n\
  Du legst dich mit dem alten Seerus an, ja? Sei blo\u00df vorsichtig, der ist nicht ganz \
  richtig im Kopf. Richtig sch\u00f6n daneben ist der.\n\
  \n\
  Er und ich kennen uns noch von ganz fr\u00fcher, aber nichts, woran man sich gern erinnert. \
  Sollte deine Mission erfolgreich sein, schau mal, ob du mir ein kleines Souvenir mitbringen \
  kannst. Ich werde dir etwas H\u00fcbsches f\u00fcr deine M\u00fchen hersetellen.

