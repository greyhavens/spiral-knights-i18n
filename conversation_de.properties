n.winterfest_branch_cont = Aufkl\u00e4rungsmodul
m.winterfest_branch_cont = Der Pfad der Gefahr f\u00fchrt dich weiter diesen t\u00fcckischen Berg hinauf. F\u00fc\
  r den Moment verzichtest du auf die Kiste Grinchlin-Sch\u00e4tze, die hier gelagert sind, f\u00fc\
  r eine Chance auf noch gr\u00f6\u00dfere Beute weiter oben am Berg.\n\
  \n\
  Sei gewarnt! Solltest du von den Herausforderungen die vor dir liegen \u00fcberw\u00e4ltigt \
  werden bevor du die n\u00e4chste Zuflucht erreichst, verlierst du alle Sch\u00e4tze!

