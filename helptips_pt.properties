msgbundle_class = com.threerings.projectx.client.ControlAwareMessageBundle

m.shop = Pressione ATTACK [[ACTION]] para ver os produtos do vendedor.
m.recon = Pressione ATTACK [[ACTION]] para ativar o M\u00f3dulo de Reconhecimento.
m.unlock = Pressione ATTACK [[ACTION]] para usar uma Chave de Prata.
m.unlock_gold = Pressione ATTACK [[ACTION]] para usar a Chave Dourada.
m.unlock_shadow = Pressione ATTACK [[ACTION]] para usar uma Chave Sombria.\n\
  \n\
  ADVERTENCIA: Si este elevador es desbloqueado el grupo se cerrar\u00e1 inmediatamente y se \
  quedar\u00e1 cerrado mientras dure la Guarida de la Sombra. \n\
  Escolha bem os outros membros do seu grupo!
m.lift = Pressione ATTACK [[ACTION]] para erguer o objeto.
m.interact = Pressione ATTACK [[ACTION]] para ativar.
m.poi = Pressione ATTACK [[ACTION]] para inspecionar.
m.talk = Pressione ATTACK [[ACTION]] para iniciar uma conversa.
m.zone = Pressione ATTACK [[ACTION]] para sair da zona atual.
m.energy = Pressione ATTACK [[ACTION]] para gastar energia neste dispositivo.
m.confirm_energy = Pressione ATTACK [[ACTION]] para confirmar o gasto de energia.

m.dead = Pressione ATTACK [[ACTION]] para alternar para a vis\u00e3o de espectador.

m.can_resurrect = Um membro do grupo concedeu a voc\u00ea uma Spark of Life. Pressione ATACAR \
  [[ACTION]] para reviver.

m.converse = Use as setas e a barra de espa\u00e7o para navegar pela conversa.

m.controls = Pressione [[TOGGLE_HELP]] a qualquer momento para ver os controles.

m.elevator = O elevador ser\u00e1 ativado quando todos os membros vivos do grupo estiverem sobre ele.

m.party_button = El bot\u00e3o de grupo se ativa cuando los miembros del grupo vivos suban a \
  el.

m.design = Pressione ATTACK [[ACTION]] para posicionar.\n\
  Pressione DEFEND [[DEFEND]] para guardar.\n\
  Pressione PREV_WEAPON [[PREV_WEAPON]] para girar no sentido hor\u00e1rio.\n\
  Pressione NEXT_WEAPON [[NEXT_WEAPON]] para girar no sentido anti-hor\u00e1rio.

m.unlock_grim_gate = Pressione ATTACK [[ACTION]] para usar um Cart\u00e3o de Identifica\u00e7\u00e3o Diab\u00f3lico\n\
  \n\
  ADVERTENCIA: Si este Portal Siniestro se abre, el grupo se cerrar\u00e1 y permanecer\u00e1 \
  cerrado mientras dure la miss\u00e3o. Elije a los miembros del grupo com cuidado!
m.activate_grim_gate = El Portal Siniestro se activar\u00e1 cuando todos los miembros vivos del \
  grupo est\u00e9n parados sobre el.
m.need_key_grim_gate = O Portal Macabro precisa de um Cart\u00e3o de Identifica\u00e7\u00e3o Diab\u00f3lico para ser ativado.

#
# Loading messages
#...................................................................................................

m.loading = Carregando...{0}%
m.connecting = Conectando...{0}%

t.loading0 = Pressione [[TOGGLE_HELP]] para ver os controles.
m.loading0 = Los controles b\u00e1sicos se pueden ver en cualquier momento pulsando \
  [[TOGGLE_HELP]].

t.loading1 = O mundo est\u00e1 sempre mudando...
m.loading1 = Los Mecanismos subterr\u00e1neos rotan los niveles en tiempo real. Nunca ver\u00e1\
  s todos los niveles de un mundo en un solo viaje. S\u00f3lo un aventurero de verdad \
  puede descubrir todos sus segredos!

t.loading2 = Equipado para triunfar
m.loading2 = La armadura y el yelmo no solamente ofrecen defensa f\u00edsica, tambi\u00e9n te \
  protegen de las condiciones de estatus. La combinaci\u00f3n correcta aumentar\u00e1 en gran \
  medida tus probabilidades de sobrevivir.

t.loading3 = Revive amigos que han ca\u00eddo
m.loading3 = Puedes reviver a otro jogador haciendo clic en su retrato y otorg\u00e1ndoles un Spark of Life.

t.loading4 = Monstruos Peculiares
m.loading4 = Los monstros especiales que ofrecen objetos exclusivos merodean por los \
  Mecanismos. Has visto ya a alguno?

t.loading5 = En la aventura con tus amigos
m.loading5 = Puedes ver que hacen tus amigos si haces clic en el bot\u00e3o Social de la \
  esquina superior izquierda de la pantalla. Puedes unirte a ellos al momento si hay lugar en \
  su grupo.

t.loading6 = Condici\u00f3n: Veneno
m.loading6 = Si te envenenan no podr\u00e1s curarte. Evita que te hagan dano hasta que se \
  pasen los efectos.

t.loading7 = Condici\u00f3n: Fuego
m.loading7 = Si est\u00e1s en llamas sufrir\u00e1s dano con regularidad hasta que se \
  apague el fogo. Pero eso no te debe detener para mandar el fogo a los monstros. Ac\u00e9\
  rcate a ellos y comparte el amor!

t.loading8 = Condici\u00f3n: Congelado
m.loading8 = Si te congelan no podr\u00e1s moverte ni girar, pero podr\u00e1s atacar. Si vas \
  con otros, p\u00eddeles que rompan el hielo con sus mejores ataques.

t.loading9 = Condici\u00f3n: Aturdir
m.loading9 = Si quedas atordoado te mover\u00e1s y atacar\u00e1s m\u00e1s despacio de lo normal. \
  Esto te puede dejar como el principal objetivo de los monstros m\u00e1s grandes de quienes \
  normalmente huir\u00edas as\u00ed que ten cuidado!

t.loading10 = Condici\u00f3n: Choque
m.loading10 = Si sufres una descarga y est\u00e1s en status de choque, tendr\u00e1s espasmos \
  debido a la electricidad que recorre tu cuerpo. Se interrumpir\u00e1 cualquier cosa que est\u00e9s haciendo.

t.loading11 = Condici\u00f3n: Maldici\u00f3n
m.loading11 = Si te lanzan una maldi\u00e7\u00e3o, algunas armas quedar\u00e1n marcadas por ella. \
  Si intentas usar un arma marcada sufrir\u00e1s dano.

t.loading12 = Pressione F2 para enviar reporte de error
m.loading12 = Si tienes alg\u00fan problema con el funcionamiento del juego, pulsa F2 para \
  enviar un reporte de error.\n\
  Este reporte no recibe respuesta, si necesitas ayuda env\u00eda tambi\u00e9n una petici\u00f3\
  n de asistencia a los Game Masters.

t.loading13 = Expulsando miembros del grupo
m.loading13 = Si eres el l\u00edder del grupo, puedes expulsar a cualquier jogador. Haz clic en \
  el icono de estatus de quien quieras expulsar y selecciona 'Expulsar del Grupo'.

t.loading14 = Seguridad de la Contrase\u00f1a
m.loading14 = No compartas la informaci\u00f3n de tu cuenta. Los Game Masters nunca te pedir\u00e1n tu contrase\u00f1a.

t.loading15 = Haciendo nuevos amigos
m.loading15 = Para a\u00f1adir a un amigo a tu lista, haz clic en \u00e9l y selecciona 'A\u00f1\
  adir como Amigo'. Para ver tu lista de amigos y qu\u00e9 hacen, haz clic en el bot\u00e3o Social.

t.loading16 = Recuerda bloquear los ataques!
m.loading16 = El usar un escudo te puede ayudar a evitar dano completamente, as\u00ed que aseg\u00fa\
  rate de usarlo!  Pressione "[[DEFEND]]" para defenderte. Conforme el escudo reciba dano, se pondr\u00e1 \
  rojo y eventualmente se romper\u00e1. El escudo debe regenerarse antes de poder usarlo de \
  nuevo.

t.loading17 = \u00danete a la comunidade!
m.loading17 = Visita forums.spiralknights.com Forma parte de la conversa!

t.loading18 = Ayuda a catalogar Mecanismos!
m.loading18 = Visita wiki.spiralknights.com/es, donde los valientes aventureros documentan los \
  hallazgos que han hecho en las profundezas de los Mecanismos.

#
# Tutorial
#...................................................................................................

t.tut_welcome = Se\u00f1al de Socorro Detectada!
m.tut_welcome = Hemos recibido tu se\u00f1al de socorro, recruta. Tu primer objetivo es llegar \
  a Haven, donde tenemos un puesto fronterizo. Probablemente est\u00e9s algo atordoado por el \
  impacto, as\u00ed que te ayudar\u00e9 con los aspectos b\u00e1sicos. La senda es peligrosa, \
  as\u00ed que prepara tu espada y conc\u00e9ntrate bien. Suerte!

t.tut_move = C\u00f3mo Mover-se
m.tut_move = Usa [[?MOVEMENT]] para moverte.

t.tut_move_short = C\u00f3mo Mover-se
m.tut_move_short = Usa [[?MOVEMENT]] para moverte.

t.tut_clearing = Limpia el Sendero
m.tut_clearing = Ataca usando [[ACTION]].

t.tut_fighting = Hay monstros adiante!
m.tut_fighting = Apunta a tus enemigos con tu rat\u00f3n y ataca con [[ACTION]].

t.tut_attack = C\u00f3mo Atacar
m.tut_attack = Usa [[ACTION]] para atacar.

t.tut_shrubs = Tesoro Escondido
m.tut_shrubs = Trata de limpiar a fondo esos arbustos. Las plantas y otros objetos destruibles \
  suelen esconder tesouros.

t.tut_breakable = Bloques Fr\u00e1giles
m.tut_breakable = Algunos blocos como estos son fr\u00e1giles y pueden romperse. R\u00f3mpelos \
  para abrirte paso.

t.tut_jelly_cubes = Monstros!
m.tut_jelly_cubes = Ten cuidado! M\u00e1s arriba te espera un grupo de salvajes cubos \
  gelatinosos. Cuando te acerques lo suficiente, apuntar\u00e1s autom\u00e1ticamente al que \
  tengas m\u00e1s cerca. Aparecer\u00e1n iluminados con una columna de luz.

t.tut_hearts = Ten un Coraz\u00f3n
m.tut_hearts = Rompe estos blocos para encontrar cora\u00e7\u00f5es. Los cora\u00e7\u00f5es te dan vida. No podr\u00e1\
  s recogerlos si no los necesitas.

t.tut_hearts_short = Sanar
m.tut_hearts_short = Si est\u00e1s herido, use cora\u00e7\u00f5es para sanarte!

t.tut_weapons = Cambiar de Armas
m.tut_weapons = Puedes circular entre tus armas equipadas con [[NEXT_WEAPON]]. Intenta equipar \
  tu pistola.

t.tut_weapons_short = Cambiando Armas
m.tut_weapons_short = Usa [[NEXT_WEAPON]] para circular por tus armas equipadas.

t.tut_explosive2 = Peligro: Explosivos!
m.tut_explosive2 = Cambia a tu Pistola usando [[NEXT_WEAPON]] y dispara a los Explosivos desde \
  una distancia segura.

t.tut_explosive = Bloques Explosivos
m.tut_explosive = Los blocos explosivos causar\u00e1n dano a todo lo que tengan a su \
  alrededor cuando exploten, incluy\u00e9ndote a ti. Act\u00edvalos desde una distancia \
  prudencial con tu pistola.

t.tut_chromalisks = Lagartijas Saltarinas!
m.tut_chromalisks = Esos chroma whelps  que ves a lo lejos pueden alcanzarte con la lengua. \
  Evita estar al alcance de su lengua cuando se preparen a atacar.

t.tut_switches = Botones Escondidos
m.tut_switches = Muchas veces las portas pueden abrirse si encuentras el interruptor adecuado. \
  Echa un vistazo, a veces est\u00e1n escondidos debajo de los blocos o los arbustos.

t.tut_shield = Escudo
m.tut_shield = Pressione y mant\u00e9n presionado [[DEFEND]] para bloquear ataques.

t.tut_dash = Carrera Evasiva
m.tut_dash = Evade el dano del ataque de los monstros pulsando [[DODGE]].

t.tut_bash = Golpe de Escudo
m.tut_bash = Cuando tu escudo est\u00e1 lleno, pulsa [[SHIELD_BASH]] para cargar contra \
  los monstros y aturdirlos!

t.tut_lever = Pr\u00e1ctica de Tiro
m.tut_lever = Frecuentemente las portas se pueden abrir encontrando el interruptor correcto. \
  Intenta dispararle al interruptor con tu pistola!

t.tut_lever_alt = Pr\u00e1ctica de Tiro
m.tut_lever_alt = Los interruptores pueden abrir las portas. Trata de lanzarle una olla \
  o dispararle con tu pistola!

t.tut_buttons = Botones Ocultos
m.tut_buttons = No todos los bot\u00f5es se encuentran a plena vista. Echa un vistazo \
  alrededor! Algunas veces se encuentran escondidos debajo de blocos.

t.tut_treasure = Bloques de Tesoro
m.tut_treasure = Es una sorte encontrar blocos de tesouro! Contienen monedas y objetos \u00fatiles.

t.tut_miniboss = Contin\u00faa!
m.tut_miniboss = Casi has llegado al Acampamento de Resgate. Cruza la barrera de fuerza \
  que hay m\u00e1s adiante!

t.tut_victory = Victoria!
m.tut_victory = Lo has logrado! Avanza para entrar al Acampamento de Resgate.

#t.tut_golddoor = Find a Gold Key
#m.tut_golddoor = This door needs a key to open it.  Look for a key icon on your mini-map in the \
#top right corner of the screen.
t.tut_golddoor = Puerta Dorada
m.tut_golddoor = Encuentra una Gold Key para abrir esta porta!

#t.tut_goldkey = Gold Keys
#m.tut_goldkey = Pick up Gold Keys and use them to open Gold Doors.
m.tut_goldkey = Rec\u00f3gela y \u00fasala para usarla en las Puertas Doradas!

t.tut_ghost = Bloques Fantasma
m.tut_ghost = Los blocos fantasma destruir\u00e1n cualquier bloco que est\u00e9 conectado a ellos, a\u00fa\
  n si son blocos irrompibles!

m.tut_pot_short = Rec\u00f3gela y t\u00edrala!

m.tut_target = Golp\u00e9alo para continuar!

t.tut_charge = Ataques Cargados
m.tut_charge = Mant\u00e9n pulsado [[?ACTION]] hasta que est\u00e9 completamente cargado y su\u00e9\
  ltalo para liberar el ataque!

t.tut_important_object = Objeto Misterioso
m.tut_important_object = Levantar para continuar!

t.statue_secret = Estatuas Pesadas
m.statue_secret = Las estatuas pesadas se pueden levantar y posicionar en bot\u00f5es de presi\u00f3n \
  para revelar segredos y tesouros!

## Training Grounds Lobby
#...................................................................................................

m.tglobby_vitapod = Los vitapods aumentan temporalmente tu vida m\u00e1xima hasta que regresas \
  al pueblo.

t.tglobby_equip = Esta\u00e7\u00f5es de Arsenal
m.tglobby_equip = Para cambiar tu armamento, use las Esta\u00e7\u00f5es de Arsenal dentro de los \
  Mecanismos.

## Advanced Training
#...................................................................................................

t.tg_welcome = Bem-vindo!
m.tg_welcome = Bem-vindo al Acampamento de Resgate, recruta. En esta ruinosa zona de los \
  Mecanismos encontrar\u00e1s \u00e1reas que hemos construido para que te entrenes en el arte \
  de la lucha y no sufras una horr\u00edvel muerte. Presta mucha atenci\u00f3n a nuestros consejos, \
  prepara tu arma y ponte en marcha!

t.tg_doors = \u00c1brete S\u00e9samo!
m.tg_doors = Las portas se pueden abrir de muchas maneras diferentes.

t.tg_pots = Levantar Objetos
m.tg_pots = Algunos objetos se pueden levantar para usarse o a\u00fan para tirarlos a trav\u00e9s de la habitaci\u00f3\
  n. Intenta tirar una vasija a ese interruptor.

t.tg_heat = Qu\u00e9 es el Fuego?
m.tg_heat = Recolectar Brasas de Fuego mejorar\u00e1 tu armamento cuando llegues a un elevador.
t.tg_heat_short = Fuego
m.tg_heat_short = Re\u00fane brasas de fogo para nivelar tu equipamento!

t.tg_shield = Usa tu Escudo
m.tg_shield = Pressione [[DEFEND]] para levantar tu escudo y bloquear ataques.

t.tg_end = Victoria!
m.tg_end = Hey, lo lograste! Es excelente, de verdad. Me acabas de salvar de tener que \
  hacer mucho papeleo, as\u00ed que gracias por eso. Espero que esos Retrodes no hayan sido \
  demasiado. Enf\u00edlate al elevador y podremos marcar esta expedici\u00f3n como completada.

## Training Grounds 1
#...................................................................................................

t.tg1_welcome = Bem-vindo!
m.tg1_welcome = Bem-vindo al Acampamento de Resgate, recruta. Hemos preparado esta ruinosa zona \
  de los Mecanismos para que te entrenes en el arte de la lucha y no sufras una horr\u00edvel \
  muerte. Presta mucha atenci\u00f3n a nuestros consejos, prepara tu arma y ponte en marcha.

t.tg1_barrier = Barreras de Fuerza
m.tg1_barrier = Si te sientes agobiado, use las barreras de fuerza como la que tienes a tu \
  derecha para tomarte un respiro. Los monstros y los proyectiles no podr\u00e1n pasar por ellas.

t.tg1_shield_1 = Usando tu Escudo
m.tg1_shield_1 = Pongamos una herramienta esencial fuera del camino en este momento- tu escudo. \
  Pressione [[DEFEND]] para defenderte con tu escudo. Mientras te defiendas podr\u00e1s resistir \
  completamente la mayor parte del dano. Los gun puppies en el siguiente pasillo no ser\u00e1\
  n un problema siempre y cuando te defiendas mientras avanzas.

t.tg1_shield_2 = Regeneraci\u00f3n del Escudo
m.tg1_shield_2 = Tu escudo absorber\u00e1 dano y pasar\u00e1 de verde a rojo hasta \
  finalmente romperse. Si se rompe no podr\u00e1s defenderte hasta que se regenere, as\u00ed que ten cuidado!

m.tg1_crowns = Crowns son la moeda de cambio de los Mecanismos. Puedes usarlos para comprar \
  todo tipo de cosas, como armas o una armadura. Cuando juegues con otros, todos los miembros \
  del grupo recibir\u00e1n Crowns cuando cualquiera de ellos los obtenga.

t.tg1_button = Botones Escondidos
m.tg1_button = Si un portal no se abre, busca alg\u00fan bot\u00e3o escondido en el suelo \
  debajo de los blocos.

t.tg1_heat = Niveles de fogo del armamento
m.tg1_heat = Habr\u00e1s visto que los monstros dejan un peque\u00f1o rastro de brasas tras de \
  s\u00ed. Estas brasas te dan fogo. Cuando el indicador de fogo se llene, la flama que est\u00e1 junto a tu vida crecer\u00e1\
  . Si logras salir de ese estrato sin morrer, el fogo se aplicar\u00e1 a tus armamento. Con el \
  tiempo, se equilibrar\u00e1n y ser\u00e1n m\u00e1s resistentes. Cuando juegues con otros, \
  todos los miembros del grupo recibir\u00e1n fogo cuando uno de ellos recoja alguna brasa.

t.tg1_overgrown_1 = Nos vemos en el otro lado
m.tg1_overgrown_1 = El resto de \u00e1reas las dejo de tu cuenta. Hay bastante maleza, as\u00ed \
  que ten cuidado con los monstros que surjan entre las hierbas. A algunos les gusta \
  especialmente esconderse entre las sombras. Me dan escalofr\u00edos solo de pensarlo...

t.tg1_overgrown_2 = Bem-vindo de regreso!
m.tg1_overgrown_2 = Parece que sabes apa\u00f1\u00e1rtelas por tu cuenta. Eso est\u00e1 muy \
  bien porque te espera ya la zona final.

t.tg1_partypad_1 = Bot\u00f3n de Grupo
m.tg1_partypad_1 = Entra en la siguiente habitaci\u00f3n usando el bot\u00e3o de grupo. Ya casi \
  terminas.

t.tg1_partypad_2 = P\u00edsame!
m.tg1_partypad_2 = Este es un bot\u00e3o de grupo. Es un bot\u00e3o enorme en el suelo que solo \
  se ativa cuando todos los miembros del equipamento lo est\u00e9n pisando. Suelen servir para \
  abrir portales, pero a veces ocultan algo m\u00e1s...

t.tg1_end = Victoria!
m.tg1_end = Eh, lo has logrado! Ha status genial, en serio. Me has ahorrado un mont\u00f3\
  n de papeleo, espero que esos Wolvers no te hayan dado muchos sobresaltos. Ahora ve al \
  elevador para marcar esta expedici\u00f3n como completada.


## Training Grounds 2
#...................................................................................................

t.tg2_welcome = Bem-vindo!
m.tg2_welcome = Bem-vindo de nuevo a los campos de entrenamiento. Este est\u00e1 dise\u00f1ado \
  para aprender a usar art\u00edculos especiales que encontrar\u00e1s por los Mecanismos \
  llamados 'recolectables'.

t.tg2_pickups = Qu\u00e9 son los recolectables?
m.tg2_pickups = Los recolectables son objetos que se guardan en tu cintur\u00f3n y que puedes \
  ver en la parte superior de la pantalla. No puedes sacarlos de los Mecanismos y se convertir\u00e1\
  n en polvo en cuanto llegues a cualquier cuidad. Piensa que son mejoras y objetos de bono que \
  puedes usar como quieras.

t.tg2_vials_1 = Viales
m.tg2_vials_1 = Los viales son un tipo de recolectable. Si los lanzas soltar\u00e1n unos agentes alqu\u00edmicos que crear\u00e1n una explosi\u00f3\
  n de elementos. Puedes probarlos en la siguiente sala.

t.tg2_vials_2 = Usando los viales
m.tg2_vials_2 = La siguiente sala te dar\u00e1 la oportunidad de probar los viales. Solamente \
  pulsa la tecla del n\u00famero correspondiente al recolectable en tu cintur\u00f3n (del 1 al \
  4) en la parte superior de la pantalla. Al hacer esto se cargar\u00e1 el vial. Pressione ATACAR \
  para lanzarlo.

t.tg2_vials_3 = Contin\u00faa...
m.tg2_vials_3 = Ahora que sabes c\u00f3mo se usan los recolectables, apliquemos lo aprendido en \
  un entorno de combate.

t.tg2_crystal = Bloques de Cristal
m.tg2_crystal = Los blocos de cristal son como los fr\u00e1giles pero cuando los destruyas \
  tambi\u00e9n desaparecer\u00e1n los blocos de cristal del mismo color que est\u00e9n en \
  conectados con ellos.

t.tg2_shield = Recuerda tu escudo
m.tg2_shield = M\u00e1s adiante tendr\u00e1s otra oportunidad de usar el escudo. Recuerda que \
  puedes defenderte con \u00e9l pulsando la tecla X.

t.tg2_end = Victoria!
m.tg2_end = Muy bien hecho! Si repasas de nuevo los campos de entrenamiento aprender\u00e1s todas las nociones b\u00e1sicas. Muy pronto podr\u00e1\
  s explorar las profundezas de los Mecanismos por tu cuenta.


## Training Grounds 3
#...................................................................................................

t.tg3_welcome = Bem-vindo!
m.tg3_welcome = Bem-vindo a los Campos de Entrenamiento. En este \u00faltimo nivel te ense\u00f1ar\u00e9 \
  los datos esenciales que te faltan para aventurarte en los Mecanismos. Ve a la rampa y \
  comencemos!

t.tg3_charge_1 = Poderes escondidos
m.tg3_charge_1 = Los caballeros Spiral Knights pueden liberar los poderes ocultos de las armas \
  gracias a los 'ataques cargados'. Estos ataques cargados son m\u00e1s poderosos que los \
  normales y suelen tener alguna consecuencia especial.

t.tg3_charge_2 = Ejecutando ataques cargados
m.tg3_charge_2 = Para lanzar un ataque cargado con una espada o una pistola, mant\u00e9n pulsado el bot\u00e3o ATACAR. Despu\u00e9\
  s de atacar, el arma empezar\u00e1 a cargarse. En cuanto llegue al m\u00e1ximo de carga, \
  suelta el bot\u00e3o ATACAR para desencadenar el ataque cargado.

t.tg3_charge_3 = Prep\u00e1rate para la batalla
m.tg3_charge_3 = Ahora que ya sabes c\u00f3mo lanzar un ataque cargado, lo aplicaremos a un \
  combate m\u00e1s avanzado. Carga tu arma y lanza el ataque en el momento justo en que \
  aparezca el enemigo. Buena sorte.

t.tg3_ghost = Bloques Fantasma
m.tg3_ghost = Los blocos fantasma destruir\u00e1n todos los blocos que est\u00e9n conectados a ellos, aunque sean irrompibles!

t.tg3_lift_1 = Levantar Objetos
m.tg3_lift_1 = Es hora de hacer m\u00fasculo! Podr\u00e1s levantar algunos de los objetos \
  que te encuentres para llevarlos o lanzarlos. Ac\u00e9rcate a esas vasijas de arcilla y pulsa \
  ATACAR cuando veas el icono de acci\u00f3n.

t.tg3_lift_2 = Aqu\u00ed va el discurso...
m.tg3_lift_2 = El siguiente portal est\u00e1 cerrado, pero puedes abrirlo con el interruptor de \
  la izquierda si lanzas una vasija. Son muy \u00fatiles si no tienes tu pistola a la mano.

m.tg3_goldkey = Las Gold Key son otro tipo de objeto que puedes recoger. Rec\u00f3gelas y \u00fa\
  salas en los portales dorados. Si encuentras un portal de este tipo en un nivel, habr\u00e1 \
  una Gold Key escondida en alg\u00fan sitio.

t.tg3_final = Reto Final
m.tg3_final = Solo te separa una sala del elevador. Recuerda lo que has aprendido hasta ahora y \
  no tendr\u00e1s problema... Al menos, en teor\u00eda. Procura no morirte, vale?

t.tg3_end = Victoria!
m.tg3_end = Parece que has entendido bien los aspectos b\u00e1sicos y ya est\u00e1s listo para \
  unirte al resto de reclutas en Sparrow Gate. All\u00ed aprender\u00e1s a trabajar en un \
  grupo. Muchos reclutas dependen de ti ahora. Bien hecho!

## Final Test
#...................................................................................................
t.final_test = El Reto Final
m.final_test = Has llegado muy lejos caballero, pero tu prueba final requiere que pienses r\u00e1pido y que te muevas a\u00fan m\u00e1s r\u00e1pido

t.pressure_pads = Botones de Presi\u00f3n
m.pressure_pads = Estos bot\u00f5es especiales s\u00f3lo se disparan si algo los mantiene \
  presionados. Intenta usar esa estatua para presionarlo.

## Advanced Training Gym
#...................................................................................................
t.atg_treasure = Cajas de Tesoro:
m.atg_treasure = Las cajas de tesouro VERDES contienen crowns y otros \u00fatiles art\u00edculos! \
  Las cajas de tesouro ROJAS son m\u00e1s raras que las cajas verdes y contienen mejores art\u00ed\
  culos!  Las cajas de CORAZ\u00d3N contienen cora\u00e7\u00f5es que restauran tu vida.

t.atg_healpad = Generadores de Corazones:
m.atg_healpad = P\u00e1rate sobre un GENERADOR DE CORAZONES para restaurar tu vida!

t.atg_healthcap = C\u00e1psulas de Vida:
m.atg_healthcap = Usa las C\u00c1PSULAS DE VIDA desde tu barra de acciones r\u00e1pidas para \
  subir tu vida.

m.atg_vitapods = Recolecta VITAPODS para incrementar temporalmente tu vida m\u00e1xima hasta tu \
  regreso a Haven.

m.atg_crowns = Las CROWNS son usadas para comprar art\u00edculos y pagar por otros servicios.

t.atg_heat = Fuego:
m.atg_heat = Recolecta FUEGO para nivelar tus art\u00edculos y hacerlos mejores con el \
  tiempo!

t.atg_vials = Viales:
m.atg_vials = Inflige una variedad de efectos de estatus a tus enemigos avent\u00e1ndoles VIALES!

t.atg_blocks = Bloques:
m.atg_blocks = P\u00e9gale a los blocos quebradizos para destruirlos!

t.atg_ublocks = Bloques Irrompibles:
m.atg_ublocks = Algunos blocos no se pueden destruir con ataques normales.

t.atg_gblocks = Bloques Fantasma:
m.atg_gblocks = Si le pegas a un BLOQUE FANTASMA puedes destruir una serie completa de blocos, \
  incluyendo los blocos irrompibles!

t.atg_eblocks = Bloques Explosivos:
m.atg_eblocks = Si son golpeados, los BLOQUES EXPLOSIVOS pueden causar dano a todo lo que \
  se encuentre cerca de ellos.

t.atg_teblocks = Bloques Explosivos con Cuenta Regresiva:
m.atg_teblocks = Los BLOQUES EXPLOSIVOS CON CUENTA REGRESIVA contar\u00e1n hasta 0 antes de \
  explotar y causar dano.

t.atg_blocks2 = Interacci\u00f3n de los Bloques:
m.atg_blocks2 = Los blocos pueden afectarse unos a otros!

t.atg_cblocks = Bloques de Cristal:
m.atg_cblocks = P\u00e9gale a un BLOQUE DE CRISTAL para destruir otros blocos de cristal del \
  mismo color.

t.atg_traps = Trampas:
m.atg_traps = Cuidado donde pisas! Espera hasta que bajen las TRAMPAS antes de caminar \
  sobre ellas.

t.atg_retraps = Cambio de Direcci\u00f3n de Trampas:
m.atg_retraps = Algunos interruptores pueden cambiar la direcci\u00f3n de la oleada de una \
  trampa. Ahora podr\u00e1s cruzar las trampas en ambas direcciones!

t.atg_togtraps = Apagar Trampas:
m.atg_togtraps = Algunas trampas siempre est\u00e1n activas. Encuentra un interruptor \
  para apagarlas!

t.atg_statustraps = Trampas de Condici\u00f3n:
m.atg_statustraps = Cuidado! Algunas trampas pueden causar dano e infligir efectos \
  de condici\u00f3n da\u00f1inos.

t.atg_shield = Usando tu Escudo:
m.atg_shield = Est\u00e1s rodeado? Usa tu ESCUDO para empujar a los enemigos que te \
  atacan.

t.atg_pots = Lanzar Objetos:
m.atg_pots = Algunos objetos como las jarras se pueden aventar a los interruptores y a \
  los enemigos!

t.atg_button = Botones y Puertas:
m.atg_button = Pararse en un BOT\u00d3N puede abrir portas cerradas.

t.atg_switch = Pegarle a un Interruptor:
m.atg_switch = El interruptor est\u00e1 fuera de tu alcance? Avienta una jarra o disp\u00e1rale con una pistola!

t.atg_togswitch = Accionar Interruptores:
m.atg_togswitch = Los interruptores pueden abrir y cerrar portas.

t.atg_pplate = Puertas y Estatuas:
m.atg_pplate = Levanta una estatua y col\u00f3cala sobre una PLACA DE PRESI\u00d3N para \
  mantener las portas abiertas.

t.atg_torto = Ten cuidado con el Tortodrone!
m.atg_torto = Los Tortodrones se pueden encontrar patrullando los Mecanismos. No te atacar\u00e1\
  n a menos que los ataquen primero - pero recuerda esta advertencia, una vez que  se han \
  enfurecido, son oponentes aterradores y mort\u00edferos.

t.atg_astation = Esta\u00e7\u00f5es de Arsenal
m.atg_astation = Las Esta\u00e7\u00f5es de Arsenal te permiten cambiar tu equipamento y tener acceso a \
  tus panoplias fuera de las zonas seguras como Terminales y Pueblos Subterr\u00e1neos!

## PvP - Lockdown
#...................................................................................................
t.lock_howto = C\u00f3mo Jugar:
m.lock_howto = * Hay m\u00faltiples Puntos de Control diseminados por el mapa\n\
  * Al capturar y mantener un Punto de Control aumenta el puntaje de tu equipamento\n\
  * Para capturar un Punto de Control, p\u00e1rate sobre este hasta que cambie al color de tu \
  equipamento\n\
  * El equipamento que tenga mayor puntaje al final de la partida ser\u00e1 el GANADOR!
m.lock_guard = Prot\u00e9gete y c\u00farate del dano a ti y tus compa\u00f1eros con \
  el Guardian Shield!\n\
  \n\
  Mant\u00e9n a los enemigos a raya con resistencias a dano incrementadas y ataca \
  con espadas y bombas m\u00e1s r\u00e1pidas!

m.lock_recon = Vu\u00e9lvete invisible y marca enemigos para que reciban m\u00e1s da\u00f1\
  o usando el Disruption Field!\n\
  \n\
  Mant\u00e9n a los enemigos en guardia con tiempo de carga de armas reducido  y pistolas \
  y bombas m\u00e1s r\u00e1pidas!

m.lock_striker = Deja atr\u00e1s a todos con el Striker Dash, golp\u00e9alos duro y despu\u00e9s d\u00e9jalos en el polvo!\n\
  \n\
  Convi\u00e9rtete en el repartidor de dano supremo  con un incremento general de \
  ataque y la espada mas r\u00e1pida!

