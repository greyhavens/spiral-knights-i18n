## CORE RESEARCH

# Vaelyn
#...................................................................................................

n.parmas_scout = Explorador de Parma

m.core_lead_1 = Ave C\u00e9sar! Soy el Teniente Vaelyn, comandante de la investigaci\u00f3\
 n del Core. Es claro que eres uno de los mais fuertes cavaleiros Spiral Knights que \
 alcanzan esas profundidades infernales, pero la fuerza por si misma no te llevar\u00e1 mais lejos.

r.core_lead_1 = Cu\u00e1l es la situaci\u00f3n, Teniente?

m.core_lead_2 = Estamos tratando de encontrar la manera de activar el n\u00facleo del Core por \
 medio del poder de los minerales que se encuentran en los Clockworks. Esos minerales son \
 capaces de transformar los Clockworks - hemos visto esto en la Arcada de Haven. Creemos que \
 podemos usar ese poder para activar el Core y... abrirlo de alguna manera.

r.core_lead_2 = Lo quieren abrir?

m.core_lead_3 = Si, el mismo Capit\u00e1n Ozlo nos ha ordenado esperar lo mais posible \
 hasta que aprendamos mais. Si alguna vez dejamos este planeta, ser\u00e1 gracias a su Core.\n \
 \n\
 Tengo la plena seguridad que adem\u00e1s de ser una potencial fuente de energia, el Core act\u00fa\
 a como el centro nervioso de todo lo que ves en los Clockworks. Se puede sentir en el poco \
 aire que hay all\u00e1 abajo: una salvaje y ominosa presencia que no es una simple m\u00e1quina.

r.core_lead_3 = Est\u00e1s diciendo que est\u00e1... viva?

m.core_lead_4 = Estoy diciendo que sabemos que este mundo no es natural, y yo no creo que estas \
 hordas de miserables Gremlins, sin importar que trabajadores sean, hayan creado este mundo en \
 su totalidad. Debieron tener ayuda de algo mais all\u00e1 de sus medidas y probablemente \
 lo que se encuentra en el n\u00facleo del Core.\n\
 \n\
 Lo mismo aplica al Escuadr\u00f3n Alpha. Ellos no iban a desaparecer, a\u00fan dentro del las \
 profundidades de los Clockworks. Ellos eran los mejores entre nosotros, el Core mismo los \
 absorbi\u00f3

r.core_lead_4 = Pero yo pensaba que no hab\u00eda manera de entrar en el?

m.core_lead_5 = N\u00e3o se como, pero ellos debieron encontrar la manera. Seguramente lo \
 hicieron... y ahora se han ido.

r.core_lead_5 = Terminar conversaci\u00f3n.


