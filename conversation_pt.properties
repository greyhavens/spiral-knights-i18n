 este Lab, mucho menos para hacer funcionar nuestra nave.\n\
 \n\
 Necesitamos encontrar otra fuente de poder si queremos la esperanza de regresar a casa.

m.lab_knight4_1a = Los equipos de reconocimiento han recobrado unas cosas extra\u00f1as y \
 extraordinarias de los Clockworks.

m.lab_knight5_1a = {0}, has visto alguna vez en tus viajes estos minerales? Son fascinantes! Deber\u00ed\
 as preguntarle al Cavaleiro Geo en Jefe Wegner acerca de ellos. Escuch\u00e9 que es un \
