m.lab_knight1_1a = Rescatamos lo que pudimos del Alondra y juntamos el resto con la ayuda de \
 los Strangers.
r.lab_knight1_1a = Terminar conversaci\u00f3n

m.lab_knight2_1a = Las emanaciones del n\u00facleo de este mundo han tenido un efecto extra\u00f1\
 o en nuestros sprites de batalla.

m.lab_knight3_1a = Nos las arreglamos para rescatar casi intacto el generador secundario del \
