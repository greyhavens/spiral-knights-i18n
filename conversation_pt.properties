m.mon_pocket_1 = Saludos! Soy Nonna de la Agencia de Adopci\u00f3n de Emberlight. \n\
 \n\
 En la Agencia de Adopci\u00f3n de Emberlight recogemos peque\u00f1os monstros que se han \
 perdido en las profundas oscuridades de los Clockworks. Ya que no tienen un hogar ni manera \
 de cuidarse solos, tratamos de buscar un buen hogar para estos necesitados monstros! \n\
 \n\
 Al comprar uno de estos adorables 'monstros de bolsillo', puedes llevar contigo tu propio monstruo beb\u00e9! \n\
 \n\
 La Agencia de Adopci\u00f3n de Emberlight visitar\u00e1 Haven de tiempo en tiempo, y \
 nunca se sabe lo que tendremos para ofrecer!

r.mon_pocket_1 = Mu\u00e9strame quienes est\u00e1n para adopci\u00f3n!
r.mon_pocket_2 = Gracias Nonna, tal vez para la pr\u00f3xima.


