#...................................................................................................

n.tier_guard = Guardi\u00e3o Spiral

m.tier_1_requirements = Tanto gusto, {0}. Para poder continuar y explorar a mayores \
 profundidades en los Clockworks, primero debes alcanzar el Rango 4-2.\n\
 \n\
 Regresa aqu\u00ed cuando hayas completado la Misi\u00f3n de Rango requerida.

m.tier_2_requirements = Tanto gusto, {0}. Para poder continuar y explorar a mayores \
 profundidades en los Clockworks, primero debes alcanzar el Rango 7-1.\n\
