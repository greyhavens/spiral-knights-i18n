m.dark_harvest_exp = Bem-vindo al Festival de la Cosecha Oscura!\n\
 Esta celebraci\u00f3n anual honra a los muertos vivientes con m\u00e1scaras festivas, \
 deliciosas golosinas y peligrosos trucos! \n\
 \n\
 Para participar, explora los Clockworks e intenta encontrar al legendario 'Punkin King'. Esta \
 macabra calabaza regala dulces a los visitantes, puedes cambiar los dulces por m\u00e1\
 scaras de monstros con los mercaderes aqu\u00ed en la Plaza de Haven! \n\
 \n\
