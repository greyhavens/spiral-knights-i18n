# Greeter
#...................................................................................................


m.atg_greeter_1a = Bem-vindo a nuestro sal\u00f3n de entrenamiento avanzado, Aqu\u00ed encontrar\u00e1s \u00fa\
 tiles consejos de supervivencia que te ayudar\u00e1n en tu viaje por los Clockworks.\n\
 \n\
 Quieres recibir alguna orientaci\u00f3n?

r.atg_greeter_1a = Seguro, por d\u00f3nde empiezo?

r.atg_greeter_1b = N\u00e3o, obrigado. Prefiero explorar el lugar por mi mismo.

m.atg_greeter_2a = Hacia el oeste, aprender\u00e1s acerca de los \u00fatiles items que \
 se encuentran en los Clockworks. Hacia el norte, aprender\u00e1s sobre una gran variedad de \
 tipos de bloques y puertas. Hacia el este, encontrar\u00e1s una selecci\u00f3n de trampas y \
 peligros, as\u00ed como un cuarto de combate para practicar la defensa contra cubos de \
 entrenamiento. N\u00e3o te preocupes, hemos tomado precauciones para asegurarnos que estos \
 cubos sean inofensivos!

r.atg_greeter_2a = Gracias! Ahora me voy a explorar.

## HAVEN KNIGHTS

# Fountain
#...................................................................................................


m.fountain_1 = Saludos y bienvenido a Haven! Si te enfilas al norte, encontrar\u00e1s la \
 Arcada donde te puedes poner al corriente acerca de los detalles de tu miss\u00e3o. Si te \
 enfilas al oeste, llegar\u00e1s al bazar, donde los Strangers tienen una buena selecci\u00f3n \
 de armamento y equipe a la venta. Revisa sus existencias diariamente, ya que cambian!

r.fountain_1 = Gracias por la informaci\u00f3n, me voy a explorar!

# Gym Signpost
#...................................................................................................


m.atg_guard = Saludos! M\u00e1s all\u00e1 de esta puerta encontrar\u00e1s el sal\u00f3n \
 de entrenamiento avanzado. Como cavaleiro Spiral Knights, tienes completa libertad de usarlo \
 para practicar tus habilidades y aprender mais de los Clockworks.

r.atg_guard = Gracias! Ir\u00e9 a ver lo que hay dentro.


# Arcade Leader
#...................................................................................................


m.arc_leader_1 = Gusto en conocerte soldado y felicidades por llegar al campamento base aqu\u00ed \
 en Haven. Soy el Teniente Feron y he sido asignado por el Capit\u00e1n Ozlo para supervisar \
 la operaci\u00f3n de miner\u00eda en los Clockworks. \n\
 \n\
 Frente a ti se encuentra la 'Arcada', un fascinante complejo que sirve como nuestro enlace al \
 coraz\u00f3n de los Clockworks. En vista de que eres nuevo por aqu\u00ed, te dar\u00e9 un \
 breve resumen de lo que el Cuartel General Spiral nos tiene haciendo aqu\u00ed.

r.arc_leader_1 = Suena muy importante, dime como funciona todo esto.

m.arc_leader_2 = Despu\u00e9s de que el Alondra se estrellara, su principal fuente de Tearium \
 explot\u00f3 destruyendo una parte de la nave y dej\u00e1ndola sin su fuente de poder \
 principal. Ya que desde entonces no hemos podido encontrar los cientos de toneladas de \
 Tearium necesarias, podemos decir que esa ave ha perdido sus alas.\n\
 \n\
 Con la ayuda de los Strangers, hemos podido establecer una peque\u00f1a base de operaciones \
 aqu\u00ed en Haven. Una vez que pusimos nuestros sistemas en l\u00ednea, descubrimos que \
 dentro del coraz\u00f3n de esta roca resuena una se\u00f1al de poder de magnitud sin \
 precedente.

r.arc_leader_2 = Si pudi\u00e9ramos aprovechar ese poder...

m.arc_leader_3 = Exactamente! El n\u00facleo del Core de los Clockworks bien pudiera \
 contener la fuente de energia que necesitamos para crear una nueva fuente de poder para \
 el Alondra y restaurarlo a su condici\u00f3n operacional. Solamente hay un problema, los \
 mismos Clockworks parecen estar construidos sobre una loca trampa mortal. \n\
 \n\
 Llegar al Core no va a ser sencillo...

r.arc_leader_3 = Yo puedo hacerlo!

m.arc_leader_4 = Esa es la actitud que me gusta ver! Funciona de esta manera: usa los \
 portales que est\u00e1n adelante para explorar los Clockworks y as\u00ed recuperar minerales \
 especiales. Despu\u00e9s deposita esos minerales en outros portales para cambiar los \
 Clockworks en los niveles mais abajo y as\u00ed crear nuevos e inexplorados estratos.\n\
 \n\
 Los minerales son la clave para abrir el camino al Core s\u00f3lo necesitamos averiguar \
 como usarlos!

r.arc_leader_4 = Entiendo mi miss\u00e3o.

m.arc_leader_5 = Has probado que est\u00e1s listo para la batalla y tengo confianza de que \
 servir\u00e1s a la Spiral Order con valent\u00eda. Los portales que llevan a los Clockworks \
 est\u00e1n adelante. \n\
 \n\
 Te deseo buena suerte!

r.arc_leader_5 = Terminar Conversaci\u00f3n
r.arc_leader_5_accept = Llegar a la primer terminal de los Clockworks? Seguro!


# Wegner Basic
#...................................................................................................


m.arc_mintut_1 = Hola, soy Wegner, Cavaleiro Geo en Jefe del Alondra y responsable de los \
 estudios geol\u00f3gicos en los Clockworks

r.arc_mintut_1 = Estoy aqu\u00ed para aprender acerca de los minerales que se encuentran en los \
 Clockworks.

# IMAGE: step1_minerals.png
m.arc_mintut_2 = Durante tus viajes a los Clockworks encontrar\u00e1s cinco minerales \
 especiales: crimsonite, moonstone, valestone, luminite y dark matter.

r.arc_mintut_2 = Continuar

# IMAGE: step2_gather.png
m.arc_mintut_3 = Encontrar\u00e1s dep\u00f3sitos de minerales en todos los niveles de los \
 Clockworks y deber\u00e1s atacarlos para poder romperlos a un tama\u00f1o que sea posible \
 cargarlos. Solo puedes cargar uno a la vez, pero los puedes cambiar si recoges otro. Busca el \
 mais grande y brillante que puedas encontrar. Son los mais valiosos.

r.arc_mintut_3 = Continuar

m.arc_mintut_4 = Una vez que hayas llegado sano y salvo al elevador, el mineral que est\u00e9s \
 cargando se deposita en tu arsenal para que lo uses despu\u00e9s. Todos los que est\u00e9n en \
 tu grupo reciben los minerales de los dem\u00e1s, as\u00ed que no hay necesidad de \
 pelear acerca de qui\u00e9n obtiene el mejor!

r.arc_mintut_4 = Continuar

m.arc_mintut_5 = Los minerales se usan para crear comida para los sprites en el Laboratorio. La \
 comida para sprites es muy importante para el desarrollo de tu sprite, as\u00ed que \
 recoge esos minerales cuando los veas!

r.arc_mintut_5 = Continuar

m.arc_mintut_6 = Nuestra investigaci\u00f3n geol\u00f3gica est\u00e1 en curso, as\u00ed que es \
 posible que en el futuro haya outros usos fascinantes para estos extra\u00f1os y poderosos \
 minerales.

r.arc_mintut_6 = Suena estupendo! Gracias por la informaci\u00f3n!

