m.biscotti_1 = Saludos, soy Biscotti, Chef en Jefe del Alondra! Tenemos una peque\u00f1a situaci\u00f3\
 n en nuestras manos que puede o no involucrar monstros sentientes, pasteles monstruosos que \
 pueden o no haber tomado el control de mi cocina e infestado los Clockworks...\n\
 \n\
 De cualquier manera, he hecho un trato con los Strangers para proveer recompensas a cambio de \
 rebanadas de pastel que prueban que has erradicado estos horribles monstros que pueden o no \
 existir.

r.biscotti_1 = Todo esto suena muy estranho, pero estoy mais que dispuesto a ayudar en \
 lo que pueda.

m.biscotti_2 = Excelente! Existen dos maneras en las que me puedes ayudar:\n\
 \n\
 Puedes aceptar la nueva Misi\u00f3n de Prestigio 'Tart\u00e1strofe Total', la cual est\u00e1 disponible diariamente.\n\
 \n\
