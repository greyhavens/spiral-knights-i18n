# Royal Jelly
m.lab_progress_6 = Ese palacio gelatinoso... que lugar tan estranho. Adem\u00e1s, me \
 pregunto que era ese estranho artefacto que encontraste en el palacio? N\u00e3o parec\u00eda \
 haber sido hecho por los jellies.

m.lab_progress_7 = En algunas muy raras ocasiones he encontrado gelatinosos que no nos han \
 atacado al momento. Ahora le estoy quitando las p\u00faas a este. Son algo lindos \
 cuando no est\u00e1n tratando de atravesarte!

# Roarmulus
m.lab_progress_8 = Este gremlin viene de la colonia en Emberlight, en lo profundo de los \
 Clockworks. Son un grupo de marginados que desafiaron al Rey Tinkinzar y la Orden Crimson. \
 Esperamos poder hacer un tratado con ellos que nos permita usar su colonia como base de \
 operaciones para nuestras miss\u00f5es en las profundidades subterr\u00e1neas.

m.emberlight_visitor_1a = Los gremlins de Emberlight te agradecen que hayas detenido esta \
 amenaza.

r.emberlight_visitor_1a = Continuar

m.emberlight_visitor_2a = Pero he venido a advertirles! La Orden Crimson no detendr\u00e1 \
 con el Proyecto Roarmulus. La Orden Crimson desesperada por destruir todos los enemigos. \
 Altos, bajos y marginados. Todos enemigos de la Orden Crimson!

r.emberlight_visitor_2a = Gracias por la advertencia, Pakrat.

m.emberlight_visitor_3a = Puedo ayudarte en algo?
r.emberlight_visitor_3a = Cu\u00e9ntame acerca de Emberlight.
r.emberlight_visitor_3b = Por que el Rey Tinkinzar trata de destruir Haven?
r.emberlight_visitor_3c = Tengo suficiente informaci\u00f3n, gracias. (Terminar conversaci\u00f3n)

m.emberlight_visitor_4a = Emberlight fundada por gremlins marginados de Gran Colonia. Gremlins \
 de Emberlight no obedecen Ley de Hierro, huyen o mueren. Empezamos de nuevo en Emberlight. \
 Nueva colonia es hogar de algunos de nosotros, algunos mercaderes, algunos combatientes, \
 todos traidores a los ojos de gremlins de Gran Colonia.

r.emberlight_visitor_4a = Una pregunta mais, Pakrat.

m.emberlight_visitor_4b = Nadie sabe con seguridad. Tinkinzar no visto por muchos muchos a\u00f1\
 os. Orden Crimson lleva a cabo planes de Tinkinzar para Cradle. Emberlight deteriora plan \
 maestro porque construida por marginados. Haven probablemente igual, no fundada por por \
 gremlins. N\u00e3o parte del plan!

# Vanaduke
m.lab_progress_9 = Otro estranho artefacto! Este claramente no fue hecho por los \
 Almirians tanto como el artefacto anterior fue hecho por gelatinosos. Sin embargo, una cosa \
 que hemos notado: este artefacto todav\u00eda est\u00e1 activo. Adem\u00e1s de esto, la firma \
 de energia es similar a las lecturas que tomamos del Artefacto antes de que fuera \
 robado. Pienso que esto requiere mais investigaci\u00f3n.

m.almire_historian_1a = Hemos recuperado lo poco que queda en los restos de la Mansi\u00f3n \
 Owlite referente al Reino de Almire. Combinado con los fragmentos que obtuvimos de los \
 sprites de la naturaleza dentro de la misma Ciudadela de Fuego, empezamos a tener un panorama \
 mais claro de la historia de Almire.

r.almire_historian_1a = Qu\u00e9 sabes de Almire?

m.almire_historian_2a = En los tomos que hemos recuperado, hemos descubierto que hace cientos \
 de a\u00f1os la Ciudadela de Fuego fue parte de un reino mucho mais grande conocido como \
 Almire. Aunque estaba rodeada por otras naciones agresivas, Almire era reconocida por el \
 poder\u00edo marcial de sus muchas legiones. Estas legiones mantuvieron el reino a salvo por \
 muchos a\u00f1os. Pero ay, no fueron suficiente.

r.almire_historian_2a = Qu\u00e9 pas\u00f3 con el resto del reino?

m.almire_historian_3a = Pues bien, ahora sabemos que hab\u00eda enormes ciudadelas albergando \
 las fuerzas armadas de Almire y grandes fincas para sus nobles casas. Debe haber sido algo \
 digno de verse. Suponemos que el resto del reino todav\u00eda son unas ruinas ardientes en \
 alg\u00fan lugar. Es posible que algunos de ellos hayan sobrevivido... aunque basados en la \
 evidencia anecd\u00f3tica pensamos que es poco probable.

# Biscotti, Lab Pre-Selection
#...................................................................................................

m.lab_biscotti_1a = Saludos! Soy Biscotti, Chef en Jefe del Alondra! Todav\u00eda \
 estoy calibrando la alquimia del alimento de sprites de batalla, as\u00ed que habla conmigo despu\u00e9s.

r.lab_biscotti_1a = Los sprites de batalla comen?

m.lab_biscotti_2a = Ciertamente! Un sprite de batalla puede sintetizar materia y \
 convertirla en energia utilizable.\n\
 \n\
 Esta m\u00e1quina puede tomar ciertos materiales y usar la alquimia para convertirlos en \
 alimento especial para sprite de batalla... esto es, una vez que est\u00e9 calibrado.

r.lab_biscotti_2a = Hablar\u00e9 contigo despu\u00e9s, gracias.

# Biscotti, Lab Post-Selection
#...................................................................................................
m.lab_biscotti_3a = Saludos, {0}! Como Chef en Jefe del Alondra, me han asignado para \
 supervisar el desarrollo nutricional de nuestros nuevos compa\u00f1eros sprite. Parece que \
 realmente se han diversificado all\u00e1 en los Clockworks. Ser\u00e1 interesante ver como se \
 desarrollan.\n\
 \n\
 Tienes alguna pregunta acerca de la alimentaci\u00f3n y cuidado de tu sprite?

m.lab_biscotti_3aa = Tienes alguna pregunta acerca de la alimentaci\u00f3n y cuidado de \
 tu sprite?

r.lab_biscotti_3a = Como alimento a mi sprite de batalla?
r.lab_biscotti_3b = Cu\u00e9ntame acerca de su apetito.
r.lab_biscotti_3c = Cu\u00e9ntame acerca de sus items favoritos.
r.lab_biscotti_3d = Cu\u00e9ntame acerca de los items requeridos.
r.lab_biscotti_3e = Nada por ahora, gracias.

m.lab_biscotti_4a = Alimentar a tu sprite de batalla es sencillo! Simplemente abre la \
 interfaz del sprite de batalla y selecciona el \u00edcono de tu sprite. Desde ah\u00ed puedes \
 seleccionar un material de tu arsenal y ponerlo en la charola de alimentaci\u00f3n.\n\
 \n\
 Una vez que hayas puesto un material para que tu sprite lo sintetice, simplemente haz clic en \
 'alimentar sprite' y buen provecho!

r.lab_biscotti_4a = Tengo otras preguntas.
r.lab_biscotti_4aa = Eso es todo por ahora, gracias!

m.lab_biscotti_4b = Los sprites tienen un apetito preestablecido que limita la cantidad de \
 materiales que pueden comer en un cierto tiempo. Cuando alimentas a tu sprite con un \
 material, su apetito disminuye. Una vez que se ha mermado completamente, ya no podr\u00e1s alimentarlo.

r.lab_biscotti_4b = Como aumenta el apetito?

m.lab_biscotti_5b = El apetito de un sprite aumentar\u00e1 naturalmente con el tiempo, aunque \
 lo hace despacio. Para incrementar su apetito r\u00e1pidamente, ll\u00e9valo a una aventura \
 en los Clockworks. Absorber el fuego de los monstros es una buena manera de quemar \
 calor\u00edas!

m.lab_biscotti_4c = En cualquier momento, el sprite tendr\u00e1 un 'item favorito', un \
 material especial que es el que disfruta mais comer. Alimentar a tu sprite con uno de \
 ellos es un deleite y le otorga mucho fuego al sprite.

r.lab_biscotti_4c = D\u00f3nde puedo adquirir estos items?

m.lab_biscotti_5c = Los items favoritos se pueden transmutar usando la misma m\u00e1\
 quina de alquimia que est\u00e1 frente a ti. Todo lo que necesita es dos de cualquier materia \
 y algunos minerales de los Clockworks. F\u00e1cil!

m.lab_biscotti_4d = Los items requeridos aparecer\u00e1n una vez que tu sprite est\u00e9 \
 listo para nivelarse. Despu\u00e9s de que tu sprite haya consumido suficiente fuego, una \
 notificaci\u00f3n del 'item requerido' se mostrar\u00e1 arriba de la charola de \
 alimentaci\u00f3n. Se DEBE alimentar al sprite con este material para poder que avance mais.

r.lab_biscotti_4d = Continuar

m.lab_biscotti_5d = En la mayor\u00eda de los casos, este es un item favorito est\u00e1\
 ndar, pero cuando tu sprite est\u00e1 listo para evolucionar, requerir\u00e1 de un Evo Catalyst.

# Riley, Harness Merchant
#...................................................................................................
m.lab_harness_1a = Soy Riley, el asistente de Morlin. Estoy en el proceso de inventar una \
 manera de mejorar a\u00fan mais a nuestros sprites de batalla.\n\
 \n\
 Habla conmigo de nuevo despu\u00e9s, cuando hayas adquirido un sprite con el que hayas \
 formado un lazo permanente.

r.lab_harness_1a = Volver\u00e9 despu\u00e9s, gracias.

# Morlin, Sprite Tutorial
#...................................................................................................
m.sprite_tut_1a = Saludos, {0}. me imagino que tienes algunas preguntas acerca de los sprites \
 de batalla. Como te puedo ayudar?
m.sprite_tut_1aa = M\u00e1s preguntas acerca de los sprites de batalla? Como te puedo ayudar?

r.sprite_tut_1a = Como se nivelan y evolucionan los sprites de batalla?
r.sprite_tut_1b = Cu\u00e9ntame acerca de las habilidades de los sprites.
r.sprite_tut_1c = Qu\u00e9 son los arneses de los sprites?
r.sprite_tut_1d = Qu\u00e9 son las ventajas de los sprites?
r.sprite_tut_1e = Nada por ahora, gracias.

m.sprite_tut_2a = Los sprites de batalla se nivelan al adquirir fuego, de la misma manera que \
 tus armas y equipe. Pueden adquirir fuego de dos maneras: absorbi\u00e9ndolo mientras peleas \
 en los Clockworks y consumiendo materiales y sintetiz\u00e1ndolos en fuego.

r.sprite_tut_2a = Continuar

m.sprite_tut_3a = Alimentar a tu sprite con materiales es la manera mais r\u00e1pida de \
 nivelarlo. Habla con Biscotti aqu\u00ed en el Lab para mais informaci\u00f3n acerca de la \
 alimentaci\u00f3n de los sprites.

r.sprite_tut_3a = Y como evoluciona mi sprite?

m.sprite_tut_4a = Tu sprite evolucionar\u00e1 conforme lo niveles. En ciertos niveles clave, tu \
 sprite requerir\u00e1 que lo alimentes con un Evo Catalyst para poder nivelarlo mais. Una vez alimentado, el sprite cambiar\u00e1 su apariencia f\u00edsica!\n\
 \n\
 Ser\u00e1 muy interesante ver como estas extra\u00f1as y nuevas formas de sprites de batalla \
 evolucionan con el tiempo.

r.sprite_tut_4a = Tengo otras preguntas.
r.sprite_tut_4aa = Eso es todo por ahora, gracias!

m.sprite_tut_2b = Conforme un sprite se nivela, aprender\u00e1n nuevas habilidades de combate y \
 adem\u00e1s ganar\u00e1n puntos de habilidad.

r.sprite_tut_2b = Continuar

m.sprite_tut_3b = Cada sprite de batalla aprender\u00e1 tres habilidades que puede usar en \
 combate. Las habilidades se aprenden autom\u00e1ticamente en ciertos niveles conforme el \
 sprite se nivela.\n\
 \n\
 Las habilidades de combate se hacen mais fuertes con los puntos de habilidad.

r.sprite_tut_3b = Continuar

m.sprite_tut_4b = Los puntos de habilidad se ganan regularmente conforme el sprite se nivela. \
 Se pueden aplicar a las habilidades en la interfaz del sprite de batalla.\n\
 \n\
 Cuando se aplique un punto de habilidad, debes escoger un aumentador para incrementar, tal \
 como la reducci\u00f3n del tiempo de espera o el da\u00f1o total.

r.sprite_tut_4b = Continuar

m.sprite_tut_5b = Y no te preocupes de aplicar los puntos de habilidad 'de la manera \
 equivocada', ya que eventualmente ganar\u00e1s suficientes puntos de habilidad para llevar \
 todas las habilidades al m\u00e1ximo!

r.sprite_tut_5b = Continuar

m.sprite_tut_6b = Una vez que hayas aplicado todos tus puntos de habilidad y que hayas logrado \
 un nivel muy alto con tu sprite, empezar\u00e1s a seleccionar tus 'habilidades m\u00e1ximas'. \
 Las habilidades m\u00e1ximas son versiones mejoradas de las habilidades de tu sprite. Cada \
 habilidad de sprite tiene dos opciones para una habilidad m\u00e1xima.

r.sprite_tut_6b = Continuar

m.sprite_tut_7b = S\u00f3lo puedes seleccionar una habilidad m\u00e1xima por cada habilidad de \
 sprite, as\u00ed que elige sabiamente! Tambien toma nota que seleccionar habilidades m\u00e1ximas cambiar\u00e1 a\u00fan m\u00e1\
 s la apariencia de tu sprite.\n\
 \n\
 Con todas estas opciones, tu sprite con nivel m\u00e1ximo seguramente se ver\u00e1 y se comportar\u00e1 \
 de manera diferente a la del resto!

r.sprite_tut_7b = Tengo otras preguntas.
r.sprite_tut_7bb = Eso es todo por ahora, gracias!

m.sprite_tut_2c = Todos los sprites de batalla visten un arn\u00e9s mec\u00e1nico que alinea \
 sus habilidades con un tipo de da\u00f1o. Sin embargo, no todos los sprites pueden vestir \
 todos los arneses. Por ejemplo, un drakon no puede infligir da\u00f1o de perforaci\u00f3n.\n\
 \n\
 De manera predeterminada, tienes un iron harness que cualquier sprite puede equipar. Si \
 deseas expandirte como tal vez lo hagas con tus armas y tu equipe, necesitar\u00e1s comprar \
 arneses nuevos.

r.sprite_tut_2c = D\u00f3nde puedo comprar mais arneses?

m.sprite_tut_3c = Ve con Riley aqu\u00ed en el Lab para comprar arneses nuevos. Una vez que lo \
 hayas comprado, el arn\u00e9s se a\u00f1ade autom\u00e1ticamente a tu lista de arneses en la \
 interfaz del sprite de batalla.\n\
 \n\
 Adem\u00e1s, cada vez que compras una mejora directa para un arn\u00e9s que poseas, esta ser\u00e1 reemplazada por el arn\u00e9s superior.

r.sprite_tut_3c = Continuar

m.sprite_tut_4c = Las mejoras de arn\u00e9s definitivamente valen las coronas. Las versiones \
 superiores de cada arn\u00e9s reducen el tiempo de espera de las habilidades de \
 combate!

r.sprite_tut_4c = Tengo otras preguntas.
r.sprite_tut_4cc = Eso es todo por ahora, gracias!

m.sprite_tut_2d = Los sprites de batalla obtienen ventajas en ciertos niveles que puedes \
 equipar en la interfaz del sprite de batalla. Las ventajas otorgan bonos a tus niveles.

r.sprite_tut_2d = Continuar

m.sprite_tut_3d = Las ventajas se desbloquean al azar. Algunas ventajas son mais poco \
 comunes que otras y requieren que un sprite se nivele muy alto para desbloquearlas todas.\n\
 \n\
 Tambi\u00e9n puedes obtener ventajas despu\u00e9s de alcanzar el nivel 100!

r.sprite_tut_3d = Tengo otras preguntas.
r.sprite_tut_3dd = Eso es todo por ahora, gracias!

