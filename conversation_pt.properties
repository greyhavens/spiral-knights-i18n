# Warnel
#...................................................................................................


m.hav_snipes_1a = Por favor ten cuidado de no pisar a ning\u00fan Snipe, peque\u00f1o.

r.hav_snipes_1a = Snipes?

m.hav_snipes_2a = Los Snipes son unos pajaritos gr\u00e1ciles y adorables de complexi\u00f3n \
 bastante corpulenta que revolotean por Haven. La gente cree que son las criaturas mais \
 bellas de la galaxia, pero ellos nunca lo dicen porque son muy modestos.

r.hav_snipes_2a = Terminar conversaci\u00f3n.


# Plinkop
#...................................................................................................


m.hav_clock_1a = Hola, peque\u00f1o. Tienes pinta de necesitar informaci\u00f3n sobre alguna cosa.

r.hav_clock_1a = Dime lo que sabes acerca de los Clockworks

r.hav_clock_1b = Nada por el momento, gracias.

m.hav_clock_2a = Compartir\u00e9 mis conocimientos contigo, peque\u00f1o.

r.hav_clock_2a = Desde cu\u00e1ndo existen los Clockworks?

r.hav_clock_2b = Como se crearon los Clockworks?

r.hav_clock_2c = Qu\u00e9 hay en el Core, el n\u00facleo de los Clockworks?

r.hav_clock_2d = Pens\u00e1ndolo bien, tengo muchas aventuras por hacer... Adi\u00f3s!

m.hav_clock_3a = N\u00e3o es f\u00e1cil saberlo exactamente ya que mucho de lo que hay dentro tiene \
 su origen en outros mundos. Algunos parecen tener su origen en reinos muy antiguos donde sin \
 duda viv\u00edan innumerables dioses y criaturas. \n\
 \n\
 Este mundo no es natural. Lo que ves dentro de el nunca estuvo predestinado a existir. Las \
 grandes historias de tantos mundos mezcl\u00e1ndose incesantemente por los engranajes de esta \
 gran m\u00e1quina... Me parece una pena.

m.hav_clock_3b = Hay muchas teor\u00edas. Algunos dicen que fue cosa de los Gremlins que ves \
 trabajando por all\u00ed, pero el proyecto parece demasiado grande para ellos a pesar de su \
 incre\u00edble capacidad de trabajo. Y aunque tuvieran los medios para hacerlo... Como empezaron? De d\u00f3\
 nde sacaron toda la energia?

m.hav_clock_3c = Hay una incre\u00edble fuente de energia, peque\u00f1o. Del centro de los \
 Clockworks llega una enorme se\u00f1al, pero no sabemos mais. Nadie ha logrado llegar al \
 Core... Bueno, si alguien lo ha logrado, no ha vuelto nunca. \n\
 \n\
 Habr\u00eda que preguntarles a los Gremlins; ninguna otra criatura ha llegado mais lejos \
 que ellos. Pero es dif\u00edcil hacerlo porque son bastante desagradables.

r.hav_clock_3a = Tengo otra pregunta.

r.hav_clock_3b = Gracias por la informaci\u00f3n, grandull\u00f3n. Nos vemos.


# Bootshuze
#...................................................................................................


m.hav_grem_1a = Hola, peque\u00f1o. Tienes pinta de necesitar informaci\u00f3n.

r.hav_grem_1a = Dime lo que sabes acerca de los Gremlins

r.hav_grem_1b = Nada por el momento, gracias.

m.hav_grem_2a = Mis conocimientos ser\u00e1n tuyos, peque\u00f1o.

r.hav_grem_2a = Exactamente que son los Gremlins?

r.hav_grem_2b = Los Gremlins tienen un l\u00edder?

r.hav_grem_2c = Hay alg\u00fan Gremlin amistoso en los Clockworks?

r.hav_grem_2d = Bueno, tengo que irme. Ya hablamos en otro momento...

m.hav_grem_3a = Los Gremlins son una raza de criaturas con una habilidad incre\u00edble para \
 crear y desmantelar todo tipo de maquinaria. Son una legi\u00f3n de creadores magn\u00edficos, pero tambi\u00e9\
 n tienen un poder de destrucci\u00f3n tremendo.

m.hav_grem_3b = Todos los Gremlins de la colonia son s\u00fabditos del rey Tinkinzar. Dicen que \
 es un buen gobernante y un genio de la mec\u00e1nica, el responsable del concepto de los \
 Clockworks. Por lo que sabemos, los Gremlins comunes no han visto al rey jam\u00e1s; los \
 Gremlins de la Orden Crimson son quienes se encargan de proclamar y cumplir sus \u00f3rdenes. \
 Son un grupo de Gremlins temibles y muy trabajadores y apenas ellos pueden reunirse con el gran \
 rey.

m.hav_grem_3c = La mayor\u00eda te atacar\u00e1n en cuanto te vean, excepto algunos marginados \
 de la colonia que se refugian en las ciudades subterr\u00e1neas. Su vida no es nada f\u00e1\
 cil porque los suyos los odian y no tienen hogar.

r.hav_grem_3a = Tengo otra pregunta.

r.hav_grem_3b = Gracias por la informaci\u00f3n, grandull\u00f3n. Nos vemos.



