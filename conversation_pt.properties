m.lab_knight6_1a = N\u00e3o vamos a correr ning\u00fan riesgo con este artefacto que encontraste, \
 {0}. Alg\u00fan d\u00eda los gremlins podr\u00edan regresar por el. Debes estar en guardia!

m.lab_knight7_1a = Las lecturas iniciales estaban fuera de los l\u00edmites, {0}! Nunca hab\u00ed\
 amos encontrado algo como esto antes. Llevar\u00e1 alg\u00fan tiempo entender completamente \
