r.monster_codex = Cerrar C\u00f3dice

n.monster_codex_trojan = C\u00f3dice Monstruoso:
m.monster_codex_trojan = Trojano\n\
 Estos masivos leviatanes son invulnerables por el frente. Golpea el cristal en su espalda \
 para hacerlos claudicar.
# IMAGE: codex_trojan.png

n.monster_codex_zombie = C\u00f3dice Monstruoso:
m.monster_codex_zombie = Zombis\n\
 Los zombis renqueantes se levantaran de entre los muertos si son eliminados cerca de un T\u00f3tem Macabro. Al\u00e9\
 jalos de ellos para que puedas otorgarles descanso eterno.
# IMAGE: codex_zombie.png

n.monster_codex_devilites = C\u00f3dice Monstruoso:
m.monster_codex_devilites = Devilite\n\
 Los Devilites son la fuerza de trabajo del inframundo. Si un Supervisor General atrapa a un \
 Devilite holgazaneando lo puede promover a un enojado Trabajador de Sobretiempo o a un d\u00f3cil Adulador.
# IMAGE: codex_devilites.png

n.monster_codex_snarbolax = C\u00f3dice Monstruoso:
m.monster_codex_snarbolax = Snarbolax\n\
 El m\u00edtico Snarbolax es inmune a los ataques de los cavaleiros. Hacer sonar la Campana de \
 la Bestia cuando est\u00e1 cerca, aturdir\u00e1 a la bestia para someterla.
# IMAGE: codex_snarbolax.png

n.monster_codex_royal_jelly = C\u00f3dice Monstruoso:
m.monster_codex_royal_jelly = Jelly Real\n\
 Este masivo cubo gelatinoso tiene mal genio y le gusta hacerse el pesado. Cuando sus \
 catadores de comida reales est\u00e1n ausentes, un postre envenenado le causar\u00eda un majestuoso dolor.
# IMAGE: codex_royal_jelly.png

n.monster_codex_roarmulus_twins = C\u00f3dice Monstruoso:
m.monster_codex_roarmulus_twins = Gemelos Roarmulus\n\
 Estos gigantescos cachorros de gun puppy presentan una armadura impenetrable y municiones de \
 alto poder. Su piel es tan gruesa que solos son vulnerables al poder del fuego fraternal.
# IMAGE: codex_roarmulus_twins.png

n.monster_codex_vanaduke = C\u00f3dice Monstruoso:
m.monster_codex_vanaduke = Lord Vanaduke\n\
 Se conoce muy poco acerca del eterno Duque del Imperio Almirian. Nuestros sensores indican \
 que la m\u00e1scara es una fuente de poder as\u00ed como una posible debilidad.
# IMAGE: codex_vanaduke.png

n.monster_codex_battlepod = C\u00f3dice Monstruoso:
m.monster_codex_battlepod = M\u00f3dulo de Batalla\n\
 Estos inamovibles aut\u00f3matas esconden un peque\u00f1o arsenal debajo de su armadura \
 doblemente blindada. Cada M\u00f3dulo de Batalla tiene una combinaci\u00f3n \u00fanica de \
 ataques y defensa que seguro te mantendr\u00e1n tratando de predecir su pr\u00f3ximo movimiento.
# IMAGE: codex_battlepod.png

