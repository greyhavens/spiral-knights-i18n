m.och_leader_1_1a = Tanto gusto, {0}! Me da gusto ver que el Cuartel General Spiral nos \
 ha enviado refuerzos, y ni un minuto muy pronto! Estamos con la espalda contra la \
 pared y necesitamos tu ayuda!
r.och_leader_1_1a = Como puedo ayudar, Teniente?
m.och_leader_1_2a = Nuestra avanzada se ha detenido por esa artiller\u00eda en las paredes que \
 nos ha puesto entre la espada y la pared. Anteriormente, organizamos una estrategia distracci\u00f3\
 n para permitir que un peque\u00f1o grupo de cavaleiros puedan entrar a silenciar esa \
 artiller\u00eda... pero parece que han fallado. Ahora est\u00e1n atrapados ah\u00ed, \
 mientras nosotros estamos atrapados ac\u00e1 afuera!\n\
 \n\
 Necesito que rompas las l\u00edneas frontales, que entres al centro de control de la artiller\u00eda y \
 que encuentres una manera de destruir esos ca\u00f1ones de una vez por todas! Mientras \
 tanto, reorganizar\u00e9 las tropas para que podamos darle seguimiento a ese asalto. Buena suerte, soldado!
r.och_leader_1_2a = N\u00e3o te defraudar\u00e9, Teniente.

m.och_leader_2_1a = Muito bem, {0}! Ese fue un buen show de fuegos artificiales. \
 Gracias ti hemos podido limpiar esa abominable zona y hemos podido mover nuestra base de \
 operaciones a las garitas interiores!
r.och_leader_2_1a = Qu\u00e9 sigue, Teniente?
m.och_leader_2_2a = Esos pesados engranajes est\u00e1n bloqueando nuestro camino, y seg\u00fan \
 los datos de inteligencia, la \u00fanica manera de abrirlos es desde adentro de las garitas \
 adyacentes. N\u00e3o voy a perder vidas sin necesidad atacando las garitas frontalmente, necesito \
 que encuentres un rodeo. Flanquea las defensas, entra a la garita, y abre las puertas!
r.och_leader_2_2a = Considere esas puertas abiertas, Teniente!

m.och_leader_3_1a = (El Teniente Feron parece estar herido) \n\
 \n\
 Ah\u00ed est\u00e1s, {0}, regresaste para el gran final, eh?

r.och_leader_3_1a = Te encuentras bien, Teniente?

m.och_leader_3_2a = Fueron esos malditos fiends encubiertos! Llegaron de las sombras y \
 nos emboscaron. Cuando ponga mis manos en Seerus voy a... Ay! \n\
 \n\
 (Feron se desploma a un lado, claramente mais herido de lo que aparentaba en un \
 principio) \n\
 \n\
 Maldici\u00f3n, me est\u00e1 dando trabajo sostener mi espada...

r.och_leader_3_2a = Teniente, no parece que pueda-

m.och_leader_3_3a = Ciertamente parece que ya no estoy en condiciones para esta pelea. Depende \
 de ti ahora, {0}. Solamente tu posees la fuerza para enfrentarte a Seerus y enfrentarlo a la \
 justicia. Muchos cavaleiros han perdido hoy sus vidas aqu\u00ed. Honra sus esp\u00ed\
 ritus terminando esa tarea!

r.och_leader_3_3a = Entendido Teniente. Har\u00e9 que ese Warmaster nos la pague.

m.och_leader_4_1a = {0}! Apenas puedo creer que te las hayas arreglado para \
 enfrentarte frente a frente contra el Warmaster y que hayas salido vivo de ese infierno! \
 Tienes la hechura de un verdadero h\u00e9roe!

r.och_leader_4_1a = Ciertamente te ves mejor, Teniente.

m.och_leader_4_2a = Con la ayuda del Biotech, estar\u00e9 sano y listo para el servicio activo \
 en poco tiempo. {0}, no puedo dejar de hacer hincapi\u00e9 en lo importante que es esta \
 victoria para todos los Cavaleiros Spiral. Nos ayudaste a darle un gran golpe a la Orden \
 Crimson destruyendo su Gran Arsenal.\n\
 \n\
 Gracias a ti, las fuerzas gremlin no tendr\u00e1n mais de estas masivas m\u00e1quinas de \
 guerra por un buen tiempo. Y con nuestros T\u00e9cnicos estudiando lo que est\u00e1 \
 disponible en la habitaci\u00f3n privada de Seerus podremos terminar comprendiendo mejor la \
 tecnolog\u00eda gremlin o la ubicaci\u00f3n del resto de la Orden Crimson!

r.och_leader_4_2a = Ha sido un honor poder ayudarte.

m.och_leader_4_3a = T\u00f3mate un tiempo para descansar y disfrutar esta tremenda victoria. \
 Sin duda el Cuartel General Spiral te llamar\u00e1 de nuevo!

r.och_leader_4_3a = Hasta la pr\u00f3xima vez, Teniente.

