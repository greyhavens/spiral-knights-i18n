# Tylen Bazaar Tour
#...................................................................................................
m.bazaar_tour_1a = Bem-vindo al Bazar, {0}! Quieres un tour de las tiendas o \
 servicios?

r.bazaar_tour_1a = Seguro, mu\u00e9strame las tiendas. (Sigue a Tylen)
r.bazaar_tour_1b = Qu\u00e9 servicios puedo encontrar aqu\u00ed? (Sigue a Tylen)
r.bazaar_tour_1c = N\u00e3o, obrigado, puedo explorar por mi cuenta.

m.bazaar_tour_2a = Los Strangers como Quillion aqu\u00ed te vended armas y armaduras. Cada uno \
 se especializa en un tipo de item en particular, as\u00ed que habla con ellos para \
 saber lo que tienen en existencia. N\u00e3o son muy parlanchines,pero todos los d\u00edas \
 tienen nuevas cosas en existencia!\n\
 \n\
 Solo aseg\u00farate de que hayas alcanzado el rango apropiado para equipar un item!

r.bazaar_tour_2a = Los Strangers vende algo adem\u00e1s de armas y equipe?

m.bazaar_tour_3a = Me da gusto que hayas preguntado, ciertamente lo hacen! Vamos a ver a \
 Vatel.

r.bazaar_tour_3a = (Sigue a Tylen)
#(move to Vatel)

m.bazaar_tour_4a = Aqu\u00ed Vatel te puede vender una selecci\u00f3n de recetas as\u00ed como \
 cambios de color personal y outros items.

r.bazaar_tour_4a = Recetas? Para armas y equipe?

m.bazaar_tour_5a = As\u00ed es. Puedes adquirir recetas y materiales para transmutar armas y \
 equipe en las estaciones de alquimia. Vamos, te mostrar\u00e9 una.

r.bazaar_tour_5a = Entendido.
#(move to alchemy station)

m.bazaar_tour_6a = Aqu\u00ed tenemos una estaci\u00f3n de alquimia con la que sin duda te \
 familiarizar\u00e1s cuando mejores tu arsenal.\n\
 \n\
 Pues bien, eso es todo en cuanto a tiendas. Quieres otro tour?

r.bazaar_tour_6a = Me gustar\u00eda ver las tiendas otra vez. (Sigue a Tylen)
r.bazaar_tour_6b = Me gustar\u00eda ver los servicios. (Sigue a Tylen)
r.bazaar_tour_6c = N\u00e3o, obrigado, puedo explorar por mi cuenta.

m.bazaar_tour_7a = Punch and Vise son herreros gremlin que pueden cambiar las propiedades de \
 tus armas y equipe.

r.bazaar_tour_7a = Gremlins?!

m.bazaar_tour_8a = T\u00f3malo con calma {0}, no todos los gremlins est\u00e1n cortados con la \
 misma tijera. Algunos no est\u00e1n de acuerdo con las ideas del Rey Tinkinzar y la Orden \
 Crimson. De hecho, se ha dicho que en alg\u00fan lugar de los Clockworks existe un pueblo de \
 gremlins que dejaron la Gran Colonia.

r.bazaar_tour_8a = Bueno, si tu lo dices...

m.bazaar_tour_9a = Bueno, de vuelta a lo que habl\u00e1bamos.\n\
 \n\
 Punch puede a\u00f1adir Variantes \u00danicas, que son un tipo de bono especial para tus \
 armas y equipe, por un precio. Pero sus m\u00e9todos son, er... ca\u00f3ticos. Nunca se sabe \
 lo que vas a obtener.\n\
 \n\
 Vise es un poco mais preciso. Puede desligar tus armas y equipe por un precio, permiti\u00e9\
 ndote vender o regalar el item!

r.bazaar_tour_9a = Muy \u00fatil, lo tendr\u00e9 en mente. Qu\u00e9 mais tienes?

m.bazaar_tour_10a = Vamos a visitar a Brinks.

r.bazaar_tour_10a = (Sigue a Tylen)
#(move to Brinks)

m.bazaar_tour_11a = Brinks es el Mercader de Sellos, que entrega ciertos items a los \
 Cavaleiros a cambio de sellos que han encontrado en los Clockworks. Los sellos se pueden \
 encontrar en cajas de tesoro, se otorgan como recompensas de miss\u00f5es o se encuentran al \
 derrotar jefes monstros especiales.

r.bazaar_tour_11a = Lo tengo. Hay algo mais?

m.bazaar_tour_12a = S\u00f3lo un \u00faltima tienda que visitar y despu\u00e9s terminamos. He \
 guardado lo mejor para el \u00faltimo.

r.bazaar_tour_12a = (Sigue a Tylen)
#(move to Bechamel)

m.bazaar_tour_13a = Aqu\u00ed tenemos a Bechamel el Complementador, quien puede a\u00f1adir \
 accesorios a tu equipe siempre y cuando tengas un cup\u00f3n. Con los accesorios, puedes \
 hacer que tu equipe se destaque en la multitud, recomiendo ampliamente que lo intentes. Pronto ser\u00e1s la ni\u00f1a de los ojos de todos!

r.bazaar_tour_13a = D\u00f3nde encuentro cupones de accesorios?

m.bazaar_tour_14a = Puedes encontrar cupones de accesorios en lockboxes o en la Casa de \
 Subastas si alg\u00fan otro Cavaleiro lo estuviera vendiendo.

r.bazaar_tour_14a = Entendido.

m.bazaar_tour_15a = Pues bien, eso cubre lo b\u00e1sico del Bazar. Es realmente un lugar fant\u00e1stico para encontrar pr\u00e1\
 cticamente todo lo que necesites.\n\
 \n\
 Quieres que lo repasemos otra vez, o ya te queda claro?

r.bazaar_tour_15a = Me gustar\u00eda ver las tiendas. (Sigue a Tylen)
r.bazaar_tour_15b = Me gustar\u00eda ver los servicios otra vez. (Sigue a Tylen)
r.bazaar_tour_15c = N\u00e3o, obrigado, puedo explorar por mi cuenta.

m.bazaar_tour_16a = Otro tour? N\u00e3o hay problema, s\u00edgueme!
r.bazaar_tour_16a = (Sigue a Tylen)

m.bazaar_tour_16b = Excelente! Me da gusto haber podido ayudar a orientarte. Te \
 deseo buena suerte, {0}!

r.bazaar_tour_16b = Gracias Tylen, nos vemos!



