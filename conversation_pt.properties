m.impostoclaus = Glorp, glorp, glorp! Feliz Festival de Invierno!\n\
 \n\
 Siente el esp\u00edritu de las fiestas con peleas de bolas de nieve en invernales \
 niveles de Lockdown y canjea esos Krogmo Coins por esplendidos Santa Hats!

r.impostoclaus = Creo en ti, Impostoclaus!

m.impostoclaus_1a = Glorp! Glorp! Glorp! Feliz Festival de Invierno!\n\
 \n\
 Esa especial \u00e9poca del a\u00f1o por fin esta aqu\u00ed, cuando una delicada capa de \
 maravillosa nieve cubre Haven y a cada Extra\u00f1o, cada snipe y cada Cavaleiro llena su \
 coraz\u00f3n con la alegr\u00eda de las fiestas.\n\
 \n\
 Pero a ti te debo decir, tristemente no todo est\u00e1 bien. Sin motivo o raz\u00f3n, un \
 grupo de grinchlins con el coraz\u00f3n marchito han amenazado es Festival de Invierno de \
 esta temporada.
r.impostoclaus_1a = N\u00e3o durante mi guardia. Salvar\u00e9 al Festival de Invierno! Como puedo ayudar?

m.impostoclaus_2a = Tal valent\u00eda, tal coraje! Sim, tal vez con algo de suerte \
 puedes tener una oportunidad en contra de los terribles enemigos que quieren destruir los sue\u00f1\
 os del Festival de Invierno.\n\
 \n\
 As\u00ed que nota la adici\u00f3n de una miss\u00e3o del Festival de Invierno, toma tu \
 espada y te otorgare recompensas!
r.impostoclaus_2a = Completar la miss\u00e3o 'Salva el Festival de Invierno' y recibir \
 recompensas especiales del Festival de Invierno? Estoy en eso!

m.impostoclaus_3a = Glorp! Glorp! Glorp!
r.impostoclaus_3a = Ver la tienda de recompensas del Festival de Invierno
r.impostoclaus_3b = Terminar la conversaci\u00f3n

m.impostoclaus_win = Glorp! Glorp! El Festival de Invierno ha sido salvado y algo \
