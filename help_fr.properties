# Clockworks tab
#...................................................................................................

t.clockworks = Rouages

t.clockworks_1 = Rouages
m.clockworks_1 = Les Rouages sont votre porte au Core, le noyau du plan\u00e8te! C'est rempli \
  d'une vaste diversit\u00e9 de mondes et peupl\u00e9 de monstres et tr\u00e9sors au-del\u00e0 de votre imagination. M\u00e9\
  fiez-vous, cependant: le plus profond que seront vos voyages, le plus formidable et \
  intelligent seront vos ennemis!

m.clockworks_2 = Les profondeurs sous Haven peuvent \u00eatres class\u00e9s en trois niveaux, \
  chacun plus difficile que le pr\u00e9c\u00e9dent. Assurez-vous de vous \u00e9quiper d'une mani\u00e8\
  re convenable au niveau avant de partir, et souvenez-vous: les plus grands tr\u00e9sors des \
  Rouages se trouvent loin du surface, proche du Core, donc il faut plonger profond\u00e9ment!

t.tier_1 = Niveau 1

m.tier_1_equip = \u00c9quipement recommand\u00e9: 0-1 \u00e9toiles
m.tier_1_monster = Les monstres font des dommages NORMAL.

t.tier_2 = Niveau 2

m.tier_2_equip = \u00c9quipement recommand\u00e9: 2-3 \u00e9toiles.
m.tier_2_monster = Les monstres partagent leurs dommages entre NORMALE et un autre type de \
  dommage sp\u00e9cial (PER\u00c7ANTE, \u00c9L\u00c9MENTALE, ou OMBRE).\n\
  Les monstres utilisent souvent les \u00c9TATS. \u00c9quippez l'armure avec la r\u00e9sistance au FEU, GEL, \u00c9LECTROCUTION, ou POISON!

t.tier_3 = Niveau 3

m.tier_3_equip = \u00c9quipement recommand\u00e9: 4-5 \u00e9toiles
m.tier_3_monster = Les monstres peuvent utiliser des attaques qui infligent uniquement des d\u00e9g\u00e2ts sp\u00e9ciaux (PER\u00c7ANTE, \u00c9L\u00c9MENTAIRE, ou OMBRE). \u00c9\
  quipez-vous comme il faut!

