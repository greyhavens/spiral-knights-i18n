t.energy_1 = \u00c9nergie
m.energy_1 = L'\u00e9nergie est utilis\u00e9e pour acheter des items du D\u00e9p\u00f4t des \
  provisions comme des armes, les \u00e9quipements, orbs of alchemy, sparks of life, et fire \
