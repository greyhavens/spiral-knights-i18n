m.toxic_plant_1a = Okay, Ranger, h\u00f6rt zu - wir haben Anweisung, die \
  Gremlin-Biowaffen-Fabrik zu infiltrieren, angef\u00fchrt von einem Mitglied ihrer 'Crimson \
  Order', das sich 'Herex' nennt. Das ist nur eine nette Umschreibung der Tatsache, dass einer \
  ihrer verr\u00fccktesten Gremlins seine Waffe gern mit unkonventionellen Geschossen l\u00e4dt.\n\
  \n\
  Wir wissen nicht, was er da unten ausgebr\u00fctet hat, also bewaffnet euch gut und denkt \
  daran, eine Maske zu tragen. Sollte Herex auch nur irgendwie wie Seerus sein, dann stehen die \
  Chancen gut, sich da unten mehr als nur eine Erk\u00e4ltung zu fangen.\n\
  \n\
  Aufgehts, Ranger!
r.toxic_plant_1a = (Konversation beenden)

n.toxic_plant_2a = Geheime Nachricht

m.toxic_plant_2a = Eine offizielle Anweisung von Herex, dem Fl\u00fcsternden Gift:\n\
  \n\
  Produktion von Mischung 42 ist sofort einzustellen. Obwohl es ein fabelhaftes Gift ist und \
  ohne Zweifel hervorragend daf\u00fcr geeignet,..  'h\u00f6here' R\u00e4nge im Orden zu \
  erreichen, scheint es eine Intelligenz entwickelt zu haben, die \u00fcber die eines normalen \
  Bio-Toxins hinaus geht.

r.toxic_plant_2a = (Weiterlesen)

m.toxic_plant_2b = Alle Spuren von Mischung 42 sollten vernichtet werden, zusammen mit  der \
  Fabrik und allen Ingenieuren, die nicht Teil des inneren Zirkels sind. Erinnert die Scorcher, \
  die ein Problem mit diesem Befehl haben, daran, dass sie mein Fl\u00fcstern schon bald in \
  ihren Ohren vernehmen werden.\n\
  \n\
  Versiegelt die T\u00fcren und brennt alles nieder.

r.toxic_plant_2b = (Lesen beenden)

m.p_heart_of_ice_r4 = Herz aus Eis
o.p_heart_of_ice_r4 = Entdecke die Quelle der schrecklichen Schneest\u00fcrme, die von Amu-Sol \
  ausgehen
b.p_heart_of_ice_r4 = Warnung: Das ist eine gef\u00e4hrliche Mission!\n\
  \n\
  Desna und ihre Aufkl\u00e4rer-Knights sind ein Elite-Team, damit betraut, Informationen \u00fcber einige der gef\u00e4\
  hrlichsten Ebenen des Uhrwerks zu sammeln. Sich ihnen anzuschlie\u00dfen kann gro\u00dfe \
  Belohnungen mit sich bringen, aber es ist unter Garantie eine lebensbedrohliche Reise!\n\
  \n\
  Spiral HQ hat eine pl\u00f6tzliche Klimaver\u00e4nderung bemerkt, die tief aus dem Uhrwerk \
  hervordringt. Ungew\u00f6hnliche Schneest\u00fcrme und Blizzards haben begonnen, sich durch \
  die Tiefen auszubreiten und scheinen von einer unwirtlichen, d\u00e4monischen Stadt, bekannt \
  als 'Amu-Sol', auszugehen. Die Aufkl\u00e4rungs-Ranger wurden losgeschickt, um Amu-Sol zu \
  infiltrieren und die Quelle dieser frostigen St\u00fcrme zu entdecken.

