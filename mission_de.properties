b.monstrous_research_5 = Biotech Hahn versucht, seine Forschung \u00fcber die Familie der d\u00e4\
  monischen und untoten Monster weiter voranzutreiben und fragt nach Proben, die von deinen \
  letzten Missionen stammen. Er hat wieder einmal speziell darum gebeten, dich an die 'bislang \
  beste, kostenlose Lektion' durch ihn zu erinnern, bevor du dich entscheidest, ob du seiner \
  Anfrage nachkommen m\u00f6chtest.

# RANK 5-2
m.another_trace = Ein weitere Spur
o.another_trace = Kontaktiere Agent Kora \u00fcber Comlink
b.another_trace = Die Techniker im Labor von Haven melden, dass ihr Tracking-System endlich \
  repariert und wieder online ist. Agent Kora m\u00f6chte dich hinsichtlich der \
  Herausforderungen in n\u00e4chster Zeit auf den neuesten Stand bringen. Kontaktiere sie \u00fcber Comlink bez\u00fcglich der Details.


m.another_trace_1a = Hallo, {0}, ich freue mich, berichten zu k\u00f6nnen, dass meine Ausr\u00fc\
  stung wieder funktioniert! Jetzt habe ich eine gute und schlechte Nachricht f\u00fcr dich. \
  Die gute Nachricht ist: Ich habe es geschafft, die Quelle der Energiesignatur zu finden. Und \
  hier die schlechte Nachricht: die Energiequelle wurde in einem \u00e4usserst gef\u00e4\
  hrlichen Teil des Uhrwerks aufgesp\u00fcrt, den die Sp\u00e4her als "Glibber-K\u00f6nigspalast" bezeichnen.

r.another_trace_1a = Du veralberst mich, oder?

m.another_trace_2a = Der Ort ist so seltsam, wie er klingt. Anscheinend haben die Monster der \
  Glibber-Familie so etwas wie eine Adelshierachie von Elite-Glibbern. Diese "Royal Jellies" \
  sind gigantische, egoistische und aufbrausende Glibber, die in oppulenten Pal\u00e4sten \
  hausen, von denen wir nur annehmen k\u00f6nnen, dass sie besetzt wurden, weil wir nicht \
  glauben, dass Glibber Geb\u00e4ude bauen k\u00f6nnen.

r.another_trace_2a = Okay...

m.another_trace_3a = Die Energiequelle befindet sich irgendwo im Glibber-K\u00f6nigspalast, und \
  wir brauchen dich, um das zu untersuchen. Royal Jellies sind sehr territorial, du musst dich \
  vielleicht durch seinen Unterschlupf k\u00e4mpfen, um dein Ziel zu erreichen. Aber sei \
  gewarnt, ein Royal Jelly umgibt sich mit reichlich Schutz. Du wirst vermutlich starkem \
  Widerstand begegnen, wenn du den Palast untersuchst.

r.another_trace_3a = Du kannst auf mich z\u00e4hlen, Kora

m.another_trace_4a = Viel Gl\u00fcck, {0}. Bereite dich gut vor, bevor du diese Mission \
  angehst.

r.another_trace_4a = Gespr\u00e4ch beenden

m.time_enough_at_last = Endlich genug Zeit
o.time_enough_at_last = Erkunde das Schicksal des verschollenen Knights in der Scharlachroten \
  Festung.
b.time_enough_at_last = Ein Knight namens Edger ist verschwunden, als er die Scharlachrote \
  Festung erforscht hat. Nachdem dieses zerfallende Schlo\u00df nur so von Spookats und \
  Glibbern wimmelt, f\u00fcrchten seine Teamkameraden um seine Sicherheit und haben darum \
  gebeten, dass ein erfahrener Knight wie du das Ganze untersucht.\n\
  \n\
  Sp\u00fcre Edger im Schlo\u00df auf und bringe ihn zur\u00fcck nach Haven!

#Conversation (used at the end of the mission):
m.time_enough_at_last_1a = Oh hallo! Ich sch\u00e4tze, du geh\u00f6rst zum Spiral HQ.

r.time_enough_at_last_1a = Ja, du musst Edger sein. Deine Truppenkameraden haben mich gebeten, \
  dich aufzusuchen.

m.time_enough_at_last_2a = Ah, richtig, meine Truppe. Gute Leute... tapfer und willensstark. \
  Ich bin mir nicht sicher, ob ich da wirklich reinpasse, wenn ich ehrlich bin, ich habe immer \
  lieber gelesen. Sie sollten gut ohne mich klarkommen, w\u00fcrde ich meinen.

r.time_enough_at_last_2a = Ohne dich? Nein, ich bin hier, um dich zur\u00fcckzubringen.

m.time_enough_at_last_3a = Ich weiss nicht recht... mir geht es gut hier zwischen all diesen \
  antiken W\u00e4lzern. Ich habe reichlich zu lesen, mehr, als ich in meinem Leben k\u00f6nnte. Aber ich sch\u00e4\
  tze, das wird kein Problem sein.\n\
  \n\
  Bitte, kehre einfach nach Haven zur\u00fcck. Lass meine Truppe wissen, dass es mir gut geht \
  und ich sicher bin.

r.time_enough_at_last_3a = Sicher? Hier wimmelt es von Monstern!

m.time_enough_at_last_4a = Ja, tut es, oder? Ich h\u00e4tte nicht allein herkommen sollen. Ich \
  h\u00e4tte bei meiner Truppe bleiben sollen.\n\
  \n\
  (Edgers Blick schweift in die Ferne)\n\
  \n\
  Ich weiss gar nicht mehr, wie es passiert ist... vielleicht werde ich das nie. Aber es tat \
  nicht weh.

r.time_enough_at_last_4a = Meinst du, dass...?

m.time_enough_at_last_5a = Ich sage, dass ich jetzt viel zu lesen habe. Der Kampf ist vorbei, \
  das ist alles.\n\
  \n\
  Bitte, kehre nach Haven zur\u00fcck und lass alle wissen, dass alles in Ordnung ist.

r.time_enough_at_last_5a = Ich werde es ihnen sagen, Edger.

m.rise_or_fall = Aufstieg oder Niedergang
o.rise_or_fall = Teste deine F\u00e4higkeiten in einer glibberigen Kraftprobe in der Kampfarena
b.rise_or_fall = Das Infiltrieren des Glibber-K\u00f6nigspalastes und das Besiegen der \
  Glibberhorden, die dem gro\u00dfen Royal Jelly dienen, wird keine einfache Aufgabe. Deshalb \
  ist es h\u00f6chst empfehlenswert, dass du eine der Kampfarenen im Uhrwerk aufsuchst, um zu \
  pr\u00fcfen, ob deine Ausr\u00fcstung der Herausforderung gegen so viele wilde Glibber standh\u00e4lt.\n\
  \n\
  Spiral HQ hat eine dieser mysteri\u00f6sen Arenen entdeckt, die mit allen Arten an \
  schleimigen Gladiatoren gef\u00fcllt zu sein scheint. Liefert ihnen einen starken Kampf!

m.hall_of_heroes_2 = Halle der Helden
o.hall_of_heroes_2 = Besuche die Halle der Helden, wenn du 3-Sterne-Ausr\u00fcstung tr\u00e4\
  gst, und erhalte deine Zertifikation
b.hall_of_heroes_2 = Um tiefer ins Uhrwerk vordringen zu d\u00fcrfen, musst du wieder einmal \
  die Halle der Helden aufsuchen und mit Lieutenant Barrus sprechen, um deine \
  3-Sterne-Zertifikation zu erhalten.

#Conversation (used at in the hall):
m.hall_of_heroes_2_2a = Seid gegr\u00fc\u00dft, {0}. Freut mich, dich wiederzusehen.\n\
  \n\
  Also, {0}, f\u00fcr deine 3-Sterne-Zertifikation musst du 3-Sterne-Ausr\u00fcstung oder h\u00f6her f\u00fcr Helm, R\u00fc\
  stung, Schild und mindestens eine Waffe ausger\u00fcstet haben.

m.hall_of_heroes_2_3a = Gl\u00fcckwunsch, {0}, du erf\u00fcllst die Voraussetzungen und hast \
  deine 3-Sterne-Zertifikation erhalten. Nimm den Fahrstuhl hinter mir, um deine Mission \
  abzuschlie\u00dfen.

m.hall_of_heroes_2_3b = Es tut mir leid, {0}, aber du erf\u00fcllst nicht die notwendigen \
  Voraussetzungen. Bitte spreche erneut mit mir, wenn du R\u00fcstung, Helm, Schild und eine \
  Waffe mit mindestens 3 Sternen ausger\u00fcstet hast.

m.sovereign_slime = Der herrschende Glibber
o.sovereign_slime = Infiltriere den Glibber-K\u00f6nigspalast und finde die mysteri\u00f6se Energiequelle
b.sovereign_slime = Die Quelle der mysteri\u00f6sen Energiesignatur wird im Glibber-K\u00f6\
  nigspalast vermutet, der Heimat der Glibber-Aristokraten, den Royal Jellies.\n\
  \n\
  Die Macht dieser herrschenden Glibber darf man nicht untersch\u00e4tzen. Solltest du dich \
  diesem hei\u00dfbl\u00fctigen Adel gegen\u00fcbersehen, w\u00e4rst du besser mit der \
  passenden R\u00fcstung ausgestattet und von einem vollen Team erfahrener Knights unterwegs.\n\
  \n\
  Es wird dringend empfohlen, sich mit Schutz gegen Perforationsschaden und Waffen mit \
  Schattenschaden auszur\u00fcsten, bevor man in Richtung Glibber-K\u00f6nigspalast aufbricht.

# RANK 6-1

m.explosive_plot = Ein explosiver Plan
o.explosive_plot = Kontaktiere Agent Kora \u00fcber Comlink
b.explosive_plot = Aufkl\u00e4rer-Knights denken, dass sie etwas entdeckt haben, das nach einem \
  von den Gremlins ausgebr\u00fcteten Plan aussieht, Haven zu zerst\u00f6ren! Als Elite-Ritter \
  wurdest du vom Spiral HQ ausgew\u00e4hlt, um diese Sache zu untersuchen. Kontaktiere Agent \
  Kora \u00fcber Comlink, um die Details zu erfahren.

m.explosive_plot_1a = Gl\u00fcckwunsch, {0}! Elite-Knight, wie? Wow, du musst stolz sein!

r.explosive_plot_1a = Danke, Kora, vieles verdanke ich deinen Informationen.

m.explosive_plot_2a = Oh {0}, ich mache nur meinen Job. Und wo wir davon sprechen, ich habe \
  einen f\u00fcr dich!

r.explosive_plot_2a = Ich bin bereit.

m.explosive_plot_3a = Unsere Informationen von den Sp\u00e4her-Knights legen nahe, dass die \
  Gremlins etwas Gro\u00dfes vorhaben. Wir glauben, sie entwickeln eine Art Waffe, die sie \
  "Projekt R" nennen und auf Haven selbst gerichtet sein soll. Spiral HQ und die Stranger \
  selbst bitten dich angesichts deiner Leistung im Glibber-K\u00f6nigspalast, diese Sache zu \
  untersuchen.

r.explosive_plot_3a = Nur weil sie uns Unterschlupf gew\u00e4hrten, sind die Stranger nun \
  selbst Ziel...

m.explosive_plot_4a = Ja, so sehe ich das auch. Wir schulden es ihnen, diese Bedrohung durch \
  die Gremlins so schnell wie m\u00f6glich auszur\u00e4umen.\n\
  \n\
  Ich habe eine Reihe Missionen f\u00fcr dich vorbereitet, die dich an die Orte f\u00fchren, an \
  denen Gremlins anscheinend Rohstoffe f\u00fcr Project R sammeln. Die Unterweisung sollte dir \
  die Details erkl\u00e4ren.

r.explosive_plot_4a = Verstanden, Kora, ich bin unterwegs!

m.explosive_plot_5a = In der Zwischenzeit werden wir den seltsamen Apparat, den du im K\u00f6\
  niglichen Glibberpalast gefunden hast einer Analyse unterziehen. Wenn er etwas mit dem \
  Artefakt zu tun hat, werden wir das bald wissen!\n\
  \n\
  Viel Gl\u00fcck, {0}.

r.explosive_plot_5a = Gespr\u00e4ch beenden

m.axes_of_evil = \u00c4xte des B\u00f6sen
o.axes_of_evil = Stoppe die Gremlin-Holzf\u00e4ller-Operation im Mosaik-Tal.
b.axes_of_evil = Es wurde eine Holzf\u00e4ller-Operation der Gremlins in den Ebenen die als \
  'Mosaik-Tal' bekannt sind entdeckt. Diese seltsam geformten Inseln sind das Zuhause noch \
  seltsamerer, sich drehender B\u00e4ume, die die Gremlins anscheinend vollst\u00e4ndig ausrotten wollen.\n\
  \n\
  Spiral HQ glaubt, dass die Gremlins das gewonnene Holz von dieser Unternehmung f\u00fcr \
  Projekt R verwenden, und braucht dich, um ins Mosaik-Tal zu gehen und das zu beenden.

m.plan_of_attack = Angriffsplan
o.plan_of_attack = Birg die Gremlin-Pl\u00e4ne aus dem geheimen Testlabor
b.plan_of_attack = Tief in einer giftigen H\u00f6hle liegt ein verstecktes Testlabor, das die \
  Gremlins als Testgel\u00e4nde f\u00fcr Bestandteile des Projekts R verwenden. Es gibt \
  Berichte, dass sich nahe einer der Komponenten, die sich dort in Entwicklung befinden, Pl\u00e4\
  ne zu dem Projekt befinden.\n\
  \n\
  Sollte das wahr sein, wird es sehr wahrscheinlich eine Art Terminal in der N\u00e4he von \
  einer der Komponenten des Projekts R geben. Finde den Terminal und birg die Pl\u00e4ne, damit \
  sie analysiert werden k\u00f6nnen. Das sollte Aufschlu\u00df \u00fcber die genaue Natur des \
  Projekts R geben.

m.high_temperature_hostages = Heisse Geiseln
o.high_temperature_hostages = Rette die gefangenen Knights aus der feurigen \
  Dekonstruktions-Zone
b.high_temperature_hostages = Wir haben Berichte von Aufkl\u00e4rern, dass eine \
  Gremlin-Dekonstruktions-Mannschaft einen Teil des Uhrwerks auseinandernimmt, um mehr \
  Altmetall f\u00fcr das Projekt R zu sammeln. Unter Verwendung m\u00e4chtiger Schweissbrenner \
  brennen sie sprichw\u00f6rtlich alles bis auf die Grundmauern nieder.\n\
  \n\
  Eine der Truppen, die die Vorg\u00e4nge untersuchen sollten, wird vermisst und wird \
  vermutlich jetzt dort gefangen gehalten.\n\
  \n\
  Dringe in die feurige Dekonstruktions-Zone ein und rette die gefangenen Knights. Aber sei \
  gewarnt, es wird gemunkelt, dass die Dekonstruktions-Mannschaft irgendwo auf dem Gel\u00e4nde \
  eine machtvolle Sicherheitseinrichtung versteckt hat.

# RANK 6-2
m.target_acquired = Ziel erfasst
o.target_acquired = Kontaktiere Agent Kora \u00fcber Comlink.
b.target_acquired = Nach Analyse der Pl\u00e4ne die du aus dem Testlabor geborgen hast, kennt \
  Spiral HQ nun die Wahrheit \u00fcber Projekt R und auch dar\u00fcber, dass es sich in einer \
  Gremlin-Munitionsfabrik befindet. Spiral HQ m\u00f6chte, dass du dich in diese Fabrik begibst \
  und das Projekt R zerst\u00f6rst, bevor es gegen Haven eingesetzt werden kann. Sprich mit \
  Agent Kora, um alle Details zu erfahren.

m.target_acquired_1a = Hallo {0}, ich hoffe, du bist bereit daf\u00fcr, von mir wieder in die H\u00f6hle des L\u00f6wen geschickt zu werden.

r.target_acquired_1a = Ich h\u00f6re, Spiral HQ hat die Natur von Project R entdeckt.

m.target_acquired_2a = Ja, Project R scheint aus zwei massiven Waffen zu bestehen, die \
  "Roarmulus Twins" genannt werden. Sie wurden von einem der Crimson Order pers\u00f6nlich \
  entworfen und sind eine Art Kontrukt-Kanone, die die Gremlins aus dem Uhrwerk in die Arcade \
  von Haven bringen wollen!\n\
  \n\
  Nach den Baupl\u00e4nen liegt ihre St\u00e4rke weit \u00fcber der der Gremlin-Standardwaffen \
  und k\u00f6nnte Verw\u00fcstungen f\u00fcr Haven, Spiral HQ und die Stranger anrichten, wenn \
  sie die Arcade erreichen.

r.target_acquired_2a = Wenn du weisst, wo sie sind, werde ich die Sache beenden.

m.target_acquired_3a = Wir haben den Standort auf der tiefsten Ebene einer Gremlin-Einrichtung \
  namens "Ironclaw Munitionsfabrik" geortet. Die Fabrik wird f\u00fcr die Produktion aller \
  Arten von Gremlin-Waffen benutzt und ist hochgef\u00e4hrlich, selbst f\u00fcr die dort \
  arbeitenden Gremlins\n\
  \n\
  Du musst dich aufheftigen Widerstand durch Schock-Konstrukte und Gremlins einstellen.

r.target_acquired_3a = Ich werde mir die passende Ausr\u00fcstung f\u00fcr den Job besorgen.

m.target_acquired_4a = Eine letzte Sache noch - es scheint, als w\u00fcrdest du nicht der erste \
  Knight sein, der die Ironclaw Munitionsfabrik betritt. Wir haben ein weiteres \
  Alpha-Squad-Aufkl\u00e4rungsmodul irgendwo in der Fabrik geortet. Bitte versuche, es zu \
  bergen. Ich hoffe, dass dessen Analyse best\u00e4tigen wird, dass Euclids Team dort lebending \
  entkommen ist...

r.target_acquired_4a = Verstanden, Kora.

m.whipping_mishandling = Peitschen und Misshandlung
o.whipping_mishandling = Liefere die Vorr\u00e4te zum Forschungsteam in der d\u00e4monischen Stadt Sol'Fork
b.whipping_mishandling = Nachdem Sp\u00e4her eine d\u00e4monische Stadt namens Sol'Fork \
  entdeckt hatten, hat Spiral HQ ein Forschungsteam im Herzen der Stadt stationiert, um die D\u00e4\
  monen dort zu studieren. Dessen Ergebnisse sind die Basis f\u00fcr unser Verst\u00e4ndnis der d\u00e4\
  monischen Kultur und ihrer Motive f\u00fcr die Zusammenarbeit mit den Gremlins.\n\
  \n\
  Dieses Forschungsteam braucht dringend Vorr\u00e4te, um weiter vor Ort arbeiten zu k\u00f6nnen. Es w\u00e4re eine gro\u00dfe Hilfe f\u00fc\
  r Spiral HQ, wenn eine Truppe die Stadt besuchen und die notwendigen Vorr\u00e4te liefern w\u00fcrde.

m.sewer_stash = Kanalversteck
o.sewer_stash = Zerst\u00f6re die Gremlin-Kriegsmaschinen, die in der M\u00fcllhalde versteckt sind
b.sewer_stash = Es scheint, als w\u00e4re die Ironclaw Munitionsfabrik nicht der einzige Ort, \
  an dem Gremlins m\u00e4chtige Waffen lagern. Die Berichte unserer Agenten lassen darauf \
  schlie\u00dfen, dass, sobald Waffen fertiggestellt sind, sie aus der Ironclaw Munitionsfabrik \
  hinaus und in geheime Waffenlager, die durch das gesamte Uhrwerk verteilt sind, transportiert \
  werden.\n\
  \n\
  Eines dieser Lager wurde im Kanalsystem des Uhrwerks entdeckt. Es wird wahrscheinlich nicht \
  angenehm, es zu erreichen, aber die Waffen in diesem Lager zu zerst\u00f6ren, k\u00f6nnte zu \
  einer geringeren Zahl zuk\u00fcnftiger Verluste f\u00fchren.

m.built_to_destroy = Gebaut um zu zerst\u00f6ren!
o.built_to_destroy = Zerst\u00f6re die Roarmulus Twins im Herzen der Ironclaw Munitionsfabrik
b.built_to_destroy = Dem Spiral HQ einst als 'Projekt R' bekannt, wurden die Roarmulus Twins \
  nun als von Gremlins gebaute Waffe von gewaltiger Macht identifiziert, die mit dem einzigen \
  Ziel, Haven zu zerst\u00f6ren, erschaffen wurde. Diese Waffe befindet sich tief im Herzen der \
  Ironclaw Munitionsfabrik und wird nicht nur von Horden schockbetriebener Konstrukte und \
  Gremlins bewacht, sondern die Fabrik an sich ist ebenfalls eine gro\u00dfe und explosive Gefahr!\n\
  \n\
  Zus\u00e4tzlich zur Zerst\u00f6rung der Roarmulus Twins, m\u00f6chte das Spiral HQ, dass du \
  das Aufkl\u00e4rungsmodul des Alpha Squads birgst, von dem man glaubt, dass es sich irgendwo \
  in der Fabrik befindet.\n\
  \n\
  Es wird ausdr\u00fccklich dazu geraten, ein komplettes Team zusammenzustellen, bevor du \
  aufbrichst.

m.built_to_destroy_1a = "Die Neun sehen alles, h\u00f6ren alles. Gehorche dem Eisernen Gesetz."
r.built_to_destroy_1a = Crimson-Order-Direktiven lesen.
r.built_to_destroy_1b = Crimson-Order-\u00dcbertragungen lesen.
r.built_to_destroy_1c = Dem Terminal verlassen

m.built_to_destroy_2a = Crimson-Order-Direktiven: \n\
  \n\
  - Es ist die PFLICHT jedes Gremlins, die metallenen Eindringlinge abzuwehren!\n\
  \n\
  - Jeder Gremlin muss daran arbeiten, Haven zu zerst\u00f6ren. Cradle geh\u00f6rt uns!\n\
  \n\
  - Jeder Gremlin muss K\u00f6nig Tinkinzar und der Crimson Order gegen\u00fcber LOYAL bleiben. \
  Das Eiserne Gesetz muss befolgt werden!
r.built_to_destroy_2a = Zur\u00fcck

m.built_to_destroy_2b = \u00dcbertragung: \n\
  \n\
  'Sie dringen weiter vor und durchkreuzen unsere Pl\u00e4ne! Wie konnten sie Projekt R enteckt \
  haben? Warum gab es im Vorfeld auf den Angriff keine Warnung?'\n\
  \n\
  'Herex und seine Gefolgschaft h\u00e4tten sie ausspionieren sollen, aber die sind wie \
  Feiglinge einfach verschwunden.'\n\
  \n\
  'Das Eiserne Gesetz zu missachten heisst, die Order zu missachten! Fasst den Verr\u00e4ter. Herex wird f\u00fcr diesen R\u00fcckschlag geradestehen.'

m.hall_of_heroes_3 = Halle der Helden
o.hall_of_heroes_3 = Besuche die Halle der Helden, wenn du 4-Sterne-Ausr\u00fcstung tr\u00e4\
  gst, und erhalte deine Zertifikation.
b.hall_of_heroes_3 = Um noch tiefer ins Uhrwerk vordringen zu d\u00fcrfen, musst du wieder \
  einmal die Halle der Helden aufsuchen und mit Lieutenant Barrus sprechen, um deine \
  4-Sterne-Zertifikation zu erhalten.

#Conversation (used at in the hall):
m.hall_of_heroes_3_2a = Seid gegr\u00fc\u00dft, {0}. Sch\u00f6n, dich erneut zu sehen.\n\
  \n\
  Also, {0}, f\u00fcr deine 4-Sterne-Zertifikation musst du mit 4* oder h\u00f6herer R\u00fc\
  stung, Helm, Schild und Waffe ausger\u00fcstet sein.

m.hall_of_heroes_3_3a = Gl\u00fcckwunsch, {0}, du erf\u00fcllst die Voraussetzungen und hast \
  deine 4-Sterne-Zertifikation erhalten. Nimm den Fahrstuhl hinter mir, um deine Mission \
  abzuschlie\u00dfen.

m.hall_of_heroes_3_3b = Es tut mir leid, {0}, aber du erf\u00fcllst nicht die notwendigen \
  Voraussetzungen. Bitte spreche erneut mit mir, wenn du R\u00fcstung, Helm, Schild und eine \
  Waffe mit mindestens 4 Sternen ausger\u00fcstet hast.

# RANK 7-1
m.darkest_depths = Dunkelste Tiefen
o.darkest_depths = Kontaktiere Agent Kora \u00fcber Comlink.
b.darkest_depths = Nachdem die Roarmulus Twins besiegtsind, und das Aufkl\u00e4rungs-Modul des \
  Alpha Squad geborgen wurde, wird es Zeit, sich mit Agent Kora in Verbindung zu setzen, um \
  einen Bericht \u00fcber die Analyse des Moduls zu erhalten und Informationen \u00fcber deinen \
  neuen Zugang zu den tiefsten Tiefen des Uhrwerks.

m.darkest_depths_1a = {0}, du hast die Roarmulus Twins besiegt und Haven gerettet! Im Namen der \
  Stranger und allen Spiral Knights in Haven, danke dir! Ich sehe, du bist zum Verteidiger bef\u00f6\
  rdert worden - diese Ehre hast du wahrhaftig verdient.

r.darkest_depths_1a = Danke, Kora, ich bin nur froh, dass alle in Haven wieder sicher sind.

m.darkest_depths_2a = Ja, es ist f\u00fcr uns zu so etwas wie einer zweiten Heimat geworden. \
  nicht wahr? Es scheint fast, als geh\u00f6rten wir hierher. Es ist seltsam.

r.darkest_depths_2a = Was meinst du?

m.darkest_depths_3a = Nur so ein Gef\u00fchl. Ich h\u00f6re das auch von anderen Knights: Ein \
  Gef\u00fchl, als sollten wir hier sein. Fast, als sei der Absturz aus einem bestimmten Grund \
  erfolgt.\n\
  \n\
  Aber das kann nicht sein, oder? Jedenfalls fasele ich nun. Zur\u00fcck zur Mission!

r.darkest_depths_3a = Was liegt an, Kora?

m.darkest_depths_4a = Als Verteidiger kannst du jetzt Missionen im dritten Rang des Uhrwerks \
  unternehmen. Das sind die tiefsten und gef\u00e4hrlichsten Ebenen des Uhrwerks - wenn man \
  noch tiefer vordringt, gelangt man zum Core selbst.\n\
  \n\
  Wenn du es bis dorthin schaffst, wirst du vielleicht das Alpha Squad entdecken, ich weiss es \
  nicht.

r.darkest_depths_4a = Ich werde es schaffen, warte nur ab.

m.darkest_depths_5a = Dann lass uns anfangen. Jetzt, da du die unmittelbare Gefahr f\u00fcr \
  Haven abgewendet hast, hofft Spiral HQ, die Spur des Artefakts wieder aufnehmen zu k\u00f6\
  nnen. Es wird nicht einfach sein. Ich habe zum Gl\u00fcck ein paar Missionen f\u00fcr dich, die f\u00fcr das \u00dc\
  berleben in den finsteren Tiefen dort unverzichtbar sein werden. Viel Gl\u00fcck, {0}.

r.darkest_depths_5a = Danke, Kora. Ich werde mein Bestes geben.

m.alchemy_mastery = Meisterhafte Alchemie
o.alchemy_mastery = Erforsche das Potential meisterlicher Alchemie.
b.alchemy_mastery = Bosco im Basar von Haven hat mehr Informationen f\u00fcr dich \u00fcber die h\u00f6chsten Stufen der f\u00fcr dich verf\u00fc\
  gbaren Alchemie. Die meisterliche Stufe der Alchemie wird f\u00fcr dich ein wichtiges \
  Werkzeug zum \u00dcberleben sein, wenn du versuchst, den Kern des Uhrwerks zu erreichen.

m.alchemy_mastery_1a = Hallo mal wieder, {0}. So wie ich es sehe, bist du auf einem guten Weg, \
  den Core zu erreichen und brauchst ein Arsenal, das dich am Leben erh\u00e4lt.

r.alchemy_mastery_1a = Ein gutes Schwert kann ich immer brauchen.

m.alchemy_mastery_2a = Ein gutes Schwert ist, nun ja, gut, aber wie w\u00e4re es mit einem \
  tollen Schwert? Wenn du Waffen willst, die den Himmel ersch\u00fcttern, brauchst du \
  meisterhafte Alchemie.\n\
  \n\
  Wenn du einen Gegenstand in seine 4- und 5-Sterne-Version umwandelst, zeigt sich sein wahres \
  verborgenes Potential.

r.alchemy_mastery_2a = Klingt beeindruckend.

m.alchemy_mastery_3a = Auf 4- und 5-Sterne-Niveau bietet Ausr\u00fcstung den besten Schutz und \
  Waffen die h\u00f6chste Leistung. Wenn du dort, wohin du unterwegs bist, am Leben bleiben m\u00f6\
  chtest, musst du ein Arsenal an 4- und 5-Sterne-Ausr\u00fcstung sammeln.\n\
  \n\
  Und denke daran - auf der 5-Sterne-Ebene verzweigen sich die Alchemiepfade noch weiter. Deine \
  Optionen werden zahlreicher, also plane sorgf\u00e4ltig.

r.alchemy_mastery_3a = Werde ich, Bosco, danke.

m.alchemy_mastery_4a = Bevor du aufbrichst, hier, ein paar Materialien f\u00fcr den Start. Viel Gl\u00fcck!

r.alchemy_mastery_4a = Gespr\u00e4ch beenden

# RANK 7-2
m.best_of_beast = Das Beste der Bestie
o.best_of_beast = Erfahre mehr \u00fcber die m\u00e4chtigsten Bestien und Glibber.
b.best_of_beast = Nach seiner k\u00fcrzlichen Bef\u00f6rderung tr\u00e4gt Hahn nun den Titel \
  "Chief Biotech". Er wurde \u00fcber deine letzten Erfolge unterrichtet und w\u00fcrde dir \
  gerne eine schnelle Einweisung dar\u00fcber geben, was du von Bestien und Glibbern zu \
  erwarten hast, wenn du dich dem Core n\u00e4herst.

m.best_of_beast_1a = Hallo, {0}, sch\u00f6n zu sehen, dass du noch lebst. Auch wenn es \
  normalerweise nicht zu den Aufgaben eines Chief Biotechs geh\u00f6rt, habe ich ausdr\u00fc\
  cklich um die Gelegenheit gebeten, dich in die Gefahren von Rang 3 des Uhrwerks einzuweisen. \
  Nicht, dass du noch aufgrund von Fehlinformationen irgendeines Anf\u00e4nger-Biotechs zu Tode \
  kommst.

r.best_of_beast_1a = Ah, danke, Hahn, es ist fast, als ob-

m.best_of_beast_2a = Ja gut, dann lass uns anfangen.\n\
  \n\
  Rang 3 ist am dichtesten am Core, und wie Gegenst\u00e4nde hohen Rangs reagieren auch Monster \
  auf seine Kraft. Viele von ihnen nehmen neue Formen an und sind dort am gef\u00e4hrlichsten. \
  Du musst dich vorbereiten, bevor du eine Mission antrittst.

r.best_of_beast_2a = In meinen n\u00e4chsten Missionen sollen mir haupts\u00e4chlich Bestien \
  und Glibber begegnen.

m.best_of_beast_3a = Sollte dir Bestien und Glibber auf Rang 3 begegnen, sei dir bewusst, dass \
  diese reinen Perforationsschaden verursachen k\u00f6nnen. Nur die beste Verteidigung gegen \
  Perforationsschaden wird dich gegen diese m\u00e4chtigen Gegner am Leben halten k\u00f6nnen.\n\
  \n\
  Wenn du deine n\u00e4chsten Mission erledigt hast, sprechen wir uns wieder, {0}.

r.best_of_beast_3a = Verstanden, Hahn. Bis bald.

m.in_cold_blood = Kaltbl\u00fctig
o.in_cold_blood = Bewahre die verlorene Truppe davor, Abendbrot f\u00fcr eine Entourage ekliger \
  Echsen zu werden.
b.in_cold_blood = Irgendwas hat die Chromalisks auf den Ebenen unter Emberlight geh\u00f6rig \
  aufgescheucht. Spiral HQ hat ein Team dorthin geschickt, um das zu untersuchen, doch es ist \
  sehr schnell vom Radar verschwunden. Nun haben sie ein Notsignal gesendet, dass sie auf Tiefe \
  21 von allen m\u00f6glichen Arten von Chromalisks eingekreist sind.\n\
  \n\
  Die Vermutung von Biotechnikern ist, dass die N\u00e4he zum Core die Chromalisks nerv\u00f6s \
  macht. Manche glauben, es k\u00f6nnte Paarungszeit sein. Ungeachtet der Gr\u00fcnde, das Team \
  muss gerettet werden, bevor es durch diese Echsen sein Ende findet!

m.vicious_viscous = Wild und viskos
o.vicious_viscous = Beweise deine Tapferkeit gegen eine Legion m\u00e4chtiger perforierender \
  Monster
b.vicious_viscous = Spiral HQ m\u00f6chte, dass du die Ebenen im Uhrwerk untersuchst, auf denen \
  sich die st\u00e4rksten Bestien und Glibber finden. Durch die Erforschung dieser Ebenen und \
  die \u00dcbertragung deiner Kampfdaten an Spiral HQ k\u00f6nnen alle Knights von deiner gef\u00e4\
  hrlichen Erfahrung profitieren.\n\
  \n\
  Es wird dringend empfohlen, dass du dich mit Verteidigung gegen Perforationsschaden und \
  Waffen mit Perforations- und Schatten-Schaden ausstattest.

m.monstrous_research_6 = Monstr\u00f6se Forschung
o.monstrous_research_6 = Bringe die verlangten Materialien zur Erforschung ins Spiral \
  Hauptquartier
b.monstrous_research_6 = Nachdem du Konfrontationen mit den Kiefern der kr\u00e4ftigsten Wolver \
  gemeistert hast, den Stacheln voll ausgewachsener Glibber entgangen bist und sogar die \
  abartigen Ausw\u00fcrfe von Virulisks \u00fcberstanden hast, hast du ohne Zweifel Proben von \
  diesen Begegnungen gesammelt, die f\u00fcr die Forschungsteams des Spiral HQ von gro\u00dfem Nutzen w\u00e4ren.

# RANK 7-3
m.creators_and_created = Erschaffer und die Erschaffenen
o.creators_and_created = Lerne die st\u00e4rksten Konstrukt- und Gremlin-Monster kennen
b.creators_and_created = Um vollst\u00e4ndig auf die vor dir liegenden Herausforderungen \
  vorbereitet zu sein, fragt Chief Biotech Hahn darum an, von dir kontaktiert zu werden, bevor \
  du dir zug\u00e4ngliche, neue Missionen in Angriff nimmst.

m.creators_and_created_1a = Hallo {0}, wie es scheint, hattest du nur wenig Probleme mit den \
  schleimigen Horden, was sicher nicht zuletzt an der guten Erkl\u00e4rung ihrer Gefahren vor \
  der Mission liegt.

r.creators_and_created_1a = Das und ein solides Arsenal, ja.

m.creators_and_created_2a = Kraft allein hilft nur bis zu einem gewissen Punkt, {0}. Schau dir \
  die Gremlins an. Auch wenn sie f\u00fcr sich genommen bereits stark sind, allein schon durch \
  ihre Anzahl, wird ihre Macht doch durch die von diesen kleinen pelzigen Genies erschaffene \
  Armee der Konstrukte vervielfacht.

r.creators_and_created_2a = Also wurden alle Konstrukte im Uhrwerk von den Gremlins geschaffen?

m.creators_and_created_3a = Nicht alle, aber die meisten von ihnen, so glaubt man, wurden \
  direkt nach Gremlin-Entw\u00fcrfen geschaffen, ja. Einige stehen unter der Kontrolle von \
  Gremlins, andere haben sich verselbst\u00e4ndigt und mit wieder anderen ist etwas v\u00f6llig anderes passiert.

r.creators_and_created_3a = Was meinst du?

m.creators_and_created_4a = Wir hatten einige F\u00e4lle, in denen Knights nicht-feindliche \
  Konstrukte begegnet sind, bei denen die Knights geschworen haben, diese Konstrukte h\u00e4tten sich wie f\u00fc\
  hlende bewusste Wesen verhalten. Aber das ist schwer zu glauben. Gremlins sind brilliant, \
  aber im Sinne von Ingenieurskunst, die ihre Aufgabe erledigt und nicht mehr. Rohe Kraft.\n\
  \n\
  K\u00fcnstliches Leben? Das ist etwas v\u00f6llig anderes.

r.creators_and_created_4a = Lass uns \u00fcber die feindlichen sprechen, denen ich vermutlich \
  begegnen werde.

m.creators_and_created_5a = Richtig. Spiral HQ sagt, dir werden auf deinen n\u00e4chsten \
  Missionen vermutlich Horden von Gremlins und Konstrukten gegen\u00fcberstehen. Denke daran, \
  dass diese Gegner auf Rang drei reinen Elementarschaden verursachen k\u00f6nnen. R\u00fcste \
  dich besser entsprechend aus.

r.creators_and_created_5a = Wird gemacht. Bis sp\u00e4ter, Hahn.

m.beyond_axes_of_evil = Jenseits der \u00c4xte des B\u00f6sen
o.beyond_axes_of_evil = Zerst\u00f6re die neue Gremlin-Abholzungs-Operation im Mosaik-Tal
b.beyond_axes_of_evil = Trotz deiner bisherigen Bem\u00fchungen haben Gremlins ihre Holzf\u00e4\
  llerei im Mosaik-Tal erneut gestartet, um ihre Munitionsfabriken mit Rohstoffen zu versorgen. \
  Angesichts der Resultate ihres vorherigen Projekts, den Roarmulus Twins, m\u00f6chte Spiral \
  HQ, dass du ihre Umweltzerst\u00f6rung beendest, bevor es zu Schlimmerem kommt!

m.spark_roar = Funken und Br\u00fcllen
o.spark_roar = Beweise deine Tapferkeit gegen eine Legion elementarer Elite-Monster
b.spark_roar = Eine ungew\u00f6hnlich hohe Konzentration von Konstrukten wurde entdeckt, die \
  einen Teil des Uhrwerks bewachen, der ein Versteck der Crimson Order sein k\u00f6nnte. Anders \
  als andere Monster scheinen Konstrukte sich nicht selbst vermehren zu k\u00f6nnen, was \
  bedeutet, dass jedes dekonstruierte Konstrukt ihre Reihen lichtet. Es wird eine sinnvolle \
  Unternehmung sein, ungeachtet dessen, ob die Crimson Order involviert ist.\n\
  \n\
  Spiral HQ m\u00f6chte, dass du diese Ebenen betrittst, das m\u00f6gliche Versteck \
  auskundschaftest und die Bedrohung durch die Konstrukte ausl\u00f6schst.\n\
  \n\
  Es wird dringend empfohlen, Ausr\u00fcstung mit Widerstand gegen Elementarschaden und Waffen \
  mit Elementar- und Schattenschaden zu verwenden!

m.cryptic_coder_spark_roar = Das Eiserne Gesetz ist fehlerhaft!\n\
  Die Crimson Order liegt falsch!\n\
  Die Neun sind blind, sie k\u00f6nnen die Wahrheit in der Tiefe nicht sehen.\n\
  Die Neun sind taub, sie k\u00f6nnen den Klang nicht h\u00f6ren, der mit und durch diese Welt \
  pulsiert.\n\
  \n\
  Herex dient nicht l\u00e4nger als einer der Neun.\n\
  Nur Herex sieht und h\u00f6rt die Wahrheit. Nur Herex wird bestehen.\n\
  Folge Herex und du wirst verschont werden.

m.monstrous_research_7 = Monstr\u00f6se Forschung
o.monstrous_research_7 = Bringe die verlangten Materialien zur Erforschung ins Spiral \
  Hauptquartier
b.monstrous_research_7 = Nachdem du gegen die Elite der Darkfang Clan Gremlins gek\u00e4mpft hast, den m\u00e4chtigen Schl\u00e4\
  gen der Lumber entgangen bist und die explosiven Blicke der Retrodes \u00fcberstanden hast, \
  hast du ohne Zweifel Proben von diesen Begegnungen gesammelt, die f\u00fcr die \
  Forschungsteams des Spiral HQ von gro\u00dfem Nutzen w\u00e4ren.

# RANK 8-1
m.darkest_forces = Dunkelste M\u00e4chte
o.darkest_forces = Erfahre mehr \u00fcber die m\u00e4chtigsten D\u00e4monen und Untoten
b.darkest_forces = Weil er geh\u00f6rt hat, dass deine n\u00e4chsten Missionen dich mit D\u00e4\
  monen und Untoten konfrontieren werden, hat Chief Biotech Hahn gebeten, dass du ihn \
  kontaktierst, bevor du zu diesen Missionen aufbrichst.

m.darkest_forces_1a = {0}, immer noch lebendig, und jetzt schon im Rang eines \
  Elite-Verteidigers. Bravo.\n\
  \n\
  Ich konnte die Daten deiner letzten K\u00e4mpfe analysieren, und das war wirklich \
  interessant. Insbesondere die Mecha-Knights reagieren auf deine Angriffe, als w\u00fcrden sie \
  improvisieren. Aber genau kann ich das noch nicht sagen.\n\
  \n\
  Aber das spielt keine Rolle f\u00fcr die Informationen, die ich heute pr\u00e4sentiere.

r.darkest_forces_1a = Ja, meine n\u00e4chsten Missionen drehen sich um D\u00e4monen und Untote. \
  Klingt spa\u00dfig.

m.darkest_forces_2a = Du hast seltsame Vorstellungen von Spa\u00df. Auf Rang 3 sind D\u00e4\
  monen und Untote kein Zuckerschlecken, sondern in der Tat unter den furchtbarsten Kreaturen, \
  die man in der N\u00e4he des Core finden kann.\n\
  \n\
  D\u00e4monisches Management scheint dort unten am furchtbarsten zu sein, was zu besonders \
  gewaltt\u00e4tigen Devilites f\u00fchrt.

r.darkest_forces_2a = Die waren noch nie wirklich einfach...

m.darkest_forces_3a = Genau, und jetzt sind sie noch \u00fcbler. Und das gleiche gilt f\u00fcr \
  Untote. Besonders die Howlitzer werden extrem l\u00e4stig mit ihren verbesserten Schu\u00df- und Zielsuchf\u00e4higkeiten.\n\
  \n\
  Du musst dich auch darauf vorbereiten, dass D\u00e4monen und Untote potentiell reinen \
  Schattenschaden austeilen k\u00f6nnen. Wie immer solltest du darauf achten, die passende Ausr\u00fc\
  stung dabei zu haben, falls du lange genug leben willst, um erneut von mir zu h\u00f6ren.

r.darkest_forces_3a = Na, das will ich ja sicher nicht verpassen.

m.darkest_forces_4a = Ja, eine gr\u00f6\u00dfere Trag\u00f6die kann ich mir nicht vorstellen. \
  Dann viel Gl\u00fcck, {0}.

r.darkest_forces_4a = Gespr\u00e4ch beenden

m.return_of_ur = Die R\u00fcckkehr von Ur
o.return_of_ur = Halte die Devilites davon ab, eine Armee alptraumhafter trojanischer Krieger \
  zu beschw\u00f6ren
b.return_of_ur = Sp\u00e4her haben tief in einer d\u00e4monischen Stadt Devilites entdeckt, die \
  versuchen, eine Legion m\u00e4chtiger trojanischer Krieger zu beschw\u00f6ren. Nach einem \
  abgefangenen internen Memo der Devilites sind die Trojaner als "Legion von Ur" bekannt und \
  sollen einst in Tausenden gez\u00e4hlt haben. Seltsamerweise deutet das Memo an, dass die \
  Legion von Ur in der Unterwelt eingesperrt worden sein soll und dass eine Alternative \
  notwendig sei, um sie zur\u00fcckzubringen.\n\
  \n\
  Wie auch immer die Devilites versuchen, tausende Trojaner ins Uhrwerk zu bringen, sie m\u00fc\
  ssen aufgehalten werden. Infiltriere ihre Stadt und stoppe die D\u00e4monenarmee, bevor sie \
  unaufhaltbar wird!

m.weight_of_darkness = Gewicht der Dunkelheit
o.weight_of_darkness = Beweise deine Tapferkeit gegen eine Legion \u00fcberlegener \
  Schattenmonster
b.weight_of_darkness = Es wird spekuliert, dass alle D\u00e4monen im Uhrwerk aus einer anderen \
  Dimension stammen, die als Unterwelt bekannt ist. Auch wenn nicht klar ist, wie und warum sie \
  hier nach Cradle gekommen sind, legen die in d\u00e4monischen St\u00e4dten gesammelten Daten \
  nahe, dass sie nun wie wir auf Cradle festsitzen.\n\
  \n\
  Die Untoten dagegen bleiben ein R\u00e4tsel. Es ist nicht bekannt, warum Geister in die \
  materielle Welt zur\u00fcckkehren, auch wenn klar ist, dass viele von ihnen auf Cradle von \
  anderen Welten stammen. Wenn man ber\u00fccksichtigt, wie feindselig diese Kreaturen sein k\u00f6\
  nnen, ist der einzige Weg, n\u00fctzliche Informationen zu erhalten, durch direkte \
  Interaktion wie den Kampf.\n\
  \n\
  Spiral HQ bittet, dass du Kampfdaten f\u00fcr die m\u00e4chtigen D\u00e4monen und Untoten in \
  Rang 3 des Uhrwerks sammelst, so dass wir die Natur dieser Gesch\u00f6pfe besser verstehen.\n\
  \n\
  Es wird dringend empfohlen, Ausr\u00fcstung mit Verteidigung gegen Schattenschaden sowie \
  Waffen mit Elementar- und Perforationsschaden zu verwenden!

m.monstrous_research_8 = Monstr\u00f6se Forschung
o.monstrous_research_8 = Bringe die verlangten Materialien zur Erforschung ins Spiral \
  Hauptquartier
b.monstrous_research_8 = Nachdem du sogar die furchterregensten Zombies zu Staub zerschlagen \
  hast, den kalten F\u00e4ngen der Grimalkins entgangen bist und sogar im Kampf gegen eine \
  Armee von Trojans siegreich warst, hast du ohne Zweifel Proben von diesen Begegnungen \
  gesammelt, die f\u00fcr die Forschungsteams des Spiral HQ von gro\u00dfem Nutzen w\u00e4ren.

# RANK 8-2
m.becoming_champion = Werde ein Champion
o.becoming_champion = Sprich mit Lieutenant Feron \u00fcber Comlink
b.becoming_champion = Nachdem er von deinen Leistungen und deinen vielen erfolgreichen \
  Missionen, die du f\u00fcr das Spiral HQ abgeschlossen hast, geh\u00f6rt hat, w\u00fcrde \
  Lieutenant Feron gerne mit dir sprechen.

m.becoming_champion_1a = Sei gegr\u00fc\u00dft, {0}. Es ist ein Weilchen her, seit ich dich das \
  erste Mal getroffen habe, als du gerade aus dem Rettungslager angekommen warst. Du hast dich \
  weit entwickelt seitdem, bis zum Rang eines Elite-Verteidigers.\n\
  \n\
  Du bist ein talentierter Knight, {0}. Ich habe keinen Zweifel, dass du schon bald ein \
  Champion der Spiral Knights sein und eine gro\u00dfe Rolle in der L\u00f6sung des R\u00e4tsels, das der Core f\u00fc\
  r uns ist, und bei der Wiederherstellung der Skylark und unserer R\u00fcckkehr nach Hause \
  spielen wirst. Du hast bewiesen, dass du das Zeug dazu hast, dich den Legionen der dunklen M\u00e4\
  chte zu stellen, die unter der Oberfl\u00e4che lauern.

r.becoming_champion_1a = Ich k\u00e4mpfe bis zum Schluss, Lieutenant. Ich weiss, was auf dem \
  Spiel steht.

m.becoming_champion_2a = Wie ich h\u00f6re hat Spiral HQ Missionen f\u00fcr dich vorbereitet, \
  die eines wahren Champions w\u00fcrdig sind. Aber um einer zu werden, brauchst du die \
  richtige Ausr\u00fcstung.\n\
  \n\
  Ich vertraue dir die Werkzeuge an, die du brauchst, um so ein Champion zu werden. Mit diesen \
  Rezepten kannst du die beste Ausr\u00fcstung bauen, die die Spiral Order hat. Mit ihnen \
  stehen dir die Azure-Guardian-R\u00fcstung, die Leviathan Blade und der Schutz des Aegis zur \
  Verf\u00fcgung.

r.becoming_champion_2a = Ich f\u00fchle mich geehrt, Lieutenant.

m.becoming_champion_3a = Dann nutze sie ehrenhaft und lasse sie dich vor dem Zorn der zahllosen \
  Feinde sch\u00fctzen, die dir bald begegnen werden. Der Core, den wir suchen - etwas an ihm \
  ist wahrhaftig schauderhaft. Ich weiss, dass es gut m\u00f6glich ist, dass er uns den Weg \
  nach Hause erm\u00f6glichen kann, aber ich werde das Gef\u00fchl nicht los, dass wir die \
  Sache komplett falsch angehen.

r.becoming_champion_3a = Was meinst du?

m.becoming_champion_4a = Ich meine, der Core ist keine gro\u00dfe Batterie ist, der diese Welt \
  antreibt. Eher ist er und diese ganze Welt ein massives Gef\u00e4ngnis, daf\u00fcr \
  geschaffen, etwas davon abzuhalten, ihn zu verlassen.\n\
  \n\
  Denke mal an unsere Geo-Scans von Cradle kurz vor dem Absturz - sie zeigen, dass Cradle aus \
  hunderten Platten anderer Welten besteht, fast wie Schichten einer R\u00fcstung. Und dann ist \
  da das Uhrwerk, das Unnat\u00fcrlichste, was ich je gesehen habe. Eine ganze Welt, deren \
  einziger Zweck es zu sein scheint, jeden vom Erreichen des Core abzuhalten.

r.becoming_champion_4a = Da k\u00f6nnte was dran sein, Lieutenant.

m.becoming_champion_5a = Ich habe seit einiger Zeit mit Spiral HQ dar\u00fcber gesprochen, und \
  sie sind bereit, diese Sache n\u00e4her zu untersuchen. Aber ich glaube nicht, dass sie vom \
  Ziel, den Core zu \u00f6ffnen, so bald ablassen werden. Das ist immer noch die h\u00f6chste Priorit\u00e4t im Moment.\n\
  \n\
  Ich kann nur sagen, sei vorsichtig da drau\u00dfen, {0}. Ich glaube, diese Welt h\u00e4lt mehr \u00dcberraschungen f\u00fc\
  r uns bereit, als wir wissen.

r.becoming_champion_5a = Verstanden.

m.vile_engine = Die scheu\u00dfliche Maschine
o.vile_engine = Finde und zerst\u00f6re die bizarren Glibbergeneratoren unter der \
  Lichen-Kolonie
b.vile_engine = Irgendwo unter einer Ebene, in der sich Lichen eingenistet haben, liegt eine \
  seltsame Fabrik unbekannten Ursprungs, die anscheinend f\u00fcr die Produktion toxischer \
  Glibber genutzt wird. Diese Schleimgeneratoren sind in der Lage, schnell Glibber zu \
  produzieren, die dann nahe Ebenen bev\u00f6lkern.\n\
  \n\
  Truppen in benachbarten Ebenen haben bereits von \u00fcberw\u00e4ltigenden Mengen an giftigen \
  Glibbern berichtet, die es unm\u00f6glich machen, Expeditionen jenseits von Tiefe 23 durchzuf\u00fc\
  hren. Es wird Zeit, dass ein Knight deines Kalibers ein Team bildet, um diese merkw\u00fc\
  rdige Fabrik zu infiltrieren und die Produktion dieser scheu\u00dflichen Kreaturen zu \
  beenden.\n\
  \n\
  Alle Daten, die du \u00fcber ihren Ursprung sammelst, w\u00fcrden sehr n\u00fctzlich f\u00fcr Spiral HQ sein.

m.rotting_metropolis = Die verrottende Metropole
o.rotting_metropolis = Untersuche das Schicksal der verlorenen Truppe in der toxischen Stadt
b.rotting_metropolis = Es scheint, als w\u00e4ren diese Glibbergeneratoren schon viel l\u00e4\
  nger da, als wir dachten, und als h\u00e4tten sie ihre scheu\u00dflichen Gifte in alle nahen \
  Ebenen verbreitet.\n\
  \n\
  Eine moderne Stadt \u00e4hnlich den von D\u00e4monen bewohnten scheint von diesen Giften \u00fc\
  berflutet zu sein und ist wahrscheinlich deshalb von Gremlins und D\u00e4monen verlassen \
  worden. Jetzt treiben dort Horden von Glibbern und Untoten ihr Unwesen und schw\u00e4ren in den giftigen D\u00e4\
  mpfen. Eine Truppe, die versucht hat, die Stadt zu durchqueren, wird vermisst. Weil die Luft \
  dort so giftig ist, muss dringend ein erfahrenes Team die Stadt betreten und die Truppe \
  retten, sonst gibt es kaum Hoffnung f\u00fcr sie.

m.great_escape = Die gro\u00dfe Flucht
o.great_escape = Infiltriere das Gremlingef\u00e4ngnis, befreie die gefangenen Knights und \
  breche aus
b.great_escape = Aufkl\u00e4rer berichten, dass die Crimson Order der Gremlins Befehl erteilt \
  hat, improvisierte Gef\u00e4ngnisse im Uhrwerk zu bauen, um dort Spiral Knights gefangen zu \
  halten. Es wird vermutet, dass diese Befehle eine direkte Reaktion darauf sind, dass du die \
  Roarmulus Twins vernichtet hast.\n\
  \n\
  Weitere Daten legen nahe, dass diese improvisierten Gef\u00e4ngnisse eine vor\u00fcbergehende L\u00f6sung sind, bis ein gr\u00f6\u00df\
  erer Komplex gebaut werden kann. Spiral HQ hat aber nicht vor, die Knights so lange dort zu \
  lassen, bis sie das herausfinden.

m.great_escape_1a = \u00dcberraschung! Sieht aus, als h\u00e4ttest du den K\u00f6der \
  geschluckt. Das ist gut, denn ich brauche Versuchskaninchen f\u00fcr meine neueste Erfindung.

m.great_escape_2a = Siehe! Der Sparkcaster 9000 Deluxe! Ein Meilenstein der \
  Gremlin-Ingenieurskunst!

m.great_escape_3a = Einer was das letzte Mal eindeutig nicht genug.. also gibt es jetzt zwei! \
  ZWEI! Brilliant!

m.great_escape_4a = Hah! Du wirst mich nie erwischen, in meinem 'Raum der Unbesiegbarkeit'! Du \
  wirst f\u00fcr immer in diesem Kontrollraum gefangen sein! ... \u00c4hm, warte, ich k\u00f6nnte da etwas \u00fcbersehen haben...

m.hall_of_heroes_4 = Halle der Helden
o.hall_of_heroes_4 = Besuche die Halle der Helden, wenn du 5-Sterne-Ausr\u00fcstung tr\u00e4\
  gst, und erhalte deine Zertifikation
b.hall_of_heroes_4 = Um  tief genug ins Uhrwerk vordringen zu d\u00fcrfen, um den Core zu \
  erreichen, musst du die Halle der Helden aufsuchen und mit Lieutenant Barrus sprechen, um \
  deine 5-Sterne-Zertifikation zu erhalten.

#Conversation (used at in the hall):
m.hall_of_heroes_4_2a = Seid gegr\u00fc\u00dft, {0}. Sch\u00f6n, dich mal wieder zu sehen. \
  Wenige Knights schaffen es so weit und sammeln ein so m\u00e4chtiges Arsenal.\n\
  \n\
  Nun, {0}, f\u00fcr deine 5-Sterne-Zertifikation musst du 5* oder bessere R\u00fcstung, Helm, \
  Schild und Waffe ausger\u00fcstet haben.

m.hall_of_heroes_4_3a = Gl\u00fcckwunsch, {0}, du erf\u00fcllst die Voraussetzungen und hast \
  deine 5-Sterne-Zertifikation erhalten. Nimm den Fahrstuhl hinter mir, um deine Mission \
  abzuschlie\u00dfen.

m.hall_of_heroes_4_3b = Es tut mir leid, {0}, aber du erf\u00fcllst nicht die notwendigen \
  Voraussetzungen. Bitte spreche erneut mit mir, wenn du R\u00fcstung, Helm, Schild und eine \
  Waffe mit mindestens 5 Sternen ausger\u00fcstet hast.

# RANK 9-1
m.ending_in_fire = Ende im Feuer
o.ending_in_fire = Kontaktiere Agent Kora \u00fcber Comlink
b.ending_in_fire = Eine seltsame Energieanomalie wurde in den Ebenen direkt \u00fcber dem Core \
  entdeckt. Wende dich an Agent Kora, um Details zu erfahren.

m.ending_in_fire_1a = Hallo, {0}, und Gl\u00fcckwunsch zum Erreichen des Rangs eines Champions. \
  Es sei mir gestattet zu erw\u00e4hnen, dass du nach meiner Erfahrung eines solchen Titels \
  wahrhaft w\u00fcrdig bist. Dank dir sind so viele Knights sicher an die Oberfl\u00e4che zur\u00fc\
  ckgekehrt und wir haben so viel mehr \u00fcber das Uhrwerk erfahren.

r.ending_in_fire_1a = Danke, Kora, ich plane, der Erste zu sein, der den Core erreicht!

m.ending_in_fire_2a = Bei dieser Geschwindigkeit k\u00f6nnte das glatt sein, {0}! Aber nach \
  neuesten Informationen wird das nicht einfach sein.

r.ending_in_fire_2a = Was hast du f\u00fcr mich?

m.ending_in_fire_3a = Wir dachten, dass die Dinge so langsam vorhersagbar werden, selbst in den \
  Tiefen, die du erforscht hast. Der Core war in Sicht. Aber jetzt ist eine enorme \
  Energieanomalie \u00fcber dem Core aufgetaucht, die den Zugang blockiert. Sp\u00e4her \
  berichten, sie sehen dort nur Feuer, nichts als Feuer.\n\
  \n\
  Wir wissen noch nicht, worum es sich handelt, aber Truppen in diesen Tiefen werden bereits \
  vermisst. Das sind schlechte Neuigkeiten.

r.ending_in_fire_3a = Wie kann ich helfen?

m.ending_in_fire_4a = Wir brauchen dich, um die umgebenden Ebenen zu erforschen und so viele \
  Informationen zu sammeln, wie du kannst. Du kannst mit einem Owlite-Schloss anfangen, das k\u00fcrzlich in der N\u00e4\
  he der Anomalie aufgetaucht ist.

r.ending_in_fire_4a = Verstanden, Kora, ich bin unterwegs.

m.occurance_at_owlite_keep = Erscheinung im Owlite-Schlo\u00df
o.occurance_at_owlite_keep = Finde das antike Buch im Owlite-Spukschlo\u00df
b.occurance_at_owlite_keep = Eine ungew\u00f6hnliche Informationsquelle ist aus der \
  Einwohnerschar von Moorcroft Manor hervorgetreten. Einige der Spookats, die es ihr Zuhause \
  nennen, haben einen unserer Aufkl\u00e4rer-Knights kontaktiert, der dort zu Besuch war und \
  Details \u00fcber die Unmenge an negativer Energie preisgegeben, die \u00fcber dem Core \
  aufgetaucht ist.\n\
  \n\
  Sie nennen es 'einen Ort voll brennendem Hass' und 'ein Gef\u00e4ngnis finsterer Seelen' und \
  sie sagen man kann alles dar\u00fcber in 'einem dieser komischen Owlite-B\u00fccher' in einer \
  der Owlite-Festungen lesen.\n\
  \n\
  Wenn was sie sagen wahr ist, dann k\u00f6nnte Spiral HQ wertvolle Informationen durch eine \
  Untersuchung einer Owlite-Festung gewinnen. Denk nur daran, dass diese Owlite-Bauwerke nur so \
  vor verlorenen Seelen und untoten Monstern wimmeln. Bereite dich entsprechend vor.

n.occurance_at_owlite_keep = Text des Owlite-W\u00e4lzers:
m.occurance_at_owlite_keep_1a = (Dies scheint der W\u00e4lzer zu sein, von dem die Spookats \
  berichteten, er beschreibe den Ort \u00fcber dem Core. Die Seiten sind sehr abgenutzt, und \
  nur Teile des originalen Texts sind lesbar.)

r.occurance_at_owlite_keep_1a = Weiterlesen

m.occurance_at_owlite_keep_2a = ...Diese Welt war Zeuge gr\u00f6\u00dferer Trag\u00f6dien als \
  dem Sturz des gro\u00dfen K\u00f6nigreichs von Almire. Einst war sie ein lebendiges wundsch\u00f6nes Reich dichter W\u00e4\
  lder und weiter Ebenen...\n\
  \n\
  ...benachbarte K\u00f6nigreiche erkl\u00e4rten den Krieg...\n\
  \n\
  ...auf der Suche nach der Macht, das Blatt zu wenden, floh Lord Vanaduke von Almire in die \
  Berge...

r.occurance_at_owlite_keep_2a = Weiterlesen

m.occurance_at_owlite_keep_3a = ...kehrte als etwas Unnat\u00fcrliches zur\u00fcck...\n\
  \n\
  ...endloses Inferno...\n\
  \n\
  ...Almire zerst\u00f6rt...\n\
  \n\
  ...sie k\u00f6nnen nie fliehen, nie den Flammen entkommen...

r.occurance_at_owlite_keep_3a = Weiterlesen

m.occurance_at_owlite_keep_4a = (Die \u00fcbrigen Seiten sind zu verwittert, um noch etwas au\u00df\
  er dem Datum zu erkennen, an dem die beschriebenen Ereignisse stattfanden. Dieses legt nahe, \
  dass das K\u00f6nigreich von Almire vor \u00fcber tausend Jahren zerst\u00f6rt wurde.)

r.occurance_at_owlite_keep_4a = Lesen beenden

m.aggressive_assembly = Aggressive Fertigung
o.aggressive_assembly = Rette das verschollene Team und setze den Vorarbeiter der Fabrik ausser \
  Gefecht.
b.aggressive_assembly = Aggressive Fertigung - Einsatzbesprechung

m.silent_legion = Die schweigende Legion
o.silent_legion = Folge Guardian Knight Arkus und bringe ihn zur\u00fcck nach Haven
b.silent_legion = Guardian Knight Arkus war einer der besten Krieger, die den Spiral Knights je \
  gedient haben, bis kurz nach dem Absturz. Als eines der ersten, das nach dem Alpha Squad \
  gesucht hat, ist Arkus' eigenes Team bei einem grausigen Kampf gegen eine Horde Staub-Zombies \
  verschwunden. Seit diesem Zeitpunkt gibt sich Arkus die Schuld an diesem Verlust, \u00fc\
  berzeugt, dass er seinen Eid als Besch\u00fctzer - n\u00e4mlich sein Team zu besch\u00fctzen - gebrochen hat.\n\
  \n\
  Arkus zieht nun allein durch das Uhrwerk, um, wie wir glauben, niemals wieder den Verlust \
  eines Teams zu riskieren, und versucht irgendwie diejenigen zu finden, die er damals verloren \
  hat. Als diese Expeditionen begannen, immer selbstzerst\u00f6rerischer zu erscheinen, hat \
  Spiral HQ ihm den Befehl gegeben, damit aufzuh\u00f6ren.\n\
  \n\
  Arkus hat die Befehle ignoriert, ist tief ins Uhrwerk hinuntergestiegen und noch nicht wieder \
  zur\u00fcckgekehrt. Spiral HQ m\u00f6chte nicht auch noch dieses letzte Mitglied seines Teams \
  verlieren und bittet dich, ihm zu folgen. Sein letzter bekannter Aufenthaltsort ist eine Art \
  mysteri\u00f6ser Galerie auf Tiefe 26.

r.end_module = Modul schlie\u00dfen
n.recon_module = Aufkl\u00e4rungsmodul
m.silent_legion_recon_mod = Es zieht mich an diesen Ort.\n\
  \n\
  In den Augen der stillen Krieger sehe ich mich selbst: kalt, stark, unnachgiebig... und \
  verfallend. Man hat mich gebeten loszulassen, weiterzugehen, aber das kann ich nicht tun.\n\
  \n\
  Ihre Gesichter, ihre Todesschreie... sie haben mich in meinen Tr\u00e4umen verfolgt, also \
  schlafe ich nicht mehr. Jetzt sehe ich sie, wenn ich die Augen schlie\u00dfe, also werde ich \
  nicht blinzeln.\n\
  \n\
  Ich werde hier verweilen, zwischen den Steinen... niemals blinzelnd, niemals vergessend.


m.silent_legion_1a = Haben sie dich wegen mir geschickt? Um mich zur\u00fcckzubringen? Nein, \
  ich bin nun dort, wohin ich geh\u00f6re. Ich diene nicht mehr der Spiral Order und werde hier \
  bleiben.\n\
  \n\
  Verlasse diesen Ort und komme niemals zur\u00fcck. Lass mich zufrieden.

m.silent_legion_2a = Ich k\u00f6nnte schw\u00f6ren, ich habe sie gerade geh\u00f6rt, ihre \
  Stimmen vom Wind getragen. Nicht l\u00e4nger Schreie, nicht l\u00e4nger Klagerufe- Fl\u00fcstern. Unverst\u00e4\
  ndlich, selbst in der Stille dieses Ortes. Lassen sie mich hier? Warum werde ich zur\u00fcck gelassen?\n\
  \n\
  Du... Ich habe dich gewarnt, nicht weiterzugehen, bleib weg von mir. Jetzt wirst du erfahren, \
  was sie getan haben... dass alle, die mir nahe sind, sterben!

m.silent_legion_3a = Seine gefallene Form strahlt eine unglaubliche Traurigkeit ab. Seine Augen \
  verblassen und Dunkelheit \u00fcberstr\u00f6mt ihn. Arkus ist verloren.

# RANK 9-2
m.eye_of_needle = Nadel\u00f6hr
o.eye_of_needle = Kontaktiere Agent Kora \u00fcber Comlink
b.eye_of_needle = Nach der \u00dcberpr\u00fcfung der Daten, die du in der Owlite-Festung \
  gesammelt hast und durch zus\u00e4tzliche, von Aufkl\u00e4rer-Knights gesammelte \
  Informationen, hat Agent Kora eine Einsatzbesprechung f\u00fcr dich vorbereitet hinsichtlich \
  der Menge negativer Energie, die den Zugang zum Core blockiert.

m.eye_of_needle_1a = {0}, ich bin froh, dass du anrufst. Ich habe etwas Gro\u00dfes f\u00fcr dich.

r.eye_of_needle_1a = Was denn, Kora?

m.eye_of_needle_2a = Die massive negative Energie, die wir untersucht haben, ist ein Teil eines \
  antiken K\u00f6nigreichs namens Almire, des gleichen Reichs, von dem der Owlite-W\u00e4lzer \
  handelte, den du entdeckt hast!

r.eye_of_needle_2a = Aber der W\u00e4lzer legte nahe, dass Almire vor \u00fcber tausend Jahren zerst\u00f6rt wurde...

m.eye_of_needle_3a = Genau! Also was zum Teufel macht es jetzt im Uhrwerk? Es ergibt einfach \
  keinen Sinn.\n\
  \n\
  Wenn wir glauben, dass in der Tat ein verlorenes K\u00f6nigreich irgendwie auf einer massiven \
  mechanischen Welt der heutigen Zeit gelandet ist, bleibt die Frage: Wieso?

r.eye_of_needle_3a = Und wieso blockiert es den Zugang zum Core, wo wir so kurz davor stehen?

m.eye_of_needle_4a = Es ist schon ein merkw\u00fcrdiger Zufall. Aber haben Gremlins wirklich so \
  viel Macht? Ich vermute etwas, das jenseits ihrer Ingenieursf\u00e4higkeiten liegt.\n\
  \n\
  Wie dem auch sei, dieses Almire ist kein K\u00f6nigreich mehr. Alles, was geblieben ist, ist \
  eine gro\u00dfe Zitadelle, die von endlosen Flammen umgeben ist und von Spiral HQ \
  "Feuersturm-Zitadelle" genannt wird. Soweit wir es sagen k\u00f6nnen, ist es wie ein Fort \
  gebaut, und es wimmelt dort von Untoten.

r.eye_of_needle_4a = Ich sch\u00e4tze, der einzige Weg zum Core f\u00fchrt durch die \
  Feuersturm-Zitadelle?

m.eye_of_needle_5a = Es scheint so. Und dieser Ort strahlt das B\u00f6se f\u00f6rmlich aus, es \
  ist fast unbeschreiblich. Er beeinflusst sogar die Ebenen, die ihn umgeben - \u00fcberall \
  brechen Feuer aus.\n\
  \n\
  Du bist einer der Besten, die wir haben, {0}, und wenn einer eine Truppe durch die Zitadelle \
  f\u00fchren kann, bist du das. Aber es wird nicht leicht, sie zu erreichen. Wir m\u00fcssen \
  uns um ein paar Feuer k\u00fcmmern und Informationen sammeln, bevor wir die Tore st\u00fcrmen.

r.eye_of_needle_5a = Verstanden. Also hast du eine Reihe Missionen f\u00fcr mich?

m.eye_of_needle_6a = In der Tat. Lass uns damit anfangen, ein paar Feuer zu l\u00f6schen und \
  dann werden wir schauen, wie wir zur Zitadelle gelangen. Bei diesem Widerstand ist es eine \
  Eins-zu-einer-Million-Chance.\n\
  \n\
  Viel Gl\u00fcck, {0}.

r.eye_of_needle_6a = Gespr\u00e4ch beenden

m.terminal_meltdown = Terminale Schmelze
o.terminal_meltdown = Zerst\u00f6re die feurigen Monster im Treibstofflager und verhindere eine \
  brennende Katastrophe
b.terminal_meltdown = Von der Feuersturm-Zitadelle angezogen hat eine Horde feuriger Glibber \
  ein nahes Treibstofflager \u00fcberrannt und gef\u00e4hrdet damit unseren Zugang zur \
  Zitadelle. Sollten diese Glibber die Treibstofff\u00e4sser anz\u00fcnden, wird das ganze \
  Lager in Flammen aufgehen.\n\
  \n\
  Spiral HQ braucht dich, um ins Lager vorzudringen und die Feuer zu l\u00f6schen, bevor die \
  Zeit abl\u00e4uft und eine katastrophale Explosion ausgel\u00f6st wird!

m.alone_in_dark = Allein in der Dunkelheit
o.alone_in_dark = Kontaktiere eine verlorene Seele von Almire auf dem Soldatenfriedhof
b.alone_in_dark = Die Spookats aus Moorcroft Manor haben einige weitere, wertvolle Hinweise f\u00fc\
  r uns, die zu untersuchen sich lohnt. Sie sagen, dass eine verlorene Seele aus dem fr\u00fcheren K\u00f6\
  nigreich Almire im Soldatenfriedhof nahe der Feuersturm-Zitadelle zu finden ist. Diese Seele \
  ist bereit, uns Details \u00fcber das Wesen der Zitadelle zu geben und auch dar\u00fcber, wie \
  wir durch sie hindurch, zum Core gelangen k\u00f6nnen.\n\
  \n\
  Es wird nicht einfach sein, dorthin zu gelangen, sieht man sich den Aufenthaltsort an. Friedh\u00f6\
  fe sind schreckliche Orte, besonders auf dieser Tiefe. Es wird dringend dazu geraten, dass du \
  dich so z\u00fcgig wie m\u00f6glich durch diesen Friedhof bewegst, w\u00e4hrend du nach \
  dieser verlorenen Seele suchst.

#Conversation (in level):
n.alone_in_dark = Verlorene Seele von Almire
m.alone_in_dark_1a = (Du siehst die verlorene Seele von Almire vor dir stehen. In seinem \
  Gesicht siehst du eine tiefe Trauer. Mit in die Ferne gerichtetem Blick beginnt er ohne \
  Vorstellung zu sprechen.)\n\
  \n\
  Lord Vanaduke brachte das Feuer von den Bergen in unser K\u00f6nigreich. Alles brannte. Seine \
  Feinde. Selbst seine Familie.\n\
  \n\
  Meine Familie war ebenfalls verloren. Ich floh von der Schlacht, sobald ich die Welle der \
  Flammen in der Ferne sah. Ich erreichte mein Heim gerade rechtzeitig, um es brennen zu sehen. \
  Ich kann mich nicht mal erinnern, wie es endete. Ich habe keine Erinnerung an mein Sterben.

r.alone_in_dark_1a = Weiter zuh\u00f6ren

m.alone_in_dark_2a = Lord Vanaduke herrscht nun \u00fcber die Zitadelle. Seine Seele ist in \
  einem f\u00fcrchterlichen gepanzerten Gef\u00e4ngnis gebunden.\n\
  \n\
  Er sorgt daf\u00fcr, dass die Zitadelle allzeit kampfbereit ist, im Glauben, dass sein K\u00f6\
  nigreich immer noch belagert wird. Er versteht nicht mal, dass das, was er zu sch\u00fctzen \
  sucht, seit tausend Jahren verloren ist.

r.alone_in_dark_2a = Weiter zuh\u00f6ren

m.alone_in_dark_3a = Solltest du versuchen, die Zitadelle zu betreten und den Thron zu \
  erreichen, beende bitte sein Leiden. Erlaube seiner Seele, die er an diese Welt gebunden hat, \
  zu seinen Liebsten zur\u00fcckzukehren.\n\
  \n\
  Und eine Sache noch - ich habe geh\u00f6rt, dass eine Kraft der Natur einst versuchte, seine \
  Fehler zu korregieren, aber Lord Vanaduke sperrte sie irgendwo in seinem Fort ein. Sie zu \
  finden und zu befreien, k\u00f6nnte sich als n\u00fctzlich erweisen.

r.alone_in_dark_3a = Danke.

m.alone_in_dark_4a = (Die verlorene Seele starrt weiter in die Ferne und sagt nichts.)

r.alone_in_dark_4a = Gespr\u00e4ch beenden

m.the_gauntlet = Der Spie\u00dfrutenlauf
o.the_gauntlet = K\u00e4mpfe dich durch die Feuersturm-Zitadelle gegen ein Bollwerk von monstr\u00f6ser Macht.
b.the_gauntlet = Ein letzter Kampf steht noch zwischen dir und dem Erreichen der \
  Feuersturm-Zitadelle. Wohl von Lord Vanaduke selbst erdacht, wimmelt dieser unerbittliche \
  Spie\u00dfrutenlauf nur so vor allen m\u00f6glichen Arten finsterer Kreaturen und steigert \
  sich bis hin zu einem Ende in einer alptraumhaften Kampfarena, die man \u00fcberwinden muss, \
  um Zugang zu den Toren der Feuersturm-Zitadelle Citadel zu erlangen.\n\
  \n\
  Diese Mission wird dir alles abverlangen und es braucht ein Arsenal m\u00e4chtiger Waffen und Ausr\u00fc\
  stung. Wenn Lord Vanaduke dich pr\u00fcft, dann liefere ihm den denkw\u00fcrdigen Kampf, \
  nachdem er zu verlangen scheint, und zeige ihm, was ein wahrer Champion vollbringen kann!

# RANK 9-3
m.heart_of_matter = Der Kern der Sache
o.heart_of_matter = Kontaktiere Lieutenant Vaelyn \u00fcber Comlink
b.heart_of_matter = Lieutenant Vaelyn f\u00fchrte den ersten Trupp ins Uhrwerk der versucht \
  hat, das Alpha Squad zu lokalisieren. Sie ist eine talentierte Gruppenf\u00fchrerin, man \
  sagt, auf Augenh\u00f6he mit Euclid selbst. Vaelyn hat ihre Suche nie aufgegeben und versucht \
  nun, ein Team f\u00fcr Untersuchungen des Core direkt vor Ort zusammenzustellen, um den Ort \
  besser zu verstehen, von dem man glaubt, dass sich dort die Spur des Alpha Squad verliert.

m.heart_of_matter_1a = Hallo, {0}, ich wollte schon seit einiger Zeit mit dir reden, aber es \
  scheint, Spiral HQ h\u00e4lt dich gut auf Trab.

r.heart_of_matter_1a = Hallo, Lieutenant! Wie kann ich helfen?

m.heart_of_matter_2a = Wie du weisst, versuche ich  ein Forschungsteam zusammenzustellen, das \
  direkt vor Ort beim Core Terminal arbeiten soll. Um ihn effektiv nutzen und zur Reparatur der \
  Skylark einsetzen zu k\u00f6nnen, ist es zwingend notwendig, dass wir ihn erreichen und die \
  Forschungs-Station errichten.\n\
  \n\
  Alles deutet darauf hin, dass du das Potential besitzt, letztendlich den Core zu erreichen. \
  Wenn wir durch die Feuersturm-Zitadelle durchbrechen und eine Verbindung zum Core herstellen \
  w\u00fcrden, k\u00f6nnte mein Team die n\u00f6tigen Versorgungswege einrichten und sich \
  sofort an die Arbeit machen. Aber das k\u00f6nnen wir nicht, so lange diese h\u00f6llische \
  Zitadelle und ihr f\u00fcrchterlicher Herrscher uns im Weg sind.

r.heart_of_matter_2a = Ich habe mich darauf vorbereitet, mich der Feuersturm-Zitadelle zu \
  stellen. Sie k\u00f6nnen auf mich z\u00e4hlen.

m.heart_of_matter_3a = Danke, {0}. Ich hoffe du hast Erfolg. Wie du weisst, glauben wir, dass \
  das Alpha Squad es so weit geschafft hat, aber es ist unklar, was aus ihnen geworden ist... \
  Euclid, Parma, Grantz.... Rulen.\n\
  \n\
  (Lieutenant Vaelyn scheint sich in Gedanken zu verlieren)


m.heart_of_matter_4a = Entschuldigung, ja, sicher. Viel Gl\u00fcck, {0}. Stelle das beste Team \
  zusammen, das du finden kannst und leite sie gut. Wir z\u00e4hlen alle auf dich.

r.heart_of_matter_4a = Verstanden, Lieutenant.

m.king_of_ashes = K\u00f6nig der Aschen
o.king_of_ashes = Besiege Lord Vanaduke in der Feuersturm-Zitadelle und erreiche den Core
b.king_of_ashes = In den ewig brennenden Tiefen der Feuersturm-Zitadelle liegt Lord Vanaduke \
  auf der Lauer und wartet darauf, dass ein lebendes Wesen sein verfluchtes K\u00f6nigreich \
  betritt. Jedes Team, das je versucht hat, in die Zitadelle vorzudringen, wurde vernichtet \
  oder ist schlicht verschollen, \u00e4hnlich den zahllosen verlorenen Seelen, die an sein \
  schreckliches Reich gebunden sind.\n\
  \n\
  Lord Vanaduke ist kampfbereit, denn in seinem verdrehten Geist, glaubt er, dass jeder, der \
  die Zitadelle zu betreten wagt, eine Invasionsmacht darstellt, die sein K\u00f6nigreich \
  einnehmen will. Er ist die letzte H\u00fcrde, die zwischen den Spiral Knights und dem Zugang \
  zum Core steht, und damit der Chance, die Sylark zu reparieren und in die Heimat zur\u00fcckzukehren.\n\
  \n\
  Als Champion der Spiral Knights bist du allein dazu bef\u00e4higt, ein Team direkt ins Herzen \
  dieses Infernos zu f\u00fchren und der titanischen Macht von Lord Vanaduke entgegenzutreten.

# RANK 9-4
m.true_champion = Ein wahrer Champion
o.true_champion = Kontaktiere Agent Kora \u00fcber Comlink
b.true_champion = Nach deiner lebendigen R\u00fcckkehr aus der Feuersturm-Zitadelle wartet \
  Agent Kora darauf, von dir zu h\u00f6ren.

m.true_champion_1a = {0}! Oh, {0}, du hast es geschafft! Haha!\n\
  \n\
  Ich bin so froh, dass du da lebendig rausgekommen bist! Ich war krank vor Sorge um dich!

r.true_champion_1a = Sch\u00f6n, dass du dich sorgst, Kora.

m.true_champion_2a = Nun, soweit es nach mir geht, ist das erst der Anfang f\u00fcr dich, {0}. \
  Du bist ein wahrer Champion der Spiral Knights. Und nachdem ich nicht versetzt wurde, sch\u00e4tze ich, es ist auch f\u00fcr "uns" erst der Anfang!

r.true_champion_2a = Dann freue ich mich auf viele neue Informationen, Kora.

m.true_champion_3a = Du kannst immer auf mich z\u00e4hlen!\n\
  \n\
  Also, ich bin sicher, du hast viel zu tun. Wir drehen hier durch bei dem Versuch, aus dem \
  Aufkl\u00e4rungsmodul schlau zu werden, das du au\u00dferhalb des Core entdeckt hast. Wie zum \
  Teufel soll das Alpha Squad den Core "betreten" haben?

r.true_champion_3a = Wenn es einen Weg gibt, werden wir ihn finden.

m.true_champion_4a = Ja, ich sch\u00e4tze, das k\u00f6nnten wir vielleicht. Gute Reise, {0}.

r.true_champion_4a = Gespr\u00e4ch beenden

m.honor_duty = Ehre und Pflicht
o.honor_duty = Kontaktiere Lieutenant Feron \u00fcber Comlink
b.honor_duty = Lieutenant Feron w\u00fcrde dich gerne sehen, um \u00fcber deinen Durchbruch in \
  der Feuersturm-Zitadelle zu sprechen.

m.honor_duty_1a = Sei gegr\u00fc\u00dft, {0}, Champion der Spiral Knights. Dein Dienst an \
  unserer Sache war von h\u00f6chstem Kaliber. Ohne dich w\u00e4re das Erreichen des Core immer \
  noch ein Traum. Jetzt haben wir die Chance, die Skylark tats\u00e4chlich zu reparieren und \
  nach Hause zur\u00fcckzukehren.

r.honor_duty_1a = Es war mir eine Ehre, Lieutenant.

m.honor_duty_2a = Ich habe deinen Bericht \u00fcber den Core gelesen, er ist faszinierend. Was \
  f\u00fcr eine unm\u00f6gliche Struktur, und die Vorstellung, dass das Alpha Squad vielleicht \
  sogar noch lebt, aber ... in diesem Ding ist, ist unfassbar.\n\
  \n\
  Ich h\u00f6rte, Lieutenant Vaelyn hat bereits ein Team zum Core-Terminal gef\u00fchrt und \
  baut eine Operationsbasis f\u00fcr die Forschung auf. Das ist fantastisch f\u00fcr alle \
  Spiral Knights und nur dir zu verdanken!

r.honor_duty_2a = Ich hoffe, sie findet etwas Bedeutsames.

m.honor_duty_3a = Aye, das tun wir alle.\n\
  \n\
  Also, {0}, du musst dich auf das vorbereiten, was kommen wird. Das Erreichen des Core ist \
  erst der Anfang f\u00fcr uns. Ich vermute, Spiral HQ wird in Zukunft viele weitere Missionen \
  f\u00fcr dich haben, die nur von jemandem mit deinen F\u00e4higkeiten bew\u00e4ltigt werden k\u00f6nnen.\n\
  \n\
  Und abschlie\u00dfend habe ich das Vergn\u00fcgen, dich dar\u00fcber zu informieren, dass dir \
  bald eine der gr\u00f6\u00dften Ehren der Spiral Knights zuteil wird, der Rang der \
  Avantgarde. Wir sehen uns in der Halle der Helden.

r.honor_duty_3a = Danke, Lieutenant.

m.search_continues = Die Suche geht weiter
o.search_continues = Kontaktiere Lieutenant Vaelyn \u00fcber Comlink
b.search_continues = Lieutenant Vaelyn m\u00f6chte dir daf\u00fcr danken, dass du einen Pfad \
  zum Core ge\u00f6ffnet und es ihr so erm\u00f6glicht hast, vor Ort eine Forschungsstation zu \
  errichten.


m.search_continues_1a = {0}, ich kann dir gar nicht genug danken. Wir haben bereits unsere \
  Forschungsbasis eingerichtet und sammeln enorme Mengen Daten, die wir ohne dich nie h\u00e4tten sammeln k\u00f6nnen.

r.search_continues_1a = Danke, Lieutenant. Irgendwelche Neuigkeiten \u00fcber das Alpha Squad?

m.search_continues_2a = Das Aufkl\u00e4rungsmodul, das du geborgen hast, ist sehr seltsam. Ich \
  habe keinen Grund zu glauben, dass das, was Parma berichtet, nicht wahr ist, aber ich kann \
  nicht sagen, wie es passiert ist. Alles am Core legt nahe, dass es keine "T\u00fcr" hinein \
  gibt. Er ist nicht als von au\u00dfen zug\u00e4ngliche Struktur gebaut. Ganz im Gegenteil.

r.search_continues_2a = Ein Gef\u00e4ngnis, um etwas drinnen zu halten?

m.search_continues_3a = Vielleicht. K\u00f6nnte sein, wenn man ihn genau betrachtet. Wir m\u00fc\
  ssen ihn weiter studieren.

r.search_continues_3a = Und die 'lebendige Dunkelheit', die sie beschrieben hat?

m.search_continues_4a = Ich weiss es nicht, aber es ist ohne Zweifel ein furchterregendes Bild, \
  das sie beschreibt. Etwas regt sich, im Herzen dieser Welt, {0}, etwas schreckliches. Ich \
  habe es gesp\u00fcrt, seit wir das erste mal einen Fu\u00df auf diese Welt gesetzt haben; \
  unsichtbare Augen, die jede unserer Bewegungen beobachten, Gestalten, die sich gerade ausser \
  Sichtweite manifestieren... etwas gr\u00f6\u00dferes als die Gremlins, nennt diese Welt sein \
  Zuhause.

r.search_continues_4a = Was werden sie jetzt tun, Lieutenant?

m.search_continues_5a = Ich habe die Suche nach Euclid, Parma, Grantz und Rulen nicht \
  aufgegeben. Sie sind irgendwo da drau\u00dfen, und ich werde sie finden, selbst wenn ich daf\u00fc\
  r selbst den Core betreten muss.

r.search_continues_5a = Ich w\u00fcnsche ihnen viel Gl\u00fcck, Lieutenant.

m.search_continues_6a = Dir auch, Avantgarde.

r.search_continues_6a = Gespr\u00e4ch beenden

m.hall_of_heroes_5 = Halle der Helden
o.hall_of_heroes_5 = Besuche die Halle der Helden und erhalte deine Auszeichnung
b.hall_of_heroes_5 = Es ist Zeit, noch einmal die Halle der Helden zu betreten. Nachdem du die \
  volle Sterne-Zertifikation erhalten und so viele Missionen erfolgreich abgeschlossen hast, \
  die das \u00dcberleben der Spiral Knights auf Cradle gesichert haben, bereitet Spiral HQ dich \
  auf den hohen Rang Avantgarde vor.

m.hall_of_heroes_5_1a = Sei gegr\u00fc\u00dft, {0}. Sch\u00f6n, dich erneut und unter so gl\u00fccklichen Umst\u00e4nden zu sehen.

r.hall_of_heroes_5_1a = Hallo, Lieutenant.

m.hall_of_heroes_5_2a = Du stehst in der Halle der Helden, wo die besten der Spiral Knights \
  aufstrebenden Knights anbieten, was sie k\u00f6nnen. Knights wie du einst einer warst, als du \
  aus deiner Rettungskapsel gekrochen bist und deinen Weg nach Haven gefunden hast.\n\
  \n\
  Und nach so vielen erfolgreichen Missionen, gewagten Rettungen und herausragender Leistungen \
  im Kampf, steht es dir nun zu, dich in die Reihe dieser Helden einzureihen.

r.hall_of_heroes_5_2a = Weiter

m.hall_of_heroes_5_3a = {0}, es ist mir eine gro\u00dfe Ehre, dir in Gegenwart all derer, die \
  dich unterst\u00fctzen und denen du dienst, in den hohen Rang der Avantgarde der Spiral \
  Knights zu erheben.

r.hall_of_heroes_5_3a = Ich f\u00fchle mich geehrt.

m.hall_of_heroes_5_4a = Also, gr\u00fc\u00dfe die, die dir geholfen haben, zu werden, was du \
  heute bist. Wenn du fertig bist, nehme den Fahrstuhl nach oben, um deine Auszeichnung zu \
  empfangen.

r.hall_of_heroes_5_4a = Gespr\u00e4ch beenden

m.hall_of_heroes_5_5a = Sch\u00f6n, dich endlich pers\u00f6nlich zu treffen, {0}! Gl\u00fcckwunsch!

m.hall_of_heroes_5_6a = Diene ehrenvoll, Avantgarde.

m.hall_of_heroes_5_7a = {0}, ich dachte du w\u00e4rst gr\u00f6\u00dfer.

m.hall_of_heroes_5_8a = Wow, du hast es wirklich geschafft!

m.hall_of_heroes_5_9a = Hallo {0}! Sieh dich an, wow! Hey, Avantgarde oder nicht, du weisst, wo \
  du hin musst, wenn du wirklich hervorstechen m\u00f6chtest, richtig?

m.hall_of_heroes_5_10a = Gratulation, {0}. Die Geo Knights verdanken deinen Bem\u00fchungen eine Menge.

m.hall_of_heroes_5_11a = (Er scheint sehr intensiv in die Ecke zu starren)

m.hall_of_heroes_5_12a = Avantgarde, eh? Die Ranger suchen immer nach talentierten Knights wie \
  dir, {0}. Wenn dieser ganze Pomp rum ist, komm und schau bei mir vorbei, wenn du Gefahr und \
  Tod nochmal ins Gesicht lachen m\u00f6chtest!

# RANK 10-1
m.breaking_in_recruits = Die Rekruten anlernen
o.breaking_in_recruits = Hilf einer Gruppe neuer Rekruten, ihre erste Dienstrunde zu \u00fcberleben
b.breaking_in_recruits = Nachdem du die Tiefen der Feuersturm-Zitadelle bezwungen hast, glaubt \
  Spiral HQ, dass du dir eine lange f\u00e4llige Pause verdient hast. Als neu gek\u00fcrter \
  Avantgarde der Spiral Knights bist du in den Augen von Lieutenant Feron der perfekte Kandidat \
  daf\u00fcr, eine Gruppe neuer Rekruten darin zu trainieren, wie man die Gefahren dieser Welt \u00fc\
  berlebt. Deine Mission ist es, dich mit den Rekruten auf der Oberfl\u00e4che von Cradle zu \
  treffen und ihnen dabei zu helfen, ihre erste Runde im Dienst zu \u00fcberleben.


m.breaking_in_recruits_1a = Gr\u00fc\u00dfe, kleiner. Kerl. Tritt nicht. Auf Snipes.
r.breaking_in_recruits_1a = \u00d6hm...

m.breaking_in_recruits_2a = Gr\u00fc\u00dfe. Besorge Gl\u00e4nzendes. Besorge Gl\u00e4nzendes.
r.breaking_in_recruits_2a = Bist du okay?

m.breaking_in_recruits_3a = Snipes. Kaufen? Verkaufen?
r.breaking_in_recruits_3a = Richtig...

m.breaking_in_recruits_k1a = Gremlins!? Interpretiere ich diese Daten richtig? Ein Hinterhalt!? \
  Wie waren sie f\u00e4hig, unsere Sensoren auszutricksen?
r.breaking_in_recruits_k1a = Sie waren als Stranger getarnt.
m.breaking_in_recruits_k2a = Das hier ist nicht l\u00e4nger eine Routine-\u00dcbung! Schafft \
  diese Rekruten zum Transporter. Wir bringen sie zur\u00fcck nach Haven. Du, allerdings, musst \
  dort hinunter und herausfinden, wer hinter alledem steckt.
r.breaking_in_recruits_k2a = Verstanden, Kora.

o.crimson_chaos = Untersuche eine Crimson-Order-Basis die pl\u00f6tzlich verstummt ist
b.crimson_chaos = Spiral HQ hat einige bekannte Crimson-Order-Basen \u00fcberwachen lassen, in \
  der Hoffnung, eines ihrer schwer zu fassenden, hochrangigen Mitglieder abfangen zu k\u00f6nnen. Aufkl\u00e4\
  rungs-Knights, die dazu abgestellt waren, eine davon zu beobachten, berichten, dass dort pl\u00f6\
  tzlich Stille herrscht und haben Verst\u00e4rkung angefordert, bevor sie weitere \
  Untersuchungen anstellen. Begib dich hinunter zu ihrer Stellung und untersuche die Basis nach \
  Anhaltspunkten daf\u00fcr, was dort passiert ist.

m.cryptic_coder_crimson_chaos = Infiltriere den Komplex.\n\
  Nimm alle Pl\u00e4ne.\n\
  Die Neun sind ruhig, aber wir werden sie zum Schweigen bringen.\n\
  Die Knights verfolgen uns, aber wir werden sie stoppen.\n\
  \n\
  Nur Herex versteht die Wahrheit. Nur Herex wird hinabsteigen.\n\
  Es kann keinen anderen geben.

m.from_below = Es kam aus der Tiefe
o.from_below = Finde und rette die Truppe Aufkl\u00e4rungs-Ranger
b.from_below = Eine Truppe von Desnas Aufkl\u00e4rungs-Rangern ist von einer mysteri\u00f6sen \
  Macht gefangen worden, irgendwo in den Tiefen des Uhrwerks. Ausgehend davon, wie ernst die \
  Berichte klingen und den von Panik erf\u00fcllten Nachrichten der Truppe, glaubt Spiral HQ, \
  dass nur jemand mit deiner Erfahrung in der Lage ist mit der wie-auch-immer-gearteten, t\u00f6\
  dlichen Macht fertig zu werden, die sie dort unten gefangen h\u00e4lt.

# RANK 10-2
m.the_flickering_flame = Die flackernde Flamme
o.the_flickering_flame = Kontaktiere Agent Kora \u00fcber Comlink
b.the_flickering_flame = Nach deinem Sieg in der Feuersturm-Zitadelle machen die Nature-Sprites \
  der gro\u00dfen Geist-Mutter endlich Fortschritte im Kampf gegen die verfluchten Flammen, die \
  die verkohlten \u00dcberreste von Almire einh\u00fcllen. Ein k\u00fcrzliches Auflodern hat \
  diesen Fortschritt aber gebremst und gibt Hinweise auf eine verbleibende, \u00fcbelmeinende \
  Macht, die die Feuer weiter anheizt. Kontaktiere Agent Kora bez\u00fcglich der Details.

m.the_flickering_flame_1a = Oh, {0}! Als ob all diese seltsamen Vorkommnisse nicht schlimm \
  genug w\u00e4ren, ich habe einige schockierende Neuigkeiten f\u00fcr dich.

r.the_flickering_flame_1a = Noch mehr Schwierigkeiten, Kora?

m.the_flickering_flame_2a = Wir waren gerade dabei, einen Bericht von Lieutenant Vaelyns Team \
  am Core Terminal zu erhalten, als unser Signal gest\u00f6rt wurde. Es hat einige Zeit \
  gebraucht, aber ich habe es geschafft, die Quelle dieser St\u00f6rung zu finden. Sie stammt \
  von dieser seltsamen Apparatur, die du in der Feuersturm-Zitadelle nahe bei Vanadukes \
  Thronsaal gefunden hast. Es sieht aus, als h\u00e4tte jemand sie aktiviert.

r.the_flickering_flame_2a = Sie aktiviert? Wie?

m.the_flickering_flame_3a = Wir wissen es nicht sicher, aber es muss im Bezug zum Artefakt \
  stehen. Die Energiesignaturen sind identisch. Wenn das Artefakt involviert ist, bedeutet \
  das...

r.the_flickering_flame_3a = Dass der Gremlin Herex seine Finger im Spiel haben muss.

m.the_flickering_flame_4a = Das ist auch unsere Vermutung. Ich hasse es, dich an diesen \
  schrecklichen Ort zur\u00fcck schicken zu m\u00fcssen, {0}, aber wenn es eine Hoffnung darauf \
  gibt, diesem Mysterium schnell auf den Grund zu gehen, dann bist du das. Die Zitadelle ist \
  noch immer sehr gef\u00e4hrlich, also sei bitte vorsichtig!

r.the_flickering_flame_4a = Konversation beenden

m.shadowplay = Schattenspiel
o.shadowplay = Entdecke die Quelle der St\u00f6rung in der Feuersturm-Zitadelle
b.shadowplay = Sogar nach dem Sieg \u00fcber Lord Vanaduke durch dich brennt die \
  Feuersturm-Zitadelle weiter in den verwunschenen Flammen. Obwohl die Nature-Sprites frotw\u00e4\
  hrend Fortschritte beim Kampf gegen die Flammen machen, hat jemand oder etwas in j\u00fc\
  ngster Zeit ein gewaltiges Wiederaufflammen der destruktiven Kraft verursacht. Spiral HQ hat \
  dazu aufgerufen, dass du eine ge\u00fcbte Gruppe Knights versammelst und zu den einst\u00fc\
  rzenden Ruinen der Feuersturm-Zitadelle zur\u00fcckkehrst, um die Quelle der St\u00f6rung zu entdecken.

# Players encounter Herex at the altar.  He activates it with the Artifact and talks to the players
# before vanishing.
m.shadowplay_1a = Wieder mal zu sp\u00e4t! Ich habe bereits die Energie gesammelt, die ich \
  brauche, um das Artefakt zu benutzen und es gibt nichts, was du tun kannst, um das \
  aufzuhalten, was ich in Bewegung gesetzt habe.

r.shadowplay_1a = Es endet hier, Herex!

m.shadowplay_2a = Geh. Ich erlaube dir noch einen letzten Augenblick bevor ich dich und die \
  anderen deiner nervigen, sich einmischenden Art zerst\u00f6re. Solltest du dich jedoch \
  entschlie\u00dfen, mein gro\u00dfz\u00fcgiges Angebot auszuschlagen, kannst duch dich mir \
  gerne im Core stellen, wo ich sein und euren Untergang beschleunigen werde.

r.shadowplay_2a = Ich sehe dich dort...
m.shadowplay_3a = Ich freue mich auf unser n\u00e4chstes... Treffen.

m.a_call_to_arms = Ruf zu den Waffen
o.a_call_to_arms = Erhalte eine Notfall-Nachricht per Comlink
b.a_call_to_arms = Eine panische Notfall-Nachricht wird \u00fcber alle Comlink-Kan\u00e4le gesendet.

m.a_call_to_arms1 = Hier ist Vaelyn beim Core-Terminal. Team ausgel\u00f6scht. \u00dcberall \
  Dunkelheit. Schickt Hilfe. Es \u00f6ffnet sich.
r.a_call_to_arms1 = \u00dcbertragung beenden.

m.dreams_and_nightmares = Tr\u00e4ume und Alptr\u00e4ume
o.dreams_and_nightmares = Bereite dich auf das Schlimmste vor und reise zum Core
b.dreams_and_nightmares = Reagiere auf das Notsignal vom Core Terminal. Wir haben keine \
  Informationen dar\u00fcber, was zu erwarten ist.\n\
  \n\
  Das ist eine gef\u00e4hrliche Mission. Sei auf alles vorbereitet.

m.dreams_and_nightmares_1a = Endlich Unterst\u00fctzung! {0}, schau! Der Core \u00f6ffnet sich!

m.dreams_and_nightmares_2a = Solche Kraft! Ich hatte nie zu tr\u00e4umen gewagt...!

m.dreams_and_nightmares_3a = ...und sie wird entfesselt werden. Ihr! Euch werde ich zu ihren \
  ersten Opfern machen.

# Vaelyn
m.dreams_and_nightmares_4a = {0}, das ist fast sicher eine Falle und ich kann nicht von dir \
  verlangen, mit mir zu kommen, aber ich gehe dort hinen. Wenn es auch nur die kleinste Chance \
  gibt, dass Rulen und die anderen Mitglieder des Alpha Squads am Leben sind, muss ich \
  versuchen, sie zu finden.

m.dreams_and_nightmares_5a = Nun, ich denke es ist Zeit, mal wieder ein Held zu sein. Wollen \
  wir?

m.dreams_and_nightmares_5b = Herex ist verschwunden! Ich habe ihn aus den Augen verloren als es \
  dunkel wurde. Es hat sich angef\u00fchlt, als h\u00e4tten uns tausende H\u00e4nde weggezogen. \
  Als ob irgendetwas nicht wollte, dass wir folgen.

m.dreams_and_nightmares_5c = Was immer das war, nun sind wir hier. Wo auch immer hier ist. Es \
  sieht so aus, als w\u00e4re unsere einzige Option, zu sehen, wohin das hier f\u00fchrt.

# convo at start of Refuge
n.dreams_and_nightmares_3 = Parmas Aufkl\u00e4rer
m.dreams_and_nightmares_6a = Erstaunlich... ich h\u00e4tte nie gedacht, dass ich jemals wieder \
  einen von uns sehen w\u00fcrde! Ich bin froh, dass du es sicher bis hier geschafft hast!

# Vaelyn
m.dreams_and_nightmares_7a = Parma! Dein Aufkl\u00e4rer! Du lebst! Wo bist Du!? Wir m\u00fcssen dich zur\u00fcck nach Haven bekommen.

#Player started convo
m.dreams_and_nightmares_8 = Verzeihung, dass ich nicht pers\u00f6nlich erscheine. Ich bin an \
  einem sicheren Ort verborgen. Mir war klar, dass ich es nie rechtzeitig schaffen w\u00fcrde, \
  als ich dein Signale bemerkt habe. Gl\u00fccklicherweise konnte ich ein wenig Einfluss nehmen \
  und einen Ausgang f\u00fcr dich finden.

r.dreams_and_nightmares_8 = Wo ist Rulen? Euclid? Grantz?

m.dreams_and_nightmares_8a = Grantz, er... er ist gefallen, als er uns vor dem Schwarm besch\u00fc\
  tzt hat. Er hat seine Stellung gehalten, sogar als der Rest von uns dazu gezwungen war, zu \
  fliehen. Ich werde nie vergessen, wie tapfer er war.

m.dreams_and_nightmares_9a = Der Rest von uns dachte, dass wir es nicht schaffen w\u00fcrden. \
  Aber dann... dann hat uns Licht umgeben und wir waren sicher. Wir haben begonnen, es den Schl\u00e4\
  fer zu nennen. Wir wissen nicht genau, was es ist, aber es braucht unsere Hilfe. Diese Welt \
  wurde erschaffen, um es zu besch\u00fctzen, aber irgendwie hat der Schwarm den Core \
  aufgebrochen und sich von der Energie ern\u00e4hrt - und ist seither wie ein Blutegel \
  gewachsen.

m.dreams_and_nightmares_9b = Euclid hat sich freiwillig gemeldet, dem Schl\u00e4fer zu helfen. \
  Ich bin sicher, er ist irgendwo und bek\u00e4mpft den Schwarm, sogar jetzt, w\u00e4hrend wir \
  miteinander reden. Was Rulen ageht... Vaelyn, es tut mir leid. Er ist verschwunden, kurz \
  nachdem Euclid seine Entscheidung getroffen hatte. Ich konnte ihn seitdem nicht wiederfinden.

m.dreams_and_nightmares_10a = Es bleibt nicht viel Zeit. ICh kann dich von hier nicht erreichen \
  und du musst es nach draussen schaffen. Warne das Hauptquartier. Warne Haven! Wenn der Core \
  nicht versiegelt bleibt, wird der Schwarm entkommen und weiter alles und jeden verzehren.

m.dreams_and_nightmares_11a = Aber was ist mit dir und den anderen?

m.dreams_and_nightmares_12a = Der Schwarm wird st\u00e4rker, w\u00e4hrend der Schl\u00e4fer immer schw\u00e4\
  cher wird. Ohne uns - alle von uns - wird der Schwarm gewinnen. Einst waren die Gremlins daf\u00fcr zust\u00e4\
  ndig, sich um die Verteidigung von Cradle zu k\u00fcmmern. Aber sie hatten ihre eigenen Pl\u00e4ne. Wir m\u00fc\
  ssen jetzt Cradles Champions sein.\n\
  \n\
  Wir bringen dieses Opfer.

m.dreams_and_nightmares_13a = K\u00e4mpfe weiterhin f\u00fcr das Gute, {0}. Erinnere dich an \
  das, was du erfahren hast. Leb' wohl!

m.delved_too_deep = Zu tief gegraben
o.delved_too_deep = Kontaktiere Agent Kora \u00fcber Comlink
b.delved_too_deep = Die Wahrheit wurde enth\u00fcllt. Es ist Zeit, Agent Kora und Spiral HQ dar\u00fc\
  ber zu informieren, was du und Lieutenant Vaelyn erfarhen haben.

m.delved_too_deep_1a = Kommen, {0}! Ich kann es nicht glauben! Ich habe dein Signal komplett \
  verloren, als du den Terminal des Cores betreten hast. Was ist da unten passiert?

r.delved_too_deep_1a = Es ist eine lange Geschichte, Kora.

m.delved_too_deep_2a = Das wette ich. Ich sch\u00e4tze, zur Abwechslung musst du diesmal mich \
  informieren!

r.delved_too_deep_2a = (Berichte Kora vom Schwarm, dem Schl\u00e4fer und dem Alpha Squad)

m.delved_too_deep_3a = Erstaunlich, dass wir nach all dieser Zeit noch immer die Wahrheit nicht \
  kannten. Ich meine, wir haben seit einiger Zeit vermutet, dass dieser Planet eine Art Gef\u00e4ngnis ist, aber wer h\u00e4tte ahnen k\u00f6\
  nnen, dass dieser 'Schwarm' nur darauf gewartet hat, dass wir \u00fcber den Core stolpern und \
  ihn befreien?

r.delved_too_deep_3a = Was tun wir jetzt?

m.delved_too_deep_4a = Wenn das, was Parma gesagt hat, wahr ist, sind wir die letzte \
  Verteidigungslinie gegen den Schwarm. {0}, ich will nicht l\u00fcgen, aber das k\u00f6nnte alles ver\u00e4ndern. Wir m\u00fc\
  ssen das sofort dem Hauptquartier mitteilen. Ich werde alle versammeln und dir eine Mission \
  zum Annehmen geben, wenn du soweit bist.

r.delved_too_deep_4a = Konversation beenden

# RANK 10-3
m.guardians_of_cradle = W\u00e4chter von Cradle
o.guardians_of_cradle = Besprich zusammen mit Spiral HQ, was als N\u00e4chstes zu tun ist
b.guardians_of_cradle = Du wurdest zu einer Versammlung mit einigen Mitgliedern von Spiral HQ \
  eingeladen, um zu diskutieren, was als N\u00e4chstes zu tun ist in Sachen Core und \
  hinsichtlich der Bedrohung durch den Schwarm. Schlie\u00dfe dich ihnen in der Halle der \
  Helden an und informiere dich \u00fcber Operations-Missionen.

m.guardians_of_cradle_1a = Sei gegr\u00fc\u00dft, Avantgarde {0}. Kora sagte, dass du \
  Neuigkeiten vom Alpha Squad hast. Bitte gib uns deinen Bericht.

r.guardians_of_cradle_1a = (Gib Captain Ozlo einen vollst\u00e4ndigen Bericht)

m.guardians_of_cradle_2a = Das klingt, als w\u00e4ren wir nur knapp einer schrecklichen \
  Katastrophe entgangen. H\u00e4tten wir den Core ge\u00f6ffnet und den Schwarm entfesselt, h\u00e4tte ganz Cradle zerst\u00f6rt werden k\u00f6\
  nnen. Vielleicht sogar das Universum!

r.guardians_of_cradle_2a = Weiter

m.guardians_of_cradle_3a = Das Opfer des Alpha Squads wird nicht umsonst gewesen sein. Ich \
  werde unseren Truppen sofort befehlen, spezielle Sondereinsatz-Missionen zu unternehmen, \u00fc\
  berall auf Cradle. Wenn es hier Kr\u00e4fte gibt, die versuchen, den Schwarm zu befreien, m\u00fcssen wir sie aufhalten.

r.guardians_of_cradle_3a = Weiter

m.guardians_of_cradle_4a = {0}, du hast bereits so viel f\u00fcr uns alle getan, aber jetzt \
  muss ich dich bitten, noch ein weitere Opfer zu bringen. Wir haben vielleicht nie die chance, \
  nach Isora heimzukehren, aber Cradle braucht uns jetzt. Ich m\u00f6chte, dass du die \
  Speerspitze unserer Operationen auf Cradle bist.

r.guardians_of_cradle_4a = Es w\u00e4re mir eine Ehre, Captain.

m.guardians_of_cradle_5a = Sehr gut, {0}. Du wirst eine neue Reihe von Missionen f\u00fcr dich \
  finden, unter Sondereinsatz. Diese neuen Missionen werden nach ihrem \u00fcbergeordneten Ziel \
  gruppiert sein und k\u00f6nnen parallel zu einander in Angriff genommen werden. Das sollte \
  dir maximale Flexibilit\u00e4t dabei erlauben, auf neue Bedrohungen zu reagieren, wenn sie \
  auftauchen. Leb' wohl, {0}, 'Besch\u00fctzer von Cradle'.

r.guardians_of_cradle_5a = Konversation beenden

m.guardians_of_cradle_6a = Gr\u00fc\u00dfe, Avantgarde. Es liegt ein steiniger Weg vor uns \
  allen, aber ich bin zuversichtlich, dass wir der Herausforderung gewachsen sind.

m.guardians_of_cradle_7a = Ich wei\u00df nicht, ob ich mich jetzt besser oder schlechter f\u00fc\
  hle, nachdem wir herausgefunden haben, was mit allen im Core passiert ist. Armer Grantz... \
  Parma... Euclid... Rulen...

r.guardians_of_cradle_7a = Ich wei\u00df, Vaelyn. Ich f\u00fchle mich genauso.

m.guardians_of_cradle_8a = Nun, ich werde sie nicht entehren, indem ich jetzt aufgebe. Schlie\u00df\
  lich sind wir so weit gekommen. 'Zeit, mal wieder ein Held zu sein!' Richtig, {0}?

m.guardians_of_cradle_9a = Ein ziemliches Skarab\u00e4us-Nest, in das wir diesmal gestochen \
  haben, was, {0}? Erinnert mich an die Zeit, wo wir uns mit der Belagerungsflotte der Morai \u00fc\
  ber Isora angelegt haben. Das war ein ziemliches Gl\u00fccksspiel der Marke \
  Alles-oder-Nichts. Es wundert mich nicht im Geringsten, dass wir mal wieder das Einzige sind, \
  was zwischen uns und v\u00f6lliger Ausl\u00f6schung steht.

m.guardians_of_cradle_11a = Das Bisschen, was wir vom Core-Terminal geborgen haben, macht jeden \
  Geo Knight, Biotech und Tech Knight komplett ratlos. Wir werden diese Funde wohl f\u00fcr \
  geraume Zeit analysieren.

m.guardians_of_cradle_10a = (Zum ersten Mal, seit du ihn kennst, ist Hahn still. Er scheint \
  deine Funde \u00e4usserst gr\u00fcndlich zu betrachten.)


