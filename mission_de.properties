  Gremlins ein ziemliches Chaos in Emberlight. Diese 'Grinchlins', wie sie genannt werden, \
  bremsen f\u00fcr niemanden bis sie jedes einzelne Geschenk aus der Stadt Emberlight geraubt \
  haben.\n\
