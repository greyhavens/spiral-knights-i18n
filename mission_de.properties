b.p_moorcroft1 = Jemand oder etwas hat eine Horde verfluchter Black Kats ins Uhrwerk \
  beschworen. Diese schattenhaften Biester lechzen nach arkaner Macht und haben die wertvolle \
  Sammlung magischer Schriften in den Archiven von Moorcroft Manor gepl\u00fcndert.\n\
  \n\
  Diese alten W\u00e4lzer in den falschen H\u00e4nden w\u00e4ren katastrophal, aber es hat sich \
  herausgestellt, dass die Kats nicht lesen k\u00f6nnen, also haben sie sich dazu entschlossen, \
  sie einfach aufzufressen.\n\
  \n\
  Die Einwohner von Moorcroft Manor m\u00f6chten, dass du die alten Seiten zur\u00fcckholst, \
  die sich recht wahrscheinlich in den M\u00e4gen der Black Kats befinden. Wir werden es dir \u00fc\
  berlassen, wie genau du sie zu bergen versuchst...\n\
  \n\
  Begib dich f\u00fcr diese Mission in die Tiefen eines modrigen Abwasserkanals, in dem Sp\u00e4\
  her das Nest der Black Kats lokalisiert haben. Hole die alten Seiten zur\u00fcck und bringe \
  sie nach Moorcroft Manor!

