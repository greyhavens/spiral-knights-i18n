#Conversations in-mission
#Lost Soul 1
n.apocrea_1 = Verlorene Seele
m.apocrea_1_1a = Was ist das? Eine weitere arme Seele, reif f\u00fcr die Ernte der Apocrea?

r.apocrea_1_1a = Was ist das f\u00fcr ein Ort und wovon redest du?

m.apocrea_1_2a = Du, neugieriger Reisender, befindest dich im Obsidian-Nexus, Reich der \
  Apocrea. Du wirst die Sonne wohl nie wieder sehen.

r.apocrea_1_2a = Was meinst du? Wer sind die Apocrea?

m.apocrea_1_3a = Die Apocrea sind Stoff aus Alptr\u00e4umen: eine schreckliche Legion \
  anderweltlicher Phantome, deren einziger Antrieb es zu sein scheint, die Seelen allen \
  Lebendes einzufangen und zu verzehren.\n\
  \n\
  Obwohl du dich vielleicht \u00fcber den Nexus hinaus wagst, wirst du ohne Zweifel in eine \
  ihrer Fallen entlang des Weges geraten.

r.apocrea_1_3a = Erz\u00e4hle mir von diesen Fallen.

m.apocrea_1_4a = Die Apocrea beugen die Realit\u00e4t, verzerren die Umgebung, in die sie \
  eindringen, zu einer Falle. Mit diesen Fallen jagen sie jegliches Leben und ernten ihre \
  Seelen f\u00fcr irgendeinen unvorstellbaren Zweck.

r.apocrea_1_4a = Ich werde es ihnen nicht so einfach machen.

m.apocrea_1_5a = Du verstehst nicht, oder? Du hast einfach keine Wahl.

r.apocrea_1_5a = Konversation beenden

#Lost Soul 2
m.apocrea_2_1a = Was ist das? Du hast noch immer deinen K\u00f6rper. Vielleicht kannst du uns \
  helfen.

r.apocrea_2_1a = Wer bist du?

m.apocrea_2_2a = Ich bin nur eine weitere Seele, die sich vor dem Blick der Apocrea versteckt. \
  Aber ich weigere mich, aufzugeben. Bis sie mich finden, werde ich alles tun, um eine weitere \
  Seele vor meinem Schicksal zu bewahren.

r.apocrea_2_2a = Wie kann ich helfen?

m.apocrea_2_3a = Bald wirst du dich selbst in einer von den Apocrea gestellten Fallen \
  wiederfinden. Wenn du m\u00e4chtig genug bist, zu entkommen, dann bist du vielleicht auch f\u00e4\
  hig, einige andere verlorene Seelen dabei zu retten.

r.apocrea_2_3a = Ich werde es versuchen. Sag mir, was ich machen soll.

m.apocrea_2_4a = Verlorene Seelen, gefangen von den Apocrea, sind an die Realit\u00e4ten \
  gebunden, die sie kreiert haben. Finde die verlorenen Seelen und befreie sie von den Banden \
  der Apocrea.

r.apocrea_2_4a = Weiter

m.apocrea_2_5a = Nach der Befreiung wirst du ein Siegel der Apocrea als Beweis deiner Tat \
  erhalten. Bring diese zu mir und meinem Freund hier und wir werden dich mit speziellen Sch\u00e4tzen belohnen, die ich w\u00e4\
  hrend meiner Zeit in dieser Welt gesammelt habe. Du kannst diese Gegenst\u00e4nde dazu \
  verwenden, seltene und m\u00e4chtige Gegenst\u00e4nde herzustellen, unter Nutzung des \
  Obelisken dort dr\u00fcben.

r.apocrea_2_5a = Ich werde mein Bestes geben.

m.apocrea_2_6a = Viel Gl\u00fcck. Bewege dich schnell und entziehe dich ihrem Griff.

r.apocrea_2_6a = Konversation beenden

