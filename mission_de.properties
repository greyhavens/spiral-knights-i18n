m.chilled_to_bone = Kalt bis auf die Knochen
o.chilled_to_bone = Erforsche die schattenverh\u00fcllten \u00dcberreste der \
  Kerzenschein-Festung
b.chilled_to_bone = Inzwischen bist du sicher bereits den seltsamen, untoten Monstern names \
  'Spookats' begegnet. Aufkl\u00e4rer-Knights haben endlich herausgefunden, was die Quelle \
  dieser geisterhaften, katzen\u00e4hnlichen Kreaturen zu sein scheint.\n\
  \n\
  Gro\u00dfe Ansammlungen von Spookats wurden in den finsteren \u00dcberresten dessen \
  gesichtet, was mal ein Schlo\u00df der Owlites war. Das 'Kerzenschein-Festung' getaufte, d\u00fc\
  stere Areal wird nur von einigen Owlite-Kerzen erhellt.\n\
  \n\
  Sei vorsichtig, wenn du ausserhalb des Kerzenscheins unterwegs bist. In der Dunkelheit lauern \
  gewaltige Spookats, genannt 'Grimalkins'. Grimalkins sind gegen jeglichen Schaden durch \
  Waffen immun und man sollte ihnen aus dem Weg gehen. Deine einzige Verteidigung ist es, im \
  Licht zu bleiben!\n\
  \n\
  Spiral HQ hat dich mit dieser Mission beauftragt, um mehr Daten \u00fcber die Urspr\u00fcnge \
  der Spookats zu bekommen und \u00fcber das Geheimnis um den Niedergang der Owlites. \
  Untersuche die Kerzenschein-Festung und berichte dann \u00fcber das, was du herausgefunden \
  hast!

m.work_idle_hands = Arbeit f\u00fcr unbesch\u00e4ftigte H\u00e4nde
o.work_idle_hands = Verdirb die d\u00e4monische B\u00fcro-Party!
b.work_idle_hands = Devilites sind eine D\u00e4monenrasse, die in einer streng reglementierten, \
  betrieblichen Struktur organisiert zu sein scheint, die jede ihrer Handlungen bestimmt. Aufkl\u00e4\
  rer-Knights haben eine Reihe von 'Devilite-B\u00fcros' im Uhrwerk entdeckt, die sich \
  typischerweise in den \u00dcberresten einer fremdartigen Stadt befinden.\n\
  \n\
  Die Analyse der gesammelten Daten l\u00e4sst annehmen, dass die Devilite-Betriebe von den \
  Gremlins beauftragt wurden, diverse Projekte zu beaufsichtigen und durchzuf\u00fchren, die \
  sich um Waffen drehen, die speziell dazu gedacht sind, gegen Teams der Spiral Knights \
  eingesetzt zu werden.\n\
  \n\
  Es wird Zeit, diesen Devilites ein K\u00fcndigungsschreiben zu \u00fcberbringen und ihre \
  Projekte zu beenden.

m.monstrous_research_5 = Monstr\u00f6se Forschung
o.monstrous_research_5 = Liefere die verlangten Materialien bei Biotech Hahn zur Erforschung \
