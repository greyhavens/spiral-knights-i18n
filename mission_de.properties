  photonenbasierten Lasern bis zu okkulter Energiemanipulation bestehen.

r.elemental_my_dear_2a = Okkult? Wie Magie und-

m.elemental_my_dear_3a = Magie? Was? Nein, ich rede von psychischer Manipulation von Energie, \
  bleib bitte bei der Sache. Jedenfalls wird Elementarschaden von Konstrukten und Gremlins \
