# Mission Start

m.anniversary_start_1 = {0}! Ich bin froh, dich zu sehen! Es sieht hier unten ziemlich \u00fcbel aus.

r.anniversary_start_1 = Was ist los, Biscotti?

m.anniversary_start_2 = Nun, es ist so... ich wurde beauftragt, Kuchen f\u00fcr die gro\u00dfe \
  Geburtstagsfeier von Spiral Knights zu backen und es k\u00f6nnte sein, dass ich mich ein \
  klein wenig \u00fcbernommen habe, als ich behauptet habe, ich k\u00f6nnte einige Millionen in \
  nur einer Woche backen.\n\
  \n\
  Um den Vorgang zu beschleunigen, k\u00f6nnte es sein, dass ich ein klitzekleines Bisschen \
  reiner, unverarbeiteter dunkler Materie, statt Backpulver genommen habe...

r.anniversary_start_2 = Du hast was?!

m.anniversary_start_3 = Jedenfalls scheint es so, als h\u00e4tte dieses neue 'Rezept' dazu gef\u00fc\
  hrt, dass die Kuchen zu furchtbaren Monstern geworden sind, die jetzt meine K\u00fcche \
  eingenommen und sich im Uhrwerk ausgebreitet haben. Ich h\u00e4tte meine K\u00fcche gern zur\u00fcck, also k\u00f6\
  nntest du mir bitte dabei helfen, diese schrecklichen Creep Cakes zu zerst\u00f6ren?

r.anniversary_start_3 = Mein Training hat zwar keine Konditorei-Kampfkunst beinhaltet, aber ich \
  bin dabei!

m.anniversary_start_4 = Gro\u00dfartig! Ich treffe dich beim Ausgang, sobald du sie ausgel\u00f6\
  scht hast. Sei aber vorsichtig, sie scheinen sich darauf verlegt zu haben, Geburtstagskerzen \
  als Waffen zu verwenden...

r.anniversary_start_4 = Gespr\u00e4ch beenden

# Mission End


m.anniversary_end_1 = {0}! Du hast es geschafft! Ich habe meine K\u00fcche wieder!\n\
  \n\
  Denk daran, du kannst die Kuchenst\u00fccke, die du erh\u00e4ltst, bei Maskwell auf dem \
  Stadtplatz von Haven gegen tolle Cake-Helme eintauschen. Ganz wie in diesem alten B\u00e4\
  cker-Sprichwort: "Trage die Haut deiner geschlagenen Feinde, um deine St\u00e4rke als Krieger \
  zu beweisen!\n\
  \n\
  Okay, vielleicht sage nur ich das.

r.anniversary_end_1 = Gespr\u00e4ch beenden

# Gremlin Chef finale

m.anniversary_gremlin_1a = Ein Hauch Moonstone, eine Prise... W... Wie bist du... Wer bist du!? \
  Du solltest nicht hier sein!

m.anniversary_gremlin_1b = Raus, raus, rauuuus! Zu viele K\u00f6che in der K\u00fcche! Zu viele K\u00f6che in der K\u00fcche!

m.anniversary_gremlin_2 = Was machst du!? Meine Kuchen! Meine sch\u00f6nen Kuchen! Unfassbar!

m.anniversary_gremlin_3 = Guuuurgel! Solche St\u00e4rke! Verschlungen wirst du werden, und \
  deine Kraft der meinen hinzugef\u00fcgt!

m.anniversary_gremlin_4a = Du... ich... Was war das? Hast du etwas gesagt?

r.anniversary_gremlin_4a = Biscotti hat mich gebeten, herzukommen und nach dir zu sehen.

m.anniversary_gremlin_4b = Oh nein! sag' ihr, dass die Kuchen fertig sein werden. \u00c4hm, ich \
  bin nur etwas hinten dran. Ich schlage dir etwas vor: Ich gebe dir etwas Extra-Kuchen, wenn \
  wir das f\u00fcr uns behalten k\u00f6nnen. Ich will nicht von der Party ausgeschlossen \
  werden.

