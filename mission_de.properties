m.heart_of_ice_1a = Aufgepasst, Ranger! Greift euch eure Schals und geschliffenen Klingen, denn \
  wo wir hingehen, erwartet uns nicht gerade der w\u00e4rmste Empfang! Unsere Sp\u00e4her \
  berichten, dass Amu-Sol eine gefrorenes \u00d6dland ist, voll von D\u00e4monen und hungrigen \
  Bestien. Diese d\u00e4monische Stadt scheint ihre eisige K\u00e4lte durch das Uhrwerk zu \
  verbreiten und wenn wir dort nicht hingelangen und herausfinden wieso, wird das ein ziemlich \
  langer Winter werden, hier auf Cradle.\n\
  \n\
  Auf geht's, Ranger!

r.heart_of_ice_1a = (Konversation beenden)

n.heart_of_ice_2a = 'D\u00e4monisches Memo'
m.heart_of_ice_2a = Re: Anfrage Betriebsmittelzuweisung, Amu-Sol\n\
  \n\
  Sie erhalten diese Nachricht als Antwort auf ihren inkorrekten/kryptischen Eintrag  in ihrer \
  j\u00fcngsten Anfrage auf Betriebsmittelzuweisung.\n\
  Bitte reichen Sie eine detaillierte Darstellung der geplanten Verwendung der folgenden, von \
  ihnen verlangten Ressourcen ein:\n\
  - 999 'aufgeschlossene' Devilites\n\
  - 50 F\u00e4sser mit 'was immer Frostifurs fressen'\n\
  - Eine 'gigantische S\u00e4ule' Everfrost und 'all die gefrorenen Seelen, die sie \
  hervorbringt'
r.heart_of_ice_2a = (Weiterlesen)

m.heart_of_ice_2b = Zus\u00e4tzlich hat die Personalabteilung eine aktualisierte \
  Organisations-Tabelle angefordert, so bald wie m\u00f6glich. Wir haben den Eindruck, dass \
  alle Pit-Boss-Pflichten, administrativ oder anderweitig, an 'Maulos vom ewigen Frost' \u00fc\
  bergeben wurden, ist das korrekt?\n\
  \n\
  Danke,\n\
  Morgral'm\n\
  Assistenz-Supervisor Betriebsmittelzuweisung, Undercorp

r.heart_of_ice_2b = (Lesen beenden)

m.heart_of_ice_3a = Re: Re: Anfrage Betriebsmittelzuweisung, Amu-Sol\n\
  \n\
  Vielen Dank f\u00fcr ihre z\u00fcgige Antwort. Leider wurde ihr Antrag auf \
  Betriebsmittelzuweisung abgelehnt.\n\
  \n\
  Grund:Eingereichte Zusammenfassung bez\u00fcglich des Bedarfs f\u00fcr die beantragten \
  Mittel: 'Heil dem gro\u00dfen und schreckenerregenden Maulos, dem wahren Herrn der Blendenden \
  Tiefen.'
m.heart_of_ice_3b = Ausserdem wartet die Personalabteilung noch immer auf die aktualisierte \
  Organisations-Tabelle. Bitte beachten Sie, dass 'Alle sind der frostigen Verderbtheit des gro\u00df\
  en Maulos unterworfen' keine akzeptable Beschreibung der derzeitigen Exekutiv-Hierarchie \
  darstellt.\n\
  \n\
  Danke,\n\
  Morgral'm\n\
  Assistenz-Supervisor Betriebsmittelzuweisung, Undercorp

r.heart_of_ice_3a = (Lesen beenden)

m.heart_of_ice_4a = Re: Re: Re: Anfrage Betriebsmittelzuweisung, Amu-Sol\n\
  \n\
  Ich habe die Dienstaufsicht kontaktiert, bez\u00fcglich des k\u00fcrzlichen Diebstahls einer \
  Everfrost-S\u00e4ule und dem 'Verschwinden' von beinahe 1000 Devilite-Mitarbeitern aus der \
  Datenverarbeitung, da Grund zur Annahme besteht, dass diese Vorkommnisse in direktem \
  Zusammenhang mit der Ablehnung ihrer j\u00fcngsten Anfrage auf Betriebsmittelzuweisung \
  stehen.\n\
  \n\
  Es werden disziplinarische Ma\u00dfnahmen notwendig sein. Bitte f\u00fcllen sie ausserdem den \
  im Anhang befindlichen, pers\u00f6nlichen Verbesserungs-Plan aus und senden Sie ihn umgehend \
  zur\u00fcck.
m.heart_of_ice_4b = Zuletzt, bitte weisen Sie ihre Abteilung an, es zu unterlassen, andere \
  Abteilungen von Undercorp dar\u00fcber zu informieren, dass 'Niemand der frostigen \
  Verderbtheit von Lord Maulos entrinnen kann.' Unangebrachte Nutzung des Postsystems schadet \
  der Produktivit\u00e4t.\n\
  \n\
  Da die Disziplinarma\u00dfnahmen f\u00fcr ihre Abteilung zweifelsohne eine Verlegung in den \
  Bereich Ewige Folter zur Folge haben werden, ist dies h\u00f6chstwahrscheinlich unsere letzte \
  Korrespondenz. Ich w\u00fcnsche ihnen Gl\u00fcck bei ihrer weiteren Karriere hier bei \
  Undercorp.\n\
  \n\
  Danke,\n\
  Morgral'm\n\
  Assistenz-Supervisor Betriebsmittelzuweisung, Undercorp\n\
  \n\
  Anhang: Amu-Sol.pip

r.heart_of_ice_4a = Anhang \u00f6ffnen?
r.heart_of_ice_4b = (Lesen beenden)

m.heart_of_ice_5a = Der Anhang ist besch\u00e4digt und kann nicht ge\u00f6ffnet werden.

n.heart_of_ice_6a = Aufkl\u00e4rungs-Ranger
m.heart_of_ice_6a = Wow, das ist ein riesiger Everfrost-Turm. Ich habe bisher immer nur kleine \
  Mengen, vielleicht eine Hand voll, von dem Zeug gesehen, nicht ann\u00e4hernd das was wir \
  hier vor uns haben.\n\
  \n\
  Die Informationen, die wir bisher gesammelt haben, deuten darauf hin, dass die D\u00e4monen gro\u00df\
  e Ansammlungen dieses Zeugs benutzen, um darin die Seelen der verlorenen gefangen zu halten, \
  wie in einer Art eisigem Gef\u00e4ngnis.\n\
  \n\
  Es hat den Anschein, als h\u00e4tte Maulos, dieser schreckliche Erz-D\u00e4mon, den du gerade \
  erledigt hast, eine andere Verwendung daf\u00fcr im Sinn gehabt und hat das Everfrost zerst\u00f6rt, um Schw\u00e4rme w\u00fc\
  tender, gefrorener Seelen auf das Uhrwerk loszulassen. H\u00e4tte er das zu Ende bringen k\u00f6\
  nnen, nun, ich will mir gar nicht ausmalen, wieviele Pullover jeder von uns jetzt brauchen w\u00fcrde...

r.heart_of_ice_6a = (Konversation beenden)

