m.p_r7_min = Geologische Untersuchung
o.p_r7_min = Sammle Mineralien f\u00fcr die Forschung von Chief Geo Knight Wegner.
b.p_r7_min = Chief Geo Knight Wegner will jederzeit seine Forschung an den mysteri\u00f6sen \
  Mineralien vorantreiben, die im Uhrwerk zu finden sind. Die Experimente, die er an den ihn \
  verf\u00fcgbaren Proben durchf\u00fchrt, resultieren f\u00fcr gew\u00f6hnlich in deren Aufl\u00f6\
  sung. Deshalb braucht er immer tapfere Knights, die ins Uhrwerk vordringen, um ihm mehr \
  Proben zu liefern.

m.p_r7_weap_3 = Waffenbereitstellung
o.p_r7_weap_3 = Liefere die geforderten Gegenst\u00e4nde zu der Truppe, die sie ben\u00f6tigt.
b.p_r7_weap_3 = Knights, die aus der Gefangenschaft durch Gremlins befreit wurden, haben oft \
  nichts au\u00dfer ihren Erinnerungen daran, in einem K\u00e4fig eingesperrt zu sein und von \
  ihren knurrenden Kidnappern misshandelt zu werden. Ihre Waffen sind immer weg, und ihre R\u00fc\
  stung oft von Gremlin-Ingenieuren besch\u00e4digt.\n\
  \n\
  Um diese Knights wieder f\u00fcr ihre Truppe kampfbereit zu machen, braucht es Knights mit \
  Zugang zu vielen Ressourcen, die die n\u00f6tigen Waffen und R\u00fcstungen bereitstellen.

m.p_r7_weap_4 = Waffenbereitstellung
o.p_r7_weap_4 = Liefere die geforderten Gegenst\u00e4nde zu der Truppe, die sie ben\u00f6tigt.
b.p_r7_weap_4 = Knights, die aus der Gefangenschaft durch Gremlins befreit wurden, haben oft \
  nichts au\u00dfer ihren Erinnerungen daran, in einem K\u00e4fig eingesperrt zu sein und von \
  ihren knurrenden Kidnappern misshandelt zu werden. Ihre Waffen sind immer weg, und ihre R\u00fc\
  stung oft von Gremlin-Ingenieuren besch\u00e4digt.\n\
  \n\
  Um diese Knights wieder f\u00fcr ihre Truppe kampfbereit zu machen, braucht es Knights mit \
  Zugang zu vielen Ressourcen, die die n\u00f6tigen Waffen und R\u00fcstungen bereitstellen.

m.p_r7_gate_beast = Natur der Bestie
o.p_r7_gate_beast = Rette die Geo Knights aus den F\u00e4ngen wilder Bestien!
b.p_r7_gate_beast = Unsere Geo Knights riskieren ihr Leben in der Wildnis des Uhrwerks. Ihre \
  Entdeckungen sind unbezahlbar, aber oft sind sie direkt im Herzen von Wolver-Gebiet \
  stationiert. Diese wilden Bestien belauern unsere Geo Knights und schnappen sie sich in der \
  Nacht, wenn sie unbewacht sind. Manchmal bilden Wolver ein Rudel und greifen ein ganzes \
  Forschungsteam an. In solchen Zeiten braucht es eine talentierte Truppe, um sie zu retten.

m.p_r7_gate_slime = Eine Prise Salz
o.p_r7_gate_slime = Liefere eine Ladung Rock Salt zum Forschungsteam im Lager der Lichen!
b.p_r7_gate_slime = Die beste Art, Glibber unter Kontrolle zu halten, sind gro\u00dfe Mengen \
  Rock Salt. Glibber hassen dieses Zeug, weil sie sich aufl\u00f6sen, wenn sie es ber\u00fchren. Wirklich nicht h\u00fcbsch.\n\
  \n\
  In den Lichen-Lagern stationierte Forschungsteams legen oft Rock Salt um ihr gesamtes Camp, \
  so dass sie nicht als Glibberabendessen enden. Wie du dir sicher denken kannst, verbrauchen \
  sie das Zeug in Massen. Wenn ihnen die Vorr\u00e4te ausgehen, wird eine Truppe losgeschickt, \
  um sich ins Lage vorzuk\u00e4mpfen und das lebensrettende Gew\u00fcrz zu liefern.

m.p_r7_gate_construct = Angriff auf Maschinenladen 13
o.p_r7_gate_construct = Vernichte die funktionierenden Kriegsmaschinen in der zerst\u00f6rten Fabrik!
b.p_r7_gate_construct = Gremlins haben Probleme damit, ihren Krempel aufzur\u00e4umen. Unser Sp\u00e4her stolpern oft \u00fc\
  ber verlassene Gremlin-Fabriken, die immer noch voller aktiver feindlicher Konstrukte und \
  manchmal sogar mit funktionierender aktiver Kriegsmaschinerie ausgestattet sind.\n\
  \n\
  Spiral HQ hat angeordnet, diese Fabriken und Kriegsmaschinen auszuschalten, wann immer es m\u00f6glich ist, um zuk\u00fc\
  nftige Opfer zu vermeiden.

m.p_r7_gate_gremlin = Gef\u00e4hrlicher Raubzug
o.p_r7_gate_gremlin = Stehle die Gremlin-Schemata von der Gremlin-Baustelle
b.p_r7_gate_gremlin = Auf Gremlin-Baustellen gibt es oft wertvolle Baupl\u00e4ne f\u00fcr \
  Gremlin-Strukturen und sogar Waffen. Wenn Spiral HQ diese erh\u00e4lt, bieten sie seltene \
  Einblicke in die Gremlin-Technik.\n\
  \n\
  Gremlin-Schemata werden meist auf Terminals irgendwo auf der Baustelle gespeichert. Diese \
  Terminals sind gesch\u00fctzt und stark bewacht. Wenn du die Aufmerksamkeit eines Gremlins \
  erregst, rechne damit, dass die ganze Truppe kommt!

m.p_r7_gate_fiend = Gefangene Angestellte
o.p_r7_gate_fiend = Befreie die gefangenen Knights aus dem d\u00e4monischen Konzerngef\u00e4ngnis
b.p_r7_gate_fiend = Eine d\u00e4monische Stadt ist ein seltsamer Ort, den Spiral HQ immer noch \
  nicht so ganz versteht. D\u00e4monen sind \u00fcberall, und wenn sie einen ihrer Bosse in der \
  N\u00e4he sehen, tun sie alles, um flei\u00dfig und produktiv auszusehen. Ungl\u00fc\
  cklicherweise bedeutet Produktivit\u00e4t oft das Angreifen oder Gefangennehmen von \
  Eindringlingen wie einer Truppe Knights, die gerade auf der Durchreise ist.\n\
  \n\
  Es ist nicht klar, welchen Zweck gefangene Knights in der d\u00e4monischen Agenda haben. Die, \
  die die Gefangenschaft \u00fcberlebt haben, berichten von schlechten Bedingungen, aber das \
  Schlimmste sei der ganze Papierkram, den sie t\u00e4glich h\u00e4tten ausf\u00fcllen m\u00fc\
  ssen. Ein Schicksal, das kein Knight verdient!

m.p_r7_gate_undead = Todesangst
o.p_r7_gate_undead = Rette den verlorenen Knight davor, den Reihen der Toten im verwunschenen \
  Gutshaus beizutreten!
b.p_r7_gate_undead = Die Ruinen des Owlite-Schlosses sind ein finsterer, verfluchter Ort, an \
  dem es vor untoten Spookats nur so wimmelt. Die schlimmsten davon, die scheinbar \
  unverwundbaren Grimalkins, lauern ewig in den Schatten und warten auf den Moment, an dem dein \
