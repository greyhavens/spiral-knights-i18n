m.p_halloween_r3 = Die dunkle Ernte
o.p_halloween_r3 = Suche Audienz beim Punkin King.
b.p_halloween_r3 = Jedes Jahr zahlen die Strangers einem ungew\u00f6hnlichen Geist Tribut, der \
  als 'Punkin King' bekannt ist, um eine gesunde Ernte zu sichern. Dieses schlitzohrige Phantom \
  erfreut sich daran, seinem Publikum Streiche zu spielen, aber belohnt sie auch gern mit k\u00f6stlichen S\u00fc\u00dfigkeiten im Ausgleich f\u00fcr den \u00c4rger.\n\
  \n\
  Feiere das Dunkle Erntefest mit und hilf den Strangern, indem Du den Punkin King aufsuchst \
  und ihm Tribut zahlst. Du wirst auf dem Weg sicher einige S\u00fc\u00dfigkeiten ergattern, \
  also besuche den Stadtplatz von Haven und tausche sie f\u00fcr Preise ein!

