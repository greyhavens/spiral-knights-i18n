m.p_anniversary_shock_r3 = Ein Gremlin in gewalkiger Not
o.p_anniversary_shock_r3 = Sieh nach Groat, dem Gremlin-Koch
b.p_anniversary_shock_r3 = Wir haben Nachricht erhalten, dass Groat, ein in Emberlight ans\u00e4\
  ssiger Koch, sich... seltsam verh\u00e4lt. Es scheint, als h\u00e4tte Biscotti ihn damit \
  beauftragt, einige Back-Arbeiten f\u00fcr sie zu erledigen, aber die Verantwortung ist ihm \
  wohl zu Kopf gestiegen. Er ist ins Uhrwerk verschwunden, kurz nachdem Biscotti die letzte \
  Kiste Kuchenteig liefern lie\u00df. Da wieder einmal die Geburtstags-Feierlichkeiten auf dem \
  Spiel stehen, braucht Biscotti einige kulinarische K\u00e4mpfer, die ihr helfen, diesen \
  Schlamassel auszul\u00f6ffeln!

