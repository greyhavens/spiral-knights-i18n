m.p_r4_mat_0 = Monstr\u00f6se Forschung
o.p_r4_mat_0 = Liefere die verlangten Materialien f\u00fcr die Forschung beim Spiral HQ ab.
b.p_r4_mat_0 = Spiral HQ versucht fortlaufend, sein Verst\u00e4ndnis der Kreaturen des Uhrwerks \
  durch die Untersuchung von Materialien zu verbessern. Wenn du Materialien \u00fcbrig hast, \
  kannst du dein Prestige verbessern, indem du Materialien an Spiral HQ stiftest.

