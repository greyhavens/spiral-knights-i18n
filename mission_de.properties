m.laboratory_visit = Ein Besuch im Labor
o.laboratory_visit = Besuche das Labor und triff dich mit Biotech Morlin
b.laboratory_visit = Biotech Morlin ist f\u00fcr das Labor verantwortlich, das sich in der \
  Garnison von Haven befindet. Er sucht einen f\u00e4higen Knight, der bereit ist es mit dem \
  Uhrwerk aufzunehmen und eine Ladung 'Kampfsprites' sicherzustellen, die w\u00e4hrend des \
  Absturzes der Skylark verloren gingen.

m.laboratory_visit_1a = Gr\u00fc\u00dfe, {0}! Ich habe geh\u00f6rt, dass du k\u00fcrzlich den gro\u00dfen Abgrund \u00fc\
  berquert und in Haven angekommen bist. Bist du, w\u00e4hrend du da drau\u00dfen warst, auf \
  irgendwelche unserer Kampfsprites gesto\u00dfen?

r.laboratory_visit_1a = Was ist ein 'Kampfsprite'?

m.laboratory_visit_2a = Ah, richtig, du bist ein neuer Rekrut. Die meisten Knights begegnen \
  ihren ersten Kampfsprites auf dem Schlachtfeld. Wahrscheinlich hattest du noch nie die \
  Gelegenheit, einen zu sehen.\n\
  \n\
  Erlaube mir, es dir zu erkl\u00e4ren...

r.laboratory_visit_2a = Weiter

#(image of proto sprite)
m.laboratory_visit_3a = Ein Kampfsprite ist eine Konstruktion, die von einer k\u00fcnstlichen \
  Intelligenz gesteuert wird und f\u00fcr Erkundungen und leichte Unterst\u00fctzung im Kampf \
  geeignet ist. Kampfsprites sind sehr anpassungsf\u00e4hig. Ihre k\u00fcnstliche Intelligenz \
  erlaubt es ihnen, ihre Umbgebung genau zu beobachten und ihrem Knight in der bestm\u00f6glichen Weise zu helfen.

r.laboratory_visit_3a = Das klingt sehr n\u00fctzlich. Wo bekomme ich einen?

#(same image of proto sprite)
m.laboratory_visit_4a = Wenn ein Kampfsprite an einen Knight \u00fcbergeben wird, wird eine \
  'Bindung' in den Code des Sprites geschrieben, damit er den Knight unterst\u00fctzt, komme \
  was wolle. Er wird nie von seiner Seite weichen!\n\
  \n\
  Leider sind die Transportkisten, die die Kampfsprites der Skylark enthalten haben tief hinab \
  ins Uhrwerk gefallen nach dem Absturz.

r.laboratory_visit_4a = Wie kann ich helfen, Morlin?

m.laboratory_visit_5a = Ein Aufkl\u00e4rungstrupp hat es geschafft, herauszufinden wo viele \
  dieser Kampfsprites gelandet sind. Rhendon ist vorausgeschickt worden, um drei dieser Stellen \
  auszukundschaften und er wird sich mit dir im Uhrwerk treffen.\n\
  \n\
  Du musst unsere Kampfsprites sicherstellen bevor sie in die H\u00e4nde der Feinde fallen!

r.laboratory_visit_5a = \u00dcberlass' das mir, Morlin. Ich werde diese Sprites sicherstellen.

# RANK 2-2

m.skies_under_cradle = Himmel unter Cradle
o.skies_under_cradle = Unternimm eine Expedition durch die Aurora-Inseln.
b.skies_under_cradle = Das Uhrwerk ist ein faszinierender, unterirdischer Komplex, der ganze \
  Welten in seinen kolossalen, eisernen Geo-Sph\u00e4ren beherbergt. Eine davon, die Aufkl\u00e4\
  rer-Knights entdeckt haben, sind die 'Aurora-Inseln', eine mysteri\u00f6se Gruppe schwebender \
  Inseln unter einem k\u00fcnstlichen Himmel.\n\
  \n\
  Als jemand, der gerade den Rang Lehrling errungen hat, hast du nun die Erlaubnis, die Ruinen \
  auf diesen Inseln zu erforschen und alle n\u00fctzlichen Materialien, die du dort entdecken \
  solltest, einzusammeln.

m.scarlet_fortress = Die scharlachrote Festung
o.scarlet_fortress = Unternimm eine Expedition durch die unheimlichen Hallen der Scharlachroten \
  Festung.
b.scarlet_fortress = Aufkl\u00e4rer-Knights haben eine Geo-Sph\u00e4re entdeckt, die etwas enth\u00e4\
  lt, das vollkommen anders ist als die Aurora-Inseln - die \u00dcberreste einen scheinbar \
  uralten Schlosses. Genannt 'Scharlachrote Festung', ist dieses zerfallende Schloss die Heimat \
  einer Horde rastloser Geister. Bewege dich mit gro\u00dfer Vorsicht, wenn du seine gewundenen \
  G\u00e4nge erforschst.

m.monstrous_research = Monstr\u00f6se Forschung
o.monstrous_research = Liefere die verlangten Materialien zur Erforschung beim Spiral HQ ab.
b.monstrous_research = Du hast vermutlich inzwischen bei deinen fr\u00fchen Expeditionen ins \
  Uhrwerk einige Materialproben angesammelt. Spiral HQ h\u00e4tte gerne f\u00fcr die \
  fortlaufende Erforschung der Kreaturen, die das Uhrwerk bev\u00f6lkern, einige dieser \
  Materialien.

m.alchemy_beginners = Alchemie f\u00fcr Anf\u00e4nger
o.alchemy_beginners = Erfahre mehr \u00fcber die Wunder der Alchemie!
b.alchemy_beginners = Alchemie ist eine Kunst, die die Spiral Knights gemeistert haben und die \
  es m\u00f6glich macht, die Kr\u00e4fte zu erwecken und zu verbinden, die vielen Materialien \
  innewohnen, und neue, m\u00e4chtige Gegenst\u00e4nde aus ihnen zu erschaffen! Die Spiral \
  Order hat sich darauf verlegt, genau die Arsenale, auf die sich die Spiral Knights seit \
  Jahrhunderten verlassen, prim\u00e4r durch Alchemie herzustellen.\n\
  \n\
  Finde heraus, wie sie ein wichtiger Teil deines \u00dcberlebens in dieser fremden Welt werden \
  wird!

#(port to alchemy station in the bazaar)
m.alchemy_beginners_1a = Aber hallo, {0}! Ich bin Bosco und ich bin hier, um dir einen \u00dcberblick \u00fc\
  ber die Grundlagen der Alchemie zu geben.\n\
  \n\
  Es ist wirklich sehr einfach, dank der Alchemie-Stationen. Die machen all die schwere Arbeit \
  f\u00fcr dich!

r.alchemy_beginners_1a = Ich bin ganz Ohr, Bosco.

#(image)
m.alchemy_beginners_2a = Okay, hier das Wesentliche: Sammle Materialien und Rezepte und \
  verwandle sie in Waffen und Ausr\u00fcstung. Einfach, nicht?

r.alchemy_beginners_2a = Weiter

#(image)
m.alchemy_beginners_3a = Wenn du dir ein neues Rezept besorgt hast und es benutzt - das \
  verbraucht dann das Rezept, aber es ist so f\u00fcr immer unter deinen bekannten Rezepten \
  gespeichert! Sobald du ein Rezept gelernt hast, kannst du so viele Gegenst\u00e4nde mit \
  diesem Rezept erstellen, wie du m\u00f6chtest. Sofern du die richtigen Materialien hast.

r.alchemy_beginners_3a = Weiter

#(image)
m.alchemy_beginners_4a = Wenn du eine Alchemie-Station benutzt, wird sich das Alchemie-Men\u00fc \u00f6\
  ffnen, wo du deine bekannten Rezepte sehen kannst...

r.alchemy_beginners_4a = Weiter

#(image)
m.alchemy_beginners_5a = ... und die f\u00fcr die Umwandlung des Gegenstands ben\u00f6tigten \
  Materialien, Orbs of Alchemy und Crowns.

r.alchemy_beginners_5a = Weiter

#(image)
m.alchemy_beginners_6a = Viele Rezepte ben\u00f6tigen Gegenst\u00e4nde, die ausger\u00fcstet werden k\u00f6\
  nnen und die eine gewisse Stufe haben. Diese nennen sich bei einem Rezept 'Spezial'-Gegenst\u00e4\
  nde und du kannst den gew\u00fcnschten, speziellen Gegenstand selbst ausw\u00e4hlen, sofern \
  es die richtige Art Gegenstand ist.\n\
  \n\
  Das ist n\u00fctzlich, wenn das Rezept nach einem bestimmten Gegenstand verlangt, von dem du \
  mehrere hast, aber eines besser ist als ein anderes.

r.alchemy_beginners_6a = Weiter

#(image)
m.alchemy_beginners_7a = Sobald du bereit bist, den Gegenstand herzustellen, dr\u00fccke \
  'Umwandeln' und sei gespannt!

r.alchemy_beginners_7a = Gespannt sein?

#(image)
m.alchemy_beginners_8a = Ja, wirklich! Denn jedesmal, wenn du per Alchemie einen Gegenstand \
  umwandelst, besteht eine Chance, dass du eine von vielen verschiedenen Einmaligen Varianten \
  erh\u00e4ltst, die deinen Gegenstand sehr viel m\u00e4chtiger macht!

r.alchemy_beginners_8a = Klingt toll!

m.alchemy_beginners_9a = Das deckt die Grundlagen der Alchemie ab. Ich kann das gerne nochmal \
  erkl\u00e4ren oder vermerken, dass du die Mission abgeschlossen hast, und dich deiner Wege \
  gehen lassen.

r.alchemy_beginners_9a = Lass uns das noch einmal durchgehen.
r.alchemy_beginners_9b = Ich denke, ich habe verstanden, danke!

m.alchemy_beginners_10a = Kein Problem, dann nochmal von vorn...
r.alchemy_beginners_10a = Weiter
#(start from the first image)
m.alchemy_beginners_10b = Du wirst in k\u00fcrzester Zeit die erstaunlichsten Dinge per \
  Alchemie herstellen! Weisst du was, hier sind einige Rezepte, um dir den Einstieg zu \
  erleichtern.

r.alchemy_beginners_10b = Mission abschlie\u00dfen

m.time_to_crafty = Es wird Zeit f\u00fcrs Handwerk
o.time_to_crafty = Alchemisiere eine Hot Edge und eine Frost Gun und liefere sie zur Inspektion \
  ab.
b.time_to_crafty = Bosco m\u00f6chte, dass du eine Hot Edge und eine Frost Gun alchemisierst, \
  so dass er sie untersuchen kann. Wenn sie okay sind, wird er Spiral HQ davon unterrichten, \
  dass du die lebenswichtige Kunst der Alchemie verstanden hast und sogar einige m\u00e4chtige \
  einmalige Varianten in deine neuen Waffen einbauen. Was f\u00fcr ein gro\u00dfz\u00fcgiger Kerl!

m.mission_sprite_1 = Eine flammende Offenbarung
o.mission_sprite_1 = Finde eine Kiste verlorener Kampfsprites und bringe sie zur\u00fcck ins Labor
b.mission_sprite_1 = Rhendon wartet im Uhrwerk auf dich in einer Gegend, die als \
  Abendrot-Steppe bekannt ist und wo Kundschafter eine Kiste der verlorenen Kampfsprites \
  lokalisiert haben. Birg die Sprites und befreie das Areal von Gefahren. Du bist dazu \
  authorisiert, jegliche Sprites, die du sicherstellen kannst zu nutzen, um die Mission \
  abzuschlie\u00dfen.

m.mission_sprite_1_1a = Okay, {0}, legen wir los. Sieht aus, als w\u00fcrden wir beide auf eine \
  kleine Sprite-Jagd gehen, was?\n\
  \n\
  Ich habe mein Suchger\u00e4t mit den Informationen der Aufkl\u00e4rer abgeglichen, aber \
  irgend etwas stimmt nicht. Die Energiesignatur, die ich empfange, ist unregelm\u00e4\u00dfig, \
  aber immer noch definitiv ein Kampfsprite. Sie k\u00f6nnten in Gefahr sein, also beeilen wir \
  uns!

m.mission_sprite_1_2a = Was zum.. sind das.. Kampfsprites? Mit denen ist irgend etwas passiert, \
  sie haben sich in eine Art Kreaturen verwandelt.

#>(auto proceed)
#[image of Rhendon reaching out to a Drakon who is responding in a friendly manner]
#(Rhendon reaches out to one of the battle sprites)

m.mission_sprite_1_3a = Sie scheinen freundlich zu sein. In der Tat benehmen sie sich genau wie \
  die Kampfsprites die ich kenne. Der einzige Unterschied ist sie, \u00e4hm, nun, sehen aus wie \
  Drachen.

#>(auto proceed)

#[spawn a drakon on every party member]
m.mission_sprite_1_4a = Hey, es sieht aus, als w\u00fcrde dich einer der Sprites m\u00f6gen! \
  Na, lass uns diese zus\u00e4tzliche Unterst\u00fctzung nicht verschwenden, ich werde hier \
  bleiben und diese Sprites verteidigen. Befreie du den Rest des Areals mit Hilfe deines neuen \
  Freundes von Gefahren.

m.mission_sprite_1_5a = Ich werde hierbleiben und diese Sprites verteidigen. Einige dieser \
  Sprite-Transportkisten sind leer. Ich glaube jemand oder etwas ist hinter ihnen her.\n\
  \n\
  Geh du weiter und befreie das Areal von Gefahren, damit der Rettungstrupp hier sicher \
  ankommen kann.

r.mission_sprite_1_5a = Ich bin dabei!

# Post-mission lab report
# Note: Morlin is standing over by the sprite table thing examining the drakon
m.mission_sprite_1_6a = Das ist faszinierend! Die Kampfsprites die du aus der Abendrot-Steppe \
  geborgen hast haben sich irgendwie in neue Wesen verwandelt!

r.mission_sprite_1_6a = Sie sehen aus wie Drachen aus M\u00e4rchen.

m.mission_sprite_1_7a = In der Tat. Obwohl ihre zellulare Identit\u00e4t noch immer v\u00f6llig \
  die eines Kampfsprites ist. Meine Theorie ist, dass sie sich sehr schnell weiterentwickelt \
  haben, um in ihrer neuen Umgebung \u00fcberleben zu k\u00f6nnen, aber wie? Unsere Technologie \
  w\u00e4re zu so etwas niemals f\u00e4hig...

r.mission_sprite_1_7a = Cradle wird mit jedem Tag der vergeht mysteri\u00f6ser.

m.mission_sprite_1_8a = Ja. Es scheint, als k\u00f6nnten wir viel von diesem Ort lernen.\n\
  \n\
  Rhendons Bericht deutet an, dass viele der Sprites nicht mehr an Ort und Stelle sind. Er \
  vermutet, dass da etwas nicht mit rechten Dingen zugeht.

r.mission_sprite_1_8a = Vielleicht versuchen die Gremlins, unsere Technologie zu stehlen?

m.mission_sprite_1_9a = Wenn das der Fall ist, m\u00fcssen wir weiteren Schaden verhindern. \
  Aber f\u00fcr den Moment, bitte, es gibt noch mehr Sprites, die gerettet werden m\u00fcssen. Und wer wei\u00df\
  , was wir entdecken wenn wir dort ankommen!

r.mission_sprite_1_9a = Konversation beenden

m.mission_sprite_2 = Engel der Antike
o.mission_sprite_2 = Finde eine Kiste verlorener Kampfsprites und bringe sie zur\u00fcck ins Labor
b.mission_sprite_2 = Rhendon wartet im Uhrwerk auf dich in einer Gegend, die als Rastlose Bahn \
  bekannt ist und wo Kundschafter eine Kiste der verlorenen Kampfsprites lokalisiert haben. \
  Birg die Sprites und befreie das Areal von Gefahren. Du bist dazu authorisiert, jegliche \
  Sprites, die du sicherstellen kannst zu nutzen, um die Mission abzuschlie\u00dfen.

m.mission_sprite_2_1a = Wie sieht es mit diesem Ort aus, hm? Scheint wie eine Art alter \
  Bahnhof, \u00fcberrannt von rastlosen Geistern. Was f\u00fcr ein seltsamer Ort f\u00fcr hier unten.\n\
  \n\
  Na, jedenfalls beeilen wir uns besser, zu dieser verlorenen Kiste zu kommen, nachdem was wir \
  da in der Abendrot-Steppe gefunden haben. Gehen wir!

m.mission_sprite_2_2a = Erst Drachen und jetzt.. kleine, gefl\u00fcgelte Katzenwesen? Ich kann \
  nicht glauben, dass wir diesem Ph\u00e4nomen schon wieder begegnen!

#>(auto proceed)
#[spawn a seraphynx on every party member]
m.mission_sprite_2_3a = Wow, {0}, du scheinst ein H\u00e4ndchen f\u00fcr Kampfsprites zu haben! \
  Lass uns keine Zeit verschwenden. Sichere den Pfad vor uns, damit das Rettungsteam hier \
  sicher hergelangen kann.

m.mission_sprite_2_4a = Uh, ich glaube diese Sprites studieren diese alten B\u00fccher. Ich \
  wusste nicht einmal, dass sie lesen k\u00f6nnen!\n\
  \n\
  Na, jedenfalls bleibe ich hier, um diese Sprites zu verteidigen. Ich sehe auch mehr leere \
  Transportkisten; nicht gut. Geh du weiter und befreie das Areal von Gefahren, damit der \
  Rettungstrupp hier sicher ankommen kann.

r.mission_sprite_2_4a = Ich bin dabei!

# Post-mission lab report

m.mission_sprite_2_6a = Und wieder einmal scheinen diese Sprites ihre Form ihrer Umgebung \
  angepasst zu haben.

r.mission_sprite_2_6a = Zu was sind sie diesmal geworden?

m.mission_sprite_2_7a = Das ist nicht ganz klar, {0}. Ausgehend von Rhendons Bericht w\u00fcrde \
  ich sagen, dass sie etwas von den alten, magischen W\u00e4lzern gelernt haben, die du in der \
  N\u00e4he dieser Sprites gefunden hast. Faszinierend, dass sie einige ihrer Kampff\u00e4\
  higkeiten aufgrund dessen angepasst haben.

r.mission_sprite_2_7a = Erz\u00e4hlst du mir gerade, dass diese Sprites Zauberspr\u00fcche aus \
  einem alten Buch gelernt haben?

m.mission_sprite_2_8a = Ja, es scheint, als h\u00e4tten diese Sprites die F\u00e4higkeit \
  gemeistert, ihre Kr\u00e4fte darauf zu konzentrieren, ihren Knight zu sch\u00fctzen. Aufgrund \
  dessen und aufgrund ihrer Erscheinung habe ich sie 'Seraphynx' getauft.


m.mission_sprite_2_9a = Ja, ich wei\u00df. Na, auf jeden Fall, ich wei\u00df, dass einige der \
  Sprite-Transportkisten leer waren. Irgendwas stimmt nicht...\n\
  \n\
  Also, stelle diese letzte Ladung Sprites sicher bevor wer oder was auch immer die stiehlt sie \
  findet!

r.mission_sprite_2_9a = Ich bin unterwegs.

m.mission_sprite_3 = Die Maske des Phantoms
o.mission_sprite_3 = Finde eine Kiste verlorener Kampfsprites und bringe sie zur\u00fcck ins Labor
b.mission_sprite_3 = Rhendon wartet im Uhrwerk auf dich in einer verlassenen Chemiefabrik der \
  Gremlins, wo Kundschafter eine Kiste der verlorenen Kampfsprites lokalisiert haben. Birg die \
  Sprites und befreie das Areal von Gefahren. Du bist dazu authorisiert, jegliche Sprites, die \
  du sicherstellen kannst zu nutzen, um die Mission abzuschlie\u00dfen.

m.mission_sprite_3_1a = Sei hier auf der Hut, {0}, was auch immer die Gremlins hier getrieben \
  haben, es hat eine \u00e4usserst heimt\u00fcckische Umgebung geschaffen.\n\
  \n\
  Beeilen wir uns, die Sprite-Kiste zu gelangen, bevor noch mehr verloren gehen!

m.mission_sprite_3_2a = Wah, sind das Sprites oder eine Art Phantome?

m.mission_sprite_3_3a = Die Sprites haben sich schon wieder ver\u00e4ndert und dieses Mal jagen \
  sie mir Schauer \u00fcber den R\u00fccken!

# [spawn a maskeraith on every party member]

m.mission_sprite_3_4a = Hehe, nicht hinkucken, {0}, aber da ist ein Geist an deiner Schulter! \
  Lass uns hoffen, dass diese Sprites nicht all ihre Energie in gutes Aussehen gesteckt haben.\n\
  \n\
  Nutze diesen da, um den Pfad vor uns zu sichern, damit der Rettungstrupp sicher durchkommt!

m.mission_sprite_3_5a = Nochmal, jede Menge leere Transportkisten. Da braut sich was zusammen, \
  {0}. du gehst besser weiter und befreist das Areal von Gefahren, damit der Rettungstrupp \
  sicher ankommen kann.

r.mission_sprite_3_5a = Noch etwas ausserdem?

m.mission_sprite_3_6a = Ich bin neugierig.. was meinst du ist hinter ihren Masken? Warte, nein, \
  ich will es nicht wissen.

r.mission_sprite_3_6a = Konversation beenden

# Post-mission lab report

m.mission_sprite_3_7a = Unsere Entdeckungen auf diesem Planeten werden von Tag zu Tag \
  seltsamer. Jetzt nehmen unsere Sprites die Form von einer Art von Phantom an.

r.mission_sprite_3_7a = Sie sehen aus wie lebendige Schatten.

m.mission_sprite_3_8a = Ja, so ziemlich. Diese Sprites haben sich die F\u00e4higkeit sich zu \
  verschleiern angeeignet; die Eigenschaft, die Schatten um sich herum zur T\u00e4uschung zu \
  verwenden. Damit und mit ihrem zus\u00e4tzlichen Talent, Ablenkungen und Gifte zu verwenden, \
  w\u00fcrde ich mal sagen, dass sie auf dem Schlachtfeld recht n\u00fctzlich sein k\u00f6nnten.

r.mission_sprite_3_8a = Ich sch\u00e4tze mal, auch denen hast du einen Namen verpasst?

m.mission_sprite_3_9a = Aber klar, angelehnt an ihre Erscheinung finde ich, dass 'Maskeraith' \
  recht gut passt!

r.mission_sprite_3_9a = Entz\u00fcckend.

m.mission_sprite_3_10a = Dein Sarkasmus wurde zur Kenntnis genommen.\n\
  \n\
  Also, wegen dieser leeren Sprite-Transportkisten; wir haben schon festgestellt, dass da was \
  nicht stimmt.

r.mission_sprite_3_10a = Erz\u00e4hle mir die Details.

m.mission_sprite_3_11a = Ein Aufkl\u00e4rungstrupp hat \u00fcber ein gro\u00dfes \
  Konstrukt-Monster berichtet, von einer Art die wir bisher noch nicht gesehen haben, das sich \
  mit einigen Kampfsprites aus dem Staub gemacht hat. Wir glauben, dass die Gremlins hinter \
  alledem stecken.

r.mission_sprite_3_11a = Ich werde ihren fiesen Pl\u00e4nen ein Ende bereiten.

m.mission_sprite_3_12a = Ich bewundere deinen Mut, aber wenn die ersten Berichte \u00fcber \
  dieses Konstrukt-Monster stimmen, wirst du weitere Hilfe ben\u00f6tigen. Ich werde eine \
  Auswahl an Kampfsprites vorbereiten, bereit sich an dich zu binden, {0}. Reden wir wieder \
  miteinander, sobald ich die n\u00f6tigen Vorbereitungen getroffen habe.

r.mission_sprite_3_12a = Bis bald, Morlin.

# RANK 2-3

m.choose_your_sprite = Ein ewiges Band
o.choose_your_sprite = Sprich mit Morlin und w\u00e4hle einen Sprite als deinen Begleiter
b.choose_your_sprite = Morlin hat drei der Kampfsprites, die du gerettet hast, f\u00fcr dich \
  zum Ansehen vorbereitet. Du bist dazu authorisiert, einen dieser Kampfsprites auszuw\u00e4\
  hlen, damit er an dich gebunden wird. Dieser Kampfsprites wird dir f\u00fcr immer bei deinen zuk\u00fc\
  nftigen abenteuern zur Seite stehen, also w\u00e4hle weise.\n\
  \n\
  Diese Mission kann nicht wiederholt werden.

m.choose_your_sprite_1a = Gr\u00fc\u00dfe, {0}! Nachdem ich jetzt genug Zeit zur Untersuchung \
  der Kampfsprites die du befreit hast hatte, kann ich dir f\u00fcr jeden eine gute Einsch\u00e4tzung bieten.\n\
  \n\
  Trotz ihrer, nunja, seltsamen Erscheinung, sind wir zu dem Schlu\u00df gekommen, dass diese \
  'neuen' Kampfsprites nicht nur f\u00fcr den Kampf geeignet sind, sondern durch ihre \
  Transformation vielleicht noch zus\u00e4tzliche, verbesserte F\u00e4higkeiten haben k\u00f6nnten.

r.choose_your_sprite_1a = Weiter

m.choose_your_sprite_2a = Ich werde dir f\u00fcr jeden Kampfsprite eine kurze Zusammenfassung \
  geben. Angesichts deiner Tapferkeit bei der Rettung dieser Sprites, hat Spiral HQ dich \
  authorisiert, dich mit einem zu verbinden. Diese Verbindung h\u00e4lt f\u00fcr immer und ist \
  eine nennenswerte Verantwortung.\n\
  \n\
  Bitte denke gr\u00fcndlich nach, bevor du deine Entscheidung triffst; es gibt kein zur\u00fc\
  ck, nachdem du dich einmal entschieden hast.

r.choose_your_sprite_2a = Ich verstehe, Morlin.

m.choose_your_sprite_3a = Es sind drei unterschiedliche Kampfsprites verf\u00fcgbar. Jeder \
  davon hat unterschiedlich auf die Kr\u00e4fte reagiert, die von dieser Welt ausgestrahlt \
  werden und jeder davon bietet eine einzigartige Erfahrung im Kampf.\n\
  \n\
  Diese Sprites sind der feurige Drakon, der leuchtende Seraphynx und der schattenhafte \
  Maskeraith.

r.choose_your_sprite_3a = Erz\u00e4hle mir etwas \u00fcber den Drakon
r.choose_your_sprite_3b = Erz\u00e4hle mir etwas \u00fcber den Seraphynx.
r.choose_your_sprite_3c = Erz\u00e4hle mir etwas \u00fcber den Maskeraith.
r.choose_your_sprite_3d = Ich bin bereit, meinen Kampfsprite auszuw\u00e4hlen.
r.choose_your_sprite_3e = Ich bin noch nicht bereit, zu w\u00e4hlen.

#[image of a drakon using his skills]
m.choose_your_sprite_4a = Der Drakon ist ein Kampfsprite, der feurige Zerst\u00f6rung verk\u00f6rpert. Seine F\u00e4\
  higkeiten konzentrieren sich auf diekten Angriff: Feuerball erzeugt ein explosives Geschoss, \
  Flammenbarriere umgibt den Knight mit sch\u00fctzenden Feuerb\u00e4llen und Feuersturm \
  erzeugt eine massive Flammenwelle.\n\
  \n\
  Der Drakon eignet sich am besten f\u00fcr furchtlose Knights, die den zerst\u00f6rerischen \
  Kampf an vorderster Front bevorzugen.

r.choose_your_sprite_4a = Der Drakon klingt wie der Kampfsprite f\u00fcr mich!
r.choose_your_sprite_4b = Erz\u00e4hle mir etwas \u00fcber die anderen Kampfsprites.

#[image of a seraphynx using his skills]

m.choose_your_sprite_5a = Der Seraphynx ist ein Kampfsprite, der Schutz und Genesung verk\u00f6rpert. Seine F\u00e4\
  higkeiten konzentrieren sich darauf, Knights im Kampf zu unterst\u00fctzen: Lichtstrahl \
  erzeugt einen durchgehenden Strahl heiligen Lichts, Herzattacke erh\u00f6ht die Chance, dass \
  Monster Herzen fallen lassen und Engelsaura erzeugt einen Schild aus Licht, der den eigenen \
  Knight und andere Gruppenmitglieder, die sich darunter befinden, sch\u00fctzt.\n\
  \n\
  Der Seraphynx eignet sich am besten f\u00fcr Knights, die ihre Gruppe sch\u00fctzen und unterst\u00fctzen wollen.

r.choose_your_sprite_5a = Der Seraphynx klingt wie ein Kampfsprite f\u00fcr mich!

#[image of a maskeraith using his skills]

m.choose_your_sprite_6a = Der Maskeraith ist ein Kampfsprite, der T\u00e4uschung und Schw\u00e4chung verk\u00f6rpert. Seine F\u00e4\
  higkeiten konzentrieren sich auch Tricks und T\u00e4uschung: \u00c4tzende Stacheln feuert \
  giftige Stacheln ab, die explodieren, wenn dem eine Attacke folgt, Schattenmantel erlaubt es \
  einem Knight, f\u00fcr Monster unsichtbar zu werden und Verfluchender Nebel erlaubt es dem \
  Knight, Gegner mit einer zeitgesteuerten Schadensexplosion zu versehen.\n\
  \n\
  Der Maskeraith ist ideal f\u00fcr Knights, die sich in den Schatten verbergen und ihre Feinde \
  mit \u00dcberraschungsangriffen attackieren wollen.

r.choose_your_sprite_6a = Der Maskeraith klingt wie ein Kampfsprite f\u00fcr mich!

m.choose_your_sprite_7a = Ausgezeichnet! Welchen Kampfsprite w\u00e4hlst du als deinen \
  Begleiter?

r.choose_your_sprite_7a = Ich w\u00e4hle den Drakon.
r.choose_your_sprite_7b = Ich w\u00e4hle den Seraphynx.
r.choose_your_sprite_7c = Ich w\u00e4hle den Maskeraith.
r.choose_your_sprite_7d = Ich m\u00f6chte nochmal etwas \u00fcber die Kampfsprites h\u00f6ren.
r.choose_your_sprite_7e = Ich bin noch nicht bereit, zu w\u00e4hlen.

#[image of a drakon using his skills]
m.choose_your_sprite_8a = Du hast dich also f\u00fcr den feurigen Drakon entschieden, den \
  Kampfsprite f\u00fcr diejenigen, die den zerst\u00f6rerischen Kampf an vorderster Front \
  bevorzugen?\n\
  \n\
  Wenn du einmal gew\u00e4hlt hast gibt es kein Zur\u00fcck!

r.choose_your_sprite_8a = Ja, ich w\u00e4hle den Drakon.
r.choose_your_sprite_8b = Ich bin nicht sicher, erz\u00e4hle mir nochmal etwas \u00fcber die Kampfsprites.

#[image of a seraphynx using his skills]
m.choose_your_sprite_9a = Du hast dich also f\u00fcr den strahlenden Seraphynx entschieden, den \
  Kampfsprite f\u00fcr diejenigen, die ihre Gruppe sch\u00fctzen und unterst\u00fctzen wollen?\n\
  \n\
  Wenn du einmal gew\u00e4hlt hast gibt es kein Zur\u00fcck!

r.choose_your_sprite_9a = Ja, ich w\u00e4hle den Seraphynx.

#[image of a maskeraith using his skills]

m.choose_your_sprite_10a = Du hast dich also f\u00fcr den schattenhaften Maskeraith \
  entschieden, den Kampfsprite f\u00fcr diejenigen, die sich in den Schatten verbergen und ihre \
  Feinde mit \u00dcberraschungsangriffen attackieren wollen?\n\
  \n\
  Wenn du einmal gew\u00e4hlt hast gibt es kein Zur\u00fcck!

r.choose_your_sprite_10a = Ja, ich w\u00e4hle den Maskeraith.

m.choose_your_sprite_11a = Gratuliere, {0}! Dein Kampfsprite und du sind nun aneinander \
  gebunden! Er wird ohne Zweifel ein wertvoller Begleiter sein in den Missionen die noch vor \
  dir liegen.\n\
  \n\
  Wenn du weitere Fragen dazu hast, wie du deinen neuen Kampfsprite aufziehen sollst, sprich \
  mit mir oder Biscotti hier im Labor.

r.choose_your_sprite_11a = Danke, Morlin. Ich werde mein Bestes tun, mich gut um diesen Sprite \
  zu k\u00fcmmern.

m.choose_your_sprite_12a = Das ist in Ordnung, rede einfach wieder mit mir, wenn du bereit \
  bist, zu w\u00e4hlen.
r.choose_your_sprite_12a = Konversation beenden

# RANK 3-1

m.prestigious_opportunity = Eine prestigetr\u00e4chtige Gelegenheit
o.prestigious_opportunity = Kontaktiere Agent Kora und erhalte Autorisierung f\u00fcr Prestige-Missionen.
b.prestigious_opportunity = Es scheint, du hast dich in den Augen des Spiral HQ hervorgetan. \
  Kontaktiere Agent Kora und finde heraus wie du zus\u00e4tzliche Missionen f\u00fcr das Spiral \
  HQ in Angriff nehmen kannst.

m.prestigious_opportunity_1a = Gr\u00fc\u00dfe, {0}, und Gratulation zur Bef\u00f6rderung zum \
  Knappen! Deine Leistungen haben die Aufmerksamkeit des Spiral HQ erregt, und es wurde dir die \
  Erlaubnis gegeben, ab jetzt Prestige-Missionen zu unternehmen.\n\
  \n\
  Prestige-Missionen sind ausgesuchte Missionen, die dir t\u00e4glich angeboten werden und die \
  dir Prestige als Belohnung f\u00fcr das Erf\u00fcllen der Mission bieten. Manchmal verlangen \
  diese Missionen, Spiral HQ oder andere Knights mit Gegenst\u00e4nden zu versorgen oder \
  manchmal musst du daf\u00fcr auch das Uhrwerk erforschen.

r.prestigious_opportunity_1a = Klingt gut, Kora.

m.prestigious_opportunity_2a = Prestige-Missionen sind v\u00f6llig freiwillig und k\u00f6nnen \
  innerhalb eines Tages nicht wiederholt werden. Vergiss nicht, Ausschau nach speziellen \
  Missionen zu halten, die gro\u00dfe Prestige-Belohnungen bieten!

r.prestigious_opportunity_2a = Danke Kora, ich werde mein Bestes tun.

m.prestigious_opportunity_3a = Ich vertraue auf dich, {0}. Ich wei\u00df einfach, dass du unter \
  den einigen wenigen Knights sein wirst, die f\u00e4hig genug sind, den Core zu erreichen und \
  uns, mit etwas Gl\u00fcck, von diesem Planeten zu bringen.

r.prestigious_opportunity_3a = Mission abschlie\u00dfen

m.minerals_rock = Mineralien bringens!
o.minerals_rock = Melde dich bei Chief Geo Knight Wegner in der Arcade von Haven.
b.minerals_rock = Chief Geo Knight Wegner ist f\u00fcr die Erforschung der seltsamen Mineralien \
  verantwortlich, mit deren Abbau die Knights im Uhrwerk begonnen haben. Er glaubt, dass sie \
  die Antwort darauf enthalten, wie man den Kern erreichen und Energie zur Reparatur der \
  Skylark besorgen kann.\n\
  \n\
  Triff dich mit ihm in der Arcade von Haven und bringe in Erfahrung, wie du ihm bei seiner \
  Forschung helfen kannst und auch, wie du die wahre Kraft der Arcade nutzen kannst.


m.arc_mintut_1 = Hallo. Ich bin Wegner, Chief Geo Knight der skylark und der Leiter der \
  geologischen Studien im Uhrwerk.

r.arc_mintut_1 = Ich bin hier, um etwas \u00fcber die Mineralien zu lernen die man im Uhrwerk \
  findet.

# IMAGE: step1_minerals.png
m.arc_mintut_2 = W\u00e4hrend deiner Reisen durchs Uhrwerk wirst du auf f\u00fcnf spezielle \
  Mineralien stossen: Crimsonite, Moonstone, Valestone, Luminite und Dark Matter.

r.arc_mintut_2 = Weiter

# IMAGE: step2_gather.png
m.arc_mintut_3 = Du wirst in allen Ebenen des Uhrwerks Erz-Ablagerungen finden und du musst sie \
  attackieren, um sie zu einer Gr\u00f6\u00dfe zu zertr\u00fcmmern, die du tragen kannst. Du \
  kannst immer nur ein St\u00fcck auf einmal tragen, aber du kannst es austauschen, indem du \
  ein anderes aufhebst. Suche nach dem gr\u00f6\u00dften und sch\u00f6nsten das du finden \
  kannst. Das sind die wertvollsten.

r.arc_mintut_3 = Weiter

m.arc_mintut_4 = Wenn du den Transporter heil erreicht hast wird das Mineral das du tr\u00e4gst \
  in deinem Arsenal verstaut, f\u00fcr sp\u00e4tere Nutzung. Jeder in einer Gruppe bekommt auch \
  alle Mineralien der anderen, man muss also nicht darum streiten, wer das beste bekommt!

r.arc_mintut_4 = Weiter

m.arc_mintut_5 = Mineralien werden dazu verwendet, Sprite-Futter im Labor herzustellen. \
  Sprite-Futter ist sehr wichtig f\u00fcr die Entwicklung deines Sprites, also greif dir diese \
  Mineralien, wenn du sie siehst!

r.arc_mintut_5 = Weiter

m.arc_mintut_6 = Unsere geologischen Untersuchungen dauern an, also kann es sein, dass es noch \
  andere faszinierende Nutzungsm\u00f6glichkeiten f\u00fcr diese seltsamen und m\u00e4chtigen Mineralien gibt.

r.arc_mintut_6 = Klingt toll! Danke f\u00fcr die Informationen!

# TRUNCATED VERSION FOR WITHIN THE CLOCKWORKS
m.cwt_mintut_1 = Hier ist Wegner, Chief Geo Knight der Skylark. Ich registriere eine hohe \
  Konzentration von Mineralien bei deiner Position.

r.cwt_mintut_1 = Mineralien? Du meinst diese bunten Steins\u00e4ulen?

# IMAGE: step1_minerals.png
m.cwt_mintut_2 = Ja, genau! W\u00e4hrend deinen Reisen durch das Uhwerk wirst du auf f\u00fcnf \
  spezielle Mineralien sto\u00dfen: Crimsonite, Moonstone, Valestone, Luminite und Dark Matter.

r.cwt_mintut_2 = Weiter

# IMAGE: step2_gather.png
m.cwt_mintut_3 = Greife ein Mineral an, um es zu einer Gr\u00f6\u00dfe zu zerschlagen, die du \
  tragen kannst. Du kannst immer nur ein St\u00fcck tragen, aber du kannst es austauschen, \
  indem du ein anderes aufhebst. Suche nach dem gr\u00f6\u00dften, sch\u00f6nsten St\u00fcck, \
  das du finden kannst. Die sind am wertvollsten.

r.cwt_mintut_3 = Weiter

m.cwt_mintut_4 = Sobald du den Transporter erreichst, wird das Mineral das du tr\u00e4gst f\u00fcr sp\u00e4\
  tere Nutzung in dein Arsenal transferiert. Jeder in der Gruppe erh\u00e4lt auch alle \
  Mineralien der anderen, also gibt es keinen Grund zu streiten, wer das beste bekommt!

r.cwt_mintut_4 = Weiter

m.cwt_mintut_5 = Mineralien werden dazu verwendet, Sprite-Futter im Labor herzustellen. \
  Sprite-Futter ist f\u00fcr die Entwicklung deines Sprites sehr wichtig, also schnapp dir die \
  Mineralien, wenn du sie siehst!

r.cwt_mintut_5 = Weiter

m.cwt_mintut_6 = Unsere geologische Forschung ist fortlaufend, es kann also noch andere, \
  faszinierende Verwendungen f\u00fcr diese m\u00e4chtigen Mineralien geben.

r.cwt_mintut_6 = Klingt toll! Danke f\u00fcr die Informationen!

m.alien_ooze = Fremdartiger Schleim
o.alien_ooze = Rette das Feldforscher-Team vor einer Lichen-Kolonie.
b.alien_ooze = Ein Team unserer Feldforscher wird von einer gro\u00dfen Lichen-Kolonie \
  belagert. Lichen sind eine fremdartige Rasse aus der Glibber-Famlie, von der wir denken, dass \
  sie ins Uhrwerk gelangt sind als ein Meteor auf der Oberfl\u00e4che von Cradle abgest\u00fc\
  rzt ist. Diese spezielle Art von Glibber besteht aus zahllosen, kleinen Glibbern, die mobile, \
  intelligente 'Kolonien' bilden.\n\
  \n\
  Lichen-Kolonien k\u00f6nnen sich weiter verbinden, um immer gr\u00f6\u00dfere und gr\u00f6\u00df\
  ere Versionen von sich zu formen und sich so schnell mit einer Reihe t\u00f6dlicher Klauen \
  und Stacheln zu versehen. Halte sie mit allen Mitteln davon ab, sich zu verbinden und rette \
  das Forschungsteam!

m.alien_ooze_1a = Ich habe jetzt noch nichts zu sagen, aber es geht um Beast Bells (DEV ONLY)

r.alien_ooze_1a = Konversation beenden

m.toy_soldiers = Spielzeugsoldaten
o.toy_soldiers = Zerst\u00f6re das Produktionszentrum der Mechaknight-Fabrik.
b.toy_soldiers = Aufkl\u00e4rer-Knights berichten von einer erh\u00f6hten Zahl an Mechaknights \
  in der ersten Schicht des Uhrwerks und haben eine Mechaknight-Produktionsst\u00e4tte in der N\u00e4he von Haven entdeckt.\n\
  \n\
  Man glaubt, dass Mechaknights von Gremlins gebaute Wachen der Konstrukt-Familie sind, die \
  eine Menge Eigenschaften mit einem Spiral Kngiht gemein haben. Sei vorsichtig, wenn du nach \
  der Produktionsst\u00e4tte suchst und schalte sie dann f\u00fcr immer aus!

m.monstrous_research_2 = Monstr\u00f6se Forschung
o.monstrous_research_2 = Liefere die verlangten Materialien f\u00fcr die Forschung beim Spiral \
  HQ ab.
b.monstrous_research_2 = Du hast inzwischen sicher einige interessante Materialien in der \
  ersten Schicht des Uhrwerks gesammelt, die f\u00fcr das Spiral HQ von Nutzen w\u00e4ren. Hilf \
  bei der fortlaufenden Erforschung der Mysterien von Cradle mit, indem du Materialien \
  stiftest.

m.the_collector = Der Sammler
o.the_collector = Rette die Sprites und die Forscher vor dem Sammler
b.the_collector = Es gab vereinzelte Berichte von einem gro\u00dfen, mechanischen Wesen das wir \
  den 'Sammler' getauft haben, der unsere Knights abgefangen hat und sowohl sie als auch die \
  Sprites, denen sie gefolgt sind, in einer gut bewachten Anlage tief im Uhrwerk eingesperrt \
  hat. Bewaffnet mit deinem neuen Sprite ist es nun deine Aufgabe, diesen 'Sammler' zu finden \
  und die von ihm gefangenen Knights und Sprites zu retten.

n.collector_prisoner = Knight-Veteran
m.collector_prisoner_1a = Uff, ich kann kaum etwas sehen... hat Spiral HQ dich geschickt, uns \
  zu retten?

r.collector_prisoner_1a = Ja, aber kannst du mir sagen was passiert ist?

m.collector_prisoner_2a = Mein Rettungstrupp ist in den Hinterhalt einer mechanischen \
  Monstrosit\u00e4t geraten. Wir hatten keine Chance. Ich bin so froh, dass du hier rechtzeitig \
  aufgetaucht bist, denn ich wei\u00df nicht, was wir sonst gemacht h\u00e4tten.

r.collector_prisoner_2a = Schafft ihr es zur\u00fcck nach Haven?

m.collector_prisoner_3a = Ich denke schon... wir werden versuchen, uns hinauszuschleichen.\n\
  \n\
  Oh, aber sei vorsichtig! Was immer uns da auch erwischt hat ist noch da und bewacht eine gro\u00df\
  e Kiste mit gefangenen Kampfsprites. Wenn du vorhast, es zu bek\u00e4mpfen, h\u00fcte dich vor seinem t\u00f6\
  dlichen Sturmangriff. Gute Jagd!

r.collector_prisoner_3a = Konversation beenden

# RANK 3-2

m.pioneers = Die Pioniere
o.pioneers = Kontaktiere Agent Kora \u00fcber Comlink.
b.pioneers = Nach dem Absturz der Skylark hat Captain Ozlo eine Elite-Truppe von Spiral Knights \
  ausgew\u00e4hlt, die als erste das Uhrwerk betreten sollten. Man hat sie nie wiedergesehen. \
  Kontaktiere Agent Kora und finde heraus, wie du eine Rolle dabei spielen kannst, dieses \
  Mysterium aufzukl\u00e4ren.

m.pioneers_1a = Hallo {0}, ich hoffe alles l\u00e4uft gut. Es ist etwas passiert, das danach \
  verlangt, dass du dich deiner bisher gr\u00f6\u00dften Herausforderung stellst.\n\
  \n\
  Ich habe Anweisungen des Spiral HQ, die vom gro\u00dfen Captain Ozlo selbst kommen. Du \
  wurdest als einer der Knights ausgew\u00e4hlt, die aktiv nach Spuren des Alpha Squads suchen \
  sollen.

r.pioneers_1a = Alpha Squad? Da klingelt was...

m.pioneers_2a = Das sollte es. Es gibt eine Menge neuer Rekruten die st\u00e4ndig dar\u00fcber \
  reden. Sie sind sowas wie Helden f\u00fcr manche Knights.\n\
  \n\
  Das Alpha Squad war eine Elite-Truppe von Knights, die Ozlo pers\u00f6nlich ausgew\u00e4hlt \
  hat, als erste das Uhrwerk zu betreten und zu versuchen, die Quelle des gewaltigen \
  Energiesignals, das von dort unten hervordringt, ausfindig zu machen. Da alle Systeme der \
  Skylark f\u00fcr einige Wochen ausgefallen waren, war eine Kommunikation \u00fcber Funk nicht m\u00f6\
  glich. Stattdessen haben sie w\u00e4hrend ihrer Reisen eine Reihe von Aufkl\u00e4\
  rungs-Modulen hinterlassen, ein wenig wie eine Spur aus Brotkrumen.

r.pioneers_2a = Weiter

m.pioneers_3a = Als unsere Techniker endlich das Kommunikations-System der Skylark zum Laufen \
  gebracht hatten, konnten wir keine Verbindung zum Alpha Squad herstellen und wir haben \
  seither nichts mehr von ihnen geh\u00f6rt. Ihre Frequenz ist v\u00f6llig tot.\n\
  \n\
  Dass ihre Frequenz tot ist, verwirrt uns alle. Unsere Comlinks sind daf\u00fcr gemacht, allen \
  Arten extremer Beanspruchung zu widerstehen, sogar Explosionen. Mann, sie haben sogar den \
  Absturz der Skylark \u00fcberstanden. Es f\u00e4llt mir nichts ein, was die Verbindung v\u00f6llig zerst\u00f6ren k\u00f6nnen sollte.

r.pioneers_3a = Wo spiele ich hier nun eine Rolle?

m.pioneers_4a = Du musst herausfinden, was mit ihnen passiert ist. Du wirst damit anfangen, die \
  Stellen aufzusuchen, von denen bekannt ist, dass sich ihre Aufkl\u00e4rungsmodule dort \
  befinden und sammelst sie zur Auswertung ein. Es wird meine Aufgabe sein, herauszufinden wo \
  ungef\u00e4hr sie sind und dich dorthin zu dirigieren. Deine Aufgabe wird es sein, dich in \
  die Wildnis zu begeben und die Module zu bergen.\n\
  \n\
  Zus\u00e4tzlich werde ich dir einige kurze Hintergrundinformationen zu den vier Mitgliedern \
  des Alpha Squad geben: Gruppenf\u00fchrer Euclid, Besch\u00fctzer Grantz, Sp\u00e4her Parma \
  und Techniker Rulen.

r.pioneers_4a = Erz\u00e4hl mir von Gruppenf\u00fchrer Euclid.

m.pioneers_5a = Euclid war kein gew\u00f6hnlicher Knight. Als die meisten in seiner Division \
  ihre Knappen-Auszeichnung bekamen, hatte er bereits den Rang Avantgarde erreicht. Als \
  Gruppenf\u00fchrer leitete er eine Serie erfolgreicher Angriffe gegen die Morai w\u00e4hrend \
  der Befreiung von Isora. Er war ein brillianter Taktiker, daf\u00fcr bekannt, dass er eine \
  Aufgabe mit nur der H\u00e4lfte an Knights erledigt bekam, die andere Gruppen gebraucht h\u00e4tten.

r.pioneers_5a = Weiter

m.pioneers_6a = Aus diesem Grund suchte Ozlo ihn aus, eine kleine Gruppe Knights in die \
  unbekannten Tiefen des Uhrwerks zu f\u00fchren. Wer mit den Feuern des Morai-Taifuns fertig \
  wird und sich in diesen K\u00e4mpfen bewiesen hat, schafft schlie\u00dflich alles, nicht?\n\
  \n\
  Aber vielleicht war das Uhrwerk selbst f\u00fcr seine F\u00e4higkeiten zuviel. Wir wissen es \
  nicht.

r.pioneers_6a = Erz\u00e4hl mir von Besch\u00fctzer Grantz.

m.pioneers_7a = Grantz war der wirkliche Veteran des Haufens. Als erprobter Besch\u00fctzer war \
  Grantz darauf spezialisiert, die Sicherheit seiner Truppe zu gew\u00e4hrleisten, schlicht \
  indem er alles zerschmettert hat, was f\u00fcr sie eine Gefahr darstellen k\u00f6nnte.\n\
  \n\
  Grantz nahm seinen Eid als Besch\u00fctzer sehr ernst und hat sich oft direkt in die \
  Schusslinie geworfen, um einen anderen zu verteidigen. Der Kerl war v\u00f6llig selbstlos. \
  Ich denke mir, wenn das Ganze f\u00fcr das Alpha Squad wirklich in einer Katastrophe geendet \
  hat, hat Grantz es nicht zu Ende gehen lassen, ohne noch einen h\u00f6llischen Kampf zu \
  liefern.

r.pioneers_7a = Erz\u00e4hl mir von Sp\u00e4her Parma.

m.pioneers_8a = Parma war die J\u00fcngste der Truppe, ein sehr talentiertere Sp\u00e4herin, \
  aber mit wenig Kampferfahrung. Sie und ich waren zusammen auf der Akademie, und ich erinnere \
  mich an den Tag, als die Simulator-Techniker dachten, ihr Programm w\u00e4re kaputt, so gut \
  hat Parma abgeschnitten. Sie hat sich sogar entschuldigt!\n\
  \n\
  Aber ich mache mir trotzdem Sorgen um sie. Nach dem, was ich in den Berichten gelesen habe, \
  ist das Uhrwerk komplett anders als alles, was wir kennen. Ich hoffe nur, dass sie ihr den R\u00fccken freihalten, w\u00e4\
  hrend sie ihren Job macht.

r.pioneers_8a = Erz\u00e4hl mir von Techniker Rulen.

m.pioneers_9a = Rulen ist das technische Genie, von dem Commander Ozlo glaubte, es w\u00fcrde ben\u00f6\
  tigt, um sich in der riesigen mechanischen Welt des Uhrwerks zurechtzufinden. Sein \
  Verantwortungsbereich umfasste alles vom \u00d6ffnen von Schl\u00f6ssern \u00fcber das Reparieren von R\u00fc\
  stungen bis zum Ausschalten von Konstrukten mit Bewusstsein. Au\u00dferdem hatte er die \
  Analyse des Core zu leiten, wenn das Team diesen erreichte.

r.pioneers_9a = Weiter

m.pioneers_10a = Rulen war sehr ... logisch. Ich glaube, er war sich der Chancen, den Core zu \
  erreichen und damit etwas zu machen, um die Skylark zu reparieren, voll bewusst. Ich denke, \
  er wusste genau, auf was f\u00fcr eine Mission er sich einlie\u00df, als sie das erste Mal in \
  die Dunkelheit des Uhrwerks hinabstiegen.

r.pioneers_10a = Wo fange ich an?

m.pioneers_11a = Genau, zur Sache. Wir haben ein Aufkl\u00e4rungsmodul des Alpha-Squad in einer \
  Gegend des Uhrwerks entdeckt, das als "D\u00fcsteres Dickicht" bekannt ist. Allerdings ist \
  diese Zone die Heimat einer furchtbaren Kreatur namens "der Snarbolax".\n\
  \n\
  Der Snarbolax hat mit Knappen wie dir kurzen Prozess gemacht, aber ich weiss, du kannst es \
  schaffen, {0}. Aber du wirst dich vorbereiten m\u00fcssen. Ich habe eine Reihe von Missionen \
  f\u00fcr dich, mit denen du dir eine Ausstattung zusammenstellen kannst, mit der du dich \
  dieser schrecklichen Bestie stellen und das Aufkl\u00e4rungsmodul zur\u00fcckholen kannst!

r.pioneers_11a = Ich werde mein Bestes geben, das Aufkl\u00e4rungsmodul zur\u00fcckzuholen und \
  den Snarbolax zu zerst\u00f6ren!

m.pioneers_12a = Wir z\u00e4hlen auf dich, {0}.

r.pioneers_12a = Gespr\u00e4ch beenden

m.faith_armor = Vertraue auf die R\u00fcstung
o.faith_armor = Bahne dir einen Weg durch die mit Fallen gespickte Kammer und rette den \
  Lehrling, Wilks.
b.faith_armor = Ein Lehrling namens Wilks, der gerade erst aus dem Rettungslager angekommen \
  ist, hat sich an einem Ort wiedergefunden, den Spiral HQ 'Fallen-Kammer' nennt. Diese Ebenen, \
  vermutlich von Gremlins entworfen, scheinen speziell daf\u00fcr gebaut worden zu sein, \
  diejenigen einzusperren und letztendlich zu eleminieren, die versuchen das Uhrwerk zu \
  erkunden.\n\
  \n\
  Wilks wusste wahrscheinlich nicht, worauf er sich da eingelassen hat, bevor es zu sp\u00e4t \
  war. Jetzt steckt er irgendwo in der Kammer fest und braucht deine Hilfe.\n\
  \n\
  Manche Fallen kann man umgehen und manchmal musst man schlicht den Schaden in Kauf nehmen. \
  Durch die Rettung von Wilks wirst du ohne Zweifel den Wert einer starken R\u00fcstung sch\u00e4tzen lernen.

m.strength_unity = Gemeinsam sind wir stark
o.strength_unity = Verteidige die Geo Knights vor einem monstr\u00f6sen Angriff.
b.strength_unity = Etwas hat eine Gruppe Bestien in den Aurora-Inseln aufgescheucht und sie \
  sind auf ein Forschungsteam der Geo Knights losgegangen. Das eingekreiste Team hat ein \
  Notsignal an Spiral HQ gesendet und die Aufgabe, sie zu retten, liegt bei dir.\n\
  \n\
  Durch Zusammenhalt haben die Geo Knights es bisher noch geschafft, aber ihnen l\u00e4uft die \
  Zeit davon. Stelle ein Team zusammen und stelle dich den Bestien, die deine Knight-Kameraden \
  zerfleischen wollen!

m.blades_fallen = Klingen der Gefallenen
o.blades_fallen = Platziere das Schwert eines unbekannten Knights am Denkmal im Friedhof der \
  Soldaten.
b.blades_fallen = Nicht jeder Knight der das Uhrwerk betritt kehrt zur\u00fcck und kann wieder \
  die Sonne auf seinem Gesicht sp\u00fcren. Diejenigen, die die Gefahren in den t\u00f6dlichen \
  Tiefen des Uhrwerks bezwingen, sehen sich immer wieder mit der Wahrheit konfrontiert, dass \
  jede Expedition ihre letzte sein k\u00f6nnte. Manchmal k\u00f6nnen ihre K\u00f6rper geborgen \
  werden und manchmal ist alles, was bleibt, die \u00dcberreste der Ausr\u00fcstung.\n\
  \n\
  Spiral HQ hat gleich ausserhalb von Haven einen Friedhof f\u00fcr Soldaten angelegt, wo \
  gefallene Knights zur Ruhe gelegt werden. Als Spiral Knight musst du dich der Realit\u00e4t \
  des Todes stellen, um seine Bedeutung zu begreifen.\n\
  \n\
  Liefere die \u00dcberreste eines unbekannten Knights, ein Schwert, bei einem Denkmal auf dem \
  Friedhof ab. Aber bleib wachsam - dunkle Energien gehen vom Friedhof aus, angezogen von den \
  zahllosen Seelen, die er beherbergt.

# RENAMED FROM roar_snarbolax
m.shadow_beast = Schatten der Bestie
o.shadow_beast = Besiege den Snarbolax im D\u00fcsteren Dickicht und berge das Aufkl\u00e4rungsmodul
b.shadow_beast = Spiral HQ hat ein Erk\u00e4rungsmodul entdeckt, das irgendwo im D\u00fcsteren \
  Dickicht vom Alpha Squad zur\u00fcckgelassen wurde. Die Mission ist, das Modul zu finden und \
  zu bergen.\n\
  \n\
  Dieser Wald beheimatet Rudel wilder Bestien, die sich schon fr\u00fcher als t\u00f6dlich f\u00fc\
  r unsere Truppen erwiesen haben. Deswegen haben Tech Knights in dieser Gegend Beast Bells \
  aufgestellt. Diese Glocken zu schlagen sollte alle Bestien, die von den Schallwellen erfasst \
  werden, bet\u00e4uben.\n\
  \n\
  Beachtet, dass Aufkl\u00e4rer davon berichtet haben, dass sich eine schreckliche Bestie in \
  den W\u00e4ldern aufh\u00e4lt, wie wir noch nie zuvor eine gesehen haben. Sie ist bekannt als \
  "Snarbolax" und erscheint als ein dunkles, schattengleiches Wesen bestehend aus F\u00e4ngen und Klauen, das v\u00f6\
  llig immun gegen unsere Waffen zu sein scheint. Solltet ihr ihm begegnen, lauft und versucht \
  so schnell wie m\u00f6glich zu entkommen.

# RANK 4-1
m.new_chapter = Ein neues Kapitel
o.new_chapter = Kontaktiere Agent Kora \u00fcber Comlink.
b.new_chapter = Nach dem Sieg \u00fcber Snarbolax und der Bergung des Aufkl\u00e4rungsmoduls \
  vom Alpha Squad ist es an der Zeit, sich mit Agent Kora in Verbindung zu setzen, um einen \
  Bericht \u00fcber die Analyse des Moduls zu erhalten, sowie Informationen zur Zertifikation \
  in der Halle der Helden.


m.new_chapter_1a = Gl\u00fcckwunsch zur Bef\u00f6rderung zum Soldaten, {0}! Ich habe geh\u00f6\
  rt, du hast diesen Snarbolax so richtig verm\u00f6belt, gut gemacht!\n\
  \n\
  Wir konnten Euclids Aufkl\u00e4rungsmodul, das du im Versteck des Snarbolax entdeckt hast, \
  analysieren. Nach diesen Aufzeichnungen scheint es, als h\u00e4tte Euclid vermutet, was \
  unsere Geo Knights einige Zeit nach dem Absturz entdeckt haben - dass die Ebenen im Uhrwerk \
  aus Gel\u00e4nde verschiedener fremder Welten bestehen!

r.new_chapter_1a = Was? Wie ist das m\u00f6glich?

m.new_chapter_2a = Das k\u00f6nnen wir noch nicht sicher sagen, aber es scheint, als bestehe \
  Cradle, wie es auch immer entstanden ist, aus gro\u00dfen Teilen anderer umliegender Welten. \
  Wenn das wahr ist, so haben wir so etwas noch nie zuvor gesehen.

r.new_chapter_2a = Was f\u00fcr eine seltsame Welt. Was hast du sonst f\u00fcr mich, Kora?

m.new_chapter_3a = Spiral HQ hat dich autorisiert, dich zur Halle der Helden zu begeben und \
  deine 2-Sterne-Zertifikation zu empfangen.\n\
  \n\
  Die Halle der Helden ist ein Ort, an dem aufstrebende Knights wie du neue Rezepte f\u00fcr Ausr\u00fc\
  stung lernen sowie Zertifikation f\u00fcr tiefere Ausfl\u00fcge ins Uhrwerk erlangen k\u00f6nnen.\n\
  \n\
  Dein erster Besuch erfordert nur, dass du vollst\u00e4ndig 2-Sterne-Ausr\u00fcstung tr\u00e4\
  gst, die du bereits hast, also sollte es ein Kinderspiel sein!

r.new_chapter_3a = Danke Kora, ich gebe mein Bestes.

m.shopping_again = Lass uns nochmal Einkaufen gehen!
o.shopping_again = Folge Bechamel auf einer Tour zu den fortgeschrittensten Angeboten im Basar
b.shopping_again = Bechamel hat dich bereits auf einer Tour durch den Basar von Haven begleitet \
  und dir gezeigt, wo es neue Waffen, R\u00fcstungen und Rezepte gibt. Jetzt ist es an der \
  Zeit, ihn erneut zu besuchen und mehr \u00fcber die fortgeschritteneren Angebote im Basar zu \
  erfahren.\n\
  \n\
  Du wirst Punch und Vise, Brinks und sogar Bechamels eigenen Laden besuchen!

m.shopping_again_1a = Hi, {0}! Wow, du bist schon Soldat? Du steigst wirklich schnell auf.\n\
  \n\
  Wie dem auch sei, ich bin hier, um dir die fortgeschritteneren Dienste im Basar zu zeigen. M\u00f6chtest du f\u00fc\
  r den Anfang erfahren, wie du deine Ausr\u00fcstung noch st\u00e4rker machen kannst?

r.shopping_again_1a = Aber garantiert!

m.shopping_again_2a = Wer w\u00fcrde das auch nicht, nicht wahr? Lass uns zu Punch und Vises \
  Werkstatt gehen.

r.shopping_again_2a = (Folge Bechamel)
#(move to Punch and Vise)

m.shopping_again_3a = Punch und Vise sind Gremlin-Schmiede, die die Eigenschaften deiner Waffen \
  und R\u00fcstung ver\u00e4ndern k\u00f6nnen.

r.shopping_again_3a = Gremlins?

m.shopping_again_4a = Keine Panik, {0}, nicht alle Gremlins sind aus dem gleichen Holz \
  geschnitzt. Einige stimmen dem Weg von K\u00f6nig Tinkinzar und der Crimson Order nicht zu. \
  Tats\u00e4chlich, so sagte man mir, gibt es irgendwo unten im Uhrwerk eine ganze Stadt voller \
  Gremlins, die die gro\u00dfe Kolonie verlassen haben.

r.shopping_again_4a = Na, wenn du es sagst...

m.shopping_again_5a = Dann machen wir mal weiter.\n\
  \n\
  Punch kann gegen eine Geb\u00fchr Einmalige Varianten zu deinen Waffen und R\u00fcstungen hinzuf\u00fc\
  gen. Aber seine Methoden sind ... \u00e4h, chaotisch. Man weiss nie so genau, was man \
  bekommt.\n\
  \n\
  Vise ist etwas pr\u00e4ziser. Er kann gegen Geb\u00fchr die Bindung deiner Ausr\u00fcstung \
  aufheben, so dass du sie verkaufen oder verschenken kannst!

r.shopping_again_5a = N\u00fctzlich, das merke ich mir. Was gibt es sonst?

m.shopping_again_6a = Lass uns Brinks besuchen.

r.shopping_again_6a = (Folge Bechamel)
#(move to Brinks)

m.shopping_again_7a = Brinks ist der Marken-H\u00e4ndler. Er h\u00e4ndigt Knights gewisse \
  Gegenst\u00e4nde im Tausch gegen Marken aus, die man im Uhrwerk finden kann. Marken findet \
  man in Schatzbl\u00f6cken, als Belohnung von Missionen oder durch das Besiegen besonderer \
  Boss-Gegner.

r.shopping_again_7a = Kapiert. Sonst noch was?

m.shopping_again_8a = Nur noch ein Laden zu besuchen, dann sind wir fertig. Ich habe das Beste \
  bis zum Schluss aufgehoben!

r.shopping_again_8a = (Folge Bechamel)
#(move to Bechamel)

m.shopping_again_9a = Hier haben wir ... mich! Ich bin der Zubeh\u00f6r-Ausstatter. Ich kann \
  Zubeh\u00f6r an deiner Ausr\u00fcstung anbringen, wenn du ein passendes Ticket hast. Mit \
  Zubeh\u00f6r kannst du dein Aussehen ver\u00e4ndern und aus der Masse herausstechen! Ich \
  schlage vor, du probierst es aus. Schon bald wirst du der Neid aller Knights sein!

r.shopping_again_9a = Wo finde ich Zubeh\u00f6r-Tickets?

m.shopping_again_10a = Zubeh\u00f6r-Tickets kannst du in Lockboxes oder im Auktionshaus finden, \
  falls ein anderer Knight sie dort verkauft.

r.shopping_again_10a = Verstanden.

m.shopping_again_11a = Nun, das waren die Grundlagen des Basars. Ein wirklich fantastischer \
  Ort, um alles zu finden, was du brauchst.\n\
  \n\
  Sollen wir nochmal alles durchgehen oder hast du alles verstanden?

r.shopping_again_11a = Ich w\u00fcrde die Tour gerne nochmal machen.
r.shopping_again_11b = Ich glaube, ich habs jetzt, Bechamel. Danke!

m.shopping_again_12a = Kein Problem, ich habe Zeit. Lass uns wieder zu Punch und Vise gehen.
r.shopping_again_12a = (Folge Bechamel)
#(starts at Punch and Vise)
m.shopping_again_12b = Wunderbar! Ich bin froh, dass ich dir helfen konnte. Viel Gl\u00fcck, \
  und denke daran, dass ich immer hier bin, um deiner Ausr\u00fcstung einmaliges Aussehen zu \
  verpassen!

r.shopping_again_12b = Danke, Bechamel. Wir sehen uns!

# LET'S GO SHOPPING AGAIN B-TEST
m.shopping_again_b = Gehen wir einkaufen!
o.shopping_again_b = Folge Bechamel bei einer F\u00fchrung durch den Basar und dessen \
  erweiterten Angeboten
b.shopping_again_b = Jetzt ist es Zeit, etwas \u00fcber die fortgeschritteneren Dienste, die es \
  im Basar gibt, zu erfahren. Folge dem Knight Bechamel und besuche Punch und Vise, Brinks und \
  besuche sogar Bechamels eigenen Laden!

m.shopping_again_b_1a = Hallo auch, {0}! Wow, du hast es bereits zum Soldaten geschafft? Du \
  steigst wirklich schnell im Rang auf.\n\
  \n\
  Jedenfalls, ich bin Bechamel, und ich bin hier, um dir eine F\u00fchrung zu den \
  fortgeschritteneren Diensten des Basars zu geben. F\u00fcr den Anfang, m\u00f6chtest du \
  lernen, wie du deine Ausr\u00fcstung noch m\u00e4chtiger machen kannst?

m.advanced_alchemy = Fortgeschrittene Alchemie
o.advanced_alchemy = Besuche Bosco und entdecke das Potential forgeschrittener Alchemie.
b.advanced_alchemy = Jetzt wo du den Rang Soldat erreicht hast, hat Bosco im Basar  von Haven \
  einige neue Informationen f\u00fcr dich, die forgeschrittene Formen der Alchemie betreffen. \
  Statte ihm einen Besuch ab und lerne mehr \u00fcber das versteckte Potential in manchen \
  Waffen und Ausr\u00fcstungsgegenst\u00e4nden.

m.advanced_alchemy_1a = So sieht man sich wieder, {0}. Spiral HQ hat mich gebeten, dir etwas \
  fortgeschrittenere Alchemie zu zeigen. Keine Angst, es wird nicht lange dauern. Ich habe \
  schlie\u00dflich an einem alten Mechaknight zu arbeiten.

r.advanced_alchemy_1a = Lass h\u00f6ren, Bosco.

m.advanced_alchemy_2a = Der Kern der Sache sind sich verzweigende Pfade. Die meiste Alchemie, \
  die du bisher gesehen hast, folgt einem geraden direkten Pfad. Es wird einfach mit der Zeit \
  besser und jedes Upgrade ist besser als das vorherige.\n\
  \n\
  Aber nicht alles funktioniert so. Viele Dinge k\u00f6nnen zu mehreren komplett verschiedenen \
  Dingen werden, die ganz anders sind als das Original!

r.advanced_alchemy_2a = Wow, das klingt, als h\u00e4tte ich viel zu lernen!

m.advanced_alchemy_3a = Keine Sorge, dir wird alles klar werden, wenn du mitmachst. Nehme \
  beispielsweise dieses Brandish. Es hat das Potential, zu drei verschiedenen Arten von \
  elementaren Klingen zu werden, die m\u00e4chtige Statuseffekte austeilen k\u00f6nnen, oder sogar ein d\u00fc\
  steres Schwert der Schatten!\n\
  \n\
  Du musst nur die Rezepte entdecken, die ein Brandish ben\u00f6tigen, und umwandeln. Hier, du \
  kannst diese Brandish sogar behalten. Wandle es in etwas Fantastisches um!

r.advanced_alchemy_3a = Danke, Bosco! Ich werde Rezepte sammeln und loslegen!

m.hall_of_heroes_0 = Halle der Helden
o.hall_of_heroes_0 = Erreiche den Rang eines Soldaten

m.hall_of_heroes_1 = Halle der Helden
o.hall_of_heroes_1 = Besuche die Halle der Helden, wenn du 2-Sterne-Ausr\u00fcstung tr\u00e4\
  gst, und erhalte deine Zertifikation.
b.hall_of_heroes_1 = Die Halle der Helden ist der Ort, an dem Knights ihre Sterne-Zertifikation \
  erhalten, die ihnen Zugang zu tiefer gelegenen Teilen des Uhrwerks erlaubt. Jede \
  Zertifikation stellt sicher, dass Knight die n\u00f6tigen Voraussetzungen bez\u00fcglich Sterne-Stufen erf\u00fcllt, die n\u00f6\
  tig sind, um mit den Herausforderungen anstehender Missionen fertig werden zu k\u00f6nnen.\n\
  \n\
  Die Halle der Helden erm\u00f6glicht es Knights ebenfalls, mit Knight-Veteranen zu sprechen \
  und ihre Loadouts anzusehen; sogar die M\u00f6glichkeit Rezepte f\u00fcr diese Loadouts zu \
  kaufen, ist gegeben.\n\
  \n\
  Besuche die Halle der Helden und erhalte deine 2-Sterne-Zertifikation, um Zugang zu Missionen \
  in tieferen Ebenen des Uhrwerks zu erhalten.

#Conversation (used at in the hall):
m.hall_of_heroes_0_1a = Sei gegr\u00fc\u00dft, {0}. Das hier ist die Halle der Helden, wo \
  erfahrene Knights sich einfinden, um ihre Dienste den Mitgliedern unseres Ordens anzubieten, \
  die den Rang eines Soldaten oder h\u00f6her erreicht haben. \n\
  \n\
  Ich bin \u00fcberzeugt, indem du mehr Missionen unternimmst, wirst du dich sicher eines Tages \
  in unseren Reihen wiederfinden.

r.hall_of_heroes_0_1a = Konversation beenden

m.hall_of_heroes_1_1a = Sei gegr\u00fc\u00dft, {0}. Ich bin Lieutenant Barrus, der W\u00e4chter \
  der Halle der Helden.\n\
  \n\
  Du bist hier, weil Spiral HQ dich als jemanden hervorgehoben hat, der das Potential hat, zur \
  Avantgarde der Spiral Knights zu werden. Die Halle der Helden steht dir jetzt zur Verf\u00fcgung. W\u00e4\
  hrend du im Rang aufsteigst, wirst du neue Missionen erhalten, die dich in diese Halle f\u00fc\
  hren und dir Zugriff zu mehr Rezepten der Veteran-Knights hier geben.

r.hall_of_heroes_1_1a = Mir wurde gesagt, ich solle hier eine neue Sterne-Zertifikation \
  erhalten?

m.hall_of_heroes_1_2a = Ja, um tiefer ins Uhrwerk vorzudringen, brauchst du zun\u00e4chst eine \
  Sterne-Zertifikation. Das beinhaltet, mit mir zu sprechen, wenn du R\u00fcstung, Helm, Schild \
  und mindestens eine Waffe einer bestimmten Sterne-Stufe oder h\u00f6her ausger\u00fcstet hast.

r.hall_of_heroes_1_2a = Verstanden.

m.hall_of_heroes_1_3a = Gl\u00fcckwunsch, {0}, du erf\u00fcllst die notwendigen Voraussetzungen \
  und hast deine 2-Sterne-Zertifikation erhalten. Nimm den Fahrstuhl hinter mir, um deine \
  Mission abzuschlie\u00dfen.

r.hall_of_heroes_1_3a = Gespr\u00e4ch beenden

m.hall_of_heroes_1_3b = Es tut mir leid, {0}, aber du erf\u00fcllst nicht die notwendigen \
  Voraussetzungen. Bitte spreche erneut mit mir, wenn du R\u00fcstung, Helm, Schild und eine \
  Waffe mit mindestens 2 Sternen ausger\u00fcstet hast.

r.hall_of_heroes_1_3b = Gespr\u00e4ch beenden

#*Completed requirements but have not exited properly:

m.hall_of_heroes_1_3c = Bitte nehme den Fahrstuhl hinter mir, um deine Mission abzuschlie\u00dfen.

r.hall_of_heroes_1_3c = Gespr\u00e4ch beenden

#*Completed mission and returned:

m.hall_of_heroes_1_4 = Willkommen in der Halle der Helden, {0}. Bitte spreche mit den \
  heldenhaften Knights, die du siehst, um Zugang zu ihren Waffen und Austr\u00fcstung zu erhalten.

r.hall_of_heroes_1_4 = Danke, Lieutenant, das werde ich.

# RANK 4-2
m.new_threat = Eine neue Bedrohung
o.new_threat = Stelle dich einer neuen, gef\u00e4hrlichen Bedrohung Havens
b.new_threat = T\u00f6dliche Kr\u00e4fte verschw\u00f6ren sich gegen Haven. Kontaktieren Agent \
  Kora und finde heraus wie du helfen kannst.

m.new_threat_1a = Gr\u00fc\u00dfe, {0}! Wir haben zwei Missionen von h\u00f6chster Wichtigkeit. \
  Erstens haben wir eine Energiesignatur lokalisiert, die derjenigen gleicht, die von dem \
  Artefakt ausgeht, das du im Uhrwerk gefunden hast. Wir peilen diese Signatur gerade genauer \
  an. Die Quelle davon zu finden, k\u00f6nnte uns dabei helfen, zu verstehen, was dieser Pl\u00e4\
  neschmieder-Gremlin Razwog plant, mit dem Artefakt zu tun oder was diese Apparatur tats\u00e4chlich kann.

r.new_threat_1a = Weiter

m.new_threat_2a = Wo wir gerade von Gremlins sprechen, wir beginnen, eine alarmierende Zahl an \
  Berichten \u00fcber Gremlin-Bewegungen im Uhrwerk unter Haven zu erhalten. Wir kennen noch \
  nicht viele Details, aber angesichts unserer bisherigen Begegnungen, sch\u00e4tzen wir, sie \
  bereiten sich wohl auf einen Angriff vor.

r.new_threat_2a = Weiter

m.new_threat_3a = Spiral HQ ist der Meinung, dass du unsere beste Wahl bist, um die \
  Energiesignatur zu verfolgen weil du auch derjenige warst, der uns das Artefakt gebracht hat. \
  Wir schicken Rhendon los, um herauszufinden was die Gremlins vorhaben.

r.new_threat_3a = Weiter

m.new_threat_4a = (Kora h\u00e4lt inne) \n\
  \n\
  Wenn man vom Teufel spricht, Rhendon meldet sich gerade; sagt es ist dringen. Stelle ihn \
  durch...

r.new_threat_4a = Weiter

m.new_threat_5a = {0}, irgend etwas Gro\u00dfes passiert im Labor. Du musst sofort dorthin!

r.new_threat_5a = Verstanden, ich bin unterwegs!
#(Teleport player to fake Garrison scene)

m.new_threat_bystander_1a = Fast h\u00e4tten wir es nicht lebendig hinaus geschafft. In einem \
  Moment war alles in Ordnung, und im n\u00e4chstes brechen pl\u00f6tzlich Gremlins aus dem \
  Boden hervor!

m.new_threat_bystander_1b = Vorsichtig da drinnen. Sieh aus, als h\u00e4tten sie einen gro\u00dfen mit dabei...

m.new_threat_bystander_1c = Ich mache mir Sorgen um die Sprites!

n.new_threat_bystander_1d = Knight-Veteran
m.new_threat_bystander_1d = Ich habe hinten im Labor gerade eine Explosion geh\u00f6rt!\n\
  \n\
  Wir k\u00fcmmern uns um diese monster, {0}. Geh du und sorge daf\u00fcr, dass das Artefakt \
  sicher ist! Beeil dich!

#Rhendon
m.new_threat_6a = Man konnte gerade Schreie und Explosionen aus dem Labor h\u00f6ren. Ich \
  glaube wir werden vielleicht angegriffen! R\u00fcste dich besser gut aus. Ich habe keine \
  Ahnung, was da drin vorgeht, aber wir sind besser auf alles vorbereitet!

r.new_threat_6a = Konversation beenden

m.new_threat_7a = Hsst! Ihr seid also diejenigen, die Razwog besiegt haben, und genommen haben, \
  was mir geh\u00f6rt. Ihr seid es nicht wert, dieses m\u00e4chtige Artefakt zu besitzen, also \
  bin ich hier, um euch davon zu erl\u00f6sen.

r.new_threat_7a = Nicht so schnell, Gremlin!

m.new_threat_8a = Pah! Ich bin kein einfacher Gremlin. Ich bin die tausend Augen, die dich in \
  der Dunkelheit beobachten. Ich bin die zischende Klinge, die deinen Untergang fl\u00fcstert. \
  Reisse jede Wand und jedes Zahnrad dieses verfluchten Ortes auseinander und du wirst nur \
  Schatten finden.\n\
  \n\
  Eure Sorte kann mich nicht Aufhalten! Hsst!

r.new_threat_8a = Das werden wir noch sehen.

m.new_threat_9a = Du kannst nicht aufhalten, was du nicht sehen kannst!

#*bamf* (NINJA, VANISH!- screen clearing effect where Herex vanishes)

r.new_threat_9a = Hey, warte-

m.new_threat_9b = (Es gibt keine Spur vom Gremlin oder dem Artefakt. Dieser Gremlin scheint \
  sehr geschickt darin, seine Spuren zu verwischen.)

r.new_threat_9b = Uff, ich kontaktiere besser Kora.

#Kora
m.new_threat_10a = Komm rein, {0}! Was ist hier drin passiert?

r.new_threat_10a = Es gab einen Angriff. Das Artefakt wurde gestohlen!

m.new_threat_11a = Ohje! Was verbindet \u00fcberhaupt diese Gremlins mit dem Artefakt?

r.new_threat_11a = Weiter

m.new_threat_12a = Hmm, das meiste unsere Sensor-Ausr\u00fcstung wurde anscheinend besch\u00e4digt. Es k\u00f6\
  nnte eine Weile dauern, bis alles wieder so weit funktioniert, dass wir das Artefakt aufsp\u00fcren k\u00f6nnen. W\u00e4\
  hrend wir daran arbeiten, solltest du mit einem unserer Biotechs in Kontakt treten, Hahn. Er \
  ist ein bisschen ein Rauhbein, aber kann dir dabei helfen, dich auf die Herausforderungen \
  vorzubereiten denen du dich wahrscheinlich stellen wirst.\n\
  \n\
  Ich werde dich sp\u00e4ter kontaktieren, sobald unsere Ausr\u00fcstung zum Aufsp\u00fcren wieder l\u00e4uft!

r.new_threat_12a = Verstanden, Kora.

m.pierce_of_cake = Stechender Schmerz
o.pierce_of_cake = Lerne etwas \u00fcber Monster, die Perforations-Schaden verursachen.
b.pierce_of_cake = Jetzt, wo du beginnst 'Rang 2'-Missionen zu unternehmen, werden die Monster \
  beginnen, spezielle Arten von Schaden zu verursachen, \u00fcber die du bescheid wissen und \
  dich darauf vorbereiten solltest, weil du sonst dein sicheres Ende finden wirst!\n\
  \n\
  Einer unserer f\u00fchrenden Biotechs, Hahn, hat eine kurze Einf\u00fchrung zum Thema \
  Monster, die Perforationsschaden verursachen, vorbereitet. Sprich mit ihm \u00fcber Comlink, \
  bevor du weitere Missionen unternimmst.

m.pierce_of_cake_1a = Hallo, {0}. Spiral HQ hat mich dar\u00fcber informiert, dass du eine \
  schnelle Einf\u00fchrung in die Spezies von Monstern brauchst, die Perforationsschaden \
  austeilen, ja?

r.pierce_of_cake_1a = Ja, sie sagten-

m.pierce_of_cake_2a = Okay, {0}, dann lass uns gleich anfangen. Es scheint, als w\u00fcrden die \
  besonderen Eigenschaften von Monstern um so st\u00e4rker hervortreten, je n\u00e4her sie am \
  Core sind. In den meisten F\u00e4llen zeigt sich das an ihrer F\u00e4higkeit, besondere \
  Schadensarten auszuteilen, f\u00fcr die ein besonderer Schutz notwendig ist, um ihm zu \
  widerstehen.\n\
  \n\
  Auf Rang 2 erzeugt ein Monster mit besonderem Schadenstyp immer eine Aufteilung zwischen \
  normalen und speziellem Schaden, so dass normale Verteidigung immer noch eine sinnvolle Wahl \
  ist.

r.pierce_of_cake_2a = Okay, du sagst also, dass-

m.pierce_of_cake_3a = Ja, an dieser Stelle musst du anfangen, dir ein Arsenal aufzubauen, das \
  dich gegen die verschiedenen Schadenstypen sch\u00fctzt.\n\
  \n\
  In deinen aktuellen Missionen begegnest du Monstern mit Angriffen, die Perforationsschaden \
  verursachen. Also musst du anfangen, Helme, R\u00fcstungen und Schilde zu sammeln, die gegen \
  Perforationsschaden sch\u00fctzen.

r.pierce_of_cake_3a = Welche Monster verursachen-

m.pierce_of_cake_4a = Perforationsschaden wird von Monstern der Glibber- und Bestien-Familien \
  verursacht. Au\u00dferdem sind Glibber in der Regel schwach gegen Schatten-Schaden und \
  Bestien gegen Perforationsschaden. Denk daran.\n\
  \n\
  Nun, brauchst du sonst noch etwas?

r.pierce_of_cake_4a = Du hast ziemlich schnell gesprochen, k\u00f6nntest du nochmal-
#(Start with 'very well {0}...)
r.pierce_of_cake_4b = Ich denke, ich habs verstanden, danke f\u00fcr-
m.pierce_of_cake_5a = War mir ein Vergn\u00fcgen. Sch\u00f6nen Tag noch.

r.pierce_of_cake_5a = Gespr\u00e4ch beenden

m.oilers_in_boilers = Kochende Oiler
o.oilers_in_boilers = Finde und zerst\u00f6re die Ursache der feurigen Glibber-Invasion.
b.oilers_in_boilers = Ein Heizraum unter Moorcroft Manor ist von einer Legion \u00f6liger \
  Glibber, auch bekannt als 'Oiler', die feurige Lebensumst\u00e4nde bevorzugen, \u00fcberrant worden. Das k\u00f6nnte sich als Desaster f\u00fc\
  r angrenzende Ebenen herausstellen, sollten die Oiler in die Heizkessel geraten und eine \
  Explosion verursachen.\n\
  \n\
  Moorcroft Manor dient uns als unsch\u00e4tzbare Verbindung zu Rang 2 des Uhrwerks und seine \
  verstorbenen Bewohner waren bisher wundervolle Gastgeber. Es ist f\u00fcr Spiral HQ von gro\u00df\
  er Wichtigkeit, einen Trupp dorthin zu schicken und das Problem mit den glimmenden Glibbern \
  zu l\u00f6sen,  bevor sie einen Feuersturm verursachen, der unseren Zugang zu Rang 2 \
  vernichtet.\n\
  \n\
  Es liegt an dir, die Oiler zu finden und sie aus den Heizr\u00e4umen zu entfernen!

o.frostifur_fandango = Jage und erledige das wilde Snowclaw-Rudel
b.frostifur_fandango = Spiral HQ erh\u00e4lt zahlreiche Berichte von Truppen, die nahe Tiefe 10 \
  von einem Rudel Wolver, bekannt als 'Snowclaw-Rudel', ausgel\u00f6scht wurden. Diese wilden \
  Frostifurs haben einen eisigen Biss und achten sehr auf ihr Revier. Aufgrund der gnadenlosen \
  Angriffe verlangt Spiral HQ nach einer erfahrenen Truppe, die in ihren Bau eindrungt und sie \
  zerst\u00f6rt, um weitere Opfer zu vermeiden.\n\
  \n\
  Es wird dazu geraten, sich vor Abmarsch mit Ausr\u00fcstung auszustatten, die vor Frost- und \
  Perforationsschaden sch\u00fctzt.

m.monstrous_research_3 = Monstr\u00f6se Forschung
o.monstrous_research_3 = Liefere die verlangten Materialien bei Biotech Hahn f\u00fcr die Forschung ab.
b.monstrous_research_3 = Biotech Hahn versucht, seine Forschung \u00fcber die Bestien- und \
  Glibber-Monster weiter voranzutreiben und fragt nach Proben, die von deinen letzten Missionen \
  stammen. Er hat speziell darum gebeten, dich an die '\u00e4usserst informative Lektion' zu \
  erinnern, die du 'kostenlos' erhalten hast, bevor du dich entscheidest, ob du seiner Anfrage \
  nachkommen m\u00f6chtest.

