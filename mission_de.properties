m.rescues_and_recycling = Rettungen und Recycling
o.rescues_and_recycling = Zerst\u00f6re die Dekonstruktions-St\u00e4tte der Gremlins und rette \
  die gefangenen Knights.
b.rescues_and_recycling = Eine 'Dekonstruktions-Zone' ist eine Arbeitsst\u00e4tte der Gremlins, \
  wo die Gremlins anscheinend bestehende Ebenen zerlegen und die Komponenten dann benutzen, um \
  neue Ebenen zu bauen. Ihre F\u00e4higkeit, mit enormer Geschwindigkeit Ebenen und Maschinen \
  zu bauen, ist unglaublich, nur \u00fcbertroffen von ihrer Angriffslust gegen\u00fcber jedem, \
  der ihren Weg kreuzt.\n\
  \n\
  Aufkl\u00e4rer-Knights haben herausgefunden, dass eine Truppe ihre Ingenieursk\u00fcnste wohl \
  von etwas zu nah verfolgt hat und wird jetzt in einer der Dekonstruktions-St\u00e4tten nahe \
  Tiefe 10 gefangen gehalten. Es ist nicht klar, was die Gremlins mit diesen Knights vor haben \
  oder ob sie einfach planen, sie zusammen mit dem Rest der Ebene, die sie auseinandernehmen, \
  untergehen zu lassen.

m.shocking_sentient_sentries = Wachposten schockieren
o.shocking_sentient_sentries = K\u00e4mpfe dich zur geheimen Waffenfabrik durch.
b.shocking_sentient_sentries = Aufkl\u00e4rer-Knights haben eine geheime Waffenfabrik entdeck \
  und nach den Informationen, die wir haben, k\u00f6nnte sie einem ranghohen Gremlin der \
  Crimson Order geh\u00f6ren. Sie ist schwer bewacht, von einer kleinen Armee elektrischer \
  Konstrukte, die zweifelsohne darauf programmiert wurden, die Fabrik unter allen Umst\u00e4nden zu verteidigen.\n\
  \n\
  Obwohl es unklar ist, ob dieses Waffenlager tats\u00e4chlich einem Gremlin der Crimson Order \
  geh\u00f6rt, ist es es nichtsdestoweniger wert, dort einzudringen und die Waffen zu zerst\u00f6ren.\n\
  \n\
  Es wird dazu geraten, dich vor dem Abmarsch mit Ausr\u00fcstung zu versorgen, die dich gegen \
  Schock- und Elementar-Schaden sch\u00fctzt.


m.shocking_sentient_sentries_1a = Der Sparkcaster Deluxe ist fast stabil, versprochen. Ich \
  brauche etwas mehr Zeit, Warmaster.

m.shocking_sentient_sentries_2a = Sieht aus, als w\u00e4re die Zeit abgelaufen, Sputterspark. \
  Du kannst nur hoffen, dass dein kleines Spielzeug funktioniert.

m.shocking_sentient_sentries_3a = Aaaaah! Nein, nein, nein! A-aber es ist noch nicht bereit...! \
  Ich sch\u00e4tze, ich habe keine Wahl!\n\
  \n\
  Sparkcaster Deluxe....aktivieren!

m.shocking_sentient_sentries_4a = Gaaah! Ich muss hier raus! \n\
  \n\
  Notfall-Tarnfeld...aktivieren!

