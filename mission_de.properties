m.intro_type = W\u00e4hle eine Missionsart:
m.intro_rank = Rang-Missionen sind die zentrale Kamgne von Spiral Knights. Rang-Missionen \
  abzuschlie\u00dfen bringt dir Belohnungen und erlaubt es dir, einen h\u00f6heren Rang als \
  Spiral Knight zu erlangen.
m.intro_prestige = Prestige-Missionen sind Bonus-Missionen, die dir t\u00e4glich angeboten \
  werden. Prestige-Missionen abzuschlie\u00dfen, bringt dir Prestige.
m.intro_prestige_locked = Schlie\u00dfe Rang-Missionen ab, um Zugang zu Prestige-Missionen zu \
  erhalten!
m.intro_expansion = Kaufe Expansions-Missionen, um besondere, speziell erstellte Missionen mit \
  tollen Belohnungen zu spielen.
m.intro_expansion_locked = Schlie\u00dfe Rang-Missionen ab, um Zugang zu Expansions-Missionen \
  zu erhalten!
m.intro_arcade = Arcade-Missionen erm\u00f6glichen es dir, das sich st\u00e4ndig ver\u00e4\
  ndernde Uhrwerk unter Haven zu erforschen, ohne spezielle Missionsziele. Besuche die Arcade \
  von Haven, um herauszufinden wie du das Uhrwerk deinen W\u00fcnschen entsprechend ver\u00e4ndern kannst!
m.intro_arcade_locked = Schlie\u00dfe Rang-Missionen ab, um Zugang zu Arcade-Missionen zu \
  erhalten!

m.intro_pref = Missions-Einf\u00fchrung anzeigen

m.intro_reward_rank = W\u00e4hle eine Missions-Karte, um eine Missions-Einf\u00fchrung zu \
