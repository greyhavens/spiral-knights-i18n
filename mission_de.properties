# RANK 1-1
m.first_contact = Erster Kontakt
o.first_contact = Kontaktiere Agent Kora \u00fcber Comlink
b.first_contact = Du hast es aus deiner Rettungskapsel geschafft und ein Rettungslager \
  erreicht, gerade als die Sonne \u00fcber der fremdartigen Lanschaft untergegangen ist. Es ist \
  jetzt Zeit, Kontakt mit dem Spiral HQ herzustellen, indem du dein Comlink nutzt.

m.first_contact_1a = Gr\u00fc\u00dfe, {0}, hier ist Agent Kora; best\u00e4tige hiermit den \
  Kontakt zum Spiral Hauptquartier. Ich werde hier w\u00e4hrend deiner Zeit auf Cradle als dein \
  Haupt-Kontakt zum Spiral HQ dienen, und dich mit Informationen \u00fcber die vielen, gef\u00e4\
  hrlichen Missionen versorgen, die vor dir liegen.\n\
  \n\
  Die Daten, die ich \u00fcber deine Trainingserfolge an Bord der Skylark vorliegen habe, \
  zeigen, dass du gut f\u00fcr das geeignet bist, was noch kommt. Ich freue mich auf die \
  Zusammenarbeit.

r.first_contact_1a = Klingt gut, Kora. Was jetzt?

m.first_contact_2a = Du bist einsatzwillig, das ist gut. Deine derzeitige Mission ist es, die \
  Stadt Haven zu erreichen, wo das Spiral HQ eine Basis errichtet hat. Verbringe so viel Zeit \
  wie du brauchst im Rettungslager, um dich auf die vor dir liegende Reise vorzubereiten.\n\
  \n\
  Nutze die Angebote der reisenden H\u00e4ndler und auch das Wissen anderer Knights im Lager, \
  um zu lernen, wie man auf dieser neuen Welt \u00fcberlebt. Ich werde dich wieder \
  kontaktieren, sobald du Haven erreicht hast.\n\
  \n\
  Viel Gl\u00fcck!

r.first_contact_2a = Ich bin unterwegs.

m.abandoned_depot = Das verlassene Depot
o.abandoned_depot = Erlerne die Grundlagen des \u00dcberlebens im verlassenen Depot.
b.abandoned_depot = Die im Rettungslager stationierten Knights haben eine verlassene Anlage \
  unter der Oberfl\u00e4che von Cradle in eine Trainingseinrichtung umgebaut, um Rekruten die \
  Grundlagen f\u00fcr das \u00dcberleben im Uhrwerk beizubringen. Achtung! Als Teil des \
  Uhrwerks ist sie wahrscheinlich von allen m\u00f6glichen Arten von Monstern bev\u00f6lkert. Sei auf der Hut!

# Rhendon RC
#...................................................................................................

m.securing_camp = Solltest du dich entschlie\u00dfen, anzunehmen
b.securing_camp = Bevor du versuchst, die monsterverseuchten Tiefen unter dem Rettungslager zu \
  erkunden, w\u00fcrde Rhendon dir gerne erkl\u00e4ren, wie das mit dem Ausf\u00fchren von Missionen f\u00fcr Spiral HQ l\u00e4uft.
o.securing_camp = Finde Rhendon und sprich mit ihm, um Zugang zu Missionen zu bekommen.

m.securing_camp_1a = Nun, sieht aus als w\u00fcrden wir hier in einer Zwickm\u00fchle stecken, {0}. Es m\u00fc\
  ssen eine Menge Arbeiten erledigt werden, um dieses Lager auf Vordermann zu bringen, also \
  bist du jetzt dazu berechtigt, Missionen anzunehmen. Du findest verf\u00fcgbare Missionen in \
  deiner Aktivit\u00e4ten-Leiste.

r.securing_camp_1a = Missionen?

m.securing_camp_2a = Missionen reichen von gef\u00e4hrlichen K\u00e4mpfen bis hin zu Gespr\u00e4\
  chen mit bestimmten Leuten, wie zum Beispiel mir. Durch das Abschlie\u00dfen von Missionen \
  erarbeitest du dir Fortschritt hin zu h\u00f6heren R\u00e4ngen, die dir wiederum zu m\u00e4chtigerer Ausr\u00fc\
  stung verhelfen. Greta hat mich informiert, dass du dich um unser Problem mit der \
  Energieversorgung im alten Generator k\u00fcmmern wirst?

r.securing_camp_2a = Ja, das stimmt.

m.securing_camp_3a = Nun, bleibe wachsam. Wenn die Oberfl\u00e4che des Planeten schon vor \
  Monstern wimmelt, wer wei\u00df, was du da unten in der Dunkelheit findest!

r.securing_camp_3a = Danke Rhendon, ich werde vorsichtig sein.

m.securing_camp_4a = Denk daran, diese Mission anzunehmen und sei vorsichtig da unten!

r.securing_camp_4a = Konversation beenden

#Old securing camp dialog
m.rc_buddyknight_1a = {0}! Ich habe geh\u00f6rt, sie haben dich als Retter auserkoren, eh? Na, \
  bevor du hier den Helden markierst und hinunter in die Dunkelheit marschierst, warum gehen du \
  und ich nicht hin\u00fcber zur anderen Seite des Lagers und verpassen ein paar von den \
  Monstern, die das Lager gestern Nacht verw\u00fcstet haben, eine Lektion?

r.rc_buddyknight_1a = Klar, ich bin dabei.

# [proto bomb image]
m.rc_buddyknight_2a = Dann wirst du hiervon eine brauchen! Es ist eine Proto Bomb und gut daf\u00fc\
  r, Sachen in die Luft zu jagen!\n\
  \n\
  Ich hatte eine \u00fcbrige in meiner Rettungskapsel, also sieh das als eine vorzeitige \
  Belohnung daf\u00fcr an, dass du uns allen hier die Haut rettest.

# (Rhendon gives you a Proto Bomb)

r.rc_buddyknight_2a = Danke, Rhendon, das wird n\u00fctzlich sein!

m.rc_buddyknight_3a = Lass sie uns gleich mal geb\u00fchrend einsetzen.\n\
  \n\
  Du kannst Missionen annehmen, indem du auf den 'Missionen'-Knopf oben am Bildschirm klickst \
  und die Mission annimmst, die ich dir gegeben habe.

r.rc_buddyknight_3a = Gespr\u00e4ch beenden

m.rc_buddyknight_4a = Nimm meine Mission an und lass uns an die Arbeit gehen, ein paar Sachen \
  in die Luft jagen!

r.rc_buddyknight_4a = Gespr\u00e4ch beenden

# After you complete the mission
m.rc_buddyknight_5a = Es schien als h\u00e4tte die Welt selbst versucht, dich da hinten \
  einzuschlie\u00dfen, war das knapp!\n\
  \n\
  Halte deine f\u00fcnf Sinne beisammen, wenn du dich aufmachst, den alten Generator da unten \
  zu erforschen. Wenn schon die Oberfl\u00e4che des Planeten vor monstern wimmelt und mit \
  Fallen gespickt ist, wer wei\u00df, was du da unten in der finsternis finden wirst!

r.rc_buddyknight_5a = Danke, Rhendon. Ich werde vorsichtig sein.

m.securing_camp_b = Das Lager sichern
o.securing_camp_b = Hilf Rhendon, die Monster zu vernichten, die in das Rettungslager \
  eingedrungen sind!
b.securing_camp_b = Bevor du anf\u00e4ngst, die von Monstern wimmelnden Tiefen unter dem \
  Rettungslager zu erforschen, m\u00f6chte Rhendon deine Hilfe dabei, einige der Monster zu \
  eliminieren, die letzte Nach das Rettungslager angegriffen haben.

m.securing_camp_b_1a = Da bist du ja, {0}! Ich habe schon angefangen zu denken, dass du nicht \
  auftauchst!\n\
  \n\
  Okay, machen wir uns daran, diesen Ort zu sichern. Aber zuerst musst du diese Proto Bomb ausr\u00fc\
  sten, die ich dir gegeben habe. Gehe hin\u00fcber zu der Arsenal-Station hinter mir und r\u00fcste sie aus.

r.securing_camp_b_1a = Ich gehe hin\u00fcber zur Arsenal-Station und r\u00fcste meine Proto \
  Bomb aus!

#[arsenal station highlights]

#[bomb category highlights]

#[proto bomb highlights]

#[image of uncharged to charged states]
m.securing_camp_b_2a = Gro\u00dfartig! Jetzt eine kurze Einweisung zu Spezialangriffen.\n\
  \n\
  Spezialangriffe k\u00f6nnen mit jeder Waffe ausgef\u00fchrt werden indem man den \
  ANGRIFF-Knopf gedr\u00fcckt h\u00e4lt und wartet bis die Aufladung das Maximum erreicht hat. \
  Du kannst dich weiterhin umherbewegen, w\u00e4hrend du den Spezialangriff l\u00e4dst!

r.securing_camp_b_2a = Okay, und dann?

#[image of gun and sword charge attacks]
m.securing_camp_b_3a = Sobald die Aufladung das Maximum erreicht hat, lasse den ANGRIFF-Knopf \
  los und entfessele einen m\u00e4chtigen Spezialangriff!

r.securing_camp_b_3a = Einfach, was sonst noch?

#[image of bomb charging and explosion]
m.securing_camp_b_4a = Bomben sind etwas besonderes weil sie keinen normalen Angriff haben. \
  Eine Bombe kann man NUR per Spezialangriff verwenden, also achte darauf, dass du w\u00e4hrend \
  dem Aufladen Monstern ausweichst!

r.securing_camp_b_4a = Verstanden, Rhendon.

m.securing_camp_b_5a = Okay, probiere einige Angriffe mit Bomben aus und dann rein da mit dir \
  und mache diese Monster platt!

r.securing_camp_b_5a = Klingt bombig!

#As the player enters the room, a monster door appears behind them.  Focus on Rehndon at the door:
m.securing_camp_b_6a = Was ist da passiert? Das Tor ist hinter dir zugeschnappt wie eine Falle!\n\
  \n\
  Verteidige dich, {0}!

#The player destroys all the monsters.
m.securing_camp_b_7a = Was zum Geier war das? Wo kam dieses Tor her?\n\
  \n\
  Es scheint, als h\u00e4tte es die mechanische Welt unter uns auf uns abgesehen, {0}! Sei \
  besser auf der Hut!\n\
  \n\
  Na, jedenfalls sollte die Gegend hier sicher sein, zumindest bis zum Einbruch der Nacht. \
  Gehen wir zur\u00fcck ins Lager.

r.securing_camp_b_7a = Konversation beenden

# RANK 1-2

m.crossing_chasm = \u00dcberquerung des Abgrunds
o.crossing_chasm = \u00dcberquere den gef\u00e4hrlichen Abgrund und stelle Kontakt zum Spiral \
  HQ in Haven her.
b.crossing_chasm = Um die Operationsbasis des Spiral HQ in Haven zu erreichen, wirst du dich \
  hinunter ins Uhrwerk begeben m\u00fcssen und einen gewaltigen Abgrund \u00fcberqueren. Die \
  Reise wird gef\u00e4hrlich sein und es wird empfohlen, alles was du brauchst zu besorgen, \
  bevor du dich auf den Weg machst.\n\
  \n\
  Durch den Abschlu\u00df dieser Mission wirst du das Rettungslager hinter dir lassen.

m.first_contact_b = Erster Kontakt
o.first_contact_b = Kontaktiere das Spiral HQ \u00fcber Comlink
b.first_contact_b = Nachdem die Energieversorgung im Rettungslager wiederhergestellt wurde, \
  kannst du nun dein Comlink verwenden, um Kontakt mit dem Spiral HQ aufzunehmen und \
  herauszufinden, wo sie sich nach dem Absturz der Skylark befinden. Sobald du Kontakt mit \
  Spiral HQ aufgenommen hast, wirst du hoffentlich herausfinden, was den Absturz verursacht hat \
  und was es mit dieser fremdartigen Welt auf sich hat, die ihr nun bev\u00f6lkert.

m.first_contact_b_1a = Hier ist Agent Kora vom Spiral HQ! Wir haben ein Notsignal von deinen \
  Koordinaten empfangen, kannst du mich h\u00f6ren?

r.first_contact_b_1a = Hier ist {0} von der Skylark. Ich empfange dich laut und deutlich Kora.

m.first_contact_b_2a = Freut mich, dich kennenzulernen, {0}. Wie ist deine Situation?

r.first_contact_b_2a = (Erz\u00e4hle Kora vom alten Generator, Razwog und dem geheimnisvollen \
  Artefakt.)

m.first_contact_b_3a = Wow, das klingt als ob du bereits ein ziemliches Abenteuer hinter dir \
  hast, {0}! Spiral HQ wird sicher an dem Artefakt interessiert sein, das du geborgen hast. Es \
  ist bemerkenswert, dass du es geschafft hast, dich einem Gremlin im Uhrwerk zu stellen und \u00fcberlebt hast.

r.first_contact_b_3a = Gremlin? Uhrwerk?

#[image of gremlins in the Clockworks]
m.first_contact_b_4a = Klingt, als m\u00fcsste ich dich mal auf den neuesten Stand bringen. Wir \
  sind auf einem Planeten genannt 'Cradle' abgest\u00fcrzt. Cradle ist eine faszinierende Welt, \
  denn das gesamte Innere des Planeten unter der Oberfl\u00e4che ist ein sich st\u00e4ndig ver\u00e4\
  ndernder, mechanischer Komplex, auch bekannt als 'Uhrwerk'.\n\
  \n\
  Das Uhrwerk scheint von 'Gremlins' erbaut worden zu sein, eine pelzige Rasse \u00fcbler \
  Monster, die unsere Anwesenheit nicht gerade wohlwollend aufgenommen haben.

r.first_contact_b_4a = Ich w\u00fcrde gerne helfen so gut ich kann. Wo befindet sich das Spiral \
  HQ jetzt?

#[image of RC map leading to Haven]
m.first_contact_b_5a = Wir haben eine Stadt namens 'Haven' entdeckt und haben dort eine \
  Operationsbasis eingerichtet. Die Eingeborenen haben uns mit Essen, Unterkunft und Energie \
  versorgt. Es ist nicht Isora, aber f\u00fcr den Moment ist es unser Zuhause.\n\
  \n\
  Ich habe deine Position markiert. Ungl\u00fccklicherweise wirst du einen gewaltigen Abgrund \u00fcberqueren m\u00fc\
  ssen, um Haven zu erreichen. Jetzt, wo dein Lager mit Energie versorgt ist, gibt es \
  vielleicht irgendwo einen Transporter, der ins Uhrwerk f\u00fchrt. Du k\u00f6nntest uns \
  vielleicht auf diese Weise erreichen.

r.first_contact_b_5a = Danke Kora, ich werde versuchen einen Weg \u00fcber den Abgrund und nach \
  Haven zu finden.

m.first_contact_b_6a = Nach dem was ich geh\u00f6rt habe, wenn es einer schafft, dann bist du \
  das, {0}! Viel Gl\u00fcck!

r.first_contact_b_6a = Gespr\u00e4ch beenden

# RANK 1-3
m.ancient_generator = Der alte Generator
o.ancient_generator = Erforsche den alten Generator und stelle die Energieversorgung des \
  Rettungslagers wieder her bevor es Nacht wird!
b.ancient_generator = Das Rettungslager hat keine Energie und damit keine M\u00f6glichkeit, \
  sich gegen den Ansturm von Monstern zu verteidigen, die nachts angreifen. Die Sonne geht \
  schnell unter und es liegt an dir, die Finsternis unter dem Lager zu betreten und den alten \
  Generator zu finden.\n\
  \n\
  Wenn du die Energieversorgung des Lagers wiederherstellen kannst, k\u00f6nnen die Spiral \
  Knights ihre Gesch\u00fctzt\u00fcrme damit antreiben und einen Verteidigungsring aufbauen. \
  Wenn alles gesichert ist, ist es vielleicht auch m\u00f6glich, wieder Verbindung mit dem \
  Spiral HQ aufzunehmen.

m.ancient_generator_1a = Was haben wir hier, mehr kleine Kreaturen, die vom Himmel gefallen \
  sind? Hier, um meine Energie zu stehlen und meine Forschung zu st\u00f6ren?\n\
  \n\
  Niemand st\u00f6rt die Arbeit des gro\u00dfen Pl\u00e4neschmieders Razwog! Ich werde daf\u00fc\
  r sorgen, dass du diesen Raum nicht lebend verl\u00e4sst!

m.ancient_generator_2a = Ihr widerlichen kleinen Dinger! Wage es nicht, das Artefakt \
  anzufassen!\n\
  \n\
  Argh! Ich komme wieder!

# RANK 1-4
m.crossing_chasm_b = \u00dcberquerung des Abgrunds
o.crossing_chasm_b = \u00dcberquere mit Rhendon den Abgrund und erreiche Haven
b.crossing_chasm_b = Nachdem du die Energieversorgung im Rettungslager wiederhergestellt hast \
  und Kontakt mit Spiral HQ aufgenommen hast, wird es Zeit, dass du den Abgrund n\u00f6rdlich \
  des Rettungslagers \u00fcberquerst und Haven erreichst, wo der Rest der Spiral Knights \
  Zuflucht gefunden hat.\n\
  \n\
  Um den Abgrund zu \u00fcberqueren, wirst du den Transporter hinunter ins Uhrwerk nehmen m\u00fc\
  ssen und einen weiteren finden m\u00fcssen, der dich auf der anderen Seite nach oben bringt. \
  Keiner kann sagen, welche Gefahren in den dunklen Tiefen dort unten lauern, also wird Rhendon \
  dich auf deiner Reise begleiten.

n.arsenal_knight = Techniker
m.arsenal_knight_1a = Du kannst die Arsenal-Station hinter mir verwenden, um deine Ausr\u00fc\
  stung zu wechseln. Wenn du einmal im Uhrwerk bist, kannst du dort deine ausger\u00fcsteten Gegenst\u00e4\
  nde nur an Arsenal-Stationen wie dieser wechseln, also solltest du vorbereitet sein!

r.arsenal_knight_1a = Konversation beenden

m.crossing_chasm_b_1a = Du hast geglaubt, du kannst einfach mit dem Artefakt davonspazieren, \
  was? Gib es sofort her oder ich bet\u00e4tige diese Sicherung und verwandle dich in eine \
  Million winzige, qualmende St\u00fcckchen!

m.chasm_b_rhendon_1a = Sieht aus, als h\u00e4tten wir keine Wahl, {0}. Dieses Ding ist es nicht \
  wert, daf\u00fcr zu sterben.

m.crossing_chasm_b_2a = Perfekt! Ich behalte das Artefakt und werde dich trotzdem in Brand \
  stecken!\n\
  \n\
  Hahaha!

m.chasm_b_rhendon_2a = Dieser Teufel!\n\
  \n\
  Es st\u00fcrzt alles ein! Wir m\u00fcssen auf der Stelle einen Weg finden, dieses Feuer zu l\u00f6schen!

m.crossing_chasm_b_3a = Was?! Du bist noch da?!\n\
  \n\
  Das Artefakt geh\u00f6rt mir. Ihr miesen Knights werdet niemals seine Macht besitzen!\n\
  \n\
  \n\
  Dich muss ich wohl pers\u00f6nlich vernichten!

m.razwog_defeated = Da ist ein seltsames, orangerotes Symbol auf Razwogs Kleidung.

n.cryptic_coder = Kryptischer Kodierer
m.cryptic_coder = Pl\u00e4neschmieder Razwog: Arbeite abseits der anderen. Die Order darf nie \
  erfahren, dass ich das Artefakt habe. Finde einen Weg, es anzutreiben. Bringe es zu mir. Betr\u00fc\
  ge mich nicht. Ich werde es wissen.\n\
  \n\
  -H
r.end_coder = Nachricht schlie\u00dfen

m.crossing_chasm_b_4a = Danke, {0}. Ich dachte hier hinten w\u00e4ren wir fertig.\n\
  \n\
  Lass uns das Artefakt zur\u00fcck zum Spiral HQ bringen, bevor jemand anderer versuche, es \
  sich unter den Nagel zu reissen.

m.crossing_chasm_b_5a = Hey, {0}! Wie ich sehe hast du dir eine Proto Bomb besorgt! Die sind \
  sehr n\u00fctzlich, wenn man es mit Gruppen von Gegnern zu tun hat.

r.crossing_chasm_b_5a = Wie benutze ich sie?

m.crossing_chasm_b_6a = Bomben sind etwas besonderes weil sie keinen normalen Angriff haben. \
  Eine Bombe kann man NUR per SPEZIALANGRIFF verwenden, also achte darauf, dass du w\u00e4hrend \
  dem Aufladen Monstern ausweichst!\n\
  \n\
  Du kannst es gern mal ausprobieren. Denke nur daran, die Bombe an der Arsenal-Station dort \
  vorne auszur\u00fcsten.

r.crossing_chasm_b_6a = Weiter

m.crossing_chasm_b_7a = Ich werde das Artefakt ins Labor bringen. Wenn du bereit bist, solltest \
  du dich nach Haven begeben und dich mit dem Rest der Mannschaft treffen. Ich habe so ein Gef\u00fc\
  hl, dass wir eine ganze Weile auf diesem Planeten festsitzen werden, also sollten wir \
  schauen, inwieweit wir helfen k\u00f6nnen.

r.crossing_chasm_b_7a = Konversation beenden

# RANK 2-1
#RENAMED FROM get_energrized
m.welcome_to_haven = Willkommen in Haven!
o.welcome_to_haven = Kontaktiere Agent Kora \u00fcber Comlink
b.welcome_to_haven = Nachdem du die Reise nach Haven \u00fcberlebt hast, musst du Agent Kora \u00fc\
  ber Comlink kontaktieren und ihr Bericht erstatten. Sie hat f\u00fcr dich Informationen dazu, \
  was es als N\u00e4chstes zu tun gibt und auch spezielle Anweisungen bez\u00fcglich der \
  Verwendung von Energie.

m.welcome_to_haven_1a = Du hast es geschafft, {0}! Es freut mich, dich in einem St\u00fcck hier \
  in Haven ankommen zu sehen. Ich werde an das Spiral HQ weitergeben, dass du nun hier in Haven \
  Missionen erledigen wirst. F\u00fcr den Anfang habe ich dir einige Missionen gegeben, die dir \
  helfen werden, dich einzugew\u00f6hnen und herauszufinden, was Haven zu bieten hat. Vergiss \
  nicht, mit einem der Stranger zu reden, wenn du mit der Erkundung beginnst.

r.welcome_to_haven_1a = Stranger?

m.welcome_to_haven_2a = Die hier beheimateten Einwohner von Haven werden 'Stranger' genannt. Du \
  kannst sie nicht verfehlen, sie sind die riesigen Gestalten mit Umh\u00e4ngen und Masken. \
  Trotz ihrer einsch\u00fcchternden Erscheinung sind sie uns gegen\u00fcber extrem hilfsbereit \
  und bleiben auch meist unter sich. Die komischen, kleinen V\u00f6gel in der Stadt scheinen \
  sie jedenfalls zu m\u00f6gen!

r.welcome_to_haven_2a = Ich werde daran denken, Hallo zu sagen, wenn ich einem Stranger \
  begegne.

m.welcome_to_haven_3a = Gro\u00dfartig, danke, dass du so ein guter Botschafter bist!\n\
  \n\
  Zuletzt muss ich noch sicherstellen, dass du bez\u00fcglich etwas genannt 'Energie' auf dem \
  Laufenden bist. Es ist sehr wichtig f\u00fcr unsere Mission hier auf Cradle.

r.welcome_to_haven_3a = Ich bin ganz Ohr, Kora. Erz\u00e4hl mir von Energie!

#(image)
m.welcome_to_haven_4a = Energie is essentiell daf\u00fcr, m\u00e4chtige Ausr\u00fcstung und Gegenst\u00e4\
  nde vom Magazin zu bekommen.\n\
  \n\
  Du wirst alle m\u00f6glichen Arten von Verwendung daf\u00fcr w\u00e4hrend deiner Reisen \
  finden, suche einfach nach dem Energie-Symbol!

r.welcome_to_haven_4a = Weiter

m.welcome_to_haven_5a = Energie kann man nur durch den Kauf mit echtem Geld oder per Tausch \u00fc\
  ber den Markt bekommen. Um Energie zu kaufen oder zu handeln, \u00f6ffne einfach das Magazin \
  und klicke auf den Knopf 'Energie holen'.

r.welcome_to_haven_5a = Ich m\u00f6chte mir die Einf\u00fchrung \u00fcber Energie noch einmal \
  anh\u00f6ren.
#6a -> Repeat tutorial
r.welcome_to_haven_5b = Energie besorgen und erstaunliche Dinge vollbringen - verstanden!

m.welcome_to_haven_6a = Ich setze mich bald wieder mit dir in Verbindung, viel Gl\u00fcck, {0}!

r.welcome_to_haven_6a = Konversation beenden

#WELCOME TO HAVEN B-TEST
m.welcome_to_haven_b = Willkommen in Haven!
o.welcome_to_haven_b = Kontaktiere Agent Kora \u00fcber Comlink
b.welcome_to_haven_b = Nachdem du die Reise nach Haven \u00fcberlebt hast, musst du Agent Kora \u00fc\
  ber Comlink kontaktieren und ihr Bericht erstatten. Sie hat Informationen f\u00fcr dich dar\u00fcber, was als N\u00e4chstes zu tun ist.

m.welcome_to_haven_b_1a = Du hast es geschafft, {0}! Es freut mich, dich in eienm St\u00fcck \
  hier in Haven ankommen zu sehen. Ich werde an das Spiral HQ weitergeben, dass du nun hier in \
  Haven Missionen erledigen wirst.\n\
  \n\
  F\u00fcr den Anfang habe ich dir einige Missionen gegeben, die dir helfen werden, dich \
  einzugew\u00f6hnen und herauszufinden, was Haven zu bieten hat. Vergiss nicht, die Stranger \
  zu begr\u00fc\u00dfen, wenn du mit deiner Erkundung beginnst.

r.welcome_to_haven_b_1a = Stranger?

m.welcome_to_haven_b_2a = Die hier beheimateten Einwohner von Haven werden 'Stranger' genannt. \
  Du kannst sie nicht verfehlen, sie sind die riesigen Gestalten mit Umh\u00e4ngen und Masken. \
  Trotz ihrer einsch\u00fcchternden Erscheinung sind sie uns gegen\u00fcber extrem hilfsbereit \
  und bleiben auch meist unter sich. Die komischen kleinen V\u00f6gel in der Stadt scheinen sie \
  jedenfalls zu m\u00f6gen!

r.welcome_to_haven_b_2a = Ich werde daran denken, Hallo zu sagen, wenn ich einem Stranger \
  begegne.

m.welcome_to_haven_b_3a = Gro\u00dfartig, danke, dass du so ein guter Botschafter bist.\n\
  \n\
  Ich werde dich bald wieder kontaktieren, viel Gl\u00fcck, {0}!

r.welcome_to_haven_b_3a = Konversation beenden

m.reporting_duty = Zum Dienst melden
o.reporting_duty = Melde dich bei Lieutenant Feron in der Arcade von Haven
b.reporting_duty = Die Verantwortung Lieutenant Ferons liegt darin, die Aufsicht \u00fcber die \
  Bergbauarbeiten in der Arcade von Haven zu f\u00fchren. Melde dich bei ihm und erfahre mehr \u00fc\
  ber die Situation in Haven und die Mission des Spiral HQ, den Kern von Cradle zu erreichen.


m.reporting_duty_1a = Sei gegr\u00fc\u00dft, Soldat, Gl\u00fcckwunsch zum Erreichen unseres \
  Basislagers hier in Haven. Ich bin Lieutenant Feron. Mir wurde von Captain Ozlo die Aufsicht \u00fc\
  ber unsere Bergbau-Operation im Uhrwerk \u00fcbertragen.\n\
  \n\
  Vor dir liegt die "Arcade", ein faszinierender Komplex, der als unsere Verbindung ins Herz \
  des Uhrwerks dient. Ich erkl\u00e4re dir, was wir hier im Auftrag von Spiral HQ machen.

r.reporting_duty_1a = Klingt wichtig! Erkl\u00e4re mir, wie das alles funktioniert.

m.reporting_duty_2a = Nachdem die Skylark abgest\u00fcrzt war, ist der prim\u00e4re \
  Tearium-Kern explodiert, hat einen Teil des Schiffs zerst\u00f6rt und seiner Energiequelle \
  beraubt. Weil wir nicht gerade hunderte Tonnen Tearium hier herumliegen haben, hat der Vogel \
  effektiv seine Fl\u00fcgel verloren.\n\
  \n\
  Mit der Hilfe der Stranger waren wir in der Lage, eine kleine Operationsbasis hier in Haven \
  einzurichten. Als wir unsere Systeme gestartet hatten, entdeckten wir im Herzen dieses \
  Felsbrockens eine Energiesignatur ungekannter St\u00e4rke.

r.reporting_duty_2a = Wenn wir diese Kraft nutzen k\u00f6nnten...

m.reporting_duty_3a = Ganz genau! Der Core des Uhrwerks k\u00f6nnte die Energiequelle sein, die \
  wir brauchen, um die Versorgung der Skylark wiederherzustellen und sie wieder funktionsf\u00e4\
  hig zu machen. Es gibt nur ein Problem - das Uhrwerk scheint als eine Art verr\u00fcckter \
  Todesfalle konstruiert zu sein.\n\
  \n\
  Das Erreichen des Core wird nicht einfach...

r.reporting_duty_3a = Ich stelle mich der Aufgabe!

m.reporting_duty_4a = Das ist die Einstellung, die ich sehen will. Fahre damit fort, Missionen \
  f\u00fcr Spiral HQ zu erledigen, die dir zugeteilt werden. Mit deiner Hilfe haben wir eine \
  Chance, den Core zu erreichen und Isora zu retten.

r.reporting_duty_4a = Verstanden, Lieutenant.

m.reporting_duty_5a = Dann autorisiere ich dich zu Arcade-Missionen. Du kannst die Arcade \u00fc\
  ber das Missionsinterface erreichen oder die Tore direkt hier in der Arcade betreten. Es \
  liegt eine riesige Welt unter deinen F\u00fc\u00dfen, die darauf wartet, erforscht zu werden.\n\
  \n\
  Viel Gl\u00fcck dabei!

r.reporting_duty_5a = Gespr\u00e4ch beenden

m.go_shopping = Gehen wir Einkaufen!
o.go_shopping = Besuche den Basar von Haven und erkunde, was er alles zu bieten hat.
b.go_shopping = Der Basar von Haven ist ein Ort an dem man alle m\u00f6glichen Arten von \
  Gegenstands-bezogenen Waren und Dienstleistungen finden kann. Egal ob du auf der Suche nach \
  einem m\u00e4chtigeren Schwert bist oder deine R\u00fcstung zu einer machen m\u00f6chtest, \
  die auch in einer Menschenmenge hervorsticht, dort findest du alles was du brauchst!

m.go_shopping_1a = Willkommen im Basar von Haven! Es ist eine Freude, dich kennenzulernen, {0}, \
  mein Name ist Bechamel. Da ich hier im Basar arbeite, hat Spiral HQ mich darum gebeten, den \
  Neuank\u00f6mmligen eine F\u00fchrung durch dieses fabelhafte Zentrum des Kommerzes zu geben \
  und ihnen alles zu zeigen, was es zu bieten hat.\n\
  \n\
  Also, auf zu einer schnellen Tour. Wollen wir? Versuche mitzuhalten, ich gehe recht z\u00fcgig.

r.go_shopping_1a = Geh voraus, Bechamel.
#(move to Quillion)

m.go_shopping_2a = Stranger wie Quillion hier verkaufen dir Waffen und R\u00fcstung. Jeder hat \
  sich auf eine bestimmte Art von Gegenst\u00e4nden spezialisiert, also rede mit ihnen und \
  finde heraus, was sie anbieten. Sie sind nicht sehr gespr\u00e4chig, aber sie haben jeden Tag \
  eine neue Reihe Waren auf Lager!\n\
  \n\
  Versichere dich vorher nur, dass du den notwendigen Rang hast, um die Gegenst\u00e4nde benutzen zu k\u00f6nnen!

r.go_shopping_2a = Verkaufen Stranger auch noch andere Dinge, ausser Waffen und R\u00fcstung?

m.go_shopping_3a = Ich bin froh, dass du fragst; das tun sie in der Tat! Gehen wir hin\u00fcber zu Vatel.

r.go_shopping_3a = (Bechamel folgen)
#(move to Vatel)

m.go_shopping_4a = Vatel hier wird dir eine Auswahl an Rezepten verkaufen, sowie Farbwechsler f\u00fcr deine pers\u00f6\
  nliche Farbe und andere Dinge.

r.go_shopping_4a = Rezepte? F\u00fcr Waffen und Ausr\u00fcstung?

m.go_shopping_5a = Das ist richtig, du kannst dir Rezepte und Materialien besorgen, um per \
  Alchemie Waffen und Ausr\u00fcstung an Alchemie-Stationen zu erstellen. Komm, ich werde dir \
  eine zeigen.

r.go_shopping_5a = Verstanden.
#(move to alchemy station)

m.go_shopping_6a = Hier haben wir eine Alchemie-Station und es besteht kein Zweifel, dass du \
  damit sehr schnell vertraut werden wirst, w\u00e4hrend du dein Arsenal erweiterst und \
  verbesserst. Aber kein Grund sich dar\u00fcber jetzt den Kopf zu zerbrechen, denn Spiral HQ \
  wird dir sp\u00e4ter recht sicher noch eine Mission verpassen, die das alles erkl\u00e4rt.\n\
  \n\
  Nun, das war es so ziemlich mit unserer ersten F\u00fchrung. Willst du, dass ich es nochmal \
  erkl\u00e4re oder meinst du, du hast es verstanden?

r.go_shopping_6a = Ich m\u00f6chte, dass du die Tour noch einmal mit mir machst.
r.go_shopping_6b = Ich denke, ich habs kapiert, Bechamel. Danke!

m.go_shopping_7a = Kein Problem, ich habe Zeit daf\u00fcr. Fangen wir von vorne an.

r.go_shopping_7a = (Bechamel folgen)
#(starts at Quillion)
m.go_shopping_7b = Wunderbar! Freut mich, dass ich dir helfen konnte, dich zurechtzufinden. \
  Viel Gl\u00fcck, {0}!

r.go_shopping_7b = Danke Bechamel, wir sehen uns!

# ----- GO SHOPPING B-TEST -----------------------------------------
m.go_shopping_b = Basar-Probleme
o.go_shopping_b = Hilf einem Knight, der \u00c4rger hat
b.go_shopping_b = Der Basar von Haven ist ein Ort an dem man alle m\u00f6glichen Arten von \
  Waren und Dienstleistungen rund um Ausr\u00fcstung findet. Jetzt scheint da aber eine Art \
  Aufruhr direkt ausserhalb des ansonsten so belebten Marktplatzes zu sein. Sieht aus, als \
  sollte man keine Zeit verlieren, es liegt \u00c4rger in der Luft!

m.go_shopping_b_1a = Puh, ich bin froh, dass du zur richtigen Zeit vorbeigekommen bist. Diese l\u00e4stigen Gremlins h\u00e4\
  tten alles kaputt gemacht! Der Basar w\u00e4re ruiniert gewesen!\n\
  \n\
  Oh, richtig, wo sind meine Manieren? Mein Name ist Tylen, es ist eine Freude, dich \
  kennenzulernen, {0}.

r.go_shopping_b_1a = Ist alles in Ordnung, Tylen?

m.go_shopping_b_2a = Jetzt ja. Ich war gerade auf dem Weg zum Basar, um einige Waren \
  abzuliefern, als ich von diesen Gremlins \u00fcberfallen wurde. Ich dachte, sie w\u00e4ren \
  aus Emberlight, einer Kolonie von versto\u00dfenen Gremlins, aber es sieht so aus, als h\u00e4tte ich mich geirrt.\n\
  \n\
  Nur, um sicherzugehen, w\u00fcrde es dir etwas ausmachen, mir dabei zu helfen, diese Sachen \
  zum Basar zu bringen?

r.go_shopping_b_2a = Sicher, gehen wir zum Basar.

m.go_shopping_b_3a = Uff, also das ging sehr viel schneller dadurch, dass du geholfen hast, \
  {0}. H\u00f6r zu, solltest du je eine F\u00fchrung durch den Basar wollen, komm einfach und \
  rede mit mir. Ich kann dir alles erz\u00e4hlen, was du \u00fcber die L\u00e4den und \
  Dienstleistungen hier wissen musst.\n\
  \n\
  Schau dich um! Ich wette, du findest viele interessante Sachen. Danke nochmal!

r.go_shopping_b_3a = Konversation beenden

m.pumping_up = Sich aufpumpen
o.pumping_up = Besuche die Trainingshalle f\u00fcr Fortgeschrittene und lerne einige hilfreiche \
  neue Techniken.
b.pumping_up = Du kannst die Trainingshalle f\u00fcr Fortgeschrittene nutzen wann immer du m\u00f6\
  chtest, sei das, um mit neuen Waffen zu \u00fcben oder, um mehr \u00fcber andere einzigartige \
  Bestandteile des Uhrwerks zu lernen. Sieh sie dir an und finde heraus, was sie anzubieten \
  hat!

# Show image of training hall entrance
m.pumping_up_1a = Hallo auch, {0}. Mein Name ist Konway. Spiral HQ meint, du k\u00f6nntest ein paar zus\u00e4\
  tzliche Hinweise brauchen, als Hilfe f\u00fcr deine anstehenden Missionen. W\u00fcrde es dir \
  etwas ausmachen, mich f\u00fcr eine Zusammenfassung in der Halle f\u00fcr Fortgeschrittene zu \
  treffen?

r.pumping_up_1a = Sicher, Konway, ich komme gleich r\u00fcber.

m.pumping_up_2a = Willkommen in der Trainingshalle f\u00fcr Fortgeschrittene, {0}. Hier wirst \
  du n\u00fctzliche \u00dcberlebenstips f\u00fcr deine Reisen durch das Uhrwerk finden.\n\
  \n\
  H\u00e4ttest du gern eine F\u00fchrung durch die Einrichtung?

r.pumping_up_2a = Okay. [Konway folgen]
r.pumping_up_2b = Nein danke, ich werde allein herumziehen.

m.pumping_up_3a = Hier dr\u00fcben haben wir eine Sammlung wertvoller Gegenst\u00e4nde, die du \
  wahrscheinlich im Uhrwerk finden wirst.

r.pumping_up_3a = Weiter

m.pumping_up_4a = Manche Gegenst\u00e4nde k\u00f6nnen dazu verwendet werden, Monster \
  anzugreifen, wie diese Phiolen. Du kannst in der Trainingsanlage hier \u00fcben, sie \
  aufzuheben und zu werfen.

r.pumping_up_4a = Weiter

m.pumping_up_5a = Entlang der Nordwand hier gibt es diverse Arten von Bl\u00f6cken, Schaltern, T\u00fcren und Kn\u00f6\
  pfen aus dem Uhrwerk. Wenn du die gef\u00e4hrlichen und t\u00f6dlichen Mechanismen dort unten \u00fc\
  berwinden willst, schlage ich vor, dass du dich damit vertraut machst, wie sie funktionieren!

r.pumping_up_5a = Weiter

m.pumping_up_6a = Im Osten gibt es einige Kampf-\u00dcbungs-R\u00e4ume. Die Trainings-W\u00fcrfel dort dr\u00fcben sind gr\u00f6\u00df\
  tenteils harmlos und perfekt daf\u00fcr, Techniken mit deinen Waffen und Schilden \
  auszuprobieren!

r.pumping_up_6a = Weiter

m.pumping_up_7a = Zu guter Letzt haben wir den Fallen- und Gefahren-Raum. Dort kannst du \
  lernen, wie du in manchen F\u00e4llen Fallen beeinflussen kannst und du kannst auch etwas \u00fc\
  ber Fallen die verschiedene Arten von Schaden verursachen lernen.

r.pumping_up_7a = Weiter

m.pumping_up_8a = Nun, das ist das Ende der F\u00fchrung, {0}. M\u00f6chstest du, dass ich es \
  nochmal erkl\u00e4re oder bist du bereit, das alles f\u00fcr dich auszuprobieren?

r.pumping_up_8a = Lass uns das nochmal durchgehen. [F\u00fchrung neu starten]
r.pumping_up_8b = Nein, ich bin bereit.

m.pumping_up_9a = Okay, dann beginnen wir von vorn.

# Show image of training hall entrance
m.pumping_up_9b = Gro\u00dfartig, dann werde ich dir diese Mission mal anrechnen.\n\
  \n\
  Denk daran, wenn du etwas mehr Training m\u00f6chtest, kannst du zur\u00fcckkommen. Die \
  Trainingshalle f\u00fcr Fortgeschrittene liegt auf dem Stadtplatz von Haven. Pass da draussen \
  auf auf dich, {0}.

r.pumping_up_9a = Weiter
r.pumping_up_9b = Danke! Ich bin dann mal Trainieren. [Mission abschlie\u00dfen]

