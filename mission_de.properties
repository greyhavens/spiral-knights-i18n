n.tortodrone_1 = 'D\u00e4monisches Memo'
m.tortodrone_1a = [Alle] Wichtige Erinnerung f\u00fcr alle Angestellten:\n\
  \n\
  Eine ID-Karte ist notwendig, um Zugang zum Sammelpunkt zu erhalten. Vorschriftsgem\u00e4\u00df\
  e Nutzung der ID-Karte wird sie in das d\u00fcstere Portal ziehen. Denkt daran: "Verlust bei \
  Benutzung."\n\
  ID-Karten, die nicht wie beschrieben benutzt werden ("verloren, kaputt oder verlegt"), m\u00fcssen vom Personalb\u00fc\
  ro ersetzt werden. Die Kosten f\u00fcr die Ersatzkarte werden vom n\u00e4chsten Gehaltsscheck \
  abgezogen und ein schwarzes Mal wird der Personalakte hinzugef\u00fcgt. Passt auf, dass euch \
  das nicht passiert. Verliert nicht eure ID-Karte.\n\
  \n\
  Danke,\n\
  Morgral'm\n\
  Stellvertretender Abteilungsleiter f\u00fcr Ressourcen-Management, Undercorp

r.tortodrone_1a = (Lesen beenden)
