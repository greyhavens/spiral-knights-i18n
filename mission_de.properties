m.p_r3_min = Geologische Untersuchung
o.p_r3_min = Sammle Mineralien f\u00fcr die Forschung von Chief Geo Knight Wegner.
b.p_r3_min = Chief Geo Knight Wegner will jederzeit seine Forschung an den mysteri\u00f6sen \
  Mineralien vorantreiben, die im Uhrwerk zu finden sind. Die Experimente, die er an den ihn \
  verf\u00fcgbaren Proben durchf\u00fchrt, resultieren f\u00fcr gew\u00f6hnlich in deren Aufl\u00f6\
  sung. Deshalb braucht er immer tapfere Knights, die ins Uhrwerk vordringen, um ihm mehr \
  Proben zu liefern.

m.p_r3_gate_beast = Natur der Bestie
o.p_r3_gate_beast = Rette die Geo Knights aus den F\u00e4ngen wilder Bestien!
b.p_r3_gate_beast = Unsere Geo Knights riskieren ihr Leben in der Wildnis des Uhrwerks. Ihre \
  Entdeckungen sind unbezahlbar, aber oft sind sie direkt im Herzen von Wolver-Gebiet \
  stationiert. Diese wilden Bestien belauern unsere Geo Knights und schnappen sie sich in der \
  Nacht, wenn sie unbewacht sind. Manchmal bilden Wolver ein Rudel und greifen ein ganzes \
  Forschungsteam an. In solchen Zeiten braucht es eine talentierte Truppe, um sie zu retten.

m.p_r3_gate_slime = Eine Prise Salz
o.p_r3_gate_slime = Liefere eine Ladung Rock Salt zum Forschungsteam im Lager der Lichen!
b.p_r3_gate_slime = Die beste Art, Glibber unter Kontrolle zu halten, sind gro\u00dfe Mengen \
  Rock Salt. Glibber hassen dieses Zeug, weil sie sich aufl\u00f6sen, wenn sie es ber\u00fchren. Wirklich nicht h\u00fcbsch.\n\
  \n\
  In den Lichen-Lager stationierte Forschungsteams legen oft Rock Salt um ihr gesamtes Camp, so \
  dass sie nicht als Glibberabendessen enden. Wie du dir sicher denken kannst, verbrauchen sie \
  das Zeug in Massen. Wenn ihnen die Vorr\u00e4te ausgehen, wird eine Truppe losgeschickt, um \
  sich ins Lage vorzuk\u00e4mpfen und das lebensrettende Gew\u00fcrz zu liefern.

m.p_r3_gate_construct = Angriff auf Maschinenladen 13
o.p_r3_gate_construct = Vernichte die funktionierenden Kriegsmaschinen in der zerst\u00f6rten Fabrik!
b.p_r3_gate_construct = Gremlins haben Probleme damit, ihren Krempel aufzur\u00e4umen. Unser Sp\u00e4her stolpern oft \u00fc\
  ber verlassene Gremlin-Fabriken, die immer noch voller aktiver feindlicher Konstrukte und \
  manchmal sogar mit funktionierender aktiver Kriegsmaschinerie ausgestattet sind.\n\
  \n\
  Spiral HQ hat angeordnet, diese Fabriken und Kriegsmaschinen auszuschalten, wann immer es m\u00f6glich ist, um zuk\u00fc\
  nftige Opfer zu vermeiden.

m.p_r3_gate_gremlin = Gef\u00e4hrlicher Raubzug
o.p_r3_gate_gremlin = Stehle die Gremlin-Schemata von der Gremlin-Baustelle
b.p_r3_gate_gremlin = Auf Gremlin-Baustellen gibt es oft wertvolle Baupl\u00e4ne f\u00fcr \
  Gremlin-Strukturen und sogar Waffen. Wenn Spiral HQ diese erh\u00e4lt, bieten sie seltene \
  Einblicke in die Gremlin-Technik.\n\
  \n\
  Gremlin-Schemata werden meist auf Terminals irgendwo auf der Baustelle gespeichert. Diese \
  Terminals sind gesch\u00fctzt und stark bewacht. Wenn du die Aufmerksamkeit eines Gremlins \
  erregst, rechne damit, dass die ganze Truppe kommt!

m.p_r3_gate_fiend = Gefangene Angestellte
o.p_r3_gate_fiend = Befreie die gefangenen Knights aus dem d\u00e4monischen Konzerngef\u00e4ngnis
b.p_r3_gate_fiend = Eine d\u00e4monische Stadt ist ein seltsamer Ort, den Spiral HQ immer noch \
  nicht so ganz versteht. D\u00e4monen sind \u00fcberall, und wenn sie einen ihrer Bosse in der \
  N\u00e4he sehen, tun sie alles, um flei\u00dfig und produktiv auszusehen. Ungl\u00fc\
  cklicherweise bedeutet Produktivit\u00e4t oft das Angreifen oder Gefangennehmen von \
  Eindringlingen wie einer Truppe Knights, die gerade auf der Durchreise ist.\n\
  \n\
  Es ist nicht klar, welchen Zweck gefangene Knights in der d\u00e4monischen Agenda haben. Die, \
  die die Gefangenschaft \u00fcberlebt haben, berichten von schlechten Bedingungen, aber das \
  Schlimmste sei der ganze Papierkram, den sie t\u00e4glich h\u00e4tten ausf\u00fcllen m\u00fc\
  ssen. Ein Schicksal, das kein Knight verdient!

m.p_r3_gate_undead = Todesangst
o.p_r3_gate_undead = Rette den verlorenen Knight davor, den Reihen der Toten im verwunschenen \
  Gutshaus beizutreten!
b.p_r3_gate_undead = Die Ruinen des Owlite-Schlosses sind ein finsterer, verfluchter Ort, an \
  dem es vor untoten Spookats nur so wimmelt. Die schlimmsten davon, die scheinbar \
  unverwundbaren Grimalkins, lauern ewig in den Schatten und warten auf den Moment, an dem dein \
  lebensrettendes Licht endlich erlischt.\n\
  \n\
  Einige Knights unterliegen der Finsternis und sind in diesen d\u00fcsteren Reichen vor Angst \
  gel\u00e4hmt. Das Einzige, was sie retten kann, sind tapfere Knights, die ihre Angst vor der \
  Dunkelheit und den Dingen, die darin lauern, \u00fcberwunden haben.

# RANK 4

m.p_r4_kit = Vorratslieferung
o.p_r4_kit = Sammle Vorr\u00e4te zur Lieferung an die in Emberlight stationierten Knights.
b.p_r4_kit = Einige Knights sind Teil spezieller Forschungsteams, die selten eine Chance haben, \
  f\u00fcr lange an die Oberfl\u00e4che zu kommen. Diese Knights benutzen oft die St\u00e4dte \
  im Uhrwerk als Basislager. Auch wenn die Monster dort freundlich gesinnt sind, sind die \
  Einrichtungen dort meist nicht besonders gut f\u00fcr Knights geeignet.\n\
  \n\
  Diese Knights k\u00f6nnen immer Vorr\u00e4te brauchen, um ihren Aufenthalt ein wenig \
  angenehmer zu gestalten. Ein gl\u00fccklicher Forscher ist ein produktiver Forscher!

m.p_r4_kit_2 = Vorratslieferung
o.p_r4_kit_2 = Sammle Vorr\u00e4te zur Lieferung an die in Emberlight stationierten Knights.
b.p_r4_kit_2 = Einige Knights sind Teil spezieller Forschungsteams, die selten eine Chance \
