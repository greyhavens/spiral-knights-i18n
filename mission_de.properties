o.operation_crimson_hammer_1 = Schlie\u00dfe dich Lieutenant Feron bei der Belagerung des Gro\u00df\
  en Arsenals von Warmaster Seerus an.
b.operation_crimson_hammer_1 = Warmaster Seerus ist der b\u00f6se Meister der Munition der m\u00e4\
  chtigen Crimson Order der Gremlins. Als Erschaffer und Lieferant ihrer teuflischen \
  Kriegsmaschinen, wird vermutet, dass er die treibende Kraft und der Kopf ist, der hinter den \
  Roarmulus Twins und zahllosen anderen Gremlinwaffen steckt.\n\
  \n\
  Aufkl\u00e4rer-Knights unter dem Kommando von Lieutenant Feron haben das 'Gro\u00dfe Arsenal' \
  von Seerus entdeckt, die Entwicklungs- und Lager-St\u00e4tte f\u00fcr all seine Waffen. Nun f\u00fc\
  hrt Feron selbst mehrere Truppen Knights direkt ins Gro\u00dfe Arsenal, mit der Absicht, \
  Seerus zu vernichten und seine Kriegsmaschinen zu zerst\u00f6ren.\n\
  \n\
  Nachdem Ferons Truppen auf heftigen Widerstand getroffen sind, brauchen sie nun Verst\u00e4\
  rkung und Spiral HQ schickt dich, um zu helfen.

