m.legion_almire_1a = Es gibt nichts Besseres, um das Blut in Wallung zu bringen, als ein wenig \
  todesverachtendes Herumtollen in einem verfluchten Nekropolis, was, Ranger?\n\
  \n\
  Das Nekropolis stammt von Almire, dem gefallenen K\u00f6nigreich vom verr\u00fcckten Lord \
  Soundso, Einwohner: unz\u00e4hlige Legionen von Untoten. Anscheinend bewachen diese \
  weniger-lebendigen Einheimischen dort etwas, das Spiral HQ gerne h\u00e4tte.\n\
  \n\
  Unsere Aufgabe ist es, ein besonderes Buch wiederzufinden, einen Teil einer viel gr\u00f6\u00df\
  eren Sammlung von Arbeiten, die uns mehr Einsicht in das Wesen dieses verfluchten K\u00f6nigreichs geben k\u00f6\
  nnte. Also greift euch eure Helme und eure besten Zombie-Schl\u00e4ger - es is kein \
  herzlicher Empfang zu erwarten.\n\
  \n\
  Auf gehts, Ranger!

r.legion_almire_1a = (Konversation beenden)

n.legion_almire_book = Text des almirischen Kodex:
m.legion_almire_2a = Ein Auszug aus den Aufzeichnungen von Lord Brandell, Hochkanzler von \
  Almire:\n\
  \n\
  Wie so viele seiner Leute, haben auch Recht und Ordnung Almire verlassen. Nur die \
  Gerechtigkeit bleibt, aber auch sie wurde verzerrt von den verfluchten Flammen, die unser K\u00f6nigreich verw\u00fc\
  sten. Gerechtigkeit ist nun das brennende Szepter unseres einst so gro\u00dfen Lord Vanaduke. \
  Die Gerechtigkeit ist schnell, unnachgiebig und gnadenlos.\n\
  \n\
  Meine Position hat mir in meinem Leben viel geboten. Ich habe den Ausblick geliebt, den mein \
  Turm mir bot. In diesen luftigen H\u00f6hen sah ich mich als den, der den Fr\u00fchling als Erster begr\u00fc\u00df\
  t, der Erste, der den Duft des Lebens in der Luft riecht, wenn die Blumen zu bl\u00fchen begannen.

r.legion_almire_2a = (Weiterlesen)

m.legion_almire_3a = Nun h\u00e4ngen nur Tod und Rauch in der Luft, sogar in dieser gro\u00dfen H\u00f6\
  he. Und die Feuer; die unnat\u00fcrlichen Feuer, die auf ewig zu brennen scheinen, die Feuer, \
  die sogar die frommsten M\u00e4nner in schreckenserregende Alptr\u00e4ume verwandeln, ich \
  weiss, dass diese Feuer auch mich bald nehmen werden.\n\
  \n\
  Ich werde meinem fr\u00fcheren Lord mein Leben nicht zum Geschenk machen. Er hat nicht das \
  Recht, es zu nehmen und zu verdrehen. Dies hier soll mein letzter Befehl sein. Dies hier soll \
  meine Gerechtigkeit sein.

r.legion_almire_3a = (Lesen beenden)

m.p_toxic_plant_r4 = Mischung 42
o.p_toxic_plant_r4 = Untersuche die Gremlin-Biowaffen-Fabrik
b.p_toxic_plant_r4 = Warnung: Das ist eine gef\u00e4hrliche Mission!\n\
  \n\
  Desna und ihre Aufkl\u00e4rer-Knights sind ein Elite-Team, damit betraut, Informationen \u00fcber einige der gef\u00e4\
  hrlichsten Ebenen des Uhrwerks zu sammeln. Sich ihnen anzuschlie\u00dfen kann gro\u00dfe \
  Belohnungen mit sich bringen, aber es ist unter Garantie eine lebensbedrohliche Reise!\n\
  \n\
  Spiral HQ hat tief im Uhrwerk eine Gremlin-Biowaffen-Fabrik entdeckt. Es wird davon \
  ausgegangen, dass diese Fabrik einem Mitglied der Crimson Order namens 'Herex' geh\u00f6rt. Die Aufkl\u00e4\
  rer-Knights wurden damit beauftragt, diese Anlage zu infiltrieren und mehr \u00fcber die \
  Natur von Herex' Biowaffen herauszufinden, bevor diese eingesetzt werden.
