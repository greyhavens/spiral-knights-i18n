  dte im Uhrwerk als Basislager. Auch wenn die Monster dort freundlich gesinnt sind, sind die \
  Einrichtungen dort meist nicht besonders gut f\u00fcr Knights geeignet.\n\
  \n\
  Diese Knights k\u00f6nnen immer Vorr\u00e4te brauchen, um ihren Aufenthalt ein wenig \
