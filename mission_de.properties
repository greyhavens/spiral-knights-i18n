m.p_r4_min = Geologische Untersuchung
o.p_r4_min = Sammle Mineralien f\u00fcr die Forschung von Chief Geo Knight Wegner.
b.p_r4_min = Chief Geo Knight Wegner will jederzeit seine Forschung an den mysteri\u00f6sen \
  Mineralien vorantreiben, die im Uhrwerk zu finden sind. Die Experimente, die er an den ihn \
  verf\u00fcgbaren Proben durchf\u00fchrt, resultieren f\u00fcr gew\u00f6hnlich in deren Aufl\u00f6\
  sung. Deshalb braucht er immer tapfere Knights, die ins Uhrwerk vordringen, um ihm mehr \
  Proben zu liefern.

m.p_r4_weap_1 = Waffenbereitstellung
o.p_r4_weap_1 = Liefere die geforderten Gegenst\u00e4nde zum Squad, das sie ben\u00f6tigt.
b.p_r4_weap_1 = Knights, die aus der Gefangenschaft durch Gremlins befreit wurden, haben oft \
  nichts au\u00dfer ihren Erinnerungen daran, in einem K\u00e4fig eingesperrt zu sein und von \
  ihren knurrenden Kidnappern misshandelt zu werden. Ihre Waffen sind immer weg, und ihre R\u00fc\
  stung oft von Gremlin-Ingenieuren besch\u00e4digt.\n\
  \n\
  Um diese Knights wieder f\u00fcr ihre Truppe kampfbereit zu machen, braucht es Knights mit \
  Zugang zu vielen Ressourcen, die die n\u00f6tigen Waffen und R\u00fcstungen bereitstellen.

m.p_r4_weap_2 = Waffenbereitstellung
o.p_r4_weap_2 = Liefere die geforderten Gegenst\u00e4nde zur Truppe, die sie ben\u00f6tigt.
b.p_r4_weap_2 = Knights, die aus der Gefangenschaft durch Gremlins befreit wurden, haben oft \
  nichts au\u00dfer ihren Erinnerungen daran, in einem K\u00e4fig eingesperrt zu sein und von \
  ihren knurrenden Kidnappern misshandelt zu werden. Ihre Waffen sind immer weg, und ihre R\u00fc\
  stung oft von Gremlin-Ingenieuren besch\u00e4digt.\n\
  \n\
  Um diese Knights wieder f\u00fcr ihre Truppe kampfbereit zu machen, braucht es Knights mit \
  Zugang zu vielen Ressourcen, die die n\u00f6tigen Waffen und R\u00fcstungen bereitstellen.

m.p_r4_gate_beast = Natur der Bestie
o.p_r4_gate_beast = Rette die Geo Knights aus den F\u00e4ngen wilder Bestien!
b.p_r4_gate_beast = Unsere Geo Knights riskieren ihr Leben in der Wildnis des Uhrwerks. Ihre \
  Entdeckungen sind unbezahlbar, aber oft sind sie direkt im Herzen von Wolver-Gebiet \
  stationiert. Diese wilden Bestien belauern unsere Geo Knights und schnappen sie sich in der \
  Nacht, wenn sie unbewacht sind. Manchmal bilden Wolver ein Rudel und greifen ein ganzes \
  Forschungsteam an. In solchen Zeiten braucht es eine talentierte Truppe, um sie zu retten.

m.p_r4_gate_slime = Eine Prise Salz
o.p_r4_gate_slime = Liefere eine Ladung Rock Salt zum Forschungsteam im Lager der Lichen!
b.p_r4_gate_slime = Die beste Art, Glibber unter Kontrolle zu halten, sind gro\u00dfe Mengen \
  Rock Salt. Glibber hassen dieses Zeug, weil sie sich aufl\u00f6sen, wenn sie es ber\u00fchren. Wirklich nicht h\u00fcbsch.\n\
  \n\
  In den Lichen-Lager stationierte Forschungsteams legen oft Rock Salt um ihr gesamtes Camp, so \
  dass sie nicht als Glibberabendessen enden. Wie du dir sicher denken kannst, verbrauchen sie \
  das Zeug in Massen. Wenn ihnen die Vorr\u00e4te ausgehen, wird eine Truppe losgeschickt, um \
  sich ins Lage vorzuk\u00e4mpfen und das lebensrettende Gew\u00fcrz zu liefern.

m.p_r4_gate_construct = Angriff auf Maschinenladen 13
o.p_r4_gate_construct = Vernichte die funktionierenden Kriegsmaschinen in der zerst\u00f6rten Fabrik!
b.p_r4_gate_construct = Gremlins haben Probleme damit, ihren Krempel aufzur\u00e4umen. Unser Sp\u00e4her stolpern oft \u00fc\
  ber verlassene Gremlin-Fabriken, die immer noch voller aktiver feindlicher Konstrukte und \
  manchmal sogar mit funktionierender aktiver Kriegsmaschinerie ausgestattet sind.\n\
  \n\
  Spiral HQ hat angeordnet, diese Fabriken und Kriegsmaschinen auszuschalten, wann immer es m\u00f6glich ist, um zuk\u00fc\
  nftige Opfer zu vermeiden.

