# Winterfest Danger Mission Event 7,9
#..................................................................................................
m.p_winterfest_danger_r7 = Grinchlin-Angriff!
o.p_winterfest_danger_r7 = Die Grinchlins haben das Winterfest zum letzten Mal sabotiert! Trage \
  den Kampf in ihre Reihen!
b.p_winterfest_danger_r7 = Warnung: Das ist eine gef\u00e4hrliche Mission!\n\
  \n\
  Im Auftrag von Impostoclaus hat Spiral HQ die Operationsbasis der ruchlosen Grinchlins \
  lokalisiert. Es ist Zeit, den Kampf in ihre Reihen zu tragen und ihren Winterfest-Terror ein \
  f\u00fcr alle Mal zu beenden. Aber es wird keine leichte Aufgabe.\n\
  \n\
  Diejenigen, die diese Mission annehmen, m\u00fcssen Mount Krampus erklimmen, ein gef\u00e4\
  hrlicher Pfad mit Grinchlin-Hinterhalten und eisigen Todesfallen. Entlang des Weges wirst du \
  Zufluchten finden, die es dir erlauben Grinchlin-Sch\u00e4tze zu sammeln und dem Berg zu \
  entkommen oder dich weiter zur Spitze vorzuk\u00e4mpfen, um noch gr\u00f6\u00dfere \
  Belohnungen zu bekommen! Aber sei gewarnt: Grinchlins und ihre Verb\u00fcndeten sind \
  knausrige Gesellen und werden KEINERLEI Beute hinterlassen. Alle Sch\u00e4tze auf Mount \
  Krampus finden sich bei den Zufluchten. Und solltest du dich entschlie\u00dfen von dort \
  weiterzugehen, in der Hoffnung auf gr\u00f6\u00dfere Belohnungen, riskierst du es, alles zu \
  verlieren, wenn dein Unternehmen fehlschl\u00e4gt!\n\
  \n\
  Manche sagen, dass ganz oben auf dem Gipfel von Mount Krampus ein Berg Grinchlin-Beute liegt, \
  der Sch\u00e4tze enthalten kann, die niemand je zuvor gesehen hat...

m.p_winterfest_danger_r9 = Grinchlin-Angriff!
o.p_winterfest_danger_r9 = Die Grinchlins haben das Winterfest zum letzten Mal sabotiert! Trage \
  den Kampf in ihre Reihen!
b.p_winterfest_danger_r9 = Warnung: Das ist eine gef\u00e4hrliche Mission!\n\
  \n\
  Im Auftrag von Impostoclaus hat Spiral HQ die Operationsbasis der ruchlosen Grinchlins \
  lokalisiert. Es ist Zeit, den Kampf in ihre Reihen zu tragen und ihren Winterfest-Terror ein \
  f\u00fcr alle Mal zu beenden. Aber es wird keine leichte Aufgabe.\n\
  \n\
  Diejenigen, die diese Mission annehmen, m\u00fcssen Mount Krampus erklimmen, ein gef\u00e4\
  hrlicher Pfad mit Grinchlin-Hinterhalten und eisigen Todesfallen. Entlang des Weges wirst du \
  Zufluchten finden, die es dir erlauben Grinchlin-Sch\u00e4tze zu sammeln und dem Berg zu \
  entkommen oder dich weiter zur Spitze vorzuk\u00e4mpfen, um noch gr\u00f6\u00dfere \
  Belohnungen zu bekommen! Aber sei gewarnt: Grinchlins und ihre Verb\u00fcndeten sind \
  knausrige Gesellen und werden KEINERLEI Beute hinterlassen. Alle Sch\u00e4tze auf Mount \
  Krampus finden sich bei den Zufluchten. Und solltest du dich entschlie\u00dfen von dort \
  weiterzugehen, in der Hoffnung auf gr\u00f6\u00dfere Belohnungen, riskierst du es, alles zu \
  verlieren, wenn dein Unternehmen fehlschl\u00e4gt!\n\
  \n\
  Manche sagen, dass ganz oben auf dem Gipfel von Mount Krampus ein Berg Grinchlin-Beute liegt, \
  der Sch\u00e4tze enthalten kann, die niemand je zuvor gesehen hat...

m.winterfest_danger_1a = Gr\u00fc\u00dfe! Du musst der mutige Knight sein, den Spiral HQ \
  geschickt hat, um sich um diese Grinchlins zu k\u00fcmmern. Mount Krampus ist nicht wie \
  andere Ebenen, also lass mich dir erkl\u00e4ren, wie es funktioniert.

r.winterfest_danger_1a = Ich kann jede Hilfe brauchen, die ich bekommen kann. Erz\u00e4hle mir \
  alles was du weisst.
r.winterfest_danger_1b = Ich habe keine Zeit, zu reden.

m.winterfest_danger_2a = Mount Krampus ist die Heimat der Grinchlin-Gruppierung und ihrer Verb\u00fc\
  ndeten. Sie sind ein sehr knausriger Haufen und werden selbt keinerlei Beute hinterlassen. \
  Alle ihre Sch\u00e4tze sind in den Zufluchten aufbewahrt, die du den Berg hinauf finden \
  wirst.

r.winterfest_danger_2a = Weiter

m.winterfest_danger_3a = Diese Zufluchten werden dir zwei M\u00f6glichkeiten zur Auswahl geben: \
  Verlasse den Berg und nimm einige Grinchlin-Sch\u00e4tze mit oder k\u00e4mpfe dich weiter den \
  Berg hinauf.\n\
  \n\
  Solltest du weitergehen, gibst du die Beute in dieser Zuflucht auf, aber du wirst sogar noch \
  mehr Sch\u00e4tze in der n\u00e4chsten Zuflucht finden.

r.winterfest_danger_3a = Weiter

m.winterfest_danger_4a = Mount Krampus ist eine beklemmende Umgebung und nur wenige Knights \
  haben die St\u00e4rke, seinen Gipfel zu erreichen. Wenn du meinst, es wird dir zu schwierig, \
  nimm den n\u00e4chsten Ausgang! Andernfalls riskierst du, alles zu verlieren!

r.winterfest_danger_4a = Ich verstehe.

m.winterfest_danger_5a = Viel Gl\u00fcck. Und halte dich warm!

