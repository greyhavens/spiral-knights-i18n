m.ghost_machine_1a = Aufgepasst, Ranger! Spiral HQ hat ein \u00e4usserst geheimnisvolles \
  Notsignal empfangen, von einer Fabrik tief im Uhrwerk aus.\n\
  \n\
  Was ich denke, ist, dass wir uns entweder kopf\u00fcber in eine gef\u00e4hrliche \
  Rettungsmission oder eine t\u00f6dliche Falle st\u00fcrzen. In jedem Fall liegt die L\u00f6\
  sung des Problems derzeit in eurem Arsenal. Also r\u00fcstet euch aus und bereitet euch auf \
  den Kampf vor.\n \
  \n\
  Auf gehts, Ranger!

