m.p_r3_mat_0 = Monstr\u00f6se Forschung
o.p_r3_mat_0 = Liefere die verlangten Materialien beim Spiral HQ f\u00fcr die Forschung ab.
b.p_r3_mat_0 = Spiral HQ versucht fortlaufend, sein Verst\u00e4ndnis der Kreaturen des Uhrwerks \
