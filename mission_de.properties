#Cobalt

m.hall_of_heroes_cobalt_1a = Sei gegr\u00fc\u00dft, {0}. Ich bin Jorin, ein Knight, der die \
  Standardausr\u00fcstung der Spiral Knights gemeistert hat. Meine Rezepte produzieren sehr \
  zuverl\u00e4ssige Waffen und Ausr\u00fcstung.\n\
  \n\
  Nur, weil deine Waffen keine schicken speziellen Schadensarten austeilen und deine R\u00fc\
  stung nicht gegen Statusschaden sch\u00fctzt, heisst das nicht, dass du im Uhrwerk nichts \
  reissen kannst. Die Ausr\u00fcstung, auf die ich mich spezialisiert habe, ist f\u00fcr so gut \
  wie jede Situation n\u00fctzlich. Sie wird dich am Leben halten und ordentlich gegen jedes \
  Monster austeilen, das sich dir in den Weg stellt.

r.hall_of_heroes_cobalt_1a = Okay, mal sehen, was du anzubieten hast. (Rezepte ansehen)
r.hall_of_heroes_cobalt_1b = Konversation beenden.


#Striker

m.hall_of_heroes_striker_1a = Gr\u00fc\u00dfe, {0}. Ich bin Echo, ein auf Nahkampf \
  spezialisierter Knight. Meine Rezepte produzieren Ausr\u00fcstung und Waffen, die f\u00fcr \
  schnelle und nahe Kampfhandlungen geeignet sind.\n\
  \n\
  Diese Gegenst\u00e4nde legen den Fokus auf Geschwindigkeit. Du willst schnell am Feind sein, \
  hart zuschlagen und wieder weg. Meine Ausr\u00fcstung wird dich zu einem Knight machen, der \
  vorneweg in die Schlacht spring und zuschl\u00e4gt, bevor sie auch nur einen Schuss abgeben k\u00f6nnen.

r.hall_of_heroes_striker_1a = Okay, mal sehen, was du anzubieten hast. (Rezepte ansehen)
r.hall_of_heroes_striker_1b = Konversation beenden.

#Heavy

m.hall_of_heroes_heavy_1a = Hallo {0}, ich bin Izola und auf Ausr\u00fcstung spezialisiert, die \
  sich f\u00fcr einen Besch\u00fctzer eignet. Meine Rezepte produzieren R\u00fcstungen mit sehr \
  starker Verteidigung und hart zuschlagende Waffen.\n\
  \n\
  Schwere Waffen ben\u00f6tigen pr\u00e4zises Timing, um effektiv zu sein, und die R\u00fcstung \
  macht dich tendentiell langsamer. Aber was du an Bequemlichkeit aufgibst, erh\u00e4ltst du in \
  Form schierer Kraft zur\u00fcck. Meine Ausr\u00fcstung macht dich zu deinem Knight, bei dem \
  sich dein Squad darauf verlassen kann, dass du selbst angesichts der wildesten Monster am \
  Leben bleibst.

r.hall_of_heroes_heavy_1a = Okay, mal sehen, was du anzubieten hast. (Rezepte ansehen)
r.hall_of_heroes_heavy_1b = Konversation beenden.

#Gunner

m.hall_of_heroes_gunner_1a = Hi, {0}, mein Name ist Daxen. Ich bin auf Ausr\u00fcstung rund um \
  Schusswafffen spezialisiert. Die Rezepte, die ich f\u00fcr dich habe, erzeugen Waffen und \
  Ausr\u00fcstung, die den Schwerpunkt auf den Fernkampf legt... auf Zeug ballern, verstehst \
  du?\n\
  \n\
  Schusswaffen erlauben es dir, Gegner aus sicherer Distanz zu treffen, aber sie bieten dir \
  nicht viele M\u00f6glichkeiten, wenn sie dir auf die Pelle r\u00fccken. Du musst schnell \
  denken und schnell schie\u00dfen, um ein guter Sch\u00fctze zu sein. Meine Ausr\u00fcstung \
  wird dir dabei helfen.

r.hall_of_heroes_gunner_1a = Okay, mal sehen, was du anzubieten hast. (Rezepte ansehen)
r.hall_of_heroes_gunner_1b = Konversation beenden.

#Bomber

m.hall_of_heroes_bomber_1a = Hallo {0}. Ich bin Remi und auf Bomben und Sprengstoffe \
  spezialisiert. Die Rezepte, die ich f\u00fcr dich habe, konzentrieren sich auf Waffen und \
  Ausr\u00fcstung mit Schwerpunkt darauf, deine Gegner in die Luft zu jagen!\n\
  \n\
  Die Benutzung von Bomben erfordert ein Verst\u00e4ndnis f\u00fcr Timing, sowohl, bevor du sie \
  legst wie auch danach, um effektiv zu sein. Meine Ausr\u00fcstung macht dich zu einem Knight, \
  den sein Squad ausschickt, um viele Feinde zugleich auszuschalten. Bomben sind gut daf\u00fcr, eine Gruppe an B\u00f6sewichten mit einem gro\u00dfen BUMM zu erledigen.

r.hall_of_heroes_bomber_1a = Okay, mal sehen, was du anzubieten hast. (Rezepte ansehen)
r.hall_of_heroes_bomber_1b = Konversation beenden.

#Piercing Def

m.hall_of_heroes_piercing_1a = Hi, {0}, ich bin Walkon, ein Knight, der sich auf Ausr\u00fc\
  stung mit starkem Schutz gegen Peforationsschaden spezialisiert hat. Die Rezepte, die ich f\u00fcr dich habe, erzeugen R\u00fc\
  stungen und Schilde, die dich vor den Perforationsangriffen von Glibbern und Bestien sch\u00fctzen.\n\
  \n\
  Eine der besten Aspekte an Perforationsschutz ist, dass die R\u00fcstung oft aus weichem, \
  nachgiebigem Material bestehen. So gem\u00fctlich, dass man direkt darin pennen kann!

r.hall_of_heroes_piercing_1a = Okay, mal sehen, was du anzubieten hast. (Rezepte ansehen)
r.hall_of_heroes_piercing_1b = Konversation beenden.

#Elemental Def

m.hall_of_heroes_elemental_1a = Gr\u00fc\u00dfe, {0}, mein Name ist Archillus und ich bin auf \
  Ausr\u00fcstung spezialisiert, die hohe Verteidigung gegen Elementarschaden bietet. Meine \
  Rezepte produzieren R\u00fcstungen und Schilde, die dich vor dem Elementarangriffen von \
  Konstrukten und Gremlins sch\u00fctzen.\n\
  \n\
  R\u00fcstungen und Schilde mit Schutz vor Elementarschaden stammen aus angepasster \
  Owlite-Technologie. Auch wenn es die Owlites nicht mehr gibt, lebt ihre Meisterschaft der \
  Elemente in dieser Ausr\u00fcstung fort.

r.hall_of_heroes_elemental_1a = Okay, mal sehen, was du anzubieten hast. (Rezepte ansehen)
r.hall_of_heroes_elemental_1b = Konversation beenden.

#Shadow Def

m.hall_of_heroes_shadow_1a = Hallo, {0}, ich bin Sylvin. Meine Spezialit\u00e4t ist Ausr\u00fc\
  stung mit starkem Schutz gegen Schattenschaden. Meine Rezepte verschaffen dir R\u00fcstungen \
  und Schilde, die dich vor den Schattenangriffen von D\u00e4monen und Untoten sch\u00fctzen.\n\
  \n\
  Verteidigung gegen Schattenschaden kann aus den Schatten selbst gewonnen werden. Meine \
  Schilde und R\u00fcstungen sind von den D\u00e4monen und Untoten selbst abgeleitet, die die \
  Kraft der Schatten gegen dich einsetzen wollen. Au\u00dferdem sehen sie furchterregend und \
  cool aus!

r.hall_of_heroes_shadow_1a = Okay, mal sehen, was du anzubieten hast. (Rezepte ansehen)
r.hall_of_heroes_shadow_1b = Konversation beenden.

#Specialist

m.hall_of_heroes_specialist_1a = Hi, {0}! Ich bin Knight Zebulon und auf Ausr\u00fcstung f\u00fc\
  r spezielle Szenarien spezialisiert. Meine Rezepte sind f\u00fcr Waffen, die auf eine \
  spezielle Familie von Monstern ausgerichtet sind, und f\u00fcr R\u00fcstungen, die \
  verschiedene Verteidigungsarten kombinieren.\n\
  \n\
  Manchmal braucht man einfach ein Schwert, dass Untote umhaut, oder eine R\u00fcstung, die \
  deine Glibber-Zerglibberungs-F\u00e4higkeiten steigert. Meine Ausr\u00fcstung ist oft f\u00fc\
  r einen speziellen Zweck gemacht, kann aber auch gut mit anderen kombiniert werden. \
  Experimentiere!

r.hall_of_heroes_specialist_1a = Okay, mal sehen, was du anzubieten hast. (Rezepte ansehen)
