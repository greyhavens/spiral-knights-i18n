m.p_legion_almire_r4 = Legion von Almire
o.p_legion_almire_r4 = Berge einen alten, almirischen Kodex
b.p_legion_almire_r4 = Warnung: Das ist eine gef\u00e4hrliche Mission!\n\
  \n\
  Desna und ihre Aufkl\u00e4rer-Knights sind ein Elite-Team, damit betraut, Informationen \u00fcber einige der gef\u00e4\
  hrlichsten ebenen des Uhrwerks zu sammeln. Sich ihnen anzuschlie\u00dfen kann gro\u00dfe \
  Belohnungen mit sich bringen, aber es ist unter Garantie eine lebensbedrohliche Reise!\n\
  \n\
  Spiral HQ glaubt, dass ein alter Kodex, der aus dem verfluchten K\u00f6nigreich von Almire \
  stammt, irgendwo in den dunklen und furchterregenden Tiefen von Nekropolis liegt. Es wird \
  angenommen, dass dieses Nekropolis vor untoten Monstrosit\u00e4ten wimmelt und dass nur diese \
  Aufkl\u00e4rer-Knights in der Lage sind, an diese Informationen zu gelangen und es wieder \
  lebendig heraus zu schaffen!

