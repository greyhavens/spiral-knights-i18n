m.p_tortodrone_r3 = Marsch der Tortodrones
o.p_tortodrone_r3 = Erforsche den Alten Hain und beende ein d\u00e4monisches Komplott.
b.p_tortodrone_r3 = Teile gefallener Tortodrones und H\u00e4ufungen dunkler Materie sind im \
  Uhrwerk aufgetaucht, was dazu gef\u00fchrt hat, dass Spiral HQ annimmt, dass die D\u00e4monen \
  irgendwie mit dem Verschwinden jener einst mythischen Wesen zu tun haben. Um herauszufinden, \
  was die D\u00e4monen im Schilde f\u00fchren, wirst du einen Weg finden m\u00fcssen, eines ihrer d\u00fcsteren Portale zu \u00f6\
  ffnen und hindurchzugehen. Spiral HQ vermutet, dass die Glyphen, die die D\u00e4monen mit \
  sich herumtragen, der Schl\u00fcssel zum \u00d6ffnen des Portals sein k\u00f6nnten.

