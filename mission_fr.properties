r.elemental_my_dear_2a = Arcane? Comme la magie et-

m.elemental_my_dear_3a = La magie? Quoi? Non, \u00e9coutez-moi bien, je parle de la \
  manipulation d'\u00e9nergie psychique ici. En tout cas, le dommage \u00e9l\u00e9mentaire est \
  produit par les m\u00e9caniques et la famille de gremlins. De plus, les m\u00e9caniques sont \
  faibles contre dommage \u00e9l\u00e9mentaire et les gremlins, contre dommage ombreuse. Gardez \
