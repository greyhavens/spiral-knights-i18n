r.shadow_knows_2a = Oui, je vois que nous sommes-

m.shadow_knows_3a = Bon, commen\u00e7ons. Le dommage d'ombreux est caus\u00e9, en g\u00e9n\u00e9ral, par l'\u00e9nergie n\u00e9gative et concentr\u00e9\
