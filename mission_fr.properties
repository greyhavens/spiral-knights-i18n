  En plus, les monstres blobeux sont faibles contre la dommage ombreuse et les b\u00eates, \u00e0 dommage per\u00e7ant. Gardez-le \u00e0 l'esprit.\n\
  \n\
  Bon, est-ce qu'il y a des autres chose que vous avez besoin?

r.pierce_of_cake_4a = Vous parlez tr\u00e8s vite, pouvez-vous le r\u00e9p\u00e9ter-
#(Start with 'very well {0}...)
r.pierce_of_cake_4b = Je pense que je le comprend merci de-
m.pierce_of_cake_5a = Avec plaisir. Bonne journ\u00e9e.

r.pierce_of_cake_5a = Terminer la conversation

m.oilers_in_boilers = Oilers dans les Chaufferies
o.oilers_in_boilers = D\u00e9nichez et brutalisez une brigade des blobeux braises
b.oilers_in_boilers = Une chaufferie sous Moorcroft Manor a \u00e9t\u00e9 infest\u00e9e par une l\u00e9\
  gion des blobeux onctueux nomm\u00e9 \u00aboilers\u00bb qui adorent les conditions ardentes. \u00c7a peut causer des d\u00e9\
  sastres pour des niveaux en proximit\u00e9 de la chaufferie si les blobeux entrent la \
  chaufferie et causent une explosion.\n\
  \n\
  Moorcroft Manor sert comme un point de connexion importante \u00e0 Niveau 2 et ses r\u00e9sidents sont les h\u00f4tes courtois et g\u00e9n\u00e9reux. C'est dans les int\u00e9r\u00ea\
  ts de Spiral HQ d'envoyer un escadron pour porter un coup aux blobeux fumants avant qu'ils ne \
  cr\u00e9ent une temp\u00eate de feu qui obture notre acc\u00e8s de Niveau 2.\n\
  \n\
  C'est \u00e0 vous de voir que les oilers sont retir\u00e9s de la chaufferie!

m.frostifur_fandango = Folie des Frostifurs
o.frostifur_fandango = Chassez la bande f\u00e9roce Snowclaw
b.frostifur_fandango = Spiral HQ a re\u00e7u les rapports nombreux par les escadrons qui sont \
  an\u00e9antis par une bande des Wolvers nomm\u00e9 \u00able Snowclaw Pack\u00bb pr\u00e8s de \
  profondeur 10. Ces frostifurs f\u00e9roces ont une morsure glaciale et sont tr\u00e8s territoriaux. D\u00fb \u00e0 \
  ses attaques implacables, Spiral HQ demande un escadron avec exp\u00e9rience d'infiltrer et d\u00e9\
  truire son antre afin de pr\u00e9venir plus de victimes.\n\
  \n\
  Il est conseill\u00e9 de vous prot\u00e9ger avec les \u00e9quipements per\u00e7ants et r\u00e9\
  sistants au gel avant de vous d\u00e9ployer.

m.monstrous_research_3 = Cherchages Monstrueux
o.monstrous_research_3 = Rapportez les mat\u00e9riaux sp\u00e9cifi\u00e9s \u00e0 Biotech Hahn \
  pour la recherche.
