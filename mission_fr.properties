  dirigent les villes sont aimables, les am\u00e9nit\u00e9s ne bien convient pas toujours aux \
  chevaliers.\n\
  \n\
  Ces chevaliers peuvent toujours utiliser les provisions pour rendre son s\u00e9jour plus \
  confortable. Un chercher content est un chercher productif!

m.p_r9_mat_3 = Cherchages monstrueux
o.p_r9_mat_3 = Rapportez les mat\u00e9riaux sp\u00e9cifi\u00e9s au Spiral HQ pour la recherche.
b.p_r9_mat_3 = Spiral HQ est toujours \u00e0 la recherche de comprendre les cr\u00e9atures qui \
  habitent dans les Rouages par l'examen des mat\u00e9riels. Si vous avez quelques mat\u00e9riels \u00e0 \
  donner, vous pouvez augmenter votre prestige en donnant des mat\u00e9riels \u00e0 Spiral HQ.

