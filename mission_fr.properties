m.lab_royal_jelly = Laboratoire
m.lab_roarmulus_twins = Laboratoire
m.lab_firestorm_citadel = Laboratoire


m.laboratory_visit = Une Visite au Labo
o.laboratory_visit = Visitez le Labo et rencontrez Biotech Morlin
b.laboratory_visit = Biotech Morlin est le responsable pour le Laboratoire situ\u00e9 dans la \
  Garnison de Haven. Il est \u00e0 la recherche d'un chevalier offrant volontairement de \
  voyager dans les rouages afin de procurer une cache de \u00absprites de bataille\u00bb perdue \
  pendant le crash de Skylark.

m.laboratory_visit_1a = Bonjour, {0}! J'entends que vous \u00eates arriv\u00e9 au Haven apr\u00e8s avoir voyag\u00e9 \
  le gouffre. Pendantvotre aventure l\u00e0-bas, avez-vous rencontr\u00e9 l'un de nos sprites \
  de bataille?

r.laboratory_visit_1a = C'est quoi un \u00absprite de bataille\u00bb?

m.laboratory_visit_2a = Ah, c'est vrai, vous \u00eates un nouveau recrue. La majorit\u00e9 de \
  chevaliers rencontre son premier sprite sur le champ de bataille. Peut-\u00eatre vous n'avez \
  jamais eu la chance de le trouver.\n\
  \n\
  Laissez-moi expliquer...

r.laboratory_visit_2a = Continuer

#(image of proto sprite)
m.laboratory_visit_3a = Capable \u00e0 fournir le soutien de combat et de la reconnaissance, un \
  sprite de bataille est un m\u00e9canique pilot\u00e9 par IA. Les sprites de bataille sont \
  tellement adaptables. Son IA leur permet d'observer ses environnements et aider son chevalier \
  dans la fa\u00e7on plus optimale.

r.laboratory_visit_3a = \u00c7a semble utile. Le sprite de bataille, comment puis-je l'obtenir?

#(same image of proto sprite)
m.laboratory_visit_4a = Quand un sprite de bataille est fourni au chevalier, un lien est \u00e9\
  crit dans le code de sprite pour soutenir le chevalier en tout cas. Ils ne vous laissent \
  jamais tout seul!\n\
  \n\
  Malheureusement, les caisses contenant les sprites de bataille sur l'Alouette sont tomb\u00e9\
  es au profond des Rouages apr\u00e8s le crash.

r.laboratory_visit_4a = Comment puis-je vous aider, Morlin?

m.laboratory_visit_5a = Un escadron recon a r\u00e9ussi \u00e0 trouver o\u00f9 se trouve la majorit\u00e9 \
  de sprites de bataille. Nous avons envoy\u00e9 Rhendon \u00e0 rechercher les trois r\u00e9\
  gions et il vous rencontrera dans les Rouages.\n\
  \n\
  Vous devez rapprocher nos sprites de bataille avant qu'ils ne tombent dans les mains de nos \
  ennemis!

r.laboratory_visit_5a = Je m'en charge, Morlin. Je nous procurerai ces sprites.

# RANK 2-2

m.skies_under_cradle = Les Cieux sous Cradle
o.skies_under_cradle = Planifiez une exp\u00e9dition \u00e0 travers les \u00celes Aurores
b.skies_under_cradle = Les Rouages sont des complexes souterraines fascinantes qui h\u00e9\
  bergent les mondes entiers dans ses g\u00e9o-globes de fer colossal. L'un de ces globes, \u00ab\u00celes Aurores\u00bb, d\u00e9couvert et nomm\u00e9 par les chevaliers \u00e9claireurs, est une s\u00e9rie des \u00eeles myst\u00e9\
  rieuses sous un ciel faux.\n\
  \n\
  Maintenant, comme un Apprenti, vous avez l\u2019autorisation d'explorer les ruines de ces \u00ee\
  les et rassemblez les mat\u00e9riels que vous pourriez d\u00e9couvrir.

m.scarlet_fortress = La Forteresse \u00c9carlate
o.scarlet_fortress = Planifiez une exp\u00e9dition \u00e0 travers les corridors hant\u00e9s de la Forteresse \u00c9carlate
b.scarlet_fortress = Un monde enti\u00e8rement diff\u00e9rent que les \u00celes Aurores, les \
  chevaliers \u00e9claireurs ont d\u00e9couvert une autre g\u00e9o-globe qui contient les \
  ruines d'un ch\u00e2teau ancien. Connu sous le nom de \u00abForteresse \u00c9carlate\u00bb, ce ch\u00e2teau \u00e9croul\u00e9 \
  est aussi le berceau aux esprits agit\u00e9s. Agissez avec prudence quand en explorant ces \
  couloirs tortueux.

m.monstrous_research = Cherchages Monstrueux
o.monstrous_research = Rapportez les mat\u00e9riaux sp\u00e9cifi\u00e9s au Spiral HQ pour la \
  recherche.
b.monstrous_research = \u00c0 date, vous avez probablement r\u00e9colt\u00e9 plusieurs \
  exemplaires de mat\u00e9riaux parvenant de vos premi\u00e8res exp\u00e9ditions dans les \
  Rouages. Spiral HQ demande aux chevaliers \u00e0 fournir les mat\u00e9riaux afin de continuer \
  leurs recherches au sujet des cr\u00e9atures r\u00f4dant les Rouages.

m.alchemy_beginners = L'Alchimie pour D\u00e9butants
o.alchemy_beginners = D\u00e9couvrez les merveilles de l'alchimie!
b.alchemy_beginners = L'alchimie est un m\u00e9tier ma\u00eetris\u00e9 par les Spiral Knights \
  qui permet les pouvoirs dormants de mat\u00e9riels de s'\u00e9veiller et fusionner afin de cr\u00e9\
  er de nouveaux items plus puissants! L'Ordre Spiral a compt\u00e9 sur l'alchimie comme une m\u00e9thode principale de cr\u00e9er les m\u00ea\
  mes arsenaux lesquels les chevaliers ont utilis\u00e9 pour quelques si\u00e8cles.\n\
  \n\
  D\u00e9couvrez comment l'alchimie deviendra une partie importante de votre survie sur ce \
  monde extraterrestre.

#(port to alchemy station in the bazaar)
m.alchemy_beginners_1a = Salut, {0}! Je m'appelle Bosco, et je suis l\u00e0 pour vous \
  introduire aux rudiments de l'alchimie.  \n\
  \n\
  C'est vraiment assez simple, gr\u00e2ce \u00e0 ces stations d'alchimie. Ils font presque tout \
  le boulot.

r.alchemy_beginners_1a = Je suis tout ou\u00efe, Bosco.

#(image)
m.alchemy_beginners_2a = Voil\u00e0 l'essentiel - collectez des mat\u00e9riaux et des recettes \
  et transformez-les en \u00e9quipement. Facile, non?

r.alchemy_beginners_2a = Continuez

#(image)
m.alchemy_beginners_3a = Un fois acqu\u00e9rit, vous devez apprendre la recette avant de \
  l'ultiliser. Cela d\u00e9truit la recette elle-m\u00eame, mais l'enregistre dans vos \u00abrecettes connus\u00bb \
  pour toujours! Un fois la recette appris, vous pouvez cr\u00e9er autant d'articles de cette \
  recette que vous voulez, tandis que vous avez les bons mat\u00e9riaux, bien s\u00fbr.

r.alchemy_beginners_3a = Continuez

#(image)
m.alchemy_beginners_4a = Quand vous interagissez avec un station d'alchimie, vous ouvrirez une \
  interface o\u00f9 vous pouvez voir votre recette appris...

r.alchemy_beginners_4a = Continuez

#(image)
m.alchemy_beginners_5a = ...ainsi que les mat\u00e9riaux n\u00e9cessaires, orbs of alchemy, et \
  crowns pour cr\u00e9er l'article.

r.alchemy_beginners_5a = Continuez

#(image)
m.alchemy_beginners_6a = Plusieurs recettes demandent un article \u00e9quipable et de haut \
  niveau. Ceux-l\u00e0 s'appellent \u00abitems sp\u00e9ciaux\u00bb dans une recette et vous \u00eates libre \u00e0 choisir l'item sp\u00e9\
  cial que vous voulez, tandis que c'est le bon type. . \n\
  \n\
  Cela est tr\u00e8s utile si vous avez plusieurs items demand\u00e9s, mais quelques-uns sont \
  sup\u00e9rieurs!

r.alchemy_beginners_6a = Continuez

#(image)
m.alchemy_beginners_7a = Un fois que vous \u00eates pret \u00e0 transmuer votre item, cliquez \
  sur \u00abConvertir\u00bb et retenez votre souffle!

r.alchemy_beginners_7a = Retenir mon souffle?

#(image)
m.alchemy_beginners_8a = Ben oui! Tenez-le, parce que chaque fois que vous transmuez un item \
  avec de l'alchimie, il y a une chance d'obtenir une variante unique qui le rendera beaucoup \
  plus puissant!

r.alchemy_beginners_8a = \u00c9patant!

m.alchemy_beginners_9a = C'est \u00e0 peu pr\u00e8s tout pour les bases d'alchimie. Je peux \
  tout r\u00e9peter si vous voulez, ou je peux marquer cette mission comme \u00abaccomplie\u00bb et vous dire au revoir.

r.alchemy_beginners_9a = J'aimerais le r\u00e9peter, s'il vous pl\u00e2it.
r.alchemy_beginners_9b = Je pense que je l'ai, merci!

m.alchemy_beginners_10a = Aucun probl\u00e8me. Alors, du d\u00e9but...
r.alchemy_beginners_10a = Continuez
#(start from the first image)
m.alchemy_beginners_10b = Vous serez ma\u00eetre alchimiste rapidement! Tiens - je vous donne \
  un couple de recettes pour commencer.

r.alchemy_beginners_10b = Completer le mission

m.time_to_crafty = Temps de Devenir un Artisan
o.time_to_crafty = Alchimez un Hot Edge et un Frost Gun et fournissez-les pour l'inspection.
b.time_to_crafty = Bosco aimerait que vous alchimisez un Hot Edge et Frost Gun pour lui \u00e0 \
  inspecter. Si c'est bon, il informera Spiral HQ que vous avez compris l'art d'alchimie et \
  peut-\u00eatre il ajoutera quelques Variantes Uniques \u00e0 vos nouvelles armes. Un mec \
  tellement sympa!

m.mission_sprite_1 = Une r\u00e9v\u00e9lation en flammes
o.mission_sprite_1 = Procurez une caisse de sprites de bataille disparus et retournez-les au \
  Lab
b.mission_sprite_1 = Rhendon vous attend dans une r\u00e9gion nomm\u00e9e les Steppes-Cr\u00e9\
  puscule dans les Rouages \u00e0 laquelle la reconnaissance a trouv\u00e9 une caisse de \
  sprites de bataille disparus. Procurez les sprites et repoussez les ennemis pour d\u00e9barrasser la r\u00e9gion. Vous \u00ea\
  tes permet d'utiliser n'importe quel sprite procur\u00e9 afin d'accomplir la mission.

m.mission_sprite_1_1a = Alors, {0}, allons-y. Il semble que toi et moi, nous puissions chasser \
  des sprites, hein?\n\
  \n\
  J'ai d\u00e9gauchi mon appareil avec ce du chevalier \u00e9claireur mais quelque chose \
  cloche. Le signal d'\u00e9nergie para\u00eet irr\u00e9gulier, mais je suis s\u00fbr que c'est \
  un sprite de bataille. Peut-\u00eatre ils sont en danger, alors d\u00e9p\u00eachons-nous!

m.mission_sprite_1_2a = Quoi de- sont-ils... des Sprites de Bataille? Quelque chose s'est pass\u00e9, ils ont transform\u00e9 en cr\u00e9ature de quelque sort.

#>(auto proceed)
#[image of Rhendon reaching out to a Drakon who is responding in a friendly manner]
#(Rhendon reaches out to one of the battle sprites)

m.mission_sprite_1_3a = Ils semblent aimables. En fait, ils se comportent comme les sprites de \
  bataille dont je connaissais. La seule diff\u00e9rence, c'est qu'ils, euh, bin, ressemblent \
  des dragons.

#>(auto proceed)

#[spawn a drakon on every party member]
m.mission_sprite_1_4a = H\u00e9, il para\u00eet que l'un des sprites se prend amiti\u00e9 pour \
  toi!! Donc, ne gaspille pas l'extra puissance, je resterai ici et prot\u00e9gerai ces sprites. Va d\u00e9gager la r\u00e9\
  gion et repousser les ennemis avec votre nouveau ami.

m.mission_sprite_1_5a = Je resterai ici et prot\u00e9gerai ces sprites. Certains de ces caisses \
  de transport sont vides. Je pense qu'il y a quelqu'un ou quelque chose qui chassent les \
  sprites.\n\
  \n\
  Pars en avant et d\u00e9gage la r\u00e9gion en repoussant les ennemies pour qu'un escadron \
  puisse arriver sain et sauf.

r.mission_sprite_1_5a = Je m'en vais!

# Post-mission lab report
# Note: Morlin is standing over by the sprite table thing examining the drakon
m.mission_sprite_1_6a = C'est incroyable! Les sprites de bataille que vous avez sauv\u00e9s au Steppes-Cr\u00e9puscule a trouv\u00e9 un moyen de se m\u00e9\
  tamorphoser en une nouvelle entit\u00e9!

r.mission_sprite_1_6a = Ils ressemblent les dragons qu'on trouve dans les contes.

m.mission_sprite_1_7a = Effectivement. La plupart de leur identit\u00e9 cellulaire est celle \
  qu'on se trouve dans un sprite de battaille. Mon hypoth\u00e8se: ils evoluaient rapidement \
  pour survivre dans leur nouveau environnement, mais comment? Notre technologie n'est pas \
  capable \u00e0 faire quelque chose comme cela...

r.mission_sprite_1_7a = Cradle devient plus et plus myst\u00e9rieux chaque jour.

m.mission_sprite_1_8a = Oui. Il semble que nous ayons plus \u00e0 \u00e9tudier sur ce monde-ci.\n\
  \n\
  Le rapport \u00e9crit par Rhendon a remarqu\u00e9 qu'un grand nombre de sprites avait disparu \
  au site. Il soup\u00e7onne quelque chose de louche.

r.mission_sprite_1_8a = Peut-\u00eatre les gremlins essayent de voler nos t\u00e9chnologies?

m.mission_sprite_1_9a = Si c'est le cas, nous devons nous prot\u00e9ger contre plus de dommage. \
  Alors, s'il vous pla\u00eet, il y a plus de sprites \u00e0 sauver. Et qui sait de quoi on d\u00e9\
  couvrira quand on y arrive!

r.mission_sprite_1_9a = Terminer la conversation.

m.mission_sprite_2 = Anges de l'antiquit\u00e9
o.mission_sprite_2 = Procurez une caisse de sprites de bataille disparus et retournez-les au \
  Labo
b.mission_sprite_2 = Rhendon vous attend dans une r\u00e9gion appelant Voie ferr\u00e9e et agit\u00e9e dans les Rouages, o\u00f9 \
  la reconnaissance a trouv\u00e9 une caisse de sprites de bataille disparus. Procurez les \
  sprites et repoussez les ennemis pour d\u00e9barrasser la r\u00e9gion. Vous \u00eates permet \
  d'utiliser n'importe quel sprite procur\u00e9 afin d'accomplir la mission.

m.mission_sprite_2_1a = Quelle place, hein? J'ai l'impression que c'est un station de train, \
  infest\u00e9 avec des \u00e2mes agit\u00e9s. C'est une bizarre place dans ce soutourrain ici.\n\
  \n\
  De toute fa\u00e7on, nous devons retrouver la caisse de sprites rapidement \u00e9tant donn\u00e9 \
  ce que nous avions trouv\u00e9 au Steppes-Cr\u00e9puscule. Allons-y!

m.mission_sprite_2_2a = Des dragons en premier et maintenant des... petites b\u00eates avec des \
  ailes? C'est pas vrai, nous voyons le m\u00eame ph\u00e9nom\u00e8ne une fois de plus!

#>(auto proceed)
#[spawn a seraphynx on every party member]
m.mission_sprite_2_3a = Wow {0}, tu as le chic avec les sprites de bataille! Ne perdons pas de \
  temps. D\u00e9gage le chemin pour qu'un escadron puisse arriver sans probl\u00e8mes!

m.mission_sprite_2_4a = Euh, je pense que ces sprites \u00e9tudient les vieux livres ici. Je ne \
  sais pas qu'ils peuvent lire!\n\
  \n\
  En tout cas, je resterai ici et prot\u00e9gerai les sprites. Je vois plus de caisses vides de \
  transport; ce n'est pas bon. Pars en avant et d\u00e9gage la r\u00e9gion en repoussant les \
  ennemies pour qu'un escadron puisse arriver sain et sauf.

r.mission_sprite_2_4a = Je m'en charge!

# Post-mission lab report

m.mission_sprite_2_6a = Une fois de plus, il para\u00eet que ces sprites ont chang\u00e9 leur \
  formes pour mieux adapter avec l'environnement.

r.mission_sprite_2_6a = Qu'est-ce qu'ils deviennent cette fois-ci?

m.mission_sprite_2_7a = Ce n'est pas clair, {0}. \u00c9tant donn\u00e9 le rapport que Rhendon \
  nous a fourni, je dirais que les sprites ont appris des choses trouv\u00e9es dans les tomes \u00e9soth\u00e9\
  riques et anciens. C'est fascinant comment ils ont adapt\u00e9 ses aptitudes de combat gr\u00e2ce \u00e0 ces tomes.

r.mission_sprite_2_7a = Vous dites que ces sprites apprennent des sorts d'un livre ancien?

m.mission_sprite_2_8a = Oui, il para\u00eet que ces sprites-ci ont ma\u00eetris\u00e9 leur \
  aptitude de concentrer sur des comp\u00e9tences de protection. \u00c9tant donn\u00e9 ce fait-l\u00e0 \
  et sa forme, je l'ai nomm\u00e9 \u00abseraphynx\u00bb.

r.mission_sprite_2_8a = Trop malin.

m.mission_sprite_2_9a = Oui, je sais. Je connais aussi que plus de caisses de transport se sont \
  fait vid\u00e9es encore une fois. Il a l'air du mal...\n\
  \n\
  Alors, il ne reste qu'une cache de sprites - procurez-en avant que le voleur ne trouve la \
  cache!

r.mission_sprite_2_9a = J'y vais.

m.mission_sprite_3 = La masque de fant\u00f4me
o.mission_sprite_3 = Procurez une caisse de sprites de bataille disparus et retournez-les au \
  Lab
b.mission_sprite_3 = Rhendon vous attend dans une gremlin usine abandonn\u00e9e dans les Rouages, o\u00f9 \
  la reconnaissance a trouv\u00e9 une caisse de sprites de bataille disparus. Procurez les \
  sprites et repoussez les ennemis pour d\u00e9barrasser la r\u00e9gion. Vous \u00eates permet \
  d'utiliser n'importe quel sprite procur\u00e9 afin d'accomplir la mission.

m.mission_sprite_3_1a = Sois prudent, {0}, ce que les gremlins faisaient ici, \u00e7a aboutit \u00e0 \
  un environnement scabreux.\n\
  \n\
  D\u00e9p\u00eachons-nous avant que plus de caisses de sprite ne soient perdues!

m.mission_sprite_3_2a = A\u00eee, sont-ils les sprites ou des fant\u00f4mes de quelque sort?

m.mission_sprite_3_3a = Je le dis une fois de plus: les sprites ont transform\u00e9 et cette \
  fois-ci, ils me donne un chair de poule!

# [spawn a maskeraith on every party member]

m.mission_sprite_3_4a = H\u00e9, ne regarde pas, {0}, mais il y a un fant\u00f4me en arri\u00e8re de toi! Esp\u00e8\
  rons que ces sprites n'ont pas mis toutes leurs puissances dans sa belle forme.\n\
  \n\
  Utilise ce sprite-ci pour d\u00e9gager le chemin pour qu'une escadron puisse arriver sain et \
  sauf!

m.mission_sprite_3_5a = Encore plus de caisses vides. Il y a de l'orage dans l'air, {0}. Pars \
  en avant et d\u00e9gage la r\u00e9gion en repoussant les ennemies pour qu'un escadron puisse \
  arriver sain et sauf.

r.mission_sprite_3_5a = Autre chose?

m.mission_sprite_3_6a = Je suis curieux... c'est quoi derri\u00e8re leur masques? Attend, non, \
  je n'en veux pas savoir.

r.mission_sprite_3_6a = Terminer la conversation

# Post-mission lab report

m.mission_sprite_3_7a = Les d\u00e9couvertes sur le planet deviennent plus et plus bizarres \
  chaque jour. Maintenant, nos sprites s'adaptent et prennent forme d'une fant\u00f4me de quelque sort.

r.mission_sprite_3_7a = Ils ressemblent les ombres vivants.

m.mission_sprite_3_8a = Tout \u00e0 fait. Ces sprites-ci s'adaptent pour se cacher, pour \
  utiliser les ombres autour lui-m\u00eame pour le subterfuge. Entre celui-ci et ses nouvelles \
  comp\u00e9tences avec la toxine et la d\u00e9bilitation, je conclus qu'ils seraient utiles au \
  champ de bataille.

r.mission_sprite_3_8a = Je me demande si vous ayez les nomm\u00e9 aussi?

m.mission_sprite_3_9a = Bien s\u00fbr, gr\u00e2ce \u00e0 sa forme, je crois que le nom \u00abmaskeraith\u00bb lui convient!

r.mission_sprite_3_9a = C'est charmant.

m.mission_sprite_3_10a = J'ai not\u00e9 votre sarcasme.\n\
  \n\
  Alors, sur ces vides caisses de transport; nous avons confirm\u00e9 un enl\u00e8vement.

r.mission_sprite_3_10a = Donnez-moi les d\u00e9tails.

m.mission_sprite_3_11a = Un escadron recon est rendu compte sur un monstre m\u00e9canique \
  duquel nous n'avons jamais vu, partant avec quelques sprites de bataille. Nous croyons que \
  c'est les gremlins qui sont derri\u00e8re le complot.

r.mission_sprite_3_11a = Je mettrai ses plans \u00e0 fin.

m.mission_sprite_3_12a = J'appr\u00e9cie votre courage, mais si les premiers rapports sur le \
  monstre m\u00e9chanique sont incontestables, vous aurez besoin plus d'aide. Je preparerai une \
  sel\u00e9ction de sprites de bataille pr\u00eats \u00e0 r\u00e9unir avec vous, {0}. Nous \
  parlerons de nouveau lorsque les pr\u00e9parations sont finies.

r.mission_sprite_3_12a = \u00c0 bient\u00f4t, Morlin.

# RANK 2-3

m.choose_your_sprite = Un lien \u00e9ternel
o.choose_your_sprite = Parlez \u00e0 Morlin et choissez un sprite de bataille comme votre \
  compagnon
b.choose_your_sprite = Morlin a prepar\u00e9 trois sprites pour vous \u00e0 \u00e9valuer. Vous \u00eates authoris\u00e9 \u00e0 \
  choisir l'un de ces sprites lequel vous serez r\u00e9unis. Ce sprite de bataille vous aidera \
  toujours dans les aventures \u00e0 venir, alors choisissez avec sagesse.\n\
  \n\
  On ne peut pas r\u00e9p\u00e9ter cette mission.

m.choose_your_sprite_1a = Bonjour, {0}! Maintenant que j'avais eu assez de temps pour faire la \
  recherche, je peux vous donner une bonne \u00e9valuation sur chacun de ces sprites.\n\
  \n\
  Malgr\u00e9 sa, euh, forme bizarre, il ressort que ces \u00abnouveaux\u00bb sprites de \
  bataille peuvent avoir des aptitudes avanc\u00e9es, non seulement parfaits pour au combat.

r.choose_your_sprite_1a = Continuer

m.choose_your_sprite_2a = Je vous fournirai un r\u00e9sum\u00e9 sur chacun de ces sprites de \
  bataille. En reconnaissance de votre bravoure en sauvant ces sprites, Spiral HQ vous donne \
  l'authorisation \u00e0 unir avec un sprite. Le lien dure pour toujours et c'est une grande \
  responsabilit\u00e9.\n\
  \n\
  Choisissez bien; lorsque vous avez d\u00e9cid\u00e9, il est impossible de changer d'avis.

r.choose_your_sprite_2a = Je comprends, Morlin.

m.choose_your_sprite_3a = Il y a trois sprites de bataille disponibles, tout diff\u00e9rents. \
  Chacun de ces sprites ont r\u00e9agi \u00e0 la puissance du monde et chacun offre une exp\u00e9rience de combat unique.\n\
  \n\
  Ces sprites incluent le drakon ardent, le seraphynx radieux, et le maskeraith ombreux.

r.choose_your_sprite_3a = Dites-moi \u00e0 propos de drakon.
r.choose_your_sprite_3b = Dites-moi \u00e0 propos de seraphynx.
r.choose_your_sprite_3c = Dites-moi \u00e0 propos de maskeraith.
r.choose_your_sprite_3d = J'ai fait ma d\u00e9cision et j'aimerais choisir mon sprite de \
  bataille.
r.choose_your_sprite_3e = Je ne suis pas pr\u00eat \u00e0 choisir.

#[image of a drakon using his skills]
m.choose_your_sprite_4a = Le drakon est un sprite de bataille qui red\u00e9finit la destruction \
  en feu. Ses comp\u00e9tences se sont concentr\u00e9es sur l'assaut direct: l'\u00e9clat de feu cr\u00e9\
  e un projectile explosif, la barri\u00e8re de feu encercle et prot\u00e8ge le joueur avec des \
  balles en feu et la tourmente de feu cr\u00e9e une onde de feu.\n\
  \n\
  Le drakon est mieux pour les chevaliers courageux qui pr\u00e9f\u00e8rent le combat \
  destructif au front.

r.choose_your_sprite_4a = Il a l'air que le drakon est parfait pour moi!
r.choose_your_sprite_4b = Dites-moi \u00e0 propos des autres sprites de bataille.

#[image of a seraphynx using his skills]

m.choose_your_sprite_5a = Le seraphynx est un sprite de bataille qui est l'incarnation de \
  protection et la restauration. Ses comp\u00e9tences sont concentr\u00e9es sur le soutien de \
  chevaliers au combat: le rayon lumineux cr\u00e9e un faisceau de la lumi\u00e8re b\u00e9nite, \
  le coup de foudre augmente la chance d'obtenir des c\u0153urs tomb\u00e9s des monstre, et \
  l'aura ang\u00e9lique cr\u00e9e un bouclier \u00e0 lumi\u00e8re, prot\u00e9geant le chevalier \
  et les membres de groupe dans la lumi\u00e8re.\n\
  \n\
  Le seraphynx est mieux pour les chevaliers qui veulent prot\u00e9ger et aider son groupe.

r.choose_your_sprite_5a = Il a l'air que le seraphynx est parfait pour moi!

#[image of a maskeraith using his skills]

m.choose_your_sprite_6a = Le maskeraith est un sprite de bataille de la tromperie et d\u00e9bilitation. Les comp\u00e9tences sont concentr\u00e9\
  es sur le subterfuge: les piquants caustiques sont des piques empoisonnants qui s'explosent \
  apr\u00e8s une attaque, la cape d'obscurit\u00e9 permet le chevalier de devenir invisible aux \
  monstres, et le nuage de sortil\u00e8ge permet le chevalier \u00e0 infliger aux monstres une \
  explosion au moment.\n\
  \n\
  Le maskeraith est mieux pour les chevaliers qui veulent se cacher dans l'obscurit\u00e9 et \
  attaquer les ennemis furtivement.

r.choose_your_sprite_6a = Il a l'air que le maskeraith est parfait pour moi!

m.choose_your_sprite_7a = Parfait! Lequel de ces sprites de bataille choisirez-vous?

r.choose_your_sprite_7a = Je choisis le drakon.
r.choose_your_sprite_7b = Je choisis le seraphynx.
r.choose_your_sprite_7c = Je choisis le maskeraith.
r.choose_your_sprite_7d = J'aimerais me renseigner sur les sprites de bataille.
r.choose_your_sprite_7e = Je ne suis pas pr\u00eat \u00e0 choisir.

#[image of a drakon using his skills]
m.choose_your_sprite_8a = Alors, vous avez choisi le drakon fougueux, le sprite de bataille de \
  ceux qui pr\u00e9f\u00e9rent le combat destructif au front?\n\
  \n\
  Une fois choisie, le choix sera final!

r.choose_your_sprite_8a = Oui, je choisis le drakon.
r.choose_your_sprite_8b = Je ne suis pas s\u00fbr, rappelez-moi sur les sprites de bataille.

#[image of a seraphynx using his skills]
m.choose_your_sprite_9a = Alors, vous avez choisi le seraphynx radieux, le sprite de bataille \
  de ceux qui veulent prot\u00e9ger et aider son groupe?\n\
  \n\
  Une fois choisie, le choix sera final!

r.choose_your_sprite_9a = Oui, je choisis le seraphynx.

#[image of a maskeraith using his skills]

m.choose_your_sprite_10a = Alors, vous avez choisi le maskeraith ombreux, le sprite de bataille \
  de ceux qui veulent se cacher dans l'obscurit\u00e9 et attaquer les ennemis furtivement?\n\
  \n\
  Une fois choisie, le choix sera final!

r.choose_your_sprite_10a = Oui, je choisis le maskeraith.

m.choose_your_sprite_11a = F\u00e9licitations, {0}! Vous \u00eates maintenant uni avec votre \
  sprite de bataille! Il sera sans doute un compagnon vraiment pr\u00e9cieux dans vos aventures \u00e0 venir.\n\
  \n\
  Si vous avez des questions sur comment \u00e9lever votre nouveau sprite de bataille, venez \
  parler avec moi ou Biscotti dans le Labo.

r.choose_your_sprite_11a = Merci, Morlin. Je ferai mon mieux \u00e0 bien \u00e9lever ce sprite-ci.

m.choose_your_sprite_12a = Pas de probl\u00e8me. Venez parler avec moi lorsque vous \u00eates pr\u00eat.
r.choose_your_sprite_12a = Terminer la conversation

# RANK 3-1

m.prestigious_opportunity = Une Opportunit\u00e9 Prestigieuse
o.prestigious_opportunity = Contactez Agent de Reconnaissance Kora et recevez l'autorisation de \
  Mission Prestige.
b.prestigious_opportunity = Il semble que vous excellez dans les yeux de Spiral HQ. Contactez \
  Agent de Reconnaissance Kora et apprenez comment vous pouvez prendre plus de missions de \
  Spiral HQ.

m.prestigious_opportunity_1a = Bonjour {0}, et f\u00e9licitations sur votre nouveau classement \
  d'\u00c9cuyer! Votre performance a attrap\u00e9 l'attention de Spiral HQ et ils vous ont \
  autoris\u00e9 d'accepter les missions de prestige. \n\
  \n\
  Les missions de prestige sont des missions s\u00e9lectes et offertes quotidiennement qui \
  offrent du prestige comme r\u00e9compense d'accomplissement. Parfois ces missions vous \
  demanderont de fournir Spiral HQ ou autres chevaliers  des items et parfois ils vous \
  demanderont de parcourir les Rouages.

r.prestigious_opportunity_1a = \u00c7a semble bien, Kora.

m.prestigious_opportunity_2a = Les missions de prestige sont totalement optionnelles et ne \
  peuvent \u00eatre r\u00e9p\u00e9t\u00e9es dans un seul jour. N'oubliez pas de surveiller les \
  missions pour des missions sp\u00e9ciales qui offrent de grandes recompenses de prestige!

r.prestigious_opportunity_2a = Merci, Kora. Je ferais de mon mieux.

m.prestigious_opportunity_3a = J'ai confiance en toi, {0}.  Je sais que tu seras parmi les \
  chevaliers assez adroit pour atteindre le Core et, avec un peu de chance, nous aider \u00e0 partir de cette plan\u00e8te!

r.prestigious_opportunity_3a = Completer le mission

m.minerals_rock = Les Min\u00e9rales sont Brillantes!
o.minerals_rock = Faites rapport au Chief Geo Knight Wegner \u00e0 l'Arcade dans Haven
b.minerals_rock = Chief Geo Knight Wegner est le responsable de la recherche des min\u00e9rales \u00e9\
  tranges que les chevaliers ont commenc\u00e9 \u00e0 extraire dans les Rouages. Il croit que \
  les min\u00e9raux sont la solution d'avoir acc\u00e8s au Core et r\u00e9cup\u00e9rer l'\u00e9nergie n\u00e9\
  cessaire de restaurer le Skylark.\n\
  \n\
  Rencontrez-lui \u00e0 l'arcade et savez comment l'aider dans sa recherche et exploiter la \
  vraie puissance de l'Arcade!


m.arc_mintut_1 = Allo! Moi, c'est Wegner, Chief Geo Knight du Skylark et chef des \u00e9tudes g\u00e9\
  ologiques dans les Rouages.

r.arc_mintut_1 = Je suis ici pour apprendre davantage sur les min\u00e9raux trouv\u00e9s dans les Rouages.

# IMAGE: step1_minerals.png
m.arc_mintut_2 = Pendant vos voyages dans les Rouages vous rencontrez cinq min\u00e9raux sp\u00e9\
  ciaux: crimsonite, moonstone, valestone, luminite et dark matter.

r.arc_mintut_2 = Continuez

# IMAGE: step2_gather.png
m.arc_mintut_3 = Vous trouverez des d\u00e9p\u00f4ts de minerai dans tous les niveaux des \
  Rouages et vous devez les attaquer pour les r\u00e9duire \u00e0 une taille portable. Vous \
  pouvez seulement les porter un \u00e0 la fois, mais c'est possible de les \u00e9changer l'un \
  pour l'autre. Cherchez le plus grand et le plus rayonnant que vous pouvez trouver. Ceux-l\u00e0 sont les plus pr\u00e9cieux.

r.arc_mintut_3 = Continuez

m.arc_mintut_4 = Quand vous arrivez sainement \u00e0 l'ascenseur, le min\u00e9ral que vous \
  portez sera d\u00e9pos\u00e9 dans votre arsenal pour \u00eatre utilis\u00e9 plus tard. Tout \
  le monde dans votre groupe partagent leurs min\u00e9raux, donc il n'y a aucun besoin de se \
  quereller entre vous.

r.arc_mintut_4 = Continuez

m.arc_mintut_5 = Les min\u00e9raux sont utilis\u00e9s pour cr\u00e9er la nourriture de sprite \
  dans le Laboratoire. La nourriture de sprite est vraiment importante pour le d\u00e9\
  veloppement de votre sprite, alors saisissez ces min\u00e9raux lorsque vous les voyez!

r.arc_mintut_5 = Continuez

m.arc_mintut_6 = Notre recherche g\u00e9ologique est encore en cours, alors il est probable \
  qu'il y a d'autres fa\u00e7ons d'utiliser ces min\u00e9raux bizarres et puissants.

r.arc_mintut_6 = Parfait! Merci pour l'info!

# TRUNCATED VERSION FOR WITHIN THE CLOCKWORKS
m.cwt_mintut_1 = Ici Wegner, Chief Geo Knight du Skylark. Je d\u00e9tecte une grande \
  concentration de d\u00e9p\u00f4ts de min\u00e9raux dans votre r\u00e9gion.

r.cwt_mintut_1 = Des min\u00e9raux? Vous voulez dire les colonnes de roche vives?

# IMAGE: step1_minerals.png
m.cwt_mintut_2 = Exactement! Pendant vos voyages dans les Rouages, vous trouverez cinq min\u00e9raux sp\u00e9\
  ciaux: crimsonite, moonstone, valestone, luminite, et dark matter.

r.cwt_mintut_2 = Continuer

# IMAGE: step2_gather.png
m.cwt_mintut_3 = Attaquez une colonne de min\u00e9ral afin de casser la roche \u00e0 une taille \
  qu'on peut apporter. Vous ne pouvez apporter qu'un min\u00e9ral \u00e0 la fois, mais vous \
  pouvez l'\u00e9changer en ramassant un autre. Cherchez le grand min\u00e9ral brillant. Ils \
  sont de grand valeur.

r.cwt_mintut_3 = Continuer

m.cwt_mintut_4 = Lorsque vous atteignez l'ascenseur, le min\u00e9ral, lequel vous apportez, \
  sera d\u00e9pos\u00e9 dans votre arsenal pour utiliser plus tard. Tous les gens dans votre \
  groupe obtiendront les min\u00e9raux des autres personnes, alors il n'y a aucune raison pour \
  se bagarrer!

r.cwt_mintut_4 = Continuer

m.cwt_mintut_5 = Les min\u00e9raux sont utilis\u00e9s pour cr\u00e9er la nourriture de sprite \
  dans le Laboratoire. La nourriture de sprite sont tr\u00e8s importantes pour le d\u00e9\
  veloppement de votre sprite, alors rassemblez ces min\u00e9raux quand vous les voyez!

r.cwt_mintut_5 = Continuer

m.cwt_mintut_6 = Notre recherche g\u00e9ologique est toujours en cours, alors il se peut qu'il \
  y ait des autres usages pour ces min\u00e9raux bizarres et puissants.

r.cwt_mintut_6 = C'est bien \u00e7a! Merci pour l'info!

m.alien_ooze = Limon d\u2019Extraterrestre
o.alien_ooze = Sauvez l'\u00e9quipe de recherche contre une colonie des lichens
b.alien_ooze = L'un de nos \u00e9quipes de recherche est assi\u00e9g\u00e9 par une immense \
  colonie de lichens. Les lichens sont une esp\u00e8ce \u00e9trang\u00e8re de la famille gel\u00e9e, crus d'\u00eatre arriv\u00e9\
  e dans les Rouages sur un m\u00e9t\u00e9ore qui a \u00e9cras\u00e9 sur la surface de Cradle. \
  Cette esp\u00e8ce de gel\u00e9e est form\u00e9e d'innombrables gel\u00e9es plus petits qui \
  forment des "colonies" mobiles et sentant.\n\
  \n\
  Les colonies lichens peuvent combiner pour former de nouveaux colonies de plus en plus \
  grands, \u00e9voluant une gamme de griffes et barbes mortels. Pr\u00e9venez-les de combiner \
  et sauvez l'\u00e9quipe de recherche!

m.alien_ooze_1a = Je n'ai rien \u00e0 dire, mais \u00e7a contient les Beast Bells. (DEV-ONLY)

r.alien_ooze_1a = Terminer la conversation

m.toy_soldiers = Jouets Soldats
o.toy_soldiers = D\u00e9truire la centre de production d'usine de Mecha Knights.
b.toy_soldiers = Les chevaliers \u00e9claireurs signalent des chevaliers mecha plus nombreux \
  dans la premi\u00e8re strate des Rouages et ont d\u00e9vouvert une facilit\u00e9 de \
  production de chevaliers mecha proche de Haven.\n\
  \n\
  Les chevaliers mecha sont de l'ing\u00e9nierie gremlin con\u00e7u pour servir commes \
  sentinelles, appartenant \u00e0 la famille construit. Ils partagent plusieurs habilit\u00e9s \
  des Spiral Knights. Soyez prudent en cherchant leur centre de production et d\u00e9sactivez-le pour de bon!

m.monstrous_research_2 = Cherchages Monstrueux
o.monstrous_research_2 = Rapportez les mat\u00e9riaux sp\u00e9cifi\u00e9s au Spiral HQ pour la \
  recherche.
b.monstrous_research_2 = \u00c0 date, vous avez probablement r\u00e9colt\u00e9 plusieurs \
  exemplaires de mat\u00e9riaux parvenant de la premi\u00e8re strate des Rouages qui seront tr\u00e8\
  s utiles. Spiral HQ demande aux chevaliers \u00e0 fournir les mat\u00e9riaux afin de \
  continuer leurs recherches au sujet des cr\u00e9atures r\u00f4dant les Rouages.

m.the_collector = Le Collectionneur
o.the_collector = Sauver les sprites et les chercheurs du Collectionneur
b.the_collector = Il y avait des rapports sur une large entit\u00e9 que nous l'appelons le \u00abCollectionneur\u00bb qui a intercept\u00e9 \
  nos chevaliers et les a saisi avec les sprites que nous suivons, puis il les emprisonne dans \
  une prison bien gard\u00e9e dans les Rouages. Avec votre nouveau Sprite, votre mission est de \
  trouver ce \u00abCollectionneur\u00bb et sauver les chevaliers et les sprites captives.

n.collector_prisoner = Chevalier v\u00e9t\u00e9ran
m.collector_prisoner_1a = Bah, je vois pauvrement... Spiral HQ a-t-il vous envoy\u00e9 ici pour nous sauver?

r.collector_prisoner_1a = Oui, mais pouvez-vous me dire ce que s'est pass\u00e9?

m.collector_prisoner_2a = Quelque chose a donn\u00e9 une embuscade \u00e0 mon \u00e9quipe de \
  sauvetage. Nous n'avons aucune chance de r\u00e9ussir. Je suis heureux que vous soyez arriv\u00e9\
  s ici. Sinon, je ne sais pas si nous serons encore en vie.

r.collector_prisoner_2a = Pouvez-vous retourner au Haven?

m.collector_prisoner_3a = Je pense que oui... nous essayerons d'\u00e9chapper si possible.\n\
  \n\
  Oh, mais soyez prudents! La chose qui nous a attaqu\u00e9 est encore ici, gardant une grande \
  cache de nos sprites de bataille captiv\u00e9s. Si vous d\u00e9cidez \u00e0 la battre, faites \
  attention \u00e0 sa charge mortelle. Bonne chasse!

r.collector_prisoner_3a = Terminer la conversation.

# RANK 3-2

m.pioneers = Les Pionniers
o.pioneers = Contactez Agent de Reconnaissance Kora par comlink
b.pioneers = Apr\u00e8s le crash d'Alouette, Commandant Ozlo a s\u00e9lectionn\u00e9 un escadron d'\u00e9\
  lite de Spiral Knights lesquels sont les premiers chevaliers d'entrer les Rouages. Ils n'\u00e9taient jamais vu apr\u00e8s l'exp\u00e9\
  dition. Contactez Agent de Reconnaissance Kora et apprenez comment vous jouer un r\u00f4le en r\u00e9solvant ce myst\u00e8re.

m.pioneers_1a = Allo {0}, j'esp\u00e8re que tout va bien. Quelque chose vient d'arriver qui \
  vous r\u00e9querra de confronter votre plus grand d\u00e9fi \u00e0 date. \n\
  \n\
  J'ai ici un ordre de Spiral HQ parvenant du commandant, Commander Ozlo lui-m\u00eame. On vous a s\u00e9lectionn\u00e9 d'\u00ea\
  tre un des chevaliers qui chercheront activement des traces d'Alpha Squad.

r.pioneers_1a = Alpha Squad? Je crois avoir entendre ce nom \u00e0 quelque part...

m.pioneers_2a = J'esp\u00e8re que oui, les recrues jasent constamment \u00e0 leur sujet. Ils \
  sont comme des h\u00e9ros pour certains. \n\
  \n\
  L'Alpha Squad \u00e9tait un escadron \u00e9lite s\u00e9lectionn\u00e9 personellement par Ozlo \
  pour \u00eatre les premiers \u00e0 rentrer dans les Rouages pour chercher la source du signal \
  d'\u00e9nergie dans les profondeurs. Puisque tous les syst\u00e8mes du Skylark \u00e9taient hors op\u00e9\
  ration pendant quelques semaines, les communications furent impossibles. \u00c0 la place, il \
  nous ont laiss\u00e9 une s\u00e9rie de modules de reconnaissance le long de leur trajet, un \
  peu comme des miettes de pain.

r.pioneers_2a = Continuez

m.pioneers_3a = Quand nos techniciens ont finalement r\u00e9ussi \u00e0 r\u00e9activer nos syst\u00e8\
  mes de communication, nous n'avons pas pu \u00e9tablir de lien avec l'Alpha Squad, et ils ne \
  nous ont pas contact\u00e9 non plus. Leur radiofr\u00e9quence est compl\u00e8tement mort. \n\
  \n\
  C'est leur radiofr\u00e9quence mort qui nous perplexe. Nos comlinks sont construit pour \
  endurer les conditions les plus extr\u00eames, m\u00eame des explosions. Ils ont m\u00eame surv\u00e9cu l'\u00e9\
  crasement du Skylark. Je ne peux penser de rien qui aurait pu avoir cet effet.

r.pioneers_3a = Et moi? Qu'est-ce qu'on me demande?

m.pioneers_4a = Votre t\u00e2che est de d\u00e9couvrir leur sort. Vous allez commencer par \
  chercher leurs modules de reconnaissance et les r\u00e9cup\u00e9rer pour qu'ils soient analys\u00e9\
  s. Je serai responsable de trouver leur emplacement g\u00e9n\u00e9ral et de vous diriger. \
  Vous serez responsable de foncer dans les Rouages pour les r\u00e9cup\u00e9rer. \n\
  \n\
  De plus, je vous fournirai une introduction \u00e0 chacun des quatre membres de l'Alpha \
  Squad: Chef d'Escadron Euclid, Gardien d'Escadron Grantz, \u00c9claireuse d'Escadron Parma, \
  et Technicien d'Escadron Rulen.

r.pioneers_4a = Parlez-moi \u00e0 propos de Chef d'Escadron Euclid.

m.pioneers_5a = Euclid n'\u00e9tait pas votre chevalier typique. Lorsque la majorit\u00e9 dans \
  sa division obtenaient son timbre d'\u00c9cuyer, il avait d\u00e9j\u00e0 obtenu le rang \
  Avant-garde. Comme chef d'escadron, il a dirig\u00e9 une s\u00e9rie d'assauts avec succ\u00e8\
  s contre les Morai pendant la lib\u00e9ration d'lsora. Un tacticien brillant, il \u00e9tait \
  connu pour faire finir le travail avec la moiti\u00e9 de chevaliers d'autres escadrons.

r.pioneers_5a = Continuez

m.pioneers_6a = C'est pour cette raison que Ozlo a lui-s\u00e9lectionn\u00e9 de prendre un \
  petit escadron aux profondeurs inconnus de Rouages. Apr\u00e8s tout, si vous coupez vos dents \
  en combattant sous Morai typhon feu vous pouvez \u00eatre capable de faire n'importe quoi, \
  correct?\n\
  \n\
  Mais peut-\u00eatre les Rouages sont trop beaucoup pour son aptitude. Nous ne connaissons \
  pas.

r.pioneers_6a = Parlez-moi \u00e0 propos du Gardien de l'Escadron Grantz.

m.pioneers_7a = Grantz \u00e9tait le vrai v\u00e9t\u00e9ran du groupe. Un Gardien aguerri, \
  Grantz se sp\u00e9cialise dans la protection de son escadron, c'est-\u00e0-dire, en \u00e9\
  crasant tous qui veut de mal \u00e0 eux.\n\
  \n\
  Grantz prenait son Serment de Gardien tr\u00e8s s\u00e9rieusement, en sacrifiant lui-m\u00eame afin de prot\u00e9ger une autre. Il \u00e9tait d\u00e9sint\u00e9ress\u00e9. J'imagine que si un \u00e9chec advient \u00e0 \
  l'Alpha Squad, Grantz ne le laisse pas finir sans une lutte infernale.

r.pioneers_7a = Parlez-moi \u00e0 propos de l'\u00c9claireuse de l'Escadron Parma.

m.pioneers_8a = Parma \u00e9tait la cadette du groupe, une \u00e9clairuse talentueuse, mais peu \
  exp\u00e9riment\u00e9e. Nous \u00e9tions \u00e0 l'acad\u00e9mie ensemble et j'ai des beaux \
  souvenirs du jour o\u00f9 les technicens du similateur ont pens\u00e9 que leur programme \u00e9tait bris\u00e9 gr\u00e2ce \u00e0 \
  la performance de Parma. Elle a m\u00eame fait des excuses! \n\
  \n\
  Tout de m\u00eame, je m'inqui\u00e8te. Des rapports que j'ai lu, les Rouages ne ressemblent \u00e0 \
  rien qu'on connait. J'esp\u00e8re seulement que, comme elle les garde inform\u00e9s des \
  dangers qui les attendent, ils la prot\u00e8gent.

r.pioneers_8a = Parlez-moi \u00e0 propos de Technicien d'Escadron Rulen.

m.pioneers_9a = Rulen \u00e9tait recrut\u00e9 comme un ing\u00e9nieur technicien que Commandant \
  Ozlo croyait est n\u00e9cessaire pour naviguer le grande monde m\u00e9canique qui est les \
  Rouages. Ses responsabilit\u00e9s incluent d\u00e9sactiver les verrous \u00e0 r\u00e9parer des armures \u00e0 d\u00e9manteler les m\u00e9\
  caniques sensibles. En plus, il \u00e9tait le chef sur l'analyse de Core d\u00e9s que \
  l'escadron s'arrivera.

r.pioneers_9a = Continuez

m.pioneers_10a = Rulen \u00e9tait tr\u00e8s... logique. Je pense qu'il \u00e9tait tr\u00e8s \
  conscient des chances que nous avons d'arriver au Core, puis faisons quelque choses avec le \
  Core pour restaurer le Skylark. Je pense que Rulen savait exactement quelle sorte de mission \
  il assumait quand ils faisaient sa premi\u00e8re descente dans le noirceur des Rouages.

r.pioneers_10a = Je commence o\u00f9, alors?

m.pioneers_11a = Bon, au boulot. Nous avons trouv\u00e9 un module de reconnaissance Alpha Squad \
  dans une zone des Rouages nomm\u00e9 les \u00abFor\u00eats farouches\u00bb. Or, cette zone en \
  particulier abrite une cr\u00e9ature horrible, le Snarbolax. \n\
  \n\
  Le Snarbolax a vaincu plusieurs \u00e9cuyers comme vous, mais je sais que vous \u00eates pr\u00eat, {0}. Je vous ai donn\u00e9 une s\u00e9\
  rie de missions qui vous permettra d'assembler un loadout pour la t\u00e2che de batailler cette b\u00ea\
  te terrible et rapporter ce module de reconnaissance!

r.pioneers_11a = Je ferai mon mieux de r\u00e9cuperer le module de reconnaissance et de d\u00e9truire le Snarbolax!

m.pioneers_12a = Nous comptons sur vous, {0}.

r.pioneers_12a = Terminer la conversation.

m.faith_armor = Confiance dans l'armure
o.faith_armor = Naviguez dans la chambre pleine de pi\u00e8ges et sauver l'apprenti, Wilks
b.faith_armor = Un apprenti appel\u00e9 Wilks qui est arriv\u00e9 d'un Camp de refuge a trouv\u00e9 qu'il est coinc\u00e9 dans une \u00abChambre de Pi\u00e8ges\u00bb\
  . Ces niveaux ont l'air d'\u00eatre con\u00e7us par les gremlins pour coincer et \u00e9\
  liminer ceux qui essayent d'explorer les Rouages.\n\
  \n\
  C'est possible que Wilks ne connait pas ce qu'il se mit. Maintenant il est coinc\u00e9 dans \
  quelque part de la chambre et il a besoin de votre aide.\n\
  \n\
  Certaines pi\u00e8ges peuvent \u00eatre \u00e9vit\u00e9es et quelquefois vous pouvez trouver \
  que vous avez besoin de risquer votre vie. En sauvant Wilks, vous comprendrez sans doute la \
  vraie valeur d'armure forte.

m.strength_unity = Force en unit\u00e9
o.strength_unity = D\u00e9fendez les Geo Knights d'un assaut monstrueux.
b.strength_unity = Quelque chose a provoqu\u00e9 une meute de b\u00eates dans les \u00celes \
  Aurores et ils ont attaqu\u00e9 une \u00e9quipe de recherche Geo Knight. Coinc\u00e9, l'\u00e9quipe nous a envoy\u00e9 un signale de d\u00e9\
  tresse et Spiral HQ vous a assign\u00e9 le t\u00e2che de la sauver.\n\
  \n\
  En se tenant ensemble, les Geo Knights ont r\u00e9ussi \u00e0 survivre jusqu'\u00e0 \
  maintenant, mais ile ne peuvent plus endurer. Montez une \u00e9quipe, partez \u00e0 la \
  rescousse, et confrontez les b\u00eates qui souhaitent d\u00e9vorer vos camarades!

m.blades_fallen = Les Lames des d\u00e9chus
o.blades_fallen = Placez une \u00e9p\u00e9e sur la tombe du soldat inconnu dans sa cimeterre
b.blades_fallen = Ce n'est pas tous les chevaliers, lesquels entrent les Rouages, qui \
  retournent et sentent le soleil sur leurs visages une fois de plus. Dans les profondeurs p\u00e9\
  rilleux, ceux qui bravent les dangers confrontent la r\u00e9alit\u00e9 que chaque exp\u00e9\
  dition peut devenir sa derni\u00e8re. Parfois leurs corps peuvent \u00eatre r\u00e9cup\u00e9r\u00e9\
  s et des autres fois, tout ce qui reste sont les vestiges de leurs \u00e9quipements.\n\
  \n\
  Ailleurs de Haven, Spiral HQ a construit un cimeti\u00e8re de soldats o\u00f9 les chevaliers d\u00e9chus sont enterr\u00e9\
  s. Comme un Spiral Knight, vous devez confronter la r\u00e9alit\u00e9 de la mort afin de \
  comprendre sa gravit\u00e9.\n\
  \n\
  Livrez les restes d'un chevalier inconnu, une \u00e9p\u00e9e, au monument dans le cimeti\u00e8\
  re. Mais soyez prudent - des \u00e9nergies ombreuses r\u00e9sonnent du cimeti\u00e8re, attir\u00e9es aux \u00e2mes innombrables.

# RENAMED FROM roar_snarbolax
m.shadow_beast = L'Ombre de la B\u00eate
o.shadow_beast = Vainquez le Snarbolax dans les For\u00eats farouches et r\u00e9cup\u00e9rez le recon module
b.shadow_beast = Spiral HQ a d\u00e9tect\u00e9 un module de reconnaissance laiss\u00e9 par \
  Alpha Squad quelque part dans les For\u00eats farouches. C'est votre mission de trouver et r\u00e9cup\u00e9rer le module. \n\
  \n\
  Les For\u00eats farouches abritent des meutes de b\u00eates sauvages qui ont prouv\u00e9 \
  mortels pour les escadrons du pass\u00e9. Comme r\u00e9action, les chevaliers technologiques \
  Tech Knights ont plac\u00e9 des cloches Beast Bells partout aux environs. Les frapper devrait \u00e9tonner toute b\u00ea\
  te qui entend leur bruit. \n\
  \n\
  Soyez avis\u00e9 que les Chevaliers \u00c9claireurs ont rapport\u00e9 la pr\u00e9sence d'une b\u00ea\
  te plus terrible que tous les b\u00eates d'auparavant. Surnomm\u00e9 le Snarbolax, il \
  ressemble \u00e0 une masse ombreuse de griffes et de crocs et semble \u00eatre compl\u00e8tement invuln\u00e9\
  rable contre nos armes. Si vous le rencontrez, essayez de trouver un chemin pour vous fuir \
  aussit\u00f4t que possible.

# RANK 4-1
m.new_chapter = Un Nouveau Chapitre
o.new_chapter = Contactez Agent de Reconnaissance Kora par comlink
b.new_chapter = Ayant d\u00e9fait le Snarbolax et r\u00e9cup\u00e9r\u00e9 le module de \
  reconnaissance d'Alpha Squad, il est l'heure de contacter l'Intel Agent Kora pour obtenir un \
  rapport sur l'analyse du module et se renseigner sur la certification dans le Panth\u00e9on des H\u00e9ros.


m.new_chapter_1a = F\u00e9licitations de devenir un Soldat, {0}! J'appris que vous avez bien \
  tabass\u00e9 ce Snarbolax, bravo!\n\
  \n\
  Nous avons eu une opportunit\u00e9 d\u2019analyser le module de reconnaissance par Euclid que \
  vous avez d\u00e9couvert dans la repaire de Snarbolax. Bas\u00e9 sur cet enregistrement, il \
  semble que Euclid a pr\u00e9sum\u00e9 quelque chose que nos Geo Knights ont d\u00e9couvert apr\u00e8\
  s le crash- que les niveaux dans les Rouages sont compos\u00e9s de terrain provenu de \
  plusieurs mondes extraterrestre!

r.new_chapter_1a = Quoi? Comment est-ce possible?

m.new_chapter_2a = C'est impossible \u00e0 dire pour le moment, mais nous pensons que, peu \
  importe la mani\u00e8re de son construction, Cradle comprend des grands morceaux des mondes \
  que se trouvaient trop proche. Si c'est vrai, nous n'avons jamais auparavant vu son \
  semblable.

r.new_chapter_2a = Quel monde bizarre. Quoi d'autre m'attend, Kora?

m.new_chapter_3a = Spiral HQ a vous autoris\u00e9 de visiter le Panth\u00e9on des H\u00e9ros et \
  recevoir votre Certification de 2 \u00c9toiles.\n\
  \n\
  Le Panth\u00e9on des H\u00e9ros est une place o\u00f9 des Chevaliers qui sortent du rang \
  comme vous-m\u00eame visiteront pour savoir comment acqu\u00e9rir et \u00e0 propos des \
  nouvelles recettes pour des \u00e9quipements aussi bien que recevoir une certification \u00e0 \
  explorer plus fond dans les Rouages.\n\
  \n\
  Votre premi\u00e8re visite vous n\u00e9cessite que vous apportez d'\u00e9quipement tous 2 \u00c9toiles. Vous l'avez d\u00e9j\u00e0\
  , alors il faut que c'est du g\u00e2teau!

r.new_chapter_3a = Merci Kora, je ferais de mon mieux!

m.shopping_again = Magasinons encore!
o.shopping_again = Suivez Bechamel dans une tourn\u00e9e des services plus avanc\u00e9s du Bazar.
b.shopping_again = Bechamel d\u00e9j\u00e0 vous a donn\u00e9 un tour de Haven Bazar qui inclut \
  o\u00f9 d'acqu\u00e9rir des nouveaux armes, des armures, et des recettes. Maintenant, c'est \
  du temps de lui rendre une autre visite et de se renseigner \u00e0 propos de services plus \
  avanc\u00e9es, trouv\u00e9s dans le Bazar.\n\
  \n\
  Vous rendrez une visite chez Punch et Vise, Brinks, et aussi visiter la boutique de Bechamel!

m.shopping_again_1a = Salut, {0}! Wow, t'es d\u00e9j\u00e0 un Soldat? Tu avances rapidement \
  dans les rangs.\n\
  \n\
  En tout cas, je suis ici de te donner un tour de Bazar, particuli\u00e8rement sur les \
  services avanc\u00e9s. Pour commencer, aimerais-tu apprendre comment actionner tes \u00e9quipements?

r.shopping_again_1a = Bien s\u00fbr!

m.shopping_again_2a = Qui n'a pas, non? Revenons \u00e0 l'atelier de Punch et Vise.

r.shopping_again_2a = (Suivez Bechamel)
#(move to Punch and Vise)

m.shopping_again_3a = Punch et Vise sont des forgerons gremlins qui peuvent changer les propri\u00e9t\u00e9s de vos armes et \u00e9quipements.

r.shopping_again_3a = Des Gremlins?!

m.shopping_again_4a = Tais-toi {0}, les gremlins ne se ressemblent pas tous. Quelques-un sont \
  en d\u00e9saccorde avec les moyens de King Tinkinzar et l'Ordre Incarnat. En fait, on me dit \
  que quelque part dans les Rouages se trouve une ville enti\u00e8re de gremlins qui ont \
  abandonn\u00e9 la Grande Colonie.

r.shopping_again_4a = Bien, d'accord...

m.shopping_again_5a = Bon.\n\
  \n\
  Punch peut ajouter des Variantes Uniques, un bonus sp\u00e9cial pour vos armes et \u00e9\
  quipements pour un prix. Mais ses m\u00e9thodes sont, euh... chaotiques. On ne sait jamais ce \
  qu'on obtenira.\n\
  \n\
  Vise est un peu plus pr\u00e9cise. Il peut d\u00e9lier tes armes et \u00e9quipements pour un \
  prix et tu peux les vendre ou donner encore!

r.shopping_again_5a = C'est utile, je le garde \u00e0 l'esprit. Avez-vous plus?

m.shopping_again_6a = Visitons Brinks.

r.shopping_again_6a = (Suivez Bechamel)
#(move to Brinks)

m.shopping_again_7a = Brinks est l'\u00e9changeur de jetons, en fouissant des certains items \
  contre des jetons qui peuvent \u00eatre rassembl\u00e9s dans les Rouages. Les jetons sont \
  trouv\u00e9s dans les bo\u00eetes de tr\u00e9sor, donn\u00e9s comme r\u00e9compenses, ou gagn\u00e9s quand les monstres \u00abboss\u00bb sont vaincus.

r.shopping_again_7a = Je comprends. Y-a-t'il autre chose?

m.shopping_again_8a = Il y a une seule boutique \u00e0 visiter. J'ai gard\u00e9 le meilleur \u00e0 la fin.

r.shopping_again_8a = (Suivez Bechamel)
#(move to Bechamel)

m.shopping_again_9a = Et... me voil\u00e0! Je suis l'accessorisateur qui ajoutent des \
  accessoires \u00e0 ton armure si t'as un billet. Avec des accessoires, ton armure se d\u00e9\
  marquera de la foule, c'est certain. Je sugg\u00e8re l'essayer - tu seras vite la prunelle \
  des yeux des autres chevaliers.

r.shopping_again_9a = O\u00f9 puis-je trouver des billets d'accessoire?

m.shopping_again_10a = Tu peux trouver ces billets d'accessoire dans les lockbox ou \u00e0 la Maison d'\u00e9nch\u00e9\
  res si un autre chevalier les vend.

r.shopping_again_10a = Affirmatif.

m.shopping_again_11a = C'est \u00e0 peu pr\u00e8s tout concernant les rudiments du Bazar. C'est \
  vraiment un endroit fantastique pour trouver n'importe quoi.\n\
  \n\
  Aimerais-tu que j'explique encore, ou l'as-tu tout compris?

r.shopping_again_11a = J'aimerais un tour une fois plus.
r.shopping_again_11b = Je pense que je l'enregiste Bechamel, merci!

m.shopping_again_12a = Pas de probl\u00e8me, j'ai du temps. Revenons aux Punch et Vise.
r.shopping_again_12a = (Suivez Bechamel)
#(starts at Punch and Vise)
m.shopping_again_12b = Parfait! Je suis enchant\u00e9 de t'aider. Bonne chance et n'oublie pas \
  que je serai ici toujours pour assurer l'originalit\u00e9 de ton armure!

r.shopping_again_12b = Merci Bechamel, \u00e0 plus!

# LET'S GO SHOPPING AGAIN B-TEST
m.shopping_again_b = Magasinons!
o.shopping_again_b = Suivez Bechamel pour une visite de plus beaux offres au Bazar
b.shopping_again_b = Maintenant, il est temps pour apprendre plus sur les services avanc\u00e9s \
  que le Bazar offre. Suivez chevalier Bechamel et visitez Punch et Vise, Brinks et m\u00eame \
  la boutique de Bechamel lui-m\u00eame!

m.shopping_again_b_1a = H\u00e9, {0}! Wow, t'es d\u00e9j\u00e0 un soldat? Tu avances tellement \
  rapidement dans les rangs.\n\
  \n\
  Alors, moi je suis Bechamel, et je suis ici pour te donner une visite des services plus avanc\u00e9\
  s au Bazar. Pour commencer, aimerais-tu savoir comment rendre ton \u00e9quipement plus puissant?

m.advanced_alchemy = Alchimie Avanc\u00e9e
o.advanced_alchemy = Visitez Bosco et d\u00e9couvrez la capacit\u00e9 d'alchimie avanc\u00e9
b.advanced_alchemy = Maintenant que vous avez atteint le rang de Soldat, Bosco au Bazar de \
  Haven a des nouveaux renseignements sur le sujet d'alchimie avanc\u00e9e pour vous. \
  Rendez-lui une visite et renseignez-vous sur les possibilit\u00e9s cach\u00e9es dans quelques \
  armes et \u00e9quipements!

m.advanced_alchemy_1a = Nous nous rencontrons encore, {0}. Spiral HQ m'a demand\u00e9 de vous introduire \u00e0 l'alchimie avanc\u00e9e. Ne vous inqui\u00e9tez pas, \u00e7\
  a ne sera pas long. Je travaille sur un Mecha Knight vieux, alors \u00e7a ne me d\u00e9range pas.

r.advanced_alchemy_1a = J'\u00e9coute, Bosco!

m.advanced_alchemy_2a = Fondamentalement, je vais expliquer des items \u00abbranch\u00e9s\u00bb\
  . Vous voyez la plupart d'alchimie que vous avez vu suit un chemin lin\u00e9aire. Tout \
  simplement, il s'am\u00e9liore au fil du temps et chaque am\u00e9lioration est mieux que le \
  pr\u00e9c\u00e9dent.\n\
  \n\
  Mais pas tous les items sont comme \u00e7a. Beaucoup d'items peuvent devenir des items \
  multiples et compl\u00e8tement diff\u00e9rents!

r.advanced_alchemy_2a = Wow, il me reste beaucoup \u00e0 apprendre!

m.advanced_alchemy_3a = Vous les saisissez au fur et au mesure, je promis. Par exemple, prenez \
  ce Brandish. Il a le potentiel de devenir trois sortes des lames \u00e9l\u00e9mentaires qui \
  donnent des conditions d'\u00e9tats, ou m\u00eame une \u00e9p\u00e9e ombreuse de noirceur!\n\
  \n\
  Vous avez besoin juste de d\u00e9couvrir les recettes qui n\u00e9cessitent un Brandish et \
  commencez \u00e0 fabriquer pour les d\u00e9masquer. Tiens, vous pouvez garder ce Brandish. \
  Transformez-le \u00e0 quelque chose extraordinaire.

r.advanced_alchemy_3a = Merci Bosco! Je me trouverais de recettes tout de suite!

m.hall_of_heroes_0 = Panth\u00e9on des H\u00e9ros
o.hall_of_heroes_0 = Atteindre le rang de Soldat

m.hall_of_heroes_1 = Panth\u00e9on des H\u00e9ros
o.hall_of_heroes_1 = Visitez le Panth\u00e9on des H\u00e9ros en portant les \u00e9quipements de 2 \u00c9\
  toiles ou plus et recevez une certification
b.hall_of_heroes_1 = Le Panth\u00e9on des H\u00e9ros est une place o\u00f9 les chevaliers re\u00e7\
  oivent leur Certification d'\u00c9toile, de laquelle donne le chevalier l'acc\u00e8s au \
  profondeurs plus fonds dans les Rouages. Chaque certification assure qu'un chevalier atteint \
  le niveau d'\u00e9toile n\u00e9cessaire pour confronter les d\u00e9fis dans les missions \u00e0 venir.\n\
  \n\
  Le Panth\u00e9on des H\u00e9ros permet les chevaliers de parler aux chevaliers v\u00e9t\u00e9rans et d\u00e9\
  couvrir leurs loadouts, m\u00eame avoir l'occasion d'ach\u00e9ter les recettes pour ces \
  loadouts.\n\
  \n\
  Visitez le Panth\u00e9on des H\u00e9ros et recevez votre Certification de 2 \u00c9toiles afin \
  d'obtenir l'acc\u00e8s aux missions dedans les niveaux plus fonds dans les Rouages.

#Conversation (used at in the hall):
n.hall_of_heroes_0 = Gardien Spiral
m.hall_of_heroes_0_1a = Vous \u00eates bienvenues, {0}. Vous vous trouvez dans le Panth\u00e9on des H\u00e9ros, o\u00f9 les chevaliers v\u00e9t\u00e9\
  rans viennent offrir leurs services aux membres de notre ordre qui ont atteint le rang de \
  Soldat ou plus. \n\
  \n\
  En compl\u00e8tant d'autres missions, j'ai confiance qu'un jour, vous vous tiendrez parmi \
  nous.

r.hall_of_heroes_0_1a = Terminer la conversation.

m.hall_of_heroes_1_1a = Bienvenue, {0}. Je suis Lieutenant Barrus, le Gardien du Panth\u00e9on des H\u00e9ros.  \n\
  \n\
  Vous \u00eates ici parce que Spiral HQ a remarqu\u00e9 votre potentiel de devenir une \
  Avant-Garde de Spiral Knights. Le Panth\u00e9on des H\u00e9ros est maintenant \u00e0 votre \
  disposition. Comme vous augmentez de classement, vous recevrez des nouveaux missions qui vous \
  chargeront de visiter les v\u00e9t\u00e9rans du Panth\u00e9on et recevoir l'acc\u00e8s \u00e0 plusieurs recettes.

r.hall_of_heroes_1_1a = J'\u00e9tais inform\u00e9 que je pourrais recevoir la Certification d'\u00c9toiles ici?

m.hall_of_heroes_1_2a = Oui, afin d'avoir acc\u00e8s des stratums plus fonds dans les Rouages, \
  vous avez besoin premi\u00e8rement de recevoir la Certification d'\u00c9toile. Venez me \
  parler quand vous \u00e9quipez une armure, une casque, un bouclier, et un minimum d'un arme, \
  tous avec un niveau d'\u00e9toile sp\u00e9cifie ou plus.

r.hall_of_heroes_1_2a = Affirmatif.

m.hall_of_heroes_1_3a = F\u00e9licitations {0}, vous avez les exigences n\u00e9cessaires et avez re\u00e7\
  u votre Certification de 2 \u00c9toiles. Prenez l'ascenseur derri\u00e8re moi afin de compl\u00e9ter votre mission.

r.hall_of_heroes_1_3a = Terminer la conversation.

m.hall_of_heroes_1_3b = Je suis d\u00e9sol\u00e9 {0}, mais vous n'avez pas les exigences n\u00e9\
  cessaires. Veuillez me parler quand vous \u00eates \u00e9quip\u00e9 avec une armure, une \
  casque, un bouclier, et une arme de 2 \u00e9toiles ou plus.

r.hall_of_heroes_1_3b = Terminer la conversation

#*Completed requirements but have not exited properly:

m.hall_of_heroes_1_3c = Veuillez prendre l'ascenseur \u00e0 l'arri\u00e8re de moi afin de compl\u00e9ter votre mission.

r.hall_of_heroes_1_3c = Terminer la conversation.

#*Completed mission and returned:

m.hall_of_heroes_1_4 = Bienvenue au Panth\u00e9on des H\u00e9roes, {0}. Veuillez parler aux \
  chevaliers h\u00e9ro\u00efques que vous voyez devant vous afin d'avoir acc\u00e8s \u00e0 leurs armes et \u00e9quipements.

r.hall_of_heroes_1_4 = Merci Lieutenant, je leur parlerai.

# RANK 4-2
m.new_threat = Un nouveau menace
o.new_threat = Affronter une nouvelle menance dangereuse au Haven
b.new_threat = Des forces mortelles conspirent contre Haven. Contactez Intel Agent Kora et d\u00e9\
  couvrez comment vous pouvez aider.

m.new_threat_1a = Bonjour, {0}! Nous avons deux missions de grande l'importance. Premi\u00e8rement, nous avons trouv\u00e9 une indication d'\u00e9\
  nergie semblable de laquelle \u00e9manant d'artifice que vous avez trouv\u00e9 dans les \
  Rouages. Nous cernons sur cette signature d'\u00e9nergie ce moment. Trouver la source \
  pourrait nous permettre de comprendre ce que l'intrigant Razwog avait pr\u00e9par\u00e9 avec \
  l'artifice ou ce que l'artifice pourrait vraiment faire.

r.new_threat_1a = Continuer

m.new_threat_2a = Deuxi\u00e8mement, nous avons re\u00e7u un alarmant nombre de rapports sur \
  les faits et gestes de gremlins dans les Rouages sous Haven. Nous n'avons pas encore des d\u00e9tails, mais \u00e9tait donn\u00e9 les r\u00e9\
  lations entre eux et nous, nous pensons qu'ils pr\u00e9parent une attaque.

r.new_threat_2a = Continuer

