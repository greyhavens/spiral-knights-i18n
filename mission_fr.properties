m.p_r9_min = Questionnaire g\u00e9ologique
o.p_r9_min = Rassemblez les min\u00e9raux pour Chef Geo Knight Wegner pour la recherche.
b.p_r9_min = Chief Geo Knight Wegner est toujours \u00e0 la recherche d'avancer ses \u00e9tudes sur les min\u00e9raux myst\u00e9rieux qui sont trouv\u00e9\
  s dans les Rouages. Les exp\u00e9riences qu'il conduit sur ses \u00e9chantillons ont tendance \
  de se d\u00e9sint\u00e9grer. Pour cette raison il a toujours besoin des chevaliers courageux \
  de fouiller dans les Rouages pour procurer plus des \u00e9chantillons pour lui.

m.p_r9_weap_4 = Appropriation des armes
o.p_r9_weap_4 = Distribuez l'item demand\u00e9 \u00e0 l'escadron dans le besoin.
b.p_r9_weap_4 = Apr\u00e8s d'\u00eatre mis en captivit\u00e9 par des gremlins, les chevaliers \
  sauv\u00e9s n'ont rien \u00e0 montrer sauf des m\u00e9moires terribles d'\u00eatre mettre \
  sous clef et abus\u00e9 par ses ravisseurs grondants. Ses armes sont toujours vol\u00e9s et ses \u00e9quipements endommag\u00e9s par des m\u00e9\
  caniciens gremlins pour pr\u00e9venir n'importe quelle notion de survivre une tentative de \
  fuite.\n\
  \n\
  Afin de retourner ces chevaliers \u00e0 son escadron, pr\u00e9par\u00e9s pour la lutte, \
  Spiral HQ a besoin des autres chevaliers avec acc\u00e8s de ressources amples pour s'y mettre \
  et de les fournir avec des armes et \u00e9quipements n\u00e9cessaires.

m.p_r9_weap_5 = Appropriation des armes
o.p_r9_weap_5 = Distribuez l'item demand\u00e9 \u00e0 l'escadron dans le besoin.
b.p_r9_weap_5 = Apr\u00e8s d'\u00eatre mis en captivit\u00e9 par des gremlins, les chevaliers \
  sauv\u00e9s n'ont rien \u00e0 montrer sauf des m\u00e9moires terribles d'\u00eatre mettre \
