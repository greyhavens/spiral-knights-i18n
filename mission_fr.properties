m.chilled_to_bone = Frissons \u00e0 l'os
o.chilled_to_bone = Faites une enqu\u00eate sur les ruines ombreuses du Ch\u00e2teau Bougeoir
b.chilled_to_bone = Sans doute, vous aviez rencontr\u00e9 des monstres bizarres appell\u00e9s \u00abSpookats\u00bb. Enfin, les Chevaliers \u00c9claireurs ont d\u00e9\
  couvert la source possible de ces cr\u00e9atures fant\u00f4mes.\n\
  \n\
  Des grandes concentrations de Spookats ont \u00e9t\u00e9 vues dans les ruines assombris d'un \
  ch\u00e2teau owlite. Surnomm\u00e9 le \u00abCh\u00e2teau Bougeoir\u00bb, ce domaine ombreux \
  est illumin\u00e9 seulement par une s\u00e9rie de bougies Owlite.\n\
  \n\
  Agissez avec prudence pendant que vous explorez dehors la lumi\u00e8re des bougies. Des \
  spookats \u00e9normes connu sous le nom \u00abgrimalkins\u00bb se cachent dans la noirceur. \
  Il semble que les Grimalkins r\u00e9sistent aux tous les armes et on doit les \u00e9viter. Votre seule d\u00e9\
  fense est de rester dans la lumi\u00e8re!\n\
  \n\
  Spiral HQ vous a donn\u00e9 cette mission afin de rassembler plus des donn\u00e9es sur les \
  origines de Spookats et la myst\u00e8re de la chute des owlites. Faites une enqu\u00eate sur le Ch\u00e2\
  teau Bougeoir et rapportez vos conclusions!

m.work_idle_hands = Travailler pour des mains oisives
o.work_idle_hands = Incrustez-vous \u00e0 la r\u00e9ception de bureau diabolique!
b.work_idle_hands = Des devilites sont un sort des d\u00e9mons qui ont une structure \
  corporative, de laquelle r\u00e9git chacun de ces actions. Les Chevaliers \u00c9claireurs ont d\u00e9couvert une s\u00e9rie des \u00abbureaux\u00bb \
  devilite partout dans les Rouages, trouv\u00e9 dans las vestiges d'une ville \u00e9trang\u00e8re.\n\
  \n\
  L'analyse des donn\u00e9es rassembl\u00e9es sur ces bureaux indiqu\u00e9e que les \
  corporations devilite sont externalis\u00e9es par des gremlins afin de concevoir et g\u00e9\
  rer les projets qui incluent des armes construit sp\u00e9cifiquement d'attaquer des escadrons \
  Spiral Knights.\n\
  \n\
  C'est temps que ces devilites recevrent ses lettres de licenciement et d'annuler les projets \
  diaboliques.

m.monstrous_research_5 = Cherchages Monstrueux
o.monstrous_research_5 = Rapportez les mat\u00e9riaux sp\u00e9cifi\u00e9s \u00e0 Biotech Hahn \
  pour la recherche.
b.monstrous_research_5 = Biotech Hahn essaie d'avancer ses recherches sur les monstres \
  morts-vivants et d\u00e9mons et a besoin d'\u00e9chantillons parvenant de vos missions r\u00e9\
  cents. Il a encore un fois demand\u00e9 qu'on vous rappelle sa \u00abmeilleure le\u00e7on gratuite \u00e0 date!\u00bb \
  en vous demandant si vous voulez le faire ou non.

# RANK 5-2
m.another_trace = Une Autre Trace
o.another_trace = Contactez Agent de Reconnaissance Kora par comlink
b.another_trace = Les techniciens dans le Laboratoire au Haven rapportent que leur syst\u00e8me de d\u00e9tection est enfin r\u00e9par\u00e9 \
  et mis en ligne. Agent de reconnaissance Kora aimerait de vous mettre au courant sur les d\u00e9fis \u00e0 \
  venir. La contactez via comlink pour en savoir plus.


m.another_trace_1a = Bonjour {0}, je suis heureuse de vous notifier que mon \u00e9quipement est r\u00e9par\u00e9 \
  et mis en marche! Maintenant, j'ai des bonnes nouvelles et des mauvaises nouvelles. La bonne \
  nouvelle: j'ai r\u00e9ussi \u00e0 localiser la source de cette indication d'\u00e9nergie. \
  Voici la mauvaise nouvelle: la source d'\u00e9nergie est localis\u00e9e dans une r\u00e9gion \
  de Rouages dangereuse laquelle les Chevaliers \u00c9claireurs ont surnomm\u00e9 le \u00abPalais des Gel\u00e9es royaux\u00bb.

r.another_trace_1a = Vous n'\u00eates pas serieuse!

m.another_trace_2a = L'endroit est aussi bizarre que vous pensiez. Il para\u00eet que les \
  monstres de la famille gel\u00e9e ont m\u00eame une aristocratie de gel\u00e9es \u00e9lites. Ces \u00abRoyal Jellies\u00bb sont \u00e9normes, \u00e9go\u00ef\
  stes et de mauvaise humeur qui vivent dans des palais opulents. Nous pensons qu'ils ne sont \
  pas les habitants d'origine, car nous ne les croyons pas capables de construire des \u00e9difices.

r.another_trace_2a = D'accord...

m.another_trace_3a = La source d'\u00e9nergie vient de quelque part dans le Palais des Gel\u00e9\
  es royaux et nous vous demandons de l'investiguer. Les Royal Jellies sont territoriaux, donc \
  il se peut que vous deviez aller au-d\u00e9l\u00e0 sa tani\u00e8re afin d'atteindre votre \
  but. Soyez vigilant - les Royal Jellies sont bien prot\u00e9g\u00e9s. Vous rencontrez s\u00fbrement de la r\u00e9\
  sistance significative pendant que vous enqu\u00eatez dans le palais.

r.another_trace_3a = Vous pouvez compter sur moi, Kora.

m.another_trace_4a = Bonne chance, {0}. Assurez-vous que vous \u00eates bien pr\u00e9par\u00e9 \
  avant d'essayer cette mission.

r.another_trace_4a = Terminer la conversation.

m.time_enough_at_last = Le Temps suffit enfin
o.time_enough_at_last = D\u00e9couvrez le sort du chevalier perdu dans la Forteresse \u00c9carlate.
b.time_enough_at_last = L'un de nos braves chevaliers, Edger, a disparu pendant qu'il explorait \
  la Forteresse \u00c9carlate. Puisque ce ch\u00e2teau d\u00e9labr\u00e9 est fourmillant des \
  spookats et des gel\u00e9es, son escadron craint qu'il est en danger et ont demand\u00e9 un chevalier plus exp\u00e9riment\u00e9 pour le retrouver.\n\
  \n\
  Trouvez Edger dans la forteresse et ramenez-le au Haven!

#Conversation (used at the end of the mission):
n.time_enough_at_last = Edger.
m.time_enough_at_last_1a = Ah, bonjour. Je suppose que vous \u00eates avec Spiral HQ.

r.time_enough_at_last_1a = Oui, vous devez \u00eatre Edger. Vos membres d'escadron m'ont demand\u00e9 de vous trouver.

m.time_enough_at_last_2a = Ah, oui, mon escadron. Une groupe agr\u00e9able... forte et d\u00e9termin\u00e9e. Je ne suis pas s\u00fb\
  r que je m'accorde avec ma groupe, honn\u00eatement... moi, je suis plus d'un lecteur! Ils \
  doivent \u00eatre bien sans moi, j'imagine.

r.time_enough_at_last_2a = Sans vous? Non, je suis ici de vous ram\u00e8ne!

m.time_enough_at_last_3a = Je ne sais pas... \u00e7a va bien ici parmi ces tomes anciens. J'ai \
  plein \u00e0 lire, plus que je peux faire dans une vie. Mais je suppose qu'il ne sera pas un \
  probl\u00e8me.\n\
  \n\
  S'il vous pla\u00eet, retournez au Haven. Notifiez mon escadron que je suis bien et que je \
  suis hors de danger.

r.time_enough_at_last_3a = Hors de danger? La place ici est fourmillant avec des monstres!

m.time_enough_at_last_4a = Oui, beaucoup des monstres. Je n'aurais pas d\u00fb arriver seul. \
  J'aurais d\u00fb rester avec mon escadron.\n\
  \n\
  (Edger regarde au loin.)\n\
  \n\
  Je ne rappelle pas comment il se passait... peut-\u00eatre je ne rappelle jamais. Mais il ne \
  fait pas de mal.

r.time_enough_at_last_4a = Vous dites que...?

m.time_enough_at_last_5a = Je dis que j'ai beaucoup \u00e0 lire maintenant. La bataille est \
  finie, c'est tout.\n\
  \n\
  S'il vous pla\u00eet, retournez au Haven et notifier les personnes que tout va bien.

r.time_enough_at_last_5a = Je vais les notifier, Edger.

m.rise_or_fall = La mont\u00e9e ou la Chute
o.rise_or_fall = Testez vos forces avec un confrontation glutineux dans l'Ar\u00e8ne de Bataille.
b.rise_or_fall = Infiltrer le Palais des Gel\u00e9es royaux et vaincre les foules de gel\u00e9\
  es qui servent le Royal Jelly ne sera pas une t\u00e2che facile. Il est conseill\u00e9 de trouver l'un des \u00abAr\u00e8ne de Bataille\u00bb dans les Rouages et d\u00e9terminer si vos \u00e9\
  quipements suffissent pour le d\u00e9fi de faire face \u00e0 un tel nombre de gel\u00e9es sauvages. \n\
  \n\
  Spiral HQ a trouv\u00e9 l'un de ces ar\u00e9nas myst\u00e9rieux qui semble \u00eatre rempli \
  de toutes sortes de gladiateurs g\u00e9latineux qui recherchent une bataille! Donnez-les ce \
  qu'ils veulent.

m.hall_of_heroes_2 = Panth\u00e9on des H\u00e9ros
o.hall_of_heroes_2 = Visitez le Panth\u00e9on des H\u00e9ros en portant les \u00e9quipements de 3 \u00c9\
  toiles ou plus et recevez une certification
b.hall_of_heroes_2 = Afin de se risquer encore plus profondement dans les Rouages vous devez \
  visiter le Panth\u00e9on des H\u00e9ros une fois de plus et parler avec Lieutenant Barrus \
  pour recevoir votre certificat 3 \u00e9toiles.

#Conversation (used at in the hall):
m.hall_of_heroes_2_2a = Bienvenue, {0}. C'est bien de vous revoir.\n\
  \n\
  Maintenant, {0}, pour votre Certification de 3 \u00c9toiles vous avez besoin d'\u00eatre \u00e9quip\u00e9 \
  avec une armure, une casque, un bouclier, et une arme avec une minimum de 3 \u00e9toiles ou plus.

m.hall_of_heroes_2_3a = F\u00e9licitations {0}, vous avez les exigences n\u00e9cessaires et re\u00e7\
  u votre Certification de 3 \u00c9toiles. Prenez l'ascenseur \u00e0 l'arri\u00e8re de moi pour compl\u00e9ter votre mission.

m.hall_of_heroes_2_3b = Je suis d\u00e9sol\u00e9 {0}, mais vous n'avez pas les exigences n\u00e9\
  cessaires. Veuillez me parler quand vous \u00eates \u00e9quip\u00e9 avec une armure, une \
  casque, un bouclier, et une arme de 3 \u00e9toiles ou plus.

m.sovereign_slime = Le Blobeux Souverain
o.sovereign_slime = Infiltrez le Palais des gel\u00e9es royaux et retrouvez la source d'\u00e9nergie myst\u00e9rieuse
b.sovereign_slime = On croit que la source de l'indication d'\u00e9nergie est trouv\u00e9e dans \
  quelque part au Palais des gel\u00e9es royaux, le berceau de l'un des membres aristocratique \
  de blobeux, le Royal Jelly.\n\
  \n\
  Ne sous-estimez pas la force de ces blobeux. Si vous confrontez ce roi col\u00e9rique, vous \
  serez sage de vous \u00e9quiper avec les \u00e9quipements appropri\u00e9s et d'\u00eatre \
  soutenu par un escadron complet avec des chevaliers avec exp\u00e9rience.\n\
  \n\
  Il est conseill\u00e9 de vous \u00e9quiper avec l'\u00e9quipement r\u00e9sistant au dommage per\u00e7\
  ant et d'avoir les armes ombreuses avant de vous d\u00e9ployer au Palais des Gel\u00e9es royaux!

# RANK 6-1

m.explosive_plot = Une Conspiration Explosive
o.explosive_plot = Contactez Agent de Reconnaissance Kora par comlink
b.explosive_plot = Les Chevaliers \u00c9claireurs croient qu'ils ont d\u00e9couvert un complot \
  pour d\u00e9truire Haven! Comme un Chevalier \u00c9lite, vous avez \u00e9t\u00e9 s\u00e9lectionn\u00e9 \
  par Spiral HQ pour vous occuper de cette affaire. Contactez Agent de Reconnaissance Kora pour \
  des d\u00e9tails.

m.explosive_plot_1a = F\u00e9licitations, {0}! Chevalier d'\u00e9lite, hein? Wow, vous devez \u00eatre fier!

r.explosive_plot_1a = Merci Kora. Je suis redevable de tout cela \u00e0 votre intel.

m.explosive_plot_2a = Oh {0}, c'est juste mon boulot. Et \u00e0 ce propos, j'ai un boulot pour \
  vous!

r.explosive_plot_2a = Je suis pr\u00eat.

m.explosive_plot_3a = Les renseignements r\u00e9cemment rapport\u00e9s par les chevaliers de \
  reconnaissance sugg\u00e8rent que les gremlins planifient quelque chose important. Nous \
  croyons qu'ils d\u00e9veloppent un genre d'arme surnomm\u00e9 \u00abProject R\u00bb qui \
  visera Haven! Spiral HQ et m\u00eame les \u00c9trangers vous demandent d'investiguer \
  l'affaire, suite \u00e0 votre performance dans le Palais des Gel\u00e9es royaux.

r.explosive_plot_3a = C'est parce que les \u00c9trangers nous ont abr\u00eet\u00e9s qu'ils sont \
  en danger...

m.explosive_plot_4a = Oui, je ressens la m\u00eame chose. C'est notre responsabilit\u00e9 de \
  terminer cette menace gremlin aussit\u00f4t que possible.. \n\
  \n\
  J'ai organis\u00e9 quelques missions qui vous m\u00eaneront aux endroits o\u00f9 les gremlins \
  semblent rassembler des ressources pour le Project R. Votre briefing devrait tout expliquer.

r.explosive_plot_4a = Affirmatif, Kora. Je pars!

m.explosive_plot_5a = Pendant ce temps-l\u00e0, nous ferons l'analyse sur cet appareil bizarre \
  que vous avez trouv\u00e9 dans le Palais de blobeux royaux. S'il est li\u00e9 \u00e0 \
  l'Artifice, nous le saurons tout de suite!\n\
  \n\
  Bonne chance, {0}.

r.explosive_plot_5a = Terminer la conversation.

m.axes_of_evil = Haches de la haine
o.axes_of_evil = Arr\u00eatez l'exploitation foresti\u00e8re des gremlins dans la Jigsaw Valley
b.axes_of_evil = Une exploitation foresti\u00e8re des gremlins a \u00e9t\u00e9 d\u00e9couverte \
  dans les niveaux appel\u00e9s \u00abVall\u00e9e Casse-t\u00eate\u00bb Ces \u00eeles bizarrement grav\u00e9\
  s sont le berceau des arbres plus bizarres lequel les gremlins sont d\u00e9termin\u00e9s de les raser.\n\
  \n\
  Spiral HQ croient que les gremlins utilisent les bois de charpente comme ressources pour la d\u00e9\
  veloppement de Projet R, et il voudrait que vous entrez le Jigsaw Valley et arr\u00eatez \
  l'exploitation foresti\u00e8re.

m.plan_of_attack = Plan d'attaque
o.plan_of_attack = R\u00e9cup\u00e9rez les sch\u00e9mas gremlin dans la laboratoire secr\u00e8te des tests
b.plan_of_attack = Au fond d'une caverne toxique, on se trouve un lab cach\u00e9, lequel les \
  gremlins utilisent comme un lieu des tests pour les composants de Projet R. L'un de ces \
  composants en d\u00e9veloppement est signal\u00e9 d'avoir sch\u00e9matiques pour le projet \
  tout pr\u00e8s.\n\
  \n\
  Si c'est vrai, il y aura surement un terminal de sorts pr\u00e8s de l'un des composants de \
  Projet R. Retrouvez le terminal et r\u00e9cup\u00e9rez les sch\u00e9matiques pour l'analyse. \
  Il est probable qu'on apprend plus sur la nature exacte de Projet R.

m.high_temperature_hostages = Otages \u00e0 haute temp\u00e9rature
o.high_temperature_hostages = D\u00e9livrez les chevaliers captur\u00e9s dans la Zone de d\u00e9construction enflamm\u00e9e
b.high_temperature_hostages = Les \u00c9claireurs ont signal\u00e9 une \u00e9quipe de d\u00e9\
  construction gremlin qui d\u00e9mant\u00e8le une portion des Rouages afin de g\u00e9n\u00e9\
  rer les bouts des ressources pour les utiliser dans le Projet R. En utilisant des soudants \
  torches puissantes, ils incendient cette place sur le sol, au sens propre.\n\
  \n\
  L'un des escadrons, lequel est le responsable pour l'investigation sur site, a disparu et on \
  croit que l'\u00e9quipe est gard\u00e9 en captivit\u00e9 \u00e0 la site.\n\
  \n\
  Infiltrez la zone d\u00e9construction enflamm\u00e9e et sauvez les chevaliers captifs. Soyez \
  prudent car on dit que l'\u00e9quipe de d\u00e9construction a une m\u00e9canique puissante de s\u00e9curit\u00e9, cach\u00e9 \
  sur quelque part de la site.

# RANK 6-2
m.target_acquired = Cible Acquise
o.target_acquired = Contactez Agent de Reconnaissance Kora par comlink
b.target_acquired = Apr\u00e8s avoir analys\u00e9 les sch\u00e9matiques que vous aviez r\u00e9cup\u00e9r\u00e9\
  s de la laboratoire gremlin, Spiral HQ comprend maintenant la nature de Projet R et sa \
  location dans une facilit\u00e9 des munitions de gremlin. Spiral HQ vous demande d'entrer \
  cette facilit\u00e9 et d\u00e9truire Projet R avant son usage sur Haven. Parlez avec Agent de \
  Reconnaissance Kora pour tous les d\u00e9tails.

m.target_acquired_1a = Bonjour {0}, j'esp\u00e8re que vous soyez pr\u00eat \u00e0 vous jeter \
  dans la gueule du loup un fois de plus!

r.target_acquired_1a = J'entends que Spiral HQ \u00e0 devin\u00e9 la nature de Project R.

m.target_acquired_2a = Oui. Le Project R semble \u00eatre deux armes massives nomm\u00e9es les jumeaux \u00abRoarmulus\u00bb. Con\u00e7\
  u par un membre de l'Ordre Incarnat, les Roarmulus Twins semblent \u00eatre des immenses \
  cannons que les Gremlins ont l'intention de remonter dans les Rouages jusqu'\u00e0 l'Arcade de Haven!\n\
  \n\
  Selon les sch\u00e9mas, leur pouvoir d\u00e9passe de loin les armes Gremlin standards et \
  pourrait d\u00e9vaster Haven, Spiral HQ, et les \u00c9trangers s'ils r\u00e9ussissent.

r.target_acquired_2a = Si vous savez o\u00f9 le trouver, je l'arr\u00eaterai.

m.target_acquired_3a = Nous avons localis\u00e9 son emplacement. C'est dans le niveau plus fond \
  dans un facilit\u00e9 connu comme \u00abl'Usine des munitions Ironclaw\u00bb. Cette usine est utilis\u00e9 \
  pour la production des armes gremlins et elle est extr\u00eamement dangereuse, m\u00eame aux \
  gremlins qui travaillent l\u00e0.\n\
  \n\
  Vous devez vous pr\u00e9parer pour la r\u00e9sistance acharn\u00e9e par des construits march\u00e9 par choc et gremlins.

r.target_acquired_3a = Je serez s\u00fbr de mettre la main sur les \u00e9quipements appropri\u00e9s pour ce travail.

m.target_acquired_4a = Il y a un chose de plus- il semble que vous n'\u00eates pas le seul \
  chevalier d'entrer l'Usine des munitions Ironclaw. Nous avons d\u00e9tect\u00e9 une autre \
  module de reconnaissance d'Alpha Squad dans quelque part de cette usine. Veuillez essayer de \
  la r\u00e9cup\u00e9rer. J'esp\u00e8re que cet analyse prouve que l'escadron d'Euclid est \
  sorti en vie...

r.target_acquired_4a = Affirmatif, Kora.

m.whipping_mishandling = Exp\u00e9dition et Mal\u00e9diction
o.whipping_mishandling = Livrez les provisions \u00e0 l'\u00e9quipe de recherche dans la ville \
  endiabl\u00e9e de Sol' Fork.
b.whipping_mishandling = Apr\u00e8s les Chevaliers \u00c9claireurs ont d\u00e9couvert une ville \
  diabolique connu sous le nom Sol' Fork, Spiral HQ a d\u00e9ploy\u00e9 une \u00e9quipe de \
  recherche de se poster au coeur de la ville et \u00e9tudier les devilites \u00e0 l'int\u00e9\
  rieur. Ses conclusions sont devenues la base de notre compr\u00e9hension de la culture \
  devilite et ses motifs pour travailler avec les gremlins.\n\
  \n\
  Cette \u00e9quipe de recherche ont absolument besoin des provisions afin de continuer \
  travailler sur place. Il sera d'une grande aide \u00e0 la recherche d'avoir un escadron \
  entrer la ville et livrer les provisions n\u00e9cessaires.

m.sewer_stash = Planque dans les \u00e9gouts
o.sewer_stash = D\u00e9truisez les engins de guerre cach\u00e9s par les gremlins dans les d\u00e9p\u00f4ts des d\u00e9chets
b.sewer_stash = Il para\u00eet que l'Usine des munitions Ironclaw n'est pas la seule place o\u00f9 \
  les gremlins entreposent les armes puissantes. Intel sugg\u00e8re que lorsqu'elle est fabriqu\u00e9e, les armes sont d\u00e9m\u00e9nag\u00e9\
  es d'Usine des munitions Ironclaw et sont mises en r\u00e9serve dans les caches secr\u00e8tes \
  partout dans les Rouages.\n\
  \n\
  L'une de ces caches a \u00e9t\u00e9 d\u00e9couverte dans un syst\u00e8me de d\u00e9chets dans \
  les Rouages. Il ne serait pas joli d'y aller, mais l'\u00e9limination de ces armes mises en r\u00e9serve dans les d\u00e9chets peut aboutir \u00e0 \
  moins des victimes au futur.

m.built_to_destroy = Construit pour d\u00e9truire!
o.built_to_destroy = D\u00e9mantelez les Roarmulus Twins dans l'Usine des munitions Ironclaw et \
  r\u00e9cup\u00e9rez l'artefact
b.built_to_destroy = Une fois connu comme 'Projet R' \u00e0 Spiral HQ, les Roarmulus Twins sont \
  identifi\u00e9s comme une arme d'une grande puissance, construit par les gremlins pour la \
  destruction de Haven. Entrepos\u00e9es dans le c\u0153ur d'Usine des munitions Ironclaw, ces \
  armes sont prot\u00e9g\u00e9es par des hordes de m\u00e9caniques \u00e9lectriques et des \
  gremlins. Cette usine-ci est une hasard dangereuse et explosive aussi!\n\
  \n\
  Spiral HQ voudrait que vous fermez les Roarmulus Twins ainsi que r\u00e9cup\u00e9rez le \
  module de reconnaissance d'Alpha Squad. On croit que le module s'est trouv\u00e9 dans quelque \
  part de l'usine.\n\
  \n\
  Il est conseill\u00e9 de former un escadron complet avant de vous d\u00e9ployer.

n.built_to_destroy = Terminal d'Ordre Incarnat
m.built_to_destroy_1a = "Le Neuf voit le tout, entends le tout. Ob\u00e9issez la Loi en fer."
r.built_to_destroy_1a = Lire les Directives d'Ordre Incarnat.
r.built_to_destroy_1b = Lire les Transmissions de l'Ordre Incarnat.
r.built_to_destroy_1c = Partir du terminal.

m.built_to_destroy_2a = Directives de l'Ordre Incarnat:\n\
  \n\
  - C'est le DEVOIR de chaque Gremlin de repousser les intrus en m\u00e9tal!\n\
  \n\
  - Chaque Gremlin doit travailler pour d\u00e9truire Haven. Cradle appartient de nous!\n\
  \n\
  - Chaque Gremlin doit rester LOYAL \u00e0 King Tinkinzar et \u00e0 l'Ordre Incarnat. La Loi \
  de fer doit \u00eatre ob\u00e9ie!
r.built_to_destroy_2a = Retourner

m.built_to_destroy_2b = Transmission:\n\
  \n\
  \u00abIls continuent d'avancer et contrarier nos plans! Comment d\u00e9couvraient-ils le \
  Projet R? Pourquoi n'avait-il aucun avertissement de l'attaque?\u00bb\n\
  \n\
  \u00abHerex et ses laquais \u00e9taient cens\u00e9s faire de l'espionnage mais ils sont tous \
  disparus comme des poltrons.\u00bb\n\
  \n\
  \u00abD\u00e9fier la Loi de fer c'est d\u00e9fier l'Ordre! Traquez le tra\u00eetre. Herex r\u00e9pondra au \u00e9chec.\u00bb

m.hall_of_heroes_3 = Panth\u00e9on des H\u00e9ros
o.hall_of_heroes_3 = Visitez le Panth\u00e9on des H\u00e9ros en portant l'\u00e9quipement de 4 \u00c9\
  toiles ou plus et recevez une certification
b.hall_of_heroes_3 = Afin de risquer plus fond dans les Rouages, il vous faut visiter le Panth\u00e9on des Heros et parler \u00e0 \
  Lieutenant Barrus pour recevoir votre Certification de 4 \u00c9toiles.

#Conversation (used at in the hall):
m.hall_of_heroes_3_2a = Bienvenue, {0}. C'est bien de vous revoir.\n\
  \n\
  Maintenant, {0}, pour votre Certification de 4 \u00c9toiles vous avez besoin d'\u00eatre \u00e9quip\u00e9 \
  avec une armure, une casque, un bouclier, et une arme avec une minimum de 4 \u00e9toiles ou plus.

m.hall_of_heroes_3_3a = F\u00e9licitations {0}, vous avez les exigences n\u00e9cessaires et re\u00e7\
  u votre Certification de 4 \u00c9toiles. Prenez l'ascenseur \u00e0 l'arri\u00e8re de moi pour compl\u00e9ter votre mission.

m.hall_of_heroes_3_3b = Je suis d\u00e9sol\u00e9 {0}, mais vous n'avez pas les exigences n\u00e9\
  cessaires. Veuillez me parler quand vous \u00eates \u00e9quip\u00e9 avec une armure, une \
  casque, un bouclier et une arme de 4 \u00e9toiles ou plus.

# RANK 7-1
m.darkest_depths = Profondeur P\u00e9nombre
o.darkest_depths = Contactez Agent de Reconnaissance Kora par comlink
b.darkest_depths = Apr\u00e8s avoir vaincu les Roarmulus Twins et r\u00e9cup\u00e9r\u00e9 le \
  module de reconnaissance d'Alpha Squad, c'est l'heure de se pr\u00e9senter \u00e0 Agent de \
  Reconnaissance Kora pour obtenir un rapport sur l'analyse de la module et l'information \u00e0 \
  propos de votre nouveau acc\u00e8s aux profondeurs plus fonds des Rouages.

m.darkest_depths_1a = {0}, vous avez vaincu les Roarmulus Twins et vous a sauv\u00e9 Haven! De la part des \u00c9\
  trangers et de tous les Spiral Knights au Haven, merci! Je vois pourquoi vous \u00eates promu au D\u00e9fenseur, vous vraiment m\u00e9ritez cet honneur.

r.darkest_depths_1a = Merci Kora, je suis content comme tous les gens que Haven est hors de \
  danger une fois plus.

m.darkest_depths_2a = Oui, c'est comme une deuxi\u00e8me maison pour nous, non? Comme nous sont \u00e0 notre place, c'est \u00e9trange.

r.darkest_depths_2a = Qu'est-ce que vous voulez dire?

m.darkest_depths_3a = Ce n'est qu'un sentiment. Quelques chevaliers m'ont dit qu'il le \
  partagent, pourtant: l'impression que nous sommes chez nous ici, comme si peut-\u00eatre la \
  collision avait une raison.\n\
  \n\
  Mais c'est impossible, hein? De toute fa\u00e7on, je radote. Revenons au mission!

r.darkest_depths_3a = Qu'est-ce qui m'attend, Kora?

m.darkest_depths_4a = Comme D\u00e9fenseur, vous pouvez maintenant accepter des missions dans \
  le troisi\u00e8me \u00e9tage des Rouages. Celles-l\u00e0 sont les profondeurs les plus \
  profonds et dangereuses. \n\
  \n\
  Peut-\u00eatre, si vous survivez, vous trouverez l'Alpha Squad. Je ne sais pas.

r.darkest_depths_4a = Je r\u00e9ussirai, vous verrez.

m.darkest_depths_5a = Commen\u00e7ons, alors. Maintenant que vous avez arr\u00eat\u00e9 la menace imm\u00e9\
  diate pour Haven, Spiral HQ esp\u00e8re de traquer la piste d'Artifice. \u00c7a ne serait pas \
  facile. Heureusement, je vous ai pr\u00e9par\u00e9 des missions qui vous seront utiles si \
  vous voulez survivre dans les profondeurs obscures qui vous attendent. Bonne chance, {0}.

r.darkest_depths_5a = Merci Kora. Je ferais mon mieux.

m.alchemy_mastery = Ma\u00eetre Alchimie
o.alchemy_mastery = D\u00e9couvrez la capacit\u00e9 d'alchimie au niveau ma\u00eetre
b.alchemy_mastery = Dans le Bazar de Haven, Bosco a plus de renseignements sur le plus haut \
  niveau d'alchimie possible. Le niveau ma\u00eetre d'alchimie sera important pour votre survie \
  si vous planifiez d'arriver au Core.

m.alchemy_mastery_1a = Bonjour encore un fois, {0}. Je vois que vous vous rapprochez du Core et \
  que vous avez besoin d'un arsenal qui vous gardera vivant.

r.alchemy_mastery_1a = Je pourrais toujours utiliser une bonne \u00e9p\u00e9e.

m.alchemy_mastery_2a = Une bonne \u00e9p\u00e9e c'est, euh, bonne et tout \u00e7a, mais que \
  pensez-vous d'une \u00e9p\u00e9e super? Si vous voulez des armes pour secouer les cieux, \
  l'alchimie de niveau ma\u00eetre est ce que vous cherchez.\n\
  \n\
  Un fois augment\u00e9 \u00e0 son niveau 4 ou 5 \u00e9toiles, vous d\u00e9voilerez le \
  potentiel d'un item.

r.alchemy_mastery_2a = Impressif.

m.alchemy_mastery_3a = Au niveau 4 et 5 \u00e9toiles, votre armure vous offrera le meilleur \
  protection, et les armes frapperont aussi fortement que possible. Si vous voulez rester en \
  vie l\u00e0 o\u00f9 vous vous dirigez, vous devez commencer de b\u00e2tir un arsenal d'\u00e9quipements 4 et 5 \u00e9toiles.\n\
  \n\
  Souvenez-vous - quand les items atteignent leur cinqui\u00e8me \u00e9toile, ils ont plus de \
  chemins que jamais. Vos options de combat sont sur le point de multiplier. Planifiez votre \
  arsenal avec souci

r.alchemy_mastery_3a = Je le ferai, Bosco. Merci.

m.alchemy_mastery_4a = Avant de vous partir, voici quelques mat\u00e9riels pour commencer. \
  Bonne chance.

r.alchemy_mastery_4a = Terminer la converation.

# RANK 7-2
m.best_of_beast = Les Meilleurs des Meutes
o.best_of_beast = Apprenez plus au sujet des plus puissants monstres b\u00eates et gel\u00e9es.
b.best_of_beast = Apr\u00e8s une promotion r\u00e9cente, Biotech Hahn a gagn\u00e9 le titre de \u00abChef Biotech Chef\u00bb. On l'a inform\u00e9 de vos r\u00e9\
  cents accomplissements et il veut vous donner un r\u00e9sum\u00e9 de ce que vous pouvez \
  attendre des familles de monstres b\u00eates et gel\u00e9es en vous rapprochant le Core.

m.best_of_beast_1a = Bonjour {0}, c'est bon de vous voir encore sur vos pieds. D'habitude, ce \
  ne sera pas l'affaire d'un Chef Biotech, mais j'ai demand\u00e9 d'\u00eatre celui qui vous \
  informe des dangers qui vous attendent dans le 3e niveau des Rouages. Je ne veux pas entendre \
  que les monstres vous ont mang\u00e9 parce qu'un Biotech junior vous a mal inform\u00e9.

r.best_of_beast_1a = Ah, merci Hahn, c'est presque comme-

m.best_of_beast_2a = Eh bien, commen\u00e7ons.\n\
  \n\
  Le 3e niveau est le niveau plus proche du Core et, comme les armes r\u00e9agissent \u00e0 son \
  pouvoir, les monstres r\u00e9agissent au pouvoir aussi. Plusieurs d'entre eux adoptent des \
  nouvelles formes et sont consid\u00e9r\u00e9s les plus dangereux. Pr\u00e9parez-vous avant de \
  commencer chaque mission.

r.best_of_beast_2a = Je comprends que je vais confronter surtout des monstres b\u00eates et \
  blobeux dans mes missions \u00e0 venir.

m.best_of_beast_3a = Si vous vous trouvez face \u00e0 face avec des monstres b\u00eates ou \
  blobeux dans le 3e niveau, rappelez-vous qu'ils sont capables d'infliger des dommages \
  purement per\u00e7ants. Seulement les meilleures armures r\u00e9sistantes aux dommages per\u00e7ants vous prot\u00e8geront face \u00e0 ces puissants pr\u00e9dateurs per\u00e7ants. \n\
  \n\
  Une fois que votre mission est accomplie, on se parlera encore. Courage, {0}.

r.best_of_beast_3a = Affirmatif, Hahn, \u00e0 bient\u00f4t.

m.in_cold_blood = De Sang-froid
o.in_cold_blood = Sauvez la brigade perdue avant qu'ils ne deviennent le d\u00eener pour des l\u00e9zards l\u00e9taux
b.in_cold_blood = Quelque chose a vraiment agac\u00e9 les chromalisks dans les niveaux sous la \
  ville d'Emberlight. Spiral HQ a envoy\u00e9 un escadron pour l'examiner puis ils ne pouvait \
  plus \u00eatre d\u00e9tect\u00e9. Maintenant ils ont envoy\u00e9 un signal de d\u00e9tresse en d\u00e9\
  clarant qu'ils sont accul\u00e9s par des chromalisks de toutes sortes de vari\u00e9t\u00e9s.\n\
  \n\
  Les Biotechs \u00e9mettent l'hypoth\u00e8se que les chromalisks sont inqui\u00e9t\u00e9s \u00e0 cause de leur proximit\u00e9 \
  au Core. Les autres croient que c'est la saison des amours. Sans se soucier de la raison, \
  l'escadron a besoin de sauvetage avant qu'ils ne rencontrent leur fin par des l\u00e9zards!

m.vicious_viscous = Violent et vicieux
o.vicious_viscous = Faites preuve de votre valeur contre une l\u00e9gion de monstres \
  puissantement per\u00e7antes.
b.vicious_viscous = Spiral HQ vous demande d'investiguer les niveaux des Rouages o\u00f9 \
  demeurent les monstres b\u00eate et gel\u00e9e les plus puissants. En explorant ces niveaux \
  et en transf\u00e8rant vos donn\u00e9es de combat \u00e0 Spiral HQ, tous les chevaliers \
  profiteront de vos enqu\u00eates dangereux. \n\
  \n\
  On vous conseille de vous \u00e9quiper avec des \u00e9quipements r\u00e9sistants aux dommages \
  per\u00e7ants et des armes qui infligent des dommages d'ombre!

m.monstrous_research_6 = Cherchages Monstrueux
o.monstrous_research_6 = Rapportez les mat\u00e9riaux sp\u00e9cifi\u00e9s pour la recherche.
b.monstrous_research_6 = Apr\u00e8s avoir confront\u00e9 les m\u00e2choires des wolvers f\u00e9roces, \u00e9vit\u00e9 \
  les piques des blobeux d\u00e9velopp\u00e9s et m\u00eame les r\u00e9gurgitations viles de \
  virulisks, vous avez sans doute rassembl\u00e9 des \u00e9chantillons de ces rencontres qui \
  seront utiles pour l'\u00e9quipe de recherche au Spiral HQ.

# RANK 7-3
m.creators_and_created = Les Cr\u00e9ateurs et les Cr\u00e9es
o.creators_and_created = Apprenez sur les m\u00e9caniques puissantes et monstres gremlins
b.creators_and_created = Afin d'\u00eatre bien pr\u00e9par\u00e9 pour les d\u00e9fis, Chief \
  Biotech Hahn vous demande de le contacter avant de prendre les nouvelles missions disponibles \
  pour vous.

m.creators_and_created_1a = Bonjour {0}, il semble que vous ayez eu peu de probl\u00e8mes avec \
  les hordes suintants, s\u00fbrement gr\u00e2ce \u00e0 une bonne \u00e9ducation au sujet de \
  leurs comportements avant la mission.

r.creators_and_created_1a = \u00c7a et une arsenal solide, ouais.

m.creators_and_created_2a = La puissance de feu est limit\u00e9e, {0}. Je veux dire que les \
  gremlins tout seuls sont sans doute forts, leur force agrandie avec la population, mais ces \
  petits g\u00e9nies poilus cherchent aussi \u00e0 s'augmenter avec une arm\u00e9e de m\u00e9caniques.

r.creators_and_created_2a = Alors, tous les m\u00e9caniques dans les Rouages ont \u00e9t\u00e9 cr\u00e9\u00e9es par les gremlins?

m.creators_and_created_3a = Pas tous, mais la majorit\u00e9 sont crues d'\u00eatre construites \u00e0 \
  partir des dessins gremlins, oui. Nous pensons que la plupart furent con\u00e7ues \
  originalement pendant la construction des Rouages. Quelques-uns sont encore contr\u00f4l\u00e9\
  es par les gremlins, des autres, personne ne les contr\u00f4le et la reste sont devenues \
  quelque chose d'autre.

r.creators_and_created_3a = Que voulez-vous dire?

m.creators_and_created_4a = Quelques chevaliers ont rencontr\u00e9 des m\u00e9caniques \
  non-hostiles qu'ils jurent se sont comport\u00e9es comme des vraies cr\u00e9atures pensantes. \
  Mais c'est difficile \u00e0 croire. Les gremlins sont dou\u00e9s, mais dou\u00e9s dans l'ing\u00e9\
  nierie direct qui fait le boulot et peu d'autre. La force brute, quoi.\n\
  \n\
  La vie artificielle? C'est quelque chose de diff\u00e9rente.

r.creators_and_created_4a = Parlons des m\u00e9caniques hostiles que je suis sur de recontrer.

m.creators_and_created_5a = D'accord.  Spiral HQ m'a inform\u00e9 que vous ferez probablement \
  face \u00e0 des hordes de gremlins et m\u00e9caniques dans cette mission. Souvenez-vous que, \
  dans le 3e niveau, ces monstres peuvent infliger des dommages purement \u00e9l\u00e9\
  mentaires. Soyez certain de porter les bons \u00e9quipements.

r.creators_and_created_5a = Bien s\u00fbr. \u00c0 bient\u00f4t, Hahn.

m.beyond_axes_of_evil = Au-del\u00e0 des Haches de la Haine
o.beyond_axes_of_evil = \u00c9crasez l'exploitation foresti\u00e8re des gremlins dans la Vall\u00e9e Casse-t\u00eate
b.beyond_axes_of_evil = Malgr\u00e9 vos efforts, les gremlins ont reconstruit leur op\u00e9ration foresti\u00e8re dans la Vall\u00e9e Casse-t\u00ea\
  te afin de munir leurs usines de munitions avec des ressources. \u00c9tant donn\u00e9 les r\u00e9\
  sultats de leur dernier projet, les Roarmulus Twins, Spiral HQ vous demande de terminer leur \
  destruction \u00e9cologique avant qu'il ne deviennent plus grave encore!

m.spark_roar = \u00c9tincelle et rugissement
o.spark_roar = Prouvez votre bravoure contre une l\u00e9gion de monstres d'\u00e9lite \u00e9l\u00e9mentaires
b.spark_roar = Une \u00e9tonnement grande concentration de m\u00e9caniques ont \u00e9t\u00e9 d\u00e9couvertes, gardant une r\u00e9\
  gion de Rouages de laquelle Spiral HQ croit est une cachette de l'Ordre Incarnat. \
  Contrairement aux d'autres monstres, il semble que des m\u00e9caniques ne soient pas capables \
  de se reproduire, alors si un m\u00e9canique est d\u00e9construit, c'est une bosse permanente \
  dans ses nombres. \u00c7a serait une t\u00e2che qui vaut le temps m\u00eame s'il y a aucune \
  influence de l'Ordre Incarnat.\n\
  \n\
  Spiral HQ vous demande d'entrer ces niveaux, enqu\u00eater sur la cachette probable et \u00e9liminer la menace m\u00e9canique.\n\
  \n\
  Il est conseill\u00e9 de s'\u00e9quipper avec des \u00e9quipements r\u00e9sistants au dommage \u00e9l\u00e9\
  mentaire avec des armes ombreuses!

m.cryptic_coder_spark_roar = La Loi de fer est enfreinte!\n\
  L'Ordre Incarnat est Fausse!\n\
  Les Neuf sont aveugles, ils ne peuvent pas voir la V\u00e9rit\u00e9 qui reste dessous.\n\
  Les Neuf sont sourds, ils ne peuvent pas entendre la R\u00e9sonance qui se bat dans ce monde.\n\
  \n\
  Herex ne sert plus comme l'un de Neuf.\n\
  Seulement Herex voit et \u00e9coute la V\u00e9rit\u00e9. Seulement Herex pr\u00e9vaut.\n\
  Suivez Herex et votre vie sera \u00e9pargn\u00e9e.

m.monstrous_research_7 = Cherchages Monstrueux
o.monstrous_research_7 = Rapportez les mat\u00e9riaux sp\u00e9cifi\u00e9s pour la recherche.
b.monstrous_research_7 = Ayant lutt\u00e9 les Darkfang Clan gremlins d'\u00e9lite, \u00e9vit\u00e9 les coups \u00e9\
  crasants des lumbers et r\u00e9sist\u00e9 les explosions optiques des retrodes, vous avez \
  sans doute rassembl\u00e9 des \u00e9chantillons de ces rencontres qui seraient utiles aux \u00e9\
  quipes de la recherche au Spiral HQ.

# RANK 8-1
m.darkest_forces = Les Forces plus sombres
o.darkest_forces = Apprenez sur les monstres mort-vivants et d\u00e9mons plus puissants
b.darkest_forces = Apprenant que vos missions prochaines auront des monstres mort-vivants et d\u00e9\
  moneuses dans Niveau 3, Chief Biotech Hahn a vous demand\u00e9 de lui contacter avant de d\u00e9\
  ployer pour vos missions de nouveau.

m.darkest_forces_1a = {0}, je vois que vous \u00eates encore en un morceau et un D\u00e9fenseur \u00c9lite de plus! Bravo.\n\
  \n\
  J'ai eu une chance d'examiner vos donn\u00e9es de combat de votre derni\u00e8re mission et \
  elles sont tr\u00e8s int\u00e9ressantes. En particulier, les chevaliers m\u00e9cha semblent v\u00e9\
  ritablement capables de r\u00e9agir \u00e0 vos attaques comme s'ils improvisent. Mais c'est \
  encore impossible d'\u00eatre certain. \n\
  \n\
  En tout cas, \u00e7a n'a rien \u00e0 faire avec les informations que je vous pr\u00e9sente.

r.darkest_forces_1a = Ouais, je renconterai des diables et des morts-vivants dans ma prochaine \
  mission. Youpi.

m.darkest_forces_2a = ...Youpi? Vous \u00eates bizarrement enthousiaste. Les diables et \
  morts-vivants du troisi\u00e8me niveau ne sont pas \u00e0 d\u00e9daigner, en fait ils sont \
  parmi les pires cr\u00e9atures \u00e0 trouver si proche du Core. \n\
  \n\
  La g\u00e9rance Devilite semble \u00eatre le pire dans ces profondeurs, donc \u00e7a aboutit \
  aux devilites tr\u00e8s violents.

r.darkest_forces_2a = Ils ne sont pas vraiment complaisants, pour commencer...

m.darkest_forces_3a = Exactement, et ils sont pires maintenant. Et c'est la m\u00eame chose \
  avec les mort-vivants. Vous trouverez que les howlitzers devient plus ennuyeux avec ses \
  fusillades. Vous pouvez dire que c'est \u00e0 t\u00eate chercheuse, litt\u00e9ralement.\n\
  \n\
  Enfin, pr\u00e9parez-vous pour des d\u00e9mons et mort-vivants de vous attaquer avec le \
  dommage de pure ombre. Comme toujours, choisissez les bons \u00e9quipements pour ce travail \
  si vous voulez vivre assez longtemps pour me parler de nouveau.

r.darkest_forces_3a = Disons que, je ne voudrais pas le manquer.

m.darkest_forces_4a = Oui, je ne peux pas penser de plus grande trag\u00e9die. Bonne chance, {0}.

r.darkest_forces_4a = Terminer la conversation.

m.return_of_ur = Le Retour d'Ur
o.return_of_ur = Arr\u00eatez les devilites de convoquer une arm\u00e9e des guerriers trojans \
  cauchemardesques
b.return_of_ur = Un escadron de Reconnaissance a rapport\u00e9 qu'au fond d'une ville \
  diabolique, des devilites essayent de convoquer une l\u00e9gion de trojan guerriers \
  puissants. Bas\u00e9 sur l'info d'une note de service \u00e9crite par une devilite, les \
  trojans sont connus comme le \u00abL\u00e9gion d'Ur\u00bb, et qu'il y avait des milliers de \
  trojans une fois dans le pass\u00e9. Bizarrement, la note de service a indiqu\u00e9 que la L\u00e9gion d'Ur \u00e9tait bouch\u00e9e dans la p\u00e8gre et qu'une autre m\u00e9thode serait n\u00e9cessaire de les ramener.\n\
  \n\
  N'importe quelle m\u00e9thode les devilites utilisent pour ramener quelques milliers de \
  trojans aux Rouages, ils doivent \u00eatre emp\u00each\u00e9s. Infiltrez leur ville et arr\u00eatez l'arm\u00e9e d\u00e9\
  moniaque avant qu'ils ne soient impossibles \u00e0 arr\u00eater!

m.weight_of_darkness = Pesanteur de Noirceur
o.weight_of_darkness = Prouvez votre bravoure contre une l\u00e9gion de monstres supr\u00eames et ombreuses
b.weight_of_darkness = On sp\u00e9cule que tous les d\u00e9mons dans les Rouages ont travers\u00e9 d'une dimension appel\u00e9e le p\u00e8\
  gre. Pendant que nous ne savons pas comment ils ont travers\u00e9 ni leurs motifs sur Cradle, \
  les donn\u00e9es rassembl\u00e9es de villes infernales indiquent qu'ils sont \u00e9chou\u00e9\
  s sur Cradle, comme nous.\n\
  \n\
  Au contraire, les mort-vivants restent un myst\u00e8re. Pourquoi les esprits retournent au \
  domaine mat\u00e9riel, c'est inconnu, mais c'est clair qu'un grand nombre des esprits dans \
  les Rouages sont venus d'autres mondes. \u00c9tant donn\u00e9 l'hostilit\u00e9 de ses cr\u00e9atures, la seule fa\u00e7on d'obtenir des donn\u00e9\
  es utiles est par l'interaction directe, comme au combat.\n\
  \n\
  Spiral HQ vous demande de rassembler des donn\u00e9es de combat sur les forts d\u00e9mons et \
  mort-vivants au niveau 3 de Rouages afin de mieux comprendre la nature de ces cr\u00e9atures.\n\
  \n\
  Il est conseill\u00e9 d'\u00e9quiper les \u00e9quipements r\u00e9sistants au dommage ombreux \
  et des armes elementaires et per\u00e7antes!

m.monstrous_research_8 = Cherchages Monstrueux
o.monstrous_research_8 = Rapportez les mat\u00e9riaux sp\u00e9cifi\u00e9s pour la recherche.
b.monstrous_research_8 = Ayant ravag\u00e9 les mort-vivants \u00e0 poussi\u00e8re, \u00e9chapp\u00e9 les m\u00e2\
  choires froides de grimalkins et repos\u00e9 victorieux dans une lutte contre une arm\u00e9e \
  des trojans, vous avez sans doute rassembl\u00e9 des \u00e9chantillons de ces rencontres qui \
  seront utiles pour les \u00e9quipes de la recherche au Spiral HQ.

# RANK 8-2
m.becoming_champion = Devenir un Champion
o.becoming_champion = Parlez \u00e0 Lieutenant Feron par Comlink
b.becoming_champion = Ayant \u00e9tendu de vos accomplissements et missions accomplis pour \
  Spiral HQ, Lieutenant Feron aimeriez de parler avec vous.

m.becoming_champion_1a = Bienvenue {0}, il fait longtemps depuis qu'on s'est rencontr\u00e9 apr\u00e8s votre arriv\u00e9\
  e du Camp de refuge. Vous avez beaucoup \u00e9volu\u00e9, devenant un D\u00e9fenseur \u00c9lite m\u00eame! \n\
  \n\
  Vous \u00eates un soldat dou\u00e9, {0}. Je n'ai aucun doute que vous serez bient\u00f4t un \
  Champion parmi les Spiral Knights et dans le centre du solution \u00e0 la myst\u00e8re du \
  Core, lequel nous permettra de restaurer le Skylark et retourner chez nous. Vous avez prouv\u00e9 \
  que vous avez ce qu'il faut pour combattre les l\u00e9gions de forces maudites qui r\u00f4dent sous la surface.

r.becoming_champion_1a = Je vais me battre jusqu'\u00e0 la fin, Lieutenant. On ne peut pas \
  perdre la mise.

m.becoming_champion_2a = J'ai entendu que Spiral HQ a pr\u00e9par\u00e9 quelques missions digne \
  d'un champion comme vous-m\u00eame. Mais afin de devenir l'un de ces champions, vous avez \
  besoin les \u00e9quipements appropri\u00e9s.\n\
  \n\
  Je vous confie des outils que vous n\u00e9cessitez pour devenir un Champion. Avec ces \
  recettes, vous pouvez fabriquer le meilleur niveau d'\u00e9quipement d'Ordre Spiral. Avec \
  ceci, vous pouvez porter l'armure d'Azure Guardian, brandir la force du Leviathan Blade et \
  confronter tout avec la protection d'Aegis.

r.becoming_champion_2a = Je suis honor\u00e9, Lieutenant.

m.becoming_champion_3a = Alors, utilisez-les avec l'honneur et laissez-les la peine de vous \
  prot\u00e9ger contre la fureur des ennemis innombrables que vous affronterez. Le Core que \
  nous cherchons, il y a quelque chose vraiment \u00e9pouvantable. Je sais qu'il peut nous \
  ramener chez nous, mais j'ai le pressentiment que nous sommes tellement incorrects.

r.becoming_champion_3a = Qu'est-ce que voulez-vous dire?

m.becoming_champion_4a = Je veux dire que le Core n'est pas une grande batterie qui fait \
  fonctionner ce monde, mais que cela et ce monde entier est une massive prison con\u00e7ue d'emp\u00ea\
  cher quelque chose de partir.\n\
  \n\
  Rappelez-vous les geo-scans de Cradle avant le crash- ils montrent que ce monde est quelque \
  chose compos\u00e9e de centaines des blocs massifs d'autres mondes, comme des plaques \
  d'armure. Apr\u00e8s, vous avez des Rouages, la chose la plus anormale que je n'ai jamais vu. \
  Un monde entier dont le but est d'arr\u00eater ceux qui veulent arriver \u00e0 son Core.

r.becoming_champion_4a = Je crois que vous \u00eates sur le piste, Lieutenant.

m.becoming_champion_5a = J'ai parl\u00e9 au Spiral HQ \u00e0 propos de ma th\u00e9orie pour un \
  certain temps et ils sont pr\u00eats \u00e0 faire une enqu\u00eate. Mais je ne crois pas que \
  je changerai ses avis sur l'ouvrage du Core. C'est la premi\u00e8re priorit\u00e9 en ce moment.\n\
  \n\
  Tout ce que je peux dire est... soyez prudent, {0}. Je pense que ce monde ait plus de \
  surprises pour nous.

r.becoming_champion_5a = Affirmatif.

m.vile_engine = La Machine vile
o.vile_engine = Localisez et d\u00e9truisez les g\u00e9n\u00e9rateurs de blobeux bizarres sous \
  la colonie de lichen
b.vile_engine = Quelque part au-dessous un niveau o\u00f9 des lichens habitent, il y a une \
  facilit\u00e9 \u00e9trange et d'origine inconnue. Cette facilit\u00e9 a l'air d'\u00eatre utilis\u00e9\
  e pour la production des monstres blobeux et toxiques. Les \u00abg\u00e9n\u00e9rateurs de blobeux\u00bb \
  sont capables de produire rapidement des monstres blobeux qui peuplent des niveaux \u00e0 proximit\u00e9.\n\
  \n\
  Des escadrons aux niveaux avoisinants ont d\u00e9j\u00e0 signal\u00e9 une grande nombre de \
  blobeux toxiques, en rendant les exp\u00e9ditions au-del\u00e0 de profondeur 23 impossible. \
  C'est temps qu'un chevalier de votre calibre de former un escadron pour infiltrer cette \
  facilit\u00e9 \u00e9trang\u00e8re et fermer la production de ces cr\u00e9atures viles.\n\
  \n\
  Tous les donn\u00e9es que vous pouvez rassembler sur l'origine des lichens seront tr\u00e8s pr\u00e9cieuses pour Spiral HQ.

m.rotting_metropolis = La M\u00e9tropole pourrissante
o.rotting_metropolis = D\u00e9couvrir le sort d'escadron perdu dans la ville toxique
b.rotting_metropolis = Il semble que ces g\u00e9n\u00e9rateurs de blobeux aient exist\u00e9 \
  plus longtemps que nous avons pens\u00e9, en suintant ses toxines viles dans les niveaux \u00e0 proximit\u00e9.\n\
  \n\
  Une ville moderne, comme \u00e0 laquelles les devilites habitent, ont l'air d'\u00eatre \
  envahie de ces toxines, et a \u00e9t\u00e9 abandonn\u00e9 par des devilites et des gremlins \
  en cons\u00e9quence. Maintenant, une l\u00e9gion de blobeux et mort-vivants hantent la place, \
  en s\u2019aigrissant dans les poisons qui persistent dans l'air. Un escadron qui a essay\u00e9 \
  de passer la ville a disparu. Puisque l'air est tr\u00e8s toxique, c'est urgent qu'une \u00e9quipe avec l'exp\u00e9\
  rience entre cette ville et sauver l'escadron. Autrement, il y a peu d'espoir pour \
  l'escadron.

m.great_escape = La Grande \u00c9vasion
o.great_escape = Infiltrez le prison de gremlin, lib\u00e9rez les chevaliers captives, et \
  faites une fuite
b.great_escape = Les Chevaliers \u00c9claireurs qui ont rassembl\u00e9 des info qui a r\u00e9v\u00e9l\u00e9 que le gremlin \u00abl'Ordre Incarnat\u00bb ont commenc\u00e9 \
  d'ordonner des gremlins de construire des prisons de fortune dans les Rouages o\u00f9 les \
  Spiral Knights sont pris et emprisonn\u00e9s. On croit que ces ordonnes arrivent \u00e0 r\u00e9\
  ponse de votre destruction des Roarmulus Twins.\n\
  \n\
  Plus des donn\u00e9es sugg\u00e8rent que ces prisons de fortune sont une solution temporaire \
  avant qu'une plus grande facilit\u00e9 puisse \u00eatre construit. Au contraire, Spiral HQ \
  n'a aucune intention de garder ces chevaliers emprisonn\u00e9s pour le d\u00e9couvrir.

m.great_escape_1a = Surpris! Il semble que vous ayez pris le leurre. C'est bon \u00e7a, parce \
  que j'avais besoin des sujets de test pour ma nouvelle invention.

m.great_escape_2a = Voil\u00e0! L'\u00c9tinsorcelle Deluxe 9000! Une triomphe dans l'ing\u00e9nierie gremlin!

m.great_escape_3a = La derni\u00e8re fois, un n'\u00e9tait pas assez... donc maintenant, il y \
  en a deux! DEUX! C'est brilliant!

m.great_escape_4a = Ah! Vous n'arriverez jamais \u00e0 m'attraper dans ma \u00abSalle d'invincibilit\u00e9\u00bb! Vous serez toujours pi\u00e9g\u00e9\
  s dans cette salle de contr\u00f4le! Heu... attendez. Je pense que j'aie oubli\u00e9 quelque chose...

m.hall_of_heroes_4 = Panth\u00e9on des H\u00e9ros
o.hall_of_heroes_4 = Visitez le Panth\u00e9on des H\u00e9ros en portant les \u00e9quipements de 5 \u00c9\
  toiles et recevez une certification
b.hall_of_heroes_4 = Afin de se risquer assez profonde pour arriver au Core, il vous faut \
  visiter le Panth\u00e9on des H\u00e9ros et parler avec Lieutenant Barrus pour recevoir votre \
  certificat 5 \u00e9toiles.

#Conversation (used at in the hall):
m.hall_of_heroes_4_2a = Bienvenue, {0}. Ravi de vous revoir. Peu de chevaliers r\u00e9ussissent \
  d'aller loin avec un arsenal d'une grande puissance.\n\
  \n\
  Maintenant, {0}, pour votre Certification de 5 \u00c9toiles vous avez besoin d'\u00eatre \u00e9quip\u00e9 \
  avec une armure, une casque, un bouclier et une arme avec une minimum de 5 \u00e9toiles ou plus.

m.hall_of_heroes_4_3a = F\u00e9licitations, vous avez les exigences n\u00e9cessaires et re\u00e7\
  u votre Certification de 5 \u00c9toiles. Prenez l'ascenseur \u00e0 l'arri\u00e8re de moi pour compl\u00e9ter votre mission.

m.hall_of_heroes_4_3b = Je suis d\u00e9sol\u00e9 {0}, mais vous n'avez pas les exigences n\u00e9\
  cessaires. Veuillez me parler quand vous \u00eates \u00e9quip\u00e9 avec une armure, une \
  casque, un bouclier et une arme de 5 \u00e9toiles ou plus.

# RANK 9-1
m.ending_in_fire = La Fin en feu
o.ending_in_fire = Contactez Agent de Reconnaissance Kora par comlink
b.ending_in_fire = Une anomale a \u00e9t\u00e9 d\u00e9tect\u00e9e dans les niveaux au-dessus le \
  Core. Contactez Agent de Reconnaissance Kora pour des d\u00e9tails.

m.ending_in_fire_1a = Bonjour {0} et f\u00e9licitations d'avoir \u00e9t\u00e9 promu au rang de \
  Champion. Laissez-moi la peine \u00e0 dire que dans mon exp\u00e9rience et apr\u00e8s avoir travaill\u00e9 avec vous-m\u00eame, vous vraiment m\u00e9\
  ritez une titre comme cela. C'est gr\u00e2ce \u00e0 vous que beaucoup de chevaliers sont \
  retourn\u00e9s \u00e0 la surface en toute s\u00e9curit\u00e9 et que nous en connaissons plus \
  sur les Rouages.

r.ending_in_fire_1a = Merci Kora, j'ai l'intention d'\u00eatre le premier \u00e0 arriver au Core!

m.ending_in_fire_2a = Au rythme o\u00f9 vous allez, vous pourriez le faire, {0}! Pourtant, nous \
  avons de la nouvelle information qui dit qu'il ne sera pas facile.

r.ending_in_fire_2a = Qu'est-ce que vous avez pour moi?

m.ending_in_fire_3a = Nous pensions qu'il serait un peu pr\u00e9visible, m\u00eame aux \
  profondeurs que vous explorez. Le Core \u00e9tait en vue. Mais maintenant une masse d'\u00e9nergie n\u00e9\
  gative de quelque sorte a apparu au-dessus le Core, bloquant l'acc\u00e8s. Les Chevaliers \u00c9\
  claireurs ont dit qu'ils ne voient que le feu, le feu infini.\n\
  \n\
  Nous ne connaissons pas ce qu'il est, mais les escadrons pr\u00e8s de la profondeur ont d\u00e9j\u00e0 \
  disparu. C'est des mauvaises nouvelles.

r.ending_in_fire_3a = Comment puis-je aider?

m.ending_in_fire_4a = Vous devez explorer les niveaux entourants et rassemblez tous les infos \
  que vous pourriez rassemblez. Vous pouvez commencer dans un ch\u00e2teau d'Owlite de quelque \
  sort qui a apparu pr\u00e8s de cette anomalie.

r.ending_in_fire_4a = Affirmatif, Kora. J'y vais.

m.occurance_at_owlite_keep = Ce qui se passa au Ch\u00e2teau Owlite
o.occurance_at_owlite_keep = Trouvez l'ancien tome d'Owlite dans le fort hant\u00e9
b.occurance_at_owlite_keep = Une source d'info improbable a apparu venant des r\u00e9sidents de \
  Moorcroft Manor. L\u00e0, quelques-uns de spookats qui habitent en ville a contact\u00e9 l'un \
  de nos visiteurs Chevaliers \u00c9claireurs et a fourni des d\u00e9tails sur une masse d'\u00c9nergie n\u00e9\
  gative qui avait apparu au-dessus du Core.\n\
  \n\
  En l'appelant \u00abune place de la haine ardente\u00bb et \u00abune prison pour des \u00e2mes ombreuses\u00bb\
  , ils disent que vous pouvez lire tout cela dans \u00abl'un de ces bizarres livres d'Owlite\u00bb \
  dans un fort d'Owlite qu'ils ont localis\u00e9.\n\
  \n\
  Si ce qu'ils ont dit est vrai, Spiral HQ peut gagner des info pr\u00e9cieuses en investiguant \
  le fort d'Owlite. N'oubliez pas qu'il y a de preuve que ces structures Owlite sont grouillant \
  d'\u00e2mes innombrables de mort-vivants. Par cons\u00e9quent, pr\u00e9parez-vous bien.

n.occurance_at_owlite_keep = Texte de tome Owlite:
m.occurance_at_owlite_keep_1a = (Il para\u00eet que c'est le tome Owlite dont les spookats \
  parlent, d\u00e9crivant l'endroit juste au-dessus du Core. Ses pages sont us\u00e9es et \
  seulement des portions du texte originaux sont lisibles.)

r.occurance_at_owlite_keep_1a = Continuez \u00e0 lire

m.occurance_at_owlite_keep_2a = ...Ce monde a vu peu des trag\u00e9dies plus grandes que la \
  chute de Royaume d'Almire. Une fois un beau domaine,  vibrante avec des for\u00eats luxueux \
  et des vastes plaines ...\n\
  \n\
  ...des royaumes avoisinants d\u00e9claraient la guerre...\n\
  \n\
  ...en cherchant la force de sauver son royaume, Lord Vanaduke a fui aux montagnes...

r.occurance_at_owlite_keep_2a = Continuez \u00e0 lire

m.occurance_at_owlite_keep_3a = ...retournant comme quelque chose pas naturel...\n\
  \n\
  ...brasier infini...\n\
  \n\
  ...Almire d\u00e9truit...\n\
  \n\
  ...ils ne peuvent jamais partir, ils ne peuvent jamais \u00e9chapper les flammes...

r.occurance_at_owlite_keep_3a = Continuez \u00e0 lire

m.occurance_at_owlite_keep_4a = (Les pages sont trop d\u00e9t\u00e9rior\u00e9s \u00e0 d\u00e9\
  chiffrer sauf qu'une date des \u00e9v\u00e9nements d\u00e9crits qui sugg\u00e8re qu'il y a \
  plus d'un millier ann\u00e9es depuis la chute de Royaume d'Almire.)

r.occurance_at_owlite_keep_4a = Terminer la lecture.

m.aggressive_assembly = Assemblage agressive
o.aggressive_assembly = Sauvez l'escadron perdu et mettez hors service le contrema\u00eetre de l'usine
b.aggressive_assembly = Assemblage Agressive Briefing

m.silent_legion = La L\u00e9gion Silencieuse
o.silent_legion = Poursuivez Gardien Chevalier Arkus et ramenez-le au Haven
b.silent_legion = Gardien Chevalier Arkus \u00e9tait l'un des guerriers excellents en servant \
  les Spiral Knights jusqu'au temps d'\u00e9crasement. Comme l'un des premiers de chercher pour \
  l'Alpha Squad, son escadron a p\u00e9ri dans une bataille macabre avec une horde de zombies \
  poussi\u00e8res. Depuis lors, Arkus a bl\u00e2m\u00e9 lui-m\u00eame pour leur perte, en \
  disant qu'il a trahi son Serment de Gardien en \u00e9chouant de prot\u00e9ger son escadron.\n\
  \n\
  Maintenant, Arkus traverse les Rouages tout seul, jamais risquant la perte d'un autre \
  escadron. On croit qu'il essaie de trouver l'escadron qu'il a une fois perdu, d'une mani\u00e8re ou d'une autre. \u00c0 \
  mesure que le temps passe, ses exp\u00e9ditions sont devenues plus autodestructrices et \
  Spiral HQ l'a lanc\u00e9 une ordre de cesser.\n\
  \n\
  Arkus ignorait ces ordres et a risqu\u00e9 profond\u00e9ment dans les Rouages et n'est pas \
  retourn\u00e9. Ne voulant pas perdre sa derni\u00e8re membre de son escadron, Spiral HQ vous \
  demande de le poursuivre jusqu'\u00e0 la derni\u00e8re place qu'il a \u00e9t\u00e9 d\u00e9tect\u00e9, \u00e0 la statuaire myst\u00e9\
  rieuse de quelque sort au profondeur 26.

r.end_module = Fin de Module
n.recon_module = Module de Reconnaissance
m.silent_legion_recon_mod = Je suis attir\u00e9 \u00e0 cette place-ci.\n\
  \n\
  Dans les yeux des guerriers silencieux, je me vois comme une personne froid, fort, in\u00e9\
  branable... et effondrant. Ils me demandaient de les laisser tomber, de continuer, mais je ne \
  peux pas le faire.\n\
  \n\
  Ses visages, ses cris mourant... ils me hantaient dans mes r\u00eaves, donc je ne m'endors \
  plus. Maintenant, je les vois quand je ferme mes yeux, donc je ne clignerai plus.\n\
  \n\
  Je resterai ici, parmi ces tombes... jamais cligner, jamais oublier.


m.silent_legion_1a = Ont-ils vous envoy\u00e9 ici? Pour me ramener? Non, je suis dans ma place. \
  Je ne serve plus l'Ordre Spiral et je resterai ici.\n\
  \n\
  Partez et ne retournez jamais \u00e0 cette place. Laissez-moi tout seul.

m.silent_legion_2a = Je suis s\u00fbr que je les ai entendu, ses voix dans le vent. Il n'y a \
  plus des cris, ni des sanglots. M\u00eame si cette place est calme et tranquille, je ne \
  comprends rien. Est-ce qu'ils me laissent ici? Pourquoi dois-je \u00eatre abandonn\u00e9 ici?\n\
  \n\
  Vous... je vous ai d\u00e9conseill\u00e9 de ne pas m'approcher. Vous saurez ce qu'ils \
  faisaient... que tous qui sont proches \u00e0 moi mourriront!

m.silent_legion_3a = Une grande tristesse \u00e9met de sa forme tomb\u00e9e. Ses yeux \
  s'effacent et une noirceur lui reprend. Arkus est mort.

# RANK 9-2
m.eye_of_needle = Chas de l'aiguille
o.eye_of_needle = Contactez Agent de Reconnaissance Kora par comlink
b.eye_of_needle = Apr\u00e8s avoir compil\u00e9 les donn\u00e9es que vous avez rapport\u00e9 du ch\u00e2teau Owlite et les donn\u00e9es qu'ont rapport\u00e9 les autres \u00e9\
  claireurs, l'Agent de Reconnaissance Kora vous a pr\u00e9par\u00e9 un briefing \u00e0 propos de la masse d'\u00e9nergie n\u00e9gative qui bloque l'acc\u00e8s au .

m.eye_of_needle_1a = {0}, je suis contente que vous avez appel\u00e9, j'ai quelque chose de \
  grand pour vous.

r.eye_of_needle_1a = Qu'est-ce que c'est, Kora?

m.eye_of_needle_2a = Cette masse d'\u00e9nergie n\u00e9gative sur laquelle nous enqu\u00eatons \
  est une portion d'un royaume ancien appel\u00e9 Almire, le m\u00eame domaine d\u00e9crit dans \
  ce tome d'Owlite que vous avez d\u00e9couvert!

r.eye_of_needle_2a = Mais ce tome-l\u00e0 sugg\u00e8re qu'il y a plus d'un millier ans que \
  Almire \u00e9tait ruin\u00e9...

m.eye_of_needle_3a = Exactement! Alors qu'est-ce qu'il fait dans les Rouages maintenant? Il ne \
  fait pas de sens!\n\
  \n\
  Alors si nous croyons vraiment qu'un royaume perdu s'est trouv\u00e9 dans un monde massif et \
  m\u00e9canique dans le pr\u00e9sent, il ne reste qu'une question: pourquoi?

r.eye_of_needle_3a = Et pourquoi bloque-t'il l'acc\u00e8s au Core maintenant, pendant que nous \
  sommes si pr\u00e8s?

m.eye_of_needle_4a = C'est un peu trop pratique. Mais est-ce que les gremlins sont capables \
  d'avoir cette puissance? Je soup\u00e7onne quelque chose de plus qu'ils sont capables de \
  construire.\n\
  \n\
  En tout cas, cet Almire, il n'est plus un royaume. Tous ce qui reste est une grande citadelle \
  qui semble d'\u00eatre engloutie dans les flammes interminables que Spiral HQ appelait la \u00abCitadelle Feurieuse\u00bb\
  . De ce que nous pouvons dire, cette place est grouillante avec des mort-vivants et \
  construite comme une forteresse.

r.eye_of_needle_4a = Alors, le seul chemin au Core est \u00e0 travers la Citadelle Feurieuse?

m.eye_of_needle_5a = Il semblerait comme \u00e7a. Et cette place, elle \u00e9mit du mal, c'est \
  presque indescriptible. Il commence \u00e0 affecter les niveaux autour la citadelle- des feux \
  se d\u00e9clarent partout.\n\
  \n\
  Vous \u00eates parmi l'un de nos meilleurs, {0}, et s'il y a quelqu'un qui peut diriger un \
  escadron \u00e0 passer la citadelle, c'est vous. Mais y arriver ne sera pas facile. Nous \
  avons besoin d'\u00e9teindre les feux et rassembler plus de donn\u00e9es avant d'entrer en \
  trombe.

r.eye_of_needle_5a = Affirmatif. Alors vous avez quelques missions pr\u00e9par\u00e9es pour moi?

m.eye_of_needle_6a = Certainement. Commen\u00e7ons par \u00e9teindre le feu, puis on essaye de \
  mettre nos pieds dans la citadelle. \u00c9tant donn\u00e9 l'opposition, c'est une chance dans \
  une million.\n\
  \n\
  Bonne chance, {0}.

r.eye_of_needle_6a = Terminer la conversation.

m.terminal_meltdown = Fusion du R\u00e9acteur terminal
o.terminal_meltdown = Rasez les monstres ardente dans le d\u00e9p\u00f4t de combustible et pr\u00e9\
  venir une catastrophe explosive
b.terminal_meltdown = Attir\u00e9s \u00e0 la Citadelle Feurieuse, une horde de monstres gel\u00e9es enflamm\u00e9s ont envahi un d\u00e9p\u00f4\
  t d'essence qui se trouve tout pr\u00e8s, mettant en p\u00e9ril le d\u00e9p\u00f4t et notre acc\u00e8s \u00e0 \
  la forteresse. Si on laisse les monstres toutes seules, propageant leur flammes \u00e0 \
  l'essence, tout s'embrasera.\n\
  \n\
  Spiral HQ vous ordonne d'entrer le d\u00e9p\u00f4t et d'\u00e9teindre les flammes avant que \u00e7\
  a ne soit trop tard et explosera!

m.alone_in_dark = Seul dans la noirceur
o.alone_in_dark = Contactez un \u00e2me perdu d'Almire dans la cimeti\u00e8re des soldats.
b.alone_in_dark = Les spookats de Moorcroft Manor ont une autre pi\u00e8ce d'info pr\u00e9\
  cieuse qui vaut la peine d'investiguer. Ils disent qu'une \u00e2me perdue d'Almire Royaume r\u00e9side dans une cimeti\u00e8\
  re soldat proche de la Citadelle Feurieuse. Cette \u00e2me est dispos\u00e9 de fournir des \
  renseignements sur la nature de la citadelle et comment nous pouvons le passer et arriver au \
  Core.\n\
  \n\
  Atteindre l'\u00e2me ne sera pas facile gr\u00e2ce de son emplacement. Les cimeti\u00e8res \
  sont des places terribles, particuli\u00e8rement dans ce profondeur. Nous vous conseillons \
  que vous traversez la cimeti\u00e8re aussi rapidement que possible dans votre cherche pour \
  cette \u00e2me perdue.

#Conversation (in level):
n.alone_in_dark = L'\u00e2me perdue d'Almire
m.alone_in_dark_1a = (Vous voyez l'\u00e2me perdue d'Almire se tient devant vous. Dans sa \
  visage, vous voyez une tristesse profonde. En regardant fixement au-del\u00e0 de vous, il commence \u00e0 \
  parler sans introduction.)\n\
  \n\
  Lord Vanaduke a apport\u00e9 le feu venant des montagnes au royaume. Tout a br\u00fbl\u00e9. Ses ennemis. M\u00eame sa famille.\n\
  \n\
  Ma famille a \u00e9t\u00e9 perdue aussi. J'ai fui la bataille d\u00e8s que je voyais la bouff\u00e9\
  e des flammes dans la distance. Je suis arriv\u00e9 chez moi au moment ma maison a br\u00fb\
  le. Je ne me souviens pas comment il a fini. Je n'ai aucune m\u00e9moire de ma mort.

r.alone_in_dark_1a = Continuez \u00e0 \u00e9couter

m.alone_in_dark_2a = Lord Vanaduke r\u00e8gne sur la citadelle maintenant. Son \u00e2me est li\u00e9e dans une prison blind\u00e9e et horrible.\n\
  \n\
  Sa citadelle est pr\u00e9par\u00e9e pour la bataille en tout temps, croyant que son royaume \
  est encore en \u00e9tat de si\u00e8ge. Il ne r\u00e9alise pas que ce qu'il essaie de prot\u00e9ger \u00e9\
  tait perdu pour une mille ans.

r.alone_in_dark_2a = Continuez \u00e0 \u00e9couter

m.alone_in_dark_3a = Si vous essayez d'entrer la citadelle et y arrivez dans la salle de tr\u00f4\
  ne, je vous en prie, mettez fin \u00e0 sa souffrance. Permettez les \u00e2mes qu'il garde \
  dans ce monde une chance de retourner chez ses proches.\n\
  \n\
  Et une chose de plus- j'ai entendu qu'une force de nature de quelque sort a essay\u00e9 de r\u00e9\
  parer ses maux mais Lord Vanaduke l'emprisonnait dans sa forteresse. Il serait utile de le \
  trouver et lib\u00e9rer.

r.alone_in_dark_3a = Merci.

m.alone_in_dark_4a = (L'\u00e2me perdu continue \u00e0 fixer son regard au-del\u00e0 de vous, \
  en disant rien.)

r.alone_in_dark_4a = End conversation.

m.the_gauntlet = Le Chemin de D\u00e9fi
o.the_gauntlet = Battez en route \u00e0 la Citadelle Feurieuse contre une force monstreuse
b.the_gauntlet = Il y a une bataille finale avant d'atteindre le Citadelle Feurieuse. On croit \
  que ce d\u00e9fi est con\u00e7u par Lord Vanaduke, o\u00f9 la place est grouill\u00e9 de cr\u00e9\
  atures de noirceur et se termine par une ar\u00e8ne cauchemardesque qui doit \u00eatre vaincu \
  afin d'avoir acc\u00e8s aux portes de Citadelle Feurieuse.\n\
  \n\
  Cette mission prend tous ce que vous avez et n\u00e9cessite un arsenal complet de l'\u00e9\
  quipement puissante. Si le Lord Vanaduke vous teste, donne-lui la bataille il demande et \
  montrez ce qu'un vrai champion peut faire!

# RANK 9-3
m.heart_of_matter = Le C\u0153ur de l'affaire
o.heart_of_matter = Contactez Lieutenant Vaelyn par comlink
b.heart_of_matter = Lieutenant Vaelyn a men\u00e9 le premier escadron qui a essay\u00e9 de \
  trouver l'Alpha Squad dans les Rouages. Elle est une chef d'escadron talentueuse, pens\u00e9e d'\u00eatre comparable \u00e0 Euclid lui-m\u00ea\
  me! Vaelyn n'a jamais abandonn\u00e9 la cherche pour l'\u00e9quipe et maintenant elle essaye \
  d'assembler une \u00e9quipe de recherche sur-place dans le Core afin de mieux comprendre \
  l'endroit o\u00f9 on croit l'Alpha Squad s'est trouv\u00e9 derni\u00e8rement.

m.heart_of_matter_1a = Bonjour, {0}, \u00e7a fait quelque temps que je voudrais vous parler, \
  mais Spiral HQ vous garde pas mal occup\u00e9!

r.heart_of_matter_1a = Allo, Lieutenant! Comment puis-je vous aider?

m.heart_of_matter_2a = Comme vous le savez, j'essaie de r\u00e9unir une \u00e9quipe de \
  recherche pour travailler sur place dans le terminal du Core. Afin de l'utiliser pour \
  restaurer le Skylark, c'est essentiel que nous l'atteignions et \u00e9tablissions cette \
  station de recherche.\n\
  \n\
  Tous les preuves indiquent que vous avez la capacit\u00e9 d'arriver au Core. En per\u00e7ant \
  la Citadelle Feurieuse et \u00e9tablissant un lien au Core, mon \u00e9quipe pourrait \u00e9\
  tablir des routes de provisions et travailler imm\u00e9diatement. Mais nous ne pouvons pas le \
  faire pendant que cette citadelle infernale et son roi bloquent le chemin.

r.heart_of_matter_2a = Je suis bien pr\u00e9par\u00e9 pour le Citadelle Feurieuse. Vous pouvez \
  compter sur moi.

m.heart_of_matter_3a = Merci, {0}.  J'esp\u00e8re que vous r\u00e9ussisez. Comme vous le d\u00e9j\u00e0 \
  connaissez, nous croyons que l'Alpha Squad a p\u00e9n\u00e9tr\u00e9 jusqu'ici, mais on ne \
  sait pas ce qui leur est arriv\u00e9... Euclid, Parma, Grantz.... Rulen. \n\
  \n\
  (Il semble que Lieutenant Vaelyn est perdue dans ses pens\u00e9es)


m.heart_of_matter_4a = Excusez-moi.  Bonne chance, {0}.  Assemblez le meilleur escadron \
  possible, et dirigez-le bien. Vous tenez tous nos espoirs.

r.heart_of_matter_4a = Je comprends, Lieutenant.

m.king_of_ashes = Le Roi des cendres
o.king_of_ashes = Vainquez le Lord Vanaduke dans la Citadelle Feurieuse et arrivez au Core
b.king_of_ashes = Dans les profondeurs br\u00fblants de la Citadelle Feurieuse, le Lord \
  Vanaduke attend pour un \u00eatre vivant de passer son royaume maudit. Tous les escadrons qui \
  ont essay\u00e9 d'infiltrer la citadelle ont p\u00e9ri ou \u00e9t\u00e9 simplement perdus, \
  comme les innombrables \u00e2mes perdus li\u00e9 au royaume terrible.\n\
  \n\
  Le Lord Vanaduke est pr\u00eat pour la guerre. Dans son esprit tordu, il croit que tous qui d\u00e9\
  fie d'entrer la citadelle est une force d'invasion d\u00e9termin\u00e9 de d\u00e9passer son \
  royaume. Il se tient comme le dernier obstacle avant d'avoir acc\u00e8s au Core et la chance \
  de restaurer le Skylark et de rentrer chez eux.\n\
  \n\
  Comme un champion des Spiral Knights, vous avez ce qu'il faut de mener une \u00e9quipe au c\u0153\
  ur de ce brasier et confronter la force titanique de Lord Vanaduke.

# RANK 9-4
m.true_champion = Un Vrai Champion
o.true_champion = Contactez Agent de Reconnaissance Kora par comlink
b.true_champion = Ayant sortir en vie de la Citadelle Feurieuse, Agent de Reconnaissance Kora \
  attend de vous entendre avec impatience.

m.true_champion_1a = {0}! Oh, {0} vous l'avez fait! Haha!\n\
  \n\
  Je suis tellement contente que vous soyez sortie de l\u00e0-bas! J'\u00e9tais malade d'inqui\u00e9tude!

r.true_champion_1a = C'est bien de savoir que vous \u00eates concern\u00e9e, Kora.

m.true_champion_2a = Bin, en ce qui me concerne c'est le d\u00e9but pour vous, {0}. Vous \u00ea\
  tes un vrai champion du Spiral Knights. Et parce que je ne suis pas nomm\u00e9 \u00e0 une autre t\u00e2\
  che, je suppose que c'est le d\u00e9but pour \u00abnous\u00bb aussi!

r.true_champion_2a = J'attends avec impatience pour plus de donn\u00e9es, Kora.

m.true_champion_3a = Vous pouvez toujours compter sur moi!\n\
  \n\
  Maintenant, je suis s\u00fbre que vous avez beaucoup \u00e0 faire. Nous sommes tellement fous \u00e0 \
  essayer de faire pile ou face sur ce module de reconnaissance que vous avez d\u00e9couvert d\u00e9\
  hors le Core. Comment diable pourrait l'Alpha Squad \u00abentrer\u00bb le Core?

r.true_champion_3a = S'il y a un chemin, on le trouvera.

m.true_champion_4a = Oui, je suppose que nous pourrions. Bon voyage, {0}.

r.true_champion_4a = Terminer la conversation.

m.honor_duty = D'honneur et de Devoir
o.honor_duty = Contactez Lieutenant Feron par comlink
b.honor_duty = Lieutenant Feron aimerait de parler avec vous concernant votre accomplissement \
  en per\u00e7ant la Citadelle Feurieuse.

m.honor_duty_1a = Bonjour, {0}, Champion du Spiral Knights. Votre service \u00e0 notre cause \u00e9\
  tait de la haute calibre. Atteindre le Core serait encore un r\u00eave sans votre aide. \
  Maintenant, nous avons une chance \u00e0 r\u00e9tablir le Skylark et \u00e0 retourner chez nous.

r.honor_duty_1a = C'\u00e9tait un honneur de servir, Lieutenant.

m.honor_duty_2a = J'ai lu votre rapport sur le Core, c'est facinant. Quelle structure \
  impossible et pour penser que l'Alpha Squad est encore en vie mais... dedans cette chose-l\u00e0 c'est incroyable.\n\
  \n\
  Je comprends que Lieutenant Vaelyn a d\u00e9j\u00e0 m\u00e9n\u00e9 un \u00e9quipe vers le \
  terminal de Core et une base d'op\u00e9rations fut mise sur pied. Celle-ci est du grand \
  valeur pour Spiral Knights et nous n'avons que vous \u00e0 remercier!

r.honor_duty_2a = J'esp\u00e8re que ses enqu\u00eates retrouvent quelque chose utile.

m.honor_duty_3a = Oui, comme nous tous esp\u00e9rons.\n\
  \n\
  Maintenant, {0}, vous avez besoin de vous pr\u00e9parer pour ce qui est \u00e0 venir. L'arriv\u00e9\
  e au Core est seulement de d\u00e9but pour nous. Je soup\u00e7onne que Spiral HQ vous donner \
  plus des missions dans le futur qui peuvent \u00eatre prises par quelqu'un de votre capacit\u00e9.\n\
  \n\
  Enfin, c'est avec plaisir de vous informer que vous serez rembours\u00e9 l'un des plus \
  grandes honneurs de Spiral Knights, le rang d'Avant-garde. Je vous verrai dans le Panth\u00e9on des H\u00e9ros.

r.honor_duty_3a = Merci, Lieutenant.

m.search_continues = La Recherche poursuit
o.search_continues = Contactez Lieutenant Vaelyn par comlink
b.search_continues = Lieutenant Vaelyn aimerait de vous remercier pour ouvrir un chemin au Core \
  et de lui permettre d'installer une base de recherche sur place.


m.search_continues_1a = {0}, je ne peux pas vous remercier suffisamment. Nous avons d\u00e9j\u00e0 \u00e9\
  tabli notre base de recherche et nous sommes en train de r\u00e9colter des tas de donn\u00e9\
  es que nous n'aurions jamais eu sans vos efforts.

r.search_continues_1a = Merci, Lieutenant. Y-a-t'il d'autres nouvelles d'Alpha Squad?

m.search_continues_2a = Le module de reconnaissance que vous avez r\u00e9cup\u00e9r\u00e9 est tr\u00e8\
  s bizarre. Je ne crois pas que Parma mentait, mais c'est impossible \u00e0 dire comment il \
  s'est arriv\u00e9. Tous les attributs du Core nous sugg\u00e8re qu'il n'y a aucune porte, \
  aucun moyen de franchir son seuil. Ce n'est pas une structure construite pour \u00eatre rentr\u00e9e de l'ext\u00e9rieur. Au contraire!

r.search_continues_2a = Un prison pour garder quelque chose \u00e0 l'int\u00e9rieur?

m.search_continues_3a = Peut-\u00eatre. En le regardant, c'est possible. Nous devons \
  l'examiner.

r.search_continues_3a = Et le 'noirceur vivant' que Parma a d\u00e9crit?

m.search_continues_4a = Je ne sais pas, mais c'est une image terrible qu'elle a peinte. Quelque \
  chose se remuer dans le c\u0153ur du monde, {0}, quelque chose terrible. Je l'ai senti le \
  moment que nous mettions nos pieds ici; les yeux invisibles qui surveillent nos actions, des \
  formes qui apparaissent tout d'un coup... quelque chose plus grand que les gremlins appellent \
  chez soi.

r.search_continues_4a = Qu'est-ce que vous ferez maintenant, Lieutenant?

m.search_continues_5a = Je n'ai pas abandonn\u00e9 la cherche pour Euclid, Parma, Grantz et \
  Rulen. Je sais qu'ils sont quelque part et je les trouverai, m\u00eame si je dois entrer le \
  Core.

r.search_continues_5a = Je vous souhaite bonne chance, Lieutenant.

m.search_continues_6a = Vous aussi, avant-garde.

r.search_continues_6a = Terminer la conversation.

m.hall_of_heroes_5 = Panth\u00e9on des H\u00e9ros
o.hall_of_heroes_5 = Visitez le Panth\u00e9on des H\u00e9ros et recevez votre une mention \u00e9logieuse
b.hall_of_heroes_5 = C'est temps que vous visitez le Panth\u00e9on des H\u00e9ros une fois \
  plus. Ayant d'\u00eatre 5-\u00c9toile Certifi\u00e9 et r\u00e9ussi autant des missions qui \
  assurent la survie des Spiral Knights sur Cradle, Spiral HQ vous pr\u00e9pare pour le rang \
  haut de Avant-garde.

m.hall_of_heroes_5_1a = Bienvenue, {0}. C'est bien de vous revoir encore et sous cette p\u00e9riode prometteuse.

r.hall_of_heroes_5_1a = Bonjour, Lieutenant.

m.hall_of_heroes_5_2a = Vous \u00eates dans le Panth\u00e9on des H\u00e9ros, auquel les \
  meilleurs de Spiral Knights offrent ce qu'ils peuvent aux chevaliers aspirants. Des \
  chevaliers comme vous-m\u00eame, quand vous avez \u00e9merg\u00e9 de votre droppage et trouv\u00e9 votre chemin au Haven.\n\
  \n\
  Et apr\u00e8s autant des missions r\u00e9ussies, des sauvetages audacieuses et de la \
  performance exemplaire dans des batailles, vous \u00eates maintenant digne de joindre ces h\u00e9ros.

r.hall_of_heroes_5_2a = Continuez.

m.hall_of_heroes_5_3a = {0}, en compagnie de tous qui vous soutiennent et de qui vous servez, \
  c'est avec honneur de vous d\u00e9cerner le haut rang d'Avant-garde du Spiral Knights.

r.hall_of_heroes_5_3a = Je suis honor\u00e9.

m.hall_of_heroes_5_4a = Maintenant, saluez ceux qui vous ont aid\u00e9 \u00e0 devenir le \
  chevalier que vous \u00eates aujourd'hui. Quand vous avez fini, prenez l'ascenseur pour \
  recevoir votre recommandation.

r.hall_of_heroes_5_4a = Terminer la conversation.

m.hall_of_heroes_5_5a = Bien de vous rencontrer enfin en personne, {0}! F\u00e9licitations!

m.hall_of_heroes_5_6a = Servez avec honneur, Avant-garde.

m.hall_of_heroes_5_7a = {0}, j'ai pens\u00e9 que vous soyez plus grand.

m.hall_of_heroes_5_8a = Wow, vous l'avez fait vraiment!

m.hall_of_heroes_5_9a = Salut {0}! Regardez-vous, wow! H\u00e9, Avant-garde ou non vous savez o\u00f9 \
  aller si vous voulez ressortir, ouais?

m.hall_of_heroes_5_10a = F\u00e9licitations {0}. Les Geo Knights doivent beaucoup \u00e0 vous pour vos efforts.

m.hall_of_heroes_5_11a = (Il para\u00eet qu'il fixe son regard tr\u00e8s attentivement sur le \
  coin.)

m.hall_of_heroes_5_12a = Avant-garde, hein? Les Gardes sont toujours \u00e0 la recherche pour \
  des chevaliers habiles comme toi, {0}. Apr\u00e8s tous le tohu-bohu, viens me voir si tu \
  voudrais faire face et rigoler au danger et la mort!

# RANK 10-1
m.breaking_in_recruits = Formez les nouvelles recrues
o.breaking_in_recruits = Aidez un groupe de nouvelles recrues \u00e0 survivre son premier \
  service
b.breaking_in_recruits = Apr\u00e8s avoir brav\u00e9 les profondeurs de Citadelle Feurieuse, \
  Spiral HQ croit que vous avez gagn\u00e9 une pause bien m\u00e9rit\u00e9. Comme un Vanguard \
  oint r\u00e9cemment de Spiral Knights, Lieutenant Feron croit que vous \u00eates le candidat \
  parfait pour entra\u00eener un groupe des bleus sur la survie et comment survivre les dangers \
  de ce monde. Votre mission est de vous rejoindre avec les recrues sur la surface de Cradle et \
  aidez-les \u00e0 survivre son premier service.


m.breaking_in_recruits_1a = Salutations mon. Petit. Ne marche. Pas. Sur les b\u00e9cassines.
r.breaking_in_recruits_1a = Euh...

m.breaking_in_recruits_2a = Salutations. Obtenez des babioles. Des babioles.
r.breaking_in_recruits_2a = Vous vous sentez bien?

m.breaking_in_recruits_3a = B\u00e9cassines. Acheter? Vendre?
r.breaking_in_recruits_3a = Ouais...

m.breaking_in_recruits_k1a = Des Gremlins!? Est-ce que je lis \u00e7a correctement? Une \
  embuscade?! Comment ont-ils circonvenu nos senseurs?
r.breaking_in_recruits_k1a = Ils se sont d\u00e9guis\u00e9s comme les \u00c9trangers.
m.breaking_in_recruits_k2a = Ce n'est plus un programme d'entra\u00eenement! Rapportez les \
  Recrues \u00e0 l'ascenseur. Nous allons les ramener au Haven. D'autre part, vous devez \
  descendre et d\u00e9couvrir le fin fond de ce plan.
r.breaking_in_recruits_k2a = Affirmatif, Kora.

m.crimson_chaos = Chaos Incarnat
o.crimson_chaos = Enqu\u00eatez sur une base d'Ordre Incarnat qui est devenue soudainement \
  silencieuse
b.crimson_chaos = Spiral HQ a suivi quelques bases d'Ordre Incarnat bien connues dans l'espoir \
  d'intercepter l'un de ses membres \u00e9lusifs de haut rang. Les \u00c9claireurs cens\u00e9s \
  surveiller l'une de ces bases rapportent qu'elle devient silencieuse et ont demand\u00e9 des \
  renforts avant de faire une enqu\u00eate. Voyagez jusqu'\u00e0 leur endroit et enqu\u00eatez \
  la base pour les indices de ce qui s'est pass\u00e9.

m.cryptic_coder_crimson_chaos = Infiltrez le Complexe.\n\
  Prenez tous les sch\u00e9mas.\n\
  Les Neuf sont silencieux mais nous les ferons taire.\n\
  Les Chevaliers chassent mais nous les arr\u00eaterons.\n\
  \n\
  Seulement Herex comprend la V\u00e9rit\u00e9. Seulement Herex decendra.\n\
  Il n'y aura pas d'autre.

m.from_below = Il venait de sous-sol
o.from_below = Retrouvez et sauvez l'escadron de Gardes \u00c9claireurs
b.from_below = Un escadron de Gardes \u00c9claireurs de Desna est pi\u00e9g\u00e9 dans quelque \
  part des Rouages par une force myst\u00e9rieuse. \u00c0 en jugeant par la s\u00e9v\u00e9rit\u00e9 \
  des rapports et les communications affol\u00e9es venant d'escadron, Spiral HQ croit qu'une \
  seule personne avec exp\u00e9rience comme vous-m\u00eame est capable de s'occuper de la force \
  mortelle qui pi\u00e8ge les Gardes.

# RANK 10-2
m.the_flickering_flame = La Flamme Vacillante
o.the_flickering_flame = Contactez Agent de reconnaissance Kora via comlink
b.the_flickering_flame = Apr\u00e8s votre victoire dans la Citadelle Feurieuse, les sprites de \
  nature de la grande M\u00e8re d'esprits font des progr\u00e8s en combattant les flammes \
  maudites qui engloutissent les ruines calcin\u00e9es d'Almire. Un flamboiement r\u00e9cent a ralenti le progr\u00e8s, faisant allusion \u00e0 \
  une force malveillante subsistante qui continue \u00e0 jeter l'huile sur le feu. Contactez \
  Agent de reconnaissance Kora pour en savoir plus.

m.the_flickering_flame_1a = Oh {0}! Comme si ces occurrences n'\u00e9taient pas assez mal! J'ai \
  des nouvelles affreuses pour vous.

r.the_flickering_flame_1a = Plus des probl\u00e8mes, Kora?

m.the_flickering_flame_2a = Nous \u00e9tions en milleu de recevoir un rapport d'\u00e9quipe de \
  Lieutenant Vaelyn au Terminal de Core quand notre signal a \u00e9t\u00e9 interrompu. \u00c7a \
  prenait du temps, mais j'ai r\u00e9ussi \u00e0 localiser la source de l'interruption. \u00c7a \
  vient d'appareil que vous avez d\u00e9couvert pr\u00e8s de la salle du tr\u00f4ne de Vanaduke \
  dans la Citadelle Feurieuse. On croit que quelqu'un l'ait activ\u00e9.

r.the_flickering_flame_2a = L'a activ\u00e9? Comment?

m.the_flickering_flame_3a = Nous ne sommes pas certains mais il faut qu'il ait un lien \u00e0 \
  l'Artifice. Les signals d'\u00e9nergie sont identiques. Si \u00e7a concerne l'Artifice, \u00e7a dit que...

r.the_flickering_flame_3a = Que ce gremlin Herex est concern\u00e9.

m.the_flickering_flame_4a = C'est notre hypoth\u00e9se aussi. Je ne veux pas de vous d\u00e9ployer \u00e0 \
  cette place horrible, {0}, mais s'il y a une chance d'aller au fin fond de cette affaire, \
  c'est vous qui peut le faire. La citadelle est encore dangereuse, et je vous en prie, soyez \
  prudent!

r.the_flickering_flame_4a = Terminer la conversation.

m.shadowplay = Jeu d'ombres
o.shadowplay = D\u00e9couvrez la source de la perturbation dans la Citadelle Feurieuse
b.shadowplay = Malgr\u00e9 le d\u00e9fait de Lord Vanaduke, vaincu dans vos mains, la Citadelle \
  Feurieuse continue \u00e0 br\u00fbler avec des feux ex\u00e9crables. Bien que les sprites de \
  nature fassent des progr\u00e8s en luttant contre les flammes, quelqu'un ou quelque chose a \
  caus\u00e9 r\u00e9cemment une r\u00e9apparition violente de la force destructive. Spiral HQ \
  vous demande de rassembler un escadron de chevalier et de retourner aux ruines effondrants de \
  Citadelle Feurieuse afin de d\u00e9couvrir la source du d\u00e9sordre.

# Players encounter Herex at the altar.  He activates it with the Artifact and talks to the players
# before vanishing.
m.shadowplay_1a = Vous \u00eates encore trop tard! J'ai d\u00e9j\u00e0 rassembl\u00e9 le \
  pouvoir dont j'ai besoin pour faire fonctionner l'Artifice et vous ne pouvez rien faire pour \
  arr\u00eater ce que je mis en marche.

r.shadowplay_1a = \u00c7a termine ici, Herex!

m.shadowplay_2a = Allez. Je vous donne un dernier moment de r\u00e9pos avant que je d\u00e9truise votre sorte m\u00ea\
  lant. Cependant, si vous d\u00e9cidez de rejeter ma si belle offre, vous \u00eates tous les \
  bienvenus de venir et m'affonter au Core o\u00f9 j'h\u00e2terai votre mort.

r.shadowplay_2a = On s'y reverra.
m.shadowplay_3a = J'attends avec impatience pour notre prochaine... r\u00e9union.

m.a_call_to_arms = Un appel aux armes
o.a_call_to_arms = Recevoir un urgent message de comlink
b.a_call_to_arms = Un message comlink d'urgence et affol\u00e9 diffuse sur tous les cha\u00eenes.

m.a_call_to_arms1 = Ici Vaelyn au Core Terminal. L'\u00e9quipe compl\u00e8tement \u00e9cras\u00e9e. Des t\u00e9n\u00e8\
  bres partout. Appelez des renforts. Il ouvrira.
r.a_call_to_arms1 = Terminer la transmission.

m.dreams_and_nightmares = Des r\u00eaves et des cauchemars
o.dreams_and_nightmares = Pr\u00e9parez-vous pour le pire et voyagez au Core
b.dreams_and_nightmares = R\u00e9pondez au signal d'urgence venant du Core Terminal. On ne sait \
  pas \u00e0 quoi attendre.\n\
  Celle-ci est une mission dangereuse. Pr\u00e9parez-vous pour n'importe quoi.

m.dreams_and_nightmares_1a = Enfin, des renforts! Regardez, {0}! Le Core s'ouvre!

m.dreams_and_nightmares_2a = Quelle pouvoir! Je n'imagine jamais...!

m.dreams_and_nightmares_3a = ... et elle sera d\u00e9cha\u00een\u00e9e. Vous! Je vous ferai ses \
  premi\u00e8res victimes.

# Vaelyn
m.dreams_and_nightmares_4a = {0}, je suis s\u00fbre que c'est une pi\u00e8ge pour nous et je ne \
  peux pas vous demander de m'accompagner, mais j'y irai. S'il y a une moindre chance que Rulen \
  et les autres membres d'Alpha Squad soient en vie, il faut que je les retrouve.

m.dreams_and_nightmares_5a = Ben, donc je crois c'est l'heure d'\u00eatre une h\u00e9ro\u00efne \
  une fois de plus. Allons-y.

m.dreams_and_nightmares_5b = Herex s'est \u00e9chapp\u00e9! Je l'ai perdu alors que nous \u00e9tions envelopp\u00e9 par le noirceur. C'\u00e9\
  tait comme des milliers de mains nous retiennent. Comme quelque chose ne veut pas \u00eatre suivi.

m.dreams_and_nightmares_5c = Quoi que ce soit, nous sommes ici maintenant. Peu importe o\u00f9. \
  Il semble que notre seule option, c'est de savoir o\u00f9 nous serons men\u00e9s.

# convo at start of Refuge
n.dreams_and_nightmares_3 = \u00c9claireur de Parma
m.dreams_and_nightmares_6a = \u00c9tonnant... je n'aurai jamais pens\u00e9 de retrouver \
  quelqu'un de notre sort une fois de plus! Heureuse de savoir que vous arriviez ici sain et \
  sauf.

# Vaelyn
m.dreams_and_nightmares_7a = Parma! Votre \u00e9claireur! Vous \u00eates encore en vie! O\u00f9 \u00ea\
  tes-vous!? Il faut vous ramener au Haven.

#Player started convo
m.dreams_and_nightmares_8 = D\u00e9sol\u00e9 de ne me pr\u00e9sente pas en personne. Je me \
  cache dans un endroit s\u00fbr. Je savais que je n'y atteignait \u00e0 temps quand j'ai vu \
  votre signal. Heureusement, j'ai touch\u00e9 quelques cordes sensibles et vous ai trouv\u00e9 une sortie.

r.dreams_and_nightmares_8 = O\u00f9 est Rulen? Euclid? Grantz?

m.dreams_and_nightmares_8a = Grantz il... il est tomb\u00e9 en nous prot\u00e9geant contre \
  l'Essaim. Il se tenait m\u00eame si nous \u00e9tions oblig\u00e9s \u00e0 nous \u00e9chapper. \
  Je n'oublie jamais son courage.

m.dreams_and_nightmares_9a = Nous croyions que nous ne survivrons pas. Mais... ensuite, la lumi\u00e8re nous a entour\u00e9 et nous \u00e9tions en s\u00e9curit\u00e9\
  . Nous l'appelons le Dormeur. Nous ne sommes pas certains de sa type, mais il a besoin de \
  notre aide. Ce monde-ci a \u00e9t\u00e9 cr\u00e9e pour le prot\u00e9ger, je ne sais pas \
  pourquoi mais l'Essaim a perc\u00e9 le Core et se nourrit sur l'\u00e9nergie et agrandit \
  comme une sangsue depuis ce temps-l\u00e0.

m.dreams_and_nightmares_9b = Euclid s'engageait comme volontaire pour aider le Dormeur. Je suis \
  s\u00fbr qu'il est l\u00e0, en se battant contre l'Essaim pendant qu'on parle. Et \u00e0 \
  propos de Rulen... Vaelyn, je suis d\u00e9sol\u00e9e. Il n'a disparu pas longtemps apr\u00e8s Euclid a pris sa d\u00e9\
  cision. Je n'ai pas pu le retrouver apr\u00e8s \u00e7a.

m.dreams_and_nightmares_10a = Il ne reste beaucoup de temps. Je ne peux pas vous joindre et \
  vous devez vous \u00e9chapper. Avertissez le quartier g\u00e9n\u00e9ral. Avertissez Haven! Si \
  le Core n'est pas scell\u00e9, l'Essaim s'\u00e9chappera et il continue \u00e0 consommer tous \
  et toutes.

m.dreams_and_nightmares_11a = Mais qu'est-ce que vous allez faire?

m.dreams_and_nightmares_12a = L'Essaim continue \u00e0 devenir plus fort pendant que le Dormeur \
  devient plus faible. Sans nous, nous tous, l'Essaim gagnera. Les gremlins \u00e9taient les \
  responsables de maintenir les d\u00e9fenses sur Cradle, une fois. Mais ils ont leur plans \
  personnels. Nous devons \u00eatre les champions de Cradle, maintenant.\n\
  \n\
  C'est notre sacrifice.

m.dreams_and_nightmares_13a = Continuez \u00e0 combattre la bonne lutte, {0}. N'oubliez pas ce \
  que vous avez appris. Adieu!

m.delved_too_deep = Fouill\u00e9 trop profondemont
o.delved_too_deep = Contactez Agent de reconnaissance Kora via comlink
b.delved_too_deep = La v\u00e9rit\u00e9 a \u00e9t\u00e9 r\u00e9v\u00e9l\u00e9e. C'est l'heure \
  d'avertir Agent de reconnaisance Kora et Spiral HQ \u00e0 propos de ce que vous et Lieutenant \
  Vaelyn ont d\u00e9couvert.

m.delved_too_deep_1a = J'appelle, {0}! C'est incroyable! J'ai perdu compl\u00e8tement votre \
  signal quand vous \u00eates entr\u00e9 le Terminal de Core. Qu'est-ce qui se passait l\u00e0-bas?

r.delved_too_deep_1a = C'est une longue histoire, Kora.

m.delved_too_deep_2a = J'en doute pas. C'est vous qui doit m'enseigner!

r.delved_too_deep_2a = (Renseigner Kora \u00e0 propos d'Essaim, le Dormeur, et l'Alpha Squad)

m.delved_too_deep_3a = \u00c7a m'\u00e9tonne que personne ne connaisse la v\u00e9rit\u00e9. Je \
  veux dire que nous avons soup\u00e7onn\u00e9 quelque chose de louche, que ce monde \u00e9tait \
  une prison de quelque sorte, mais qui pourrait deviner que cet \u00abEssaim\u00bb attend tout \
  simplement pour un personne \u00e0 tr\u00e9bucher sur le Core et le lib\u00e9rer?

r.delved_too_deep_3a = Qu'est qu'on va faire maintenant?

m.delved_too_deep_4a = Si ce que Parma a racont\u00e9 est la v\u00e9rit\u00e9, nous sommes \
  vraiment la derni\u00e8re ligne de d\u00e9fense contre l'Essaim, {0}. Je ne mentira pas, mais \u00e7\
  a peut changer tout. Nous devons notifier Spiral HQ imm\u00e9diatement. Je rassemblera tout \
  le monde et vous envoyerai une mission pour accepter quand vous \u00eates pr\u00eat.

r.delved_too_deep_4a = Terminer la conversation.

# RANK 10-3
m.guardians_of_cradle = Gardiens de Cradle
o.guardians_of_cradle = Rejoignez Spiral HQ et discuter quoi faire encore
b.guardians_of_cradle = Vous avez \u00e9t\u00e9 invit\u00e9 \u00e0 assister \u00e0 un meeting \
  avec quelques membres de Spiral HQ pour discuter quoi faire \u00e0 propos de Core et le \
  menace de Swarm. Rejoignez-les dans le Panth\u00e9on des H\u00e9ros pour en savoir plus sur \
  les Missions d'op\u00e9rations.

m.guardians_of_cradle_1a = Vous voil\u00e0, Avant-garde {0}. Kora a dit que vous avez des \
  nouvelles \u00e0 propos d'Alpha Squad. Je vous en prie, donnez-nous votre rapport.

r.guardians_of_cradle_1a = (Donner le Capitaine Ozlo votre rapport complet)

m.guardians_of_cradle_2a = Alors, il semble que nous ayons \u00e9troitement \u00e9vit\u00e9 une \
  catastrophe horrible. Si nous avons ouvert le Core et d\u00e9cha\u00een\u00e9 l'Essaim, \
  Cradle serait d\u00e9truit. Peut-\u00eatre l'univers aussi!

r.guardians_of_cradle_2a = Continuer

m.guardians_of_cradle_3a = La sacrifice d'Alpha Squad ne sera pas en vein. Je commande nos \
  forces imm\u00e9diatement \u00e0 se charger aux Missions d'Op\u00e9rations sp\u00e9ciales sur \
  Cradle. S'il y a des forces qui essayent de lib\u00e9rer l'Essaim, nous devons les arr\u00eater.

r.guardians_of_cradle_3a = Continuer

m.guardians_of_cradle_4a = {0}, vous avez d\u00e9j\u00e0 fait beaucoup pour nous-m\u00eames, \
  mais je vous demande de faire une derni\u00e8re sacrifice. Il se peut que nous ne retournions \
  jamais chez-nous \u00e0 Isora, mais Cradle a besoin de nous maintenant. J'aimerais que vous \
  menez nos Op\u00e9rations sur Cradle.

r.guardians_of_cradle_4a = \u00c7a me ferait honneur, Capitaine.

m.guardians_of_cradle_5a = Tr\u00e8s bien,  {0}. Vous trouverez un nouveau groupe de missions \
  pour vous sous Op\u00e9rations. Ces nouvelles missions seront group\u00e9es selon l'objectif \
  et on peut les aborder en parall\u00e8le d'elles-m\u00eames. \u00c7a vous donnera la \
  flexibilit\u00e9 maximum afin de r\u00e9pondre \u00e0 chaque menace quand il s'appara\u00eet. Adieu,  {0}, \u00abGardien de Cradle\u00bb.

r.guardians_of_cradle_5a = Terminer la conversation.

m.guardians_of_cradle_6a = Vous voil\u00e0, Avant-garde. Le sentier avant nous sera coriace \
  mais je suis s\u00fbr de notre r\u00e9ussi du d\u00e9fi.

m.guardians_of_cradle_7a = Je ne sais pas si je me sens mieux ou pas apr\u00e8s avoir d\u00e9\
  couvert ce qui s'est pass\u00e9 avec tout le monde dans le Core. Pauvre Grantz... Parma... \
  Euclid... Rulen...

r.guardians_of_cradle_7a = Je sais, Vaelyn. Je me sens la m\u00eame chose.

m.guardians_of_cradle_8a = Bon, je ne les d\u00e9shonorerai pas en abandonnant le tout. Nous \
  avons ouvert le chemin. \u00abC'est l'heure d'\u00eatre une h\u00e9ro\u00efne une fois de plus!\u00bb C'est \u00e7a, {0}?

m.guardians_of_cradle_9a = Quel nid de scarab que nous ayons d\u00e9rang\u00e9, hein {0}? Je me \
  rappelle d'un temps quand nous avions engag\u00e9 les flottes de si\u00e8ge Morai en Isora. C'\u00e9tait tous ou rien. \u00c7a ne m'\u00e9\
  tonne pas que c'est nous qui se tient entre nous-m\u00eame et l'obliteration totale.

m.guardians_of_cradle_11a = Le peu que nous pouvions r\u00e9cup\u00e9r\u00e9 du Terminal de \
  Core a rendu chaque chevalier G\u00e9o, Biotech et technicien perplexes. Il faudra de temps \
  pour faire l'analyse sur ces donn\u00e9es.

m.guardians_of_cradle_10a = (Pour la premi\u00e8re fois depuis votre rencontre, Hahn ne dit \
  rien. Il semble qu'il r\u00e9flichisse vos r\u00e9sultats attentivement.)


