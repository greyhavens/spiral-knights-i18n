r.new_threat_11a = Continuer

m.new_threat_12a = Hum, il a l'air que la plupart de nos \u00e9quipements de d\u00e9tection ont \u00e9t\u00e9 endommag\u00e9\
  s. Il peut prendre de temps pour faire fonctionner ces machins o\u00f9 je peux retrouver \
  l'artifice. Pendant qu'on travaille sur ceux-ci, vous devez contacter l'un de nos Biotechs, \
  Hahn. Il est un peu rude, mais il peut vous pr\u00e9parer \u00e0 faire face aux d\u00e9fis \
  que vous rencontrerez.\n\
  \n\
  Je vous contacterai plus tard, lorsque mes \u00e9quipements de d\u00e9tection sont mis en \
