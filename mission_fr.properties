m.ghost_machine_1a = \u00c9coutez-moi, Gardes! Spiral HQ a re\u00e7u un signal de d\u00e9tresse tr\u00e8\
  s cryptique qui est venu d'une facilit\u00e9 inconnu dans les Rouages.\n\
  \n\
  Bref, je pense que nous allons se jeter dans une op\u00e9ration de sauvetage p\u00e9rilleuse ou dans un pi\u00e8\
  ge mortel. Soit l'une, soit l'autre, la solution de r\u00e9soudre cette situation est dans \
  votre arsenal. Alors, choisissez les bonnes \u00e9quipements et pr\u00e9parez-vous pour le \
  combat.\n\
  \n\
