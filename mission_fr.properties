m.operation_crimson_hammer_1 = Op\u00e9ration Marteau Incarnat
o.operation_crimson_hammer_1 = Joignez Lieutenant Feron dans un si\u00e8ge du Grand Arsenal de \
  Warmaster Seerus.
b.operation_crimson_hammer_1 = Warmaster Seerus est le ma\u00eetre de munitions d'Ordre \
  Incarnat. On croit qu'il est le vrai cerveau des Roarmulus Twins et des armes nombreuses de \
  gremlin. Il est le cr\u00e9ateur et le fournisseur d'engins de guerre pour l'Ordre Incarnat.\n\
  \n\
  R\u00e9cemment, les Chevaliers \u00c9claireurs command\u00e9s par Lieutenant Feron ont d\u00e9couvert \u00abLe Grand Arsenal\u00bb \
  de Seerus, le centre du d\u00e9veloppement et la facilit\u00e9 d'entreposage pour toutes ces \
  armes. Maintenant, Feron dirige quelques escadrons au Grand Arsenal avec l'intention de \
  trouver Seerus et d\u00e9truire ses engins de guerre.\n\
  \n\
  Affront\u00e9 par la r\u00e9sistance acharn\u00e9e, les escadrons ont besoin des renforts et \
  Spiral HQ vous envoie pour les aider.

