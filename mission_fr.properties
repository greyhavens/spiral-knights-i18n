m.p_r3_kit = Livraison des provisions
o.p_r3_kit = Rassemblez les provisions pour livraison aux chevaliers post\u00e9s au Moorcroft Manor
b.p_r3_kit = Quelques chevaliers font partie des \u00e9quipes de la recherche sp\u00e9ciale qui \
  ont rarement une chance de rester au-dessus le sol pour longtemps. Ces chevaliers utilisent \
  fr\u00e9quemment les sous-villes des Rouages comme des camps de base. Pendant que les \
  monstres qui dirigent les villes sont aimables, les am\u00e9nit\u00e9s ne convient pas \
  toujours aux chevaliers.\n\
  \n\
  Ces chevaliers peuvent toujours utiliser les provisions pour rendre son s\u00e9jour plus \
  confortable. Un chercheur content est un chercheur productif!

