m.rescues_and_recycling = Sauvages et Recyclage
o.rescues_and_recycling = Fermez la site de d\u00e9construction gremlin et sauvez les \
  chevaliers captives.
b.rescues_and_recycling = Un \u00abZone de D\u00e9construction\u00bb est un chantier de \
  travaille o\u00f9 les gremlins semble d\u00e9molir des niveaux existants et utiliser leurs \u00e9l\u00e9\
  ments pour construire des nouveaux niveaux. Leur capacit\u00e9 de rapidement machiner des \
  niveaux et des machines est incroyable, surpass\u00e9 seulement par leur hostilit\u00e9 \
  envers ceux qui les croisent.\n\
  \n\
  Les Chevaliers \u00c9claireurs ont d\u00e9couvert qu'un escadron ont peut-\u00eatre observ\u00e9 \
  les travaux d'un peu trop proche, puisqu'ils sont maintenant emprisonn\u00e9s dans un des sites de d\u00e9\
  molition proche du profondeur 10. Il n'est pas clair si les gremlins ont des desseins pour \
  les chevaliers ou si ils planifient de tout simplement les laisser pourrir avec les restants \
  du niveau qu'ils sont en train de d\u00e9molir.

m.shocking_sentient_sentries = Sentinelles Sensibles et Scandaleuses
o.shocking_sentient_sentries = Frayez-vous un chemin \u00e0 la facilit\u00e9 d'armes secr\u00e8te.
b.shocking_sentient_sentries = Les Chevaliers \u00c9claireurs ont d\u00e9couvert une facilit\u00e9 d'armes secr\u00e8te qui, selon nos donn\u00e9es, pourrait appartenir \u00e0 \
  un gremlin hautement class\u00e9 de l'Ordre Incarnat. Elle est fortement fortifi\u00e9e par une arm\u00e9e de construits \u00e9\
  lectriques qui ont sans doute \u00e9t\u00e9 programm\u00e9s pour d\u00e9fendre la facilit\u00e9 a tout prix. \n\
  \n\
  M\u00eame si ce n'est pas claire \u00e0 qui la facilit\u00e9 appartient, il vaut quand-m\u00ea\
  me le temps de l'infiltrer et de neutraliser les armes.\n\
  \n\
  Il est conseill\u00e9 de vous pr\u00e9parer avec des \u00e9quipements r\u00e9sistants \u00e0 l'\u00e9\
  lectricution et qui font des dommages \u00e9l\u00e9mentaires avant de partir.


m.shocking_sentient_sentries_1a = L'Ensors\u00e9tincelle Deluxe est presque stable, je te \
