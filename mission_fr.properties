m.legion_almire_1a = Il n'y a rien comme un \u00e9bats mortel au travers un necropolis hant\u00e9 pour faire battre le c\u0153ur, hein?\n\
  \n\
  Ce necropolis est \u00e0 l'origine d'Almire, le royaume tomb\u00e9 d'un seigneur fou nomm\u00e9 \
  je-ne-sais-pas, avec une population de l\u00e9gions innombrables de mort-vivant. \u00c0 ce qu'il para\u00eet, ces r\u00e9\
  sidents moins-de-vivants gardent quelque chose que Spiral HQ aimerait d'acqu\u00e9rir.\n\
  \n\
  Notre boulot est de r\u00e9cup\u00e9rer une livre sp\u00e9ciale, une pi\u00e8ce d'une collection d\u2019\u0153\
  uvres qui peut nous donner plus d'info sur la nature de ce royaume maudit. Alors, prenez vos \
  casques, et votre meilleur arme contre les mort-vivants- je ne pense pas qu'on aura une r\u00e9ception excellente.\n\
  \n\
  Allons-y, Gardes!

r.legion_almire_1a = (Terminer la conversation.)

n.legion_almire_book = Texte de volume de manuscripts Almirien:
m.legion_almire_2a = Un extrait de compte-rendus de Lord Brandell, Grand Chancelier d'Almire:\n\
  \n\
  Comme la plupart de son peuple, la Loi et l'Ordre a fui d'Almire. Seulement la Justice reste \
  ici, mais elle aussi a \u00e9t\u00e9 tordue par les flammes de mal\u00e9diction qui ravagent \
  notre royaume. La Justice est maintenant le sceptre br\u00fblant de notre Lord Vanaduke. La \
  Justice est rapide, in\u00e9branlable, impitoyable.\n\
  \n\
  Ma position m'a procur\u00e9 beaucoup des choses dans ma vie. Avant j'aimais la vue que ma \
  tour m'a donn\u00e9. Ici, dans ces tours \u00e9lev\u00e9es, je me pensais la premi\u00e8re \
  personne de saluer le printemps, le premier de sentir la vie dans l'air quand les fleurs \
  s'ouvrent.

r.legion_almire_2a = (Continuer \u00e0 lire.)

m.legion_almire_3a = Maintenant, c'est seulement des morts et des fum\u00e9es qui restent dans \
  l'air, m\u00eame \u00e0 ces hauteurs. Et les feux; les feux qui ne sont pas naturels, qui br\u00fble pour l'\u00e9ternit\u00e9\
  , les feux qui transforment des hommes plus pieux \u00e0 cauchemardes horribles. Je sais que \
  ces feux me prendront bient\u00f4t, aussi.\n\
  \n\
  Je ne donnerai pas ma vie \u00e0 mon seigneur. Ma vie n'est pas pour lui \u00e0 prendre, \u00e0 tordre. \u00c7a sera mon ordre final. \u00c7a sera ma Justice.

r.legion_almire_3a = (Terminer la lecture.)

m.p_toxic_plant_r4 = Compos\u00e9 42
o.p_toxic_plant_r4 = Faites une enqu\u00eate sur l'usine d'armes biologiques gremlin
b.p_toxic_plant_r4 = Attention: Celle-ci est une Mission Dangereuse!\n\
  \n\
  Desna et ses Gardes \u00c9claireurs sont une \u00e9quipe d'\u00e9lite, et ils sont les \
