  semble que le poison soit devenu plus intelligent qu'un bio-toxin normal.

r.toxic_plant_2a = (Continuer \u00e0 lire.)

m.toxic_plant_2b = Toutes les traces de Compos\u00e9 42 ainsi que l'am\u00e9nagement et tous les ing\u00e9\
  nieurs qui n'ont fait aucun partie d'\u00e9quipe interne doivent \u00eatre \u00e9limin\u00e9\
  s. Rappelez aux scorchers qui trouvent ses ordres d\u00e9sagr\u00e9ables que ceux qui d\u00e9sob\u00e9issent vont \u00e9\
  tendre mon susurrement dans ses oreilles.\n\
  \n\
  Fermez les portes et r\u00e9duisez tous en cendres.

r.toxic_plant_2b = (Terminer la lecture.)

m.p_heart_of_ice_r4 = C\u0153ur en glace
o.p_heart_of_ice_r4 = D\u00e9couvrez la source des temp\u00eates de neige \u00e9manant d'Amu-Sol
b.p_heart_of_ice_r4 = Attention: Celle-ci est une Mission Dangereuse!\n\
  \n\
  Desna et ses Gardes \u00c9claireurs sont une \u00e9quipe d'\u00e9lites charg\u00e9s du r\u00e9\
  cuperation des infos trouv\u00e9es dans les niveaux plus dangereux des Rouages. On pourrait \
  avoir des r\u00e9compenses grandes si on les rejoignent, mais c'est certain que la voyage \
  sera p\u00e9rilleuse!\n\
  \n\
  Spiral HQ a d\u00e9tect\u00e9 un changement soudain du climat \u00e9manant au profond des \
  Rouages. Les nombres des temp\u00eates de neige bizarres ont commenc\u00e9 \u00e0 augmenter \
  dans les profondeurs et elles ont l'air de provenir d'une ville diabolique et inhospitali\u00e8re, connu sous le nom \u00abAmu-Sol\u00bb. Les Gardes \u00c9claireurs ont \u00e9t\u00e9 envoy\u00e9\
  s pour infiltrer Amu-Sol et d\u00e9couvrir la source de ces temp\u00eates de neige.

