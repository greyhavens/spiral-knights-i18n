m.p_legion_almire_r4 = L\u00e9gion d'Almire
o.p_legion_almire_r4 = R\u00e9cup\u00e9rez un volume de manuscrits Almirien
b.p_legion_almire_r4 = Attention: Celle-ci est une Mission Dangereuse!\n\
  \n\
  Desna et ses Gardes \u00c9claireurs font une \u00e9quipe d'\u00e9lite, et ils sont les \
  responsables de r\u00e9cup\u00e9rer des infos trouv\u00e9es dans les niveaux plus dangereux \
  de Rouages. On pourrait avoir des r\u00e9compenses grandes si on les rejoignent, mais c'est \
  certain que la voyage sera p\u00e9rilleuse!\n\
  \n\
  Spiral HQ croit qu'on d\u00e9couvrirait une volume de manuscrit ancienne d'origine de royaume \
  Almire dans un necropolis sombre et terrifiant. On croit que ce necropolis est grouillant \
  avec toutes sortes de monstres mort-vivants, et que seulement les Gardes \u00c9claireurs \
  peuvent l'infiltrer dans le necropolis, acqu\u00e9rir l'info, et \u00e9chapper en vie!

