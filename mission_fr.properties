  physiques en utilisant les armes forg\u00e9 par dark matter.

r.shadow_knows_3a = Je trouve parfois des d\u00e9p\u00f4ts de min\u00e9ral dark matter dans les \
  Rouages, peut-\u00eatre-

m.shadow_knows_4a = Peut-\u00eatre le Science-Geo n'a pas de place ici? Vous avez raison, {0}.\n\
  \n\
  Le dommage ombreux est inflig\u00e9 par des d\u00e9mons et mort-vivants. De plus, les d\u00e9\
