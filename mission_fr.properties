m.p_r3_mat_0 = Cherchages Monstrueux
o.p_r3_mat_0 = Rapportez les mat\u00e9riaux sp\u00e9cifi\u00e9s au Spiral HQ pour la recherche.
b.p_r3_mat_0 = Spiral HQ est toujours \u00e0 la recherche de comprendre les cr\u00e9atures qui \
