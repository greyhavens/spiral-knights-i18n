o.p_r9_mat_4 = Rapportez les mat\u00e9riaux sp\u00e9cifi\u00e9s au Spiral HQ pour la recherche.
b.p_r9_mat_4 = Spiral HQ est toujours \u00e0 la recherche de comprendre les cr\u00e9atures qui \
