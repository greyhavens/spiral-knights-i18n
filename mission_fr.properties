#Cobalt

m.hall_of_heroes_cobalt_1a = Bienvenue, {0}. Je m'appelle Jorin, un chevalier qui a ma\u00eetris\u00e9 les \u00e9\
  quipements standard de Spiral Knights. J'ai des recettes pour fabriquer des armes et des \u00e9quipements tr\u00e8s fiables.\n\
  \n\
  M\u00eame si vos armes ne sortent pas des dommages sp\u00e9ciaux, ou que vos armures ne vous \
  prot\u00e8gent pas contre des conditions d'\u00e9tat, \u00e7a ne dit rien - vous pourriez \
  encore donner un chair de poule aux monstres. Je me sp\u00e9cialise dans les \u00e9quipements \
  qui sont utiles pour n'importe quelle situation. Il garde votre vie et donne un coup de poing \u00e0 \
  presque tous les monstres qui vous approchent.

r.hall_of_heroes_cobalt_1a = Bon, voyons ce que vous avez \u00e0 offrir. (Voyez les recettes)
r.hall_of_heroes_cobalt_1b = Terminer la conversation.


#Striker

m.hall_of_heroes_striker_1a = Salutations {0}. Je m'appelle Echo, un chevalier qui utilise les \u00e9\
  quipements convenables pour un striker d'escadron. J'ai des recettes desquelles vous pouvez \
  utiliser pour fabriquer des armures et bouclier qui concentrent sur du combat de pr\u00e8s et rapide.\n\
  \n\
  L'arsenal d'un striker se concentre sur la vitesse. Les \u00e9quipements que je me sp\u00e9\
  cialise vous permettent de devenir un chevalier qui saute dans la bataille et frappe des \
  monstres avant que votre escadron tiennent un coup de feu.

r.hall_of_heroes_striker_1a = Bon, voyons ce que vous avez \u00e0 offrir. (Voyez les recettes)
r.hall_of_heroes_striker_1b = Terminer la conversation.

#Heavy

m.hall_of_heroes_heavy_1a = Allo {0}, je m'appelle Izola, un chevalier qui utilise des \u00e9quipements id\u00e9\
  aux pour un gardien d'escadron. Mes recettes produisent des armures fortement d\u00e9fensives \
  et des armes qui frappent fort.\n\
  \n\
  Les grands armements demandent du moment pr\u00e9cis pour \u00eatre \u00e9fficaces et l'\u00e9\
  quipement vous ralentira un peu. Mais ce que vous perdez dans la rapidit\u00e9, vous gagnerez \
  dans la puissance. Mon \u00e9quipement fera de vous un chevalier qui restera vivant face aux \
  monstres les plus f\u00e9roces.

r.hall_of_heroes_heavy_1a = Bon, voyons ce que vous avez \u00e0 offrir.  (Voyez les recettes)
r.hall_of_heroes_heavy_1b = Terminer la conversation.

#Gunner

m.hall_of_heroes_gunner_1a = Salut {0}, je m'appelle Daxen. Je suis un chevalier qui se sp\u00e9cialise dans les armes \u00e0 \
  feu. Mes recettes produisent des armes et des \u00e9quipements qui sont parfaits pour le \
  combat \u00e0 distance... vous savez, pour tirer des choses.\n\
  \n\
  Les pistolets vous permettent de frapper vos enemmis d'une distance s\u00e9curitaire, mais \
  ils ne vous donnent pas beaucoup d'options lorsqu'ils se rapprochent. Il faut penser et tirer \
  vite pour \u00eatre un bon tireur. Vous serez un buteur avec mes \u00e9quipements, pas un \
  cadavre.

r.hall_of_heroes_gunner_1a = Bon, voyons ce que vous avez \u00e0 offrir. (Voyez les recettes)
r.hall_of_heroes_gunner_1b = Terminer la conversation.

#Bomber

m.hall_of_heroes_bomber_1a = Bonjour {0}, je m'appelle Remi, un chevalier qui se sp\u00e9\
  cialise dans les bombes et explosifs. Les recettes que je vous donne sont assez simples - ils \
  produisent des armes et \u00e9quipments qui r\u00e9duira vos ennemis en milles morceaux!\n\
  \n\
  Avec des bombes, pourtant, on ne peut pas tirer et oublier. Afin de maximiser leur \u00e9fficacit\u00e9s, les bombes n\u00e9cessitent une compr\u00e9\
  hension de moment, avant et apr\u00e8s de les d\u00e9ployer. Mes \u00e9quipements feront de \
  vous le chevalier qui part en avance pour d\u00e9truire plusieurs ennemis \u00e0 la fois. Les \
  bombes sont parfait pour sauter toute une meute de b\u00eates avec un PAF!

r.hall_of_heroes_bomber_1a = Bon, voyons ce que vous avez \u00e0 offrir. (Voyez les recettes)
r.hall_of_heroes_bomber_1b = Terminer la conversation.

#Piercing Def

m.hall_of_heroes_piercing_1a = Bonjour {0}, je m'appelle Walkon, un chevalier qui utilise les \u00e9\
  quipements qui offrent la haute d\u00e9fense per\u00e7ant. J'ai des recettes desquelles vous \
  pouvez utiliser pour fabriquer les armures et bouclier qui vous prot\u00e8ge contre des \
  attaques per\u00e7antes venant de blobeux et b\u00eates.\n\
  \n\
  La meilleure partie de choisir la d\u00e9fense per\u00e7ante? C'est que les armures sont \
  fabriqu\u00e9es avec des mat\u00e9riels doux, spongieux, et gel\u00e9es. Vous pourriez vous \
  s'endormir dans ces armures!

r.hall_of_heroes_piercing_1a = Bon, voyons ce que vous avez \u00e0 offrir. (Voyez les recettes)
r.hall_of_heroes_piercing_1b = Terminer la conversation.

#Elemental Def

m.hall_of_heroes_elemental_1a = Salutations {0}. Je m'appelle Archilus, un chevalier qui \
  utilise les \u00e9quipements qui offrent la haute d\u00e9fense contre les \u00e9l\u00e9\
  mentaires. J'ai des recettes desquelles vous pouvez utiliser pour fabriquer des armures et \
  boucliers qui vous prot\u00e8gent contre des attaques \u00e9l\u00e9mentaires de m\u00e9caniques et gremlins.\n\
  \n\
  Des armures r\u00e9sistantes aux \u00e9l\u00e9ments sont adapt\u00e9es de la t\u00e9chnologie \
  d'Owlite. Bien que les Owlites n'existent plus, sa excellente ma\u00eetrise des \u00e9l\u00e9\
  ments survivent encore dans ces \u00e9quipements.

r.hall_of_heroes_elemental_1a = Bon, voyons ce que vous avez \u00e0 offrir. (Voyez les \
  recettes)
r.hall_of_heroes_elemental_1b = Terminer la conversation.

#Shadow Def

m.hall_of_heroes_shadow_1a = Bonjour {0}, je m'appelle Sylvin, un chevalier qui utilise les \u00e9\
  quipements qui offrent la haute d\u00e9fense contre les ombres. J'ai des recettes desquelles \
  vous pouvez utiliser pour fabriquer des armures et boucliers qui vous prot\u00e8gent contre \
  des attaques ombreuses de d\u00e9mons et de mort-vivants.\n\
  \n\
  On peut exploiter la d\u00e9fense ombreuse par les ombres lui-m\u00eame. Les armures et \
  boucliers que je me sp\u00e9cialise sont d\u00e9riv\u00e9s de cr\u00e9atures tr\u00e8s d\u00e9\
  monaiques qui cherchent d'utiliser la puissance d'ombre contre vous-m\u00eame. En plus, ces \u00e9\
  quips apparaissent incroyablement effrayants et cools.

r.hall_of_heroes_shadow_1a = Bon, voyons ce que vous avez \u00e0 offrir.(Voyez les recettes)
r.hall_of_heroes_shadow_1b = Terminer la conversation.

#Specialist

m.hall_of_heroes_specialist_1a = Bonjour {0}, je m'appelle Zebulon, un chevalier qui utilise l'\u00e9quipement sp\u00e9cialis\u00e9\
  e lesquelles vous convient pour des sc\u00e9narios sp\u00e9cifiques. J'ai des recettes \
  desquelles vous pouvez utiliser pour fabriquer des armes qui ciblent des certaines familles \
  de monstres et des \u00e9quipements avec les types de d\u00e9fense assortis.\n\
  \n\
  Quelquefois vous avez vraiment besoin d'une \u00e9p\u00e9e qui frappe les mort-vivants ou une \
  armure qui augmente votre comp\u00e9tence d'\u00e9craser les blobeux. Ma sp\u00e9cialit\u00e9 est dans des \u00e9quipements cr\u00e9\u00e9s pour une t\u00e2che sp\u00e9\
  cifique, mais ils sont supers \u00e0 m\u00e9langer et assortir avec les autres sets. Exp\u00e9rimentez!

