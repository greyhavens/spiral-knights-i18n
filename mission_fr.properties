n.new_threat_bystander_1d = Chevalier v\u00e9t\u00e9ran
m.new_threat_bystander_1d = J'ai entendu une explosion derri\u00e8re le labo!\n\
  \n\
  Nous nous occupons de ces monstres, {0}. Assurez-vous que l'artifice est en s\u00e9curit\u00e9! D\u00e9p\u00eachez-vous!

#Rhendon
m.new_threat_6a = Il y avait du bruit et explosions venant du laboratoire ce moment-l\u00e0. Je \
  pense que nous sommes en butte aux attaques! Pr\u00e9pare-toi. Je n'ai aucune id\u00e9e sur de quoi se passe l\u00e0-bas, mais nous devons \u00eatre pr\u00e9par\u00e9s pour n'importe quoi!

r.new_threat_6a = Terminer la conversation.

m.new_threat_7a = Hss! Alors, c'est vous qui ont vaincu Razwog et pris ce qui appartient \u00e0 moi. Vous n'\u00eates pas digne de poss\u00e9\
  der cet artifice fort donc je suis ici de vous d\u00e9brasser la chose.

r.new_threat_7a = Pas si vite, gremlin!

m.new_threat_8a = Pah! Je ne suis pas un simple gremlin. Je suis les milliers des yeux qui vous \
  observe dans la noirceur. Je suis la lame sifflant qui sussure votre mort. D\u00e9molissez \
  chaque mur et roue dans cette place ex\u00e9crable et vous ne voyez que les t\u00e9n\u00e9bres.\n\
  \n\
  Personne ne peut m'arr\u00eater, comme vous! Hss!

r.new_threat_8a = C'est ce qu'on va voir!

m.new_threat_9a = Tu ne peux pas arr\u00eater ce que tu ne peux pas voir.

#*bamf* (NINJA, VANISH!- screen clearing effect where Herex vanishes)

r.new_threat_9a = H\u00e9, attend-

