# Winterfest Danger Mission Event 7,9
#..................................................................................................
m.p_winterfest_danger_r7 = Assaut Grinchlin!
o.p_winterfest_danger_r7 = Les Grinchlins ont sabot\u00e9 Festiver pour la derni\u00e8re fois. \
  Amenez la bataille chez lui!
b.p_winterfest_danger_r7 = Attention: Ceci est une Mission Dangereuse!\n\
  \n\
  Au nom d'Impostoclaus, Spiral HQ a trouv\u00e9 la base d'op\u00e9rations des Grinchlins n\u00e9\
  fastes. C'est l'heure d'amener la bataille chez lui et terminer le terrorisme de Festiver une \
  fois pour toutes, mais \u00e7a ne sera pas une t\u00e2che facile.\n\
  \n\
  Ceux qui acceptent cette mission doivent gravir Mont Krampus, une marche p\u00e9nible entour\u00e9\
  e d'embuscades Grinchlin et des pi\u00e8ges glaciales et mortelles. En route, on trouvera des \
  abris qui vous permet de rassembler des tr\u00e9sors Grinchlins et s'\u00e9chapper de la \
  montagne, ou continuer en haut vers le sommet pour des butins plus larges! Soyez averti: Les \
  Grinchlins et ses alli\u00e9s sont des bandes de vilains radins et on ne trouvera AUCUN butin \
  de leur corps. Tous les tr\u00e9sors trouv\u00e9s sur Mont Krampus sont aux abris. Et si vous \
  passez ces tr\u00e9sors pour des r\u00e9compenses plus grandes en haut, vous risquez de \
  perdre le tout si vous \u00e9chouez!\n\
  \n\
  On dit qu'\u00e0 la cime de Mont Krampus, il y a une cachette de butins Gremlin qui contient \
  des tr\u00e9sors que personne n'a jamais vu...

m.p_winterfest_danger_r9 = Assaut Grinchlin!
o.p_winterfest_danger_r9 = Les Grinchlins ont sabot\u00e9 Festiver pour la derni\u00e8re fois. \
