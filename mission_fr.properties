b.p_moorcroft1 = Quelqu'un ou quelque chose a convoqu\u00e9 une foule de Black Kats maudits \
  dans les Rouages. Ces b\u00eates ombreuses d\u00e9sirent et ont faim de puissance arcane et \
  ils ont saccag\u00e9 une collection precieuse: les grimoires magiques dans les Archives de \
  Moorcroft Manor.\n\
  \n\
  Aux mains de vilains, ces anciens tomes seraient catastrophiques, mais il se trouve que les \
  Black Kats ne peuvent pas lire, alors ils les mangent.\n\
  \n\
  Les habitants du Moorcroft Manor voudraient quelqu'un de recouvrer les anciens Pages qu'on \
  peut trouver dans les estomacs des Black Kats. C'est \u00e0 vous \u00e0 d\u00e9couvrir \
  comment obtenir ces Pages...\n\
  \n\
  Dans cette mission, les \u00e9claireurs ont localis\u00e9 un nid Black Kat dans une r\u00e9gion avec une r\u00e9sistance \u00e9lectrique. R\u00e9cup\u00e9\
  rez ces anciens Pages et retournez-les au Moorcroft Manor!

