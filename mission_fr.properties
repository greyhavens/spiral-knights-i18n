  la plupart des cas, il donnent les monstres la capacit\u00e9 de faire le dommage sp\u00e9cial qui n\u00e9cessite des d\u00e9fenses sp\u00e9ciales pour les r\u00e9sister.\n\
  \n\
  Au niveau 2, une monstre qui inflige le dommage sp\u00e9cial produit toujours le dommage s\u00e9par\u00e9 \
  entre deux parties - normale et sp\u00e9ciale. Par cons\u00e9quent, la d\u00e9fense normale \
  est encore un choix valide.

r.pierce_of_cake_2a = Alors, vous dites que-

m.pierce_of_cake_3a = Oui. \u00c0 ce moment-l\u00e0 vous devez cr\u00e9er un arsenal qui vous \
  prot\u00e8ge contre les types de dommage sp\u00e9cial.\n\
  \n\
  Vos missions actuelles n\u00e9cessitent que vous confronter les monstres avec des attaques \
  per\u00e7antes. Alors, vous devez acqu\u00e9rir des casques, armures, et boucliers qui d\u00e9\
  fendent contre le dommage per\u00e7ant.

r.pierce_of_cake_3a = Les monstres infligent quelles sortes de-

