n.winterfest_danger = Chevalier Tenzhill
m.winterfest_danger_1a = Bonjour! Vous devez \u00eatre le chevalier courageux lequel Spiral HQ \
  a envoy\u00e9 pour s'occuper de ces Grinchlins. Mont Krampus n'est pas comme les autres \
  niveaux, alors laissez-moi la peine de vous renseigner comment \u00e7a marche.

r.winterfest_danger_1a = De l'aide serait tellement utile, alors dites-moi tout ce que vous \
  savez sur la montagne.
r.winterfest_danger_1b = Je n'ai pas le temps pour le bavardage.

m.winterfest_danger_2a = Mont Krampus est le berceau de la faction Grinchlin et ses alli\u00e9\
  s. Ils sont des bandes de bandits radins et ne laissent pas tomber des butins. Tous leurs tr\u00e9sors sont entrepos\u00e9\
  s dans les abris lesquels vous trouverez sur la montagne.

r.winterfest_danger_2a = Continuer

m.winterfest_danger_3a = Ces abris vous offriront deux choix: Partir de la montagne et r\u00e9clamer le tr\u00e9\
  sor Grinchlin, ou continuer en haut de la montagne.\n\
  \n\
  Si vous d\u00e9cidez de continuer, vous passerez les butins dans l'abri, mais vous trouverez \
  plus de tr\u00e9sors au prochain abri.

r.winterfest_danger_3a = Continuer

m.winterfest_danger_4a = L'environnement de Mont Krampus est \u00e9touffant et peu de \
  chevaliers ont la force morale pour atteindre le sommet. Si la marche est trop difficile, \
  prenez la sortie! Sinon, vous risquez de perdre le tout!

r.winterfest_danger_4a = Je comprends.

m.winterfest_danger_5a = Bonne chance \u00e0 vous. Et essayez de rester au chaud!

r.winterfest_danger_5a = Terminer la conversation.

