# RANK 5-1
m.shadow_knows = Les Ombres connaissent
o.shadow_knows = Apprenez sur les monstres qui vous infligent le dommage ombreux
b.shadow_knows = Le Biotech Hahn a sugg\u00e9r\u00e9 qu'avec votre promotion, vous \u00eates pr\u00eat \u00e0 \
  apprendre davantage au sujet des monstres inf\u00e2mes dans les Rouages qui infligent des \
