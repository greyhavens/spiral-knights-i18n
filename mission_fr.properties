m.heart_of_ice_1a = \u00c9coutez-moi, Gardes! Portez vos \u00e9charpes ou foulards et vos \u00e9p\u00e9es aiguis\u00e9\
  es parce que nous allons \u00e0 une place qui n'est pas chauff\u00e9e! Nos \u00e9claireurs \
  rapportent qu'Amu-Sol est un terrain vague rempli avec des d\u00e9mons et des b\u00eates qui sont affam\u00e9\
  es. Cette ville infernale a l'air de r\u00e9pandre les Rouages et si nous ne trouverions pas \
  la cause des temp\u00eates, Cradle aura un long hiver.\n\
  \n\
  Allons-y, Gardes!

r.heart_of_ice_1a = (Terminer la conversation.)

n.heart_of_ice_2a = \u00abNote d\u00e9mona\u00efque\u00bb
m.heart_of_ice_2a = Re: Requ\u00eate d'allocation des ressources, Amu-Sol\n\
  \n\
  Vous recevez ce courriel \u00e0 cause d'une inscription incorrecte/cryptique dans votre requ\u00ea\
  te d'allocation des ressources r\u00e9cente. Veuillez fournir une r\u00e9sum\u00e9 de votre usage pr\u00e9\
  vue pour ces ressources demand\u00e9es:\n\
  - 999 devilites \u00abqui a l'esprit large\u00bb\n\
  - 50 tonneaux de \u00abchoses que les frostifurs mangent\u00bb\n\
  - Un \u00abpilier imposant\u00bb d'everfrost et \u00abtous les \u00e2mes de glace qu'il ram\u00e8ne\u00bb
r.heart_of_ice_2a = (Continuer \u00e0 lire.)

m.heart_of_ice_2b = De plus, les Ressources humaines demande un diagramme d'organisation \u00e0 jour d\u00e8\
  s que possible. J'avais compris que tous les responsabilit\u00e9s de Pit Boss, \
  d'administration et les autres, \u00e9taient livr\u00e9s \u00e0 un \u00abMaulos de gel \u00e9ternel\u00bb, correct?\n\
  \n\
  Cordialement,\n\
  Morgral'm\n\
  Assistant directeur d'Allocation des Ressources, Undercorp

r.heart_of_ice_2b = (Terminer la lecture.)

m.heart_of_ice_3a = Re: Re: Requ\u00eate d'allocation des ressources, Amu-Sol\n\
  \n\
  Merci de votre r\u00e9ponse rapide. Malheureusement, votre requ\u00eate d'allocation des \
  ressources a \u00e9t\u00e9 rejet\u00e9e.\n\
  \n\
  Raison:\n\
  Fourni la r\u00e9sum\u00e9 de besoin des ressources demand\u00e9es: \u00abAcclamez Maulos, \
  grand et terrifiant, le vrai seigneur d'Ab\u00eeme Aveuglant.\u00bb
m.heart_of_ice_3b = En plus, les Ressources humaines attendent encore pour l'organigramme \u00e0 \
  jour. Veuillez remarquer que \u00abTous rel\u00e8vent sous la corruption congelant de Maulos\u00bb \
  est une description inacceptable pour la hi\u00e9rarchie ex\u00e9cutive actuelle.\n\
  \n\
  Cordialement,\n\
  Morgral'm\n\
  Assistant directeur d'Allocation des Ressources, Undercorp

r.heart_of_ice_3a = (Terminer la lecture.)

m.heart_of_ice_4a = Re: Re: Re: Requ\u00eate d'allocation des ressources, Amu-Sol\n\
  \n\
  J'ai contact\u00e9 les Affaires Internes en raison d'une vole d'un pilier d'everfrost et la \u00abdisparition\u00bb de presque 1 000 associ\u00e9s d'inscription de donn\u00e9\
  es, car je crois que cette incident est li\u00e9e \u00e0 votre requ\u00eate d'allocation des \
  ressources qui a \u00e9t\u00e9 rejet\u00e9e.\n\
  \n\
  Les mesures disciplinaires seront n\u00e9cessaires. En plus, veuillez remplir le Plan Am\u00e9\
  lioration Personnel et le retourner d\u00e8s que possible.
m.heart_of_ice_4b = Enfin, veuillez charger votre division \u00e0 cesser d'utiliser notre syst\u00e8\
  me de courriel pour informer les autres divisions d'Undercorp que \u00abLa corruption \
  congelant de Maulos est in\u00e9luctable.\u00bb L'usage incorrecte endommage la productivit\u00e9.\n\
  \n\
  En tant que le mesure disciplinaire de votre division aboutira \u00e0 un d\u00e9m\u00e9nagement \u00e0 \
  la Division de Tourment \u00c9ternel, celle-ci serait notre correspondance finale. Je vous \
  souhaite bonne chance dans votre carri\u00e8re ici au Undercorp.\n\
  \n\
  Cordialement,\n\
  Morgral'm\n\
  Assistant directeur d'Allocation des Ressources, Undercorp\n\
  \n\
  Pi\u00e8ce jointe: Amu-Sol.pip

r.heart_of_ice_4a = Ouvrir la pi\u00e8ce jointe?
r.heart_of_ice_4b = (Terminer la lecture.)

m.heart_of_ice_5a = Cette pi\u00e8ce jointe est alt\u00e9r\u00e9 et impossible de l'ouvrir.

n.heart_of_ice_6a = Garde \u00c9claireur
m.heart_of_ice_6a = Wow, cette chose est un pilier \u00e9norme d'everfrost. Je n'ai jamais vu \
  que des petits quantit\u00e9s, rien comme on voit ici.\n\
  \n\
  L'info que nous avons rassembl\u00e9 nous indique les d\u00e9mons utilisent des grands d\u00e9p\u00f4\
  ts d'everfrost afin de garder les \u00e2mes de ceux qui se sont perdus dedans, comme un \
  prison de glace.\n\
  \n\
  Il semble que Maulos, le grand d\u00e9mon que t'as d\u00e9fait, eut une id\u00e9e diff\u00e9rente et il d\u00e9\
  truirait l'everfrost afin de d\u00e9cha\u00eener des essaims d'\u00e2mes glac\u00e9s dans les \
  Rouages. S'il r\u00e9ussirait... je ne veux pas imaginer le grand nombre de chandails qu'on \
  aurait besoin maintenant...

r.heart_of_ice_6a = (Terminer la conversation.)

m.p_ghost_machine_r4 = Des Fant\u00f4mes dans les machines
o.p_ghost_machine_r4 = Rejoignez les Gardes \u00c9claireurs \u00e0 d\u00e9couvrir la source \
  d'appel de d\u00e9tresse dans la facilit\u00e9 en ruines.
b.p_ghost_machine_r4 = Attention: Celle-ci est une Mission Dangereuse!\n\
  \n\
  Desna et ses Gardes \u00c9claireurs font une \u00e9quipe d'\u00e9lite, et ils sont les \
  responsables de r\u00e9cup\u00e9rer des infos trouv\u00e9es dans les niveaux plus dangereux \
  de Rouages. On pourrait avoir des r\u00e9compenses grandes si on les rejoignent, mais c'est \
  certain que la voyage sera p\u00e9rilleuse!\n\
  \n\
  Spiral HQ a re\u00e7u un appel de d\u00e9tresse d'une facilit\u00e9 en ruines dedans les \
  Rouages. L'appel est arriv\u00e9e dans la forme d'un message digital qui ne dit que \u00absauvez-nous\u00bb\
  . Spiral HQ croit que c'est un pi\u00e8ge et il a envoy\u00e9 Desna et ses Gardes \u00c9\
  claireurs d'investiguer la facilit\u00e9 et donner assistance \u00e0 la personne qui a envoy\u00e9 le message.

