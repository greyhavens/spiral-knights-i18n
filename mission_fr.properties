m.p_winterfest_r3 = Sauver Festiver!
o.p_winterfest_r3 = Livrer des cadeaux aux orphelins d'Emberlight pour Impostoclaus.
b.p_winterfest_r3 = Pendant chaque Festiver, une faction de gremlins \u00e0 fourrure verte \
  mettent en d\u00e9sordre la ville d'Emberlight. Ces \u00abgrinchlins\u00bb qu'on les appelle, \
  n'arr\u00eatent pas le d\u00e9sordre avant d'apporter tous les cadeaux de la ville \
  d'Emberlight.\n\
  \n\
  Et alors, l'Impostoclaus a demand\u00e9 aux Spiral Knights de d\u00e9fendre la ville et \
  combattre les monstres qui menacent Emberlight. Prenez un cadeau et r\u00e9pondre \u00e0 son \
  appel! Assurez-vous qu'on a un Festiver joyeux dans la ville d'Emberlight.

