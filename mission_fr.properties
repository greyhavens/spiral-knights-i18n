#Conversations in-mission
#Lost Soul 1
n.apocrea_1 = \u00c2me perdue
m.apocrea_1_1a = C'est quoi \u00e7a? Une autre pauvre \u00e2me pr\u00eat pour la r\u00e9colte par l'Apocrea?

r.apocrea_1_1a = O\u00f9 suis-je et de quoi tu parles?

m.apocrea_1_2a = Vous, mon voyageur curieux, vous \u00eates dans le Nexus obsidienne, domaine \
  d'Apocrea. Vous ne verrez probablement jamais le soleil.

r.apocrea_1_2a = Qu'est-ce que tu veux dire? Qui sont l'Apocrea?

m.apocrea_1_3a = Les Apocrea sont des choses cauchmardesques: une l\u00e9gion terrible de \
  spectres \u00e9ther\u00e9s qui immobilisent et d\u00e9vorent tout ce qui reste dans les \u00e2\
  mes, de laquelle est la seule ambition de ces fant\u00f4mes.\n\
  \n\
  Bien que vous vous lancez au-del\u00e0 ce nexus, vous tomberez victime sur l'un de leurs pi\u00e8ges.

r.apocrea_1_3a = Dis-moi \u00e0 propos de ces pi\u00e8ges.

m.apocrea_1_4a = La r\u00e9alit\u00e9 a succomb\u00e9 \u00e0 Apocrea, lesquels ont d\u00e9form\u00e9 \
  l'environment et le transform\u00e9 en pi\u00e8ges. Dans ces pi\u00e8ges ils chassent la vie \
  et r\u00e9coltent leurs \u00e2mes pour un but inconcevable.

r.apocrea_1_4a = Je ne me laisse pas devenir l'un de ces r\u00e9coltes.

m.apocrea_1_5a = Vous ne comprenez rien, vous savez? Vous n'avez aucun choix.

r.apocrea_1_5a = Terminer la conversation.

#Lost Soul 2
m.apocrea_2_1a = C'est quoi \u00e7a? Vous avez encore votre corps. Peut-\u00eatre vous pourriez \
  nous aider.

r.apocrea_2_1a = Vous \u00eates...?

m.apocrea_2_2a = Je ne suis qu'une \u00e2me qui me cache \u00e0 regard d'Apocrea. Mais je \
  refuse \u00e0 perdre espoir. Avant qu'ils ne me trouvent, je ferai tout ce que je peux faire \
  pour sauver une autre \u00e2me de mon destin.

r.apocrea_2_2a = Comment puis-je vous aider?

m.apocrea_2_3a = Vous vous trouverez coinc\u00e9 dans l'un des pi\u00e8ges tendues par \
  l'Apocrea. Si vous \u00eates assez puissant \u00e0 l'\u00e9chapper, peut-\u00eatre vous \
  pouvez sauver les autres \u00e2mes perdues en route d'ascenseur.

r.apocrea_2_3a = J'essayerai. Dites-moi ce que je dois faire.

m.apocrea_2_4a = Les \u00e2mes perdues immobilis\u00e9es par l'Apocrea sont li\u00e9es aux r\u00e9alit\u00e9s qu'ils ont cr\u00e9\u00e9es. Trouvez les \u00e2mes perdues et d\u00e9\
  gagez-les de liens d'Apocrea.

r.apocrea_2_4a = Continuer

m.apocrea_2_5a = Une fois lib\u00e9r\u00e9, vous rassemblerez un Apocrean Sigil comme preuve de \
  vos actions. Apportez-les ici, puis moi et mon ami, nous vous \u00e9changerons contre des tr\u00e9sors sp\u00e9\
  ciaux que j'avais rassembl\u00e9 pendant mes temps dans ce monde. Vous pouvez utiliser ces \
  items pour fabriquer les items rares et puissants en utilisant cet ob\u00e9lisque de cr\u00e9ation l\u00e0-bas.

r.apocrea_2_5a = Je ferai mon mieux.

m.apocrea_2_6a = Bon courage. Voyagez vite et \u00e9squivez leurs prises.

r.apocrea_2_6a = Terminer la conversation.

