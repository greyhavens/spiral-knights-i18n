  les monstres commenceront \u00e0 infliger des types de dommages sp\u00e9ciaux. Il est \
  important de les savoir et de vous pr\u00e9parer comme il faut afin d'\u00e9viter un sort mortel!\n\
  \n\
  L'un de nos chefs Biotechs, Hahn, a pr\u00e9par\u00e9 une courte le\u00e7on sur des monstres per\u00e7\
  ants. Parlez avec lui par comlink avant d'accepter votre prochaine mission.

m.pierce_of_cake_1a = Bonjour, {0}. Spiral HQ m'a inform\u00e9 que vous avez besoin un rapide \
  cours sur les esp\u00e8ces de monstres dans les Rouages qui infligent le dommage per\u00e7ant, non?

r.pierce_of_cake_1a = Oui, ils disent que-

m.pierce_of_cake_2a = Tr\u00e8s bien, {0}, on va commencer. Il me semble que le plus les \
