m.p_halloween_r3 = La R\u00e9colte Obscure
o.p_halloween_r3 = Cherchez une audience avec le Punkin King.
b.p_halloween_r3 = Chaque ann\u00e9e, les \u00c9trangers d'Haven rendent hommage au esprit \
  curieux connu sous le nom de \u00abPunkin King\u00bb afin de s'assurer une bonne r\u00e9colte \
  pour l'automne. Ce fant\u00f4me malicieux s'amuse en jouant un tour \u00e0 son audience mais \
  il est vite de pr\u00e9senter \u00e0 l'audience des bonbons savoureux pour ses peines.\n\
  \n\
  C\u00e9l\u00e9brer le Festival de la R\u00e9colte Obscure et aider les \u00c9trangers en \
  chercher le Punkin King et rendre vos hommages. C'est s\u00fbr que vous rassemblerez quelques \
  bonbons pendant l'aventure, alors visiter la Place de la ville en Haven et \u00e9changer les \
  bonbons pour des prix!

