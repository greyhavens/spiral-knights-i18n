# RANK 1-1
m.first_contact = Premier Contact
o.first_contact = Contactez Agent de Reconnaissance Kora par Comlink.
b.first_contact = Vous \u00eates sorti de votre nacelle d'\u00e9crasement et \u00eates arriv\u00e9 \
  au Camp de refuge au moment que le soleil s'est couch\u00e9 dans le paysage extraterrestre. \
  C'est temps de contacter Spiral HQ en utilisant votre Comlink.

m.first_contact_1a = Ici Agent de Reconnaissance Kora, confirmant votre contact avec Spiral HQ. \
  Je vous servirai comme connexion \u00e0 Spiral HQ pendant votre temps ici sur Cradle et vous \
  fournissez avec l'intelligence pour les missions dangereuses.\n\
  \n\
  Mon briefing des donn\u00e9es sur votre entra\u00eenement dans le Skylark me sugg\u00e8re que vous \u00eates bien pr\u00e9par\u00e9 pour ce qui est \u00e0 \
  venir. J'attends avec impatience de travailler avec vous.

r.first_contact_1a = Super, Kora! Qu'est-ce qui m'attend?

m.first_contact_2a = Vous \u00eates enthousiaste, c'est bien, \u00e7a! Votre mission actuel est \
  de vous rendre dans la ville de Haven o\u00f9 Spiral HQ a \u00e9tabli une base d'op\u00e9\
  rations. Passez le temps n\u00e9cessaire dans le Camp de refuge pour vous pr\u00e9parer pour le trajet.\n\
  \n\
  Profitez des marchands itin\u00e9rants ainsi que le sagesse des autres chevaliers pour \
  apprendre comment survivre dans ce nouveau monde. Je vous contacterai de nouveau un fois que \
  vous avez atteint Haven.\n\
  \n\
  Bonne chance!

r.first_contact_2a = Je pars!

m.abandoned_depot = Le D\u00e9p\u00f4t Abandonn\u00e9
o.abandoned_depot = Apprenez les bases de survie dans le d\u00e9p\u00f4t abandonn\u00e9.
b.abandoned_depot = Un am\u00e9nagement en ruines a \u00e9t\u00e9 r\u00e9nov\u00e9 par les chevaliers post\u00e9\
  s au Camp de refuge. C'est maintenant une place d'entra\u00eenement o\u00f9 on apprend les \
  essentiels de survie dans les Rouages aux nouvelles recrues. Prenez garde! \u00c7a fait \
  partie des Rouages, alors \u00e7a risque d'\u00eatre habit\u00e9 par les monstres de toutes \
  sortes. Soyez prudent!

# Rhendon RC
#...................................................................................................

m.securing_camp = Si vous d\u00e9cidez de l'accepter
b.securing_camp = Avant d'essayer de faire une enqu\u00eate sur les profondeurs grouillant avec \
  des monstres sous le Camp de refuge, Rhendon aimerait de vous renseigner sur les missions \
  envoy\u00e9es par Spiral HQ.
o.securing_camp = Trouvez et parlez \u00e0 Rhendon pour avoir l'acc\u00e8s aux missions.

m.securing_camp_1a = Bin, {0}, nous sommes plut\u00f4t dans le p\u00e9trin. Pour le camp \u00e0 \
  devenir normal, il y a plein de choses \u00e0 faire, alors vous \u00eates authoris\u00e9 de \
  recevoir des missions! Vous pouvez voir les missions disponibles pour vous dans l'Interface \
  de Missions sur votre barre d'Activit\u00e9s.

r.securing_camp_1a = Des Missions?

m.securing_camp_2a = Les missions varient entre les engagements de combat dangereux et les \
  conversations avec des personnes, comme moi. En accomplissant les missions, vous ferez de \
  progr\u00e8s et avancerez dans les rangs, desquels vous gagneront l'acc\u00e8s aux \u00e9\
  quipements puissants. Greta m'a inform\u00e9 que vous vous occuperez \u00e0 r\u00e9tablir l'\u00e9nergie dans le G\u00e9n\u00e9\
  rateur ancien, est-ce que c'est vrai?

r.securing_camp_2a = Oui, c'est \u00e7a.

m.securing_camp_3a = Bon. Soyez attentif. Si la surface du monde est grouillant avec des \
  monstres, qui sait ce qu'on peut trouver dans la noirceur!

r.securing_camp_3a = Merci, Rhendon. Je serai prudent.

m.securing_camp_4a = N'oubliez pas d'accepter cette mission et soyez prudent l\u00e0-bas!

r.securing_camp_4a = Terminer la conversation.

#Old securing camp dialog
m.rc_buddyknight_1a = {0}! J'entends qu'ils vous s\u00e9lectionnait pour sauver le jour, hein? \
  Bon, avant que vous devieniez l'un de ces \u00abh\u00e9ros\u00bb et partiez \u00e0 l'obscurit\u00e9 \
  au-dessous, pourquoi pas se rendre \u00e0 l'autre c\u00f4t\u00e9 du camp et enseigner des \
  monstres, desquels ont ras\u00e9 ce camp, un petit le\u00e7on?

r.rc_buddyknight_1a = Bien s\u00fbr.

# [proto bomb image]
m.rc_buddyknight_2a = Alors, vous aurez besoin d'une bombe comme cela! C'est un Proto Bomb et \
  c'est bon pour faire sauter des choses avec un BOUM!\n\
  \n\
  J'avais une bombe extra dans ma nacelle, alors consid\u00e9rez-la comme une r\u00e9compense \
  en avance pour avoir sauv\u00e9 nos peaux.

# (Rhendon gives you a Proto Bomb)

r.rc_buddyknight_2a = Merci Rhendon, \u00e7a serait utile!

m.rc_buddyknight_3a = Alors, nous allons rendre cette bombe-ci utile.\n\
  \n\
  Vous pouvez accepter les Missions en cliquant sur le bouton \u00abMission\u00bb au-dessus l'\u00e9\
  cran et accepter la mission que je vous ai donn\u00e9.

r.rc_buddyknight_3a = Terminer la conversation.

m.rc_buddyknight_4a = Acceptez ma mission et faisons sauter des trucs!

r.rc_buddyknight_4a = Terminer la conversation.

# After you complete the mission
m.rc_buddyknight_5a = Il semble que le monde lui-m\u00eame ait essay\u00e9 de vous coincer l\u00e0-bas. Une belle fuite...\n\
  \n\
  Soyez sur vos gardes quand vous explorez le g\u00e9n\u00e9rateur ancien au-dessous. Si la \
  surface du monde est grouillant de monstres et truquant avec des pi\u00e8ges, personne ne \
  connait quoi on se trouve dans l'obscurit\u00e9!

r.rc_buddyknight_5a = Merci Rhendon, je serai prudent.

m.securing_camp_b = Prot\u00e9ger le camp
o.securing_camp_b = Aidez Rhendon \u00e0 d\u00e9truire les monstres qui ont envahi le Camp de \
  refuge!
b.securing_camp_b = Avant d'essayer d'investiguer les profondeurs grouillant avec des monstres \
  sous le Camp de refuge, Rhendon aimerait que vous l'aidiez \u00e0 \u00e9liminer les monstres \
  qui ont attaqu\u00e9 le Camp de refuge hier soir.

m.securing_camp_b_1a = Te voil\u00e0, {0}! J'ai commenc\u00e9 \u00e0 penser que tu n'arriverais \
  jamais!\n\
  \n\
  Bon, on va commencer \u00e0 prot\u00e9ger cette place. Mais premi\u00e8rement, tu dois \u00e9\
  quiper le Proto Bomb que je t'ai donn\u00e9. Va \u00e0 la Poste d'arsenal derri\u00e8re moi et \u00e9quipe la bombe.

r.securing_camp_b_1a = J'irai \u00e0 la Poste d'arsenal et \u00e9quiperai mon Proto Bomb!

#[arsenal station highlights]

#[bomb category highlights]

#[proto bomb highlights]

#[image of uncharged to charged states]
m.securing_camp_b_2a = Excellent! Maintenant, un le\u00e7on rapide sur les attaques charg\u00e9es.\n\
  \n\
  On peut faire les attaques charg\u00e9es avec n'importe quelle arme. P\u00e8se sur le bouton \
  ATTAQUE et attend jusqu'\u00e0 la charge est au maximum. On peut se d\u00e9placer pendant la \
  charge!

r.securing_camp_b_2a = D'accord, ensuite?

#[image of gun and sword charge attacks]
m.securing_camp_b_3a = Lorsque l'aura de charge est au maximum, l\u00e2che le bouton ATTAQUE et \
  d\u00e9cha\u00eene une attaque charg\u00e9e et ravageant!

r.securing_camp_b_3a = \u00c7a a l'air facile, d'autre chose?

#[image of bomb charging and explosion]
m.securing_camp_b_4a = Les bombes sont sp\u00e9ciales car elles n'ont aucune attaque de base. \
  Une bombe est utilis\u00e9e SEULEMENT avec une attaque charg\u00e9e, alors \u00e9squive les \
  monstres pendant que tu charge ta bombe!

r.securing_camp_b_4a = Affirmatif, Rhendon.

m.securing_camp_b_5a = D'accord, va t'entra\u00eenter avec ta bombe, puis vas-y et d\u00e9truis ces monstres-l\u00e0!

r.securing_camp_b_5a = Il me semble que \u00e7a soit un plein d'entrain!

#As the player enters the room, a monster door appears behind them.  Focus on Rehndon at the door:
m.securing_camp_b_6a = Quelque chose s'est pass\u00e9! La porte s'est ferm\u00e9 comme un pi\u00e8ge!\n\
  \n\
  D\u00e9fends-toi, {0}!

#The player destroys all the monsters.
m.securing_camp_b_7a = Que diable? C'\u00e9tait quoi \u00e7a? D'o\u00f9 vient la porte?\n\
  \n\
  Il para\u00eet que ce monde sous nos pieds ne nous aime pas, {0}. Sois prudent!\n\
  \n\
  Ben, bon. Je pense que cette r\u00e9gion est hors de danger, au moins avant que la nuit \
  tombe. Revenons au camp.

r.securing_camp_b_7a = Terminer la conversation.

# RANK 1-2

m.crossing_chasm = La Travers\u00e9e du Gouffre
o.crossing_chasm = Traversez le gouffre p\u00e9rilleux et \u00e9tablissez un contact avec \
  Spiral HQ en Haven
b.crossing_chasm = Afin d'arriver \u00e0 la base d'op\u00e9ration de Spiral HQ, vous devez \
  descendre dans les Rouages et traverser un \u00e9norme gouffre. Cette journ\u00e9e sera \
  dangereuse et il serait une bonn\u00e9 id\u00e9e que vous avez tout ce que vous ayez besoin \
  avant de partir.\n\
  \n\
  Lorsque la mission est accomplie, vous laissez le Camp de refuge derri\u00e8re vous.

m.first_contact_b = Premier contact
o.first_contact_b = Contactez Spiral HQ par Comlink
b.first_contact_b = Maintenant que l'\u00e9nergie est r\u00e9tabli au Camp de refuge, vous \
  pouvez utiliser votre comlink pour contacter Spiral HQ et en savoir o\u00f9 se trouver apr\u00e8s l'\u00e9\
  crasement d'Alouette. Lorsque vous avez contact\u00e9 Spiral HQ, vous d\u00e9couvrirez, avec \
  bon espoir, la cause de l'\u00e9crasement et la nature de ce monde extraterrestre auquel vous \
  maintenant cr\u00e9chez.

m.first_contact_b_1a = Ici Agent de Reconnaissance Kora de Spiral HQ! Nous avons re\u00e7u un signal de d\u00e9stresse de vos coordonn\u00e9es, vous me recevez?

r.first_contact_b_1a = Ici {0} d'Alouette. Je vous re\u00e7ois cinq sur cinq, Kora.

m.first_contact_b_2a = Bien de vous rencontrer, {0}. Expliquez-moi votre situation.

r.first_contact_b_2a = (Informer Kora \u00e0 propos de g\u00e9n\u00e9rateur ancien, Razwog, et \
  l'artifice myst\u00e9rieuse.)

m.first_contact_b_3a = Wow, il me semble que vous ayez d\u00e9j\u00e0 eut une grande aventure, \
  {0}! Spiral HQ sera int\u00e9ress\u00e9 avec l'artifice que vous avez r\u00e9cup\u00e9r\u00e9, bien s\u00fb\
  r. C'est remarquable que vous \u00e9tiez capable d'affronter un gremlin dans les Rouages, et \
  que vous surviviez.

r.first_contact_b_3a = Gremlin? Les Rouages?

#[image of gremlins in the Clockworks]
m.first_contact_b_4a = Il para\u00eet que je dois vous informer des nouvelles. Nous sommes tomb\u00e9s sur la plan\u00e8te \u00abCradle\u00bb\
  . Cradle est un monde fascinant car l'int\u00e9rieur entier de la plan\u00e8te est un complexe m\u00e9canique appel\u00e9 \u00ables Rouages\u00bb\
  . Les Rouages sont sous le surface de la plan\u00e8te et ce complexe change toujours.\n\
  \n\
  Les Rouages ont l'air d'\u00eatre cr\u00e9\u00e9s par des \u00abgremlins\u00bb, une esp\u00e8ce \u00e0 \
  fourrure et des monstres malveillantes qui ne sont pas vraiment heureuses de nous voir.

r.first_contact_b_4a = Je voudrais aider si possible. O\u00f9 se trouve Spiral HQ maintenant?

#[image of RC map leading to Haven]
m.first_contact_b_5a = Nous avons d\u00e9couvert une ville appel\u00e9e \u00abHaven\u00bb et nous avons organis\u00e9 une base d'op\u00e9\
  rations dans cette ville-l\u00e0. Les habitants nous donnent de la nourriture, un abri, et d'\u00e9lectricit\u00e9\
  . Ce n'est pas Isora, mais c'est comme chez soi.\n\
  \n\
  J'ai localis\u00e9 votre location. Malheureusement, vous devez traverser un grand ab\u00eeme \
  afin d'arriver au Haven. Maintenant qu'il y a l'\u00e9nergie dans votre camp, il y a un \
  ascenseur qui vous m\u00e8ne dans les Rouages. Peut-\u00eatre vous pourriez arriver chez nous \
  avec cet ascenseur.

r.first_contact_b_5a = Merci Kora, je chercherai un chemin au Haven en travers le gouffre.

m.first_contact_b_6a = J'entendais que c'est vous qui pourriez le faire, {0}!  Bonne chance!

r.first_contact_b_6a = Terminer la conversation.

# RANK 1-3
m.ancient_generator = Le G\u00e9n\u00e9rateur ancien
o.ancient_generator = Explorez le g\u00e9n\u00e9rateur ancien et r\u00e9tablir l'\u00e9lectricit\u00e9 \
  au Camp de refuge avant la nuit tombe!
b.ancient_generator = Le Camp de refuge n'a pas d'\u00e9nergie. Par cons\u00e9quence, c'est \
  impossible de prot\u00e9ger le camp contre les monstres qui attaquent le camp dans la nuit. \
  Le soleil se couche rapidement. C'est \u00e0 vous \u00e0 entrer les profondeurs sombres sous \
  le camp et trouver un g\u00e9n\u00e9rateur ancien.\n\
  \n\
  Si vous pourriez r\u00e9tablir l\u2019\u00e9lectricit\u00e9 au camp, les Spiral Knights \
  fonctionneraient ses tourelles et formeraient un p\u00e9rim\u00e8tre d\u00e9fensif. D\u00e8s que le camp est s\u00e9\
  cure, il serait possible \u00e0 reconnecter au Spiral HQ.

m.ancient_generator_1a = Qu'est-ce qu'on a ici, plus des petits cr\u00e9atures qui sont tomb\u00e9\
  s du ciel? Ici pour prendre ma puissance et d\u00e9ranger ma recherche?\n\
  \n\
  Personne ne perturbe le travail de Razwog, le grand intrigant! Je m'assurerai que vous n'\u00e9chapperez pas en vie!

m.ancient_generator_2a = Vous \u00eates vraiment difficiles! Ne touchez pas l'artifice!\n\
  \n\
  Bah! Je retournerai pour vous!

# RANK 1-4
m.crossing_chasm_b = La Travers\u00e9e du gouffre
o.crossing_chasm_b = Traverser le gouffre p\u00e9rilleux avec Rhendon et arriver au Haven
b.crossing_chasm_b = Vous avez r\u00e9tabli l'\u00e9nergie au Camp de refuge et contact\u00e9 \
  Spiral HQ. C'est le temps d'essayer de traverser le gouffre au nord du Camp de refuge et \
  arriver au Haven, o\u00f9 on se trouve la reste de Spiral Knights qui se r\u00e9fugie.\n\
  \n\
  Afin de traverser le gouffre, vous aurez besoin de prendre un ascenseur, descendre aux \
  Rouages, et d\u00e9couvrir un autre ascenseur \u00e0 monter \u00e0 l'autre c\u00f4t\u00e9. On \
  ne sait rien sur les dangers qui se cachent dans les profondeurs p\u00e9nombres, alors \
  Rhendon vous accompagnera pendant le voyage.

n.arsenal_knight = Technicien
m.arsenal_knight_1a = Derri\u00e8re moi, tu peux utiliser la Poste d'arsenal pour changer tes \u00e9\
  quipements. Lorsque tu descends aux Rouages, tu ne peux changer les \u00e9quipements qu'\u00e0 \
  la Poste d'arsenal comme celle-ci, alors c'est une bonne id\u00e9e de te pr\u00e9parer!

r.arsenal_knight_1a = Terminer la conversation.

m.crossing_chasm_b_1a = Vous pensez que vous pourriez gagner l'artifice, hein? Donnez-le-moi \
  maintenant ou je fais du feu et vous transforme en millions morceaux fumants!

m.chasm_b_rhendon_1a = Il semble que nous n'ayons aucun choix, {0}. \u00c7a ne vaut pas la \
  peine de mourir, ce gadget.

m.crossing_chasm_b_2a = Parfait! Je garderai l'artifice et je vous brulerai en m\u00eame temps!\n\
  \n\
  Hihihi!

m.chasm_b_rhendon_2a = Le monstre!\n\
  \n\
  La place s'\u00e9croule! Il faut que nous trouvons un moyen d'\u00e9teindre ce feu d\u00e8s que possible!

m.crossing_chasm_b_3a = Quoi?! Vous \u00eates encore ici?!\n\
  \n\
  Cet artifice est \u00e0 moi. Vous, bande de chevaliers miserables, vous n'aurez jamais sa \
  puissance!\n\
  \n\
  Je me d\u00e9barasserai de vous!

m.razwog_defeated = Il y a un bizarre symbole cramoisi sur le v\u00eatement de Razwog.

n.cryptic_coder = Code cryptique
m.cryptic_coder = Intrigant Razwog: Travaille loin d'autres. Il faut que l'Ordre ne sachent pas \
  que nous avons l'artifice. Trouve une fa\u00e7on de le faire fonctionner. Am\u00e8ne-le-moi. \
  Ne me trahis. Je le saurai.\n\
  \n\
  -H
r.end_coder = Fermer le message

m.crossing_chasm_b_4a = Merci,  {0}. J'ai pens\u00e9 que nous soyons finis l\u00e0-bas.\n\
  \n\
  Allons-y. Nous devons apporter l'artifice au Spiral HQ avant que quelqu'un d'autre n'essaie \
  de le voler.

m.crossing_chasm_b_5a = H\u00e9, {0}! Je vois que vous avez obtenu un Proto Bomb! C'est \
  vraiment utile contre une foule de monstres.

r.crossing_chasm_b_5a = Comment puis-je l'utiliser?

m.crossing_chasm_b_6a = Les bombes sont sp\u00e9ciales car elles n'ont aucune attaque de base. \
  Une bombe est utilis\u00e9e SEULEMENT avec une attaque charg\u00e9e, alors \u00e9squivez les \
  monstres pendant que vous chargez votre bombe!\n\
  \n\
  Essaie la bombe. N'oublie pas de l'\u00e9quiper \u00e0 la Poste d'arsenal en avant.

r.crossing_chasm_b_6a = Continuer

m.crossing_chasm_b_7a = J'apporterai l'artifice au Lab. Quand t'es pr\u00eat, tu dois voyager \
  au Haven et rencontre les autres. J'ai le pressentiment que nous serions coinc\u00e9s sur ce monde, alors \u00e7\
  a fait du sens d'essayer d'aider notre \u00e9quipe.

r.crossing_chasm_b_7a = Terminer la conversation

# RANK 2-1
#RENAMED FROM get_energrized
m.welcome_to_haven = Bienvenue au Haven!
o.welcome_to_haven = Contactez Agent de Reconnaissance Kora par comlink
b.welcome_to_haven = Ayant surv\u00e9cu le voyage au Haven, vous devez contacter l'Agent de \
  Reconnaissance Kora par comlink afin de la donner votre rapport. Elle poss\u00e8de des donn\u00e9\
  es concernant ce qui vous attend, et aussi des instructions sp\u00e9ciales sur l\u2019utilisation de l'\u00e9nergie.

m.welcome_to_haven_1a = Vous voil\u00e0, {0}!  Je suis bien heureuse de vous voir au Haven sain \
  et sauf. J'aviserai Spiral HQ que vous prenez des missions en Haven. Pour commencer, je vous \
  ai assign\u00e9 quelques missions qui vous aideront \u00e0 vous acclimater \u00e0 tout ce \
  qu'offre Haven. N'oubliez pas de dire bonjour \u00e0 un \u00e9tranger avant d'explorer!

r.welcome_to_haven_1a = Les \u00e9trangers?

m.welcome_to_haven_2a = Les citoyens de Haven s'appellent les \u00c9trangers. Ils sont \
  impossibles \u00e0 manquer - ce sont ces myst\u00e9rieux g\u00e9ants masqu\u00e9s. Malgr\u00e9 \
  leur apparence effrayant, ils nous aident beaucoup et, pour la plupart, restent entre eux. En \
  tout cas, ces \u00e9tranges petits oiseaux semblent les aimer!

r.welcome_to_haven_2a = Je les dirai \u00aballo\u00bb, c'est s\u00fbr.

m.welcome_to_haven_3a = Super, merci d'\u00eatre un bon ambassadeur! \n\
  \n\
  Finalement, je dois vous informer sur quelque chose qu'on appelle \u00abl'\u00c9nergie\u00bb. C'est tr\u00e8\
  s importante ici sur Cradle.

r.welcome_to_haven_3a = Je suis tout ou\u00efe, Kora! Racontez-moi tout au sujet de l'\u00c9nergie!

#(image)
m.welcome_to_haven_4a = L'\u00c9nergie est essentiel pour acqu\u00e9rir les \u00e9quipements et \
  items puissants trouv\u00e9s dans le D\u00e9p\u00f4t des provisions.\n\
  \n\
  Vous d\u00e9couvrirez toutes sortes d'usages pour l'\u00e9nergie dans vos aventures. Cherchez \
  le symbole d'\u00c9nergie!

r.welcome_to_haven_4a = Continuer

m.welcome_to_haven_5a = L'\u00c9nergie est obtenue seulement en achetant avec la monnaie r\u00e9elle ou par l'\u00e9change sur le march\u00e9. Pour l'acheter ou l'\u00e9\
  changer, simplement ouvrez le D\u00e9p\u00f4t des provisions et cliquez sur le bouton \u00abObtenir l'\u00c9nergie\u00bb.

r.welcome_to_haven_5a = Racontez-moi un fois de plus sur l'\u00c9nergie.
#6a -> Repeat tutorial
r.welcome_to_haven_5b = Obtenir l'\u00e9nergie et faire des choses incroyables- j'y suis!

m.welcome_to_haven_6a = Je vous contacterai bient\u00f4t, {0}. Bonne chance!

r.welcome_to_haven_6a = Terminer la conversation.

#WELCOME TO HAVEN B-TEST
m.welcome_to_haven_b = Bienvenue au Haven!
o.welcome_to_haven_b = Contactez Agent de reconnaissance Kora par comlink
b.welcome_to_haven_b = Ayant surv\u00e9cu le voyage au Haven, vous devez contacter Agent de \
  reconnaissance Kora via comlink et fournir votre rapport. Elle a des informations pour des \
  choses \u00e0 faire \u00e0 suite.

m.welcome_to_haven_b_1a = Vous \u00eates arriv\u00e9, {0}! Ravie de vous voir ici sain et sauf. \
  Je confirmerai avec Spiral HQ que vous prendrez des missions au Haven.\n\
  \n\
  Pour commencer, je vous ai donn\u00e9 quelques missions qui vous acclimatent \u00e0 tout ce \
  que Haven vous offre. N'oubliez pas de saluer les \u00c9trangers en explorant.

r.welcome_to_haven_b_1a = Des \u00c9trangers?

m.welcome_to_haven_b_2a = Les habitants natives de Havent sont appel\u00e9s \u00ab\u00c9trangers\u00bb\
  . C'est impossible de les manquer- ils sont des figures d\u00e9mesur\u00e9s et d\u00e9rob\u00e9\
  s avec des masques. Malgr\u00e9 son apparence intimidant, ils ont \u00e9t\u00e9s si \
  serivables et ils se tiennent \u00e0 l'\u00e9cart. Il para\u00eet que les petits oiseaux \
  bizarres les aiment, quand m\u00eame!

r.welcome_to_haven_b_2a = Je serai s\u00fbr de dire allo en voyant un \u00c9tranger.

m.welcome_to_haven_b_3a = Parfait, merci d'\u00eatre un bon ambassadeur!\n\
  \n\
  Je vous contacterai bient\u00f4t, bonne chance {0}!

r.welcome_to_haven_b_3a = Terminer la conversation.

m.reporting_duty = Se Pr\u00e9senter
o.reporting_duty = Presentez-vous \u00e0 Lieutenant Feron dans l'Arcade de Haven.
b.reporting_duty = Lieutenant Feron est charg\u00e9 de la surveillance sur l'op\u00e9ration \
  d'extraire des Rouages dans le Haven Arcade. Rapportez-vous \u00e0 Feron pour comprendre la \
  situation au Haven et la mission de Spiral HQ pour arriver au Core.


m.reporting_duty_1a = Bienvenue, soldat et f\u00e9licitations d'avoir atteint notre base ici au \
  Haven. Je suis Lieutenant Feron. Le capitaine Oslo m'a assign\u00e9 de superviser nos op\u00e9rations mini\u00e8res dans les Rouages.\n\
  \n\
  Devant vous se trouve \u00abl'Arcade\u00bb, un complex fascinant qui nous sert de lien au \
  coeur des Rouages. Puisque vous venez d'arriver, je vous donnerez quelques informations de \
  base sur ce que Spiral HQ fait ici.

r.reporting_duty_1a = \u00c7a a l'air important, racontez-moi tout.

m.reporting_duty_2a = Apr\u00e8s l'\u00e9crasement du Skylark, son noyau primaire de tearium \
  explosa, d\u00e9truisant une partie du vaisseau et nous laissant sans source d'alimentation. \u00c0 \
  date, nous n'avons pas trouv\u00e9 quelque centaines de tonnes de tearium tra\u00eenant \u00e0 \
  terre, notre oiseau a effectivement perdu ses ailes. \n\
  \n\
  Avec l'aide des \u00e9trangers, nous avons r\u00e9ussi d'\u00e9tablir une petite base d'op\u00e9\
  rations ici au Haven. Une fois nos syst\u00e8mes activ\u00e9s, nous avons d\u00e9couvert que dans le c\u0153\
  ur de cette roche se trouve une indication d'\u00e9nergie d'une magnitude sans pr\u00e9c\u00e9dent.

r.reporting_duty_2a = Si seulement on pouvait employer cette \u00e9nergie...

m.reporting_duty_3a = Exactement! Le noyau des Rouages - le \u00abCore\u00bb - pourrait tr\u00e8\
  s bien contenir la source d'\u00e9nergie dont on a besoin pour cr\u00e9er une nouvelle source \
  d'alimentation pour le Skylark et le remettre \u00e0 neuf. Il n'y a qu'un probl\u00e8me - les Rouages eux-m\u00ea\
  me sont construits comme un genre de pi\u00e8ge mortel. \n\
  \n\
  Atteindre le Core ne sera pas facile...

r.reporting_duty_3a = Je suis bien capable!

m.reporting_duty_4a = C'est l'esprit que j'aime voir. Continuez \u00e0 accomplir les missions \
  pour Spiral HQ lorsque vous les recevez. Avec votre aide, il serait possible d'atteindre le \
  Core et sauver Isora.

r.reporting_duty_4a = Affirmatif, Lieutenant.

m.reporting_duty_5a = Alors, je vous autorise de prendre des Missions d'Arcade. Vous pouvez \
  avoir d'acc\u00e8s \u00e0 l'Arcade via votre interface de Missions, ou en approchant les \
  portes ici dans l'Arcade. Il y a un grand monde sous vos pieds attendant d'\u00eatre explor\u00e9.\n\
  \n\
  Bonne chance \u00e0 vous!

r.reporting_duty_5a = Terminer la conversation.

m.go_shopping = Magasinons!
o.go_shopping = Visitez le Bazar de Haven et d\u00e9couvrez tout ce qu'il offre.
b.go_shopping = Le Bazar de Haven est une place o\u00f9 toutes sortes des choses et services \
  sont trouv\u00e9s. Vous cherchez une \u00e9p\u00e9e plus puissante ou rendre votre armure \
  fabuleuse? C'est au Bazar!

m.go_shopping_1a = Bienvenue au Bazar de Haven! Il me fait plaisir de vous rencontrer, {0}. Je \
  m'appelle Bechamel. Puisque je travaille ici au Bazar, Spiral HQ m'a demand\u00e9 de bien \
  accueillir les nouveaux arriv\u00e9s et de leur montrer ce fabuleux \u00e9picentre de \
  commerce afin qu'ils voient tout ce qu'il a \u00e0 offrir.  \n\
  \n\
  Alors, partons en tourn\u00e9e! Ne tra\u00eenez pas, je marche vite.

r.go_shopping_1a = Montrez la voie, Bechamel.
#(move to Quillion)

m.go_shopping_2a = Les \u00e9trangers comme Quilllion vous vendront des armes et armures. \
  Chacun se sp\u00e9cialise dans un type d'article, alors je vous conseille de leur parler pour \
  d\u00e9couvrir ce qu'ils marchandent. Ils ne sont pas bavards, mais ils rafra\u00eechissent leur stock \u00e0 chaque journ\u00e9e!\n\
  \n\
  Assurez-vous que vous atteignez le rang minimum pour \u00e9quiper un item!

r.go_shopping_2a = Vendent-t-ils d'autre choses apart les armes et l'\u00e9quipement?

m.go_shopping_3a = Je suis content que vous avez demand\u00e9, certainement! Suivez-moi chez \
  Vatel.

r.go_shopping_3a = (Suivez Bechamel)
#(move to Vatel)

m.go_shopping_4a = Voil\u00e0 Vatel. Il vous vendra une s\u00e9lection de recettes ainsi que \
  des changeurs de couleur personnel et d'autres choses.

r.go_shopping_4a = Des recettes? Pour des armes et l'\u00e9quipement?

m.go_shopping_5a = C'est exact. Vous pouvez acqu\u00e9rir des recettes et des mat\u00e9riaux \
  afin d'alchimiser des armes et \u00e9quipements aux stations d'alchimie. Venez, je vous en \
  montrerez un.

r.go_shopping_5a = Affirmatif.
#(move to alchemy station)

m.go_shopping_6a = Ici se trouve un des stations d'alchimie qui deviendront sans doute tr\u00e8\
  s familiers au fur et au mesure de l\u2019agrandissement de votre arsenal. Mais ne concernez \
  vous pas trop pour l'instant, Spiral HQ vous donnera surement un mission plus tard qui vous \
  expliquera tout. \n\
  \n\
  Et voil\u00e0 pour votre premi\u00e8re tourn\u00e9e. Aimeriez-vous le r\u00e9p\u00e9ter, ou \
  l'avez-vous bien compris?

r.go_shopping_6a = J'aimerais faire la tourn\u00e9e encore.
r.go_shopping_6b = Je crois l'avoir compris, Bechamel. Merci!

m.go_shopping_7a = Ce n'est rien, j'ai plein de temps. Commen\u00e7ons du d\u00e9but.

r.go_shopping_7a = (Suivez Bechamel)
#(starts at Quillion)
m.go_shopping_7b = Merveilleux! Je suis heureux d'avoir pu vous aider \u00e0 vous situer. Bonne \
  chance, {0}!

r.go_shopping_7b = Merci, Bechamel! \u00c0 bient\u00f4t!

# ----- GO SHOPPING B-TEST -----------------------------------------
m.go_shopping_b = Probl\u00e8mes de Bazar
o.go_shopping_b = Aidez un chevalier ayant des ennuis
b.go_shopping_b = Le Bazar de Haven est une place \u00e0 laquelle on trouve tout sorts de \
  marchandises et services. Cependant, il semble qu'il ait du brouhaha d\u00e9hors la march\u00e9 anim\u00e9e. Il para\u00ee\
  t qu'on ne perd aucun temps; \u00e7a sent de roussi!

m.go_shopping_b_1a = Ouf, je suis reconnaissant que vous \u00eates l\u00e0. Ces gremlins fichus \u00e9taient pr\u00eats \u00e0 d\u00e9\
  molir le tout! Le bazar pourrait \u00eatre en ruines!\n\
  \n\
  Ah oui, o\u00f9 sont mes mani\u00e8res? Je m'appelle Tylen, ravi de vous rencontrer, {0}.

r.go_shopping_b_1a = Tout est d'accord, Tylen?

m.go_shopping_b_2a = Maintenant, oui. J'\u00e9tais seulement en route vers le bazar pour \
  laisser quelques provisions quand j'\u00e9tais attaqu\u00e9 par ces gremlins. J'ai pens\u00e9 \
  qu'ils venaient d'Emberlight, une colonie de gremlins proscrits, mais il semble que je me \
  fusse tromp\u00e9.\n\
  \n\
  Alors, au cas o\u00f9, pourriez-vous m'aider \u00e0 livrer ces items au bazar?

r.go_shopping_b_2a = Bien s\u00fbr, venons au Bazar.

m.go_shopping_b_3a = Ouf, \u00e7a se passe plus rapidement avec votre aide, {0}. \u00c9coutez, \
  si vous avez besoin une visite autour le bazar, venez parler avec moi. Je peux vous \
  renseigner tous ce que vous voulez savoir sur les magasins et services ici.\n\
  \n\
  Allez-y, jetez l'\u0153il! Je suis certain que vous trouverez beaucoup de choses int\u00e9ressants. Merci encore!

r.go_shopping_b_3a = Terminer la conversation.

m.pumping_up = Se Pr\u00e9parer
o.pumping_up = Visitez la Salle d'entrainement avanc\u00e9e et apprenez de nouveaux techniques \
  utiles.
b.pumping_up = Vous \u00eates libre \u00e0 utiliser la Salle d'entrainement avanc\u00e9 quand \
  vous aimeriez pratiquer avec des nouvelles armes ou apprendre aux autres \u00e9l\u00e9ments \
  des Rouages. Venez le voir et trouvez tout ce qu'il offre!

# Show image of training hall entrance
m.pumping_up_1a = Bonjour {0}. Le nom est Konway. Spiral HQ dit que vous avez besoin des \
  conseils additionnels pour vous aider pour vos missions \u00e0 venir. Voulez-vous me \
  rejoindre \u00e0 Salle d'entra\u00eenement avanc\u00e9 pour le bref r\u00e9sum\u00e9?

r.pumping_up_1a = Bien s\u00fbr, Konway. Je viens tout de suite.

m.pumping_up_2a = Bienvenue \u00e0 la Salle d'entra\u00eenement avanc\u00e9, {0}. Ici, vous \
  trouverez des conseils utiles pour vous aider \u00e0 survivre vos voyages dans les Rouages. \n\
  \n\
  Aimerez-vous une visite autour la facilit\u00e9?

r.pumping_up_2a = Oui. [Suivez Konway]
r.pumping_up_2b = Non merci, je m'\u00e9gare tout seul.

m.pumping_up_3a = Ici, nous avons une collection d'items et objets pr\u00e9cieux que vous \
  trouverez souvent dans les Rouages.

r.pumping_up_3a = Continuer

m.pumping_up_4a = Quelques items sont utilis\u00e9s pour attaquer les monstres, comme ces \
  fioles-ci. Vous pouvez les ramasser et les jeter \u00e0 cette cible ici.

r.pumping_up_4a = Continuer

m.pumping_up_5a = Sur le mur au nord, nous avons tout sorts de blocs, interrupteurs, portes, et \
  boutons venant des Rouages. Si vous voulez surmonter les difficult\u00e9s de m\u00e9canismes \
  mortelles, je vous conseille d'\u00eatre familier avec les m\u00e9chaniques de ces choses-l\u00e0!

r.pumping_up_5a = Continuer

m.pumping_up_6a = Vers l'est, nous avons quelques salles pour pratiquer le combat. Ces Training \
  Cubes sont surtout inoffensifs et parfaits pour les experimentations de vos armes et \
  techniques de bouclier!

r.pumping_up_6a = Continuer

m.pumping_up_7a = Et enfin, nous avons les salles de pi\u00e8ges et risques. Vous pouvez venir \
  ici pour savoir comment vous pourriez affecter les pi\u00e8ges et apprendre les pi\u00e8ges \
  qui font les dommages diff\u00e9rents.

r.pumping_up_7a = Continuer

m.pumping_up_8a = Alors, c'est la fin de la visite, {0}. Voulez-vous une autre visite ici ou \u00eates-vous pr\u00ea\
  t pour essayer des choses et explorer seul?

r.pumping_up_8a = R\u00e9capitulons. [Recommencer la visite]
r.pumping_up_8b = Non, je suis pr\u00eat \u00e0 partir.

m.pumping_up_9a = D'accord, nous reprenons la visite.

# Show image of training hall entrance
m.pumping_up_9b = Parfait, donc je vous donnerai du cr\u00e9dit pour cette mission.\n\
  \n\
  N'oubliez pas que si vous voulez retourner ici pour plus d'entrainement, la Salle \
  d'entrainement avanc\u00e9 est situ\u00e9e dans la Place de la ville au Haven. Soyez prudent, \
  {0}.

r.pumping_up_9a = Continuer
r.pumping_up_9b = Merci! Je vais m'entrainer. [Accomplir la mission]

