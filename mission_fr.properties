m.elemental_my_dear_2a = Excellent, alors nous sommes bien partis! Les dommages \u00e9l\u00e9mentaires sont g\u00e9n\u00e9\
  ralement produits par des attaques \u00e9nergetiques, compris de tout: des tirs de lasers \
