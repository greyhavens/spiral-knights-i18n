# Mission Start

m.anniversary_start_1 = {0}! Je suis tellement heureuse de te voir! C'est un peu chaotique ici.

r.anniversary_start_1 = Qu'est-ce qu'il passe, Biscotti?

m.anniversary_start_2 = Euh, voila... je suis la responsable de cuisiner les g\u00e2teaux pour la grande c\u00e9l\u00e9\
  bration d'anniversaire Spiral Knights et j'ai \u00e9t\u00e9 peut-\u00eatre un petit peu folle \
  quand j'ai dit que je pourrais cuisiner deux milliers de g\u00e2teaux dans une semaine.\n\
  \n\
  Pour acc\u00e9l\u00e9rer le processus j'ai utilis\u00e9 peut-\u00eatre un petit peu de mati\u00e8\
  re noir et pur et non-raffin\u00e9 au lieu de levure...

r.anniversary_start_2 = T'as fait quoi?!

m.anniversary_start_3 = En tout cas, il semble que cette nouvelle \u00abrecette\u00bb causait des g\u00e2\
  teaux de se transformer en monstres qui ont frapp\u00e9 ma cuisine puis ils ont infest\u00e9 \
  les Rouages. J'aimerais d'avoir ma cuisine retourn\u00e9e dans mes mains, alors pourriez-vous \
  m'aider \u00e0 d\u00e9truire ces Creep Cakes horribles?

r.anniversary_start_3 = M\u00eame si ma formation de combat n'incluait jamais des confiseries, \
  je t'aiderai.

m.anniversary_start_4 = Excellent! Je vous rencontrai \u00e0 la sortie lorsque vous avez mit \
  les monstres en pi\u00e8ces. Soyez prudent, il semble qu'ils aient appris comment utiliser \
  les bougies de f\u00eate comme des armes...

r.anniversary_start_4 = Terminer la conversation.

# Mission End


m.anniversary_end_1 = {0}! Tu l'as fait! Ma cuisine est \u00e0 moi, finalement!\n\
  \n\
  N'oubliez pas que vous pouvez \u00e9changer les Cake Slices re\u00e7us contre des casques \
  fantastiques de Maskwell dans la Place de la ville au Haven. On dit que le diction du \
  boulanger, c'est \u00abPorte les peaux de g\u00e2teau sur ton corps!\u00bb\n\
  \n\
  D'accord, peut-\u00eatre c'est moi qui le dit.

r.anniversary_end_1 = Terminer la conversation.

# Gremlin Chef finale

m.anniversary_gremlin_1a = Un soup\u00e7on de Moonstone, un peu de... C...Comment avez-vous... \
  qui \u00eates-vous!? Vous ne devez pas \u00eatre ici!

m.anniversary_gremlin_1b = Allez, allez, va-t'en! Trop de chefs dans la cuisine! Trop de chefs \
  dans la cuisine!

m.anniversary_gremlin_2 = Que faites-vous!? Mes g\u00e2teaux! Mes beaux g\u00e2teaux! Tol\u00e9rance z\u00e9ro!

m.anniversary_gremlin_3 = Guuuurk! Quelle puissance! Vous serez consomm\u00e9s et votre force ajout\u00e9e \u00e0 la mienne!

m.anniversary_gremlin_4a = Toi... je... qu'est-ce qu'il passe? Vous avez dit quelque chose?

r.anniversary_gremlin_4a = Biscotti m'a demand\u00e9 d'aller vous voir.

m.anniversary_gremlin_4b = Ah non! Dites-elle que les g\u00e2teaux seront pr\u00eats. Euh... \
  moi, je suis seulement en retard, oui. H\u00e9, \u00e9coutez: je vous donnerai plus de g\u00e2\
  teaux si vous garderez ceci un secret entre nous-m\u00eames. Je ne veux pas \u00eatre vid\u00e9 du groupe.

