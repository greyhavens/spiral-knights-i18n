m.p_r9_gate_beast = La Nature de la b\u00eate
o.p_r9_gate_beast = Sauvez les Geo Knights d'embrayage des b\u00eates sauvages!
b.p_r9_gate_beast = Nos Geo Knights risquent ses vies quand ils travaillent dans les pleines de \
  nature dans les Rouages. Pendant que ses conclusions sont pr\u00e9cieuses, ils sont souvent \
  post\u00e9s dans le c\u0153ur de territoire des Wolvers. Ces b\u00eates sauvages traquent \
  implacablement nos Geo Knights, et les saisissent dans la nuit quand ils sont sans \
  surveillance. Quelques fois, les wolvers formeront une bande et agressent une \u00e9quipe \
  entier de recherche. C'est pendant ces temps qu'un escadron talenteux doit \u00eatre appel\u00e9 pour les sauver.

m.p_r9_gate_slime = Un Peu de Sel
o.p_r9_gate_slime = Livrez un cargaison de sel \u00e0 l'\u00e9quipe de recherche stationn\u00e9\
  e dans la Caverne des Lichens!
b.p_r9_gate_slime = La meilleure fa\u00e7on de tenir les blobeux \u00e0 distance est avec une \
  abondante quantit\u00e9 du sel gemme. Les blobeux ha\u00efssent ces choses-l\u00e0, car ils \
  dissolveront en touchant le sel. Ce n'est pas joli.\n\
  \n\
  Des \u00e9quipes de recherche post\u00e9es aux cavernes entourent souvent son camp avec du \
  sel gemme afin de ne pas devenir le souper de blobeux. Comme vous pourriez imaginer, le sel \
  est \u00e9puis\u00e9 rapidement. Quand les r\u00e9serves de sel sont baiss\u00e9es, on \
  appelle un escadron talenteux pour frayer son chemin et livrer l'assaisonnement de sauvetage.

m.p_r9_gate_construct = Assaut sur Atelier d'appareil 13
o.p_r9_gate_construct = D\u00e9truisez les engins de guerre fonctionnant dans l'usine ruin\u00e9e!
b.p_r9_gate_construct = Les gremlins ne sont pas tr\u00e8s diligents quand \u00e7a vient au \
  nettoyage. Nos Chevaliers \u00c9claireurs tombent souvent sur des usines d'armes hors de \
  service. Ces usines bourdonnent encore avec des m\u00e9caniques hostiles, et dans quelques \
  cas, avec des machines de guerre en \u00e9tat de marche!\n\
  \n\
  Spiral HQ a ordonn\u00e9 que ces usines et machines de guerre soient d\u00e9sactiv\u00e9s d\u00e9finitivement pour \u00e9\
  viter plus des victimes dans le futur.

m.p_r9_gate_gremlin = Cambriolage dangereux
o.p_r9_gate_gremlin = Volez les sch\u00e9mas gremlin de leur site de construction!
b.p_r9_gate_gremlin = Fr\u00e9quemment, les sites de construction gremlins contiennent les sch\u00e9matiques pr\u00e9\
  cieuses de structures gremlins et m\u00eame des armes. D\u00e8s que Spiral HQ les obtient, \
  ils donnent des aper\u00e7us rares d'ing\u00e9nierie gremlins.\n\
  \n\
  Des sch\u00e9matiques gremlins sont typiquement entrepos\u00e9s dans les terminaux au quelque \
  part sur place. Ces terminaux sont verrouill\u00e9s et bien prot\u00e9g\u00e9s. D\u00e8s que \
  vous attirez l'attention d'un gremlin, atteignez pour une \u00e9quipe enti\u00e8re de vous chasser!

m.p_r9_gate_fiend = Les Captifs cols blancs
o.p_r9_gate_fiend = Lib\u00e9rez les chevaliers de prison corporatif et diabolique!
b.p_r9_gate_fiend = Une ville diabolique est une place \u00e9trang\u00e8re que Spiral HQ ne \
  comprend encore. Des Devilites sont partout, et s'ils voient l'un de ses Pit Bosses tout pr\u00e8\
  s, ils feront n'importe quoi pour avoir l'air d'\u00eatre productifs. Malheureusement, la \
  productivit\u00e9 est d\u00e9fini par attaquer ou emprisonner des intrus, comme un escadron \
  de chevaliers passant.\n\
  \n\
  Ce n'est pas clair de pour quel motif des chevaliers emprisonn\u00e9s servirait ultimement \
  dans un ordre du jour. Ceux qui ont surv\u00e9cu la captivit\u00e9 ont rapport\u00e9 que les \
  conditions sont pauvres, mais le pire de ces conditions sont les paperasseries copieuses \
  qu'ils ont besoin rempli quotidiennement. C'est un sort que rien des chevaliers m\u00e9ritent!

m.p_r9_gate_undead = Mort de Peur
o.p_r9_gate_undead = Sauver le Chevalier perdu de joindre les rangs des morts dans le manoir \
  hant\u00e9!
b.p_r9_gate_undead = Les ruines de ch\u00e2teaux d'Owlite sont des places sombres et maudits \
  qui grouillent avec des l\u00e9gions de spookats mort-vivants. Le pire de sorts est le \
  grimalkin, semblant invincible, se cache dans les ombres, en attendant le moment que la lumi\u00e8re de sauvetage s'\u00e9teint.\n\
  \n\
  Quelques chevaliers succombent \u00e0 l'obscurit\u00e9 et deviendront paralys\u00e9 avec peur \
  dans ces domaines ombreuses. La seule chose qui peut les sauver sont des chevaliers courageux \
  qui ont perdu depuis longtemps ses peurs d'enfance et tous les cr\u00e9atures terribles qui \
  se cachent de l'int\u00e9rieur.

