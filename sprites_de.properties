#
# Battle Sprite translation messages

# Sprites
d.drakon = Der Drakon ist ein Kampfsprite, der feurige Zerst\u00f6rung verk\u00f6rpert. Seine F\u00e4\
  higkeiten konzentrieren sich auf rohe, offensive Angriffskraft.

d.seraphynx = Der Seraphynx ist ein Kampfsprite, der Schutz und Genesung verk\u00f6rpert. Seine F\u00e4\
  higkeiten konzentrieren sich darauf, Knights im Kampf mit Schutz und Genesung zu unterst\u00fctzen.

d.maskeraith = Der Maskeraith ist ein Kampfsprite, der die Schatten verk\u00f6rpert. Seine F\u00e4\
  higkeiten konzentrieren sich auf T\u00e4uschung und t\u00f6dliche Gifte.



# Generic Skills and Augments

m.focus = Fokus
d.focus = Reduziert den F\u00e4higkeits-Cooldown.

m.skill = F\u00e4higkeit
m.skill_power = F\u00e4higkeits-St\u00e4rke

# Drakon Skills and Augments

m.firebolt = Feuerball
d.firebolt = Schie\u00dft einen sengenden Feuerball ab der beim Einschlag explodiert.

m.impact = Einschlag
d.impact = Erh\u00f6ht den Schaden von Feuerball.

m.extra_crispy = Extra Knusprig
d.extra_crispy = Erh\u00f6ht die Kraft des Feuers und die Chance, Ziele zu entz\u00fcnden.

m.concussive_firebolt = Ersch\u00fctternder Feuerball
d.concussive_firebolt = F\u00fcgt dem Feuerball die Chance auf eine m\u00e4chtige Bet\u00e4ubung hinzu.

m.meteoric_firebolt = Meteoriten-Feuerball
d.meteoric_firebol = Vergr\u00f6\u00dfert die Gr\u00f6\u00dfe der Explosion des Feuerballs.

m.flame_barrier = Flammenbarriere
d.flame_barrier = Umgib dich mit einer Barriere aus Flammen, die deine Verteidigung verbessert \
  und nahe Ziele verbrennt.

m.high_heat = Gro\u00dfe Hitze
d.high_heat = Erh\u00f6ht die offensive St\u00e4rke der Flammenbarriere.

m.heavy_smoke = Dichter Rauch
d.heavy_smoke = Erh\u00f6ht die defensive St\u00e4rke und Dauer der Flammenbarriere.

m.scorching_barrier = Brennende Barriere
d.scorching_barrier = Erh\u00f6ht die Zahl der kreisenden Feuerb\u00e4lle und deren Gr\u00f6\u00dfe.

m.backfire_barrier = R\u00fcckschlags-Barriere
d.backfire_barrier = Erhalte eine kurzzeitige Erh\u00f6hung der Bewegungsgeschwindigkeit, wenn \
  du Flammenbarriere ausf\u00fchrst.

m.firestorm = Feuersturm
d.firestorm = Beschw\u00f6re die Macht eines wahren Drachen und verbrenne alles, was dir im Weg \
  steht.

m.five_alarm = Alarmstufe 3
d.five_alarm = Erh\u00f6ht Dauer und Gr\u00f6\u00dfe des Feuersturms

m.frenzied_firestorm = Rasender Feuersturm
d.frenzied_firestorm = F\u00fcr jedes von der Feuersbrunst erfasste Monster, bekommen du und \
  dein Gruppenmitglieder die Chance auf einen Bonus auf Angriffskraft und Geschwindigkeit.

m.explosive_firestorm = Explosiver Feuersturm
d.explosive_firestorm = Wenn man den Feuersturm freisetzt, wird eine Reihe von Explosionen \
  ausgel\u00f6st.

# Seraphynx Skills and Augments

m.ray_of_light = Lichtstrahl
d.ray_of_light = Schie\u00dft einen durchgehenden Lichtstrahl ab, der allem Schaden zuf\u00fcgt, was ihn kreuzt.

m.magnify = Vergr\u00f6\u00dfern
d.magnify = Erh\u00f6ht Reichweite und St\u00e4rke des Lichtstrahls.

m.enduring_light = Dauerhaftes Licht
d.enduring_light = Erh\u00f6ht die Dauer des Lichtstrahls.

m.dazzling_light_ray = Blendender Lichtstrahl
d.dazzling_light_ray = Der Lichstrahl verursacht bei Monstern der Untoten- und D\u00e4monen-Familie zus\u00e4tzlichen Schaden.

m.disintegration_ray = Desintegrations-Strahl
d.disintegration_ray = Der Lichtstrahl verringert zus\u00e4tzlich die Verteidigung seiner \
  Ziele.

m.heart_attack = Herzattacke
d.heart_attack = Verzaubert eine Gruppe von Zielen. Ziele die zerst\u00f6rt werden, w\u00e4\
  hrend sie verzaubert sind, haben eine gr\u00f6\u00dfere Chance, heilende Herzen zu \
  hinterlassen.

m.extra_hearty = Ganz Herzlich
d.extra_hearty = Erh\u00f6ht die Chance auf Herzen und die Dauer der Verzauberung.

m.wide_embrace = Gro\u00dfe Umarmung
d.wide_embrace = Vergr\u00f6\u00dfert das vom Effekt von Herzattacke betroffene Gebiet

m.iron_heart_attack = Eiserne Herzattacke
d.iron_heart_attack = Ziele die zerst\u00f6rt werden w\u00e4hrend sie verzaubert sind k\u00f6\
  nnen Defense Orbs hinterlassen.

m.violent_heart_attack = Brutale Herzattacke
d.violent_heart_attack = Ziele die zerst\u00f6rt werden, w\u00e4hrend sie verzaubert sind, \
  verursachen eine Explosion.

m.angelic_aura = Engelsaura
d.angelic_aura = Erzeugt eine sch\u00fctzende Aura um dich herum, die auch andere \
  Gruppenmitglieder, die sich darunter befinden, sch\u00fctzt.

m.protection = Schutz
d.protection = Erh\u00f6ht die defensiven Kr\u00e4fte der Engelsaura.

m.cover = Deckung
d.cover = Erh\u00f6ht die Gr\u00f6\u00dfe und Dauer der Engelsaura.

m.seraphic_aura = Aura der Seraph
d.seraphic_aura = Gruppenmitglieder innerhalb der sch\u00fctzenden Aura erhalten erh\u00f6hte Schildregeneration.

m.valkyrian_aura = Aura der Walk\u00fcren
d.valkyrian_aura = Gruppenmitglieder innerhalb der sch\u00fctzenden Aura erhalten einen \
  Ladezeit-Bonus.


# Maskeraith Skills and Augments

m.caustic_quills = \u00c4tzende Stacheln
d.caustic_quills = Feuert eine Reihe Stacheln ab, die im ziel steckenbleiben und Gift abgeben. \
  F\u00fcr jeden Treffer, den ein mit Stacheln versehenes Ziel erh\u00e4lt, verliert das Ziel \
  einen Stachel und erh\u00e4lt zus\u00e4tzlichen Schaden.

m.venom = Gift
d.venom = Erh\u00f6ht die St\u00e4rke des Gifts.

m.bristle = Aufgestachelt
d.bristle = Vergr\u00f6\u00dfert die Zahl der abgefeuerten Stacheln und die Zeitspanne, wie \
  lange sie stecken bleiben.

m.vengeful_quills = R\u00e4chende Stacheln
d.vengeful_quills = Immer wenn ein mit Stacheln versehenes Ziel getroffen wird, wird ein \
  Stachel vom Ziel auf das n\u00e4chste verf\u00fcgbare Ziel abgefeuert.

m.virulent_quills = Ansteckende Stacheln
d.virulent_quills = Immer wenn ein mit Stacheln versehenes Ziel getroffen wird, besteht die \
  Chance, dass eine giftige Explosion ausgel\u00f6st wird.

m.shadow_cloak = Schattenmantel
d.shadow_cloak = Verleiht dir teilweise Unsichtbarkeit und verbesserte Verteidigung f\u00fcr \
  eine begrenzte Zeit. Schattenmantel wird unterbrochen, wenn du Schaden erleidest, angreifst \
  oder andere Aktionen ausf\u00fchrst.

m.dark_veil = Dunkler Schleier
d.dark_veil = Erh\u00f6ht die defensive St\u00e4rke von Schattenmantel.

m.enduring_night = Andauernde Nacht
d.enduring_night = Erh\u00f6ht die Dauer von Schattenmantel.

m.deadly_shadow_cloak = T\u00f6dlicher Schattenmantel
d.deadly_shadow_cloak = Erhalte eine Erh\u00f6hung von Angriffsgeschwindigkeit und \
  Angriffskraft w\u00e4hrend Schattenmantel aktiv ist. Dieser bonus bleibt f\u00fcr kurze Zeit \
  aktiv, nachdem Schattenmantel beendet ist.

m.vengeful_shadow_cloak = R\u00e4chender Schattenmantel
d.vengeful_shadow_cloak = Erzeugt ein explosives St\u00f6rfeld um dich herum, wenn \
  Schattenmantel unterbrochen wird, das eine chance hat, Ziele zu bet\u00e4uben.

m.hexing_haze = Verfluchender Nebel
d.hexing_haze = Erzeugt eine Wolke um dich herum, die jedes Ziel darin verflucht. Jeder Fluch \
  hat einen Countdown, der bei seinem Ablauf bei seinem Ziel Schaden verursacht. F\u00fcr jedes \
  Opfer des Nebels verl\u00e4ngert sich die Lebensdauer der Wolke.

m.no_mercy = Keine Gnade
d.no_mercy = Erh\u00f6ht den Schaden den Verfluchender Nebel verursacht.

m.plentiful_pain = Gro\u00dfe Pein
d.plentiful_pain = Erh\u00f6ht die zus\u00e4tzliche Dauer von Verfluchender Nebel, wenn zus\u00e4\
  tzliche Ziele gefunden werden

m.haunted_haze = Nebel der Heimsuchung
d.haunted_haze = Jedes Ziel, das in Folge des Schadens durch Verfluchender Nebel stirbt, wird \
  einen rachedurstigen Geist heraufbeschw\u00f6ren, der andere Ziele heimsucht und bei \
  Einschlag explodiert.

m.chaotic_haze = Chaotischer Nebel
d.chaotic_haze = Ziele, die von Verfluchender Nebel Schaden erhalten, haben eine Chance von \
  einem zuf\u00e4lligen Stauseffekt betroffen zu werden.


