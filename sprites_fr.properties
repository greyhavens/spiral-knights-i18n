#
# Battle Sprite translation messages

# Sprites
d.drakon = Le drakon est un sprite de bataille qui red\u00e9finit la destruction en feu. Ses \
  comp\u00e9tences sont concentr\u00e9es sur l'assaut direct.

d.seraphynx = Le seraphynx est un sprite de bataille qui est l'incarnation de protection et la \
  restauration. Ses comp\u00e9tences sont concentr\u00e9es sur le soutien de chevaliers au \
  combat.

d.maskeraith = Le maskeraith est un sprite de bataille de la tromperie et d\u00e9bilitation. Les comp\u00e9tences sont concentr\u00e9es sur le subterfuge.



