m.focus = Concentration
d.focus = R\u00e9duit le temps d'attente de comp\u00e9tence.

m.skill = Comp\u00e9tence
m.skill_power = Puissance de comp\u00e9tence

# Drakon Skills and Augments

m.firebolt = \u00c9clat de feu
d.firebolt = Lance une ardente balle de feu explosant sur contact.

d.impact = Augmente la dommage d'\u00e9clat de feu.

m.extra_crispy = Extra croustillant
d.extra_crispy = Augmente la force du feu et aussi la chance de br\u00fbler les cibles.

m.concussive_firebolt = \u00c9clat de feu violent
d.concussive_firebolt = Donne une chance d'infliger un fort \u00e9tourdissement apr\u00e8s l'\u00e9clat.

m.meteoric_firebolt = \u00c9clat de feu m\u00e9t\u00e9orique
d.meteoric_firebol = Agrandit la superficie de l'explosion d'\u00e9clat de feu.

m.flame_barrier = Barri\u00e8re de feu
d.flame_barrier = Encerclez-vous avec une barri\u00e8re de flammes qui rehausse vos d\u00e9fenses et br\u00fb\
  le les cibles en proximit\u00e9.

m.high_heat = Feu vif
d.high_heat = Augmente la puissance d'attaque de la barri\u00e8re de feu.

m.heavy_smoke = Fum\u00e9e forte
d.heavy_smoke = Augmente la puissance de d\u00e9fense et la dur\u00e9e de la barri\u00e8re de feu.

m.scorching_barrier = Barri\u00e8re br\u00fblant
d.scorching_barrier = Augmente le nombre de balles de feu et agrandit leur grandeur.

m.backfire_barrier = Barri\u00e8re contre-feu
d.backfire_barrier = Gagnez un boost de vitesse de d\u00e9placement temporaire apr\u00e8s l'ex\u00e9cution de la barri\u00e8re.

m.firestorm = Tourmente de feu
d.firestorm = Invoquez la puissance de feu de dragon pour br\u00fbler tout ceux qui vous \
  oppose.

m.five_alarm = Sonnette
d.five_alarm = Augmente la dur\u00e9e et la taille de la tourmente de feu.

m.frenzied_firestorm = Tourmente de feu forcen\u00e9
d.frenzied_firestorm = Pour chaque monstre attrap\u00e9e dans les flammes, vous et votre groupe \
  auront une chance de recevoir un bonus d'attaque et vitesse.

m.explosive_firestorm = Tourmente de feu explosive
d.explosive_firestorm = Cr\u00e9e une s\u00e9rie d'explosions en d\u00e9cha\u00eenant la \
  tourmente de feu.

# Seraphynx Skills and Augments

m.ray_of_light = Rayon lumineux
d.ray_of_light = Tire un faisceau de lumi\u00e8re concentr\u00e9e qui endommage tout sur la \
  ligne d'attaque.

m.magnify = Magnifier
d.magnify = Augmente la port\u00e9e et la puissance du rayon lumineux.

m.enduring_light = Lumi\u00e8re subissant
d.enduring_light = Augmente la dur\u00e9e du rayon lumineux.

m.dazzling_light_ray = \u00c9blouissant rayon lumineux
d.dazzling_light_ray = Le rayon lumineux fait plus de dommage envers les familles mort-vivants \
  et d\u00e9mons.

m.disintegration_ray = Rayon de disint\u00e9gration
d.disintegration_ray = Le rayon lumineux r\u00e9duit aussi la d\u00e9fense de ces cibles.

m.heart_attack = Coup de foudre
d.heart_attack = Enchante une groupe de cibles. Si elles sont tu\u00e9es pendant l'\u00e9\
  nchantement, la chance d'obtenir les c\u0153urs laiss\u00e9es par les monstres sera augment\u00e9e.

m.extra_hearty = Plus d'amour
d.extra_hearty = Augmente la chance d'obtenir des c\u0153urs tombants des monstres et la dur\u00e9e de l'enchantement.

m.wide_embrace = Grande \u00e9treinte
d.wide_embrace = Augmente la superficie d'effet.

m.iron_heart_attack = Coup de foudre en fer
d.iron_heart_attack = Les cibles d\u00e9truites pendant qu'elles sont enchant\u00e9es \
  laisseront des globes de d\u00e9fense.

m.violent_heart_attack = Coup de foudre violent
d.violent_heart_attack = Les cibles d\u00e9truites pendant qu'elles sont enchant\u00e9es cr\u00e9eront une explosion.

m.angelic_aura = Aura ang\u00e9lique
d.angelic_aura = Cr\u00e9e un aura de protection autour le joueur et ses camarades dans l'aura.

d.protection = Augmente la puissance d\u00e9fensive de l'aura ang\u00e9lique.

m.cover = Couverture
d.cover = Augmente la dur\u00e9e et la superficie de l'aura ang\u00e9lique.

m.seraphic_aura = Aura seraphique
d.seraphic_aura = Les membres de groupe dans l'aura gagneront une r\u00e9g\u00e9n\u00e9ration \
  de bouclier augment\u00e9e.

m.valkyrian_aura = Aura valkyrien
d.valkyrian_aura = Les membres de groupe dans l'aura gagneront une bonus de charge rapide.


# Maskeraith Skills and Augments

m.caustic_quills = Piquants caustiques
d.caustic_quills = Tire des piques qui se l\u00e2chent sur les cibles et les empoisonnent. \
  Chaque fois la cible est attaqu\u00e9e, elle perdra un piquant et prendra des d\u00e9g\u00e2ts additionnels.

m.venom = Venin
d.venom = Augmente la puissance de poison.

m.bristle = Poil
d.bristle = Augmente le nombre de piquants tir\u00e9s et la dur\u00e9e.

m.vengeful_quills = Piquants vindicatifs
d.vengeful_quills = Chaque fois la cible piqu\u00e9e est frapp\u00e9e, un autre piquant est tir\u00e9 \
  vers la prochaine cible disponible.

m.virulent_quills = Piquants virulents
d.virulent_quills = Chaque fois la cible piqu\u00e9e est frapp\u00e9e, il y aura une chance de \
  d\u00e9clencher une explosion toxique.

m.shadow_cloak = Cape d'obscurit\u00e9
d.shadow_cloak = La cape vous donne l'invisibilit\u00e9 partielle et un boost de d\u00e9fense pour une dur\u00e9e limit\u00e9e. La cape d'obscurit\u00e9 \
  sera nulle si le joueur prend des d\u00e9g\u00e2ts, attaque des monstres, ou fait n'importe \
  quelle action.

m.dark_veil = Voile fonc\u00e9
d.dark_veil = Augmente le boost de d\u00e9fense de la cape d'obscurit\u00e9.

m.enduring_night = Soir\u00e9e subissant
d.enduring_night = Augmente la dur\u00e9e de la cape d'obscurit\u00e9.

m.deadly_shadow_cloak = Cape d'obscurit\u00e9 mortelle
d.deadly_shadow_cloak = Gagnerez un bonus de puissance et vitesse d'attaque en activant la cape \
  d'obscurit\u00e9. Le bonus persistera pour une dur\u00e9e limit\u00e9e apr\u00e8s \
  l'expiration de la cape.

m.vengeful_shadow_cloak = Cape d'obscurit\u00e9 vindicative
d.vengeful_shadow_cloak = Cr\u00e9e une explosion de perturbation autour de vous quand la cape \
  d'obscuriti\u00e9 est interrompue. L'explosion a une chance d'\u00e9tourdir les cibles.

m.hexing_haze = Nuage de sortil\u00e8ge
d.hexing_haze = Cr\u00e9e un miasme autour de vous, ensorcelant les cibles dans le miasme. \
  Chaque sort a un compteur endommageant ses cibles lorsque le compteur se termine. Pour chaque \
  cible affect\u00e9 par le nuage de sortil\u00e8ge, la dur\u00e9e du nuage augmentera.

m.no_mercy = Aucun piti\u00e9
d.no_mercy = Augmente la dommage inflig\u00e9e par le nuage de sortil\u00e8ge.

m.plentiful_pain = Beaucoup de douleur
d.plentiful_pain = La dur\u00e9e bonus de nuage de sortil\u00e8ge sera augment\u00e9e lorsque \
  plus les cibles sont attrap\u00e9s.

m.haunted_haze = Nuage hant\u00e9
d.haunted_haze = Une cible qui meurt en raison de la dommage caus\u00e9 par le nuage de sortil\u00e8ge pondront un fant\u00f4\
  me, lequel cherchera pour des autres cibles et s'explosera sur contact.

m.chaotic_haze = Nuage chaotique
d.chaotic_haze = Les cibles endommag\u00e9es par le nuage de sortil\u00e8ge ont une chance de \
  recevoir, au hasard, un \u00e9tat de condition.


