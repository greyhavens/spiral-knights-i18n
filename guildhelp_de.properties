t.hall = Gildenhalle
t.guild_hall_header = Gildenhalle
m.guild_hall_info = Die Gildenhalle ist das Zentrum jeder Spiral Knights Gilde. Hier k\u00f6\
  nnen sich die Gildenmitglieder entspannen, zuk\u00fcnftige Missionen planen und die \
  zahlreichen Vorz\u00fcge genie\u00dfen, die ihnen die Gildenhalle bietet. Die Gildenhalle ist \u00e4usserst wandlungsf\u00e4\
  hig und kann erweitert werden, um f\u00fcr Gilden jeder Gr\u00f6\u00dfe alles Passende zu \
  bieten. Sie kann auch eine gro\u00dfe Auswahl an einmaligen M\u00f6beln und Raum-Arten \
  enthalten, also sprich dich mit deinen Freunden ab, um deine Gildenhalle zu einer w\u00fc\
  rdigen Darstellung deiner Gilde zu machen!\n\
  Wenn eine Gildenhalle zu Anfang er\u00f6ffnet wird, dann besteht sie aus zwei R\u00e4umen: \
  einer Lobby und dem Kommando-Konsolen-Raum. Gilden, die mehr Platz zum Einrichten w\u00fcnschen, k\u00f6\
  nnen Erweiterungen kaufen, um ihre Gildenhalle zu vergr\u00f6\u00dfern. Die Erweiterungen \
  sind \u00fcber die Kommando-Konsole verf\u00fcgbar, w\u00e4hrend man im Design-Modus ist.\n\
  Gilden, die den nutzbaren Raum in ihrer Gildenhalle vergr\u00f6\u00dfert haben, k\u00f6nnen den zus\u00e4\
  tzlichen Platz mit einer Reihe unterschiedlicher R\u00e4ume belegen, die vom Birdsong \
  Emporium gekauft werden k\u00f6nnen. Diese R\u00e4ume k\u00f6nnen ganz einfach sein, wie ein \
  leerer Raum zum M\u00f6bel aufstellen oder sie k\u00f6nnen eine von zahlreichen \
  Annehmlichkeiten f\u00fcr die Gilde beinhalten, wie Alchemie-Stationen, L\u00e4den und mehr!\n\
  Gildenhallen ben\u00f6tigen eine gro\u00dfe Zahl an Ressourcen, um erhalten zu werden, was \
  durch w\u00f6chentlich f\u00e4llige Unterhaltskosten in Crowns ersichtlich ist. Wenn eine \
  Gildenhalle mehr R\u00e4ume und Erweiterungen erh\u00e4lt, dann steigen auch die \
  Unterhaltskosten, also stellt sicher, dass immer genug Crowns in der Gilden-Schatzkammer \
  sind, um f\u00fcr alles zu zahlen!

t.treasury = Schatzkammer
t.treasury_header = Gilden-Schatzkammer
m.treasury_info = Die Gilden-Schatzkammer enth\u00e4lt all die Gegenst\u00e4nde und Crowns, die \
  der Gilde insgesamt geh\u00f6ren. Um M\u00f6bel in der Gildenhalle aufstellen zu k\u00f6nnen, m\u00fcssen sie zun\u00e4\
  chst in der Schatzkammer deponiert werden. Die Kosten neuer R\u00e4ume, f\u00fcr Gegenst\u00e4\
  nde vom Birdsong Emporium und die w\u00f6chentlichen Unterhaltskosten werden ebenfalls aus \
  der Gilden-Schatzkammer bezahlt, so dass Gildenmitglieder darauf achten m\u00fcssen, dass immer gen\u00fc\
  gend Crowns in der Schatzkammer sind!\n\
  WARNUNG: Alles, was in der Gildenschatzkammer deponiert wird, kann nie mehr entfernt werden, \
  nicht einmal vom Gildenmeister. Gegenst\u00e4nde und Crowns, die in der Gilden-Schatzkammer \
  deponiert werden, sind f\u00fcr immer Eigentum der Gilde. Es gibt keine Ausnahmen.
l.treasury_console = Auf die Gilden-Schatzkammer kann man \u00fcber die Kommandokonsole \
  zugreifen. | action | console

m.emporium_info = Das Birdsong Emporium erlaubt es hochrangigen Gildenmitgliedern, Gegenst\u00e4nde f\u00fc\
  r die Gilde mit Geld aus der Gilden-Schatzkammer zu kaufen. Diese Gegenst\u00e4nde umfassen M\u00f6bel f\u00fc\
  r die Gildenhalle sowie verschiedene Erweiterungen. Die gekauften Gegend\u00e4nde lande \
  direkt in der Gilden-Schatzkammer und k\u00f6nnen somit niemals aus der Gilde entfernt \
  werden.\n\
  M\u00f6bel gibt es in verschiedenen Gr\u00f6\u00dfen und Formen, und sie k\u00f6nnen benutzt \
  werden, um die R\u00e4ume und G\u00e4nge der Gildenhalle zu dekorieren und gem\u00fctlicher \
  zu machen. Einige M\u00f6bel haben besondere Effekte, wenn sie aktiviert werden! Alle M\u00f6\
  bel in der Gilden-Schatzkammer k\u00f6nnen im Designmodus in der Gildenhalle platziert \
  werden.\n\
  Das Birdsong Emporium ist auch, wo man Erweiterungen kauft, um die maximale Mitgliederzahl f\u00fcr seine Gilde zu erh\u00f6hen.\n \
  Vom Birdsong Emporium kannst du auch neue R\u00e4ume kaufen, um freien Platz zu f\u00fcllen oder bestehende R\u00e4\
  ume durch andere zu ersetzen. Die Auswahl an R\u00e4umen wird um so gr\u00f6\u00dfer, je \
  weiter die Gildenhalle ausgebaut wird. Schaue \u00f6fter mal nach, was Neues gibt!
l.emporium_console = Auf das Bridsong Emporium und der Design-Modus kann von der \
  Kommando-Konsole aus zugegriffen werden. | action | console

t.storage = Lager
t.storage_header = Gildenlager
m.storage_info = Das Gildenlager funktioniert wie ein geteiltes Arsenal. Gildenmitglieder \
  hinreichenden Rangs k\u00f6nnen Ausr\u00fcstung und Gegenst\u00e4nde im Lager deponieren oder \
  daraus entnehmen. Das ist der perfekte Weg, Resourcen mit Gildenmitgliedern zu teilen oder \
  neueren Mitgliedern zu helfen.\n\
  WARNUNG: Gegenst\u00e4nde im Gildenlager k\u00f6nnen von jedem Mitglied mit Zugang entnommen \
  werden. Lagere keine Gegenst\u00e4nde dort, die du f\u00fcr dich selbst behalten willst!
l.storage_console = Aufs Gildenlager kann \u00fcber die Kommandokonsole zugegriffen werden | \
  action | console

t.design = Designmodus
t.design_header = Designmodus
m.design_info = Im Designmodus kann ein Gildenmitglied hinreichenden Rangs M\u00f6bel und \
  andere Infrastruktur in der Gildenhalle neu arrangieren. Wenn man im Designmodus ist, k\u00f6nnen M\u00f6\
  bel aufgehoben und wieder abgestellt werden, ganz \u00e4hnlich goldenen Schl\u00fcsseln oder \
  Statuen im Uhrwerk, und mit dem Mausrad lassen sie sich drehen. Wenn die \u00c4nderungen gefallen, k\u00f6\
  nnen sie an der Kommandokonsole ver\u00f6ffentlicht und so f\u00fcr den Rest der Gilde \
  sichtbar gemacht werden.
u.design_wiki = Eine vollst\u00e4ndige Liste verf\u00fcgbarer M\u00f6bel findet sich in unserem \
  offiziellen Wiki. | URL | http://wiki.spiralknights.com/de/Furniture
l.design_console = Designmodus kann \u00fcber die Kommandokonsole aktiviert werden. | action | \
  console

t.record = Gildenaufzeichnungen
t.record_header = Gildenaufzeichnungen
m.record_info = Die Gildenaufzeichnungen vermerken wichtige Aktivit\u00e4ten der letzten Zeit \
  in der Gilde , wie beispielsweise Spenden an die Gildenschatzkammer, Zugriffe auf die \
  Gildenlager, Bef\u00f6rderungen oder Hinzkommen oder Abgang von Gildenmitgliedern. Dadurch k\u00f6nnen Gildenmitglieder h\u00f6\
  heren Rangs verfolgen, wer viel spendet oder von der Gilde nimmt, und entsprechend handeln.
l.record_console = The Guild Record can be accessed from the Command Console. | action | \
  console\n\
  Die Gildenaufzeichnungen kann man \u00fcber die Kommandokonsole erreiche | action | console
